[gcode_macro TTS_PRINT_START_PREPRINT]
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
    {% set PRINTER_NAME = globals.printer_name %}
    {% set PRINTER_SPOKEN_NAME = globals.printer_name_audio %}
    {% set MATERIAL = globals.material %}

    {% if MATERIAL == 'PLA' %}
        {% set MATERIAL_SPOKEN_NAME = 'Pee el ayy' %}
    {% elif MATERIAL == 'PETG' %}
        {% set MATERIAL_SPOKEN_NAME = 'Pee Eee Tee Gee' %}
    {% elif MATERIAL == 'TPU' %}
        {% set MATERIAL_SPOKEN_NAME = 'Tee Pee You' %}
    {% elif MATERIAL == 'ABS' %}
        {% set MATERIAL_SPOKEN_NAME = 'Ayy Bee Ess' %}
    {% elif MATERIAL == 'ASA' %}
        {% set MATERIAL_SPOKEN_NAME = 'Ayy Ess Ayy' %}
    {% elif MATERIAL == 'PC' %}
        {% set MATERIAL_SPOKEN_NAME = 'Polycarbonate' %}
    {% else %}
        {% set MATERIAL_SPOKEN_NAME = 'Unknown Material' %}
    {% endif %}
    
    M118 {MATERIAL} print started on the {PRINTER_NAME}
    TTS_BG MSG="{MATERIAL_SPOKEN_NAME} print started on the {PRINTER_SPOKEN_NAME}"