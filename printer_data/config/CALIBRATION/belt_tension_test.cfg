[gcode_macro BELT_TENSION_TEST_Z]
description: Move the belt up and down then to center for belt tension test
gcode:


    {% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
    {% set TOP = params.TOP|default(globals.belt_check_top_z)|int %}
    {% set BOT = params.BOT|default(globals.belt_check_bottom_z)|int %}
    {% set MID = params.BOT|default(globals.belt_check_middle_z)|int %}
    
    ABSOLUTE
    G1 Z{TOP}
    G1 Z{BOT}
    G1 Z{TOP}
    G1 Z{BOT}
    G1 Z{MID}
    RELATIVE
    G1 Z+5
    G1 Z-10
    G1 Z+10
    G1 Z-10
    G1 Z+5
    G1 Z-2
    G1 Z+4
    G1 Z-4
    G1 Z+2
    G1 Z-2
    ABSOLUTE
