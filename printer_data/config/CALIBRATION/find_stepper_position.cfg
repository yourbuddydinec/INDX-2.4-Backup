[gcode_macro FIND_STEPPER_POSITION]
description: Jog to a known position, then run this to get corrected stepper config values
gcode:
    {% set axis = params.AXIS|default('x')|lower %}
    {% set desired = params.DESIRED|default(0)|float %}

    {% if axis == 'x' %}
        {% set current = printer.toolhead.position.x %}
        {% set pmin = printer.configfile.config.stepper_x.position_min|float %}
        {% set pstop = printer.configfile.config.stepper_x.position_endstop|float %}
        {% set pmax = printer.configfile.config.stepper_x.position_max|float %}
    {% elif axis == 'y' %}
        {% set current = printer.toolhead.position.y %}
        {% set pmin = printer.configfile.config.stepper_y.position_min|float %}
        {% set pstop = printer.configfile.config.stepper_y.position_endstop|float %}
        {% set pmax = printer.configfile.config.stepper_y.position_max|float %}
    {% elif axis == 'z' %}
        {% set current = printer.toolhead.position.z %}
        {% set pmin = printer.configfile.config.stepper_z.position_min|float %}
        {% set pstop = printer.configfile.config.stepper_z.position_endstop|float %}
        {% set pmax = printer.configfile.config.stepper_z.position_max|float %}
    {% else %}
        RESPOND TYPE=error MSG="Invalid axis '{axis}'. Use AXIS=x, y, or z"
        {% set current = 0 %}
    {% endif %}

    {% if current != 0 or axis in ['x','y','z'] %}
        {% set offset = desired - current %}
        RESPOND MSG="=== FIND_STEPPER_STATS: {axis|upper} axis ==="
        RESPOND MSG="Current reported position : {current}"
        RESPOND MSG="Desired position          : {desired}"
        RESPOND MSG="Offset applied            : {offset}"
        RESPOND MSG="---"
        RESPOND MSG="New position_min      : {(pmin + offset)|round(3)} (Ignore if min was changed to use macro)"
        RESPOND MSG="New position_endstop  : {(pstop + offset)|round(3)}"
        RESPOND MSG="New position_max      : {(pmax + offset)|round(3)}"
    {% endif %}