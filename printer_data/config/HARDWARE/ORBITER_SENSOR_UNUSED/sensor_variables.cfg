[gcode_macro _SENSOR_VARIABLES]         # change here macro configurables, enable disable functions!*************************
variable_filament_load_temp     :235    # temperature to heat up hotend for filament loading, default is 235
variable_filament_unload_temp   :210    # temperature to heat up hotend for filament un-loading, default is 185
variable_filament_load_min_temp :190    # minimum hotend set temperature allowed in filament load macro, default is 190
variable_nozzle_purge_length    :100    # filament extrude amount during load sequenc, hotend purge from old filament, default is 200
variable_nozzle_purge_speed     :450    # filament extrude speed in mm/min adjust this value lower if flow is too high and extruder skips during loading, default is 300
variable_unload_distance        :65     # filament retract distance for unload procedure. this length shall be long enough to extract the filament above the drive gears
variable_disable_autoload       :False  # disable filament autoload feature by setting this variable True
variable_disable_runnout        :False  # disable runnout by setting this variable True
variable_disable_autochange     :False  # disable filament auto change after runnout detection
variable_disable_tangle         :True  # disable tangle by setting this variable True
variable_disable_autounload     :False  # disable auto unload filament by setting this variable to True
variable_enable_beep            :True   # uses M300 sound feature, set it True to enable
variable_park_position_x        :10     # edit your X parking position here for pause macro trigerred by runnout
variable_park_position_y        :10     # edit your Y parking position here for pause macro trigerred by runnout
variable_park_lift_z            :10     # edit your Z lift amount for parking position here, default is 10
variable_park_retraction        :1      # edit your retraction amount for parking, default is 1
variable_resume_detraction      :3      # detraction on resume
variable_purge_on_resume        :0      # do you want to purge when you resume?
variable_purge_on_resume_amount :30     # how much do you want to purge if purge_on_resume is enabled?
gcode:
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=filament_load_temp VALUE={printer["gcode_macro GLOBALS"].orbiter_load_temp}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=filament_unload_temp VALUE={printer["gcode_macro GLOBALS"].orbiter_unload_temp}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=filament_load_min_temp VALUE={printer["gcode_macro GLOBALS"].orbiter_load_min_temp}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=nozzle_purge_length VALUE={printer["gcode_macro GLOBALS"].orbiter_extruder_to_nozzle + printer["gcode_macro GLOBALS"].orbiter_load_extra}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=nozzle_purge_speed VALUE={printer["gcode_macro GLOBALS"].orbiter_load_spd}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=unload_distance VALUE={printer["gcode_macro GLOBALS"].orbiter_extruder_to_nozzle + printer["gcode_macro GLOBALS"].orbiter_unload_extra}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_autoload VALUE={printer["gcode_macro GLOBALS"].orbiter_disable_autoload}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_runnout VALUE={printer["gcode_macro GLOBALS"].orbiter_disable_runnout}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=disable_autounload VALUE={printer["gcode_macro GLOBALS"].orbiter_disable_autounload}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=enable_beep VALUE={printer["gcode_macro GLOBALS"].orbiter_enable_beep}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=park_position_x VALUE={printer["gcode_macro GLOBALS"].park_x_pos}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=park_position_y VALUE={printer["gcode_macro GLOBALS"].park_y_pos}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=park_lift_z VALUE={printer["gcode_macro GLOBALS"].park_lift_z}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=park_retraction VALUE={printer["gcode_macro GLOBALS"].orbiter_park_retraction}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=resume_detraction VALUE={printer["gcode_macro GLOBALS"].orbiter_resume_detraction}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=purge_on_resume VALUE={printer["gcode_macro GLOBALS"].purge_on_resume}
  SET_GCODE_VARIABLE MACRO=_SENSOR_VARIABLES VARIABLE=purge_on_resume_amount VALUE={printer["gcode_macro GLOBALS"].purge_on_resume_amount}

  {% if 'CHECK' in params|upper %}
     M118 Variable filament_load_temp={printer["gcode_macro _SENSOR_VARIABLES"].filament_load_temp}
     M118 Variable filament_unload_temp={printer["gcode_macro _SENSOR_VARIABLES"].filament_unload_temp}
     M118 Variable filament_load_min_temp={printer["gcode_macro _SENSOR_VARIABLES"].filament_load_min_temp}
     M118 Variable nozzle_purge_length={printer["gcode_macro _SENSOR_VARIABLES"].nozzle_purge_length}
     M118 Variable nozzle_purge_speed={printer["gcode_macro _SENSOR_VARIABLES"].nozzle_purge_speed}
     M118 Variable unload_distance={printer["gcode_macro _SENSOR_VARIABLES"].unload_distance}
     M118 Variable disable_autoload={printer["gcode_macro _SENSOR_VARIABLES"].disable_autoload}
     M118 Variable disable_runnout={printer["gcode_macro _SENSOR_VARIABLES"].disable_runnout}
     M118 Variable disable_autounload={printer["gcode_macro _SENSOR_VARIABLES"].disable_autounload}
     M118 Variable enable_beep={printer["gcode_macro _SENSOR_VARIABLES"].enable_beep}
     M118 Variable park_position_x={printer["gcode_macro _SENSOR_VARIABLES"].park_position_x}
     M118 Variable park_position_y={printer["gcode_macro _SENSOR_VARIABLES"].park_position_y}
     M118 Variable park_lift_z={printer["gcode_macro _SENSOR_VARIABLES"].park_lift_z}
     M118 Variable park_retraction={printer["gcode_macro _SENSOR_VARIABLES"].park_retraction}
     M118 Variable park_retraction={printer["gcode_macro _SENSOR_VARIABLES"].resume_detraction}
     M118 Variable purge_on_resume={printer["gcode_macro _SENSOR_VARIABLES"].purge_on_resume}
     M118 Variable purge_on_resume_amount={printer["gcode_macro _SENSOR_VARIABLES"].purge_on_resume_amount}
  {% else %}
    M118 !!!ORBITER SENSOR VARIABLES SET BUT HIDDEN!!!   
  {% endif %}

