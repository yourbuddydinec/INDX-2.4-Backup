[filament_switch_sensor O2_sensor]
switch_pin: EBBCan: PA7
pause_on_runout: False
runout_gcode: runnout_init
insert_gcode: filament_load_init
event_delay: 1.0
pause_delay: 0.1

[gcode_button filament_unload]
pin: EBBCan: PA6 # remove the negation "!" for sensor v1 - use just PA9 as example
press_gcode:  # filament unload procedure   
  unload_tangle_init
release_gcode: # do not add any macro call here

[respond]
default_type: echo

[force_move]
enable_force_move: True


