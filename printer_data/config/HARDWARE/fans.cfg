#####################################################################
#   Fan Control
#####################################################################
# ##  Assign 2 fans to one "pin"
# [multi_pin part_cooling_fan]
# pins: EBBCan:PD3, EBBCan:PA5


# ##  Print Cooling Fan - FAN0
# [fan]
# pin: multi_pin:part_cooling_fan
# kick_start_time: 0.5
# ##  Depending on your fan, you may need to increase this value
# ##  if your fan will not start. Can change cycle_time (increase)
# ##  if your fan is not able to slow down effectively
# # off_below: 0.10


# ##  Print Cooling Fan - FAN1
# [fan]
# pin: EBBCan:PA5
# kick_start_time: 0.5
# ##  Depending on your fan, you may need to increase this value
# ##  if your fan will not start. Can change cycle_time (increase)
# ##  if your fan is not able to slow down effectively
# off_below: 0.10


# ##  Hotend Fan - FAN2
# [heater_fan hotend_fan]
# pin: EBBCan:PD2
# tachometer_pin: EBBCan:PA4
# max_power: 1.0
# kick_start_time: 0.5
# heater: extruder
# heater_temp: 50.0
# ##  If you are experiencing back flow, you can reduce fan_speed
# #fan_speed: 1.0

##  SSR Cooling fan - FAN2
[fan_generic ssr_fan] 
pin: PA8
kick_start_time: 0.5
max_power: 1

##  Controller fan
[controller_fan electronics_fans]
pin: PE5
kick_start_time: 0.5
heater: heater_bed

##  Bed Fans
[fan_generic bed_fans]
pin: PD13
kick_start_time: 0.5
max_power: 1

##  Nevermore Fan
[fan_generic ssr_fan] 
pin: PA8
kick_start_time: 0.5
max_power: 1

