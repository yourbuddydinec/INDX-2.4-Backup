[gcode_macro LED_STOP]
gcode:
  STOP_LED_EFFECTS

[led_effect frame_led_spotlight]
autostart:              true
frame_rate:             24
leds:
  neopixel:rainbowstick_top
layers:
  static  1 1 top (1.0, 1.0, 1.0, 1.0)

[gcode_macro LED_FRAME_SPOTLIGHT]
gcode:
  STOP_LED_EFFECTS
  SET_LED_EFFECT EFFECT=frame_led_spotlight

