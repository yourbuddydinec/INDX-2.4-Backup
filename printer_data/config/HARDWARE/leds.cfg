##############
# The Macros #
##############

[gcode_macro LED_SET_LOGO_LEDS_ON]
gcode:
    SET_LED_EFFECT EFFECT=set_logo_leds

[gcode_macro LED_SET_LOGO_LEDS_OFF]
gcode:
    SET_LED_EFFECT EFFECT=set_logo_leds STOP=1

[gcode_macro LED_SET_NOZZLE_LEDS_ON]
gcode:
    SET_LED_EFFECT EFFECT=set_nozzle_leds

[gcode_macro LED_SET_NOZZLE_LEDS_OFF]
gcode:
    SET_LED_EFFECT EFFECT=set_nozzle_leds STOP=1

[gcode_macro LED_STATUS_OFF]
gcode:
    STOP_LED_EFFECTS

[gcode_macro LED_STATUS_READY]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=rainbow

[gcode_macro LED_STATUS_PART_READY]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_nozzle_part_ready
    SET_LED_EFFECT EFFECT=sb_logo_part_ready

[gcode_macro LED_STATUS_BUSY]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_busy
    LED_SET_NOZZLE_LEDS_ON

[gcode_macro LED_STATUS_HEATING]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_heating
    SET_LED_EFFECT EFFECT=sb_nozzle_heating

[gcode_macro LED_STATUS_COOLING]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_cooling
    SET_LED_EFFECT EFFECT=sb_nozzle_cooling

[gcode_macro LED_STATUS_LEVELING]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_leveling
    LED_SET_NOZZLE_LEDS_ON

[gcode_macro LED_STATUS_HOMING]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_homing
    # SET_LED_EFFECT EFFECT=frame_led_homing
    LED_SET_NOZZLE_LEDS_ON

[gcode_macro LED_STATUS_CLEANING]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_cleaning
    LED_SET_NOZZLE_LEDS_ON

[gcode_macro LED_STATUS_MESHING]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_meshing
    LED_SET_NOZZLE_LEDS_ON

[gcode_macro LED_STATUS_CALIBRATING_Z]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_calibrating_z
    LED_SET_NOZZLE_LEDS_ON

[gcode_macro LED_STATUS_PRINTING]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_printing
    LED_SET_NOZZLE_LEDS_ON

[gcode_macro LED_STATUS_PRINT_ENDING]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=sb_logo_printing
    LED_SET_NOZZLE_LEDS_ON

[gcode_macro LED_STATUS_SPOTLIGHT]
gcode:
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=toolhead_nozzle_spotlight

