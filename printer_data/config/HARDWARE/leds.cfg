[neopixel rainbowstick_top]
pin: PB6
chain_count: 100
color_order: GRBW
initial_RED: 0.050
initial_GREEN: 0.050
initial_BLUE: 0.050
initial_WHITE: 0.050 #5

[neopixel rainbowstick_bottom]
pin: PD10
chain_count: 86
color_order: GRBW
initial_RED: 0.050
initial_GREEN: 0.050
initial_BLUE: 0.050
initial_WHITE: 0.050 #5





















