# [neopixel toolhead_leds]
# pin: EBBCan: PC7
# chain_count: 10
# color_order: GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRBW,  GRBW
# initial_RED: 1.0
# initial_GREEN: 0.0
# initial_BLUE: 1.0
# initial_WHITE: 0.0

[neopixel rainbowstick_top]
pin: PB7
chain_count: 100
color_order: GRBW
initial_RED: 0.050
initial_GREEN: 0.050
initial_BLUE: 0.050
initial_WHITE: 0.050 #5

[neopixel rainbowstick_bottom]
pin: PB6
chain_count: 86
color_order: GRBW
initial_RED: 0.050
initial_GREEN: 0.050
initial_BLUE: 0.050
initial_WHITE: 0.050 #5





