#####################################################################
#####################   X/Y/Z/E STEPPER STUFF   #####################
#####################################################################

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: ^indxmcu:endstop
# endstop_pin: PG6 #For Endstop Test
position_endstop: 350
position_max: 352
homing_speed: 100   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PC4
spi_bus: spi1
spi_speed: 500000
interpolate: False
run_current: 0.8
stealthchop_threshold: 0 #999999
diag0_pin: !PG9
driver_SGT: 1
rref: 12000

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
#endstop_pin: PG10 #For Endstop Test
position_min: -4
position_endstop: 353
position_max: 354
homing_speed: 100  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2240 stepper_y]
interpolate: false
cs_pin: PD11
spi_speed: 500000
spi_bus: spi1
diag0_pin: !PG6
run_current: 0.8
stealthchop_threshold: 0 #999999
driver_SGT: 1
rref: 12000

#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 310
position_min: -5
homing_speed: 12
#homing_speed: 8
second_homing_speed: 3
#homing_retract_dist: 3
homing_retract_dist: 0

[tmc2240 stepper_z]
interpolate: false
cs_pin: PC6
spi_speed: 500000
spi_bus: spi1
diag0_pin: !PG10
run_current: 0.8
stealthchop_threshold: 999999
driver_SGT: 1
rref: 12000

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2240 stepper_z1]
interpolate: false
cs_pin: PC7
spi_speed: 500000
spi_bus: spi1
diag0_pin: !PG11
run_current: 0.8
stealthchop_threshold: 999999
driver_SGT: 1
rref: 12000

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2240 stepper_z2]
interpolate: false
cs_pin: PF2
spi_speed: 500000
spi_bus: spi1
diag0_pin: !PG12
run_current: 0.8
stealthchop_threshold: 999999
driver_SGT: 1
rref: 12000

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2240 stepper_z3]
interpolate: false
cs_pin: PE4
spi_speed: 500000
spi_bus: spi1
diag0_pin: !PG13
run_current: 0.8
stealthchop_threshold: 999999
driver_SGT: 1
rref: 12000

