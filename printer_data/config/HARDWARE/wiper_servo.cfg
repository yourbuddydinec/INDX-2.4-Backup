[servo wiper_servo]
pin: PE11
# maximum_servo_angle: 180
minimum_pulse_width: 0.0009 # 0.001
maximum_pulse_width: 0.0020
# initial_angle: 90
initial_pulse_width: 0.0009

[gcode_macro WIPER_DEPLOY]
description: Move wiper into wiping position
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0.001958

[gcode_macro WIPER_STORE]
description: Move wiper into storage position
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0.0009
	SERVO_POWER_OFF

[gcode_macro SERVO_POWER_OFF]
description: Cuts power to the servo for storage
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0