[servo wiper_servo]
pin: PE11
# maximum_servo_angle: 180
minimum_pulse_width: 0.0009 # 0.001
maximum_pulse_width: 0.0020
# initial_angle: 90
initial_pulse_width: 0.001775

[gcode_macro WIPER_DEPLOY]
description: Move wiper into wiping position
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0.00113

[gcode_macro WIPER_STORE]
description: Move wiper into storage position
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0.001775
	SERVO_POWER_OFF

[gcode_macro SERVO_POWER_OFF]
description: Cuts power to the servo for storage
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0

[gcode_macro WIPER_MIN]
description: Move wiper into storage position
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0.0009
	#SERVO_POWER_OFF

[gcode_macro WIPER_MAX]
description: Move wiper into storage position
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0.0020
	#SERVO_POWER_OFF

#wiper_pad_right_x: 83
#wiper_pad_left_x: 47
#wiper_pad_y: 331.0
#wiper_silicont_right_x: 39.00
#wiper_silicont_left_x: 33.00
#
#

[gcode_macro NOZZLE_WIPE]
description: Wipe nozzle on Bambu-style pad, then rest/rub on RTV silicone until cool
gcode:
    {% set pad_right_x  = params.PAD_RIGHT_X|default(83)|float %}
    {% set pad_left_x   = params.PAD_LEFT_X|default(47)|float %}
    {% set pad_y        = params.PAD_Y|default(331.0)|float %}
    {% set silicone_right_x  = params.SIL_RIGHT_X|default(39.0)|float %}
    {% set silicone_left_x   =  %}

    # ---- Tunables ----
    {% set wipe_passes  = params.WIPE_PASSES|default(6)|int %}
    {% set wipe_speed   = params.WIPE_SPEED|default(6000)|float %}   ; mm/min
    {% set rub_speed    = params.RUB_SPEED|default(600)|float %}     ; mm/min, slow
    {% set wipe_z       = params.WIPE_Z|default(1.0)|float %}        ; Z height on pad (tune!)
    {% set sil_z        = params.SIL_Z|default(1.0)|float %}         ; Z height on silicone (tune!)
    {% set safe_z       = params.SAFE_Z|default(10)|float %}
    {% set target_temp  = params.COOL_TEMP|default(150)|float %}     ; stop rubbing below this
    {% set max_cycles   = params.MAX_CYCLES|default(60)|int %}       ; safety limit

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    SAVE_GCODE_STATE NAME=WIPE_AND_COOL_STATE
    G90
    G1 Z{safe_z} F1500
    G1 X{pad_right_x} Y{pad_y} F9000
    G1 Z{wipe_z} F1500

    # ---- Wipe on pad ----
    {% for i in range(wipe_passes) %}
        G1 X{pad_left_x}  Y{pad_y} F{wipe_speed}
        G1 X{pad_right_x} Y{pad_y} F{wipe_speed}
    {% endfor %}

    # ---- Move to silicone ----
    G1 Z{safe_z} F1500
    G1 X{sil_right_x} Y{pad_y} F9000
    G1 Z{sil_z} F600

    # ---- Rest/rub until cool ----
    {% if params.FAN|default(1)|int == 1 %}
        M106 S255
    {% endif %}
    {% for i in range(max_cycles) %}
        {% if printer.extruder.temperature > target_temp %}
            G1 X{sil_left_x}  F{rub_speed}
            G1 X{sil_right_x} F{rub_speed}
            G4 P1000
        {% endif %}
    {% endfor %}

    M106 S0
    G1 Z{safe_z} F1500
    RESTORE_GCODE_STATE NAME=WIPE_AND_COOL_STATE