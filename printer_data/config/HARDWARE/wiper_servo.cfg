[servo wiper]
pin: PE11
# maximum_servo_angle: 180
minimum_pulse_width: 0.0009 # 0.001
maximum_pulse_width: 0.0020
# initial_angle: 90
initial_pulse_width: 0.00145


[gcode_macro SERVO_STEP]
description: Add or subtract from the servo width and report it
variable_width: 0.0015
variable_lo: 0.0005
variable_hi: 0.0025
gcode:
  {% set delta = params.DELTA|default(0)|float %}
  {% set cur = printer["gcode_macro SERVO_STEP"].width|float %}
  {% set lo = printer["gcode_macro SERVO_STEP"].lo|float %}
  {% set hi = printer["gcode_macro SERVO_STEP"].hi|float %}
  {% set new = [[cur + delta, lo]|max, hi]|min|round(5) %}
  SET_SERVO SERVO=mg996 WIDTH={"%.5f"|format(new)}
  SET_GCODE_VARIABLE MACRO=SERVO_STEP VARIABLE=width VALUE={new}
  {% if new == lo or new == hi %}
    RESPOND MSG="Servo width: {'%.5f'|format(new)} s ({'%.3f'|format(new * 1000)} ms) - AT LIMIT"
  {% else %}
    RESPOND MSG="Servo width: {'%.5f'|format(new)} s ({'%.3f'|format(new * 1000)} ms)"
  {% endif %}

[gcode_macro SERVO_UP]
gcode:
  {% set step = params.STEP|default(0.0001)|float %}
  SERVO_STEP DELTA={step}

[gcode_macro SERVO_DOWN]
gcode:
  {% set step = params.STEP|default(0.0001)|float %}
  SERVO_STEP DELTA={-step}

[gcode_macro SERVO_SET]
description: Jump to an exact width, e.g. SERVO_SET WIDTH=0.0015
gcode:
  {% set cur = printer["gcode_macro SERVO_STEP"].width|float %}
  {% set target = params.WIDTH|default(0.0015)|float %}
  SERVO_STEP DELTA={target - cur}