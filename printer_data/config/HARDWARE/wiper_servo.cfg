[servo wiper_servo]
pin: PE11
# maximum_servo_angle: 180
minimum_pulse_width: 0.0009 # 0.001
maximum_pulse_width: 0.0020
# initial_angle: 90
initial_pulse_width: 0.001775

[gcode_macro WIPER_DEPLOY]
description: Move wiper into wiping position
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0.00113

[gcode_macro WIPER_STORE]
description: Move wiper into storage position
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0.001775
	SERVO_POWER_OFF

[gcode_macro SERVO_POWER_OFF]
description: Cuts power to the servo for storage
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0

[gcode_macro WIPER_MIN]
description: Move wiper into storage position
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0.0009
	#SERVO_POWER_OFF

[gcode_macro WIPER_MAX]
description: Move wiper into storage position
gcode:
	SET_SERVO SERVO=wiper_servo WIDTH=0.0020
	#SERVO_POWER_OFF




[gcode_macro NOZZLE_WIPE]
description:
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %}
    {% set PAD_RIGHT_X = globals.wiper_pad_right_x %}
	{% set WAIT_DISTANCE = globals.wiper_pad_right_wait_dist %}
    {% set PAD_LEFT_X = globals.wiper_pad_left_x %}
    {% set PAD_Y = globals.wiper_pad_y %}
    {% set SILICONE_RIGHT_X = globals.wiper_silicone_right_x %}
    {% set SILICONE_LEFT_X = globals.wiper_silicone_left_x %}
    
    {% set NUM_WIPES = globals.wiper_num_wipes %}
    {% set TRAVEL_SPEED = globals.wiper_travel_speed %}     ; mm/min, slow
    {% set WIPE_SPEED = globals.wiper_wipe_speed %}  ; mm/min
    {% set RUB_SPEED = globals.wiper_rub_speed  %}   ; mm/min, slow
    
    {% set CURRENT_Z = printer.toolhead.position.z|float %}
    {% set MIN_SAFE_Z = globals.wiper_min_safe_z_height %}
    {% set Z_HOP = globals.wiper_bonus_z_height %}
    {% set min_wipe_temp= globals.wiper_min_wipe_temp %}    ; stop rubbing below this
    {% set COOL_TEMP = globals.wiper_cool_to_temp %}    ; stop rubbing below this
    {% set RUBS = globals.wiper_num_rubs %}       ; safety limit
    
        {% if "xyz" in printer.toolhead.homed_axes %}
    
        SAVE_GCODE_STATE NAME=WIPE_AND_COOL_STATE
    
    	ABSOLUTE
        {% if CURRENT_Z < MIN_SAFE_Z %}
            G1 Z{MIN_SAFE_Z } F1600
        {% endif %}
    
    	RELATIVE
    	G1 {Z_HOP} F1600
    	ABSOLUTE
    
    	M118 MOVING IN 5 sec
    	G4 P5000
    
        G1 X{PAD_RIGHT_X + WAIT_DISTANCE} Y{PAD_Y} F{TRAVEL_SPEED}
    
    	M118 DEPLOYING WIPER IN 5 sec
    	G4 P5000
    
    	WIPER_DEPLOY
    
    	M118 WIPING IN 5 sec
    	G4 P5000
    
        {% for i in range(NUM_WIPES) %}
            G1 X{PAD_LEFT_X}  Y{PAD_Y} F{WIPE_SPEED}
            G1 X{PAD_RIGHT_X} Y{PAD_Y} F{WIPE_SPEED}
    		#G4 P1000
        {% endfor %}
    
    
    
        #G1 Z{safe_z} F1500
    
    	M118 MOVING TO RUB SPOT IN 5 sec
    	G4 P5000
    
        G1 X{SILICONE_RIGHT_X} Y{PAD_Y} F9000
    
    	M118 RUBBING IN 5 sec
    	G4 P5000
    
    
        # ---- Rest/rub until cool ----
            M106 S255 #blow fans turn into if else
        {% for i in range(RUBS) %}
            {% if printer.extruder.temperature > COOL_TEMP %}
                G1 X{SILICONE_LEFT_X}  F{RUB_SPEED}
                G1 X{SILICONE_RIGHT_X} F{RUB_SPEED}
                G4 P1000
            {% endif %}
        {% endfor %}
    
    
    	M118 RUBBING!
    	M118 RESTORING STATE IN 5 sec
    	G4 P5000
    
    
    
        #M106 S0
        #G1 Z{safe_z} F1500
        RESTORE_GCODE_STATE NAME=WIPE_AND_COOL_STATE
    
        {% else %}
            #G28
    		M118 CANNOT WIPE WHEN NOT HOMED
        {% endif %}
    	M118 DONE!