[gcode_macro WIPE_TILL_COOLED]
description: Repeat NOZZLE_WIPE until the nozzle is at or below TARGET
gcode:
    {% set TARGET_TEMP = params.TEMP|default(80)|int %}
    {% set TRIES  = params.TRIES|default(100)|int %}
    {% if printer.extruder.temperature > TARGET_TEMP and TRIES > 0 %}
      NOZZLE_WIPE COOL=0 REST_TIME=2
      WIPE_UNTIL_COOLED TEMP={TARGET_TEMP} TRIES={TRIES - 1}
    {% endif %}

[gcode_macro NOZZLE_PURGE_ALL]
description: Load and purge every tool, highest index first
gcode:
	{% set NUM_TOOLS = printer.save_variables.variables.tool_count|int %}
	{% set EXTRUDER_TEMP = paramsTEMP|default("230")|int %}

	{% for t in range(NUM_TOOLS - 1, -1, -1) %}
		INDX_STATUS QUIET=1
		INDX_LOAD TOOL={t} TYPE=PLA TEMP=210 PUSHED=1
		M109 S{EXTRUDER_TEMP}
		_CLIENT_LINEAR_MOVE E=100 F=500
		_CLIENT_LINEAR_MOVE E=-2 F=200
		_CLIENT_LINEAR_MOVE E=-5 F=300
		_CLIENT_LINEAR_MOVE E=-200 F=1000
		WIPE_UNTIL_COOLED
	{% endfor %}


[gcode_macro NOZZLE_WIPE]
description:
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %}
    {% set PAD_RIGHT_X = globals.wiper_pad_right_x %}
	{% set WAIT_DISTANCE = globals.wiper_pad_right_wait_dist %}
    {% set PAD_LEFT_X = globals.wiper_pad_left_x %}
    {% set PAD_Y = globals.wiper_pad_y %}
    {% set SILICONE_RIGHT_X = globals.wiper_silicone_right_x %}
    {% set SILICONE_LEFT_X = globals.wiper_silicone_left_x %}
    
    {% set NUM_WIPES = globals.wiper_num_wipes %}
    {% set TRAVEL_SPEED = globals.wiper_travel_speed %}     ; mm/min, slow
    {% set WIPE_SPEED = globals.wiper_wipe_speed %}  ; mm/min
    {% set REST_TIME = (globals.wiper_rest_time)  %}   ; mm/min, slow
    
    {% set CURRENT_Z = printer.toolhead.position.z|float %}
    {% set MIN_SAFE_Z = globals.wiper_min_safe_z_height %}
    {% set Z_HOP = globals.wiper_bonus_z_height %}
    #{% set min_wipe_temp= globals.wiper_min_wipe_temp %}    ; stop rubbing below this
    {% set COOL_TEMP = params.TEMP|default(globals.wiper_cool_to_temp)|int  %}    ; stop rubbing below this
    {% set RUBS = globals.wiper_num_rubs %}       ; safety limit
	{% set IS_RESTING = params.REST|default(1)|int %}       ; safety limit
	{% set IS_COOLING = params.COOL|default(0)|int %}       ; safety limit

    
        {% if "xyz" in printer.toolhead.homed_axes %}
    
        SAVE_GCODE_STATE NAME=WIPE_AND_COOL_STATE
    
    	ABSOLUTE
        {% if CURRENT_Z < MIN_SAFE_Z %}
            G1 Z{MIN_SAFE_Z } F1600
        {% endif %}
    
    	RELATIVE
    	G1 Z{Z_HOP} F1600
    	ABSOLUTE
        
        G1 X{PAD_RIGHT_X + WAIT_DISTANCE} Y{PAD_Y} F{TRAVEL_SPEED}
    
    	WIPER_DEPLOY
    
        {% for i in range(NUM_WIPES) %}
            G1 X{PAD_LEFT_X}  Y{PAD_Y} F{WIPE_SPEED}
            G1 X{PAD_RIGHT_X} Y{PAD_Y} F{WIPE_SPEED}
    		#G4 P1000
        {% endfor %}

		{% if IS_RESTING == 1 %}
            G1 X{SILICONE_RIGHT_X} Y{PAD_Y} F{TRAVEL_SPEED}
            G1 X{(SILICONE_LEFT_X+SILICONE_RIGHT_X)/2}  F{TRAVEL_SPEED}
            M106 S255 #fans
    
            {% if IS_COOLING %}
                    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={COOL_TEMP}
            {% else %}
                    G4 P{REST_TIME * 1000}
            {% endif %}		
		{% endif %}		

		WIPER_STORE
        RESTORE_GCODE_STATE NAME=WIPE_AND_COOL_STATE
        {% else %}
            #G28
    		M118 CANNOT WIPE WHEN NOT HOMED
        {% endif %}
