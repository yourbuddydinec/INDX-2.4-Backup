[gcode_macro LOAD_FILAMENT_SAVE]
gcode:
	{% if 'TOOL' not in params and 'TYPE' not in params %}
    	{action_raise_error("TOOL and TYPE not in params. Proper: LOAD FILAMENT_SAVE TOOL=0 TYPE=PLA")}
	{% elif 'TOOL' not in params %}
        {action_raise_error("TOOL not in params. Proper: LOAD FILAMENT_SAVE TOOL=0 TYPE=PLA")}
    {% elif 'TYPE' not in params %}
        {action_raise_error("TYPE not in params. Proper: LOAD FILAMENT_SAVE TOOL=0 TYPE=PLA")}
    {% endif %}

	{% set TOOL_NUM = params.TOOL %} #error if no tool num in params
    {% set FIL_TYPE = params.TYPE %} #error if no type in params
    {% set DENSITY = printer["gcode_macro LOAD_FILAMENT"].filament_presets.{FIL_TYPE} %}}
    
	LOAD_FILAMENT {rawparams} MEASURE=1
    M118 Find (info name shown in console, check after first test) and enter it in the following command:
    M118 SET_TOOL_FILAMENT TOOL={TOOL_NUM} DENSITY={DENSITY} HEAT_CAPACITY=1.73