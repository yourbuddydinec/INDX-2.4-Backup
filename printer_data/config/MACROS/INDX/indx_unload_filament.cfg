[gcode_macro INDX_UNLOAD_FILAMENT]
gcode:
 	{% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
  	{% set UNLOAD_TEMP = params.TEMP|default(globals.unload_temp)|int %}
  	{% set UNLOAD_DIST = params.DIST|default(globals.unload_dist)|int %}
    {% set UNLOAD_RAM_SPEED = params.SPEED|default(globals.unload_ram_speed)|int %}
  	{% if printer.extruder.temperature < TEMP - 5 %}
    		M109 S{UNLOAD_TEMP}
  	{% endif %}
  	RELATIVE_E
  	G92 E0
  	G1 E8 F300 #push it (Ooh, baby, baby, baby, baby ) to form tip
  	G1 E-{UNLOAD_DIST} F{UNLOAD_RAM_SPEED}600
  	M104 S0
  RESPOND MSG="Filament retracted past gears — pull free of PTFE, then CAL_Z"