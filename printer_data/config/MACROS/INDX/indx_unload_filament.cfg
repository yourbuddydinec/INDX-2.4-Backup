[gcode_macro INDX_UNLOAD_FILAMENT]
gcode:
  	{% set UNLOAD_TEMP = params.TEMP|default(210)|int %}
  	{% set UNLOAD_DIST = params.DIST|default(80)|int %}
    {% set UNLOAD_RAM_SPD = params.SPEED|default(80)|int %}
  	{% if printer.extruder.temperature < TEMP - 5 %}
    		M109 S{UNLOAD_TEMP}
  	{% endif %}
  	RELATIVE_E
  	G92 E0
  	G1 E8 F300 #push it (Ooh, baby, baby, baby, baby ) to form tip
  	G1 E-{UNLOAD_DIST} F{UNLOAD_RAM_SPD}600
  	M104 S0
  RESPOND MSG="Filament retracted past gears — pull free of PTFE, then CAL_Z"