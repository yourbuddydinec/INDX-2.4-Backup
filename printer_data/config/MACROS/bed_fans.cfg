################################
########### BED_FANS ###########
################################
[gcode_macro BED_FANS_SPEED]
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
    {% set FAN_NAME = globals.bed_fan_name %}
    # {% set FAN_R_NAME = globals.bed_fan_name_r %}
    {% set FAN_SPEED = params.SPEED|default(100)|int %}
    {% set ACTUAL_FAN_SPEED = FAN_SPEED/100 %}
 
    SET_FAN_SPEED FAN={FAN_NAME} SPEED={FAN_SPEED}
    # SET_FAN_SPEED FAN={FAN_R_NAME} SPEED={FAN_SPEED}

[gcode_macro BED_FANS_OFF]
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
    {% set FAN_NAME = globals.bed_fan_name %}
    # {% set FAN_R_NAME = globals.bed_fan_name_r %}
    {% set ACTUAL_FAN_SPEED = 0 %}
    
    M118 Bed fans off
    SET_FAN_SPEED FAN={FAN_NAME} SPEED={ACTUAL_FAN_SPEED}
    # SET_FAN_SPEED FAN={FAN_R_NAME} SPEED={ACTUAL_FAN_SPEED}

[gcode_macro BED_FANS_SLOW]
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
    {% set FAN_NAME = globals.bed_fan_name %}
    # {% set FAN_R_NAME = globals.bed_fan_name_r %}
    {% set FAN_SPEED = globals.bed_fan_slow_spd %}
    {% set ACTUAL_FAN_SPEED = FAN_SPEED/100 %}
    
    M118 Bed fans on to {FAN_SPEED}% ({ACTUAL_FAN_SPEED})
    SET_FAN_SPEED FAN={FAN_NAME} SPEED={ACTUAL_FAN_SPEED}
    # SET_FAN_SPEED FAN={FAN_R_NAME} SPEED={ACTUAL_FAN_SPEED}

[gcode_macro BED_FANS_FAST]
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
    {% set FAN_NAME = globals.bed_fan_name %}
    # {% set FAN_R_NAME = globals.bed_fan_name_r %}
    {% set FAN_SPEED = globals.bed_fan_fast_spd %}
    {% set ACTUAL_FAN_SPEED = FAN_SPEED/100 %}
    
    M118 Bed fans on to {FAN_SPEED}% ({ACTUAL_FAN_SPEED})
    SET_FAN_SPEED FAN={FAN_NAME} SPEED={ACTUAL_FAN_SPEED}
    # SET_FAN_SPEED FAN={FAN_R_NAME} SPEED={ACTUAL_FAN_SPEED}


############ Command overrides ############

# Override, set fan speeds to low and start monitoring loop.
[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SET_HEATER_TEMPERATURE
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
	{% set HEATER = params.HEATER|default("None") %}
	{% set TARGET = params.TARGET|default(0)|int %}
	{% set THRESHOLD = globals.bed_fan_temp_threshold|int %}
	
	{% if HEATER|lower == "extruder" %}
		M104 S{TARGET}
	{% elif HEATER|lower == "heater_bed" %}
		M99140 S{TARGET}
	{% else %}
		M118 Heater %s not supported {HEATER}
	{% endif %}

	# Set fans to low if heater_bed temp is requested above threshold temp, and kick off monitoring loop.
	{% if HEATER|lower == "heater_bed" %}
		{% if TARGET >= THRESHOLD %}
			BED_FANS_SLOW
			UPDATE_DELAYED_GCODE ID=bed_fan_loop DURATION=1
		{% else %}
			BED_FANS_OFF
			UPDATE_DELAYED_GCODE ID=bed_fan_loop DURATION=0 #	Cancel bed fan loop if it's running
		{% endif %}
	{% endif %}
	
# Override M190 (Wait for Bed Temperature)
# As a bonus, use TEMPERATURE_WAIT so we don't have to wait for PID to level off.
[gcode_macro M190]
rename_existing: M99190
gcode:
	{% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
	{% set S = params.S|int %}
	{% set THRESHOLD = globals.bed_fan_temp_threshold|int %}
	
	# {% if S >= THRESHOLD %}
	# 	BED_FANS_SLOW																# >= Threshold temp: Low speed fans while heating 
	# {% else %}
	# 	BED_FANS_OFF																# < Threshold temp: Turn bed fans off
	# {% endif %}                                        
    
	# M140 {% for p in params
	#   %}{'%s%s' % (p, params[p])}{%
	#   endfor %}																	# Set bed temp
    
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}		

	{% if S != 0 %}
		TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={S|int} MAXIMUM={S|int + 5}	# Wait for bed temp within 5 degrees
	{% endif %}
    
	# # Post-heating fan speeds
	# {% if S >= THRESHOLD %}								    
	# 	BED_FANS_FAST																# >= Threshold temp: Higher speed fans after heating finished
	# {% endif %}

	
# Replace M140 (Set Bed Temperature) to just be an alias of SET_HEATER_TEMPERATURE (which has associated bed fan logic if enabled)
[gcode_macro M140]
rename_existing: M99140
gcode:
	# Parameters
	{% set S = params.S|float %}
	
	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={S}
	
# Replace TURN_OFF_HEATERS
[gcode_macro TURN_OFF_HEATERS]
rename_existing: _TURN_OFF_HEATERS
gcode:
	BED_FANS_OFF
	_TURN_OFF_HEATERS
	
################ Monitoring loop #####################

# Turns bed fans to "fast" speed once target bed temp is reached.
[delayed_gcode bed_fan_loop]
gcode:
	{% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
	{% set THRESHOLD = globals.bed_fan_temp_threshold|int %}
	
	{% if printer.heater_bed.target >= THRESHOLD %}								# Continue only if target temp greater than threshold.
		{% if printer.heater_bed.temperature|int >= (printer.heater_bed.target|int - 1) %}
			BED_FANS_FAST															# If within 1 degree of target temp: Higher speed fans
		{% else %}
			UPDATE_DELAYED_GCODE ID=bed_fan_loop DURATION=5						# If temp not reached yet: loop again
		{% endif %}
	{% endif %}
