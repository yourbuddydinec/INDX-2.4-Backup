[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
    {% set CLEAN_TEMP = params.TEMP|default(0)|int %}
    {% set LIFT = params.LIFT|default(globals.cleaning_use_lift_before)|lower %}
    {% set OOZE = params.OOZE|default(globals.cleaning_use_prevent_ooze_after)|lower %}
    {% set COOL_AFTER = params.COOL|default(globals.cleaning_use_cool_after)|lower %}

    {% if printer.toolhead.homed_axes != "xyz" %} ; if not homed
      G28 ; Home all axes if needed
    {% endif %}

    LED_STATUS_CLEANING ; set lighting
    {% if LIFT|lower != "false" %}
        RELATIVE ; relative positioning for Z only
        G0 Z{globals.cleaning_z_relative_pos} F1500
    {% endif %}
    ABSOLUTE ; absolute positioning
    G0 X{(globals.cleaning_x_right_pos+globals.cleaning_x_left_pos)/2} F6000 ; Move nozzle to middle of brush

    {% if CLEAN_TEMP > globals.cleaning_min_temp %}
        LED_STATUS_HEATING
        M118 Heating extruder for cleaning
        M109 S{CLEAN_TEMP}
    {% else %}
        LED_STATUS_HEATING
        M118 Heating extruder for cleaning
        M109 S{globals.cleaning_min_temp}
    {% endif %}
    
    G0 Y{globals.cleaning_y_pos} F6000 ; Move nozzle onto brush
   
    M118 Wiping nozzle! ; start actual wiping movement
    {% for wipes in range(1, (globals.cleaning_wipe_qty + 1)) %}
        G0 X{globals.cleaning_x_left_pos} F{globals.cleaning_wipe_spd * 60}
        G0 X{globals.cleaning_x_right_pos} F{globals.cleaning_wipe_spd * 60}
    {% endfor %}

    {% if OOZE|lower == "true" %}
        M118 Parking to prevent oozing
        G0 X{globals.cleaning_ooze_prevention_x} F{globals.cleaning_wipe_spd * 60} # F6000
    {% endif %}
    {% if COOL_AFTER|lower == "true" %}
        M118 Cooling extruder
        M106 S255 ; turn on part cooling fan to cool nozzle faster
        G0 X{globals.cleaning_ooze_prevention_x} F{globals.cleaning_wipe_spd * 60} # F6000
        M104 S0
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={globals.cleaning_cool_to_temp}
        M106 S0 ; turn off part cooling fan after nozzle cooled enough
    {% endif %}

    {% if OOZE|lower != "true" %}
        M118 Moving off wiper
        G0 Y{globals.cleaning_y_pos - globals.cleaning_y_move_away} F{globals.cleaning_wipe_spd * 60} ; move off wiper
    {% endif %}



