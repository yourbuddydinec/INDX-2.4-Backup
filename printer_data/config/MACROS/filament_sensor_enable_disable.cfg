[gcode_macro FILAMENT_SENSOR_ENABLE]
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
    SET_FILAMENT_SENSOR SENSOR={globals.filament_sensor_name} ENABLE=1

[gcode_macro FILAMENT_SENSOR_DISABLE]
gcode:
    {% set globals = printer['gcode_macro _GLOBALS'] %} ; get global variables
    SET_FILAMENT_SENSOR SENSOR={globals.filament_sensor_name} ENABLE=0