[gcode_macro END_PRINT_RAISE]
gcode:
	{% set globals = printer['gcode_macro _GLOBALS'] %}
	{% set MIN_Z = globals.end_print_min_z %}
	{% set Z_EXTRA = globals.end_print_min_z_additional %}
	{% set CURRENT_Z = printer.toolhead.position.z %}
	
	{% if CURRENT_Z < MIN_Z %}      
		ABSOLUTE
		G1 Z{MIN_Z} F600
	{% endif %}
	RELATIVE
	G1 Z{Z_EXTRA} F600
	ABSOLUTE
