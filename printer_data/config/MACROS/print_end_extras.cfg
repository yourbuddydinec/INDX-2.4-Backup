[gcode_macro END_PRINT_RAISE]
gcode:
    {% set Z = ??? %}
    {% if printer.toolhead.homed_axes != "xyz" and "z" not in printer.toolhead.homed_axes %}
        { action_raise_error("Z is not homed. Home first.") }
    {% endif %}
    {% set cur_z = printer.toolhead.position.z %}
    {% if cur_z < target %}
        
      ABSOLUTE
        G1 Z{Z+Z_EXTRA} F600
    {% else %}
		RELATIVE
        G1 Z{Z_EXTRA} F600
		ABSOLUTE
    {% endif %}