#####################################################################
#  INDX HOMING OVERRIDE
#####################################################################
#
#  Included by indx_includes.cfg (printer.cfg includes indx/indx.cfg and
#  indx/indx_includes.cfg).
#
#  Klipper allows only ONE [homing_override]. If your printer.cfg
#  already has one (sensorless current, bed raiser, etc.), merge this
#  sequence into yours - do not include both.
#
#  Sequence (full G28):
#    1. Raise to probe_z_clearance (blind hop when Z is unknown).
#    2. Home Y (X always needs Y first).
#    3. Home X, from clearance_y when the head is on the dock side.
#    4. Make the reference tool (ref_tool) the tool on the head, then probe
#       at probe_x / probe_y. Tool offsets are differences from it. An empty
#       head fetches it, another tool is parked first.
#       A reference tool short of the release is unfrozen first, never
#       probed as it is (_INDX_HOME_Z_DECIDE). [EL-HOM-002]
#       A fully locked reference tool with filament is cleaned on the bed
#       before the load cell home (_INDX_REF_CLEAN). [EL-HOM-001]
#
#  home_check_seat (indx.cfg, on by default): the load cell, once
#  calibrated, must agree with active_tool; when they disagree G28 refuses,
#  since parking a tool that is not there drives it into a dock. Off:
#  active_tool alone answers. [EL-HOM-026]
#
#####################################################################

[homing_override]
axes: xyz
gcode:
    # Build the effective docks and clearance_y first (INIT_STATE may not have
    # yet); _INDX_HOME_AXES renders after this and reads the resolved values.
    {% set home_all = not ('X' in params or 'Y' in params or 'Z' in params) %}
    # G28 only homes. It levels the gantry only when an INDX routine asked
    # for it (_INDX_LEVEL): the request is taken here, for this G28 only,
    # first, so a G28 its checks refuse never leaves it to the next one
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_LEVEL VARIABLE=go VALUE={printer["gcode_macro _INDX_HOME_LEVEL"].want|int}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_LEVEL VARIABLE=want VALUE=0
    # homing_busy is only set inside this override; a G28 that stopped on a
    # raw Klipper error mid-way left it set, so a new G28 starts it clear
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
    _INDX_INIT_GATE CMD=G28
    {% if home_all or 'Z' in params %}
        _INDX_HOME_Z_CMD_CHECK
    {% endif %}
    _INDX_HOME_STALE_Z
    _INDX_BUILD_TOOLS
    _INDX_HOME_AXES X={1 if home_all or 'X' in params else 0} Y={1 if home_all or 'Y' in params else 0} Z={1 if home_all or 'Z' in params else 0}

[gcode_macro _INDX_HOME_Z_CMD_CHECK]
description: Inner - G28 with Z: refuse before anything moves when home_z_cmd (indx.cfg) is a command of a module this install does not have (LOAD_CELL_Z_HOME and SCANNER_Z_SEEK are scanner_z_seek's)
# Never a quiet fall back to G28 Z: unlike the capped home it can drive a
# missing tool or a wrong Z into the bed. [EL-HOM-025]
gcode:
    {% set zcmd = printer["gcode_macro TOOL_POSITIONS"].home_z_cmd|default("G28 Z")|string|upper %}
    {% if ("LOAD_CELL_Z_HOME" in zcmd or "SCANNER_Z_SEEK" in zcmd) and "scanner_z_seek" not in printer %}
        # the scanner module is INDX Python: on an INDX Macros install only
        # the indx.cfg fix applies
        {action_raise_error("INDX: G28 refused, nothing moved: home_z_cmd in indx.cfg is %s, the capped Z home of the eddy scanner module (scanner_z_seek), which this printer does not load. Set variable_home_z_cmd: 'G28 Z' in indx.cfg and restart%s." % (zcmd, ", or add [scanner_z_seek] to printer.cfg for the INDX Eddy Scanner" if "indx_api" in printer else ""))}
    {% endif %}

[gcode_macro _INDX_HOME_STALE_Z]
description: Inner - a provisional Z home left by an earlier G28 that stopped (z_faked still set): clear it before this G28 decides anything from homed_axes
# An error raised from Python skips _INDX_HOME_Z_FAIL and leaves Z reported
# homed at a made-up height. [EL-HOM-013]
gcode:
    {% if printer["gcode_macro _INDX_HOME_Z"].z_faked|default(0)|int %}
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_SAFE_Z_HOP VARIABLE=blind_hopped VALUE=False
        RESPOND TYPE=error MSG="INDX: the last G28 stopped with Z only provisionally homed: Z is not homed, homing it again"
    {% endif %}

[gcode_macro _INDX_HOME_AXES]
description: Inner - the homing override body: X=1 Y=1 Z=1 say which axes G28 asked for
gcode:
    # Homing moves the head away from the camera: camera off
    {% if "gcode_macro _INDX_CAM_AWAY" in printer %}
        _INDX_CAM_AWAY
    {% endif %}
    _INDX_CHECK_CLEARANCE
    # With Z unhomed a loaded mesh still adds Z to the X/Y moves, which
    # Klipper refuses ("Must home axis first"): clear it.
    {% if "z" not in printer.toolhead.homed_axes and "bed_mesh" in printer %}
        {% set mm = printer.bed_mesh.mesh_matrix|default([[]]) %}
        {% if mm|length and mm[0]|length %}
            RESPOND MSG="INDX: bed mesh cleared, Z is not homed"
        {% endif %}
        BED_MESH_CLEAR
    {% endif %}
    {% set home_x = params.X|default(0)|int == 1 %}
    {% set home_z = params.Z|default(0)|int == 1 %}
    # X requires Y: G28 X with Y unknown homes Y first
    {% set home_y = params.Y|default(0)|int == 1
        or (home_x and "y" not in printer.toolhead.homed_axes) %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    # Fetching the reference tool (and parking another) needs those docks measured
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set ref = printer.save_variables.variables.ref_tool|default(0)|int %}
    {% if home_z and act != ref %}
        _INDX_CHECK_DOCKS FOR=home TOOLS={ref}{(',%d' % act) if act >= 0 else ''}
    {% endif %}
    # A failed pickup may have left a tool half seated on the head: no Z home
    # until the head has been checked by hand [EL-HOM-014]
    {% if home_z %}
        _INDX_CHECK_SUSPECT
    {% endif %}

    # 1. Clear Z before any axis home
    _INDX_SAFE_Z_HOP

    # 1b. A sensorless home that starts at its stop can stall short of it:
    # with X and Y known and the head out of the dock area, start at least
    # 30 mm from both max stops (a G28 after a G28 starts 3 mm from X max)
    # [EL-HOM-030]
    {% if (home_x or home_y) and "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
        {% set p0 = printer.toolhead.position %}
        {% set mx = printer.toolhead.axis_maximum %}
        {% set out_of_docks = (p0.y|float - tp.clearance_y|float) * tp.dock_dir|float <= 0 %}
        {% if out_of_docks and (p0.x|float > mx.x|float - 30 or p0.y|float > mx.y|float - 30) %}
            G90
            G0 X{"%.3f"|format([p0.x|float, mx.x|float - 30]|min)} Y{"%.3f"|format([p0.y|float, mx.y|float - 30]|min)} F{tp.home_travel_feedrate|default(3000)|int}
        {% endif %}
    {% endif %}

    # 2. Home Y first (X-first can sweep into tools)
    {% if home_x or home_y %}
        _INDX_HOME_TUNE_RESET
        _INDX_XY_HOME_BEGIN
    {% endif %}
    {% if home_y %}
        _INDX_HOME_AXIS AXIS=Y
    {% endif %}

    # 3. Homing X sweeps across the docks: move to clearance_y first when Y
    # is on the dock side. Y just homed: use position_endstop (this template
    # renders before G28 Y runs, so the live position is stale). [EL-HOM-027]
    {% if home_x %}
        {% set clear_y = tp.clearance_y|float %}
        {% set ns = namespace(cur_y=none) %}
        {% if home_y %}
            {% set ycfg = printer.configfile.settings.stepper_y %}
            {% if "position_endstop" in ycfg %}
                {% set ns.cur_y = ycfg.position_endstop|float %}
            {% endif %}
        {% else %}
            {% set ns.cur_y = printer.toolhead.position.y|float %}
        {% endif %}
        # An unknown Y cannot be proven clear, so move rather than assume.
        {% if ns.cur_y is none or (ns.cur_y - clear_y) * (tp.dock_dir|float) > 0 %}
            G90
            G0 Y{"%.3f"|format(clear_y)} F{tp.home_travel_feedrate|default(3000)|int}
        {% endif %}
        _INDX_HOME_AXIS AXIS=X
    {% endif %}
    {% if home_x or home_y %}
        _INDX_XY_HOME_END
    {% endif %}

    # 3b. Sensorless CoreXY: the reference touch sets the frame the docks are
    # measured in; a sensorless home alone moves by steps. [EL-HOM-007]
    {% if (home_x or home_y) and "xy_dual_stall" in printer %}
        _INDX_HOME_TOUCH
    {% endif %}
    # A print held by the pickup position check waits for X and Y to be homed
    {% if home_x or home_y %}
        _INDX_PICKUP_POS_HOMED X={1 if home_x else 0} Y={1 if home_y else 0}
    {% endif %}

    # 4. Z needs a seated tool (load cell = nozzle probe)
    {% if home_z %}
        _INDX_HOME_Z
    {% endif %}

[gcode_macro _INDX_HOME_AXIS]
description: Inner - home one axis (AXIS=X or Y) with its own sensorless tune: while that axis homes, its StallGuard threshold (<axis>_sgt, on that axis's driver only), the X/Y drivers' home current (<axis>_home_current, 0 = as configured) and a lower acceleration and square corner velocity (<axis>_accel, <axis>_scv); the normal values come back right after. Off unless <axis>_tune is on (INDX_SETTING MACRO=_INDX_HOME_AXIS)
# Every X/Y home goes through here [EL-HOM-028]. A homing error skips the restore, so the
# restore uses printer.cfg's values and _INDX_HOME_TUNE_RESET runs before
# every X/Y home.
variable_x_tune: False
variable_x_sgt: 0
variable_x_sgt_run: 0
variable_x_accel: 0
variable_x_scv: 0.0
variable_x_home_current: 0.0
variable_x_hc_x: 0.0
variable_x_hc_y: 0.0
variable_y_tune: False
variable_y_sgt: 0
variable_y_sgt_run: 0
variable_y_accel: 0
variable_y_scv: 0.0
variable_y_home_current: 0.0
variable_y_hc_x: 0.0
variable_y_hc_y: 0.0
gcode:
    {% set ax = params.AXIS|default("Y")|lower %}
    {% if ax not in ("x", "y") %}
        {action_raise_error("_INDX_HOME_AXIS: AXIS=X or Y")}
    {% endif %}
    {% set me = printer["gcode_macro _INDX_HOME_AXIS"] %}
    {% set pc = printer.configfile.settings.printer %}
    {% set acc0 = pc.max_accel|float %}
    {% set scv0 = pc.square_corner_velocity|default(5.0)|float %}
    {% set on = me[ax ~ "_tune"]|string|lower in ("true", "1") %}
    {% set st = "stepper_" ~ ax %}
    {% set hc = me[ax ~ "_home_current"]|float %}
    # the configured home current of both X/Y drivers, to put back
    {% set ns = namespace(hc0={}) %}
    {% for k, v in printer.configfile.settings.items() %}
        {% if k.startswith("tmc") and k.split(" ")[-1] in ("stepper_x", "stepper_y") and v.home_current is defined %}
            {% set _ = ns.hc0.update({k.split(" ")[-1]: v.home_current|float}) %}
        {% endif %}
    {% endfor %}
    {% if on %}
        SET_TMC_FIELD STEPPER={st} FIELD=sgt VALUE={me[ax ~ "_sgt"]|int}
        # per motor (<axis>_hc_x, <axis>_hc_y) wins over both (<axis>_home_current)
        {% for s in ns.hc0 %}
            {% set c = me[ax ~ "_hc_" ~ s[-1]]|float %}
            {% set c = c if c > 0 else hc %}
            {% if c > 0 %}
                SET_TMC_CURRENT STEPPER={s} HOMECURRENT={c}
            {% endif %}
        {% endfor %}
        {% if me[ax ~ "_accel"]|int > 0 %}
            SET_VELOCITY_LIMIT ACCEL={me[ax ~ "_accel"]|int}{(" SQUARE_CORNER_VELOCITY=%.2f" % me[ax ~ "_scv"]|float) if me[ax ~ "_scv"]|float > 0 else ""}
        {% endif %}
    {% endif %}
    G28 {ax|upper}
    {% if on %}
        {% if me[ax ~ "_accel"]|int > 0 %}
            SET_VELOCITY_LIMIT ACCEL={acc0} SQUARE_CORNER_VELOCITY={scv0}
        {% endif %}
        SET_TMC_FIELD STEPPER={st} FIELD=sgt VALUE={me[ax ~ "_sgt_run"]|int}
        {% if hc > 0 or me[ax ~ "_hc_x"]|float > 0 or me[ax ~ "_hc_y"]|float > 0 %}
            {% for s, c in ns.hc0.items() %}
                SET_TMC_CURRENT STEPPER={s} HOMECURRENT={c}
            {% endfor %}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_HOME_TUNE_RESET]
description: Inner - put the acceleration and the StallGuard thresholds _INDX_HOME_AXIS changes back to their normal values (after a homing error stopped it halfway)
gcode:
    {% set me = printer["gcode_macro _INDX_HOME_AXIS"] %}
    {% set pc = printer.configfile.settings.printer %}
    {% for ax in ("x", "y") %}
        {% if me[ax ~ "_tune"]|string|lower in ("true", "1") %}
            SET_TMC_FIELD STEPPER=stepper_{ax} FIELD=sgt VALUE={me[ax ~ "_sgt_run"]|int}
        {% endif %}
    {% endfor %}
    {% for k, v in printer.configfile.settings.items() %}
        {% if k.startswith("tmc") and k.split(" ")[-1] in ("stepper_x", "stepper_y") and v.home_current is defined %}
            SET_TMC_CURRENT STEPPER={k.split(" ")[-1]} HOMECURRENT={v.home_current|float}
        {% endif %}
    {% endfor %}
    SET_VELOCITY_LIMIT ACCEL={pc.max_accel|float} SQUARE_CORNER_VELOCITY={pc.square_corner_velocity|default(5.0)|float}

[gcode_macro _INDX_XY_HOME_BEGIN]
description: Hook - runs right before X/Y homing and around every one-motor contact and reference touch (xy_dual_stall). Empty by default.
# Override in printer.cfg (after the include) to switch TMC settings for
# sensorless homing; _INDX_XY_HOME_END switches back. Needed with
# klipper_tmc_autotune on X/Y. TMC2209 example [EL-HOM-008]:
#   [gcode_macro _INDX_XY_HOME_BEGIN]
#   gcode:
#       {% for s in ["stepper_x", "stepper_y"] %}
#           SET_TMC_FIELD STEPPER={s} FIELD=semin VALUE=0
#           SET_TMC_FIELD STEPPER={s} FIELD=toff VALUE=3
#           SET_TMC_FIELD STEPPER={s} FIELD=tbl VALUE=2
#           SET_TMC_FIELD STEPPER={s} FIELD=hstrt VALUE=5
#           SET_TMC_FIELD STEPPER={s} FIELD=hend VALUE=0
#           SET_TMC_FIELD STEPPER={s} FIELD=pwm_ofs VALUE=36
#           SET_TMC_FIELD STEPPER={s} FIELD=pwm_grad VALUE=14
#           SET_TMC_FIELD STEPPER={s} FIELD=pwm_freq VALUE=1
#           SET_TMC_FIELD STEPPER={s} FIELD=pwm_reg VALUE=8
#           SET_TMC_FIELD STEPPER={s} FIELD=pwm_lim VALUE=12
#       {% endfor %}
#   [gcode_macro _INDX_XY_HOME_END]
#   gcode:
#       AUTOTUNE_TMC STEPPER=stepper_x
#       AUTOTUNE_TMC STEPPER=stepper_y
# TMC5160: CoolStep off and a homing hysteresis (e.g. semin 0, hend 5).
gcode:

[gcode_macro _INDX_XY_HOME_END]
description: Hook - runs right after X/Y homing. Empty by default.
gcode:

[gcode_macro _INDX_SAFE_Z_HOP]
description: Inner - clear Z to probe_z_clearance before any axis home
# Hop before Y moves: a lift can reach one docked tool at most, a Y move at
# Z near 0 scrapes the bed. [EL-HOM-027]
# blind_hopped: one blind hop per unknown-Z period (else repeated X/Y homes
# walk the gantry up); void once the Z motors were off. [EL-HOM-015]
variable_blind_hopped: False
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set z_clr = tp.probe_z_clearance|float %}
    {% set z_on = printer.stepper_enable.steppers["stepper_z"]|default(false) if "stepper_enable" in printer else false %}
    {% if "z" not in printer.toolhead.homed_axes %}
        {% if not blind_hopped or not z_on %}
            SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
            G91
            G0 Z{z_clr} F{tp.home_z_feedrate|default(900)|int}
            G90
            # Empty SET_HOMED= is required: CLEAR_HOMED=Z alone defaults SET_HOMED=XYZ
            SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
            SET_GCODE_VARIABLE MACRO=_INDX_SAFE_Z_HOP VARIABLE=blind_hopped VALUE=True
            RESPOND MSG="INDX: blind Z hop +{z_clr}mm (Z was not homed)"
        {% endif %}
    {% elif printer.toolhead.position.z|float < z_clr %}
        G90
        G0 Z{z_clr} F{tp.home_z_feedrate|default(900)|int}
    {% endif %}

[gcode_macro _INDX_HOME_VERIFY]
description: Inner - settle, decide whether a tool is seated, store the answer
# Returns to its caller, which dispatches next (Klipper refuses to re-enter
# a macro still on the stack, and G28 can read the seat twice).
# [EL-HOM-016]
# A bad reading raises and aborts the whole G28.
variable_last_ok: -1
variable_last_force_g: 0.0
variable_last_err: ""
variable_settle_ms: 800
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    # Uncalibrated load cell: the recorded tool answers [EL-HOM-017]
    {% set calibrated = printer.load_cell_probe.is_calibrated|default(false) if "load_cell_probe" in printer else false %}
    {% if tp.home_check_seat|default(false) and calibrated and "scanner_z_seek" in printer and "LOAD_CELL_Z_HOME" in tp.home_z_cmd|default("")|string|upper %}
        # The load cell zero drifts, so with the scanner the capped load cell
        # home checks the seat by geometry (no touch, or a touch far off,
        # stops). [EL-HOM-010]
        _INDX_HOME_SEAT_FROM_STATE
    {% elif tp.home_check_seat|default(false) and calibrated %}
        M400
        G4 P{printer["gcode_macro _INDX_HOME_VERIFY"].settle_ms|int}
        # G4 only queues the dwell: this M400 waits it out before the read
        M400
        _INDX_HOME_READ_CELL
    {% else %}
        _INDX_HOME_SEAT_FROM_STATE
    {% endif %}
    _INDX_HOME_VERIFY_RAISE

[gcode_macro _INDX_HOME_SEAT_FROM_STATE]
description: Inner - seat check off: answer from active_tool instead of the cell
# last_ok from active_tool, so the AFTER macros' contradiction branches never match
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_ok VALUE={1 if act >= 0 else 0}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_force_g VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_err VALUE='""'

[gcode_macro _INDX_HOME_READ_CELL]
description: Inner - store the seat reading, or the reason there is none
gcode:
    {% set min_g = printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(590.0)|float %}
    {% set ns = namespace(ok=0, force=0.0, err="") %}

    {% if 'load_cell_probe' not in printer %}
        {% set ns.err = "Cannot home Z: [load_cell_probe] is missing. Add it to printer.cfg, FIRMWARE_RESTART, then G28." %}
    {% else %}
        {% set lc = printer.load_cell_probe %}
        {% set fg = lc.force_g|default(none) %}
        {% if not lc.is_calibrated|default(false) or fg is none %}
            {% set ns.err = "Cannot home Z: load cell is not calibrated. Run INDX_CAL_LOADCELL with an empty head (it walks you through it), or INDX_SETUP." %}
        {% else %}
            {% set cfgl = printer.configfile.settings.load_cell_probe %}
            {% set ref = cfgl.reference_tare_counts %}
            {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
            {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
            # Counted from the empty-head calibration, not the last tare
            {% set ns.force = fg|float + inv * (lc.tare_counts|float - ref|float) / lc.counts_per_gram|float %}
            # Signed: seated reads seat_sign * at least min_g [EL-HOM-018]
            {% if ns.force * printer["gcode_macro _INDX_CONSTANTS"].seat_sign|default(-1)|float >= min_g %}
                {% set ns.ok = 1 %}
            {% endif %}
        {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_ok VALUE={ns.ok}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_force_g VALUE={ns.force}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_err VALUE='"{ns.err}"'

[gcode_macro _INDX_HOME_VERIFY_RAISE]
description: Inner - fail closed if the load cell is missing or uncalibrated
gcode:
    {% set v = printer["gcode_macro _INDX_HOME_VERIFY"] %}
    {% if v.last_err %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"{v.last_err}"'
        _INDX_HOME_Z_FAIL
    {% endif %}

[gcode_macro _INDX_HOME_Z]
description: Inner - load-cell verify, then keep the seated reference tool or pick it, then probe Z
variable_z_faked: 0
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=0
    {% if "xy" not in printer.toolhead.homed_axes %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z until X and Y are homed. Run G28, or G28 X Y then G28 Z."'
        _INDX_HOME_Z_FAIL
    {% else %}
        # Mark Z homed at the current height so G0 XY is allowed before the probe.
        {% if "z" not in printer.toolhead.homed_axes %}
            SET_KINEMATIC_POSITION SET_HOMED=Z
            SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=1
        {% endif %}
        _INDX_HOME_VERIFY
        _INDX_HOME_UNVERIFIED
        _INDX_HOME_PUSH_CHECK
        _INDX_HOME_Z_AFTER_SOFT
    {% endif %}

[gcode_macro _INDX_HOME_UNVERIFIED]
description: Inner - a stop kept a tool recorded on the head without proof (tool_unverified): the record alone does not pass the seat check, the push test or INDX_CONFIRM_TOOL has to
# Set by stops that keep a tool recorded "may be on the head"; cleared by a
# passed seat check, the push test, INDX_CONFIRM_TOOL or an empty-head record. [EL-HOM-019]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set v = printer["gcode_macro _INDX_HOME_VERIFY"] %}
    {% if svv.tool_unverified|default(0)|int and svv.active_tool|default(-1)|int >= 0 and v.last_ok|int == 1 and not v.last_err %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_ok VALUE=0
        RESPOND MSG="INDX > G28: T{svv.active_tool|int} is recorded on the head but was not confirmed there since a stop; checking it before homing Z"
    {% endif %}

[gcode_macro _INDX_HOME_PUSH_CHECK]
description: Inner - the cell weighs the head empty but active_tool names a tool: ask the tool itself (filament pushed against its plug) or a hand confirmation (INDX_CONFIRM_TOOL)
# Drift-free test: a tool on the head pushes its filament against the cold
# plug and the cell sees a rise; an empty head does not. [EL-HOM-009]
# confirmed: tool set by INDX_CONFIRM_TOOL, used once (-1 = none).
# rise_g: force rise, g, that proves the tool. speed: mm/s.
variable_confirmed: -1
variable_rise_g: 260
variable_speed: 2.0
gcode:
    {% set v = printer["gcode_macro _INDX_HOME_VERIFY"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set me = printer["gcode_macro _INDX_HOME_PUSH_CHECK"] %}
    {% if v.last_ok|int != 1 and act >= 0 and not v.last_err %}
        {% if me.confirmed|int == act %}
            SET_GCODE_VARIABLE MACRO=_INDX_HOME_PUSH_CHECK VARIABLE=confirmed VALUE=-1
            SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_ok VALUE=1
            SAVE_VARIABLE VARIABLE=tool_unverified VALUE=0
            RESPOND MSG="INDX > G28: the load cell reads {'%.0f'|format(v.last_force_g|float)} g (looks empty); T{act} confirmed on the head by hand (INDX_CONFIRM_TOOL)"
        {% elif printer["gcode_macro TOOL_POSITIONS"].clearance_y is not number or (printer.toolhead.position.y|float - printer["gcode_macro TOOL_POSITIONS"].clearance_y|float) * printer["gcode_macro TOOL_POSITIONS"].dock_dir|float > 0.001 %}
            # Behind the clearance line the extruder could drive a dock's latch
            RESPOND TYPE=error MSG="INDX > G28: the head is behind the dock clearance line, so T{act} cannot be checked by pushing its filament"
        {% elif "tmc_sg_log" not in printer %}
            # The push needs SG_HOME_E (INDX Suite) [EL-HOM-020]
            RESPOND TYPE=error MSG="INDX > G28: T{act} cannot be checked by pushing its filament on this install (no tmc_sg_log)"
        {% elif printer["gcode_macro _INDX_LOCK_MARK"].short|int and not printer["gcode_macro _INDX_LOCK_MARK"].cleared|int %}
            # Short of the release the extruder drives the latch: no push
            RESPOND TYPE=error MSG="INDX > G28: T{act}'s last lock stopped short of the release (frozen filament), so it cannot be checked by pushing its filament"
        {% else %}
            {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
            # Forward by the tool's recorded retraction + 1 mm (5 to 12 mm);
            # a rise of rise_g stops it
            {% set dist = [[printer.save_variables.variables["t%d_retracted" % act]|default(0)|float + 1.0, 5.0]|max, 12.0]|min %}
            SG_HOME_E DIST={"%.3f"|format(dist)} SPEED={me.speed} CURRENT={c.run_current} STEALTH=0 THRESH=0 LC_DELTA={me.rise_g} LC_SIGN=-1 IGNORE=0.05
            _INDX_HOME_PUSH_EVAL TOOL={act} DIST={dist}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_HOME_PUSH_EVAL]
description: Inner - read the push test: a force rise means the tool is on the head
gcode:
    {% set r = printer.tmc_sg_log|default({}) %}
    {% set act = params.TOOL|int %}
    {% set v = printer["gcode_macro _INDX_HOME_VERIFY"] %}
    {% set moved = r.moved_mm|default(0)|float %}
    {% if r.triggered|default(0)|int %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_ok VALUE=1
        SAVE_VARIABLE VARIABLE=tool_unverified VALUE=0
        # The push fed the filament this far: the next prime refills that much less
        {% set left = [printer.save_variables.variables["t%d_retracted" % act]|default(0)|float - moved, 0.0]|max %}
        SAVE_VARIABLE VARIABLE=t{act}_retracted VALUE={"%.3f"|format(left)}
        RESPOND MSG="INDX > G28: the load cell weighed {'%.0f'|format(v.last_force_g|float)} g (looks empty), but T{act}'s filament met its plug after {'%.2f'|format(moved)} mm: T{act} is on the head (the weighing's zero has drifted)"
    {% else %}
        RESPOND TYPE=error MSG="INDX > G28: pushed T{act}'s filament {'%.2f'|format(moved)} mm and the load cell saw no rise: the head may be empty, or T{act} has no filament at the nozzle"
    {% endif %}

[gcode_macro INDX_CONFIRM_TOOL]
description: After G28 refused because the load cell and active_tool disagree: say the recorded tool really is on the head (look first). The next G28 trusts it once. TOOL=<n>, must match active_tool. Moves: nothing
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set t = params.TOOL|default(-1)|int %}
    {% if t < 0 or t != act %}
        {action_raise_error("INDX_CONFIRM_TOOL: TOOL=%d does not match active_tool (T%d). If another tool is on the head, use INDX_SEAT_TOOL_BY_HAND; if the head is empty, INDX_FORGET_TOOL." % (t, act))}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_PUSH_CHECK VARIABLE=confirmed VALUE={t}
    RESPOND MSG="T{t} confirmed on the head: the next G28 trusts it once (a tool change or park first cancels it). Run G28."

[gcode_macro _INDX_HOME_Z_AFTER_SOFT]
description: Inner - after verify: refuse an ambiguous seat, otherwise make the reference tool the one that probes
# G28 Z always probes with the reference tool (file header, step 4).
gcode:
    {% set ref = printer.save_variables.variables.ref_tool|default(0)|int %}
    {% set last_ok = printer["gcode_macro _INDX_HOME_VERIFY"].last_ok|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    # The seat check is the load cell, not the saved tool number or the latch
    # state, so a refusal has to say what the cell read. Without it an empty
    # head and a mistared cell with a tool bolted in give the same message.
    {% set fg_s = "%.0f"|format(printer["gcode_macro _INDX_HOME_VERIFY"].last_force_g|float) %}
    {% set min_s = "%.0f"|format(printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(590.0)|float) %}

    {% if last_ok == 1 and act < 0 %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: the load cell sees a tool but active_tool is unknown. If you placed it by hand, run INDX_SEAT_TOOL_BY_HAND TOOL=<n> to lock and claim it. If it came from a dock, CHANGE_TOOL TOOL=<n>. If the head is really empty, INDX_FORGET_TOOL. Then G28."'
        _INDX_HOME_Z_FAIL
    {% elif last_ok != 1 and act >= 0 %}
        # The cell says empty, the saved tool says T{act}. One of them is wrong
        # and nothing here can tell which. Parking a tool that is not in the
        # gripper drives it into a dock, so refuse and let a human say which is
        # true, the same way the opposite disagreement above is refused.
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: load cell reads {fg_s} g (empty, needs {min_s} g) but active_tool says T{act}. These disagree, and pushing its filament did not settle it either, so INDX will not move. Look at the head. T{act} on it: INDX_CONFIRM_TOOL TOOL={act}, then G28 (the cell zero has drifted: INDX_CAL_LOADCELL with an empty head when convenient). Head empty: INDX_FORGET_TOOL, then G28."'
        _INDX_HOME_Z_FAIL
    {% elif act == ref and last_ok == 1 %}
        # The reference tool already seated: the one case that can probe
        # straight away. Its offsets are 0 by definition.
        {% set svv = printer.save_variables.variables %}
        {% set global_z = svv.global_z_offset|default(0.0)|float %}
        SET_GCODE_OFFSET X=0 Y=0 Z='{"%.3f"|format(global_z)}' MOVE=0
        _INDX_Z_APPLIED Z={"%.4f"|format(global_z)}
        _INDX_HOME_Z_PROBE
    {% else %}
        # Empty head or another tool: fetch the reference (parking the other first)
        _INDX_HOME_FETCH_T0
        _INDX_HOME_Z_AFTER_HARD
    {% endif %}

[gcode_macro _INDX_HOME_FETCH_T0]
description: Inner - park whatever is seated and pick the reference tool (ref_tool), without going through CHANGE_TOOL
# Not CHANGE_TOOL: it can run G28, which would re-enter the homing override
# (Klipper: "called recursively"). homing_busy keeps the park and pickup
# from homing too. [EL-HOM-016]
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set v  = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set zhop = tp.z_hop|float %}
    # Z is fake-homed by now, so gcode_position.z is readable and _TC_G0 Z works.
    {% set restore_z = "%.3f"|format(printer.gcode_move.gcode_position.z) %}
    {% set live_vel = printer.toolhead.max_velocity %}
    {% set live_acc = printer.toolhead.max_accel %}
    {% set max_v = printer.configfile.settings.printer.max_velocity %}
    {% set max_a = printer.configfile.settings.printer.max_accel %}

    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=1
    SET_VELOCITY_LIMIT VELOCITY={max_v * v.speed_mult} ACCEL={max_a * v.accel_mult}
    {% set svv = printer.save_variables.variables %}
    {% set ref = printer.save_variables.variables.ref_tool|default(0)|int %}
    {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=before_change FROM={act} TO={ref}{% endif %}
    {% if svv["t%d_dock_new" % ref]|default(0)|int or (act >= 0 and svv["t%d_dock_new" % act]|default(0)|int) %}
        _INDX_SLOW_SET SLOW=1 WHY="First contact with a newly measured dock"
    {% endif %}
    {% if act != -1 %}
        _PARK_TOOL_APPLY ZHOP={zhop}
    {% endif %}
    M400
    _PICKUP_TOOL TOOL={ref} TARGET=0 ZHOP={0.0 if act != -1 else zhop} RESTORE_Z={restore_z} SKIP_Z_CORRECTION=0
    _RESTORE_EXTRUDER_CURRENT
    _INDX_SLOW_SET SLOW=0
    SET_VELOCITY_LIMIT VELOCITY={live_vel} ACCEL={live_acc}
    {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=change_done{% endif %}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0

[gcode_macro _INDX_HOME_Z_AFTER_HARD]
description: Inner - after the reference tool's pickup: probe only when the pickup's own seat check passed
# Judged by the pickup's own seat check (drift-free), not by active_tool:
# a pickup that failed or holds never probes Z. [EL-HOM-021]
gcode:
    {% set ref = printer.save_variables.variables.ref_tool|default(0)|int %}
    {% set sc = printer["gcode_macro _INDX_SEAT_CHECK"] %}
    {% set held = printer["gcode_macro _PICKUP_SEAT_FAIL"].held|default(0)|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% if not sc.ok|int or held or act != ref %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: T{ref} (the reference tool) was not seated after the pickup (load cell {sc.force_g|float|round(0)|int} g against the empty head). Check the T{ref} dock and the head, then G28."'
        _INDX_HOME_Z_FAIL
    {% else %}
        _INDX_HOME_Z_PROBE
    {% endif %}

[gcode_macro _INDX_HOME_Z_PROBE]
description: Inner - the reference tool is seated: probe Z, unless its latch is short of the release (frozen filament): then _INDX_HOME_Z_DECIDE unfreezes it first or asks
gcode:
    _INDX_LOCK_REFRESH
    _INDX_HOME_Z_DECIDE

[gcode_macro _INDX_HOME_FROZEN]
description: Inner - state of the G28 path for a reference tool short of the release: probe_temp (C: the unfrozen tool cools to it, part fan on, before the load cell home, as a cold G28 probes)
variable_probe_temp: 70
gcode:

[gcode_macro _INDX_TOOL_EXP]
description: Setting - the expansion profile of each tool (INDX_CAL_TOOL_EXPANSION, saved per tool in t<n>_expansion): how it is measured and when INDX uses it. INDX_SETTING MACRO=_INDX_TOOL_EXP VAR=max_err_mm (or max_temp)
# Each tool has its own profile, measured empty up to max_temp. [EL-CAL-014]
# max_err_mm: mm; a profile is used only when known to this at 5.2 sigma and
#   its closing cold taps land this close. [EL-HOM-029]
# min_dt: C over the cold reference below which G28 treats the nozzle as cold.
# tol: C outside the calibrated range still read at its end; further: no correction.
# max_temp: C, top of the calibration, at most the heater's max_temp - 15
#   (a PID overshoot at max_temp shuts Klipper down).
# step: C between temperatures; samples: taps each; soak: s held before them;
# band: +- C the wait ends in; cold_max: C the cold taps wait under, fan on.
variable_max_err_mm: 0.02
variable_min_dt: 5.0
variable_tol: 2.0
variable_max_temp: 250
variable_step: 25
variable_samples: 3
variable_soak: 45
variable_band: 2.0
variable_cold_max: 40
gcode:

[gcode_macro INDX_TOOL_EXPANSION]
description: How much further TOOL=n's nozzle reaches at TO= than at FROM=, mm, from its expansion profile (INDX_CAL_TOOL_EXPANSION): positive = longer at TO. FROM= and TO= are C, "now" (the nozzle now) or "cold" (the profile's cold reference), by default FROM=now TO=cold. Only inside the calibrated range (no extrapolation): outside it, or without a usable profile, 0 and a note. QUIET=1: no console line (callers read ofs, ok, why). Moves: nothing
# ofs: the result, mm (0 when ok is 0); ok: 1 = from a usable profile, inside
#   its range; why: the note when ok is 0; t_from, t_to: the temperatures
#   used; tool: the tool asked about
variable_ofs: 0.0
variable_ok: 0
variable_why: ""
variable_t_from: 0.0
variable_t_to: 0.0
variable_tool: -1
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set t = params.TOOL|default(svv.active_tool|default(-1))|int %}
    {% set g = printer["gcode_macro _INDX_TOOL_EXP"] %}
    {% set pf = svv["t%d_expansion" % t]|default(none) if t >= 0 else none %}
    {% set has = pf is mapping and pf.pts is defined and pf.pts|length >= 2 %}
    {% set now = printer[printer.toolhead.extruder].temperature|float %}
    {% set cold = pf.pts[0][0]|float if has else 0.0 %}
    {% set ns = namespace(tt=[], v=[], why="") %}
    {% for s in [params.FROM|default("now")|string|lower, params.TO|default("cold")|string|lower] %}
        {% set ns.tt = ns.tt + [now if s == "now" else (cold if s == "cold" else s|float)] %}
    {% endfor %}
    {% if t < 0 %}
        {% set ns.why = "no tool on the head" %}
    {% elif not has %}
        {% set ns.why = "T%d has no expansion profile (INDX_CAL_TOOL_EXPANSION TOOL=%d)" % (t, t) %}
    {% elif not pf.use|default(0)|int %}
        {% set ns.why = "the T%d expansion profile is not used: %s" % (t, pf.why|default("see its calibration")) %}
    {% elif pf.err|float > g.max_err_mm|float %}
        {% set ns.why = "the T%d expansion profile is known to %.4f mm, more than %.3f mm (max_err_mm)" % (t, pf.err|float, g.max_err_mm|float) %}
    {% else %}
        {% set lo = pf.pts[0][0]|float %}
        {% set hi = pf.pts[-1][0]|float %}
        {% for x in ns.tt if not ns.why and (x < lo - g.tol|float or x > hi + g.tol|float) %}
            {% set ns.why = "%.1f C is outside the calibrated range of T%d (%.0f to %.0f C): no extrapolation" % (x, t, lo, hi) %}
        {% endfor %}
        {% if not ns.why %}
            # piecewise linear between the profile points, sorted by temperature
            {% for x0 in ns.tt %}
                {% set x = [[x0, lo]|max, hi]|min %}
                {% set k = namespace(i=0) %}
                {% for p in pf.pts[1:-1] if p[0]|float <= x %}{% set k.i = loop.index %}{% endfor %}
                {% set a = pf.pts[k.i] %}
                {% set b = pf.pts[k.i + 1] %}
                {% set f = (x - a[0]|float) / (b[0]|float - a[0]|float) if b[0]|float > a[0]|float else 0.0 %}
                {% set ns.v = ns.v + [a[1]|float + f * (b[1]|float - a[1]|float)] %}
            {% endfor %}
        {% endif %}
    {% endif %}
    {% set ok = not ns.why %}
    {% set ofs = (ns.v[1] - ns.v[0]) if ok else 0.0 %}
    SET_GCODE_VARIABLE MACRO=INDX_TOOL_EXPANSION VARIABLE=ofs VALUE={"%.5f"|format(ofs)}
    SET_GCODE_VARIABLE MACRO=INDX_TOOL_EXPANSION VARIABLE=ok VALUE={1 if ok else 0}
    SET_GCODE_VARIABLE MACRO=INDX_TOOL_EXPANSION VARIABLE=why VALUE='{ns.why|tojson}'
    SET_GCODE_VARIABLE MACRO=INDX_TOOL_EXPANSION VARIABLE=t_from VALUE={"%.2f"|format(ns.tt[0])}
    SET_GCODE_VARIABLE MACRO=INDX_TOOL_EXPANSION VARIABLE=t_to VALUE={"%.2f"|format(ns.tt[1])}
    SET_GCODE_VARIABLE MACRO=INDX_TOOL_EXPANSION VARIABLE=tool VALUE={t}
    {% if not params.QUIET|default(0)|int %}
        {% if ok %}
            RESPOND MSG="INDX > T{t} nozzle: {'%+.4f'|format(ofs)} mm longer at {'%.1f'|format(ns.tt[1])} C than at {'%.1f'|format(ns.tt[0])} C (expansion profile of {pf.date|default('?')}, known to {'%.4f'|format(pf.err|float)} mm)"
        {% else %}
            RESPOND MSG="INDX > T{t}: no expansion correction: {ns.why}"
        {% endif %}
    {% endif %}

[gcode_macro _INDX_HOME_EXPAND_FIX]
description: Inner - right after a load cell home with a warm nozzle and INDX_TOOL_EXPANSION FROM=now TO=cold (renders then): the nozzle was longer than at its cold reference by d, so it touched that much early; Z := Z + d, the frame a cold home gives. Outside the profile range: Z as homed, one line
# d = E(T) - E(cold) = -ofs: a warm nozzle touches d early, so a cold home
# would read d more Z here.
gcode:
    {% set r = printer["gcode_macro INDX_TOOL_EXPANSION"] %}
    {% set z = printer.toolhead.position.z|float %}
    {% if r.ok|int %}
        {% set d = 0.0 - r.ofs|float %}
        RESPOND MSG="INDX > G28: touched at {r.t_from|float|round(1)} C: the T{r.tool|int} nozzle is {'%+.4f'|format(d)} mm longer than at its cold reference {r.t_to|float|round(1)} C (its expansion profile), Z {'%.4f'|format(z)} becomes {'%.4f'|format(z + d)}"
        SET_KINEMATIC_POSITION Z={"%.4f"|format(z + d)} SET_HOMED=Z
    {% else %}
        RESPOND MSG="INDX > G28: no expansion correction ({r.why}): Z as homed"
    {% endif %}

[gcode_macro _INDX_REF_CLEAN]
description: Setting - G28 with filament in the reference tool: prime and clean it in its purge lane slot (PRIME_CLEAN) before the load cell homes Z, and loads of the reference tool purge in that slot instead of at a purge station. INDX_SETTING MACRO=_INDX_REF_CLEAN VAR=enabled VALUE=0 turns it off
# Ooze left by a load makes the touch come early; a clean on the bed is more
# reliable than a purge station. [EL-HOM-001]
# enabled: True/False. Needs Z without a touch first (scanner, or still
# homed) and the purge lane on; otherwise the tool probes as it is. A tool
# flagged clean (t<n>_clean 1) is not cleaned again; every probe check runs.
variable_enabled: True
gcode:

[gcode_macro _INDX_REF_CLEAN_MAYBE]
description: Inner - G28, the tool fully locked (also right after an unfreeze, its own macro so the clean flag is read after it): the reference tool with filament in it and not flagged clean gets _INDX_REF_CLEAN_RUN before the load cell home. UNFROZE=1 (right after _INDX_HOME_UNFREEZE COOL=0, the nozzle hot): the clean starts hot; no clean: cool to probe_temp here
gcode:
    {% set act = params.TOOL|int %}
    {% set svv = printer.save_variables.variables %}
    {% set rc = printer["gcode_macro _INDX_REF_CLEAN"] if "gcode_macro _INDX_REF_CLEAN" in printer else {} %}
    {% set loaded = svv["t%d_material" % act]|default("")|string|upper not in ["", "NONE"] or svv["t%d_fil_density" % act]|default(0)|float > 0 %}
    {% if rc.enabled|default(False) and act >= 0 and act == svv.ref_tool|default(0)|int and loaded and act not in printer["gcode_macro TOOL_POSITIONS"].no_heat_tools|default([]) %}
        # flagged clean: no clean; the flag never skips a probe check
        {% if svv["t%d_clean" % act]|default(0)|int == 1 %}
            RESPOND MSG="INDX > G28: T{act} is flagged clean since {svv['t%d_clean_note' % act]|default('its last clean')}: no clean before homing"
            {% if params.UNFROZE|default(0)|int %}
                _INDX_HOME_FROZEN_COOL
            {% endif %}
        {% else %}
            _INDX_REF_CLEAN_RUN TOOL={act}{' UNFROZE=1' if params.UNFROZE|default(0)|int else ''}
        {% endif %}
    {% elif params.UNFROZE|default(0)|int %}
        # no clean follows the unfreeze: cool to probe_temp here
        _INDX_HOME_FROZEN_COOL
    {% endif %}

[gcode_macro _INDX_REF_CLEAN_RUN]
description: Inner - G28, the reference tool fully locked with filament in it (_INDX_REF_CLEAN on): Z without touching (scanner, or still homed), PRIME_CLEAN in its purge lane slot, cool, before the load cell home. No scanner and Z not homed, or the purge lane off: it probes as it is
gcode:
    {% set t = params.TOOL|int %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set mat = svv["t%d_material" % t]|default("")|string %}
    {% set faked = printer["gcode_macro _INDX_HOME_Z"].z_faked|int %}
    {% set off = "INDX_SETTING MACRO=_INDX_REF_CLEAN VAR=enabled VALUE=0 turns this off" %}
    {% set unfroze = params.UNFROZE|default(0)|int %}
    {% if not tp.prime_enabled|default(True) %}
        RESPOND MSG="INDX > G28: T{t}, the reference tool, has filament in it, but the purge lane is off (prime_enabled): it is not cleaned on the bed and probes as it is"
        {% if unfroze %}
        _INDX_HOME_FROZEN_COOL
        {% endif %}
    {% elif faked and "scanner_z_seek" not in printer %}
        RESPOND MSG="INDX > G28: T{t}, the reference tool, has filament in it, but it cannot be cleaned on the bed before Z is known (no eddy scanner): it probes as it is"
        {% if unfroze %}
        _INDX_HOME_FROZEN_COOL
        {% endif %}
    {% else %}
        RESPOND MSG="INDX > G28: T{t}, the reference tool, has {mat or 'filament'} in it: {'Z from the scanner first, then ' if faked else ''}a prime and clean in its purge lane slot (PRIME_CLEAN{', starting hot from the unfreeze' if unfroze else ''}) and a cooldown before the load cell homes Z. {off}"
        {% if faked %}
            G90
            _INDX_TO_LANE
            SCANNER_Z_SEEK
            # PRIME_CLEAN's taps assume a load cell Z frame
            _INDX_REF_CLEAN_ZFIX TOOL={t}
        {% endif %}
        _PRIME_SLOTS COUNT={tp.tool_count|int}
        # the next free slot via PRIME_GRID's bookkeeping, kept used for
        # this print start [EL-HOM-006]
        _INDX_REF_CLEAN_TAKE
        _INDX_REF_CLEAN_PRIME TOOL={t} FAKED={faked}{' UNFROZE=1' if unfroze else ''}
        _INDX_REF_CLEAN_NOTE
        _INDX_REF_CLEAN_CHECK TOOL={t}
        _INDX_HOME_FROZEN_COOL
    {% endif %}

[gcode_macro _PURGE_LANE_PRE]
description: Inner - the purge lane slots this print start has used before PRIME_GRID (the reference tool's clean in G28, _PURGE_LANE pre) marked taken on the current layout, nothing else: the start of a print start's slot bookkeeping (PRIME_GRID, and each G28 clean outside a running prime)
# pre holds [x, y] slot starts, not indexes (G28 and PRIME_GRID lay the lane
# out differently); a slot overlapping one counts as used. Filled in a print
# only, cleared at its end or cancel.
gcode:
    {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
    {% set slots = st.slots|default([]) %}
    {% set pre = printer["gcode_macro _PURGE_LANE"].pre|default([]) %}
    {% set w, h = st.slot_x|float - 0.01, st.slot_y|float - 0.01 %}
    {% set taken = [] %}
    {% for i in range(slots|length) %}
        {% set ns = namespace(hit=False) %}
        {% for p in pre if (slots[i][0]|float - p[0]|float)|abs < w and (slots[i][1]|float - p[1]|float)|abs < h %}
            {% set ns.hit = True %}
        {% endfor %}
        {% if ns.hit %}{% set _ = taken.append(i) %}{% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=taken VALUE="{taken}"
    SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=used_n VALUE={taken|length}
    SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=wrapped VALUE=0

[gcode_macro _INDX_REF_CLEAN_TAKE]
description: Inner - _INDX_REF_CLEAN_RUN once the slots are laid out: the reference tool's clean takes the next free purge lane slot (a spare, not a tool's own), as PRIME_GRID would
gcode:
    # Outside a running PRIME_GRID: rebuild the used slots on this layout
    {% if not printer["gcode_macro PRIME_GRID"].grid %}
        _PURGE_LANE_PRE
    {% endif %}
    _PURGE_LANE_TAKE OWN=-1

[gcode_macro _INDX_REF_CLEAN_NOTE]
description: Inner - after the reference tool's clean in G28 in a print: keep the slots it used (the one it took, and any PRIME_CLEAN moved on to from an old line) as used for this print start (_PURGE_LANE pre), so PRIME_GRID skips them
gcode:
    {% if printer.print_stats.state in ("printing", "paused") %}
    {% set pl = printer["gcode_macro _PURGE_LANE"] %}
    {% set slots = printer["gcode_macro _PRIME_SETTINGS"].slots|default([]) %}
    {% set pre = pl.pre|default([])|list %}
    {% for i in pl.taken if i < slots|length and slots[i][:2] not in pre %}
        {% set _ = pre.append(slots[i][:2]) %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=pre VALUE="{pre}"
    {% endif %}

[gcode_macro _INDX_REF_CLEAN_PRIME]
description: Inner - _INDX_REF_CLEAN_RUN once its slot is taken (renders then): PRIME_CLEAN of TOOL in the purge lane slot _INDX_REF_CLEAN_TAKE gave it, at its print temperature, as the print start primes a tool
gcode:
    {% set t = params.TOOL|int %}
    {% set svv = printer.save_variables.variables %}
    {% set slots = printer["gcode_macro _PRIME_SETTINGS"].slots|default([]) %}
    {% set pl = printer["gcode_macro _PURGE_LANE"] %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set mat = svv["t%d_material" % t]|default("")|string|upper %}
    {% set pre = printer["gcode_macro LOAD_FILAMENT"].filament_presets|default({}) if "gcode_macro LOAD_FILAMENT" in printer else {} %}
    # its recorded print temperature, else its material's preset, else 230 C
    {% set temp = svv["t%d_temp" % t]|default(0)|int if svv["t%d_temp" % t]|default(0)|int > 0 else (pre[mat].temp|default(230)|int if mat in pre else 230) %}
    {% if pl.got|int and pl.cur|int >= 0 and slots|length > pl.cur|int %}
        {% set sl = slots[pl.cur|int] %}
        # COAST and LANE=1 as PRIME_GRID passes them. HOT_START=1: hot after
        # an unfreeze. DIRTY=1: tip known dirty, a cold blob tap reheats
        # instead of stopping.
        {% set unfroze = params.UNFROZE|default(0)|int %}
        {% set dirty = unfroze or ("t%d_clean" % t in svv and svv["t%d_clean" % t]|int == 0) %}
        PRIME_CLEAN TEMP={temp} X={"%.2f"|format(sl[0]|float - o.x|float)} Y={"%.2f"|format(sl[1]|float - o.y|float)} COAST={printer["gcode_macro _INDX_REF_CLEAN_ZFIX"].coast|int if params.FAKED|default(0)|int else 20} LANE=1{' HOT_START=1' if unfroze else ''}{' DIRTY=1' if dirty else ''}
    {% else %}
        RESPOND MSG="INDX > G28: no purge lane slot for T{t}: it is not cleaned on the bed and probes as it is"
    {% endif %}

[gcode_macro _INDX_REF_CLEAN_ZFIX]
description: Inner - right after SCANNER_Z_SEEK in the reference tool's G28 clean (renders then): move Z from the scanner frame onto the load cell frame by the expected load cell touch at this bed temperature (scanner_z_seek touch_ref); too few homes: Z as the scanner set it and no hot coast (coast 0)
# Z := Z - dev, as LOAD_CELL_Z_HOME does (dev > 0: the touch came early).
# touch_ref is per bed temperature, from scanner-seek touches only (clean
# homes first, outliers dropped). [EL-HOM-005]
# coast: the COAST the clean runs with (20 with a correction, 0 without: no
# hot coast in an unknown frame, cold wipe only)
variable_coast: 20
gcode:
    {% set tr = printer.scanner_z_seek.touch_ref|default({}) if "scanner_z_seek" in printer else {} %}
    {% set z = printer.toolhead.position.z|float %}
    {% if "dev" in tr and tr["dev"] is not none %}
        {% set med = tr["dev"]|float %}
        SET_GCODE_VARIABLE MACRO=_INDX_REF_CLEAN_ZFIX VARIABLE=coast VALUE=20
        RESPOND MSG="INDX > G28: scanner Z moved onto the load cell frame by {tr.src} ({'%+.3f'|format(med)} mm, bed {('%.0f C'|format(tr["bed"]|float)) if tr["bed"] is not none else 'unknown'}): Z {'%.3f'|format(z)} is {'%.3f'|format(z - med)} for the clean"
        SET_KINEMATIC_POSITION Z={"%.4f"|format(z - med)} SET_HOMED=Z
    {% else %}
        SET_GCODE_VARIABLE MACRO=_INDX_REF_CLEAN_ZFIX VARIABLE=coast VALUE=0
        RESPOND MSG="INDX > G28: not enough load cell homes against the scanner yet ({tr["n"] if "n" in tr else 0} of 5 usable, none at this bed temperature): Z stays as the scanner set it, and T{params.TOOL|default('?')} is cleaned without the hot coast on the bed (cold wipe only)"
    {% endif %}

[gcode_macro _INDX_Z_TOUCH_NOTE]
description: Inner - after a successful scanner-Z load cell home (renders then): with the reference tool clean or empty (CLEAN=1), keep its touch (the last z_touch_hist entry, [touch, bed C]) in z_scan_touch_clean, the last 30
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set raw = svv.z_touch_hist|default([]) %}
    {% if params.CLEAN|default(0)|int and raw is iterable and raw is not string and raw|length > 0 %}
        {% set cl = svv.z_scan_touch_clean|default([]) %}
        {% set cl = cl|list if cl is iterable and cl is not string else [] %}
        {% set ns = namespace(out=[]) %}
        # entries: [touch, bed, kind], [touch, bed] or a plain number (all read)
        {% for e in (cl + [raw[-1]])[-30:] %}
            {% if e is iterable and e is not string %}
                {% set ns.out = ns.out + ["[%.3f,%s%s]" % (e[0]|float, ("%.1f" % e[1]|float) if e[1] is not none else "None", (",%d" % e[2]|int) if e|length > 2 and e[2] is not none else "")] %}
            {% else %}
                {% set ns.out = ns.out + ["%.3f" % e|float] %}
            {% endif %}
        {% endfor %}
        SAVE_VARIABLE VARIABLE=z_scan_touch_clean VALUE=[{ns.out|join(',')}]
    {% endif %}

[gcode_macro _INDX_REF_CLEAN_CHECK]
description: Inner - after the reference tool's PRIME_CLEAN in G28 (renders then): a halted prime (residue, no extrusion) stops the G28, nothing probes
gcode:
    {% if printer["gcode_macro PRIME_CLEAN"].halted|int %}
        M104 S0
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: the prime and clean of T{params.TOOL} (the reference tool) in its purge lane slot stopped (see the PRIME_CLEAN messages above: residue on the nozzle or no extrusion), so INDX does not probe with it. Clean the nozzle or check the filament, then G28 again."'
        _INDX_HOME_Z_FAIL
    {% endif %}

[gcode_macro _INDX_HOME_Z_DECIDE]
description: Inner - G28 Z with the reference tool on the head: probe at once when it is fully locked (the reference tool with filament in it: primed and cleaned in its purge lane slot first, _INDX_REF_CLEAN); short of the release (frozen filament) unfreeze it first: at a purge station (extension), over its purge lane slot (scanner-only Z, or Z still homed), or in the air at the hop height (Z homed after it, then the clean, then Z again)
# Never a load cell probe with a tool short of the release. The unfreeze
# push runs at a purge station (Z need not be known), in the air over the
# purge lane slot (Z from the scanner or still homed), or at the hop height
# (Z not known: then Z, the clean, and Z again). [EL-HOM-002]
# The unfreeze leaves plastic on the tip: the reference clean follows hot
# (COOL=0, UNFROZE=1), since ooze sets under the tip if it cools first. [EL-HOM-003]
gcode:
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set f = printer["gcode_macro _INDX_HOME_FROZEN"] %}
    {% set left = [m.clear_e|float - (printer.toolhead.position.e|float - m.lock_e|float), 0.0]|max %}
    {% set fz = ("may be up to %.2f mm short of the release (its lock could not feel frozen filament)" % left) if m.assumed|default(0)|int else ("is %.2f mm short of the release (frozen filament)" % left) %}
    # the registered unfreeze station, when enabled and calibrated (_INDX_STATIONS, indx_ext.cfg)
    {% set stn = printer["gcode_macro _INDX_STATIONS"].unfreeze if "gcode_macro _INDX_STATIONS" in printer else "" %}
    {% set sto = printer["indx_station " ~ stn] if stn and ("indx_station " ~ stn) in printer else none %}
    {% set seb = sto.enabled_by.split(".") if sto is not none and sto.enabled_by else [] %}
    {% set srw = sto.ready_when.split("=", 1) if sto is not none and sto.ready_when else [] %}
    {% set bucket = sto is not none and (not seb or (("gcode_macro " ~ seb[0]) in printer and printer["gcode_macro " ~ seb[0]][seb[1]]|default(False))) and (not srw or (srw[0] in svv and (srw|length == 1 or svv[srw[0]]|string == srw[1]))) %}
    {% if not (act >= 0 and m.short|int and not m.cleared|int) %}
        # Fully locked: clean on the bed first when loaded [EL-HOM-001]
        {% if act >= 0 %}
            _INDX_REF_CLEAN_MAYBE TOOL={act}
        {% endif %}
        _INDX_HOME_Z_PROBE_RUN
    {% elif bucket %}
        RESPOND MSG="INDX > G28: T{act} {fz}. Unfreezing it at the purge station ({stn}) before Z is probed."
        _INDX_HOME_UNFREEZE TOOL={act} STATION={stn} COOL=0
        # the hot clean follows the unfreeze (above) [EL-HOM-003]
        _INDX_REF_CLEAN_MAYBE TOOL={act} UNFROZE=1
        _INDX_HOME_Z_PROBE_RUN
    {% elif "scanner_z_seek" in printer %}
        RESPOND MSG="INDX > G28: T{act} {fz}. Z from the scanner only, then T{act} is unfrozen over its purge lane slot before the load cell probes."
        {% if printer["gcode_macro _INDX_HOME_Z"].z_faked|int %}
            G90
            _INDX_TO_LANE
            SCANNER_Z_SEEK
        {% endif %}
        _INDX_HOME_UNFREEZE TOOL={act} COOL=0
        # the hot clean follows the unfreeze (above) [EL-HOM-003]
        _INDX_REF_CLEAN_MAYBE TOOL={act} UNFROZE=1
        _INDX_HOME_Z_PROBE_RUN
    {% elif not printer["gcode_macro _INDX_HOME_Z"].z_faked|int %}
        # Z still homed: the push runs in the air as with a scanner
        RESPOND MSG="INDX > G28: T{act} {fz}. Z is still homed, so T{act} is unfrozen over its purge lane slot before the load cell probes."
        _INDX_HOME_UNFREEZE TOOL={act} COOL=0
        # the hot clean follows the unfreeze (above) [EL-HOM-003]
        _INDX_REF_CLEAN_MAYBE TOOL={act} UNFROZE=1
        _INDX_HOME_Z_PROBE_RUN
    {% else %}
        RESPOND MSG="INDX > G28: T{act} {fz} and Z is not known (no eddy scanner, no purge station): T{act} is unfrozen in the air over its purge lane slot at the hop height, cooled, Z homed, cleaned on the bed and Z homed again."
        _INDX_HOME_UNFREEZE TOOL={act} ZKEEP=1
        _INDX_HOME_UNFREEZE_CHECK TOOL={act}
        _INDX_HOME_Z_PROBE_RUN
        _INDX_REF_CLEAN_MAYBE TOOL={act}
        _INDX_HOME_Z_PROBE_RUN
    {% endif %}

[gcode_macro _INDX_HOME_UNFREEZE]
description: Inner - G28: carry the reference tool past the release before the load cell probes it (STATION=<name>: at that purge station; otherwise in the air over its purge lane slot, Z known, or ZKEEP=1: Z not known, at the height the head is at), shape its tip, heater off and cool to probe_temp. COOL=0: the heater stays at print temperature (the reference clean follows hot)
gcode:
    {% set t = params.TOOL|int %}
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set me = printer["gcode_macro INDX_TIP_SHAPE"] %}
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set temp = svv["t%d_temp" % t]|default(0)|int if svv["t%d_temp" % t]|default(0)|int > 0 else 230 %}
    # No tip forming inside a print: the print start primes next [EL-HOM-002]
    {% set form = 0 if printer.print_stats.state in ["printing", "paused"] else 1 %}
    {% if params.STATION|default("")|string %}
        {% set left = [m.clear_e|float - (printer.toolhead.position.e|float - m.lock_e|float), 0.0]|max %}
        {% set push = [left + me.margin|float, me.push_min|float]|max %}
        # No refill (the lock closed any gap): a purge of at least push mm
        # carries the latch past.
        # calls: (the station's command, [indx_station] command:)
        SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE=0
        _INDX_STATION_CHECK NAME={params.STATION}
        # The visit ends scrubbed via the station's clean_param, when it has
        # one: a cooled blob touches high [EL-HOM-004]
        {% set cp = printer["indx_station " ~ params.STATION].clean_param|default("")|string %}
        {printer["indx_station " ~ params.STATION].command} TEMP={temp} REFILL=0 PURGE={"%.1f"|format([10.0, push * 3.1416 * 1.75 * 1.75 / 4.0]|max)}{(" " ~ cp ~ "=1") if cp else ""}
        _INDX_STATION_RETURN NAME={params.STATION}
        _INDX_TIP_SHAPE_TOOL TOOL={t} TEMP={temp} MODE=here FORM={form}
        _INDX_HOME_UNFREEZE_CHECK TOOL={t}
    {% else %}
        {% if tp.prime_enabled|default(True) %}
            _PRIME_SLOTS COUNT={tp.tool_count|int}
        {% endif %}
        # ZKEEP=1 (Z not known): the tip is formed even in a print, so no
        # plastic hangs under the nozzle for the load cell home
        {% set zk = params.ZKEEP|default(0)|int %}
        _INDX_TIP_SHAPE_TOOL TOOL={t} TEMP={temp} MODE=air FORM={1 if zk else form} DX={12 if zk else 4} ZKEEP={zk}
    {% endif %}
    # COOL=0: stays hot for the clean; _INDX_REF_CLEAN_MAYBE cools it if none [EL-HOM-003]
    {% if params.COOL|default(1)|int %}
        _INDX_HOME_FROZEN_COOL
    {% else %}
        RESPOND MSG="INDX > G28: T{t} is past the release: the heater stays at {temp} C, no cooldown before the reference clean"
        M104 S{temp}
    {% endif %}

[gcode_macro _INDX_HOME_UNFREEZE_CHECK]
description: Inner - after the unfreeze (purge station or air): the reference tool must be past the release now, or G28 stops before the load cell probes
gcode:
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% if m.short|int and not m.cleared|int %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: T{params.TOOL} is still short of the release after the unfreeze push, so INDX does not probe with it. Look at the tool and the messages above."'
        _INDX_HOME_Z_FAIL
    {% endif %}

[gcode_macro _INDX_HOME_FROZEN_COOL]
description: Inner - heater off and cool the nozzle to probe_temp before the load cell home, part fan on when the machine has one
gcode:
    {% set pt = printer["gcode_macro _INDX_HOME_FROZEN"].probe_temp|float %}
    M104 S0
    {% set mach = printer["gcode_macro _INDX_MACHINE"] if "gcode_macro _INDX_MACHINE" in printer else {} %}
    {% set pf_name = mach.part_fan|default("")|string %}
    {% set gen = pf_name and ("fan_generic " ~ pf_name) in printer %}
    {% set fo = printer["fan_generic " ~ pf_name] if gen else (printer.fan if "fan" in printer else none) %}
    {% if fo is not none %}
        # the part fan chosen in the hardware checks (a [fan_generic] by name,
        # else [fan]), driven and given back on that fan
        {% set restore = fo.speed|default(0)|float %}
        RESPOND MSG="INDX > G28: heater off, the part fan cools the nozzle to {pt|int} C before Z is probed"
        {% if gen %}SET_FAN_SPEED FAN={pf_name} SPEED=1{% else %}M106 S255{% endif %}
        TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MAXIMUM={pt}
        # the fan speed it found, so a re-home in a pause keeps the print's [EL-HOM-031]
        {% if gen %}
            SET_FAN_SPEED FAN={pf_name} SPEED={"%.3f"|format(restore)}
        {% elif restore > 0 %}
            M106 S{(restore * 255)|round|int}
        {% else %}
            M107
        {% endif %}
    {% else %}
        RESPOND MSG="INDX > G28: heater off, the nozzle cools to {pt|int} C before Z is probed (no part fan: this takes longer)"
        TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MAXIMUM={pt}
    {% endif %}

[gcode_macro _INDX_HOME_Z_PROBE_RUN]
description: Inner - move to probe XY and G28 Z. The tool on the head warm, flagged clean, fully locked and with a usable expansion profile that covers its temperature (t<n>_expansion, INDX_CAL_TOOL_EXPANSION): heater off, and Z after the home corrected to what a cold home gives (_INDX_HOME_EXPAND_FIX)
# A clean tool probed warm is corrected by its expansion profile; nothing
# heats here, no usable profile: uncorrected. [EL-HOM-012]
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set nx = printer["gcode_macro _INDX_TOOL_EXP"] %}
    {% set sx = printer.save_variables.variables %}
    {% set ax = sx.active_tool|default(-1)|int %}
    {% set mk = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set pf = sx["t%d_expansion" % ax]|default(none) if ax >= 0 else none %}
    {% set has = pf is mapping and pf.pts is defined and pf.pts|length >= 2 %}
    {% set tx = printer[th.extruder].temperature|float %}
    {% set warm = has and tx >= pf.pts[0][0]|float + nx.min_dt|float %}
    {% set ready = warm and sx["t%d_clean" % ax]|default(0)|int == 1 and not (mk.short|int and not mk.cleared|int) %}
    {% set usable = ready and pf.use|default(0)|int and tx <= pf.pts[-1][0]|float + nx.tol|float and pf.err|float <= nx.max_err_mm|float %}
    {% set exp = 1 if usable else 0 %}
    {% if exp %}
        RESPOND MSG="INDX > G28: T{ax} is flagged clean and warm ({tx|round(1)} C): heater off, homed as it is and Z corrected by its expansion profile (cold reference {pf.pts[0][0]|float|round(1)} C)"
        M104 S0
    {% elif ready %}
        RESPOND MSG="INDX > G28: T{ax} is flagged clean and warm ({tx|round(1)} C), but its expansion profile {('is not used: ' ~ pf.why|default('')) if not pf.use|default(0)|int else ('is known to %.4f mm only' % pf.err|float if pf.err|float > nx.max_err_mm|float else 'ends at %.0f C' % pf.pts[-1][0]|float)}: homed as it is, no correction"
    {% endif %}
    {% set px = tp.probe_x|float %}
    {% set py = tp.probe_y|float %}
    {% if px < 0 %}
        {% set px = (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% endif %}
    {% if py < 0 %}
        {% set py = (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    {% endif %}

    # A print start re-zero shift belongs to its own G28 [EL-HOM-022]
    ZERO_Z_CLEAR
    # The capped home measures its floor from the current Z: with only a
    # provisional Z, seek it with the scanner first [EL-HOM-013]
    {% set zcmd = tp.home_z_cmd|default("G28 Z")|string|upper %}
    {% set svh = printer.save_variables.variables %}
    {% set act_h = svh.active_tool|default(-1)|int %}
    # the reference tool clean (flagged) or empty: its touch is a clean one
    {% set tch = svh["t%d_clean" % act_h]|default(0)|int == 1 or not (svh["t%d_material" % act_h]|default("")|string|upper not in ["", "NONE"] or svh["t%d_fil_density" % act_h]|default(0)|float > 0) %}
    {% if printer["gcode_macro _INDX_HOME_Z"].z_faked|int and "scanner_z_seek" in printer and "LOAD_CELL_Z_HOME" in zcmd and "SCANNER_Z_SEEK" not in zcmd %}
        SCANNER_Z_SEEK
    {% endif %}
    G90
    # Out to the clearance line first if behind it
    _INDX_TO_LANE
    # at the tool change travel speed [EL-HOM-023]
    _TC_G0 X={"%.3f"|format(px)} Y={"%.3f"|format(py)}
    # Seated, clear of the bed: re-zero with the jump test
    _INDX_PROBE_PREP FORCE=1
    # home_z_cmd (indx.cfg): G28 Z, or a capped load cell home such as
    # LOAD_CELL_Z_HOME (scanner_z_seek) that stops past the expected touch
    _INDX_HOME_Z_CMD_CHECK
    {tp.home_z_cmd|default("G28 Z")}
    # a warm, clean tool (above): Z onto the frame a cold home gives
    {% if exp %}
        INDX_TOOL_EXPANSION TOOL={ax} FROM=now TO=cold QUIET=1
        _INDX_HOME_EXPAND_FIX
    {% endif %}
    # Lift off the trigger point to the hop clearance
    G0 Z{"%.3f"|format(tp.probe_z_clearance|float)} F{tp.home_z_feedrate|default(900)|int}
    # When an INDX routine asked for it (_INDX_LEVEL): the gantry levelled,
    # then Z homed again on the level gantry, with the same expansion fix
    _INDX_HOME_LEVEL X={"%.3f"|format(px)} Y={"%.3f"|format(py)} EXP={exp} TOOL={ax}
    # a scanner-Z load cell home: record the touch (clean only if the tool
    # was clean or empty and not warm-corrected); after the levelling, so it
    # is the touch on the level gantry (the note renders when it runs)
    {% if printer["gcode_macro _INDX_HOME_Z"].z_faked|int and "scanner_z_seek" in printer and "LOAD_CELL_Z_HOME" in zcmd %}
        _INDX_Z_TOUCH_NOTE CLEAN={1 if tch and not exp else 0}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=0
    # A confirm is for this G28 only [EL-HOM-024]
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_PUSH_CHECK VARIABLE=confirmed VALUE=-1
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    SAVE_VARIABLE VARIABLE=z_home_tool VALUE={act}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_SAFE_Z_HOP VARIABLE=blind_hopped VALUE=False
    _INDX_LCD_CLEAR
    # Setup progress: homed with the reference tool at least once
    {% if "gcode_macro _INDX_CAL_SET" in printer and not (printer.save_variables.variables.indx_cal|default({})).homed|default(0) %}
        _INDX_CAL_SET KEY=homed VALUE=1
    {% endif %}

[gcode_macro _INDX_HOME_LEVEL]
description: Inner - G28 Z when _INDX_LEVEL asked for it: level the gantry (QUAD_GANTRY_LEVEL, Z_TILT_ADJUST) when it is not applied, then home Z again at X,Y
# A plain G28 only homes (go is 0). The levelling taps with the seated
# reference tool, after the Z home's own checks passed; every point must be
# on the print side of the clearance line, else it is skipped.
variable_want: 0
variable_go: 0
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set ns = namespace(sec="", cmd="", why="") %}
    {% for s, c in [["quad_gantry_level", "QUAD_GANTRY_LEVEL"], ["z_tilt_ng", "Z_TILT_ADJUST"], ["z_tilt", "Z_TILT_ADJUST"]] %}
        {% if not ns.sec and s in printer and s in cfg %}
            {% set ns.sec = s %}
            {% set ns.cmd = c %}
        {% endif %}
    {% endfor %}
    {% if printer["gcode_macro _INDX_HOME_LEVEL"].go|int and ns.sec and not printer[ns.sec].applied %}
        {% set pts = cfg[ns.sec].points|default([]) %}
        {% set clr = tp.clearance_y %}
        {% if clr is number %}
            {% for p in pts %}
                {% if not ns.why and (p[1]|float - clr|float) * tp.dock_dir|float > 0 %}
                    {% set ns.why = "its point X%.0f Y%.0f is past the clearance line (Y%.1f) toward the docks" % (p[0]|float, p[1]|float, clr|float) %}
                {% endif %}
            {% endfor %}
        {% endif %}
        {% if ns.why %}
            RESPOND TYPE=error MSG="INDX ! The gantry is not levelled ({ns.cmd} skipped: {ns.why}). Move the [{ns.sec}] points onto the print side; until then the edges of the bed can read off Z0."
        {% else %}
            {ns.cmd}
            G90
            _TC_G0 X={params.X} Y={params.Y}
            _INDX_PROBE_PREP FORCE=1
            {tp.home_z_cmd|default("G28 Z")}
            {% if params.EXP|default(0)|int %}
                INDX_TOOL_EXPANSION TOOL={params.TOOL|default(0)|int} FROM=now TO=cold QUIET=1
                _INDX_HOME_EXPAND_FIX
            {% endif %}
            G0 Z{"%.3f"|format(tp.probe_z_clearance|float)} F{tp.home_z_feedrate|default(900)|int}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_LEVEL]
description: Inner - before INDX work over the bed away from the Z homing spot: when the gantry is not levelled (QUAD_GANTRY_LEVEL, Z_TILT_ADJUST not applied: the first home, or the Z motors were off since), asks G28 Z to level it (_INDX_HOME_LEVEL) and home Z again, then the head gets its tool back (BACK=0: not). Not homed: nothing, or HOME=1: G28, which levels too and leaves the reference tool on as any G28. Nothing in a print. FOR= names the work. Never inside G28. Off with INDX_SETTING MACRO=_INDX_LEVEL VAR=enabled VALUE=0
# G28 itself only homes, as on any Klipper printer (a G32 or the print start
# levels). On a gantry that racked while the motors were off, Z0 is right
# only at the Z homing spot: purge lane taps, prime lines and meshes read
# 0.5 to 1 mm off. Kalico clears "applied" when the motors go off, so "not
# applied" is exactly when it is needed. In a print the print start has
# levelled, and a levelling tap there would go over the part. The levelling
# taps with the reference tool through G28 Z and its checks; the caller's
# lines that follow were rendered before, so the head is given back as it
# was (the same tool, or empty).
variable_enabled: True
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set ns = namespace(sec="", cmd="", why="") %}
    {% for s, c in [["quad_gantry_level", "QUAD_GANTRY_LEVEL"], ["z_tilt_ng", "Z_TILT_ADJUST"], ["z_tilt", "Z_TILT_ADJUST"]] %}
        {% if not ns.sec and s in printer and s in cfg %}
            {% set ns.sec = s %}
            {% set ns.cmd = c %}
        {% endif %}
    {% endfor %}
    {% set what = params.FOR|default("INDX")|string %}
    {% set home = params.HOME|default(0)|int %}
    {% set xy = "x" in th.homed_axes and "y" in th.homed_axes %}
    {% set need = printer["gcode_macro _INDX_LEVEL"].enabled and ns.sec and not printer[ns.sec].applied and printer.print_stats.state not in ["printing", "paused"] %}
    {% if need %}
        {% set clr = tp.clearance_y %}
        {% if clr is number %}
            {% for p in cfg[ns.sec].points|default([]) %}
                {% if not ns.why and (p[1]|float - clr|float) * tp.dock_dir|float > 0 %}
                    {% set ns.why = "its point X%.0f Y%.0f is past the clearance line (Y%.1f) toward the docks" % (p[0]|float, p[1]|float, clr|float) %}
                {% endif %}
            {% endfor %}
        {% endif %}
    {% endif %}
    {% if need and ns.why %}
        RESPOND TYPE=error MSG="INDX ! {what}: the gantry is not levelled ({ns.cmd} skipped: {ns.why}). Move the [{ns.sec}] points onto the print side; until then the bed reads off Z0 away from the Z homing spot."
    {% endif %}
    {% if need and not ns.why and (xy or home) %}
        RESPOND MSG="INDX > {what}: levelling the gantry first ({ns.cmd}: not levelled since the Z motors were last off), then Z homes again."
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_LEVEL VARIABLE=want VALUE=1
        {% if xy %}
            G28 Z
            {% if params.BACK|default(1)|int %}
                _INDX_LEVEL_BACK TOOL={printer.save_variables.variables.active_tool|default(-1)|int}
            {% endif %}
        {% else %}
            G28
        {% endif %}
    {% elif home and "xyz" not in th.homed_axes %}
        G28
    {% endif %}

[gcode_macro _INDX_LEVEL_BACK]
description: Inner - after _INDX_LEVEL's G28 Z (renders then): the head gets back what it had, TOOL=n or -1 (empty); a tool is picked up unheated
gcode:
    {% set was = params.TOOL|default(-1)|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% if was != act %}
        {% if was < 0 %}
            PARK_TOOL
        {% else %}
            _INDX_CHANGE_TOOL TOOL={was} COLD=1
        {% endif %}
    {% endif %}

[gcode_macro _INDX_LC_TARE]
description: Inner - re-zero the load cell reference with the current tool seated (TOOL_POSITIONS lc_tare_cmd)
# Callers ensure a seated tool, nozzle in the air, extruder not pushing.
# SETTLE: ms to wait first (default settle_ms). [EL-HOM-011]
gcode:
    {% set cmd = printer["gcode_macro TOOL_POSITIONS"].lc_tare_cmd|default("")|string %}
    {% if cmd|length > 0 and "load_cell_probe" in printer %}
        M400
        G4 P{params.SETTLE|default(printer["gcode_macro _INDX_HOME_VERIFY"].settle_ms)|int}
        M400
        {cmd}
    {% endif %}

[gcode_macro _INDX_HOME_Z_FAIL]
description: Inner - drop the provisional Z home, clear homing_busy, then raise
variable_msg: ""
gcode:
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
    # The head may have dropped to the probe height: the next G28 hops again
    SET_GCODE_VARIABLE MACRO=_INDX_SAFE_Z_HOP VARIABLE=blind_hopped VALUE=False
    # A confirm is for one G28 [EL-HOM-024]
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_PUSH_CHECK VARIABLE=confirmed VALUE=-1
    # Clear a provisional Z home, or the next G0 Z can drive into the bed
    {% if printer["gcode_macro _INDX_HOME_Z"].z_faked|int %}
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=0
    {% endif %}
    _INDX_LCD LEVEL=warn MSG="Homing failed: see console"
    _INDX_HOME_Z_FAIL_RAISE

[gcode_macro _INDX_HOME_Z_FAIL_RAISE]
description: Inner - raise after busy is cleared
gcode:
    {action_raise_error(printer["gcode_macro _INDX_HOME_Z_FAIL"].msg)}
