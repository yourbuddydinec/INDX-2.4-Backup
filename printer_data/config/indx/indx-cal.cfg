#####################################################################
#  INDX CALIBRATION MACROS
#####################################################################
#
#  This file contains all calibration workflows for the INDX system.
#  User-configurable values (probe position, tool count, etc.) live
#  in indx.cfg: nothing in this file needs editing.
#
#  CALIBRATION WORKFLOWS
#  ─────────────────────────────────────────────────────────────────
#  INDX_SETUP (indx_setup.cfg) walks through all of them in order and
#  INDX_STATUS shows what is done. The commands here:
#
#  1. Load cell              INDX_CAL_LOADCELL, then INDX_CAL_LOADCELL_FINISH
#     (before Z homing!)       Seat an empty tool by hand between the two.
#
#  2. Docks                  INDX_CAL_DOCK TOOL=N (indx_setup.cfg), or
#                            CALIBRATE_DOCK_X TOOL=N (X only), and the
#                            jog fallbacks INDX_CAL_DOCK_X_HERE / _Y_HERE.
#                            Results are shown with checks and saved on
#                            Save; nothing to paste, no RESTART.
#
#  3. XY tool offsets        INDX_CAM_GOTO, INDX_CAM_NUDGE, INDX_CAM_SET_REF
#     (camera add-on)        (the reference tool), INDX_CAM_SAVE_TOOL (each other tool).
#                            The INDX page drives the same macros.
#
#  4. Z offsets              CAL_Z (empty tools), CAL_Z_LOADED (loaded,
#                            indx_prime.cfg); INDX_CAL_Z picks one.
#
#  5. Inspect / utilities    INDX_STATUS DETAIL=1, SHOW_VARIABLES,
#                            RESET_GLOBAL_Z, INDX_FIRST_LAYER
#
#  6. Filament / heat cap.   LOAD_FILAMENT TOOL=N TYPE=<material>
#                              Pick up a tool, set the filament's heat
#                              capacity for the safety model, and
#                              load + prime it. INDX_LOAD has buttons.
#
#####################################################################


#####################################################################
#  3. XY TOOL OFFSET CALIBRATION (NOZZLE CAMERA, ADD-ON)
#####################################################################
#
#  The INDX web page (web/) does this with auto-calibration; these macros
#  are what it calls, and they work on their own from the console or LCD
#  with your own camera view:
#
#  1. The reference tool over the camera: INDX_JOG (first time) or INDX_CAM_GOTO TOOL=<ref>,
#     center it with INDX_CAM_NUDGE, then INDX_CAM_SET_REF.
#  2. Each other tool: INDX_CAM_GOTO TOOL=n, center it with
#     INDX_CAM_NUDGE, then INDX_CAM_SAVE_TOOL.
#  3. INDX_CAM_LEAVE takes the head back out to the travel lane.
#
#  The page passes DX= DY= (mm, machine axes): how far the nozzle center
#  it found sits from the crosshair, so a tool need not be nudged exactly.
#  The camera position is machine coordinates (cam_pos_x/y/z); tool
#  offsets are untouched while the head is at the camera.
#  Old names: CAL_ONE_SET_CAMERA_REF, CAL_TWO_PREP_TOOL_CAL,
#  CAL_THREE_SAVE_XY_OFFSET.
#
#####################################################################

[gcode_macro INDX_CAM_GOTO]
description: Camera: drive a tool to the camera reference on the safe route (up, out to the travel lane (the clearance line, at least lane_y), along X, straight in, down). TOOL=n changes tool first (cold). Needs: camera reference (INDX_CAM_SET_REF), homed. Moves: as listed. Saves: nothing
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.cam_pos_x is not defined %}
        {action_raise_error("INDX_CAM_GOTO: no camera reference yet. Pick up the reference tool (T%d), jog it over the camera (INDX_JOG), center it, then INDX_CAM_SET_REF." % svv.ref_tool|default(0)|int)}
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes and not params.HOME|default(0)|int %}
        # Not homed: ask first, saying it will home
        _INDX_PROMPT TITLE="Home First?" TEXT="The printer is not homed. Going to the camera homes it first (G28: X and Y, then Z on the reference tool, fetching it from its dock if needed)." B1="Home, then go to the camera|_INDX_DO CMD=INDX_CAM_GOTO~TOOL={params.TOOL|default(-1)}~PROMPT={params.PROMPT|default(1)}~HOME=1|primary" F1="Cancel|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT_END
        # homed, and the gantry level: the camera reference was set on one
        _INDX_LEVEL FOR="Camera" HOME=1
        _INDX_CAM_GOTO_RUN {rawparams}
    {% endif %}

[gcode_macro _INDX_CAM_GOTO_RUN]
description: Inner - INDX_CAM_GOTO once homed
gcode:
    {% set svv = printer.save_variables.variables %}
    # clearance_y may be "auto" until this has run
    _INDX_BUILD_TOOLS
    {% set t = params.TOOL|default(-1)|int %}
    {% if t >= 0 and t != svv.active_tool|default(-1)|int %}
        # Away from the camera first: a tool change from there would take
        # the diagonal to the dock
        # The camera stays on: the head comes straight back to it
        SET_GCODE_VARIABLE MACRO=_INDX_CAM_SWITCH VARIABLE=keep_on VALUE=1
        _CAL_LEAVE_CAMPOS
        # a calibration: every check, also in race mode
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=1
        _INDX_CHANGE_TOOL TOOL={t} COLD=1
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=0
        # Latch fully engaged for the measurement (skipped for a loaded tool)
        _CAL_LATCH_ENGAGE
    {% endif %}
    _CAL_GOTO_CAMPOS
    SET_GCODE_VARIABLE MACRO=_INDX_CAM_SWITCH VARIABLE=keep_on VALUE=0
    _INDX_CAM_MARK
    {% if params.PROMPT|default(1)|int %}
        INDX_CAM_NUDGE
    {% endif %}

[gcode_macro CAL_TWO_PREP_TOOL_CAL]
description: Renamed to INDX_CAM_GOTO TOOL=n
gcode:
    _INDX_RENAMED OLD=CAL_TWO_PREP_TOOL_CAL NEW=INDX_CAM_GOTO
    INDX_CAM_GOTO {rawparams}

[gcode_macro INDX_CAM_LEAVE]
description: Camera: take the head from the camera back out to the travel lane (up, then straight out). Moves: as listed. Saves: nothing
gcode:
    _INDX_PROMPT_END
    _INDX_BUILD_TOOLS
    _CAL_LEAVE_CAMPOS

[gcode_macro INDX_CAM_HERE]
description: Camera, first time only: the reference tool was jogged over the camera by hand; treat this spot as at the camera, so INDX_CAM_NUDGE and INDX_CAM_FOCUS_STEP work here (limited to 3 mm and 1 mm around it). Needs: the reference tool on the head, homed, Z above the floor. Moves: nothing. Saves: nothing
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set ref = printer.save_variables.variables.ref_tool|default(0)|int %}
    {% set g = printer["gcode_macro _CAL_GOTO_CAMPOS"] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("INDX_CAM_HERE: home first (G28).")}
    {% elif act != ref %}
        {action_raise_error("INDX_CAM_HERE: the camera reference is taken with the reference tool. Pick up T%d first." % ref)}
    {% elif printer.toolhead.position.z|float < g.z_floor|float %}
        {action_raise_error("INDX_CAM_HERE: Z is below the camera Z floor %.2f (bed + 0.2 mm)." % g.z_floor|float)}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CAL_GOTO_CAMPOS VARIABLE=at_cam VALUE=1
    _INDX_CAM_SWITCH ON=1
    _INDX_CAM_MARK
    RESPOND MSG="INDX > T{ref} is treated as over the camera here. Center it (INDX_CAM_NUDGE), then INDX_CAM_SET_REF. INDX_CAM_LEAVE goes up and straight out."

[gcode_macro _INDX_CAM_MARK]
description: Inner - remember where the head arrived at the camera (nudges are limited around it)
variable_x: 0.0
variable_y: 0.0
variable_z: 0.0
gcode:
    {% set p = printer.toolhead.position %}
    SET_GCODE_VARIABLE MACRO=_INDX_CAM_MARK VARIABLE=x VALUE={p.x|float}
    SET_GCODE_VARIABLE MACRO=_INDX_CAM_MARK VARIABLE=y VALUE={p.y|float}
    SET_GCODE_VARIABLE MACRO=_INDX_CAM_MARK VARIABLE=z VALUE={p.z|float}

[gcode_macro INDX_CAM_NUDGE]
description: Camera: move the head a little while it is at the camera, X= Y= in mm (at most 1 mm per call, 3 mm from where it arrived). No parameters: show the nudge buttons. Moves: X and Y only. Saves: nothing
variable_max_step: 1.0
variable_max_total: 3.0
gcode:
    {% set g = printer["gcode_macro _CAL_GOTO_CAMPOS"] %}
    {% set m = printer["gcode_macro _INDX_CAM_MARK"] %}
    {% set th = printer.toolhead %}
    {% set o = printer.gcode_move.homing_origin %}
    {% if not g.at_cam|int or "xyz" not in th.homed_axes %}
        {action_raise_error("INDX_CAM_NUDGE: the head is not at the camera. INDX_CAM_GOTO first.")}
    {% endif %}
    {% if params.X is defined or params.Y is defined %}
        {% set dx = params.X|default(0)|float %}
        {% set dy = params.Y|default(0)|float %}
        {% set nx = th.position.x|float + dx %}
        {% set ny = th.position.y|float + dy %}
        {% if dx|abs > max_step|float or dy|abs > max_step|float %}
            {action_raise_error("INDX_CAM_NUDGE: at most %.1f mm per nudge." % max_step|float)}
        {% endif %}
        {% if (nx - m.x|float)|abs > max_total|float or (ny - m.y|float)|abs > max_total|float %}
            {action_raise_error("INDX_CAM_NUDGE: more than %.1f mm from where the head arrived at the camera. INDX_CAM_GOTO again, or check the camera reference." % max_total|float)}
        {% endif %}
        _INDX_CAM_APPROACH X={nx} Y={ny}
    {% endif %}
    {% if params.PROMPT|default(1 if params.X is not defined and params.Y is not defined else 0)|int %}
        _INDX_CAM_NUDGE_SHOW
    {% endif %}

[gcode_macro _INDX_CAM_APPROACH]
description: Inner - at the camera: go to X= Y= (machine coordinates) always from the same side, first overshoot mm (0.5) short in -X and -Y, then in +X and +Y to the spot. Belt and pulley slack then sits the same way at every position, so camera measurements don't include backlash
variable_overshoot: 0.5
gcode:
    {% set o = printer.gcode_move.homing_origin %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set k = overshoot|float %}
    G90
    G1 X{"%.4f"|format(x - k - o.x|float)} Y{"%.4f"|format(y - k - o.y|float)} F300
    G1 X{"%.4f"|format(x - o.x|float)} Y{"%.4f"|format(y - o.y|float)} F150
    M400

[gcode_macro _INDX_CAM_NUDGE_SHOW]
description: Inner - the camera nudge dialog (console and LCD camera flow)
gcode:
    {% set p = printer.toolhead.position %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set c = "INDX_CAM_NUDGE PROMPT=1 " %}
    {% set save = ("Centered: save T%d as the camera reference|INDX_CAM_SET_REF|primary" % act) if act == printer.save_variables.variables.ref_tool|default(0)|int else ("Centered: save the T%d offset|INDX_CAM_SAVE_TOOL|primary" % act) %}
    _INDX_PROMPT TITLE="Crosshair: Center T{act}" TEXT="Head X{'%.3f'|format(p.x)} Y{'%.3f'|format(p.y)} Z{'%.3f'|format(p.z)}. Nudge (mm) until the nozzle sits on the crosshair." G1="X -0.1|{c}X=-0.1|secondary^X -0.02|{c}X=-0.02|secondary^X +0.02|{c}X=0.02|secondary^X +0.1|{c}X=0.1|secondary" G2="Y -0.1|{c}Y=-0.1|secondary^Y -0.02|{c}Y=-0.02|secondary^Y +0.02|{c}Y=0.02|secondary^Y +0.1|{c}Y=0.1|secondary" B1="{save}" B2="Leave the camera|INDX_CAM_LEAVE|secondary" F1="Close|_INDX_PROMPT_END|secondary"

[gcode_macro INDX_CAM_FOCUS_STEP]
description: Camera: move Z for a focus sweep. BEGIN=1 marks the start Z; DZ=<mm> (at most 0.2 per step) or Z=<machine mm>, never more than 1 mm from the start and never below the Z floor (bed + 0.2 mm). Needs: head at the camera. Moves: Z only. Saves: nothing
variable_base: -1.0
variable_window: 1.0
gcode:
    {% set g = printer["gcode_macro _CAL_GOTO_CAMPOS"] %}
    {% set th = printer.toolhead %}
    {% set o = printer.gcode_move.homing_origin %}
    {% if not g.at_cam|int or "xyz" not in th.homed_axes %}
        {action_raise_error("INDX_CAM_FOCUS_STEP: the head is not at the camera. INDX_CAM_GOTO first.")}
    {% endif %}
    {% set z = th.position.z|float %}
    {% if params.BEGIN|default(0)|int %}
        SET_GCODE_VARIABLE MACRO=INDX_CAM_FOCUS_STEP VARIABLE=base VALUE={z}
    {% else %}
        {% set base = base|float if base|float >= 0 else z %}
        {% if params.Z is defined %}
            {% set tz = params.Z|float %}
        {% else %}
            {% set d = params.DZ|default(0)|float %}
            {% if d|abs > 0.2 %}
                {action_raise_error("INDX_CAM_FOCUS_STEP: DZ at most 0.2 mm per step.")}
            {% endif %}
            {% set tz = z + d %}
        {% endif %}
        {% if (tz - base)|abs > window|float + 0.0001 %}
            {action_raise_error("INDX_CAM_FOCUS_STEP: Z %.3f is more than %.1f mm from the sweep start %.3f." % (tz, window|float, base))}
        {% endif %}
        {% if tz < g.z_floor|float %}
            {action_raise_error("INDX_CAM_FOCUS_STEP: Z %.3f is below the Z floor %.2f (bed + 0.2 mm)." % (tz, g.z_floor|float))}
        {% endif %}
        G90
        G1 Z{"%.4f"|format(tz - o.z|float)} F120
        M400
    {% endif %}

[gcode_macro INDX_CAM_SET_REF]
description: Camera: save where the reference tool's nozzle is centered over the camera as the camera reference. DX= DY= (mm) is where the page found the nozzle center from the crosshair; X= Y= (machine) save a center measured earlier instead (Calibrate all tools), Z stays. Needs: the reference tool on the head, homed, Z above the floor (not with X= Y=). Moves: nothing. Saves: cam_pos_x/y/z (machine)
# XY offsets are differences from the reference tool here, so it takes the
# reference. Machine coordinates: the tool's gcode offset plays no part.
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set g = printer["gcode_macro _CAL_GOTO_CAMPOS"] %}
    {% set pos = printer.toolhead.position %}
    {% set dx = params.DX|default(0)|float %}
    {% set dy = params.DY|default(0)|float %}
    {% set given = params.X is defined and params.Y is defined %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("INDX_CAM_SET_REF: home first (G28). The reference is a machine position.")}
    {% elif given %}
        # a center measured earlier: no checks on the head
    {% elif act != svv.ref_tool|default(0)|int %}
        {action_raise_error("INDX_CAM_SET_REF: the camera reference must be taken with the reference tool T%d on the head (INDX has %s). Pick it up, center it over the camera, then run this again." % (svv.ref_tool|default(0)|int, ('T%d' % act) if act >= 0 else 'no tool'))}
    {% elif pos.z|float < g.z_floor|float %}
        {action_raise_error("INDX_CAM_SET_REF: Z %.3f is below the camera Z floor %.2f (bed + 0.2 mm). Raise the camera or focus higher." % (pos.z|float, g.z_floor|float))}
    {% elif dx|abs > 2 or dy|abs > 2 %}
        {action_raise_error("INDX_CAM_SET_REF: DX/DY over 2 mm: nudge the nozzle closer to the crosshair first.")}
    {% endif %}
    {% set cx = params.X|float if given else pos.x|float - dx %}
    {% set cy = params.Y|float if given else pos.y|float - dy %}
    {% set svv = printer.save_variables.variables %}
    {% if given and svv.cam_pos_x is defined and ((cx - svv.cam_pos_x|float)|abs > 3 or (cy - svv.cam_pos_y|float)|abs > 3) %}
        {action_raise_error("INDX_CAM_SET_REF: X/Y is more than 3 mm from the current reference. Nothing saved.")}
    {% endif %}
    _INDX_PROMPT_END
    SAVE_VARIABLE VARIABLE=cam_pos_x VALUE='{"%.4f"|format(cx)}'
    SAVE_VARIABLE VARIABLE=cam_pos_y VALUE='{"%.4f"|format(cy)}'
    {% if not given %}
    SAVE_VARIABLE VARIABLE=cam_pos_z VALUE='{"%.3f"|format(pos.z)}'
    {% endif %}
    {% if not given %}
    SET_GCODE_VARIABLE MACRO=_CAL_GOTO_CAMPOS VARIABLE=at_cam VALUE=1
    _INDX_CAM_SWITCH ON=1
    _INDX_CAM_MARK
    {% endif %}
    RESPOND MSG="INDX ok Camera reference saved with T{svv.ref_tool|default(0)|int} at X={'%.4f'|format(cx)} Y={'%.4f'|format(cy)} Z={'%.3f'|format(svv.cam_pos_z|default(pos.z)|float)} (machine){(', was X%.4f Y%.4f' % (svv.cam_pos_x|float, svv.cam_pos_y|float)) if svv.cam_pos_x is defined else ''}{' (Z unchanged)' if given else ''}."
    {% if "gcode_macro INDX_XY_LOCATE" in printer and printer["gcode_macro INDX_XY_LOCATE"].active|int %}
        # the camera was just found (INDX_XY_LOCATE): on to the tools, a
        # moment later (INDX_CAL_XY_CAMERA can lead back here)
        SET_GCODE_VARIABLE MACRO=INDX_XY_LOCATE VARIABLE=active VALUE=0
        _INDX_RUNNING STEP=none
        _INDX_LATER CMD=INDX_CAL_XY_CAMERA
    {% endif %}

[gcode_macro CAL_ONE_SET_CAMERA_REF]
description: Renamed to INDX_CAM_SET_REF
gcode:
    _INDX_RENAMED OLD=CAL_ONE_SET_CAMERA_REF NEW=INDX_CAM_SET_REF
    INDX_CAM_SET_REF {rawparams}

[gcode_macro INDX_CAM_SAVE_TOOL]
description: Camera: save the XY offset of the tool on the head from where it is centered over the camera. DX= DY= (mm) is where the page found the nozzle center from the crosshair. TOOL= OFF_X= OFF_Y= save an offset measured earlier instead (Calibrate all tools). Needs: camera reference, the tool at the camera (not with OFF_X/OFF_Y). Moves: nothing. Saves: tN_offset_x/y
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set on_head = svv.active_tool|default(-1)|int %}
    {% set given = params.OFF_X is defined and params.OFF_Y is defined %}
    {% set act = params.TOOL|int if given else on_head %}
    {% set dx = params.DX|default(0)|float %}
    {% set dy = params.DY|default(0)|float %}
    {% set ref = svv.ref_tool|default(0)|int %}
    {% if given and (params.TOOL is not defined or act < 0 or act == ref or act >= printer["gcode_macro TOOL_POSITIONS"].tool_count|int) %}
        {action_raise_error("INDX_CAM_SAVE_TOOL: OFF_X/OFF_Y need TOOL= one of T0 to T%d other than the reference T%d." % (printer["gcode_macro TOOL_POSITIONS"].tool_count|int - 1, ref))}
    {% elif act < 0 %}
        {action_raise_error("INDX_CAM_SAVE_TOOL: no tool on the head.")}
    {% elif svv.cam_pos_x is not defined or svv.cam_pos_y is not defined %}
        {action_raise_error("INDX_CAM_SAVE_TOOL: no camera reference. INDX_CAM_SET_REF with the reference tool T%d first." % ref)}
    {% elif act == ref %}
        {action_raise_error("INDX_CAM_SAVE_TOOL: T%d is the reference (offset 0). To move the camera reference use INDX_CAM_SET_REF." % ref)}
    {% elif dx|abs > 2 or dy|abs > 2 %}
        {action_raise_error("INDX_CAM_SAVE_TOOL: DX/DY over 2 mm: nudge the nozzle closer to the crosshair first.")}
    {% endif %}
    {% set off_x = params.OFF_X|float if given else printer.toolhead.position.x|float - dx - svv.cam_pos_x|float %}
    {% set off_y = params.OFF_Y|float if given else printer.toolhead.position.y|float - dy - svv.cam_pos_y|float %}
    {% if off_x|abs > 3 or off_y|abs > 3 %}
        {action_raise_error("INDX_CAM_SAVE_TOOL: T%d would be %.2f, %.2f mm from the reference T%d: more than 3 mm, so the head is not at the reference spot. Nothing saved." % (act, off_x, off_y, ref))}
    {% endif %}
    _INDX_PROMPT_END
    SAVE_VARIABLE VARIABLE=t{act}_offset_x VALUE='{"%.3f"|format(off_x)}'
    SAVE_VARIABLE VARIABLE=t{act}_offset_y VALUE='{"%.3f"|format(off_y)}'
    {% if act == on_head %}
    SET_GCODE_OFFSET X={"%.3f"|format(off_x)} Y={"%.3f"|format(off_y)}
    {% endif %}
    {% if "gcode_macro _INDX_CAL_XY_DONE" in printer %}
        _INDX_CAL_XY_DONE TOOL={act}
    {% endif %}
    {% if "gcode_macro _INDX_GUIDE_XY_CHECK" in printer %}
        # in the setup guide: with every tool measured, the next step follows
        _INDX_GUIDE_XY_CHECK
    {% endif %}
    RESPOND MSG="INDX ok T{act} XY offset saved: X={'%.3f'|format(off_x)} Y={'%.3f'|format(off_y)} (was {svv['t%d_offset_x' % act]|default('--')}, {svv['t%d_offset_y' % act]|default('--')})"

[gcode_macro CAL_THREE_SAVE_XY_OFFSET]
description: Renamed to INDX_CAM_SAVE_TOOL
gcode:
    _INDX_RENAMED OLD=CAL_THREE_SAVE_XY_OFFSET NEW=INDX_CAM_SAVE_TOOL
    INDX_CAM_SAVE_TOOL {rawparams}

[gcode_macro INDX_CAL_XY_CAMERA]
description: Camera XY method, console and LCD flow (the INDX page does the same with auto-calibration at /indx/). Moves: nothing by itself
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% if svv.cam_pos_x is not defined and "gcode_macro INDX_XY_LOCATE" in printer %}
        # a new printer: where the camera is is found by hand once (the
        # reference tool held over it, one-motor homing), then centered
        RESPOND MSG="INDX > No camera reference yet: find the camera first (T{svv.ref_tool|default(0)|int} over it by hand)."
        INDX_XY_LOCATE WHAT=cam
    {% elif svv.cam_pos_x is not defined %}
        _INDX_PROMPT TITLE="Camera XY: Reference First" TEXT="1. Pick up T{svv.ref_tool|default(0)|int} (the reference tool) and jog it over the camera: up, out to Y5, along X, then straight in (INDX_JOG). 2. Center the nozzle in your camera view. 3. Save the reference." TEXT2="The INDX page (/indx/ on this printer) has a movable crosshair and finds the nozzle for you." B1="Pick up T{svv.ref_tool|default(0)|int}|_INDX_DO CMD=T{svv.ref_tool|default(0)|int}|primary" B2="Jog|_INDX_DO CMD=INDX_JOG~AXIS=Z|secondary" B3="T{svv.ref_tool|default(0)|int} is centered: save the reference|INDX_CAM_SET_REF|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        {% set ref = svv.ref_tool|default(0)|int %}
        {% set ns = namespace(b=["T%d (check the reference)|INDX_CAM_GOTO TOOL=%d|secondary" % (ref, ref)]) %}
        {% for i in range(n) if i != ref %}
            {% set ns.b = ns.b + ["T%d|INDX_CAM_GOTO TOOL=%d|primary" % (i, i)] %}
        {% endfor %}
        _INDX_PROMPT TITLE="Camera XY Offsets" TEXT="Pick a tool: it goes to the camera on the safe route, then center it and save." TEXT2="Camera reference X{svv.cam_pos_x} Y{svv.cam_pos_y} Z{svv.cam_pos_z} (machine)." G1="{ns.b|join('^')}" B1="Leave the camera|INDX_CAM_LEAVE|secondary" B2="{'Measure the camera position again|_INDX_DO CMD=INDX_XY_LOCATE~WHAT=cam|secondary' if 'gcode_macro INDX_XY_LOCATE' in printer else ''}" F1="Close|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _CAL_GOTO_CAMPOS]
description: Inner - drive the active tool to the camera reference: up to travel_z, straight out to the travel lane, along X, straight in, slowly down. X= Y= Z= (machine, all three): to that spot instead (INDX_XY_LOCATE: a camera or sensor just found); CAM=0: not the camera (no camera switch, at_cam stays 0)
# X moves only at the travel lane, then straight in along Y. A camera in the
# dock row must be dock_min_dx (mm) in X from every dock. Z never below
# z_floor (mm). Targets are machine coordinates.
variable_travel_z: 15.0
variable_lane_y: 5.0
variable_travel_f: 6000
variable_run_in_f: 1200
variable_z_f: 600
variable_dock_min_dx: 36.0
variable_z_floor: 0.2
variable_at_cam: 0
gcode:
    {% set given = params.X is defined and params.Y is defined and params.Z is defined %}
    {% set cam = params.CAM|default(1)|int %}
    # Camera on now: it starts while the head travels
    {% if cam %}
        _INDX_CAM_SWITCH ON=1
    {% endif %}
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% if not given and ('cam_pos_x' not in svv or 'cam_pos_y' not in svv or 'cam_pos_z' not in svv) %}
        {action_raise_error("Camera reference missing. Run INDX_CAM_SET_REF with the reference tool first.")}
    {% endif %}
    {% if "xyz" not in th.homed_axes %}
        {action_raise_error("Home first (G28): the camera route needs a homed machine.")}
    {% endif %}
    {% if tp.tools|length == 0 %}
        {action_raise_error("INDX is still starting up (no dock list yet). Try again in a few seconds.")}
    {% endif %}
    {% set cx = params.X|float if given else svv.cam_pos_x|float %}
    {% set cy = params.Y|float if given else svv.cam_pos_y|float %}
    {% set cz = params.Z|float if given else svv.cam_pos_z|float %}
    {% set dir = tp.dock_dir|float %}
    {% set clr = tp.clearance_y|float %}
    {% set lane = [clr, lane_y|float]|max if dir < 0 else clr %}
    {% set in_row = (cy - clr) * dir > 0 %}
    {% set ns = namespace(bad=-1) %}
    {% if in_row %}
        {% for tool in tp.tools %}
            {% if (cx - tool.x|float)|abs < dock_min_dx|float and ns.bad < 0 %}
                {% set ns.bad = loop.index0 %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if ns.bad >= 0 %}
        {action_raise_error("%s X%.2f Y%.2f is in the dock row and only %.1f mm from the T%d dock in X (needs %.0f mm). Refusing the route.%s" % ("The camera reference" if not given else ("The camera found at" if cam else "The XY sensor found at"), cx, cy, (cx - tp.tools[ns.bad].x|float)|abs, ns.bad, dock_min_dx|float, "" if not given else (" Set it by hand instead: " ~ ("INDX_JOG, then INDX_CAM_HERE and INDX_CAM_SET_REF." if cam else "INDX_ALIGN_SET_SENSOR X= Y= FACE_Z="))))}
    {% endif %}
    {% if cz < z_floor|float %}
        {action_raise_error("The camera reference Z %.3f is below the Z floor %.2f. Refusing to go there." % (cz, z_floor|float))}
    {% endif %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set tz = [[travel_z|float, cz + 5.0, th.position.z|float]|max, th.axis_maximum.z|float - 1.0]|min %}
    G90
    G0 Z{"%.3f"|format(tz - o.z|float)} F900
    # Out of the dock row first, straight along Y
    {% if (th.position.y|float - lane) * dir > 0 %}
        G0 Y{"%.3f"|format(lane - o.y|float)} F{travel_f}
    {% endif %}
    G0 X{"%.3f"|format(cx - o.x|float)} F{travel_f}
    {% if (cy - lane) * dir > 0 %}
        G0 Y{"%.3f"|format(lane - o.y|float)} F{travel_f}
        G1 Y{"%.3f"|format(cy - o.y|float)} F{run_in_f}
    {% else %}
        G0 Y{"%.3f"|format(cy - o.y|float)} F{travel_f}
    {% endif %}
    G1 Z{"%.3f"|format(cz - o.z|float)} F{z_f}
    M400
    # Come in to the spot from the same side as every nudge (backlash)
    _INDX_CAM_APPROACH X={cx} Y={cy}
    {% if cam %}
        SET_GCODE_VARIABLE MACRO=_CAL_GOTO_CAMPOS VARIABLE=at_cam VALUE=1
        _INDX_CAM_SWITCH ON=1
    {% endif %}

[gcode_macro _INDX_CAM_POWER]
description: Inner - the nozzle camera power state, for Moonraker's [power] device (type klipper_device, object_name gcode_macro _INDX_CAM_POWER). Moonraker runs it with VALUE=1 or 0 and starts or stops the bound camera service
variable_value: 0
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_CAM_POWER VARIABLE=value VALUE={params.VALUE|default(0)|int}

[gcode_macro _INDX_CAM_SWITCH]
description: Inner - ON=1 or 0: switch the nozzle camera through Moonraker (only when TOOL_POSITIONS cam_power_device is set)
# want: what INDX last asked for (_INDX_CAM_POWER lags: Moonraker acts after
# the running command). keep_on: INDX_CAM_GOTO keeps the camera on across its
# tool change.
variable_want: -1
variable_keep_on: 0
gcode:
    {% set dev = printer["gcode_macro TOOL_POSITIONS"].cam_power_device|default("")|string %}
    {% set me = printer["gcode_macro _INDX_CAM_SWITCH"] %}
    {% set on = params.ON|default(0)|int %}
    {% if dev and me.want|int != on and (on or not me.keep_on|int) %}
        SET_GCODE_VARIABLE MACRO=_INDX_CAM_SWITCH VARIABLE=want VALUE={on}
        {action_call_remote_method("set_device_power", device=dev, state=("on" if on else "off"))}
    {% endif %}

[gcode_macro INDX_CAM_POWER]
description: Camera: turn the nozzle camera on (ON=1) or off (ON=0) by hand, for example to jog the reference tool over it the first time. Needs: cam_power_device in indx.cfg. Moves: nothing
gcode:
    {% if not printer["gcode_macro TOOL_POSITIONS"].cam_power_device|default("")|string %}
        RESPOND MSG="INDX > No cam_power_device in indx.cfg: INDX does not switch the camera. Start or stop its service yourself."
    {% else %}
        _INDX_CAM_SWITCH ON={params.ON|default(1)|int}
    {% endif %}

[gcode_macro _INDX_CAM_AWAY]
description: Inner - the head is leaving the camera (or was never there): clear at_cam and turn the camera off
gcode:
    {% if printer["gcode_macro _CAL_GOTO_CAMPOS"].at_cam|int %}
        SET_GCODE_VARIABLE MACRO=_CAL_GOTO_CAMPOS VARIABLE=at_cam VALUE=0
    {% endif %}
    _INDX_CAM_SWITCH ON=0

[gcode_macro _CAL_LEAVE_CAMPOS]
description: Inner - if the head is at the camera: up to travel_z and straight back out to the travel lane (the way it came in)
gcode:
    {% set g = printer["gcode_macro _CAL_GOTO_CAMPOS"] %}
    {% if g.at_cam|int and "xyz" in printer.toolhead.homed_axes %}
        {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
        {% set th = printer.toolhead %}
        {% set o = printer.gcode_move.homing_origin %}
        {% set dir = tp.dock_dir|float %}
        {% set clr = tp.clearance_y|float %}
        {% set lane = [clr, g.lane_y|float]|max if dir < 0 else clr %}
        {% set tz = [[g.travel_z|float, th.position.z|float]|max, th.axis_maximum.z|float - 1.0]|min %}
        G90
        G0 Z{"%.3f"|format(tz - o.z|float)} F900
        {% if (th.position.y|float - lane) * dir > 0 %}
            G1 Y{"%.3f"|format(lane - o.y|float)} F{g.run_in_f}
        {% endif %}
        M400
    {% endif %}
    _INDX_CAM_AWAY

#####################################################################
#  4. Z AUTO-CALIBRATION (CONVERGENT + MEDIAN)
#####################################################################
#
#  CAL_Z probes each tool at a shared clean spot, after debris-clearing
#  taps at its own spot:
#    1. Convergence: until the SD of the last 4 taps is under the probe's
#       repeatability (INDX_CAL_PROBE, 0.002 to 0.010 mm, 0.005 without it).
#       After 7 taps without it, move to the next of 6 points on a 3 mm
#       circle; after 2 such moves, half probe speed.
#    2. Median of sample_count taps at that point is the result.
#  The spot is probe_location (default: the Z homing spot). [EL-CAL-001]
#  With the inductive XY sensor and cold tools, each tool's trigger height
#  on it is saved too (t<n>_sensor_dz, sensor_ref_z) for the print's cold
#  Z check (_INDX_SENSOR_ZCHECK).
#
#####################################################################

[gcode_macro CAL_Z]
description: Measure the Z offset of every tool against the reference tool (ref_tool, T0 unless changed) with the load cell. Needs: empty, clean, cold tools (no filament at the gears), homed (homes if not). Moves: tool changes, taps at the CAL_Z spot. Saves: tN_offset_z after you press Save (SAVE=1 saves without asking). TOOLS=1,2: only those tools against the reference. INDX_CAL_Z asks and picks the right method
variable_probe_location:  "home"   # "home" (the Z homing spot) | "center" | "rear" | "front" | "left" | "right"
variable_edge_inset:         5.0   # mm from bed edge to near edge of fuzz circle
variable_probe_speed:        3.0   # normal probe speed mm/s (halved after 2 fuzz moves)
variable_probe_retract:      1.0   # Z retract between convergence/sample probes (mm, relative)
variable_toolchange_z:      20.0   # minimum Z before each CHANGE_TOOL (nozzle clearance, mm)
variable_sample_count:         5   # final clean probes per tool: median saved as result
variable_nozzle_temp:         0.0   # runtime nozzle target; 0 disables heating
variable_nozzle_soak:         0.0   # runtime soak after reaching nozzle_temp (seconds)
gcode:
    RESPOND MSG="CAL_Z: Make sure no filament is available to the extruder gears in any tool."
    {% set tp  = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set cz = printer["gcode_macro _CZ_STATE"] %}
    {% set cfg = printer["gcode_macro CAL_Z"] %}
    {% set n   = tp.tool_count|int %}
    {% set sc  = cfg.sample_count|int %}
    {% set spd = cfg.probe_speed|float %}
    {% set loc = cfg.probe_location %}
    {% set ins = cfg.edge_inset|float %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(0)|float %}
    {% set nozzle_soak = params.SOAK|default(0)|float %}

    {% if nozzle_temp < 0 or nozzle_soak < 0 %}
        {action_raise_error("CAL_Z requires NOZZLE_TEMP>=0 and SOAK>=0")}
    {% endif %}

    {% if printer["gcode_macro _CZ_STATE"].running|int %}
        {action_raise_error("CAL_Z is already running, or a run ended with an error. INDX_STOP clears it.")}
    {% endif %}
    # TOOLS=1,2: only those tools against the reference (a new tool) [EL-CAL-021]
    {% set ref = svv.ref_tool|default(0)|int %}
    {% set tools = [ref] + (params.TOOLS|default(range(n)|join(","))|string).split(",")|map("trim")|select|map("int")|reject("equalto", ref)|unique|list|sort %}
    {% for t in tools if t < 0 or t >= n %}
        {action_raise_error("CAL_Z: TOOLS=%s: T%d is not a dock (0 to %d). Nothing moved." % (params.TOOLS, t, n - 1))}
    {% endfor %}
    {% if loc != "home" %}
        # taps away from the Z homing spot: on a level gantry (the run
        # changes tools itself)
        _INDX_LEVEL FOR="CAL_Z" HOME=1 BACK=0
    {% elif "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=total_tools  VALUE={n}
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=tools VALUE="{tools}"
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=current_tool VALUE={tools[0]}
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=results VALUE="{[none] * n}"
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=xofs VALUE="{[none] * n}"
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=sensor VALUE="{ {} }"
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=running VALUE=1
    # SAVE=ask (default) shows old and new values with Save / Discard, SAVE=1
    # saves at the end without asking (scripts), SAVE=0 only reports
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=save VALUE='"{params.SAVE|default("ask")|string|lower}"'
    SET_GCODE_VARIABLE MACRO=CAL_Z VARIABLE=nozzle_temp VALUE={nozzle_temp}
    SET_GCODE_VARIABLE MACRO=CAL_Z VARIABLE=nozzle_soak VALUE={nozzle_soak}

    # Compute clean probe center from bed dimensions and probe_location
    {% set th  = printer.toolhead %}
    {% set bcx = (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% set bcy = (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    {% set r   = 5.0 %}
    {% set pns = namespace(cx=bcx, cy=bcy) %}
    {% if loc == "home" %}
        # where G28 Z taps (probe_x / probe_y, bed center when -1) [EL-CAL-001]
        {% set pns.cx = tp.probe_x|float if tp.probe_x|float >= 0 else bcx %}
        {% set pns.cy = tp.probe_y|float if tp.probe_y|float >= 0 else bcy %}
    {% endif %}
    {% if loc == "rear"  %}{% set pns.cy = th.axis_maximum.y - ins - r %}{% endif %}
    {% if loc == "front" %}{% set pns.cy = th.axis_minimum.y + ins + r %}{% endif %}
    {% if loc == "left"  %}{% set pns.cx = th.axis_minimum.x + ins + r %}{% endif %}
    {% if loc == "right" %}{% set pns.cx = th.axis_maximum.x - ins - r %}{% endif %}

    RESPOND MSG="═══════════════════════════════════════════════"
    RESPOND MSG="  CAL_Z: {('%d tools' % n) if tools|length == n else ('T' ~ tools|join(', T'))}"
    RESPOND MSG="  Reference tool T{svv.ref_tool|default(0)|int} (offset 0)"
    RESPOND MSG="  Location       {'the Z homing spot (where G28 Z taps)' if loc == 'home' else (loc ~ '  (inset %.1f mm)' % ins)}"
    RESPOND MSG="  Clean probe    X={'%.2f'|format(pns.cx)}  Y={'%.2f'|format(pns.cy)}"
    {% set tsd = [[svv.indx_probe_check.sd|default(0.005)|float, 0.002]|max, 0.01]|min if svv.indx_probe_check is defined else 0.005 %}
    RESPOND MSG="  Convergence    SD < {'%.4f'|format(tsd)} mm over 4-sample window{' (the probe accuracy check)' if svv.indx_probe_check is defined else ' (no probe accuracy check yet)'}  (a nearby spot after 7)"
    RESPOND MSG="  Final samples  {sc} probes → median"
    {% if nozzle_temp > 0 %}
        RESPOND MSG="  Nozzle         {'%.1f'|format(nozzle_temp)} C / soak {'%.0f'|format(nozzle_soak)}s per tool"
    {% else %}
        RESPOND MSG="  Nozzle         cold (heater not controlled)"
    {% endif %}
    RESPOND MSG="  Probe speed    {'%.1f'|format(spd)} mm/s  (→ {'%.1f'|format(spd/2)} after 2 moves to a nearby spot)"
    RESPOND MSG="═══════════════════════════════════════════════"
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=cx VALUE={pns.cx}
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=cy VALUE={pns.cy}
    _INDX_PROGRESS START=1 STEP="CAL_Z" TOTAL={n} EST=90

    _CZ_NEXT_TOOL


#####################################################################
#  TOOL LOOP
#####################################################################

[gcode_macro _CZ_NEXT_TOOL]
description: Inner - pick up tool, debris-clear at per-tool spot, start convergence at clean spot
gcode:
    {% set svv   = printer.save_variables.variables %}
    {% set cz = printer["gcode_macro _CZ_STATE"] %}
    {% set tp    = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set cfg   = printer["gcode_macro CAL_Z"] %}
    {% set i     = cz.current_tool|int %}
    {% set n     = cz.total_tools|int %}
    {% set tl    = cz.tools if cz.tools|default([]) else range(n)|list %}
    {% set z_clr = tp.probe_z_clearance|float %}
    {% set loc   = cfg.probe_location %}
    {% set ins   = cfg.edge_inset|float %}

    # Probe center stored once by CAL_Z into _CZ_STATE
    {% set th  = printer.toolhead %}
    {% set cx = printer["gcode_macro _CZ_STATE"].cx|float %}
    {% set cy = printer["gcode_macro _CZ_STATE"].cy|float %}

    # Per-tool debris-clearing spot, outside the shared clean zone
    {% set dns = namespace(ix=cx, iy=cy) %}
    {% if loc == "left" or loc == "right" %}
        {% set dns.iy = cy - (i + 2) * 5.0 %}
        {% set dns.iy = [dns.iy, th.axis_minimum.y + 5.0]|max %}
    {% else %}
        {% set dns.ix = cx - (i + 2) * 5.0 %}
        {% set dns.ix = [dns.ix, th.axis_minimum.x + 5.0]|max %}
    {% endif %}

    {% if i >= n %}
        _CZ_FINALIZE
    {% else %}
        RESPOND MSG="───────────────────────────────────────────────"
        RESPOND MSG="INDX > CAL_Z tool {tl.index(i) + 1 if i in tl else i + 1} of {tl|length} (T{i}): debris-clearing at X={'%.2f'|format(dns.ix)} Y={'%.2f'|format(dns.iy)}. INDX_STOP ends the run."
        _INDX_PROGRESS ITEM=1 PART="T{i}: probing"

        # At least toolchange_z before the swap: z_hop alone is too low after a probe
        {% set tc_z = [printer.toolhead.position.z, cfg.toolchange_z|float]|max %}
        G90
        G0 Z{'%.3f'|format(tc_z)} F{(printer.configfile.settings.printer.max_z_velocity|default(printer.configfile.settings.printer.max_velocity)|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 3000}
        _INDX_CHANGE_TOOL TOOL={i} SKIP_Z_CORRECTION=1
        _CAL_LATCH_ENGAGE
        {% if cfg.nozzle_temp|float <= 0 and "indx_tool_align" in printer %}
            # the tool's cold trigger height on the inductive XY sensor
            _CZ_SENSOR TOOL={i}
        {% endif %}
        {% if cfg.nozzle_temp|float > 0 %}
            RESPOND MSG="  T{i}: heating to {'%.1f'|format(cfg.nozzle_temp|float)} C, then soaking {'%.0f'|format(cfg.nozzle_soak|float)}s"
            M109 S{cfg.nozzle_temp|float}
            {% if cfg.nozzle_soak|float > 0 %}
                G4 P{(cfg.nozzle_soak|float * 1000)|int}
            {% endif %}
        {% endif %}
        G90
        G0 Z{z_clr} F1500
        # Out to the clearance line first if behind it
        _INDX_TO_LANE
        G0 X{'%.3f'|format(dns.ix)} Y{'%.3f'|format(dns.iy)} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
        _INDX_PROBE_PREP
        PROBE
        G0 Z{z_clr} F1500
        _INDX_PROBE_PREP
        PROBE
        G0 Z{z_clr} F1500
        _INDX_PROBE_PREP
        PROBE
        G0 Z{z_clr} F1500

        # Move to shared clean measurement spot
        G0 X{'%.3f'|format(cx)} Y{'%.3f'|format(cy)} F3000

        # Reset convergence state for this tool
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=probe_count   VALUE=0
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=since_fuzz    VALUE=0
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=win_count     VALUE=0
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=win_pos       VALUE=0
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=fuzz_attempts VALUE=0

        RESPOND MSG="  T{i}: probing to convergence (SD < {'%.4f'|format([[printer.save_variables.variables.indx_probe_check.sd|default(0.005)|float, 0.002]|max, 0.01]|min if printer.save_variables.variables.indx_probe_check is defined else 0.005)} mm, a nearby spot after 7)..."

        UPDATE_DELAYED_GCODE ID=_cz_probe_loop DURATION=0.1
    {% endif %}


#####################################################################
#  CONVERGENCE LOOP
#####################################################################

[gcode_macro _CZ_PROBE_STEP]
description: Inner - small relative retract, probe at current speed, hand off to _CZ_READ
gcode:
    {% set svv   = printer.save_variables.variables %}
    {% set cz = printer["gcode_macro _CZ_STATE"] %}
    {% set cfg   = printer["gcode_macro CAL_Z"] %}
    {% set fa    = cz.fuzz_attempts|default(0)|int %}
    {% set spd   = cfg.probe_speed|float %}
    {% set actual_spd = spd / 2.0 if fa >= 2 else spd %}
    # Relative retract: safe regardless of where the probe left the head
    G91
    G0 Z{cfg.probe_retract} F1500
    G90
    _INDX_PROBE_PREP
    PROBE PROBE_SPEED={actual_spd}
    _CZ_READ


[gcode_macro _CZ_READ]
description: Inner - update SD window, check convergence, fuzz or loop or start final sampling
gcode:
    {% set svv           = printer.save_variables.variables %}
    {% set cz = printer["gcode_macro _CZ_STATE"] %}
    {% set i             = cz.current_tool|int %}
    {% set z             = printer.probe.last_z_result|float %}
    {% set probe_count   = cz.probe_count|default(0)|int %}
    {% set since_fuzz    = cz.since_fuzz|default(0)|int %}
    {% set win_count     = cz.win_count|default(0)|int %}
    {% set win_pos       = cz.win_pos|default(0)|int %}
    {% set fuzz_attempts = cz.fuzz_attempts|default(0)|int %}
    # target: the probe's SD (INDX_CAL_PROBE), 0.002 to 0.010 mm, else 0.005
    {% set pcs = printer.save_variables.variables %}
    {% set tsd = [[pcs.indx_probe_check.sd|default(0.005)|float, 0.002]|max, 0.01]|min if pcs.indx_probe_check is defined else 0.005 %}
    {% set threshold_sq  = tsd * tsd %}
    {% set fuzz_trigger  = 7 %}
    {% set max_probes    = 50 %}

    {% set new_probe_count = probe_count + 1 %}
    {% set new_since_fuzz  = since_fuzz + 1 %}
    {% set new_win_pos     = (win_pos + 1) % 4 %}
    {% set new_win_count   = [win_count + 1, 4]|min %}

    # Jinja renders before any SET runs: build the window from the old values
    {% set wns = namespace(w0 = cz.win[0]|float,
                           w1 = cz.win[1]|float,
                           w2 = cz.win[2]|float,
                           w3 = cz.win[3]|float) %}
    {% if win_pos == 0 %}{% set wns.w0 = z %}{% endif %}
    {% if win_pos == 1 %}{% set wns.w1 = z %}{% endif %}
    {% if win_pos == 2 %}{% set wns.w2 = z %}{% endif %}
    {% if win_pos == 3 %}{% set wns.w3 = z %}{% endif %}

    # Compute sample variance once the window is full (requires 4 readings)
    {% set cns = namespace(converged=false, variance=0.0) %}
    {% if new_win_count >= 4 %}
        {% set m = (wns.w0 + wns.w1 + wns.w2 + wns.w3) / 4.0 %}
        {% set cns.variance = ((wns.w0-m)**2 + (wns.w1-m)**2 + (wns.w2-m)**2 + (wns.w3-m)**2) / 3.0 %}
        {% set cns.converged = cns.variance < threshold_sq %}
    {% endif %}

    {% set converged   = cns.converged %}
    {% set limit_hit   = new_probe_count >= max_probes %}
    {% set should_fuzz = (new_since_fuzz >= fuzz_trigger) and not converged %}

    # Report the variance in μm²
    {% if new_win_count < 4 %}
        RESPOND MSG="  T{i}  probe {new_probe_count}: {'%.4f'|format(z)}  (window {new_win_count}/4)"
    {% elif converged %}
        RESPOND MSG="  T{i}  probe {new_probe_count}: {'%.4f'|format(z)}  ✓ var={'%.1f'|format(cns.variance * 1e6)} μm²"
    {% else %}
        RESPOND MSG="  T{i}  probe {new_probe_count}: {'%.4f'|format(z)}  ✗ var={'%.1f'|format(cns.variance * 1e6)} μm²  ({new_since_fuzz}/{fuzz_trigger})"
    {% endif %}

    # Save window state; the fuzz branch below overrides win_count/win_pos to 0
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=win VALUE="{[wns.w0, wns.w1, wns.w2, wns.w3]}"
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=win_pos     VALUE={new_win_pos}
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=win_count   VALUE={new_win_count}
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=probe_count VALUE={new_probe_count}

    {% if converged %}
        RESPOND MSG="  T{i}  converged after {new_probe_count} probes, taking final samples..."
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=sample_idx VALUE=0
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=samples VALUE="[]"
        UPDATE_DELAYED_GCODE ID=_cz_sample_loop DURATION=0.1
    {% elif limit_hit %}
        RESPOND TYPE=error MSG="  T{i}  no convergence after {max_probes} probes, taking final samples anyway..."
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=sample_idx VALUE=0
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=samples VALUE="[]"
        UPDATE_DELAYED_GCODE ID=_cz_sample_loop DURATION=0.1
    {% elif should_fuzz %}
        RESPOND MSG="  T{i}  7 probes without convergence, moving to position {fuzz_attempts + 1}"
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=fuzz_attempts VALUE={fuzz_attempts + 1}
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=since_fuzz    VALUE=0
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=win_count     VALUE=0
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=win_pos       VALUE=0
        UPDATE_DELAYED_GCODE ID=_cz_fuzz_move DURATION=0.1
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=since_fuzz VALUE={new_since_fuzz}
        UPDATE_DELAYED_GCODE ID=_cz_probe_loop DURATION=0.1
    {% endif %}


[delayed_gcode _cz_probe_loop]
gcode:
    # INDX_STOP (or an error) ended the run: do nothing
    {% if printer["gcode_macro _CZ_STATE"].running|int %}
        _CZ_PROBE_STEP
    {% endif %}


#####################################################################
#  FUZZ MOVE
#####################################################################

[gcode_macro _CZ_FUZZ_MOVE]
description: Inner - move to next position on fuzz circle, restart convergence
gcode:
    {% set svv   = printer.save_variables.variables %}
    {% set cz = printer["gcode_macro _CZ_STATE"] %}
    {% set tp    = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set cfg   = printer["gcode_macro CAL_Z"] %}
    {% set th    = printer.toolhead %}
    {% set z_clr = tp.probe_z_clearance|float %}
    {% set i     = cz.current_tool|int %}
    {% set fa    = cz.fuzz_attempts|int %}
    {% set loc   = cfg.probe_location %}
    {% set ins   = cfg.edge_inset|float %}

    # Probe center stored once by CAL_Z into _CZ_STATE
    {% set cx = printer["gcode_macro _CZ_STATE"].cx|float %}
    {% set cy = printer["gcode_macro _CZ_STATE"].cy|float %}

    # 6 positions on a 3 mm radius circle (within the 10 mm diameter),
    # spaced 60° apart so adjacent positions are exactly 3 mm apart.
    {% set fuzz_dx = [ 3.0,  1.5, -1.5, -3.0, -1.5,  1.5] %}
    {% set fuzz_dy = [ 0.0,  2.6,  2.6,  0.0, -2.6, -2.6] %}
    {% set idx = (fa - 1) % (fuzz_dx|length) %}
    {% set tx  = cx + fuzz_dx[idx] %}
    {% set ty  = cy + fuzz_dy[idx] %}

    G0 Z{z_clr} F1500
    G0 X{'%.3f'|format(tx)} Y{'%.3f'|format(ty)} F3000

    UPDATE_DELAYED_GCODE ID=_cz_probe_loop DURATION=0.1


[delayed_gcode _cz_fuzz_move]
gcode:
    # INDX_STOP (or an error) ended the run: do nothing
    {% if printer["gcode_macro _CZ_STATE"].running|int %}
        _CZ_FUZZ_MOVE
    {% endif %}


#####################################################################
#  FINAL SAMPLE LOOP
#####################################################################

[gcode_macro _CZ_SAMPLE_STEP]
description: Inner - small relative retract, take one final sample at current speed, hand off to _CZ_RECORD
gcode:
    {% set svv   = printer.save_variables.variables %}
    {% set cz = printer["gcode_macro _CZ_STATE"] %}
    {% set cfg   = printer["gcode_macro CAL_Z"] %}
    {% set fa    = cz.fuzz_attempts|default(0)|int %}
    {% set spd   = cfg.probe_speed|float %}
    {% set actual_spd = spd / 2.0 if fa >= 2 else spd %}
    # Same relative retract as convergence probes: bed surface already known
    G91
    G0 Z{cfg.probe_retract} F1500
    G90
    _INDX_PROBE_PREP
    PROBE PROBE_SPEED={actual_spd}
    _CZ_RECORD


[gcode_macro _CZ_RECORD]
description: Inner - save this final sample, loop or trigger median calculation
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set cz = printer["gcode_macro _CZ_STATE"] %}
    {% set cfg = printer["gcode_macro CAL_Z"] %}
    {% set i   = cz.current_tool|int %}
    {% set z   = printer.probe.last_z_result|float %}
    {% set idx = cz.sample_idx|default(0)|int %}
    {% set sc  = cfg.sample_count|int %}

    RESPOND MSG="  T{i}  sample {idx + 1}/{sc}: {'%.4f'|format(z)}"
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=samples VALUE="{cz.samples[:idx] + [z]}"
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=sample_idx VALUE={idx + 1}

    {% if idx + 1 >= sc %}
        UPDATE_DELAYED_GCODE ID=_cz_median_loop DURATION=0.1
    {% else %}
        UPDATE_DELAYED_GCODE ID=_cz_sample_loop DURATION=0.1
    {% endif %}


[gcode_macro _CZ_COMPUTE_MEDIAN]
description: Inner - sort final samples, compute median, save result, advance to next tool
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set cz = printer["gcode_macro _CZ_STATE"] %}
    {% set cfg = printer["gcode_macro CAL_Z"] %}
    {% set i   = cz.current_tool|int %}
    {% set sc  = cfg.sample_count|int %}

    {% set ns = namespace(data=[]) %}
    {% for j in range(sc) %}
        {% set ns.data = ns.data + [cz.samples[j]|float] %}
    {% endfor %}

    {% set sorted_samples = ns.data|sort %}
    {% set median = sorted_samples[sc // 2] if sc % 2 == 1 else (sorted_samples[sc // 2 - 1] + sorted_samples[sc // 2]) / 2.0 %}

    RESPOND MSG="  T{i}  median of {sc} samples: {'%.4f'|format(median)}"
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=results VALUE="{cz.results[:i] + [median] + cz.results[i + 1:]}"
    {% set xr = printer["gcode_macro INDX_TOOL_EXPANSION"] %}
    {% set xo = xr.ofs|float|round(5) if cfg.nozzle_temp|float > 0 and xr.ok|int and xr.tool|int == i else none %}
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=xofs VALUE="{cz.xofs[:i] + [xo] + cz.xofs[i + 1:]}"
    {% if cfg.nozzle_temp|float > 0 %}
        # A parked tool cannot be heated. Switch the heater off before the
        # next CHANGE_TOOL parks this tool and picks up the next one.
        M104 S0
    {% endif %}
    # the next tool asked for (TOOLS=), past the last: total_tools ends the run
    {% set tl = cz.tools if cz.tools|default([]) else range(cz.total_tools|int)|list %}
    {% set k = tl.index(i) + 1 if i in tl else tl|length %}
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=current_tool VALUE={tl[k] if k < tl|length else cz.total_tools|int}
    UPDATE_DELAYED_GCODE ID=_cz_tool_loop DURATION=0.1


[delayed_gcode _cz_sample_loop]
gcode:
    # INDX_STOP (or an error) ended the run: do nothing
    {% if printer["gcode_macro _CZ_STATE"].running|int %}
        _CZ_SAMPLE_STEP
    {% endif %}


[delayed_gcode _cz_median_loop]
gcode:
    # INDX_STOP (or an error) ended the run: do nothing
    {% if printer["gcode_macro _CZ_STATE"].running|int %}
        # a hot CAL_Z (NOZZLE_TEMP=): the expansion profile of the tool at
        # this temperature, for _CZ_COMPUTE_MEDIAN
        {% if printer["gcode_macro CAL_Z"].nozzle_temp|float > 0 %}
            INDX_TOOL_EXPANSION FROM=now TO=cold QUIET=1
        {% endif %}
        _CZ_COMPUTE_MEDIAN
    {% endif %}


[delayed_gcode _cz_tool_loop]
gcode:
    # INDX_STOP (or an error) ended the run: do nothing
    {% if printer["gcode_macro _CZ_STATE"].running|int %}
        _CZ_NEXT_TOOL
    {% endif %}


#####################################################################
#  FINALIZE
#####################################################################

[gcode_macro _CZ_FINALIZE]
description: Inner - compute Z offsets from the median results; save them (SAVE=1), ask with old and new values (SAVE=ask) or only report (SAVE=0)
gcode:
    {% set svv    = printer.save_variables.variables %}
    {% set cz = printer["gcode_macro _CZ_STATE"] %}
    {% set cfg    = printer["gcode_macro CAL_Z"] %}
    {% set n      = cz.total_tools|int %}
    {% set ref = svv.ref_tool|default(0)|int %}
    {% set ref_z  = cz.results[ref]|float %}
    {% set t0_off = 0.0 %}
    {% set mode   = cz.save|string %}

    # Same lift as _CZ_NEXT_TOOL
    {% set tc_z = [printer.toolhead.position.z, cfg.toolchange_z|float]|max %}
    G90
    G0 Z{'%.3f'|format(tc_z)} F{(printer.configfile.settings.printer.max_z_velocity|default(printer.configfile.settings.printer.max_velocity)|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 3000}
    PARK_TOOL
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=running VALUE=0

    RESPOND MSG="═══════════════════════════════════════════════"
    RESPOND MSG="  CAL_Z: results"
    RESPOND MSG="  Reference T{ref}: probe Z={'%.4f'|format(ref_z)}  offset 0"
    RESPOND MSG="───────────────────────────────────────────────"
    {% set ns = namespace(vars={}, txt=[], big=0) %}
    # The reference offset is 0: an old non-zero one moves into the global
    # offset, so the reference prints where it did [EL-CAL-002]
    {% set old_ref = svv["t%d_offset_z" % ref]|default(0.0)|float %}
    {% if mode == "1" and old_ref|abs >= 0.0005 %}
        SAVE_VARIABLE VARIABLE=global_z_offset VALUE='{"%.4f"|format(svv.global_z_offset|default(0.0)|float + old_ref)}'
        RESPOND MSG="  The reference T{ref} had a Z offset of {'%+.3f'|format(old_ref)}: moved into the global Z offset"
    {% endif %}
    # Hot CAL_Z: compared on the cold references when both have a profile
    {% set xl = cz.xofs|default([]) %}
    {% set xref = xl[ref] if xl|length > ref else none %}
    {% set tl = cz.tools if cz.tools|default([]) else range(n)|list %}
    {% set redo = (svv.indx_cal|default({})).redo_z|default([]) %}
    {% for i in tl %}
        {% set xi = xl[i] if xl|length > i else none %}
        {% set cx = xref is not none and xi is not none %}
        {% set probe_i = cz.results[i]|float %}
        {% set delta   = (probe_i + xi - ref_z - xref) if cx else (probe_i - ref_z) %}
        {% set new_z   = t0_off + delta %}
        {% set old_z   = svv["t%d_offset_z" % i]|default(none) %}
        {% set _ = ns.vars.update({"t%d_offset_z" % i: new_z|round(3)}) %}
        {% if i != ref %}
            {% set ns.txt = ns.txt + ["T%d %+.3f (was %s)" % (i, new_z, ("%+.3f" % old_z|float) if old_z is not none else "not set")] %}
            # a tool marked for redo (a new tool) is expected to change
            {% if old_z is not none and i not in redo and (new_z - old_z|float)|abs > 0.1 %}{% set ns.big = 1 %}{% endif %}
        {% endif %}
        {% if mode == "1" %}
            SAVE_VARIABLE VARIABLE=t{i}_offset_z VALUE={'%.3f'|format(new_z)}
        {% endif %}
        RESPOND MSG="  T{i}  median={'%.4f'|format(probe_i)}  Δ={'%+.4f'|format(delta)}  → t{i}_offset_z={'%.3f'|format(new_z)}{'  (on the cold references: expansion profiles)' if cx and i != ref else ''}"
        {% if i != ref and (xref is not none) != (xi is not none) %}
        RESPOND TYPE=error MSG="  T{i}: hot CAL_Z: T{ref} and T{i} have mismatched expansion profiles; the difference is not corrected to cold."
        {% endif %}
    {% endfor %}
    # XY sensor trigger heights against the reference tool's
    {% set sens = cz.sensor|default({}) %}
    {% if ref in sens %}
        {% set _ = ns.vars.update({"sensor_ref_z": sens[ref]|float|round(4)}) %}
        {% for i in range(n) if i in sens and i != ref %}
            {% set sdz = sens[i]|float - sens[ref]|float %}
            {% set _ = ns.vars.update({"t%d_sensor_dz" % i: sdz|round(4)}) %}
            RESPOND MSG="  T{i}  XY sensor {'%+.4f'|format(sdz)} mm against T{ref} → t{i}_sensor_dz"
            {% if mode == "1" %}
                SAVE_VARIABLE VARIABLE=t{i}_sensor_dz VALUE={'%.4f'|format(sdz)}
            {% endif %}
        {% endfor %}
        {% if mode == "1" %}
            SAVE_VARIABLE VARIABLE=sensor_ref_z VALUE={'%.4f'|format(sens[ref]|float)}
        {% endif %}
    {% elif sens %}
        RESPOND MSG="  No XY sensor reading of the reference tool T{ref}: the sensor readings are not saved"
    {% endif %}
    RESPOND MSG="═══════════════════════════════════════════════"
    {% if mode == "1" %}
        RESPOND MSG="  Saved. The next tool change applies the new offsets."
        {% if "gcode_macro _INDX_Z_SAVED" in printer %}
            _INDX_Z_SAVED TOOLS={'all' if tl|length == n else (tl|reject('equalto', ref)|join(','))}
        {% endif %}
    {% elif mode == "ask" and "gcode_macro _INDX_PENDING_SET" in printer %}
        # Measure again keeps the route (INDX_CAL_TOOLS: XY after Save)
        {% set chain = printer["gcode_macro INDX_CAL_TOOLS"].chain|int if "gcode_macro INDX_CAL_TOOLS" in printer else 0 %}
        # Saved with the offsets: an old reference offset moves into the global one
        {% if old_ref|abs >= 0.0005 %}
            {% set _ = ns.vars.update({"global_z_offset": (svv.global_z_offset|default(0.0)|float + old_ref)|round(4)}) %}
        {% endif %}
        {% set sub = tl|length != n %}
        _INDX_PENDING_SET VARS='{ns.vars|tojson}' POST="_INDX_Z_SAVED~TOOLS={(tl|reject('equalto', ref)|join(',')) if sub else 'all'}" WHAT="Z offsets {ns.txt|join(', ')}" AGAIN="INDX_CAL_Z~LOADED=0~CHAIN={chain}{('~TOOLS=' ~ (tl|reject('equalto', ref)|join(','))) if sub else ''}"
        _INDX_RUNNING STEP=none
        _INDX_PENDING_ASK TITLE="CAL_Z: Save the Z Offsets?" TEXT="{ns.txt|join(', ')} mm." TEXT2="{'One or more changed by more than 0.1 mm: check the nozzles are clean and empty.' if ns.big else ('Changes are within 0.1 mm.' if not (tl|select('in', redo)|list) else 'Changes are within 0.1 mm, apart from a tool marked for redo (a new tool).')}" WARN={ns.big}
    {% else %}
        RESPOND MSG="  SAVE=0: nothing saved."
    {% endif %}

[gcode_macro _CZ_STATE]
description: Inner - CAL_Z working state, in memory only: a restart starts CAL_Z over
variable_running: 0
variable_save: "1"
variable_total_tools: 0
# tools: the tools measured, the reference first (TOOLS=, else every dock)
variable_tools: []
variable_current_tool: 0
variable_probe_count: 0
variable_since_fuzz: 0
variable_win_count: 0
variable_win_pos: 0
variable_fuzz_attempts: 0
variable_win: [0.0, 0.0, 0.0, 0.0]
variable_sample_idx: 0
variable_samples: []
variable_results: []
# xofs: per tool, NOZZLE_TEMP > 0 only: its expansion profile's correction of
#   the median onto its cold reference (mm), or none (no usable profile)
variable_xofs: []
# sensor: {tool: trigger Z on the inductive XY sensor} of this run (cold tools)
variable_sensor: {}
# probe center stored once at CAL_Z init, read by _CZ_NEXT_TOOL and _CZ_FUZZ_MOVE
variable_cx: 0.0
variable_cy: 0.0
gcode:

[gcode_macro _CZ_ABORT]
description: Inner - INDX_STOP during CAL_Z: heater off, nothing saved, Z up
gcode:
    {% set cz = printer["gcode_macro _CZ_STATE"] %}
    SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=running VALUE=0
    M104 S0
    RESPOND MSG="INDX ok CAL_Z stopped during T{cz.current_tool} ({params.WHY|default('stop')}). Nothing saved. T{printer.save_variables.variables.active_tool|default(-1)} stays on the head."

#####################################################################
#  DOCK X CALIBRATION
#####################################################################
#
#  CALIBRATE_DOCK_X measures a dock's X from where the head stands in it
#  (COREXY_MOTOR_HOME, else INDX_DOCK_MEASURE), no prior G28 needed. The
#  result is read one tick later and offered with Save.
#
#  Workflow:
#    1. M84  (disable motors)
#    2. Manually slide the toolhead to the tool dock
#    3. CALIBRATE_DOCK_X TOOL=N, then Save
#    4. Repeat from step 1 for each additional tool
#    5. G28 to restore machine coordinates
#
#  INDX_CAL_DOCK TOOL=N measures X and Y with dialogs. Already homed: jog
#  to the dock and run INDX_CAL_DOCK_X_HERE TOOL=N (no homing move).
#
#####################################################################

[gcode_macro CALIBRATE_DOCK_X]
description: Measure TOOL=n's dock X (after M84 and sliding the head to the dock by hand): one-motor homing with COREXY_MOTOR_HOME, INDX_DOCK_MEASURE without xy_dual_stall. INDX_CAL_DOCK does X and Y with dialogs. Moves: X and Y home. Saves: t<n>_dock_x after Save
variable_tool: 0
gcode:
    {% if 'TOOL' not in params %}
        {action_raise_error("CALIBRATE_DOCK_X requires TOOL=<n>")}
    {% endif %}
    {% set t = params.TOOL|int %}
    SET_GCODE_VARIABLE MACRO=CALIBRATE_DOCK_X VARIABLE=tool VALUE={t}
    RESPOND MSG="──────────────────────────────────────────────"
    RESPOND MSG="  CALIBRATE_DOCK_X  T{t}"
    RESPOND MSG="  Ensure motors are disabled (M84) and the head"
    RESPOND MSG="  is positioned by hand at the T{t} dock."
    RESPOND MSG="──────────────────────────────────────────────"
    # One-motor contacts when xy_dual_stall is there; both store where they started
    {% if "xy_dual_stall" in printer.configfile.settings %}
        COREXY_MOTOR_HOME
    {% else %}
        INDX_DOCK_MEASURE
    {% endif %}
    # Result is only readable after the command runs: pick it up next tick.
    UPDATE_DELAYED_GCODE ID=_cal_dock_x_report DURATION=0.1


[delayed_gcode _cal_dock_x_report]
gcode:
    {% set t = printer["gcode_macro CALIBRATE_DOCK_X"].tool|int %}
    {% if "xy_dual_stall" in printer.configfile.settings %}
        {% set h = printer.xy_dual_stall.home|default(none) %}
        {% set m = {'x': h.start[0]} if h else none %}
    {% else %}
        {% set m = printer.indx.last_dock_measurement %}
    {% endif %}
    {% if m %}
        # Only X: INDX_CAL_DOCK measures X and Y
        _INDX_DOCK_OFFER TOOL={t} X={m['x']|float} SRC="CALIBRATE_DOCK_X" AGAIN=CALIBRATE_DOCK_X~TOOL={t}
    {% else %}
        RESPOND TYPE=error MSG="No dock measurement available. Did INDX_DOCK_MEASURE run?"
    {% endif %}

[gcode_macro _CAL_LATCH_ENGAGE]
description: Inner - 3 mm E move after tool pickup to ensure latch is fully engaged during calibration (never called during printing). Skipped for a tool with filament recorded
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set svv = printer.save_variables.variables %}
    # Filament recorded, or a lock that met a plug: no cold push [EL-CAL-003]
    {% set loaded = act >= 0 and (svv["t%d_material" % act]|default("")|string|length > 0 or svv["t%d_fil_density" % act]|default(0)|float > 0) %}
    {% if loaded or (printer["gcode_macro _INDX_LOCK_PAST"].frozen|default(0)|int if "gcode_macro _INDX_LOCK_PAST" in printer else 0) %}
    RESPOND MSG="INDX > T{act} has filament recorded: latch engage move skipped"
    {% else %}
    SAVE_GCODE_STATE NAME=_cal_latch
    _TC_SET_ROTATION_DIST
    # Latch engage through _TC_LATCH_MOVE (works cold).
    _TC_LATCH_MOVE E=3 F=300
    _TC_RESTORE_ROTATION_DIST
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=0
    RESTORE_GCODE_STATE NAME=_cal_latch
    {% endif %}


[gcode_macro SHOW_VARIABLES]
description: List the saved variables (variables.cfg) with value, meaning and whether to edit them. NAME= filters. Moves: nothing
# variables.cfg cannot carry comments: Klipper rewrites the whole file on
# every SAVE_VARIABLE (every tool change), so the explanations live here.
# [you]  safe to change yourself
# [cal]  set by a calibration; re-running it is better, editing works
# [INDX] INDX's own state; don't edit
variable_help: {
    "active_tool": ["INDX", "tool on the head, -1 = none. Fix a wrong value with INDX_SEAT_TOOL_BY_HAND TOOL=n or INDX_RELEASE_TOOL_BY_HAND"],
    "seat_suspect": ["INDX", "tool number a failed pickup or park may have left half seated or hanging on the head (-1 none); G28 Z, CHANGE_TOOL and PARK_TOOL refuse until INDX_SEAT_TOOL_BY_HAND or INDX_RELEASE_TOOL_BY_HAND"],
    "tool_unverified": ["INDX", "1 = a stop kept the tool recorded on the head without proof; the next G28 checks it (push test or INDX_CONFIRM_TOOL)"],
    "toolhead_state": ["INDX", "latch state: 0 locked, 2 open"],
    "tc_mode": ["you", "tool change speed: normal, stealth, sport or race (MODE_NORMAL / MODE_STEALTH / MODE_SPORT / MODE_RACE)"],
    "toolchange_count": ["INDX", "tool changes so far (TC_RESET_COUNT sets it to 0)"],
    "global_z_offset": ["you", "first-layer height trim for every tool, mm (+ = higher). Babystep, then Z_OFFSET_APPLY_PROBE"],
    "zero_z_shift": ["INDX", "part of global_z_offset set by the print start Z re-zero, mm (ZERO_Z_CLEAR removes it)"],
    "z_home_tool": ["INDX", "tool that set Z at the last G28 (normally 0)"],
    "tN_offset_x": ["cal", "tool N nozzle X relative to the reference tool, mm (INDX_ALIGN or the camera routine)"],
    "tN_offset_y": ["cal", "tool N nozzle Y relative to the reference tool, mm (INDX_ALIGN or the camera routine)"],
    "tN_offset_z": ["cal", "tool N nozzle height relative to the reference tool, mm, + = higher (CAL_Z or CAL_Z_LOADED)"],
    "tN_sensor_dz": ["cal", "tool N trigger height on the inductive XY sensor minus the reference tool's, cold, mm (CAL_Z with the sensor); the print's cold Z check compares with it"],
    "sensor_ref_z": ["cal", "the reference tool's cold trigger height on the inductive XY sensor, machine Z, mm (CAL_Z with the sensor)"],
    "ref_tool": ["INDX", "the reference tool: Z homes on it and every offset is relative to it (INDX_SET_REFERENCE)"],
    "tN_fil_density": ["cal", "tool N filament density for the heater safety model, g/cm3 (LOAD_FILAMENT or SET_TOOL_FILAMENT; 0 = empty)"],
    "tN_fil_hc": ["cal", "tool N filament heat capacity for the heater safety model, J/g/K (LOAD_FILAMENT or SET_TOOL_FILAMENT)"],
    "tN_retracted": ["INDX", "mm of filament tool N is retracted by; the next prime refills it"],
    "tN_material": ["INDX", "material in tool N (LOAD_FILAMENT, INDX_SET_MATERIAL), empty = unloaded"],
    "tN_temp": ["INDX", "load temperature of the material in tool N, C"],
    "tN_color": ["you", "color of the filament in tool N, 6 hex digits (INDX_SET_MATERIAL COLOR=)"],
    "tN_load_tc": ["INDX", "tool change count when tool N was loaded"],
    "tN_last_material": ["INDX", "the last material recorded in tool N, kept when it is emptied: its Tg says when heating the empty tool dirties its tip"],
    "tN_clean": ["INDX", "1 = tool N's tip was cleaned and checked (PRIME_CLEAN, INDX_HOT_CLEAN) and not heated above its filament's Tg since; 0 or missing = needs cleaning"],
    "tN_clean_note": ["INDX", "what last flagged tool N clean, and when"],
    "tN_expansion": ["cal", "tool N's expansion profile (INDX_CAL_TOOL_EXPANSION, measured empty up to 250 C): pts [C, mm longer than at the cold reference t0], fit (poly2 or table), k (mm/C, mm/C2), err (5.2 sigma, mm), rms, res (step mean residuals), close (the closing cold taps: C, mm off the profile), n, m, force, bed, date, use (0 = saved, not used: why). INDX_TOOL_EXPANSION reads it wherever INDX taps a warm or hot nozzle"],
    "z_scan_touch_clean": ["INDX", "recent load cell Z home touches against the scanner's Z taken with a clean or empty reference tool, first homes after a scanner seek only, [mm, bed C, 1]: the expected touch at the bed temperature moves a scanner-only Z onto the load cell frame for the G28 reference clean"],
    "scanner_twist": ["INDX", "old: INDX's own scanner twist, replaced by Kalico's twist map of the scanner (INDX_CAL_SCANNER_TWIST, [axis_twist_compensation <scanner>] in printer.cfg). Emptied at startup"],
    "scanner_meshes": ["INDX", "old: the scanner meshes of the INDX scanner mesh before Kalico's rapid scan, not reused. Emptied at startup"],
    "scanner_scans": ["INDX", "the scanner meshes INDX_SCANNER_MESH made, by bed mesh profile (scanner_<bed C>): bed temperature, order and what they were made with (the [bed_mesh] area, the scanner calibration, the twist map), for the print start to reuse at the same bed temperature"],
    "tN_misload": ["INDX", "1 = tool N was marked after a misload that did not seat: pull its filament out before its next use (a load or INDX_SET_MATERIAL clears it)"],
    "tN_nozzle": ["you", "nozzle size of tool N, mm (INDX_SET_NOZZLE, or the INDX page)"],
    "tN_name": ["you", "a name for tool N shown on the INDX page (INDX_SET_TOOL_NAME)"],
    "cam_pos_x": ["cal", "nozzle camera reference X, mm (INDX_CAM_SET_REF)"],
    "cam_pos_y": ["cal", "nozzle camera reference Y, mm (INDX_CAM_SET_REF)"],
    "cam_pos_z": ["cal", "nozzle camera reference Z, mm (INDX_CAM_SET_REF)"],
    "bucket_x": ["cal", "prime bucket origin X: the X calibration V, mm (PRIME_BUCKET_CALIBRATE AXIS=X)"],
    "bucket_y": ["cal", "prime bucket origin Y: the Y calibration V, mm (PRIME_BUCKET_CALIBRATE AXIS=Y)"],
    "bucket_layout": ["cal", "prime bucket station layout the saved bucket values are for, v3 when both axes are calibrated, v3:X / v3:Y while one is missing (PRIME_BUCKET_CALIBRATE)"],
    "bucket_line_dy": ["cal", "prime bucket: groove center line off the Y calibration V, mm (default 0; PRIME_BUCKET_SET_Y, PRIME_BUCKET_AUTOCAL)"],
    "bucket_wall_dy": ["cal", "prime bucket v1 station only (not used by v2): purge line distance from the wall contact, mm"],
    "bucket_purge_dx": ["cal", "prime bucket: purge point along the line from the X calibration V, mm"],
    "bucket_purge_dy": ["cal", "prime bucket v1 station only (not used by v2): groove exit center off the slot center line, mm"],
    "bucket_tap_force": ["you", "prime bucket: load cell force for its touch checks, g"],
    "bucket_tap_speed": ["you", "prime bucket: speed of its touch checks, mm/s"],
    "bucket_pellets": ["INDX", "prime bucket: pellets ejected since it was emptied"],
    "tool_count": ["INDX", "the number of docks, counted by the setup (INDX_DOCK_ADD, INDX_TOOL_REMOVE); wins over indx.cfg, never edit it"],
    "tN_dock_x": ["cal", "tool N dock X, mm, measured (INDX_CAL_DOCK); wins over indx.cfg"],
    "tN_dock_y": ["cal", "tool N dock Y, mm, measured (INDX_CAL_DOCK); wins over indx.cfg"],
    "tN_dock_new": ["INDX", "1 = dock measured but not driven into yet: the first pickup or park runs at 20 % speed"],
    "indx_clearance": ["you", "clearance_y override: auto, a number, or None for indx.cfg (INDX_SET_CLEARANCE)"],
    "lc_trigger_offset": ["cal", "load cell trigger offset, mm (INDX_CAL_TRIGGER); replaces the indx_prime.cfg value"],
    "indx_cal": ["INDX", "setup progress: steps done, soak times per bed temperature, offsets to redo (INDX_STATUS shows it)"],
    "tN_dock_y_meas": ["cal", "tool N dock Y as INDX_CAL_DOCK_Y_FINE last measured it, mm"],
    "tN_lock_g": ["cal", "lock force target of the tool in dock N, g (INDX_CAL_LOCK); follows the tool through the library, None = not calibrated"],
    "tN_pass_g": ["cal", "seat check pass level of the tool in dock N, g (INDX_CAL_LOCK); follows the tool"],
    "tN_lock_clamp_g": ["cal", "clamp of the tool in dock N at the travel limit, g (INDX_CAL_LOCK); follows the tool"],
    "tN_seat_g": ["cal", "seat weight of the tool in dock N with the latch fully closed, g (INDX_CAL_LOCK); follows the tool"],
    "tN_confirm_g": ["cal", "seat check level of the tool in dock N when the lock reached its target, g (INDX_CAL_LOCK); follows the tool"],
    "tN_close_peak_g": ["cal", "clamp peak of the tool in dock N while closing out of the dock after the peel, g (INDX_CAL_LOCK); follows the tool"],
    "tN_ooze_stopper": ["you", "1 = dock N has an ooze stopper: no park cooling for it, its park check learns its own normal (INDX_DOCK_STOPPER, the Tool library); stays with the dock"],
    "tN_park_g": ["INDX", "dock N with an ooze stopper: the load cell change of its recent good parks, with the tool and the load cell calibration they belong to (the park check own normal)"],
    "lc_cpg": ["INDX", "load cell counts per gram the saved gram values belong to: when the calibration changes they are converted by old/new (_INDX_LC_SYNC)"],
    "lc_cpg_src": ["INDX", "what the load cell calibration in use is based on: spring (the latch spring of one tool), seats (every tool, INDX_CAL_LOCK or INDX_CAL_LOADCELL_REFINE) or weight (INDX_CAL_LOADCELL_WEIGHT, kept by the others)"],
    "indx_archive": ["INDX", "archived tools and removed docks with everything they had (INDX_ARCHIVE_RECALL, INDX_ARCHIVE_DELETE)"],
    "tN_abrasive": ["you", "1 = tool N has abrasive filament or an abrasive-rated nozzle (INDX_SET_MATERIAL, the INDX page)"],
    "tN_cht": ["you", "1 = tool N has a CHT nozzle (INDX_SET_NOZZLE CHT=1)"],
    "tN_spool": ["you", "Spoolman spool id in tool N"],
    "latch_sg_stop": ["cal", "latch homing StallGuard threshold (INDX_CAL_LATCH)"],
    "latch_sg_band": ["cal", "latch homing StallGuard readings while moving (INDX_CAL_LATCH)"],
    "lock_clear_e": ["INDX", "mm of forward motion still needed after a lock before a retraction is allowed (kept over a restart)"],
    "lock_short": ["INDX", "1 = the last lock stopped short of the release (frozen filament), or could not feel it (an unsensed lock of a cold tool with filament): no probing until the tool has moved lock_clear_e forward (kept over a restart)"],
    "indx_suite_notice_off": ["you", "1 = the dialog about the INDX Suite does not come up at a start any more (its console line stays)"],
    "pause_park_ok": ["you", "INDX Macros: the length of the PAUSE macro you confirmed parks on the bed side (the setup's pause step); a changed PAUSE asks again"],
    "tN_tip_shaped": ["INDX", "mm tool N was retracted by its last tip shaping (INDX_TIP_SHAPE), 0 once its next lock has taken the lock feed off tN_retracted"],
    "lock_motion_v": ["INDX", "tool change speed the lock force was calibrated at"],
    "lock_motion_a": ["INDX", "tool change acceleration the lock force was calibrated at"],
    "z_touch_hist": ["INDX", "recent Z home touch heights with the bed temperature and where Z came from (1 the scanner seek, 2 an earlier load cell home, 0 other), [mm, bed C, kind], the last 30: the G28 touch check expects the touch of homes of the same kind at this bed temperature, the reference clean's Z correction uses kind 1 only"],
    "v2z_*": ["INDX", "old CAL_Z working state, no longer used (CAL_Z keeps it in memory now)"]
    }
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set flt = params.NAME|default("")|string|lower %}
    {% set ns = namespace(lines=[], v2z=0) %}
    {% for k in svv|sort %}
        {% if flt in k|lower %}
            {% set head = k.split("_", 1)[0] %}
            {% if k.startswith("v2z_") %}
                {% set ns.v2z = ns.v2z + 1 %}
            {% else %}
                {% if head|length > 1 and head[0] == "t" and head[1:].isdigit() %}
                    {% set g = "tN_" ~ k.split("_", 1)[1] %}
                {% else %}
                    {% set g = k %}
                {% endif %}
                {% if g in help %}
                    {% set h = help[g] %}
                {% elif g.startswith("indx_") or g.startswith("xy_touch_phase") %}
                    {% set h = ["INDX", "INDX's own state or settings (the INDX page uses it); don't edit"] %}
                {% else %}
                    {% set h = ["?", "not known to this INDX version: check what wrote it before deleting it"] %}
                {% endif %}
                # tool names stay on the INDX page: the library and archive show counts here
                {% set val = ("(%d tools: see the INDX page)" % svv[k]|length) if k == "indx_tools_db" else (("(%d tools, %d docks: see the INDX page)" % (svv[k].get("tools", {})|length, svv[k].get("docks", {})|length)) if k == "indx_archive" else svv[k]|string) %}
                {% set ns.lines = ns.lines + ["%-18s %-10s [%s] %s" % (k, val, h[0], h[1])] %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if ns.v2z %}
        {% set ns.lines = ns.lines + ["v2z_* (%d values)    [INDX] %s" % (ns.v2z, help["v2z_*"][1])] %}
    {% endif %}
    {% set foot = ["",
        "[you] safe to change  [cal] set by a calibration (re-run it, or edit)  [INDX] don't edit",
        "Change one: SAVE_VARIABLE VARIABLE=<name> VALUE=<value> (takes effect at once).",
        "Editing variables.cfg by hand only sticks if Klipper restarts before anything saves a variable: every tool change rewrites the file."] %}
    {action_respond_info("INDX saved variables" ~ (" matching '" ~ flt ~ "'" if flt else "") ~ ":\n" ~ (ns.lines + foot)|join("\n"))}

[gcode_macro INDX_RESET_OFFSETS]
description: Zero the X, Y and Z offset of every tool, to calibrate from scratch. Needs: CONFIRM=1, or it asks first. Moves: nothing (the live offset of the tool on the head changes). Saves: tN_offset_x/y/z 0. Prints the old values first. The global Z offset stays
# Throws away every calibrated offset: a start from scratch, not a tidy-up.
gcode:
    {% if params.CONFIRM|default(0)|int != 1 %}
        {% set svv = printer.save_variables.variables %}
        {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
        {% set ns = namespace(set=0) %}
        {% for i in range(n) %}
            {% for a in ["x", "y", "z"] %}
                {% if svv["t%d_offset_%s" % (i, a)]|default(0.0)|float != 0.0 %}
                    {% set ns.set = ns.set + 1 %}
                {% endif %}
            {% endfor %}
        {% endfor %}
        _INDX_PROMPT TITLE="Zero Every Tool Offset?" TEXT="All X, Y and Z offsets of {n} tools are set to 0 ({ns.set} of them are set now). The old values are printed in the console first." TEXT2="Afterwards every tool needs its Z and XY calibration again before printing." B1="Zero all offsets: redo calibration|INDX_RESET_OFFSETS CONFIRM=1|error" F1="Cancel, keep the offsets|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT_END
        _INDX_RESET_OFFSETS_RUN
    {% endif %}

[gcode_macro RESET_TOOL_OFFSETS]
description: Renamed to INDX_RESET_OFFSETS; the old name still runs it straight away, as in INDX main (scripts, KlipperScreen buttons)
gcode:
    _INDX_RENAMED OLD=RESET_TOOL_OFFSETS NEW=INDX_RESET_OFFSETS
    INDX_RESET_OFFSETS CONFIRM=1 {rawparams}

[gcode_macro _INDX_RESET_OFFSETS_RUN]
description: Inner - INDX_RESET_OFFSETS after the CONFIRM: print the old offsets, zero them, apply to the tool on the head
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tp  = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set n   = tp.tool_count|int %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set gz  = svv.global_z_offset|default(0.0)|float %}

    RESPOND MSG="----------------------------------------"
    RESPOND MSG="  INDX_RESET_OFFSETS - clearing {n} tools"
    RESPOND MSG="  Previous values, in case you want them back:"
    {% for i in range(n) %}
        {% set ox = svv["t" ~ i ~ "_offset_x"]|default("--")|string %}
        {% set oy = svv["t" ~ i ~ "_offset_y"]|default("--")|string %}
        {% set oz = svv["t" ~ i ~ "_offset_z"]|default("--")|string %}
        RESPOND MSG="    T{i}  X={ox}  Y={oy}  Z={oz}"
    {% endfor %}

    {% for i in range(n) %}
        SAVE_VARIABLE VARIABLE=t{i}_offset_x VALUE=0.0
        SAVE_VARIABLE VARIABLE=t{i}_offset_y VALUE=0.0
        SAVE_VARIABLE VARIABLE=t{i}_offset_z VALUE=0.0
    {% endfor %}

    # Apply to the tool on the head, Z keeping the global offset; MOVE=1 only
    # when homed
    {% if act >= 0 %}
        {% if "xyz" in printer.toolhead.homed_axes %}
            SET_GCODE_OFFSET X=0.0 Y=0.0 Z='{"%.3f"|format(gz)}' MOVE=1
            _INDX_Z_APPLIED Z={"%.4f"|format(gz)}
        {% else %}
            SET_GCODE_OFFSET X=0.0 Y=0.0 Z='{"%.3f"|format(gz)}' MOVE=0
            _INDX_Z_APPLIED Z={"%.4f"|format(gz)}
        {% endif %}
    {% endif %}

    RESPOND MSG="  All tool offsets zeroed."
    RESPOND MSG="  Re-run CAL_Z and your XY calibration before printing."
    RESPOND MSG="----------------------------------------"

[gcode_macro RESET_GLOBAL_Z]
description: Set the global Z offset (first-layer trim) to 0. Moves: nothing (the live offset changes). Saves: global_z_offset
gcode:
    SAVE_VARIABLE VARIABLE=global_z_offset VALUE=0.0
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% if act >= 0 %}
        {% set tool_z = svv["t" ~ act ~ "_offset_z"]|default(0.0)|float %}
        {% set mv = "xyz" in printer.toolhead.homed_axes %}
        SET_GCODE_OFFSET Z='{"%.3f"|format(tool_z)}' MOVE={1 if mv else 0}
        _INDX_Z_APPLIED Z={"%.4f"|format(tool_z)}
    {% endif %}
    RESPOND MSG="Global Z offset cleared to 0.0"

[gcode_macro ADJUST_GLOBAL_Z]
description: Change the global Z offset (first-layer trim) by ADJUST= mm, + = higher. Moves: Z by that amount. Saves: global_z_offset
gcode:
    {% set delta = params.ADJUST|default(0.0)|float %}
    {% set svv   = printer.save_variables.variables %}
    {% set old_gz = svv.global_z_offset|default(0.0)|float %}
    {% set new_gz = old_gz + delta %}
    SAVE_VARIABLE VARIABLE=global_z_offset VALUE='{"%.3f"|format(new_gz)}'
    {% set act = svv.active_tool|default(-1)|int %}
    {% if act >= 0 %}
        {% set tool_z = svv["t" ~ act ~ "_offset_z"]|default(0.0)|float %}
        {% set mv = "xyz" in printer.toolhead.homed_axes %}
        SET_GCODE_OFFSET Z='{"%.3f"|format(tool_z + new_gz)}' MOVE={1 if mv else 0}
        _INDX_Z_APPLIED Z={"%.4f"|format(tool_z + new_gz)}
    {% endif %}
    RESPOND MSG="Global Z offset: {'%.3f'|format(new_gz)} mm  (adjusted {'%+.3f'|format(delta)})"

[gcode_macro SYNC_GLOBAL_Z]
description: Store the live babystep as the global Z offset. Moves: nothing. Saves: global_z_offset
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set tool_z = svv["t" ~ act ~ "_offset_z"]|default(0.0)|float if act >= 0 else 0.0 %}
    {% set new_gz = printer.gcode_move.homing_origin.z|float - tool_z %}
    SAVE_VARIABLE VARIABLE=global_z_offset VALUE='{"%.3f"|format(new_gz)}'
    # No babystep left for the next tool change to carry
    _INDX_Z_APPLIED Z={"%.4f"|format(printer.gcode_move.homing_origin.z|float)}
    RESPOND MSG="Global Z offset synced: {'%.3f'|format(new_gz)} mm"

[gcode_macro Z_OFFSET_APPLY_PROBE]
rename_existing: _Z_OFFSET_APPLY_PROBE_BASE
description: Bake the first-layer trim (global Z offset and any babystep, without the print start re-zero shift) into [load_cell_probe] z_offset. Run SAVE_CONFIG to keep it.
gcode:
    # The base command subtracts homing_origin.z (tool_z + global_z), so set it
    # to the trim alone first: the live babystep (so Mainsail/Fluidd Apply works)
    # minus zero_z_shift, which belongs to this print's G28 only.
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set tool_z = svv["t" ~ act ~ "_offset_z"]|default(0.0)|float if act >= 0 else 0.0 %}
    {% set shift = svv.zero_z_shift|default(0.0)|float %}
    {% set global_z = printer.gcode_move.homing_origin.z|float - tool_z %}
    {% set trim = global_z - shift %}
    SET_GCODE_OFFSET Z='{"%.4f"|format(trim)}'
    _INDX_Z_APPLIED Z={"%.4f"|format(trim)}
    _Z_OFFSET_APPLY_PROBE_BASE
    SET_GCODE_OFFSET Z='{"%.4f"|format(tool_z + shift)}'
    _INDX_Z_APPLIED Z={"%.4f"|format(tool_z + shift)}
    SAVE_VARIABLE VARIABLE=global_z_offset VALUE='{"%.4f"|format(shift)}'
    {% if trim|abs > 0.00005 %}
        RESPOND MSG="INDX ok First-layer trim {'%+.3f'|format(trim)} mm baked into [load_cell_probe] z_offset{(' (the re-zero shift %+.3f mm was left out)' % shift) if shift != 0 else ''}. Run SAVE_CONFIG to keep it."
    {% else %}
        RESPOND MSG="INDX ok No first-layer trim to bake: [load_cell_probe] z_offset unchanged."
    {% endif %}


#####################################################################
#  FILAMENT LOADING & HEAT CAPACITY
#####################################################################
#
#  LOAD_FILAMENT picks up a tool, tells the INDX safety thermal model
#  which filament is loaded, heats up, then feeds and primes it.
#
#    LOAD_FILAMENT TOOL=<n> TYPE=<material> [TEMP=<c>] [MEASURE=<0|1>]
#
#  The safety thermal model needs to know how much heat the filament
#  carries away. TYPE=<material> applies a density + heat-capacity preset
#  (from the filament_presets table below) plus a default load temperature.
#  Presets are good starting points; for the most accurate model on a
#  specific filament pass MEASURE=1 and INDX_LOAD_FILAMENT will measure the
#  heat capacity while loading; it is recorded for that tool (tN_fil_hc) and
#  restored at each pickup, like a preset. No SAVE_CONFIG needed.
#
#  TEMP=<c> overrides the preset load temperature. Requires a calibrated
#  thermal model: run INDX_CALIBRATE first.
#
#  Edit filament_presets to add materials or tune values
#  (temp °C / density g/cm^3 / heat capacity J/g/K / optional speed mm/s),
#  or INDX_FILAMENT_PRESET from the INDX page. speed is passed to
#  INDX_LOAD_FILAMENT; omit it to use the firmware default. The tip_* keys
#  are the tip forming per material (INDX_TIP_SHAPE, docs/tip-forming.md):
#  tip_purge mm pushed out first (0), tip_ram ramming cycles, tip_sep the
#  separation pull mm, tip_speed its speed mm/s, tip_cool the final pull's
#  nozzle temperature C.
#
#  change_purge: mm a purge station purges after the refill at a tool change
#  visit (the slicer's PURGE= overrides it). Ratios from Prusa's XL tool
#  changer profiles. [EL-CAL-016]
#
#####################################################################

[gcode_macro SET_TOOL_FILAMENT]
description: Record the filament in TOOL=n for the heater safety model (DENSITY= g/cm3, HEAT_CAPACITY= J/g/K) and apply it now. Moves: nothing. Saves: tN_fil_density, tN_fil_hc. Re-applied at every pickup of that tool
gcode:
    {% if 'TOOL' not in params or 'DENSITY' not in params or 'HEAT_CAPACITY' not in params %}
        {action_raise_error("Usage: SET_TOOL_FILAMENT TOOL=<n> DENSITY=<g/cm^3> HEAT_CAPACITY=<J/g/K>")}
    {% endif %}
    {% set t = params.TOOL|int %}
    {% set d = params.DENSITY|float %}
    {% set h = params.HEAT_CAPACITY|float %}
    # The model uses only density * heat_capacity: the product must be right
    SAVE_VARIABLE VARIABLE=t{t}_fil_density VALUE={d}
    SAVE_VARIABLE VARIABLE=t{t}_fil_hc VALUE={h}
    {% if "indx" in printer %}
    INDX_SET_MODEL_PARAMS FILAMENT_DENSITY={d} FILAMENT_HEAT_CAPACITY={h}
    {% endif %}

[gcode_macro _INDX_FIL_RECORD]
description: Inner - record what is in TOOL=: TYPE= (material, NONE = empty), TEMP= (C), COLOR= (6 hex digits, no #), ABRASIVE= (0 or 1, cleared when empty), and the tool change count it was loaded at. Empty also clears the heater model's filament (density and heat capacity 0, as Kalico's CLEAR_FILAMENT). Saves: tN_material, tN_last_material, tN_temp, tN_color, tN_abrasive, tN_load_tc (empty: tN_fil_density, tN_fil_hc)
gcode:
    {% set t = params.TOOL|int %}
    {% set type = params.TYPE|default("")|string|upper %}
    {% set col = params.COLOR|default("")|string|lower %}
    {% if col|length != 6 %}
        {% set col = "" %}
    {% endif %}
    {% set was = printer.save_variables.variables["t%d_material" % t]|default("")|string %}
    {% if type == "NONE" %}
        # the last material that was in it: its Tg still says when heating
        # the empty tool makes its tip dirty (t<n>_clean, indx_clog)
        {% if was and was|upper != "NONE" %}
            SAVE_VARIABLE VARIABLE=t{t}_last_material VALUE='"{was}"'
        {% endif %}
        SAVE_VARIABLE VARIABLE=t{t}_material VALUE='""'
        SAVE_VARIABLE VARIABLE=t{t}_temp VALUE=0
        SAVE_VARIABLE VARIABLE=t{t}_color VALUE='""'
        SAVE_VARIABLE VARIABLE=t{t}_abrasive VALUE=0
        # No filament: none for the heater model either, so the density
        # says whether the tool is loaded
        SAVE_VARIABLE VARIABLE=t{t}_fil_density VALUE=0.0
        SAVE_VARIABLE VARIABLE=t{t}_fil_hc VALUE=0.0
        {% if "indx" in printer and printer.save_variables.variables.active_tool|default(-1)|int == t %}
            INDX_SET_MODEL_PARAMS FILAMENT_DENSITY=0 FILAMENT_HEAT_CAPACITY=0
        {% endif %}
    {% else %}
        SAVE_VARIABLE VARIABLE=t{t}_material VALUE='"{type}"'
        SAVE_VARIABLE VARIABLE=t{t}_last_material VALUE='"{type}"'
        SAVE_VARIABLE VARIABLE=t{t}_temp VALUE={params.TEMP|default(0)|int}
        {% if col or "COLOR" in params %}
            SAVE_VARIABLE VARIABLE=t{t}_color VALUE='"{col}"'
        {% endif %}
        {% if "ABRASIVE" in params %}
            SAVE_VARIABLE VARIABLE=t{t}_abrasive VALUE={1 if params.ABRASIVE|int else 0}
        {% endif %}
        SAVE_VARIABLE VARIABLE=t{t}_load_tc VALUE={printer.save_variables.variables.toolchange_count|default(0)|int}
    {% endif %}
    # a misload mark (_INDX_MISLOAD_MARK) ends when the filament is recorded again
    {% if printer.save_variables.variables["t%d_misload" % t]|default(0)|int %}
        SAVE_VARIABLE VARIABLE=t{t}_misload VALUE=0
    {% endif %}
    {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=filament_state TOOL={t} LOADED={0 if type == "NONE" else 1}{% endif %}

[gcode_macro _INDX_FIL_MEASURED]
description: Inner - record the heat capacity INDX_LOAD_FILAMENT just measured and applied as TOOL=n's filament, so later pickups of that tool restore it. Saves: tN_fil_density, tN_fil_hc
gcode:
    {% set t = params.TOOL|int %}
    # Kalico's [indx] shows the live model (thermal_model); older Kalico does
    # not, and indx_clog reads it instead
    {% if printer.indx is defined and printer.indx.thermal_model is defined %}
        {% set m = printer.indx.thermal_model %}
    {% else %}
        {% set m = printer.indx_clog.model|default({}) if printer.indx_clog is defined else {} %}
    {% endif %}
    {% if m.filament_heat_capacity is defined %}
        SAVE_VARIABLE VARIABLE=t{t}_fil_density VALUE={m.filament_density|float}
        SAVE_VARIABLE VARIABLE=t{t}_fil_hc VALUE={m.filament_heat_capacity|float}
        RESPOND MSG="LOAD_FILAMENT: measured heat capacity {'%.4f' % m.filament_heat_capacity} J/g/K (density {'%.2f' % m.filament_density}) recorded for T{t}."
    {% else %}
        RESPOND TYPE=error MSG="LOAD_FILAMENT: the measured heat capacity is applied but could not be read back, so it is not recorded for T{t}. Copy it from the INDX_LOAD_FILAMENT result into SET_TOOL_FILAMENT TOOL={t} DENSITY=1.0 HEAT_CAPACITY=..."
    {% endif %}

[gcode_macro _APPLY_TOOL_FILAMENT]
description: Inner - restore the recorded filament model params for TOOL=n, if any
gcode:
    {% set t = params.TOOL|int %}
    {% set svv = printer.save_variables.variables %}
    {% set d = svv["t" ~ t ~ "_fil_density"]|default(none) %}
    {% set h = svv["t" ~ t ~ "_fil_hc"]|default(none) %}
    # Only when the live model differs (Kalico prints the whole model at every
    # set); a model INDX cannot read back is always set. [EL-CAL-017]
    {% if printer.indx is defined and printer.indx.thermal_model is defined %}
        {% set m = printer.indx.thermal_model %}
    {% else %}
        {% set m = printer.indx_clog.model|default({}) if printer.indx_clog is defined else {} %}
    {% endif %}
    {% set same = d is not none and h is not none and m.filament_density is defined and m.filament_heat_capacity is defined
                  and (m.filament_density|float - d|float)|abs < 0.000001 and (m.filament_heat_capacity|float - h|float)|abs < 0.000001 %}
    {% if "indx" in printer and d is not none and h is not none and not same %}
        INDX_SET_MODEL_PARAMS FILAMENT_DENSITY={d|float} FILAMENT_HEAT_CAPACITY={h|float}
    {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Load filament into TOOL=n: pick it up, set the TYPE= preset, heat (TEMP= overrides), feed until the filament reaches the melt zone, prime, then form the tip and retract (INDX_TIP_SHAPE after_load; TIP=0 leaves the nozzle full). Needs: heater model calibrated, filament pushed in to the gears. Moves: tool change. Saves: tN_fil_density, tN_fil_hc, tN_retracted. MEASURE=1 measures the heat capacity
variable_filament_presets: {"PLA": {"temp": 210, "density": 1.24, "hc": 1.80, "tip_purge": 0, "tip_ram": 2, "tip_sep": 3.5, "tip_speed": 40, "tip_cool": 175, "change_purge": 1.7}, "PETG": {"temp": 240, "density": 1.27, "hc": 1.30, "tip_purge": 0, "tip_ram": 2, "tip_sep": 4.0, "tip_speed": 50, "tip_cool": 195, "change_purge": 3.9}, "ABS": {"temp": 245, "density": 1.04, "hc": 1.40, "tip_purge": 0, "tip_ram": 2, "tip_sep": 3.5, "tip_speed": 40, "tip_cool": 205, "change_purge": 3.9}, "ASA": {"temp": 250, "density": 1.07, "hc": 1.40, "tip_purge": 0, "tip_ram": 2, "tip_sep": 3.5, "tip_speed": 40, "tip_cool": 205, "change_purge": 3.9}, "PA": {"temp": 260, "density": 1.14, "hc": 1.70, "tip_purge": 0, "tip_ram": 3, "tip_sep": 4.0, "tip_speed": 50, "tip_cool": 220, "change_purge": 3.9}, "PC": {"temp": 270, "density": 1.20, "hc": 1.20, "tip_purge": 0, "tip_ram": 2, "tip_sep": 3.5, "tip_speed": 40, "tip_cool": 225, "change_purge": 3.9}, "TPU": {"temp": 230, "density": 1.21, "hc": 1.80, "speed": 2.0, "tip_purge": 0, "tip_ram": 0, "tip_sep": 3.0, "tip_speed": 8, "tip_cool": 180, "change_purge": 7.8}}
# prime_length: mm fed after the filament reaches the melt zone
#   (INDX_LOAD_FILAMENT PRIME_LENGTH); MEASURE=1 keeps the plugin's default.
#   [EL-CAL-006]
variable_prime_length: 5.0
gcode:
    {% set presets = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    {% if 'TOOL' not in params %}
        {action_raise_error("Usage: LOAD_FILAMENT TOOL=<n> TYPE=<material>")}
    {% endif %}
    {% set t       = params.TOOL|int %}
    {% set type    = params.TYPE|default("")|upper %}
    {% set measure = params.MEASURE|default(0)|int %}

    {% if type and type not in presets %}
        {action_raise_error("Unknown TYPE '%s'. Known types: %s" % (type, presets|join(", ")))}
    {% endif %}

    # Load temperature: explicit TEMP= wins, else the TYPE preset, else error
    {% if 'TEMP' in params %}
        {% set temp = params.TEMP|float %}
    {% elif type %}
        {% set temp = presets[type]['temp']|float %}
    {% else %}
        {action_raise_error("Provide TYPE=<material> or TEMP=<c>.")}
    {% endif %}
    {% if temp > printer["gcode_macro _INDX_CONSTANTS"].nozzle_max_temp|default(300)|float %}
        {action_raise_error("LOAD_FILAMENT: %.0f C is over the INDX nozzle's rating of %d C." % (temp, printer["gcode_macro _INDX_CONSTANTS"].nozzle_max_temp|default(300)|int))}
    {% endif %}

    # 1. Pick up the tool cold; the misload check runs on this pickup only [EL-CAL-004]
    {% if "gcode_macro _INDX_MISLOAD_CHECK" in printer %}SET_GCODE_VARIABLE MACRO=_INDX_MISLOAD_CHECK VARIABLE=armed VALUE={t}{% endif %}
    _INDX_CHANGE_TOOL TOOL={t}
    {% if "gcode_macro _INDX_MISLOAD_CHECK" in printer %}SET_GCODE_VARIABLE MACRO=_INDX_MISLOAD_CHECK VARIABLE=armed VALUE=-1{% endif %}
    # 1b. Prime at the purge station's load spot or the purge lane slot, never
    #     where the pickup left the head [EL-CAL-005]. SPOT=0: the caller went there
    {% set spot = params.SPOT|default(1)|int %}
    {% if spot %}
        _INDX_LOAD_SPOT TOOL={t}
    {% endif %}

    # 2. The filament for the safety model, recorded per tool (skipped when measuring)
    {% if type and not measure %}
        SET_TOOL_FILAMENT TOOL={t} DENSITY={presets[type]['density']} HEAT_CAPACITY={presets[type]['hc']}
        RESPOND MSG="LOAD_FILAMENT: T{t} {type} - density {presets[type]['density']} g/cm^3, heat capacity {presets[type]['hc']} J/g/K"
    {% endif %}

    # 3. Heat to load temperature and wait
    RESPOND MSG="LOAD_FILAMENT: heating T{t} to {temp|int} C..."
    M104 S{temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3} MAXIMUM={temp + 3}

    # 4. Feed and prime. MEASURE=1 measures and applies the heat capacity
    #    (kept per tool, SAVE=0). A preset speed (mm/s) slows soft filament,
    #    which buckles at the default feed.
    {% set pl = "" if measure else (" PRIME_LENGTH=%.1f" % printer["gcode_macro LOAD_FILAMENT"].prime_length|float) %}
    {% if type and 'speed' in presets[type] %}
        RESPOND MSG="LOAD_FILAMENT: feeding at {presets[type]['speed']} mm/s ({type} preset)"
        INDX_LOAD_FILAMENT APPLY={measure} SAVE=0 SPEED={presets[type]['speed']}{pl}
    {% else %}
        INDX_LOAD_FILAMENT APPLY={measure} SAVE=0{pl}
    {% endif %}
    {% if measure %}
        _INDX_FIL_MEASURED TOOL={t}
    {% endif %}
    # The load ends with a primed nozzle: nothing left for PRIME_CLEAN to refill
    SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE=0
    # What is in the tool now, for the INDX page and INDX_STATUS
    _INDX_FIL_RECORD TOOL={t} TYPE={type if type else "CUSTOM"} TEMP={temp|int} COLOR={params.COLOR|default("")}{(' ABRASIVE=' ~ params.ABRASIVE) if params.ABRASIVE is defined else ''}
    {% if not type and not measure and printer.save_variables.variables["t%d_fil_density" % t]|default(0.0)|float == 0.0 %}
    RESPOND TYPE=error MSG="LOAD_FILAMENT: T{t} loaded as CUSTOM but no thermal model data is set (density 0 = was empty). Add TYPE=<material> or MEASURE=1, or run SET_TOOL_FILAMENT TOOL={t} DENSITY=... HEAT_CAPACITY=..."
    {% endif %}
    # Still hot: shape the tip so the next cold pickup is not frozen
    # [EL-HOM-002]. TIP=0 leaves the nozzle full.
    {% if printer["gcode_macro INDX_TIP_SHAPE"].after_load|default(True) and params.TIP|default(1)|int %}
        _INDX_TIP_SHAPE_TOOL TOOL={t} MODE=here
    {% endif %}
    {% if spot %}
        # out of the station again (nothing over a purge lane slot)
        _INDX_LOAD_LEAVE TOOL={t}
    {% endif %}


#####################################################################
#  LOAD CELL CALIBRATION
#####################################################################
#
#  Calibrate the load cell BEFORE the first Z homing. Z homing probes
#  with the load cell, so it must be calibrated before the printer can
#  home Z, and therefore before dock and Z-offset calibration. Before the
#  docks are measured the tool is seated by hand, or the empty head is slid
#  onto the reference tool in its dock (DOCK=1); with measured docks TOOL=n
#  picks it up.
#  X and Y ARE homed first (they don't use the load cell).
#
#  The latch is driven by the extruder motor, so it opens/locks cold.
#  Two steps:
#
#    1) INDX_CAL_LOADCELL              (NO tool mounted)
#         Asks first (CONFIRM=1 skips that). Homes X and Y, opens the latch,
#         syncs toolhead_state=Open, tares.
#    2) (seat a passive tool by hand)
#       INDX_CAL_LOADCELL_FINISH [GRAMS=1480]
#         Locks for the force sample, calibrates, accepts, then unlocks
#         and syncs toolhead_state=Open. Does not claim active_tool.
#         KEEP=1: the reference tool stays locked on and is recorded.
#       SAVE_CONFIG (the dialog offers it)
#  One slide (DOCK=1, the first install default): after step 1 the empty
#  head is slid onto the reference tool in its dock; INDX locks it, homes
#  X and Y from the dock (measuring it) and calibrates out of the dock
#  (_INDX_CAL_LC_DOCK_FINISH), keeping the tool on.
#  The old names CALIBRATE_LOAD_CELL and CALIBRATE_LOAD_CELL_APPLY still work.
#
#  Note: LOAD_CELL_CALIBRATE / TARE / CALIBRATE / ACCEPT are the firmware's
#  interactive calibration commands; these macros issue them in sequence.
#  If your build does not allow them to be chained from a macro, run the
#  steps by hand (the wiki lists them).
#
#####################################################################

[gcode_macro _INDX_LC_SYNC]
description: Inner - keep the saved gram values on the load cell calibration in use: when counts per gram differ from the one they were saved with (lc_cpg), convert every one by old/new (exact: each keeps its load cell counts), mark the trigger offset to be measured again and say it in one console line. WHY= start, refine, lock, weight or spring (what changed it). SRC= seats, weight or spring: what the calibration in use is based on (lc_cpg_src)
# Saved gram values (the _INDX_TOOLS carry list, library, archive) convert
# by old/new counts per gram, so no check moves in counts. Fixed gram
# constants and gram settings do not; the tap threshold is one, so the
# trigger offset is measured again. Runs after every change and at start.
# [EL-CAL-018]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set live = (printer.load_cell_probe|default({})).counts_per_gram|default(0)|float %}
    {% set basis = svv.lc_cpg|default(0)|float %}
    {% set why = params.WHY|default("start")|string %}
    {% set src = params.SRC|default("")|string %}
    {% set carry = printer["gcode_macro _INDX_TOOLS"].carry %}
    {% if live > 0 and (basis <= 0 or (live / basis - 1.0)|abs < 0.000001) %}
        # the first record, or no change: nothing to convert
        {% if basis <= 0 %}
            SAVE_VARIABLE VARIABLE=lc_cpg VALUE={"%.6f"|format(live)}
        {% endif %}
        {% if src and src != svv.lc_cpg_src|default("")|string %}
            SAVE_VARIABLE VARIABLE=lc_cpg_src VALUE='"{src}"'
        {% endif %}
    {% elif live > 0 %}
        {% set f = basis / live %}
        {% set ns = namespace(say=[], lib=[]) %}
        {% for k in svv|sort %}
            {% set p = k.split("_", 1) %}
            {% if p|length == 2 and p[0]|length > 1 and p[0][0] == "t" and p[0][1:].isdigit() and p[1] in carry and svv[k] is not none %}
                {% set nv = (svv[k]|float * f)|round(2) %}
                SAVE_VARIABLE VARIABLE={k} VALUE={nv}
                {% set ns.say = ns.say + ["%s %.0f to %.0f" % (k, svv[k]|float, nv)] %}
            {% endif %}
        {% endfor %}
        # the library and the archive keep the same values with each tool
        {% set db = {} %}
        {% for name, rec in svv.indx_tools_db|default({})|dictsort %}
            {% set e = {} %}{% for kk, vv in rec.items() %}{% set _ = e.update({kk: vv}) %}{% endfor %}
            {% if rec.get("cal") %}
                {% set c = {} %}
                {% for kk, vv in rec.get("cal").items() %}{% set _ = c.update({kk: ((vv|float * f)|round(2)) if kk in carry and vv is not none else vv}) %}{% endfor %}
                {% set _ = e.update({"cal": c}) %}
                {% set ns.lib = ns.lib + [name] %}
            {% endif %}
            {% set _ = db.update({name: e}) %}
        {% endfor %}
        {% if ns.lib %}
            SAVE_VARIABLE VARIABLE=indx_tools_db VALUE="{db}"
        {% endif %}
        {% set arc = {} %}
        {% set an = namespace(n=0) %}
        {% for k, v in (svv.indx_archive|default({})).items() %}{% set _ = arc.update({k: v}) %}{% endfor %}
        {% set tools = {} %}
        {% for name, rec in arc.get("tools", {}).items() %}
            {% set e = {} %}{% for kk, vv in rec.items() %}{% set _ = e.update({kk: vv}) %}{% endfor %}
            {% if rec.get("cal") %}
                {% set c = {} %}
                {% for kk, vv in rec.get("cal").items() %}{% set _ = c.update({kk: ((vv|float * f)|round(2)) if kk in carry and vv is not none else vv}) %}{% endfor %}
                {% set _ = e.update({"cal": c}) %}
                {% set an.n = an.n + 1 %}
            {% endif %}
            {% set _ = tools.update({name: e}) %}
        {% endfor %}
        {% if an.n %}
            {% set _ = arc.update({"tools": tools}) %}
            SAVE_VARIABLE VARIABLE=indx_archive VALUE="{arc}"
        {% endif %}
        SAVE_VARIABLE VARIABLE=lc_cpg VALUE={"%.6f"|format(live)}
        # at start the source of the change is not known
        SAVE_VARIABLE VARIABLE=lc_cpg_src VALUE='"{src}"'
        # a lock force result waiting for Save was measured on the old one
        {% set lockp = "gcode_macro INDX_CAL_LOCK" in printer and printer["gcode_macro INDX_CAL_LOCK"].pending %}
        {% if lockp %}
            SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=pending VALUE="{ {} }"
        {% endif %}
        # and its refinement was worked out on the old one
        {% if "gcode_macro INDX_CAL_LOCK" in printer and printer["gcode_macro INDX_CAL_LOCK"].refine|default(0)|float > 0 %}
            SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=refine VALUE=0
        {% endif %}
        {% set retrig = svv.lc_trigger_offset is defined %}
        {% if retrig %}
            # the tap threshold is a fixed gram value: its counts changed
            _INDX_CAL_SET KEY=trigger_recheck VALUE=2
        {% endif %}
        {% set what = {"start": "since the gram values were saved (a calibration applied but not saved before a restart, or printer.cfg changed)", "refine": "the load cell refinement", "lock": "the lock force run, from every tool's seat", "weight": "the weight calibration", "spring": "the load cell calibrated against the latch spring"}.get(why, why) %}
        RESPOND MSG="INDX ok load cell counts per gram {'%.4f'|format(basis)} to {'%.4f'|format(live)} ({what}): every saved gram value converted x{'%.4f'|format(f)}, so each keeps its load cell counts and no check moves: {ns.say|join(', ') if ns.say else 'none in the docks'}{('. Library: ' ~ ns.lib|join(', ')) if ns.lib else ''}{('. Archive: %d tools' % an.n) if an.n else ''}{'. The trigger offset is marked to be measured again (its tap threshold is in grams)' if retrig else ''}{'. A lock force result that was waiting for Save is dropped: measure it again' if lockp else ''}."
    {% endif %}

[delayed_gcode _indx_lc_sync]
# At start: the saved gram values against the counts per gram Klipper
# started with (a live change lost in a restart is converted back)
initial_duration: 3
gcode:
    {% if "load_cell_probe" in printer %}
        _INDX_LC_SYNC WHY=start
    {% endif %}

[gcode_macro INDX_CAL_LOADCELL]
description: Load cell calibration against the latch spring force. TOOL=n (docks measured): the empty head is zeroed, then TOOL is picked from its dock and the calibration is read out of the dock. Without TOOL (first install, before the first Z home): DOCK=1 is the one-slide route (zero the empty head, motors off, you slide the head onto the reference tool in its dock, INDX locks it, homes from the dock, which measures that dock, and calibrates out of it; the tool stays on), else step 1 of 2, a tool is seated by hand. Needs: CONFIRM=1 (asks first), an empty tool. Moves: homing, a tool change (TOOL=) or X and Y home and the latch. Saves: the calibration after SAVE_CONFIG
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    # By hand the latch opens first: a tool on the head would drop [EL-CAL-007].
    # What the cell weighs against its last calibration, if any
    {% set lc = printer.load_cell_probe|default({}) %}
    {% set cfgl = printer.configfile.settings.load_cell_probe|default({}) %}
    {% set wns = namespace(g=none) %}
    {% if lc.counts_per_gram|default(0)|float > 0 and lc.force_g is defined and lc.force_g is not none and cfgl.reference_tare_counts is defined %}
        {% set ref = cfgl.reference_tare_counts %}
        {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
        {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
        {% set wns.g = lc.force_g|float + inv * (lc.tare_counts|float - ref|float) / lc.counts_per_gram|float %}
    {% endif %}
    {% set weighs = wns.g is not none and wns.g * printer["gcode_macro _INDX_CONSTANTS"].seat_sign|default(-1)|float >= tp.home_min_force_g|default(590.0)|float %}
    {% if params.TOOL is defined %}
        {% set t = params.TOOL|int %}
        {% if svv.get("t%d_dock_x" % t) is none and not tp.docks_calibrated|default(False) %}
            {action_raise_error("INDX_CAL_LOADCELL: the T%d dock is not measured; measure it first (INDX_CAL_DOCK TOOL=%d) or calibrate by hand (INDX_CAL_LOADCELL without TOOL=)" % (t, t))}
        {% endif %}
        {% if not params.CONFIRM|default(0)|int %}
            _INDX_PROMPT TITLE="Load Cell Calibration, T{t}" TEXT="T{t} must be EMPTY (no filament). INDX homes if needed, parks any tool, zeroes the load cell with the empty head standing still, picks T{t} up from its dock and calibrates against the latch spring force ({printer['gcode_macro CALIBRATE_LOAD_CELL_APPLY'].spring_force_g|int} g) out of the dock." TEXT2="Then SAVE_CONFIG writes it and restarts Klipper." B1="T{t} is empty: start|INDX_CAL_LOADCELL TOOL={t} CONFIRM=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
        {% else %}
            _INDX_PROMPT_END
            _INDX_RUNNING STEP="Load cell calibration T{t}"
            _INDX_CAL_LC_DOCK_HOME
            _INDX_CAL_LC_DOCK_EMPTY
            _INDX_CAL_LC_DOCK_TARE
            {% if "gcode_macro _INDX_LOCK_PAST" in printer %}SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=full_left VALUE=1{% endif %}
            _INDX_CHANGE_TOOL TOOL={t}
            _INDX_CAL_LC_DOCK_CAL TOOL={t}
        {% endif %}
    {% elif not params.CONFIRM|default(0)|int %}
        {% set ref = svv.ref_tool|default(0)|int %}
        {% set ns = namespace(t=-1) %}
        {% for i in range(tp.tool_count|int) %}{% if ns.t < 0 and svv.get("t%d_dock_x" % i) is not none %}{% set ns.t = i %}{% endif %}{% endfor %}
        {% set slide = "gcode_macro INDX_CAL_DOCK" in printer %}
        {% if ns.t >= 0 or not slide %}
            _INDX_PROMPT TITLE="Calibrate the Load Cell" TEXT="{('With measured docks INDX picks an empty tool from its dock and calibrates out of the dock: no hand seating. ' if ns.t >= 0 else '') ~ 'By hand: step 1 of 2. The head must be empty: take any tool off by hand first.'}" TEXT2="By hand, INDX homes X and Y (not Z), homes the latch open and zeroes the load cell with the empty head." B1="{('From the dock: T%d (empty)|INDX_CAL_LOADCELL TOOL=%d|primary' % (ns.t, ns.t)) if ns.t >= 0 else ''}" B2="By hand: head is empty, home X and Y, start|INDX_CAL_LOADCELL CONFIRM=1|{'secondary' if ns.t >= 0 else 'primary'}" B3="Open the latch first: a tool will drop|INDX_RELEASE_TOOL_BY_HAND CONFIRM=1|warning" F1="Close|_INDX_PROMPT_END|secondary"
        {% else %}
            # First install: one slide does the T{ref} dock and the load cell.
            # Motors hold the head still through the zero, off for the slide [EL-CAL-008]
            {% for st in printer.stepper_enable.steppers if st.startswith("stepper_") %}
                SET_STEPPER_ENABLE STEPPER={st} ENABLE=1
            {% endfor %}
            _INDX_PROMPT TITLE="Load Cell and Dock T{ref}" TEXT="1. Now: the motors are on and hold the head still. Keep your hands off the head and make sure nothing touches the nozzle or the head (not a dock, not the bed). The head must be empty: take any tool off by hand first. T{ref} must be EMPTY (no filament) and sit in its dock." TEXT2="2. When you press the button: INDX zeroes the load cell with nothing pushing on it, homes the latch open, then switches the motors off. If your gantry can sink without power, support it." TEXT3="3. Then you slide the empty head onto T{ref} in its dock and hold it: INDX locks the latch on T{ref}, homes from the dock (that measures the T{ref} dock) and calibrates the load cell against the latch spring force ({printer['gcode_macro CALIBRATE_LOAD_CELL_APPLY'].spring_force_g|int} g) with T{ref} out of its dock. T{ref} stays on for the first home." TEXT4="By hand instead: T{ref} is seated on the head by hand, calibrated there and stays on; its dock is measured later." B1="Hands off, nothing touches the head: zero the load cell|INDX_CAL_LOADCELL CONFIRM=1 DOCK=1|primary" B2="By hand: seat T{ref} on the head|INDX_CAL_LOADCELL CONFIRM=1|secondary" B3="Open the latch first: a tool will drop|INDX_RELEASE_TOOL_BY_HAND CONFIRM=1|warning" F1="Close|_INDX_PROMPT_END|secondary"
        {% endif %}
    {% elif svv.active_tool|default(-1)|int >= 0 or (weighs and not params.HEAD_EMPTY|default(0)|int) %}
        _INDX_PROMPT_END
        {% set act = svv.active_tool|default(-1)|int %}
        {% set dk = " DOCK=1" if params.DOCK|default(0)|int else "" %}
        {% if act >= 0 %}
            _INDX_PROMPT TITLE="Load Cell Calibration" TEXT="T{act} is recorded on the head. Calibrating by hand opens the latch first, so it would drop." TEXT2="Park it, or take it off by hand, then calibrate." B1="Park T{act}|PARK_TOOL|primary" B2="Take it off by hand: open the latch|INDX_RELEASE_TOOL_BY_HAND CONFIRM=1|warning" F1="Close|_INDX_PROMPT_END|secondary"
            RESPOND TYPE=error MSG="INDX_CAL_LOADCELL: T{act} is recorded on the head; the latch would open and drop it. Park it (PARK_TOOL) or take it off (INDX_RELEASE_TOOL_BY_HAND) first. Nothing moved."
        {% else %}
            _INDX_PROMPT TITLE="Load Cell Calibration" TEXT="The load cell reads {wns.g|round(0)|int} g against its last calibration, like a tool on the head. Calibrating by hand opens the latch first." TEXT2="If you can see the head is empty, the old zero has drifted (the reason to calibrate): go ahead." B1="The head is empty: calibrate anyway|INDX_CAL_LOADCELL CONFIRM=1 HEAD_EMPTY=1{dk}|warning" F1="Close|_INDX_PROMPT_END|secondary"
            RESPOND TYPE=error MSG="INDX_CAL_LOADCELL: the load cell reads {wns.g|round(0)|int} g, like a tool on the head. Look at the head; if it is empty, run INDX_CAL_LOADCELL CONFIRM=1 HEAD_EMPTY=1{dk}. Nothing moved."
        {% endif %}
    {% else %}
        _INDX_PROMPT_END
        _INDX_RUNNING STEP="Load cell calibration"
        _INDX_CAL_LOADCELL_START DOCK={params.DOCK|default(0)|int}
        _INDX_SET_ACTIVE_TOOL TOOL=-1
        {% set ref = svv.ref_tool|default(0)|int %}
        {% if params.DOCK|default(0)|int and "gcode_macro _INDX_CAL_LC_SLIDE" in printer %}
            # one slide: motors off, the head onto T{ref} in its dock, lock,
            # home from the dock (the dock measurement), calibrate out of it
            _INDX_CAL_LC_SLIDE
        {% else %}
        _INDX_PROMPT TITLE="Load Cell Step 2 of 2" TEXT="Seat T{ref}, the reference tool, EMPTY (no filament), on the head by hand. The latch is open." TEXT2="Then INDX locks it and calibrates against {printer['gcode_macro CALIBRATE_LOAD_CELL_APPLY'].spring_force_g|int} g (the latch spring force). T{ref} stays locked on: the first home probes with it, so it is not taken off and put on again. You can check the toolboard now: push the nozzle up gently with a finger, and the load cell reading changes (console, or the INDX page)." TEXT3="Another empty tool works for the calibration too, but then the latch opens again and T{ref} goes on by hand for the first home." B1="T{ref} (empty) is seated: calibrate, keep it on|INDX_CAL_LOADCELL_FINISH KEEP=1|primary" B2="Another empty tool is seated: calibrate, then take it off|INDX_CAL_LOADCELL_FINISH|secondary" F1="Close|_INDX_PROMPT_END|secondary"
        {% endif %}
    {% endif %}

[gcode_macro _INDX_CAL_LC_DOCK_HOME]
description: Inner - INDX_CAL_LOADCELL TOOL=: home when not homed (a tool on the head is parked by the homing itself)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro _INDX_CAL_LC_DOCK_EMPTY]
description: Inner - INDX_CAL_LOADCELL TOOL=: park the tool on the head, so the load cell is zeroed with an empty head
gcode:
    {% if printer.save_variables.variables.active_tool|default(-1)|int >= 0 %}
        PARK_TOOL
    {% endif %}

[gcode_macro _INDX_CAL_LC_DOCK_TARE]
description: Inner - INDX_CAL_LOADCELL TOOL=: start the firmware calibration and zero the empty head, standing still
gcode:
    {% if printer.save_variables.variables.active_tool|default(-1)|int >= 0 %}
        {action_raise_error("INDX_CAL_LOADCELL: the head is not empty after the park; nothing calibrated")}
    {% endif %}
    M400
    G4 P3000
    _INDX_LC_SESSION_CLOSE
    LOAD_CELL_CALIBRATE
    TARE
    RESPOND MSG="INDX > Load cell zeroed with the empty head. Picking the tool up from its dock."

[gcode_macro _INDX_CAL_LC_DOCK_CAL]
description: Inner - INDX_CAL_LOADCELL TOOL=: the tool is on the head out of its dock: calibrate against the latch spring force, accept, offer SAVE_CONFIG
gcode:
    {% set t = params.TOOL|int %}
    {% set grams = printer["gcode_macro CALIBRATE_LOAD_CELL_APPLY"].spring_force_g|float %}
    {% if printer.save_variables.variables.active_tool|default(-1)|int != t %}
        _INDX_LC_SESSION_CLOSE
        _INDX_RAISE MSG="INDX_CAL_LOADCELL: T{t} is not on the head after the pickup; nothing calibrated"
    {% endif %}
    # out of the dock (the pickup ends at the clearance line), standing still
    M400
    G4 P3000
    CALIBRATE GRAMS={grams}
    ACCEPT
    # the saved gram values follow the new calibration
    _INDX_LC_SYNC WHY=spring SRC=spring
    _INDX_RUNNING STEP=none
    RESPOND MSG="INDX ok Load cell calibrated against {grams|int} g with T{t} out of its dock."
    _INDX_PROMPT TITLE="Load Cell Calibrated (T{t})" TEXT="SAVE_CONFIG writes the calibration to printer.cfg and restarts Klipper. T{t} stays on the head. After the restart the setup overview opens." TEXT2="Later, with 3 or more empty tools, INDX_CAL_LOADCELL_REFINE can refine it with every tool's spring." B1="Save config, Klipper restarts|_INDX_SAVE_CONFIG THEN=setup|warning" F1="Later|_INDX_PROMPT_END|secondary"

[gcode_macro CALIBRATE_LOAD_CELL]
description: Renamed to INDX_CAL_LOADCELL; the old name still runs it straight away, as in INDX main (scripts, KlipperScreen buttons)
gcode:
    _INDX_RENAMED OLD=CALIBRATE_LOAD_CELL NEW=INDX_CAL_LOADCELL
    INDX_CAL_LOADCELL CONFIRM=1 {rawparams}

[gcode_macro _INDX_LC_SESSION_CLOSE]
description: Inner - ABORT a load cell calibration session left open by an interrupted attempt (the firmware refuses a new one: "Already Calibrating a Load Cell"); nothing when none is open
gcode:
    # ABORT exists only while a session is open
    {% if "ABORT" in printer.gcode.commands %}
        ABORT
        RESPOND MSG="INDX > An earlier load cell calibration was still open (interrupted): closed it, starting fresh."
    {% endif %}

[gcode_macro _INDX_CAL_LOADCELL_START]
description: Inner - load cell step 1: home X and Y (not for the one slide, DOCK=1), start the firmware calibration, open the latch, tare the empty head
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% if not params.DOCK|default(0)|int %}
        # Home X and Y - Z is NOT homed yet; Z homing needs the calibrated load cell.
        G28 X Y
    {% endif %}
    # DOCK=1 does not home here: the homing from the dock sets X and Y [EL-CAL-009]
    {% if params.DOCK|default(0)|int %}
        # Motors on again (idle timeout) to hold the head through the zero
        {% for st in printer.stepper_enable.steppers if st.startswith("stepper_") %}
            SET_STEPPER_ENABLE STEPPER={st} ENABLE=1
        {% endfor %}
    {% endif %}
    _INDX_LC_SESSION_CLOSE
    LOAD_CELL_CALIBRATE
    # Open the latch for a hand-seated tool; with [tmc_sg_log] home it to its
    # opening stop first, never a blind open move [EL-CAL-010]
    {% if "tmc_sg_log" in printer %}
        # first install: latch anywhere, long search, any stop is home [EL-CAL-010]
        _INDX_LATCH_HOME DIST=-15 UNKNOWN=1
    {% else %}
        _TC_SET_ROTATION_DIST
        _TC_LATCH_MOVE E={c.full_open_e} F={c.latch_feedrate}
        _TC_RESTORE_ROTATION_DIST
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=0
    {% endif %}
    M400
    G4 P500
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=2
    SAVE_VARIABLE VARIABLE=toolhead_state VALUE=2
    # Tare the empty head
    TARE
    RESPOND MSG="INDX > Load cell tared (empty head). Seat a passive tool on the head by hand, the tool MUST BE EMPTY (no filament loaded). Then run: INDX_CAL_LOADCELL_FINISH (calibrates against {printer['gcode_macro CALIBRATE_LOAD_CELL_APPLY'].spring_force_g|int} g, the spring force set in CALIBRATE_LOAD_CELL_APPLY)"

[gcode_macro CALIBRATE_LOAD_CELL_APPLY]
description: Renamed to INDX_CAL_LOADCELL_FINISH. Still holds spring_force_g, the latch spring force the load cell is calibrated against
# spring_force_g: g, the latch spring force the calibration is done against
#   [EL-CAL-011]; other macros read it here under the old name.
variable_spring_force_g: 1480
gcode:
    _INDX_RENAMED OLD=CALIBRATE_LOAD_CELL_APPLY NEW=INDX_CAL_LOADCELL_FINISH
    INDX_CAL_LOADCELL_FINISH {rawparams}

[gcode_macro INDX_CAL_LOADCELL_FINISH]
description: Load cell calibration, step 2 of 2: with an empty tool seated by hand, lock, calibrate against GRAMS (default the latch spring force), unlock. KEEP=1: the seated tool is the reference tool (ref_tool, T0 unless changed); it stays locked on and is recorded on the head, ready for the first home. Needs: INDX_CAL_LOADCELL first. Moves: the latch. Saves: the calibration after SAVE_CONFIG; with KEEP=1 the reference tool as the tool on the head
gcode:
    {% if params.KEEP|default(0)|int and printer.save_variables.variables.active_tool|default(-1)|int >= 0 %}
        {action_raise_error("INDX_CAL_LOADCELL_FINISH: T%d is recorded on the head; step 1 (INDX_CAL_LOADCELL) records the head as empty. Start again with INDX_CAL_LOADCELL. Nothing moved." % printer.save_variables.variables.active_tool|int)}
    {% endif %}
    _INDX_PROMPT_END
    RESPOND MSG="INDX > INDX_CAL_LOADCELL_FINISH: the seated tool MUST BE EMPTY (no filament loaded)."
    {% set grams = params.GRAMS|default(printer["gcode_macro CALIBRATE_LOAD_CELL_APPLY"].spring_force_g)|float %}
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    # Lock onto the seated tool, then on to full locking force (cold, no homing)
    _TC_SET_ROTATION_DIST
    _TC_LATCH_MOVE E={c.full_lock_e} F={c.latch_feedrate}
    _TC_LATCH_MOVE E=10 F=300
    _TC_RESTORE_ROTATION_DIST
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=0
    _INDX_LOCK_MARK CLEARED=1
    G4 P500
    M400
    CALIBRATE GRAMS={grams}
    ACCEPT
    # the saved gram values follow the new calibration
    _INDX_LC_SYNC WHY=spring SRC=spring
    {% if params.KEEP|default(0)|int %}
        _INDX_CAL_LOADCELL_KEEP
    {% else %}
    # Unlock after cal - soft-state must match physical latch. Do not claim
    # active_tool: the hand-seated tool is not a dock pickup.
    _TC_SET_ROTATION_DIST
    _TC_LATCH_MOVE E={c.full_open_e} F={c.latch_feedrate}
    _TC_RESTORE_ROTATION_DIST
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=0
    M400
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=2
    SAVE_VARIABLE VARIABLE=toolhead_state VALUE=2
    RESPOND MSG="INDX ok Load cell calibrated against {grams|int} g. Latch open. Take the tool off by hand, then SAVE_CONFIG."
    _INDX_RUNNING STEP=none
    _INDX_PROMPT TITLE="Load Cell Calibrated" TEXT="Take the tool off by hand (the latch is open)." TEXT2="Then save: SAVE_CONFIG writes the calibration to printer.cfg and restarts Klipper. Home only after it: the homing seat check weighs against the saved calibration." B1="Tool is off: save config, Klipper restarts|_INDX_SAVE_CONFIG THEN=home|warning" F1="Later|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_CAL_LOADCELL_KEEP]
description: Inner - INDX_CAL_LOADCELL_FINISH KEEP=1: the reference tool the load cell was just calibrated against stays locked on: record it as the tool on the head (as INDX_SEAT_TOOL_BY_HAND does after its lock), then offer SAVE_CONFIG and the first home
# The lock is INDX_SEAT_TOOL_BY_HAND's, fit to probe with. tool_unverified 0:
# the calibration was taken against this tool and G28 weighs it again.
gcode:
    {% set ref = printer.save_variables.variables.ref_tool|default(0)|int %}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=0
    SAVE_VARIABLE VARIABLE=toolhead_state VALUE=0
    _INDX_SET_ACTIVE_TOOL TOOL={ref}
    SAVE_VARIABLE VARIABLE=tool_unverified VALUE=0
    SAVE_VARIABLE VARIABLE=seat_suspect VALUE=-1
    SAVE_VARIABLE VARIABLE=tc_busy VALUE=0
    RESPOND MSG="INDX ok Load cell calibrated against {printer['gcode_macro CALIBRATE_LOAD_CELL_APPLY'].spring_force_g|int} g. T{ref} stays locked on the head and is recorded there. Next: SAVE_CONFIG (Klipper restarts), then the first home with T{ref}."
    _INDX_RUNNING STEP=none
    {% if not params.QUIET|default(0)|int %}
    _INDX_PROMPT TITLE="Calibrated, T{ref} Stays On" TEXT="SAVE_CONFIG writes the calibration to printer.cfg and restarts Klipper. T{ref} stays locked on the head through the restart." TEXT2="Then INDX_SETUP goes on with the first home: G28 with T{ref}, the machine checks and the trigger offset, in one go. Home only after the save: the homing seat check weighs against the saved calibration (the setup steps wait for it)." B1="Save config: Klipper restarts, then the first home|_INDX_SAVE_CONFIG THEN=home|warning" F1="Later|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_SEAT_G]
description: Inner - store the load cell seat reading (grams against the empty-head calibration) in seat_g, or valid 0 when there is none
# Callers render after this runs. Same arithmetic as the homing seat check.
variable_seat_g: 0.0
variable_valid: 0
gcode:
    {% set lc = printer.load_cell_probe|default({}) %}
    {% if lc.is_calibrated|default(false) and lc.force_g is defined and lc.force_g is not none and lc.counts_per_gram|default(0)|float > 0 %}
        {% set cfgl = printer.configfile.settings.load_cell_probe %}
        {% set ref = cfgl.reference_tare_counts %}
        {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
        {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
        {% set g = lc.force_g|float + inv * (lc.tare_counts|float - ref|float) / lc.counts_per_gram|float %}
        SET_GCODE_VARIABLE MACRO=_INDX_SEAT_G VARIABLE=seat_g VALUE={"%.1f"|format(g)}
        SET_GCODE_VARIABLE MACRO=_INDX_SEAT_G VARIABLE=valid VALUE=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=_INDX_SEAT_G VARIABLE=valid VALUE=0
    {% endif %}

[gcode_macro INDX_RELEASE_TOOL_BY_HAND]
description: Open the latch so a tool can be taken off the head by hand, and record the head as empty. Needs: CONFIRM=1, or it asks first. A hot nozzle (over 72 C, or the heater on) is always cooled to 70 C first, with the part fan or passively, and then it asks again: the latch never opens a hot tool into a hand. NEXT= runs after the latch opened (~ for spaces). Moves: the latch (a tool on the head drops). Saves: active_tool -1, latch open
# Without CONFIRM=1 it asks, showing the load cell reading: a tool on the
# head drops when the latch opens. A hot tool always cools first, then it
# asks again, never opening by itself after the wait. [EL-CAL-012]
gcode:
    {% set hot = printer.extruder.temperature|float > 72 or printer.extruder.target|float > 0 %}
    {% if params.CONFIRM|default(0)|int != 1 %}
        _INDX_SEAT_G
        _INDX_RELEASE_ASK{(' NEXT=' ~ params.NEXT) if params.NEXT is defined else ''}
    {% elif hot %}
        _INDX_HAND_COOL RELEASE=1{(' RNEXT=' ~ params.NEXT) if params.NEXT is defined else ''}
    {% else %}
        {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
        _INDX_PROMPT_END
        _TC_SET_ROTATION_DIST
        _TC_LATCH_MOVE E={c.full_open_e} F={c.latch_feedrate}
        _TC_RESTORE_ROTATION_DIST
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=0
        M400
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=2
        SAVE_VARIABLE VARIABLE=toolhead_state VALUE=2
        _INDX_SET_ACTIVE_TOOL TOOL=-1
        SAVE_VARIABLE VARIABLE=tool_unverified VALUE=0
        SAVE_VARIABLE VARIABLE=seat_suspect VALUE=-1
        SAVE_VARIABLE VARIABLE=tc_busy VALUE=0
        RESPOND MSG="INDX ok Latch open, head recorded as empty. Take any tool off the head by hand."
        {% if params.NEXT|default("")|length %}
            {params.NEXT|replace("~", " ")|replace("^", " ")}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_RELEASE_ASK]
description: Inner - the question INDX_RELEASE_TOOL_BY_HAND asks without CONFIRM=1 (NEXT= passed on); a hot nozzle only gets the cool-down button
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set st = printer["gcode_macro _TOOLCHANGE_VARS"].toolhead_state|int %}
    {% set s = printer["gcode_macro _INDX_SEAT_G"] %}
    {% set min_g = printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(590.0)|float %}
    {% if not s.valid|int %}
        {% set lc_text = "Load cell: no reading, so INDX cannot tell whether a tool is on the head." %}
    {% elif s.seat_g|float|abs >= min_g %}
        {% set lc_text = "Load cell: %.0f g. That looks like a tool on the head." % s.seat_g|float %}
    {% else %}
        {% set lc_text = "Load cell: %.0f g. That looks like an empty head." % s.seat_g|float %}
    {% endif %}
    {% set temp = printer.extruder.temperature|float %}
    {% set hot = printer.extruder.temperature|float > 72 or printer.extruder.target|float > 0 %}
    {% set nx = (' NEXT=' ~ params.NEXT) if params.NEXT is defined else '' %}
    {% set heat_text = ("The nozzle is at %.0f C: too hot to hold. It cools to 70 C first (heater off, part fan on, or by itself without one), then this question comes again. " % temp) if hot else (("The nozzle is still warm (%.0f C): handle with care, hold the tool by its body, not the nozzle. " % temp) if temp > 40 else "") %}
    # Away from a dock the latch opens only with a magnet on the activation
    # boss (the gear is out of mesh past the release) [EL-CAL-013]
    {% set mag_text = "Away from a dock the latch only opens while a magnet sits on the activation boss, the spot where the dock magnet touches the head (the magnet of another tool works). In its dock the dock magnet does it." if act >= 0 or st == 0 else "" %}
    _INDX_PROMPT TITLE="Open the Latch?" TEXT="The latch opens and any tool on the head drops. Hold the tool with one hand before you press the button." TEXT2="INDX has {('T%d on the head' % act) if act >= 0 else 'no tool on the head'}, latch {'locked' if st == 0 else 'open'}. {lc_text}" TEXT3="{mag_text}" TEXT4="{heat_text}Afterwards INDX records the head as empty." B1="{('Cool to 70 C first|_INDX_HAND_COOL RELEASE=1' ~ nx|replace(' NEXT=', ' RNEXT=') ~ '|primary') if hot else ('Open latch: tool will drop|INDX_RELEASE_TOOL_BY_HAND CONFIRM=1' ~ nx ~ '|error')}" F1="Cancel, keep the tool|_INDX_PROMPT_END|secondary"

[gcode_macro MANUAL_TOOL_REMOVE]
description: Renamed to INDX_RELEASE_TOOL_BY_HAND; the old name still runs it straight away, as in INDX main (scripts, KlipperScreen buttons)
gcode:
    _INDX_RENAMED OLD=MANUAL_TOOL_REMOVE NEW=INDX_RELEASE_TOOL_BY_HAND
    INDX_RELEASE_TOOL_BY_HAND CONFIRM=1 {rawparams}

[gcode_macro INDX_SEAT_TOOL_BY_HAND]
description: Lock the latch onto a tool placed on the head by hand and record it as TOOL=<n>. Needs: the tool on the head, latch open. Moves: the latch. Saves: active_tool, latch locked. LOCKED=1 records a tool that is already locked on, without moving the latch (only if the load cell agrees). Makes the first G28 possible before the docks are measured
# Breaks the circle: CHANGE_TOOL needs a homed Z, and Z homing needs a tool.
# NEXT=<command with ~ or ^ for spaces>: run afterwards (the setup dialogs use it; ^ when NEXT itself rides inside an _INDX_DO command).
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% if "TOOL" not in params %}
        {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
        {action_raise_error("Usage: INDX_SEAT_TOOL_BY_HAND TOOL=<n> [LOCKED=1]. Place the tool on the head by hand first. LOCKED=1 records a tool already locked on (no latch move). Last recorded: %s." % (('T%d' % act) if act >= 0 else 'no tool'))}
    {% endif %}
    {% set t = params.TOOL|int %}
    {% if t < 0 or t >= tp.tool_count|int %}
        {action_raise_error("T%d is not configured. %d tools available (T0-T%d)."
            % (t, tp.tool_count|int, tp.tool_count|int - 1))}
    {% endif %}
    _INDX_PROMPT_END
    _INDX_SEAT_G
    _INDX_SEAT_TOOL_RUN {rawparams}

[gcode_macro _INDX_SEAT_TOOL_RUN]
description: Inner - INDX_SEAT_TOOL_BY_HAND once the load cell reading is stored
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set c  = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set t = params.TOOL|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set st = printer["gcode_macro _TOOLCHANGE_VARS"].toolhead_state|int %}
    {% set s = printer["gcode_macro _INDX_SEAT_G"] %}
    {% set min_g = tp.home_min_force_g|default(590.0)|float %}
    {% set seated = s.valid|int and s.seat_g|float|abs >= min_g %}
    {% set nxt = params.NEXT|default("")|replace("~", " ")|replace("^", " ") %}
    {% if params.LOCKED|default(0)|int %}
        # Record only, nothing moves; asks unless the load cell and latch
        # agree (SURE=1 answers yes)
        {% set nx = (' NEXT=' ~ params.NEXT) if params.NEXT is defined else '' %}
        {% if (st == 0 and seated) or params.SURE|default(0)|int %}
            {% if st != 0 %}
                SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=0
                SAVE_VARIABLE VARIABLE=toolhead_state VALUE=0
            {% endif %}
            _INDX_SET_ACTIVE_TOOL TOOL={t}
            # a lock by hand was not sensed: with filament it is taken as
            # short of the release, no probe before a heated push [EL-TC-072]
            _INDX_LOCK_MARK_UNSENSED TOOL={t} KIND=hand EMPTY_MARK=0
            SAVE_VARIABLE VARIABLE=tool_unverified VALUE={0 if seated else 1}
            SAVE_VARIABLE VARIABLE=seat_suspect VALUE=-1
            SAVE_VARIABLE VARIABLE=tc_busy VALUE=0
            # the seated zero may be another tool's: the next re-zero starts
            # it again, or a failed pickup check repeats on G28 [EL-TC-082]
            SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_CHECK VARIABLE=seated_valid VALUE=0
            _INDX_PROMPT_END
            {% set off_x = printer.save_variables.variables["t%d_offset_x" % t]|default(0.0)|float %}
            {% set off_y = printer.save_variables.variables["t%d_offset_y" % t]|default(0.0)|float %}
            SET_GCODE_OFFSET X={"%.3f"|format(off_x)} Y={"%.3f"|format(off_y)} MOVE=0
            RESPOND MSG="INDX ok T{t} recorded on the head, latch locked (load cell {(s.seat_g|float|round(0)|int ~ ' g') if s.valid|int else 'no reading'}{'' if seated else ', which does not confirm a seated tool: check the seat before homing Z'}). Nothing moved."
            {nxt}
        {% else %}
            _INDX_PROMPT TITLE="Is T{t} Locked on the Head?" TEXT="INDX has the latch recorded {'locked' if st == 0 else 'open'} and {('T%d on the head' % act) if act >= 0 else 'the head empty'}. Load cell {(s.seat_g|float|round(0)|int ~ ' g') if s.valid|int else 'no reading'}{', that looks like a tool on the head' if seated else ', that does not confirm a tool (the reading drifts until the next pickup)'}." TEXT2="Recording moves nothing{' (3 taps on the nozzle record it too)' if 'indx_clog' in printer and printer['indx_clog'].tap.available else ''}. If T{t} sits loose on the head, lock the latch on it instead." B1="Yes, T{t} is locked on: record it|INDX_SEAT_TOOL_BY_HAND TOOL={t} LOCKED=1 SURE=1{nx}|primary" B2="T{t} is loose: lock the latch|INDX_SEAT_TOOL_BY_HAND TOOL={t} FORCE=1{nx}|secondary" F1="Cancel|_INDX_PROMPT_END|secondary"
            _INDX_TAP_CONFIRM CMD="INDX_SEAT_TOOL_BY_HAND TOOL={t} LOCKED=1 SURE=1{nx}"
        {% endif %}
    {% elif act >= 0 and act != t and not params.FORCE|default(0)|int %}
        _INDX_RAISE MSG="INDX_SEAT_TOOL_BY_HAND: INDX has T{act} on the head. If T{act} is there, take it off with INDX_RELEASE_TOOL_BY_HAND first. If the head is empty, run INDX_FORGET_TOOL first."
    {% elif st == 0 and not params.FORCE|default(0)|int %}
        # Recorded locked: locking again would push filament, so ask
        _INDX_PROMPT TITLE="Latch Is Recorded Locked" TEXT="INDX has the latch locked{(' on T%d' % act) if act >= 0 else ''}. Load cell {(s.seat_g|float|round(0)|int ~ ' g') if s.valid|int else 'no reading'}{', looks like a tool is on' if seated else ''}." TEXT2="Which is true?" B1="T{t} is on and locked: record it, no move|INDX_SEAT_TOOL_BY_HAND TOOL={t} LOCKED=1{(' NEXT=' ~ params.NEXT) if params.NEXT is defined else ''}|primary" B2="Latch is open, T{t} is on: lock it|INDX_SEAT_TOOL_BY_HAND TOOL={t} FORCE=1{(' NEXT=' ~ params.NEXT) if params.NEXT is defined else ''}|primary" B3="Head is empty: open the latch first|INDX_RELEASE_TOOL_BY_HAND CONFIRM=1|warning" F1="Cancel|_INDX_PROMPT_END|secondary"
    {% else %}
        # Warn, do not refuse: the cell may be untared this early
        {% if s.valid|int and not seated %}
            _INDX_LCD LEVEL=warn MSG="T{t} claimed, head reads empty"
            RESPOND TYPE=error MSG="INDX ! INDX_SEAT_TOOL_BY_HAND: load cell reads {s.seat_g|float|round(0)|int} g, which looks like an empty head. Recording T{t} anyway: check the tool is seated before homing Z."
        {% endif %}
        # Lock, then on slowly to full locking force
        _TC_SET_ROTATION_DIST
        _TC_LATCH_MOVE E={c.full_lock_e} F={c.latch_feedrate} I={c.run_current}
        _TC_LATCH_MOVE E=10 F=300 I={c.run_current}
        _TC_RESTORE_ROTATION_DIST
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=0
        _INDX_LOCK_MARK CLEARED=1
        M400
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=0
        SAVE_VARIABLE VARIABLE=toolhead_state VALUE=0
        _INDX_SET_ACTIVE_TOOL TOOL={t}
        SAVE_VARIABLE VARIABLE=tool_unverified VALUE={0 if seated else 1}
        SAVE_VARIABLE VARIABLE=seat_suspect VALUE=-1
        SAVE_VARIABLE VARIABLE=tc_busy VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_CHECK VARIABLE=seated_valid VALUE=0
        {% set off_x = printer.save_variables.variables["t%d_offset_x" % t]|default(0.0)|float %}
        {% set off_y = printer.save_variables.variables["t%d_offset_y" % t]|default(0.0)|float %}
        SET_GCODE_OFFSET X={"%.3f"|format(off_x)} Y={"%.3f"|format(off_y)} MOVE=0
        RESPOND MSG="INDX ok Latch locked, T{t} recorded on the head. G28 Z will probe with it. If this is not the tool on the head, run INDX_RELEASE_TOOL_BY_HAND and start again."
        {nxt}
    {% endif %}

[gcode_macro MANUAL_TOOL_SEAT]
description: Renamed to INDX_SEAT_TOOL_BY_HAND
gcode:
    _INDX_RENAMED OLD=MANUAL_TOOL_SEAT NEW=INDX_SEAT_TOOL_BY_HAND
    INDX_SEAT_TOOL_BY_HAND {rawparams}

[gcode_macro INDX_REF_Z_ZERO]
description: One-time fix for configs from INDX main: the reference tool's Z offset becomes 0, moved into the global Z offset and taken off every tool, so every tool's first layer stays where it is. Shows the values and asks first (CONFIRM=1 saves). Moves: nothing. Saves: global_z_offset, tN_offset_z
# The reference offset is 0 by definition. Applied Z stays: global + a,
# every tool - a. [EL-CAL-002]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set ref = svv.ref_tool|default(0)|int %}
    {% set a = svv["t%d_offset_z" % ref]|default(0.0)|float %}
    {% set gz = svv.global_z_offset|default(0.0)|float %}
    {% if a|abs < 0.0005 %}
        RESPOND MSG="INDX_REF_Z_ZERO: the reference T{ref}'s Z offset is already 0. Nothing to do."
    {% else %}
        {% set ns = namespace(rows=[]) %}
        {% for i in range(tp.tool_count|int) if ("t%d_offset_z" % i) in svv %}
            {% set z = svv["t%d_offset_z" % i]|float %}
            {% set ns.rows = ns.rows + ["T%d: offset %+.3f -> %+.3f, applied Z %+.3f (unchanged)" % (i, z, z - a, z + gz)] %}
        {% endfor %}
        {% if params.CONFIRM|default(0)|int %}
            _INDX_PROMPT_END
            SAVE_VARIABLE VARIABLE=global_z_offset VALUE='{"%.4f"|format(gz + a)}'
            {% for i in range(tp.tool_count|int) if ("t%d_offset_z" % i) in svv %}
                SAVE_VARIABLE VARIABLE=t{i}_offset_z VALUE={"%.4f"|format(0.0 if i == ref else svv["t%d_offset_z" % i]|float - a)}
            {% endfor %}
            RESPOND MSG="INDX ok The reference T{ref}'s Z offset ({'%+.3f'|format(a)}) is now in the global Z offset ({'%+.3f'|format(gz)} -> {'%+.3f'|format(gz + a)}); every tool keeps its first layer. {ns.rows|join('; ')}"
        {% else %}
            _INDX_PROMPT TITLE="Reference Tool Z Offset" TEXT="T{ref} is the reference tool, so its Z offset should be 0, but it is {'%+.3f'|format(a)} mm (a config from INDX main). INDX moves it into the global Z offset and takes it off every tool: each tool's first layer stays exactly where it is." LINES="{ns.rows|join('^')}" TEXT2="Nothing moves." B1="Save|INDX_REF_Z_ZERO CONFIRM=1|primary" F1="Later|_INDX_PROMPT_END|secondary"
        {% endif %}
    {% endif %}

[gcode_macro INDX_FORGET_TOOL]
description: Record the head as empty and the latch as open without moving anything. Needs: CONFIRM=1, or it asks first. Moves: nothing. Saves: active_tool -1, latch open. Only for a head that really is empty with the latch open
gcode:
    {% if params.CONFIRM|default(0)|int != 1 %}
        _INDX_SEAT_G
        _INDX_FORGET_ASK
    {% else %}
        {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
        _INDX_PROMPT_END
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=2
        SAVE_VARIABLE VARIABLE=toolhead_state VALUE=2
        _INDX_SET_ACTIVE_TOOL TOOL=-1
        SAVE_VARIABLE VARIABLE=tool_unverified VALUE=0
        SAVE_VARIABLE VARIABLE=seat_suspect VALUE=-1
        SAVE_VARIABLE VARIABLE=tc_busy VALUE=0
        M400
        RESPOND MSG="INDX ok Head recorded as empty and the latch as open (was {('T%d' % act) if act >= 0 else 'empty'}). Nothing moved."
    {% endif %}

[gcode_macro _INDX_FORGET_ASK]
description: Inner - the question INDX_FORGET_TOOL asks without CONFIRM=1
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set s = printer["gcode_macro _INDX_SEAT_G"] %}
    {% set min_g = printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(590.0)|float %}
    {% if not s.valid|int %}
        {% set lc_text = "Load cell: no reading. Check the head yourself." %}
    {% elif s.seat_g|float|abs >= min_g %}
        {% set lc_text = "Warning: load cell %.0f g, that looks like a tool on the head. Then use Release tool by hand instead." % s.seat_g|float %}
    {% else %}
        {% set lc_text = "Load cell: %.0f g, looks like an empty head." % s.seat_g|float %}
    {% endif %}
    _INDX_PROMPT TITLE="Forget the Tool on the Head?" TEXT="INDX records the head as empty and the latch as open. Nothing moves." TEXT2="INDX has {('T%d on the head' % act) if act >= 0 else 'no tool on the head'}. {lc_text}" TEXT3="If a tool is really on the head, the next tool change drives it into a dock." B1="Head is empty: forget the tool|INDX_FORGET_TOOL CONFIRM=1|warning" F1="Cancel|_INDX_PROMPT_END|secondary"

[gcode_macro MANUAL_TOOLHEAD_RESET]
description: Renamed to INDX_FORGET_TOOL; the old name still runs it straight away, as in INDX main (scripts, KlipperScreen buttons)
gcode:
    _INDX_RENAMED OLD=MANUAL_TOOLHEAD_RESET NEW=INDX_FORGET_TOOL
    INDX_FORGET_TOOL CONFIRM=1 {rawparams}

[gcode_macro _INDX_RENAMED]
description: Inner - an old command name was used: say what it is called now (the old name keeps working)
gcode:
    RESPOND MSG="INDX > {params.OLD} is renamed to {params.NEW}. Running {params.NEW}."

#####################################################################
#  Tool expansion profile [EL-CAL-014]
#
#  Each tool, empty and fully locked, taps the Z homing spot cold, at every
#  step up to max_temp and cold again; a fit is saved per tool
#  (t<n>_expansion). INDX_TOOL_EXPANSION reads it for every warm tap (G28,
#  PRIME_CLEAN, INDX_HOT_CLEAN, TOOL_Z_MEASURE, CAL_Z_LOADED, hot CAL_Z).
#  Optional: without a profile they run uncorrected.
#  Each tap from the held temperature with the heater off: the induction
#  heater's power moves the load cell reading [EL-CAL-015]. All taps at the
#  hot tap force, so a force effect drops out. The soak lets the heat break
#  follow the nozzle. The bed stays as the user has it.
#####################################################################

[gcode_macro INDX_CAL_TOOL_EXPANSION]
description: Measure the expansion profile of an empty tool: load cell taps at the Z homing spot cold, at every STEP C up to MAX (250 C, never above the heater's max_temp less 15 C), then cold again; a fit over the whole range is saved for that tool (t<n>_expansion) and reported with every reading and residual. INDX then corrects for it wherever it taps a warm or hot nozzle (INDX_TOOL_EXPANSION). TOOL=n, or TOOL=all for every tool in turn. Needs: CONFIRM=1 (asks first), load cell calibrated, homed, each tool completely empty (no filament recorded, density 0) and fully locked when picked up. SAMPLES= taps per temperature (3), STEP= C (25), MAX= C (250), SOAK= s (45). INDX_STOP stops it between temperatures. Moves: tool changes, taps at the Z homing spot. Saves: tN_expansion
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set g = printer["gcode_macro _INDX_TOOL_EXP"] %}
    {% set n = tp.tool_count|default(4)|int %}
    {% set nh = tp.no_heat_tools|default([]) %}
    {% set arg = params.TOOL|default("")|string|lower|trim %}
    {% set ns = namespace(tools=[], loaded=[], targets=[]) %}
    {% if arg == "all" %}
        {% for t in range(n) if t not in nh %}{% set ns.tools = ns.tools + [t] %}{% endfor %}
    {% elif arg.isdigit() %}
        {% set ns.tools = [arg|int] %}
    {% endif %}
    {% for t in ns.tools %}
        {% set mat = svv["t%d_material" % t]|default("")|string|trim %}
        {% set full = mat|upper not in ["", "NONE"] %}
        {% set dens = svv["t%d_fil_density" % t]|default(0)|float %}
        {% set mis = svv["t%d_misload" % t]|default(0)|int %}
        {% if full or dens > 0 or mis %}
            {% set ns.loaded = ns.loaded + ["T%d (%s)" % (t, mat if full else ("filament in its gears, misload" if mis else "filament density %.2f" % dens))] %}
        {% endif %}
    {% endfor %}
    {% set ext = printer.toolhead.extruder %}
    {% set cst = printer["gcode_macro _INDX_CONSTANTS"].nozzle_max_temp|default(300)|float %}
    {% set emax = printer.configfile.settings[ext].max_temp|default(0)|float if ext in printer.configfile.settings else 0.0 %}
    {% set emax = emax if emax > 0 else cst %}
    {% set top = [params.MAX|default(g.max_temp)|float, emax - 15.0, cst - 15.0]|min %}
    {% set step = [params.STEP|default(g.step)|float, 10.0]|max %}
    {% set first = g.cold_max|float + 10.0 %}
    {% for i in range(1, 60) %}
        {% if step * i >= first and step * i <= top + 0.01 %}{% set ns.targets = ns.targets + [step * i] %}{% endif %}
    {% endfor %}
    {% if ns.targets and top - ns.targets[-1] >= 5.0 %}{% set ns.targets = ns.targets + [top] %}{% endif %}
    {% set m = [params.SAMPLES|default(g.samples)|int, 2]|max %}
    {% set soak = [params.SOAK|default(g.soak)|float, 0.0]|max %}
    {% set mins = 8 + (ns.targets|length * (soak + 25 + m * 15) / 60.0) %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("INDX_CAL_TOOL_EXPANSION: not during a print. Nothing moved.")}
    {% elif not ns.tools %}
        {action_raise_error("INDX_CAL_TOOL_EXPANSION: which tool? TOOL=n, or TOOL=all for every tool in turn. Nothing moved.")}
    {% elif ns.tools[0] >= n or ns.tools[0] in nh %}
        {action_raise_error("INDX_CAL_TOOL_EXPANSION: T%d is not a tool with a heater on this machine. Nothing moved." % ns.tools[0])}
    {% elif ns.loaded %}
        {action_raise_error("INDX_CAL_TOOL_EXPANSION: the profile is measured with a completely empty tool (nothing that oozes onto the bed at 250 C or reads as expansion), and %s %s filament recorded. Unload it first (INDX_UNLOAD TOOL=n), or name only empty tools (TOOL=n). Nothing moved." % (ns.loaded|join(", "), "has" if ns.loaded|length == 1 else "have"))}
    {% elif ns.targets|length < 2 %}
        {action_raise_error("INDX_CAL_TOOL_EXPANSION: MAX=%.0f C leaves fewer than two temperatures over the cold taps (the heater allows up to %.0f C). Nothing moved." % (top, emax - 15.0))}
    {% elif not params.CONFIRM|default(0)|int %}
        _INDX_PROMPT TITLE="Expansion Profile, {('All Tools' if arg == 'all' else 'T%d' % ns.tools[0])}" TEXT="{'Each tool' if ns.tools|length > 1 else 'The tool'} must be completely empty. It taps the Z homing spot cold, then at {ns.targets|map('int')|join(', ')} C ({m} taps each, the nozzle lifted between them), then cold again. About {mins|round(0)|int} min per tool{(', %d tools' % ns.tools|length) if ns.tools|length > 1 else ''}." TEXT2="Keep the bed clear and the bed temperature as it is. The profile lets INDX correct every warm or hot tap of {'these tools' if ns.tools|length > 1 else 'this tool'} (G28, the print start prime and Z check, hot cleaning) for how far the nozzle grows." B1="Measure|INDX_CAL_TOOL_EXPANSION {rawparams} CONFIRM=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_GATE NEEDS=lc,homed STEP="Tool expansion" AGAIN=INDX_CAL_TOOL_EXPANSION~TOOL={arg}~CONFIRM=1
        _INDX_PROMPT_END
        _INDX_RUNNING STEP="Tool expansion"
        {% set f = printer["gcode_macro _PRIME_SETTINGS"].hot_tap_force_g|default(100)|int %}
        {% set names = [] %}
        {% for t in ns.tools %}{% set _ = names.append("T%d" % t) %}{% endfor %}
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=tools VALUE="{ns.tools}"
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=targets VALUE="{ns.targets}"
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=m VALUE={m}
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=soak VALUE={soak}
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=force VALUE={f}
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=ti VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=si VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=active VALUE=1
        RESPOND MSG="INDX > Tool expansion: {names|join(', ')}, each empty: {m} taps cold, at {ns.targets|map('int')|join(', ')} C (heater off for each tap, {f} g), then cold again under {g.cold_max|int} C. About {mins|round(0)|int} min per tool. INDX_STOP stops it between temperatures."
        _INDX_PROGRESS START=1 STEP="Tool expansion" TOTAL={ns.tools|length * (ns.targets|length + 4)} EST={soak|int + 35}
        UPDATE_DELAYED_GCODE ID=_indx_texp_loop DURATION=0.1
    {% endif %}

[gcode_macro _INDX_TEXP]
description: Inner - INDX_CAL_TOOL_EXPANSION run state: the tools and temperatures, where it is (ti: the tool, si: 0 pickup, 1 cold taps, 2.. one per temperature, then the closing cold taps, then the fit) and the taps of the tool now (pts: [step, C, contact Z], step 0 cold, -1 closing)
variable_active: 0
variable_tools: []
variable_targets: []
variable_ti: 0
variable_si: 0
variable_m: 3
variable_soak: 45.0
variable_force: 100
variable_pts: []
variable_pre_t: 0.0
variable_bed0: 0.0
gcode:

[delayed_gcode _indx_texp_loop]
gcode:
    # INDX_STOP (or an error) ended the run: do nothing
    {% if printer["gcode_macro _INDX_TEXP"].active|int %}
        _INDX_TEXP_STEP
        _INDX_TEXP_ADV
    {% endif %}

[gcode_macro _INDX_TEXP_STEP]
description: Inner - one phase of INDX_CAL_TOOL_EXPANSION for the tool now: the pickup, the cold taps, one temperature, the closing cold taps or the fit
gcode:
    {% set s = printer["gcode_macro _INDX_TEXP"] %}
    {% set g = printer["gcode_macro _INDX_TOOL_EXP"] %}
    {% set t = s.tools[s.ti|int]|int %}
    {% set k = s.si|int %}
    {% set nt = s.targets|length %}
    {% set ext = printer.toolhead.extruder %}
    {% set temp = printer[ext].temperature|float %}
    {% set band = g.band|float %}
    {% if k == 0 %}
        M104 S0
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=pts VALUE="[]"
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=bed0 VALUE={"%.1f"|format(printer.heater_bed.temperature|float if "heater_bed" in printer else 0.0)}
        RESPOND MSG="INDX > Tool expansion: T{t} ({s.ti|int + 1} of {s.tools|length})"
        _INDX_PROGRESS ITEM=1 PART="T{t}: pickup ({s.ti|int + 1} of {s.tools|length})"
        {% if printer.save_variables.variables.active_tool|default(-1)|int != t %}
            # a calibration: every check, also in race mode
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=1
            _INDX_CHANGE_TOOL TOOL={t} COLD=1
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=0
        {% endif %}
        _INDX_TEXP_CHECK TOOL={t}
    {% elif k == 1 %}
        _INDX_PROGRESS ITEM=1 PART="T{t}: cold taps"
        _INDX_TEXP_GOTO
        M104 S0
        {% if temp > g.cold_max|float %}
            _INDX_TEXP_COOL
        {% endif %}
        _INDX_TEXP_TAPS STEP=0 TARGET=0
    {% elif k <= nt + 1 %}
        {% set tt = s.targets[k - 2]|float %}
        _INDX_PROGRESS ITEM=1 PART="T{t}: {tt|int} C taps"
        _INDX_TEXP_GOTO
        M104 S{tt}
        TEMPERATURE_WAIT SENSOR={ext} MINIMUM={tt - band} MAXIMUM={tt + band}
        G4 P{(s.soak|float * 1000)|int}
        _INDX_TEXP_TAPS STEP={k - 1} TARGET={tt}
    {% elif k == nt + 2 %}
        _INDX_PROGRESS ITEM=1 PART="T{t}: closing cold taps"
        M104 S0
        _INDX_TEXP_COOL
        _INDX_TEXP_GOTO
        _INDX_TEXP_TAPS STEP=-1 TARGET=0
    {% else %}
        _INDX_PROGRESS ITEM=1 PART="T{t}: fitting profile"
        _INDX_TEXP_FIT TOOL={t}
    {% endif %}

[gcode_macro _INDX_TEXP_ADV]
description: Inner - INDX_CAL_TOOL_EXPANSION: on to the next phase, the next tool, or the end
gcode:
    {% set s = printer["gcode_macro _INDX_TEXP"] %}
    {% if s.si|int >= s.targets|length + 3 %}
        {% if s.ti|int + 1 >= s.tools|length %}
            _INDX_TEXP_END
        {% else %}
            SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=ti VALUE={s.ti|int + 1}
            SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=si VALUE=0
            UPDATE_DELAYED_GCODE ID=_indx_texp_loop DURATION=0.1
        {% endif %}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=si VALUE={s.si|int + 1}
        UPDATE_DELAYED_GCODE ID=_indx_texp_loop DURATION=0.1
    {% endif %}

[gcode_macro _INDX_TEXP_END]
description: Inner - INDX_CAL_TOOL_EXPANSION is done: heater off, Z up, one line for all tools
gcode:
    {% set s = printer["gcode_macro _INDX_TEXP"] %}
    {% set svv = printer.save_variables.variables %}
    {% set ns = namespace(txt=[]) %}
    {% for t in s.tools %}
        {% set pf = svv["t%d_expansion" % t]|default({}) %}
        {% set ns.txt = ns.txt + ["T%d %s" % (t, ("used (known to %.4f mm)" % pf.err|float) if pf.use|default(0)|int else "saved, not used")] %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=active VALUE=0
    M104 S0
    G90
    G1 Z{printer["gcode_macro TOOL_POSITIONS"].probe_z_clearance|default(10)|float} F900
    _INDX_RUNNING STEP=none
    RESPOND MSG="INDX ok Tool expansion done: {ns.txt|join(', ')}"

[gcode_macro _INDX_TEXP_CHECK]
description: Inner - INDX_CAL_TOOL_EXPANSION after the pickup (renders then): the tool is on the head, empty and fully locked (past the release), or stop before anything heats or probes
gcode:
    {% set t = params.TOOL|int %}
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set lp = printer["gcode_macro _INDX_LOCK_PAST"] if "gcode_macro _INDX_LOCK_PAST" in printer else {} %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set why = "" %}
    {% if act != t %}
        {% set why = "T%d is not on the head after the pickup" % t %}
    {% elif lp.frozen|default(0)|int and not m.cleared|default(0)|int %}
        {% set why = "T%d is recorded empty, but its lock met filament (frozen at the nozzle): it is not empty. Unload it (INDX_UNLOAD) and pull the filament out" % t %}
    {% elif m.short|int and not m.cleared|int %}
        {% set why = "T%d is short of the release, not fully locked, and INDX never probes with it" % t %}
    {% endif %}
    {% if why %}
        M104 S0
        SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=active VALUE=0
        _INDX_RUNNING STEP=none
        _INDX_RAISE MSG="INDX_CAL_TOOL_EXPANSION: {why}. Stopped before anything heated, nothing saved for T{t}."
    {% endif %}

[gcode_macro _INDX_TEXP_GOTO]
description: Inner - INDX_CAL_TOOL_EXPANSION: to Z5 over the Z homing spot
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set px = tp.probe_x|float if tp.probe_x|float >= 0 else (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% set py = tp.probe_y|float if tp.probe_y|float >= 0 else (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    G90
    G1 Z5 F900
    # Out to the clearance line first if behind it
    _INDX_TO_LANE
    G1 X{px} Y{py} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}

[gcode_macro _INDX_TEXP_COOL]
description: Inner - INDX_CAL_TOOL_EXPANSION: heater off, the nozzle up at Z15 and cooled under cold_max with the part fan, then 30 s for the bed spot the fan blew on
gcode:
    {% set g = printer["gcode_macro _INDX_TOOL_EXP"] %}
    {% set nofan = "gcode_macro _INDX_MACHINE" in printer and printer["gcode_macro _INDX_MACHINE"].part_cooling == "none" %}
    M104 S0
    G90
    G1 Z15 F900
    RESPOND MSG="INDX > Tool expansion: cooling the nozzle under {g.cold_max|int} C{' by itself (no part cooling fan: this takes longer)' if nofan else ', part fan on'}"
    _INDX_PART_FAN S=255
    TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MAXIMUM={g.cold_max|float}
    _INDX_PART_FAN S=0
    G4 P30000

[gcode_macro _INDX_TEXP_TAPS]
description: Inner - INDX_CAL_TOOL_EXPANSION: the taps of one temperature (TARGET=0: cold), each from the held temperature with the heater off for the tap, back to Z5 after it
gcode:
    {% set s = printer["gcode_macro _INDX_TEXP"] %}
    {% set band = printer["gcode_macro _INDX_TOOL_EXP"].band|float %}
    {% set ext = printer.toolhead.extruder %}
    {% set tt = params.TARGET|float %}
    {% for i in range(s.m|int) %}
        {% if tt > 0 %}
            # back to the held temperature: every tap starts from it
            M104 S{tt}
            TEMPERATURE_WAIT SENSOR={ext} MINIMUM={tt - band} MAXIMUM={tt + band}
            {% if i > 0 %}G4 P5000{% endif %}
        {% endif %}
        G1 Z3 F900
        M400
        _INDX_TEXP_PRE
        M104 S0
        G4 P800
        _INDX_PROBE_PREP
        PROBE SAMPLES=1 TRIGGER_FORCE={s.force|int}
        _INDX_TEXP_STORE STEP={params.STEP}
        G1 Z5 F900
    {% endfor %}
    _INDX_TEXP_SAY STEP={params.STEP} TARGET={tt}

[gcode_macro _INDX_TEXP_PRE]
description: Inner - INDX_CAL_TOOL_EXPANSION: the nozzle temperature at heater off, before a tap
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=pre_t VALUE={"%.2f"|format(printer[printer.toolhead.extruder].temperature|float)}

[gcode_macro _INDX_TEXP_STORE]
description: Inner - INDX_CAL_TOOL_EXPANSION: keep the last tap with its temperature (the mean of heater off and right after the touch)
gcode:
    {% set s = printer["gcode_macro _INDX_TEXP"] %}
    {% set tt = (s.pre_t|float + printer[printer.toolhead.extruder].temperature|float) / 2.0 %}
    SET_GCODE_VARIABLE MACRO=_INDX_TEXP VARIABLE=pts VALUE="{s.pts + [[params.STEP|int, tt|round(2), printer.probe.last_z_result|float|round(5)]]}"

[gcode_macro _INDX_TEXP_SAY]
description: Inner - INDX_CAL_TOOL_EXPANSION: every reading of one temperature (C:contact Z)
gcode:
    {% set s = printer["gcode_macro _INDX_TEXP"] %}
    {% set t = s.tools[s.ti|int]|int %}
    {% set ns = namespace(txt=[]) %}
    {% for p in s.pts if p[0]|int == params.STEP|int %}
        {% set ns.txt = ns.txt + ["%.1f:%.4f" % (p[1]|float, p[2]|float)] %}
    {% endfor %}
    {% set what = "closing cold" if params.STEP|int < 0 else ("cold" if params.STEP|int == 0 else "%d C" % params.TARGET|float) %}
    RESPOND MSG="INDX > T{t} expansion, {what} (C:mm): {ns.txt|join(' ')}"

[gcode_macro _INDX_TEXP_FIT]
description: Inner - INDX_CAL_TOOL_EXPANSION result for TOOL: contact Z against temperature over the whole range as a quadratic, or the step means joined linearly where the taps bend away from it (a step mean off it beyond 5.2 sigma); its 5.2 sigma error, the residuals and the closing cold taps against it (hysteresis, drift). Saved in t<n>_expansion
# Least squares z = a + b x + c x^2, x = (T - Tmean) / 100, over the cold and
# heated taps (the closing taps check, not fitted).
# s: the model's scatter at its upper 95 % bound, at least sd_floor.
# err: 5.2 x s x sqrt(2 / SAMPLES), mm: a difference of two step means.
# pts: [C, mm] per step from the cold reference (pts[0] = [t0, 0]), read linearly.
# use: 1 when err and the closing taps both fit within max_err_mm.
gcode:
    {% set t = params.TOOL|int %}
    {% set s = printer["gcode_macro _INDX_TEXP"] %}
    {% set g = printer["gcode_macro _INDX_TOOL_EXP"] %}
    {% set jz = printer["gcode_macro _TOOL_Z_JUDGE"] %}
    {% set pts = s.pts %}
    {% set m = s.m|int %}
    {% set ns = namespace(n=0, st=0.0, sz=0.0, steps=[], cl=[], txt=[]) %}
    {% for p in pts %}
        {% set ns.txt = ns.txt + ["%.1f:%.4f" % (p[1]|float, p[2]|float)] %}
        {% if p[0]|int >= 0 %}
            {% set ns.n = ns.n + 1 %}
            {% set ns.st = ns.st + p[1]|float %}
            {% set ns.sz = ns.sz + p[2]|float %}
            {% if p[0]|int not in ns.steps %}{% set ns.steps = ns.steps + [p[0]|int] %}{% endif %}
        {% else %}
            {% set ns.cl = ns.cl + [p] %}
        {% endif %}
    {% endfor %}
    {% set n = ns.n %}
    {% if n < 9 or ns.steps|length < 3 %}
        RESPOND TYPE=error MSG="INDX ! Tool expansion of T{t}: {n} taps at {ns.steps|length} temperatures, too few to fit. Nothing saved."
    {% else %}
        {% set tm = ns.st / n %}
        {% set zm = ns.sz / n %}
        {% set q = namespace(s1=0.0, s2=0.0, s3=0.0, s4=0.0, y0=0.0, y1=0.0, y2=0.0) %}
        {% for p in pts if p[0]|int >= 0 %}
            {% set x = (p[1]|float - tm) / 100.0 %}
            {% set y = p[2]|float - zm %}
            {% set q.s1 = q.s1 + x %}
            {% set q.s2 = q.s2 + x * x %}
            {% set q.s3 = q.s3 + x * x * x %}
            {% set q.s4 = q.s4 + x * x * x * x %}
            {% set q.y0 = q.y0 + y %}
            {% set q.y1 = q.y1 + x * y %}
            {% set q.y2 = q.y2 + x * x * y %}
        {% endfor %}
        {% set det = n * (q.s2 * q.s4 - q.s3 * q.s3) - q.s1 * (q.s1 * q.s4 - q.s3 * q.s2) + q.s2 * (q.s1 * q.s3 - q.s2 * q.s2) %}
        {% set ca = (q.y0 * (q.s2 * q.s4 - q.s3 * q.s3) - q.s1 * (q.y1 * q.s4 - q.s3 * q.y2) + q.s2 * (q.y1 * q.s3 - q.s2 * q.y2)) / det %}
        {% set cb = (n * (q.y1 * q.s4 - q.s3 * q.y2) - q.y0 * (q.s1 * q.s4 - q.s3 * q.s2) + q.s2 * (q.s1 * q.y2 - q.y1 * q.s2)) / det %}
        {% set cc = (n * (q.s2 * q.y2 - q.y1 * q.s3) - q.s1 * (q.s1 * q.y2 - q.y1 * q.s2) + q.y0 * (q.s1 * q.s3 - q.s2 * q.s2)) / det %}
        # per step: mean temperature, mean contact, taps, the quadratic there
        {% set r = namespace(ssq=0.0, ssw=0.0, st=[]) %}
        {% for k in ns.steps %}
            {% set a = namespace(c=0, t=0.0, z=0.0) %}
            {% for p in pts if p[0]|int == k %}
                {% set a.c = a.c + 1 %}
                {% set a.t = a.t + p[1]|float %}
                {% set a.z = a.z + p[2]|float %}
            {% endfor %}
            {% set tb = a.t / a.c %}
            {% set zb = a.z / a.c %}
            {% for p in pts if p[0]|int == k %}
                {% set x = (p[1]|float - tm) / 100.0 %}
                {% set r.ssq = r.ssq + (p[2]|float - zm - (ca + cb * x + cc * x * x)) ** 2 %}
                {% set r.ssw = r.ssw + (p[2]|float - zb) ** 2 %}
            {% endfor %}
            {% set xb = (tb - tm) / 100.0 %}
            {% set r.st = r.st + [[tb, zb, a.c, zm + ca + cb * xb + cc * xb * xb]] %}
        {% endfor %}
        {% set dq = n - 3 %}
        {% set dw = n - ns.steps|length %}
        {% set sq = [(r.ssq / dq) ** 0.5 * jz.sd_up[[dq, 30]|min]|float, jz.sd_floor|float]|max %}
        {% set sw = [((r.ssw / dw) ** 0.5 if dw > 0 else 0.0) * jz.sd_up[[[dw, 1]|max, 30]|min]|float, jz.sd_floor|float]|max %}
        # a step mean off the quadratic beyond 5.2 sigma of a step mean: the
        # taps bend away from it, and the step means are the profile
        {% set b = namespace(worst=0.0, res=[]) %}
        {% for st in r.st %}
            {% set rk = st[1] - st[3] %}
            {% set b.res = b.res + [[st[0]|round(1), rk|round(4)]] %}
            {% set b.worst = [b.worst, rk|abs / (5.2 * sw / st[2] ** 0.5)]|max %}
        {% endfor %}
        {% set table = b.worst > 1.0 %}
        {% set sd = sw if table else sq %}
        {% set err = 5.2 * sd * (2.0 / m) ** 0.5 %}
        {% set rms = ((r.ssw if table else r.ssq) / n) ** 0.5 %}
        {% set t0 = r.st[0][0] %}
        {% set base = r.st[0][1] if table else r.st[0][3] %}
        {% set pp = namespace(v=[]) %}
        {% for st in r.st %}
            {% set pp.v = pp.v + [[st[0]|round(1), ((st[1] if table else st[3]) - base)|round(5)]] %}
        {% endfor %}
        # dz = k1 (T - t0) + k2 (T - t0)^2 from the quadratic, for the record
        {% set k1 = cb / 100.0 + 2.0 * cc * (t0 - tm) / 10000.0 %}
        {% set k2 = cc / 10000.0 %}
        # the closing cold taps against the profile at their temperature
        {% set c = namespace(n=0, t=0.0, z=0.0) %}
        {% for p in ns.cl %}
            {% set c.n = c.n + 1 %}
            {% set c.t = c.t + p[1]|float %}
            {% set c.z = c.z + p[2]|float %}
        {% endfor %}
        {% set tcl = c.t / c.n if c.n else 0.0 %}
        {% set p1 = pp.v[1] %}
        {% set ecl = p1[1] * [tcl - t0, 0.0]|max / (p1[0] - t0) if p1[0] > t0 else 0.0 %}
        {% set drift = (c.z / c.n - (base + ecl)) if c.n else 99.0 %}
        {% set lim = g.max_err_mm|float %}
        {% if err > lim %}
            {% set why = "known to %.4f mm only, more than %.3f mm: noisy taps (more SAMPLES, check the tip and the bed)" % (err, lim) %}
        {% elif drift|abs > lim %}
            {% set why = "its closing cold taps are %+.4f mm off it (hysteresis or drift: soak the bed, check the tip, measure again)" % drift %}
        {% else %}
            {% set why = "" %}
        {% endif %}
        {% set bed = printer.heater_bed.temperature|float if "heater_bed" in printer else 0.0 %}
        {% set now = printer.indx_clog.now|default("") if "indx_clog" in printer else "" %}
        {% set d = {"pts": pp.v, "t0": t0|round(1), "fit": "table" if table else "poly2", "k": [k1|round(8), k2|round(10)], "err": err|round(5), "rms": rms|round(5), "res": b.res, "close": [tcl|round(1), drift|round(5)], "n": n, "m": m, "force": s.force|int, "bed": s.bed0|float, "date": now|string, "use": 0 if why else 1, "why": why} %}
        SAVE_VARIABLE VARIABLE=t{t}_expansion VALUE="{d}"
        {% set top = pp.v[-1] %}
        {% set ptxt = [] %}
        {% for p in pp.v %}{% set _ = ptxt.append("%.1f:%+.4f" % (p[0], p[1])) %}{% endfor %}
        {% set rtxt = [] %}
        {% for p in b.res %}{% set _ = rtxt.append("%.1f:%+.4f" % (p[0], p[1])) %}{% endfor %}
        RESPOND MSG="INDX ok T{t} expansion profile ({('step means joined linearly: the taps bend away from a quadratic, %.1f sigma' % (5.2 * b.worst)) if table else ('quadratic: %.3f um/C %+.6f um/C2 from the cold reference' % (k1 * 1000, k2 * 1000))}): {'%+.4f'|format(top[1])} mm from {t0|round(1)} to {top[0]} C, known to {'%.4f'|format(err)} mm (5.2 sigma) between any two temperatures. {n} taps, rms residual {'%.4f'|format(rms)} mm. Closing cold taps at {tcl|round(1)} C: {'%+.4f'|format(drift)} mm from the profile."
        RESPOND MSG="INDX > T{t} expansion readings (C:mm): {ns.txt|join(' ')}"
        RESPOND MSG="INDX > T{t} expansion profile (C:mm from cold): {ptxt|join(' ')}"
        RESPOND MSG="INDX > T{t} expansion residuals of the step means from the quadratic (C:mm): {rtxt|join(' ')}"
        {% if (bed - s.bed0|float)|abs > 2.0 %}
            RESPOND TYPE=error MSG="INDX ! The bed went from {s.bed0|float|round(1)} to {bed|round(1)} C during the T{t} run: its growth is in these taps. Keep the bed at one temperature (soaked) and measure again if the closing taps are off."
        {% endif %}
        {% if why %}
            RESPOND TYPE=error MSG="INDX ! The T{t} expansion profile is saved but not used: {why}."
        {% else %}
            RESPOND MSG="INDX ok INDX corrects every warm or hot tap of T{t} with this profile from {t0|round(1)} to {top[0]} C (no extrapolation beyond)."
        {% endif %}
    {% endif %}
