#####################################################################
#  INDX HARDWARE CONSTANTS
#####################################################################
#
#  These values are fixed by the INDX mechanism geometry and gear
#  mesh. DO NOT MODIFY unless you are changing the physical hardware.
#
#  Per-tool positions are derived as:
#     trigger_y   = tool.dock_y - TOOL_POSITIONS.dock_dir * magnet_offset (_INDX_CONSTANTS)
#     clearance_y = indx.cfg clearance_y, or the saved indx_clearance  ("auto" resolved by _INDX_BUILD_TOOLS)
#
#####################################################################

[gcode_macro _INDX_CONSTANTS]
# Forces are in real grams (load cell calibrated with a known weight) [EL-TC-001]
description: Fixed INDX hardware constants: do not modify

# --- Dock geometry ---
# Distances in front of dock_y, mm [EL-TC-002]:
#   magnet_offset       the activation magnet touches the head; the dance starts here
#   latch_crash_offset  from here in a closed latch can hit the tool (documentation only: a pickup opens the latch at the magnet line, magnet_offset, before this)
#   magnet_approach_mm  the fast travel stops this far before the magnet, the rest runs at
#                       magnet_feedrate. A clack at the dock: the dock Y is off by more than this.
variable_magnet_offset: 9.0
variable_latch_crash_offset: 6.0
variable_magnet_approach_mm: 0.5
variable_magnet_feedrate: 600
# Distance for the gentle peel-off after parking/pickup (relative move): out
# past the magnet
variable_peel_distance: 10.0

# --- Unlock dance: Y depths toward the dock from trigger_y ---
# These define the waypoints of the wiggle sequence.
# Expressed as positive distances along dock_dir from trigger_y.
variable_squeeze_depth: 0.5
variable_wiggle_in_depth: 1.0
variable_wiggle_out_depth: 2.0

# --- Unlock dance: E-axis moves (gear mesh: do not change) ---
variable_squeeze_e: -0.27
variable_wiggle_in_e: 0.27
variable_wiggle_out_e: -1.7
variable_full_open_e: -11.0
variable_full_lock_e: 11.0

# --- Latch homing (only with [tmc_sg_log] / SG_HOME_E, INDX Suite) ---
# mm of extruder motion from the opening hard stop. open: where a homed latch
# waits for a pickup. A pickup locks until the clamp force is reached, at most
# to lock_max; retracting is illegal from there to the release + 0.2. The
# release (gear out of teeth) cannot be detected: the latest one is used. [EL-TC-003]
variable_latch_open_from_stop: 2.06
# The lock runs at latch_fast_feedrate up to here, then senses the load cell at 5 mm/s (speed_live with the MCU latch stop live) [EL-TC-004]
variable_latch_fast_from_stop: 6.5
# Stopgap that stays clear of the release in every gear mesh [EL-TC-005]
variable_latch_lock_max_from_stop: 12.4
# Hard lock: stopped at this force or more (or never at the spring force);
# the park then opens to latch_hard_open_from_stop and homes the latch [EL-TC-006]
variable_latch_hard_force_g: 2600
# Force the lock stops at (tool gripped). Not spring_force_g: a target above
# what a latch reaches fails every pickup.
variable_latch_lock_force_g: 1390
# A lock that hits its travel limit first passes when the seat weight out of
# the dock is at least this. Floor for a tool without its own level (each
# tool's own: 68 % of its calibrated seat); 5.2 sigma margin rule. [EL-TC-007]
variable_latch_lock_pass_g: 710
# and at least a partly seated tool's reading (seat_partial_frac of its
# calibrated seat t<n>_seat_g) plus 5.2 x lc_pair_sigma_g (the noise of an
# empty and a seated reading) plus the load cell stick (lc_stick_g) [EL-TC-074]
variable_seat_partial_frac: 0.56
variable_lc_pair_sigma_g: 25
# Sign of a seated tool's reading against the empty head (the spring preload
# pulls it negative). As large the other way stops the seat check. [EL-TC-008]
variable_seat_sign: -1
# An empty tool whose force lock reads more than this times its own clamp
# (t<n>_lock_clamp_g, else latch_lock_force_g) is pressing on something: the
# seat check stops. Loaded tools are left to the hard lock handling. [EL-TC-008]
variable_latch_over_force_mult: 2.0
# Failed pickup, seat reading under the loose level (g, either way): the
# tool stayed in its dock, the latch is opened. At or over it the seated way:
# a tool hangs loose on the head, the check stops and keeps it recorded.
# Per tool: loose_seat_frac of its calibrated seat (t<n>_seat_g) less 5.2 x
# lc_pair_sigma_g and the stick (lc_stick_g), never over retry_empty_max_g,
# which is the level of a tool without a calibrated seat [EL-TC-057, EL-TC-074]
variable_retry_empty_max_g: 250
variable_loose_seat_frac: 0.20
# Misload: filament pushed into a docked tool's gears pushes the load cell
# before the clamp starts. More than this (g) before the trigger, with a lock
# short of its force target (_INDX_MISLOAD_CHECK), stops the pickup in the
# dock. With the close after the peel it only marks a misload suspect.
# Over every good pickup's push with its session spread [EL-TC-009, EL-TC-074]
variable_misload_push_g: 130
# Warn when a tool weighs this much (g) more or less in its dock than out of
# it (the dock pushes on it: Z alignment) [EL-TC-055]
variable_dock_skew_warn_g: 350
variable_latch_hard_open_from_stop: 1.0
variable_latch_release_from_stop: 13.2
# Race mode only: how far past the release its fixed lock ends (mm). The race
# park leaves the latch at the open position unhomed (_INDX_LATCH_RACE_OPEN),
# so the fixed lock feeds a normal lock to _INDX_LOCK_PAST target_mm plus this.
variable_latch_race_margin: 0.2
# Latch homing current (SG_HOME_E, stealthChop). Only the squeeze and the
# latch homing run below run current. [EL-TC-010]
variable_latch_home_current: 0.3
# Nozzle rating: no INDX command heats above this ([extruder] max_temp: 300) [EL-TC-011]
variable_nozzle_max_temp: 300
# Close after the peel (saved variable pickup_close_after_peel = 1, every
# pickup): in the dock the latch senses to the clamp start (close_clamp_start_g
# over the empty head), at least to close_min_from_stop, at most to the lock
# limit; the peel; out of the dock close_hold_frac of t<n>_seat_g must hold;
# then the close. An empty tool passes if its closing peak reaches
# close_peak_frac of t<n>_close_peak_g (INDX_CAL_LOCK); a loaded tool gets the
# sensed lock and the lock past. [EL-TC-012]
variable_close_min_from_stop: 9.0
# An empty tool (no plug to push into) clamps further in the dock; below the
# earliest release, so the gear stays in mesh for the close [EL-TC-012]
variable_close_min_empty_from_stop: 10.0
variable_close_clamp_start_g: 175
# Fraction of the seat that must hold after the peel [EL-TC-012]
variable_close_hold_frac: 0.50
variable_close_peak_frac: 0.75
# A latch homing whose stop is further than latch_home_band_mm from
# latch_home_expect_mm (mm into the search from the open position) is not
# trusted (slipped tooth, false stall, gear out of mesh). The band applies
# after a park only; from an unknown position any stop within
# latch_travel_mm is a valid home (_INDX_LATCH_HOME UNKNOWN=1). [EL-TC-013]
variable_latch_home_expect_mm: 0.65
variable_latch_home_band_mm: 1.35
variable_latch_travel_mm: 13.4

# --- Feed rates (mm/min) ---
variable_squeeze_feedrate: 2000
variable_wiggle_feedrate: 2500
variable_dock_feedrate: 3000
variable_latch_feedrate: 1500
# Latch moves through free travel at a known position (no sensing, no load):
# the lock up to latch_fast_from_stop and the open to the open position
variable_latch_fast_feedrate: 6000
variable_peel_feedrate: 3000
variable_engage_feedrate: 2500

# --- Extruder current (amps) ---
variable_squeeze_current: 0.2
variable_run_current: 0.6

# --- E-axis rotation distance for TC moves ---
# Every latch (tool change) E move uses this value, whatever printer.cfg sets;
# printer.cfg's rotation_distance is restored after each one. Filament moves keep printer.cfg's value.
variable_tc_rotation_distance: 5.7

gcode:

#####################################################################
#  1. GLOBAL VARIABLES & STATUS DASHBOARD
#####################################################################

[gcode_macro _TOOLCHANGE_VARS]
variable_mode: "normal"
# The speed mode that turns the slow safety checks off (MODE_RACE). Its name
# lives here, in MODE_RACE and in the user facing text.
variable_race_mode: "race"
# race_now: 1 while a CHANGE_TOOL or PARK_TOOL runs in race mode
# (_INDX_RACE_GATE decides at its start, cleared at its end). race_block: a
# test that changes tools sets it, so its changes run every check.
variable_race_now: 0
variable_race_block: 0
variable_accel_mult: 0.7
variable_speed_mult: 0.7
variable_toolhead_state: 0 # 0=Locked, 2=Open
variable_rotation_dist_overridden: 0
# Set by [homing_override] so CHANGE_TOOL/PARK_TOOL do not re-enter G28 mid-home.
variable_homing_busy: 0
# slow: 1 while a tool change touches a newly measured dock (t<n>_dock_new)
# or runs with SLOW=1: speed and acceleration at slow_mult of the maximum,
# whatever the speed mode. Left at 1 if the change fails, so the retry is
# slow too; cleared when a change finishes.
variable_slow: 0
variable_slow_mult: 0.2
# While slow is set, the moves into and out of the dock (the dance's Y moves,
# the engage slide, the unlocked park slide) also run at slow_dock_mult of
# their fixed feedrates. The latch (extruder) moves keep their speeds.
variable_slow_dock_mult: 0.5
# applied_z: the live Z offset INDX last applied (None: not since a restart)
variable_applied_z: None
# change_busy: a CHANGE_TOOL is between its start and its end
variable_change_busy: 0
# init_done: INIT_STATE has restored the saved state after a restart. G28,
# CHANGE_TOOL and PARK_TOOL refuse until then [EL-TC-014]
variable_init_done: 0
gcode:

[delayed_gcode INIT_STATE]
initial_duration: 5.0
gcode:
    _INDX_BUILD_TOOLS

    {% set svv = printer.save_variables.variables %}
    # Restore saved latch state so INDX displays the correct Open/Locked label after a
    # firmware restart. The INDX latch is mechanically self-retaining, so the saved value
    # accurately reflects the physical position across restarts.
    # Defaults to 0 (Locked) on first boot before any toolchange has been recorded.
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE={svv.toolhead_state|default(0)|int}

    # Race mode comes back after a restart with a console warning, no dialog
    {% set m = svv.tc_mode|default("normal")|string|lower %}
    MODE_{m|upper}{" RESTORE=1" if m == printer["gcode_macro _TOOLCHANGE_VARS"].race_mode else ""}
    # A measured trigger offset (INDX_CAL_TRIGGER) replaces the indx_prime.cfg one
    {% if svv.lc_trigger_offset is defined and "gcode_macro _LOADCELL_TRUE" in printer %}
        SET_GCODE_VARIABLE MACRO=_LOADCELL_TRUE VARIABLE=trigger_offset VALUE={svv.lc_trigger_offset|float}
    {% endif %}
    # The tool buttons show the saved tool [EL-TC-015]
    _INDX_SET_ACTIVE_TOOL TOOL={svv.active_tool|default(-1)|int}
    # The retraction guard of a lock the restart interrupted: the E position
    # starts over, the distance still needed does not [EL-TC-015]
    {% if svv.lock_clear_e|default(0)|float > 0 and svv.active_tool|default(-1)|int >= 0 %}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=lock_e VALUE={printer.toolhead.position.e|float}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=clear_e VALUE={[svv.lock_clear_e|float, 2.0]|max}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=cleared VALUE=0
        # and whether that lock stopped short of the release (no probing)
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=short VALUE={svv.lock_short|default(0)|int}
        # without the sensed lock that short was taken, not measured [EL-TC-068]
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=assumed VALUE={1 if svv.lock_short|default(0)|int and (svv.lock_assumed|default(0)|int or "tmc_sg_log" not in printer) else 0}
    {% endif %}
    # The state is back: homing and tool changes may run [EL-TC-014]
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=init_done VALUE=1
    {% if svv.tc_busy|default(0)|int %}
        RESPOND TYPE=error MSG="INDX ! A tool change was cut off before this restart: the saved tool and latch state may be wrong. Look at the head and the docks; G28 and tool changes wait until you record what you see (INDX_SEAT_TOOL_BY_HAND, INDX_RELEASE_TOOL_BY_HAND or INDX_FORGET_TOOL)."
    {% endif %}
    # The one status run after a restart: the INDX page waits for init_done
    # and sends no INDX_STATUS of its own until then
    {% if "gcode_macro INDX_STATUS" in printer %}
        INDX_STATUS BRIEF=1
    {% endif %}
    # INDX Macros: what the INDX Suite would add, one console line,
    # and the dialog once per start until it is turned off [EL-SET-042]
    _INDX_SUITE_NOTICE WHEN=start
    # An older config may still carry a Z offset on the reference tool: offer
    # the one-time fix [EL-TC-015]
    {% if svv["t%d_offset_z" % svv.ref_tool|default(0)|int]|default(0.0)|float|abs >= 0.0005 and "gcode_macro INDX_REF_Z_ZERO" in printer %}
        INDX_REF_Z_ZERO
    {% endif %}
    # M104 and M109 carry INDX's heat rules (INDX_SET_TEMP): through
    # indx_api.py with the INDX Suite, through indx_macros_only.cfg's macros
    # with INDX Macros. Neither: an install that is not complete
    {% if "indx_api" not in printer and "gcode_macro M104" not in printer %}
        RESPOND TYPE=error MSG="INDX ! INDX's indx_api module is not loaded, so M104 and M109 run without INDX's heat rules (no heating with an empty head, a parked tool or a tool without heating). Repair the INDX install: run install.sh again (install.sh --macros-only on a macros-only install), or Repair on the INDX page (Updates)."
    {% endif %}
    # Extension API: INDX has its state back (indx_api.py)
    {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=boot{% endif %}

[gcode_macro _INDX_INIT_GATE]
description: Inner - refuse CMD= until INIT_STATE has restored the saved state after a restart
# In the first seconds after a restart the latch state, the speed mode, the
# trigger offset and the guard of an interrupted lock are not back yet; a
# command then would act on defaults instead of what INDX saved. [EL-TC-014]
gcode:
    # INDX's modules without the INDX Suite's macro files (an update brought
    # new ones and the install was not repaired yet): the sensed lock and
    # the checks that run in Python would be missing their macros [EL-UI-013]
    {% set su = printer["gcode_macro _INDX_SUITE"] %}
    {% set gone = namespace(l=[]) %}
    {% for f, m in su.files.items() if ("indx_api" in printer or "tmc_sg_log" in printer) and ("gcode_macro " ~ m) not in printer %}
        {% set gone.l = gone.l + [f] %}
    {% endfor %}
    {% if gone.l %}
        {action_raise_error("%s: INDX's Klipper modules are loaded, but the INDX Suite's macro files %s are not linked (an update brought them). Repair the INDX install (INDX page, Updates: Repair, or run %s), then restart Klipper. Nothing moved." % (params.CMD|default("INDX"), gone.l|join(", "), su.install))}
    {% endif %}
    {% if not printer["gcode_macro _TOOLCHANGE_VARS"].init_done|int %}
        {action_raise_error("%s: INDX is still starting up (it restores its saved state 5 s after a restart). Try again in a few seconds. If this persists, look for an error from INIT_STATE above." % params.CMD|default("INDX"))}
    {% endif %}

[gcode_macro _INDX_BUILD_TOOLS]
description: Inner - build TOOL_POSITIONS.tools from the docks (measured ones from variables.cfg, the rest estimated) and resolve clearance_y
# INIT_STATE runs it 5 s after a restart. G28, CHANGE_TOOL and PARK_TOOL run
# it first every time, so a command in those first seconds does not fail
# half way, and a dock measured a moment ago is used at once. [EL-TC-016]
# The macros that read the list render after this one has run.
# Dock of tool n: measured t<n>_dock_x/_y from variables.cfg; else an
# estimate (up to 64 docks): from the nearest measured dock and the spacing,
# else the indx.cfg pair, else the T0 pair and the spacing. With
# docks_calibrated True the indx.cfg pairs are the docks. An unmeasured dock is
# never driven into: the estimate only places the head and the clearance line.
# next: the estimated dock after the last; step: the X spacing used.
# clearance_y: a number, or "auto" (most protruding dock + tool_clearance_depth);
# the saved indx_clearance wins over indx.cfg. The result replaces
# TOOL_POSITIONS.clearance_y in memory; clearance_cfg keeps the indx.cfg value.
variable_clearance_cfg: None
variable_clearance_src: ""
variable_next: {}
variable_step: 0.0
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set me = printer["gcode_macro _INDX_BUILD_TOOLS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set n = tp.tool_count|int %}
    {% set dir = tp.dock_dir|float %}
    {% set dcal = tp.docks_calibrated|default(False) %}
    {% set min_c = printer["gcode_macro TOOL_POSITIONS"].tool_clearance_depth|default(printer["gcode_macro _INDX_CHECK_CLEARANCE"].min_dock_clearance)|float %}
    {% set cfg_clr = me.clearance_cfg if me.clearance_cfg is not none else tp.clearance_y %}
    # the measured docks, and the spacing between neighbors
    {% set mx = {} %}
    {% for i in range(n) if svv.get("t%d_dock_x" % i) is not none and svv.get("t%d_dock_y" % i) is not none %}
        {% set _ = mx.update({i: [svv.get("t%d_dock_x" % i)|float, svv.get("t%d_dock_y" % i)|float]}) %}
    {% endfor %}
    {% set gs = namespace(sum=0.0, k=0) %}
    {% for i in range(1, n) if i in mx and (i - 1) in mx %}
        {% set gs.sum = gs.sum + mx[i][0] - mx[i - 1][0] %}
        {% set gs.k = gs.k + 1 %}
    {% endfor %}
    {% set cfg_step = (tp.t1_x|float - tp.t0_x|float) if (tp.t0_x is defined and tp.t1_x is defined) else 0.0 %}
    {% set step = (gs.sum / gs.k) if gs.k else (cfg_step if cfg_step|abs > 1.0 else tp.dock_spacing|default(43.7)|float) %}
    {% set ns = namespace(json="", ext=none) %}
    {% for i in range(n) %}
        {% set cx = tp["t%d_x" % i] if ("t%d_x" % i) in tp else none %}
        {% set cy = tp["t%d_dock_y" % i] if ("t%d_dock_y" % i) in tp else none %}
        {% set an = namespace(j=-1, d=999) %}
        {% for j in mx if (j - i)|abs < an.d or ((j - i)|abs == an.d and j < an.j) %}
            {% set an.j = j %}
            {% set an.d = (j - i)|abs %}
        {% endfor %}
        {% if i in mx %}
            {% set x = mx[i][0] %}
            {% set dy = mx[i][1] %}
        {% elif dcal and cx is not none and cy is not none %}
            {% set x = cx|float %}
            {% set dy = cy|float %}
        {% elif an.j >= 0 %}
            # from the nearest measured dock: the indx.cfg difference when
            # both pairs are there, else the spacing
            {% set cj = tp["t%d_x" % an.j] if ("t%d_x" % an.j) in tp else none %}
            {% set x = mx[an.j][0] + ((cx|float - cj|float) if cx is not none and cj is not none else (i - an.j) * step) %}
            {% set dy = mx[an.j][1] %}
        {% elif cx is not none and cy is not none %}
            {% set x = cx|float %}
            {% set dy = cy|float %}
        {% elif tp.t0_x is defined and tp.t0_dock_y is defined %}
            {% set x = tp.t0_x|float + i * step %}
            {% set dy = tp.t0_dock_y|float %}
        {% else %}
            # no position at all: none, and it does not count toward the
            # clearance line
            {% set x = -1.0 %}
            {% set dy = none %}
        {% endif %}
        {% set known = dy is not none %}
        {% set dy = dy|float if known else (ns.ext if ns.ext is not none else 0.0) %}
        {% if known and (ns.ext is none or -dir * dy > -dir * ns.ext) %}
            {% set ns.ext = dy %}
        {% endif %}
        {% set entry = '{"x": %.3f, "dock_y": %.3f}' % (x, dy) %}
        {% if loop.first %}
            {% set ns.json = "[" ~ entry %}
        {% else %}
            {% set ns.json = ns.json ~ ", " ~ entry %}
        {% endif %}
    {% endfor %}
    # the next dock after the last: one spacing on from the last measured one
    {% set nx = namespace(j=-1) %}
    {% for j in mx if j > nx.j %}{% set nx.j = j %}{% endfor %}
    {% set nxt = {"x": (mx[nx.j][0] + (n - nx.j) * step)|round(3), "y": mx[nx.j][1]|round(3), "from": nx.j} if nx.j >= 0 else {} %}
    {% set mode = svv.indx_clearance|default(cfg_clr) %}
    {% if ns.ext is none %}
        {% set ns.ext = 0.0 %}
    {% endif %}
    {% if mode is string and mode|lower == "auto" %}
        {% set clr = ns.ext - dir * min_c %}
        {% set src = "auto" %}
    {% else %}
        {% set clr = mode|float %}
        {% set src = "saved" if svv.indx_clearance is defined else "indx.cfg" %}
    {% endif %}
    {% if me.clearance_cfg is none %}
        SET_GCODE_VARIABLE MACRO=_INDX_BUILD_TOOLS VARIABLE=clearance_cfg VALUE='{cfg_clr|tojson}'
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_BUILD_TOOLS VARIABLE=clearance_src VALUE='"{src}"'
    SET_GCODE_VARIABLE MACRO=_INDX_BUILD_TOOLS VARIABLE=next VALUE='{nxt|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_BUILD_TOOLS VARIABLE=step VALUE={"%.3f"|format(step)}
    SET_GCODE_VARIABLE MACRO=TOOL_POSITIONS VARIABLE=clearance_y VALUE={"%.3f"|format(clr)}
    SET_GCODE_VARIABLE MACRO=TOOL_POSITIONS VARIABLE=tools VALUE='{ns.json}]'

#####################################################################
#  2. SPEED & POWER MODES
#####################################################################

[gcode_macro _INDX_CONSOLE]
description: Inner - console detail (INDX_SETTING MACRO=_INDX_CONSOLE VAR=detail VALUE=True): off by default, a tool change prints only what needs you (warnings, holds, stops); on adds the routine lines (the bucket visit summary, the move out from behind the clearance line). The support log has the data either way. [EL-UI-014]
variable_detail: False
gcode:

[gcode_macro _INDX_PA_SET]
description: Inner - pressure advance of the active extruder: ADVANCE=. Quiet with the INDX Suite (INDX_PA_SET); SET_PRESSURE_ADVANCE otherwise. Nothing when it is already that. [EL-UI-014]
gcode:
    {% set a = params.ADVANCE|float %}
    {% if (printer[printer.toolhead.extruder].pressure_advance|float - a)|abs > 0.0000005 %}
        {% if "indx_tc_fast" in printer %}
            INDX_PA_SET ADVANCE={a}
        {% else %}
            SET_PRESSURE_ADVANCE ADVANCE={a}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_PA_HOLD]
description: Inner - pressure advance off for a park, pickup or tool change (OWNER= who turned it off); the outermost caller's _INDX_PA_RELEASE puts it back. Nothing when already held
# Pressure advance and its smoothing on the latch moves and the park
# retraction made the latch motor step back and forth with steps a few clock
# ticks apart: the INDX MCU can shut down with "Timer too close" in a
# park. The latch moves are not extrusion: no pressure advance on
# them. A switch to or from 0 flushes the step generation once (a
# smooth time change); the bucket's own PA 0 then costs nothing. [EL-TC-076]
variable_owner: ""
variable_saved: 0.0
# With the INDX Suite the gate decides (INDX_PA_GATE, indx_tc_fast.py): the
# owner closes it, the release lets it open again while the print prints.
# [EL-TC-079]
gcode:
    {% set me = printer["gcode_macro _INDX_PA_HOLD"] %}
    {% if not me.owner|string %}
        {% set pa = printer[printer.toolhead.extruder].pressure_advance|float %}
        SET_GCODE_VARIABLE MACRO=_INDX_PA_HOLD VARIABLE=saved VALUE={pa}
        SET_GCODE_VARIABLE MACRO=_INDX_PA_HOLD VARIABLE=owner VALUE='"{params.OWNER|default("tc")}"'
        {% if "indx_tc_fast" in printer %}
            INDX_PA_GATE
        {% elif pa > 0 %}
            _INDX_PA_SET ADVANCE=0
        {% endif %}
    {% endif %}

[gcode_macro _INDX_PA_RELEASE]
description: Inner - pressure advance back to what _INDX_PA_HOLD saved, when OWNER= is the one that held it (FORCE=1: whoever held it: a print start after a change that stopped halfway)
gcode:
    {% set me = printer["gcode_macro _INDX_PA_HOLD"] %}
    {% if me.owner|string and (params.FORCE|default(0)|int or me.owner|string == params.OWNER|default("tc")) %}
        SET_GCODE_VARIABLE MACRO=_INDX_PA_HOLD VARIABLE=owner VALUE='""'
        {% if "indx_tc_fast" in printer %}
            INDX_PA_GATE
        {% elif me.saved|float > 0 %}
            _INDX_PA_SET ADVANCE={me.saved|float}
        {% endif %}
    {% endif %}

[gcode_macro _RESTORE_EXTRUDER_CURRENT]
description: Inner - restore extruder TMC current to the value configured in printer.cfg (called after toolchange and on mode switch)
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set tmc_sections = ["tmc2240 extruder", "tmc2209 extruder", "tmc2130 extruder", "tmc5160 extruder"] %}
    {% set ns = namespace(current=none, found=false, sec="") %}
    {% for s in tmc_sections %}
        {% if s in cfg and not ns.found %}
            {% set ns.current = cfg[s].run_current %}
            {% set ns.found = true %}
            {% set ns.sec = s %}
        {% endif %}
    {% endfor %}
    # SET_TMC_CURRENT waits for the whole queue (its SPI write is verified at
    # its print time): skip it when the driver already runs at this current
    {% set now = printer[ns.sec].run_current|default(-1)|float if ns.found else -1.0 %}
    {% if ns.found and (now - ns.current|float)|abs >= 0.05 %}
        SET_TMC_CURRENT STEPPER=extruder CURRENT={ns.current}
    {% endif %}


[gcode_macro _TC_SET_ROTATION_DIST]
description: Inner - set extruder rotation_distance to the fixed TC value before any TC E moves
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set target = c.tc_rotation_distance|float %}
    # tc_rotation_distance and SET_EXTRUDER_ROTATION_DISTANCE are in units
    # without a gear ratio: with gear_ratio set the latch would move the
    # wrong distance, so nothing moves
    {% if printer.configfile.settings.extruder.gear_ratio|default([])|length %}
        {action_raise_error("INDX: [extruder] has gear_ratio set. INDX drives the latch with rotation_distance alone: remove gear_ratio and set rotation_distance: %s, then restart. The latch did not move." % target)}
    {% endif %}
    {% set configured = printer.configfile.settings.extruder.rotation_distance|float %}
    {% if (configured - target)|abs > 0.0001 %}
        SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={target}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=rotation_dist_overridden VALUE=1
    {% endif %}

[gcode_macro _TC_RESTORE_ROTATION_DIST]
description: Inner - restore extruder rotation_distance to the value configured in printer.cfg
gcode:
    {% if printer["gcode_macro _TOOLCHANGE_VARS"].rotation_dist_overridden %}
        SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={printer.configfile.settings.extruder.rotation_distance}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=rotation_dist_overridden VALUE=0
    {% endif %}

[gcode_macro _TC_LATCH_MOVE]
description: Inner - latch move. E=distance mm, F=feedrate mm/min, I=current amps (default run_current, never above it). Queued in order with the moves around it when cold E moves are allowed; INDX_EXTRUDER_MOVE otherwise.
# Queued: a plain G1 E runs between the moves around it without draining the
# queue (each drain costs a full stop and a restart) [EL-TC-069]. M220/M221 are
# held at 100 %: they must not change a latch move. INDX_EXTRUDER_MOVE is the
# fallback when the extruder refuses cold moves.
gcode:
    {% set e = params.E|float %}
    {% set f = params.F|default(1500)|float %}
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set ext = printer.toolhead.extruder %}
    {% set cfg = printer.configfile.settings %}
    {% set ns = namespace(run=none) %}
    {% for sec in ["tmc2240 extruder", "tmc2209 extruder", "tmc2130 extruder", "tmc5160 extruder"] %}
        {% if sec in cfg and ns.run is none %}{% set ns.run = cfg[sec].run_current|float %}{% endif %}
    {% endfor %}
    {% set run = ns.run if ns.run is not none else c.run_current|float %}
    {% set i = [params.I|default(c.run_current)|float, run]|min %}
    # [indx_tc_fast]: a current switch is applied where the queued moves end,
    # without waiting for it (verified before the next sensed latch move)
    {% set fast = ("indx_tc_fast" in printer and printer.indx_tc_fast.enabled) %}
    # Extension API stage 3: with a tool manager, every stepper synced to the
    # extruder is unsynced for the move and synced back after it (indx_api.py)
    {% set ls = "indx_api" in printer and printer.indx_api.latch_sync %}
    {% if ls %}_INDX_LATCH_SYNC MODE=release{% endif %}
    # cold (under min_extrude_temp) with [indx_tc_fast]: queued the same way
    # through INDX_LATCH_E, never INDX_EXTRUDER_MOVE's two queue drains [EL-TC-080]
    {% if printer[ext].can_extrude or fast %}
        {% if (i - run)|abs > 0.001 %}
            {% if fast %}
                INDX_TMC_AT CURRENT={i}
                # the write (two verified SPI registers) lands before the move
                G4 P40
            {% else %}
                SET_TMC_CURRENT STEPPER=extruder CURRENT={i}
            {% endif %}
        {% endif %}
        SAVE_GCODE_STATE NAME=_tc_latch
        M83
        M220 S100
        M221 S100
        {% if printer[ext].can_extrude %}
            # Kalico refuses one extrude-only move longer than
            # max_extrude_only_distance (50 mm by default; the 65 mm unload
            # pull stopped with "Extrude only move too long"):
            # a longer move goes as equal parts back to back
            {% set lim = (cfg[ext].max_extrude_only_distance|default(50.0) if ext in cfg else 50.0)|float - 0.5 %}
            {% set parts = ((e|abs / lim)|round(0, 'ceil')|int) if lim > 0 and e|abs > lim else 1 %}
            {% if parts == 1 %}
            G1 E{e} F{f}
            {% else %}
            {% for _ in range(parts) %}
            G1 E{"%.4f"|format(e / parts)} F{f}
            {% endfor %}
            {% endif %}
        {% else %}
            INDX_LATCH_E E={e} F={f}
        {% endif %}
        RESTORE_GCODE_STATE NAME=_tc_latch
        {% if (i - run)|abs > 0.001 %}
            {% if fast %}
                INDX_TMC_AT CURRENT={run}
            {% else %}
                SET_TMC_CURRENT STEPPER=extruder CURRENT={run}
            {% endif %}
        {% endif %}
    {% else %}
        # INDX_EXTRUDER_MOVE drives the extruder stepper directly with the
        # min_extrude_temp check bypassed, and sets/restores TMC current around the
        # move. SPEED is in mm/s; the INDX constants use mm/min feedrates.
        INDX_EXTRUDER_MOVE DISTANCE={e} SPEED={f / 60.0} CURRENT={i}
    {% endif %}
    {% if ls %}_INDX_LATCH_SYNC MODE=restore{% endif %}

[gcode_macro _SET_MODE]
gcode:
    # 1. The speed mode's multipliers for INDX's own travel (tool change moves and limits)
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=mode VALUE='"{params.M}"'
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=accel_mult VALUE={params.A|float}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=speed_mult VALUE={params.S|float}

    # 2. Write Acoustic Modes to TMC Stepper Hardware (Global & Persistent)
    # 0 = StealthChop (Quiet/Hot), 1 = SpreadCycle (Loud/Powerful)
    # The field is driver specific: 2208/2209 use en_spreadcycle, while 2130/2240/5160
    # use en_pwm_mode with the inverted meaning (1 = StealthChop). Detected per stepper
    # so mixed driver and AWD (stepper_x1/y1) machines are all covered.
    {% set c = params.C|int %}
    {% set cfg = printer.configfile.settings %}
    {% set drivers = {"tmc2209": "en_spreadcycle", "tmc2208": "en_spreadcycle",
                      "tmc2240": "en_pwm_mode", "tmc2130": "en_pwm_mode",
                      "tmc5160": "en_pwm_mode"} %}
    {% set ns = namespace(found=false) %}
    {% for stepper in ["stepper_x", "stepper_x1", "stepper_y", "stepper_y1"] %}
        {% for prefix, field in drivers.items() %}
            {% if (prefix ~ " " ~ stepper) in cfg %}
                {% set ns.found = true %}
    SET_TMC_FIELD STEPPER={stepper} FIELD={field} VALUE={c if field == "en_spreadcycle" else 1 - c}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {% if not ns.found %}
    RESPOND MSG="INDX: no supported XY TMC driver found, speed mode set without changing StealthChop/SpreadCycle"
    {% endif %}
    # Restore extruder current to printer.cfg value (ensures mode switch doesn't leave wrong current)
    _RESTORE_EXTRUDER_CURRENT

    # 3. Save to disk so the INIT_STATE macro restores it on reboot
    SAVE_VARIABLE VARIABLE=tc_mode VALUE='"{params.M}"'

[gcode_macro MODE_STEALTH]
description: Tool changes at 20 % speed and acceleration, XY drivers in StealthChop. Moves: nothing. Saves: tc_mode
gcode: _SET_MODE M=stealth A=0.2 S=0.2 C=0

[gcode_macro MODE_NORMAL]
description: Recommended, lagom (Swedish for just right): tool changes at 70 % speed and acceleration, XY drivers in SpreadCycle. Moves: nothing. Saves: tc_mode
gcode: _SET_MODE M=normal A=0.7 S=0.7 C=1

[gcode_macro MODE_SPORT]
description: Tool changes at full speed and acceleration, XY drivers in SpreadCycle. Moves: nothing. Saves: tc_mode
gcode: _SET_MODE M=sport A=1.0 S=1.0 C=1

[gcode_macro MODE_RACE]
description: Tool changes at full speed with the slow safety checks off (no seat check, no park check, no latch homing after a park, a fixed lock). For tuned, proven machines only. Asks first every time (CONFIRM=1 after the warning). Moves: nothing. Saves: tc_mode
# Like a car's race mode: the driving aids are off. What it skips and what
# it keeps is listed at _INDX_RACE_GATE. Every time it is turned on it warns
# first; RESTORE=1 is INIT_STATE bringing it back after a restart.
gcode:
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% if params.CONFIRM|default(0)|int or params.RESTORE|default(0)|int %}
        _INDX_PROMPT_END
        _SET_MODE M={v.race_mode} A=1.0 S=1.0 C=1
        RESPOND MSG="INDX ok Race mode is on{' (restored after a restart)' if params.RESTORE|default(0)|int else ''}: tool changes run without the seat check, the park check and the latch homing. A tool that did not seat, or one left on the head or in its dock, is not noticed and can crash into a dock or the print. MODE_SPORT or MODE_NORMAL turns it off."
    {% else %}
        _INDX_PROMPT TITLE="Race Mode: Safety Checks Off" TEXT="Race mode changes tools at full speed and turns off the checks that make a tool change slow. For tuned machines whose tool changes have run many times without a fault only." TEXT2="Off: the seat check after a pickup, so a tool that did not seat is not noticed. The park check, so a tool left on the head or in its dock is not noticed. The latch homing after a park and the sensed lock (a fixed lock instead)." TEXT3="A missed pickup or park is not caught: the head or a tool can crash into a dock or into the print." TEXT4="Kept: the travel routes, the unlock dance, the heater off at the dock, latch homing when the latch position is unknown. G28, calibrations and tests always run every check. A stop switches back to normal." B1="Turn race mode on|MODE_RACE CONFIRM=1|error" F1="Cancel|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_RACE_GATE]
description: Inner - at the start of a tool change or park: does race mode apply to this one (race_now)? Only in normal use; G28, calibrations, tests, slow changes and the dock tools run every check
# Race mode skips: at the park the load cell dwells, the park check and the
# latch homing (one blind latch move instead); at the pickup the empty-head
# dwell, the sensed force lock (a fixed lock instead), the seat settle and the
# seat check. Kept: dock and clearance checks, travel routes, heater off at the
# dock, the dance, latch homing when its position is unknown, the retraction
# guard, the slow first contact with a new dock. [EL-TC-070]
gcode:
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set ns = namespace(why="") %}
    {% if v.mode|string|lower == v.race_mode %}
        {% set fine = printer["gcode_macro INDX_CAL_DOCK_Y_FINE"].left|int if "gcode_macro INDX_CAL_DOCK_Y_FINE" in printer else 0 %}
        {% set indock = printer["gcode_macro _INDX_INDOCK"].left|int if "gcode_macro _INDX_INDOCK" in printer else 0 %}
        {% set cz = printer["gcode_macro _CZ_STATE"].running|int if "gcode_macro _CZ_STATE" in printer else 0 %}
        {% set cal = svv.indx_cal|default({}) %}
        {% set running = cal.running|default("")|string if cal is mapping else "" %}
        # Every change follows the mode except G28 and its fetch, slow changes,
        # the tool change test and measuring calibrations [EL-TC-017]
        {% set follows = ["Unload", "Cold pull", "Clog watch test", "Heater calibration", "Soak curve"] %}
        {% set ns2 = namespace(follow=false) %}
        {% for p in follows %}{% if running.startswith(p) %}{% set ns2.follow = true %}{% endif %}{% endfor %}
        {% if v.homing_busy|int %}
            {% set ns.why = "homing (G28), and its fetch of the reference tool" %}
        {% elif v.slow|int %}
            {% set ns.why = "a slow tool change (a newly measured dock, or SLOW=1)" %}
        {% elif v.race_block|int %}
            {% set ns.why = "a tool change test or a calibration" %}
        {% elif running and not ns2.follow %}
            {% set ns.why = "a setup or calibration step is running (" ~ running ~ ")" %}
        {% elif cz or fine > 0 or indock > 0 or ("gcode_macro _INDX_LOCK_FORCE" in printer and printer["gcode_macro _INDX_LOCK_FORCE"].cal_left|int > 0) or ("gcode_macro _INDX_LOCK_PAST" in printer and printer["gcode_macro _INDX_LOCK_PAST"].full_left|int > 0) or printer["gcode_macro _INDX_SEAT_CHECK"].allow_short|int > 0 %}
            {% set ns.why = "a calibration" %}
        {% endif %}
        {% if ns.why %}
            RESPOND MSG="INDX > Race mode not used for this tool change: {ns.why}. Every check runs."
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_now VALUE={0 if ns.why else 1}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_now VALUE=0
    {% endif %}

[gcode_macro _INDX_RACE_DROP]
description: Inner - a stop fired during a race mode tool change: switch to normal speed with every check, and say so (stays normal until MODE_RACE again)
gcode:
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=0
    {% if v.race_now|int %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_now VALUE=0
        {% if v.mode|string|lower == v.race_mode %}
            MODE_NORMAL
            RESPOND TYPE=error MSG="INDX: switched from race to normal tool change speed, with every check on, because a tool change stopped. It stays normal, also after a restart, until you run MODE_RACE again."
            _INDX_LCD LEVEL=action MSG="Race mode off: MODE_RACE to restore"
        {% endif %}
    {% endif %}

#####################################################################
#  3. DYNAMIC MOTION HELPERS
#####################################################################

[gcode_macro _INDX_TO_LANE]
description: Inner - if the head is behind the clearance line (on the dock side), move straight out in Y to it, nothing else. Called before every travel that may start at a dock or a station (camera, prime bucket, XY sensor)
# Rule: behind the clearance line the head goes straight out in Y first; a
# diagonal crosses the docked tools [EL-TC-018]. Keeps G90/G91 and offsets;
# does nothing with Y unhomed or the head on the print side.
gcode:
    {% if printer["gcode_macro TOOL_POSITIONS"].clearance_y is not number %}
        # clearance_y "auto": resolve it first (renders before the move below)
        _INDX_BUILD_TOOLS
    {% endif %}
    # Inside a station (an extension, [indx_station] guard:) where a straight Y move goes through its frame: the station's guard stops instead
    # calls: (the guards registered in _INDX_STATIONS.guards)
    {% for g in (printer["gcode_macro _INDX_STATIONS"].guards if "gcode_macro _INDX_STATIONS" in printer else []) %}
        {g}
    {% endfor %}
    _INDX_TO_LANE_GO
    # Any travel from here on leaves the camera: camera off
    {% if "gcode_macro _INDX_CAM_AWAY" in printer %}
        _INDX_CAM_AWAY
    {% endif %}

[gcode_macro _INDX_TO_LANE_GO]
description: Inner - the move of _INDX_TO_LANE
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% if "y" in printer.toolhead.homed_axes and tp.clearance_y is number %}
        {% set clear = tp.clearance_y|float %}
        {% set y = printer.toolhead.position.y|float %}
        {% if (y - clear) * tp.dock_dir|float > 0.001 %}
            {% if printer["gcode_macro _INDX_CONSOLE"].detail|default(False) %}
            RESPOND MSG="INDX: head at Y{'%.2f'|format(y)}, behind the clearance line: straight out to Y{'%.2f'|format(clear)} first"
            {% endif %}
            SAVE_GCODE_STATE NAME=_indx_to_lane
            G90
            _TC_G0 Y={"%.3f"|format(clear - printer.gcode_move.homing_origin.y|float)}
            RESTORE_GCODE_STATE NAME=_indx_to_lane
        {% endif %}
    {% endif %}

[gcode_macro _TC_G0]
description: Inner - a tool change travel move at the speed mode's share of max_velocity (20 % while slow is set: first contact with a newly measured dock)
gcode:
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set mult = v.slow_mult|float if v.slow|default(0)|int else v.speed_mult|float %}
    {% set final_f = (printer.configfile.settings.printer.max_velocity * 60 * mult) %}
    G0 {% if 'X' in params %}X{params.X} {% endif %}{% if 'Y' in params %}Y{params.Y} {% endif %}{% if 'Z' in params %}Z{params.Z} {% endif %}F{params.F|default(final_f)|int}

[gcode_macro _LINEAR_EXIT]
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set restore_z = params.RESTORE_Z|default(0)|float %}

    # Stop short of the line by a Y offset toward the docks, so the offset
    # move after the exit (MOVE=1) lands on the line [EL-TC-019]
    {% set off_y = params.OFF_Y|default(0.0)|float %}
    {% set clearance_y = tp.clearance_y|float - tp.dock_dir|float * [tp.dock_dir|float * off_y, 0.0]|max %}

    # 1. Gentle peel off the docking pins (relative move)
    G91
    # Write this as 0 - (x). A bare minus straight after the opening brace is read
    # as Jinja whitespace control, which silently swallows the negation.
    G1 Y{0 - (tp.dock_dir * c.peel_distance)} F{c.peel_feedrate}

    # 2. Sprint to the clearance line, then drop Z: separate moves, so Z never
    #    descends while XY travels over the part. They run in order: no M400.
    G90
    _TC_G0 Y={"%.3f"|format(clearance_y)}
    {% if restore_z > 0 %}
        _TC_G0 Z={restore_z}
    {% endif %}

#####################################################################
#  4. THE DECOUPLED DOCKING DANCE
#####################################################################

[gcode_macro _SYNC_UNLOCK_DANCE]
description: Wiggle unlock sequence. Requires DOCK_Y parameter.
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set dock_y = params.DOCK_Y|float %}
    {% set trigger_y = dock_y - tp.dock_dir * printer["gcode_macro _INDX_CONSTANTS"].magnet_offset|float %}
    # A slow change (a newly measured dock, or SLOW=1): the Y moves at slow_dock_mult
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set fm = v.slow_dock_mult|default(0.5)|float if v.slow|default(0)|int else 1.0 %}

    # Latch (E) moves go through _TC_LATCH_MOVE: queued in order with the Y
    # moves, or INDX_EXTRUDER_MOVE when the extruder refuses cold moves. Each
    # latch nudge runs before its paired Y move.
    _TC_SET_ROTATION_DIST
    G90

    # 1. Squeeze release (soft current)
    _TC_LATCH_MOVE E={c.squeeze_e} F={c.squeeze_feedrate} I={c.squeeze_current}
    G1 Y{"%.3f"|format(trigger_y + tp.dock_dir * c.squeeze_depth)} F{(c.squeeze_feedrate * fm)|int}

    # 2. Wiggle In → Wiggle Out → Dock (latch nudge first, then Y approach)
    _TC_LATCH_MOVE E={c.wiggle_in_e} F={c.squeeze_feedrate} I={c.run_current}
    G1 Y{"%.3f"|format(trigger_y + tp.dock_dir * c.wiggle_in_depth)} F{(c.squeeze_feedrate * fm)|int}
    _TC_LATCH_MOVE E={c.wiggle_out_e} F={c.wiggle_feedrate} I={c.run_current}
    G1 Y{"%.3f"|format(trigger_y + tp.dock_dir * c.wiggle_out_depth)} F{(c.wiggle_feedrate * fm)|int}
    G1 Y{"%.3f"|format(dock_y)} F{(c.dock_feedrate * fm)|int}

    # 3. Final stationary open (runs after the slide to the dock has finished).
    # OPEN_E: a shorter open when the park knows the latch is still in mesh.
    # NO_OPEN=1: none (a pickup with the latch unknown homes it instead)
    {% if not params.NO_OPEN|default(0)|int %}
        _TC_LATCH_MOVE E={params.OPEN_E|default(c.full_open_e)} F={c.latch_fast_feedrate if "OPEN_E" in params else c.latch_feedrate} I={c.run_current}
    {% endif %}
    _TC_RESTORE_ROTATION_DIST

#####################################################################
#  5. THE ORCHESTRATION MACROS
#####################################################################

[gcode_macro _INDX_CHECK_CLEARANCE]
description: Inner - refuse to home or change tools if clearance_y is closer than tool_clearance_depth (TOOL_POSITIONS, default 26 mm) to the most protruding dock
# Rule [EL-TC-018]: clearance_y at least tool_clearance_depth from the most
# protruding dock, away from the docks (a stock tool needs 25 mm, 26 keeps 1 in
# hand). Dock exits, travel between docks and the X home run along it: too
# close drives a tool into the docked tools. min_dock_clearance: fallback
# without tool_clearance_depth. Callers run _INDX_BUILD_TOOLS first.
variable_min_dock_clearance: 26.0
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set min_dock_clearance = tp.tool_clearance_depth|default(min_dock_clearance)|float %}
    {% if tp.clearance_y is string %}
        _INDX_RAISE MSG="INDX is still starting up (clearance_y not resolved yet). Try again in a few seconds."
    {% else %}
    {% set ns = namespace(gap=999.0, tool=-1, dy=0.0) %}
    {% for i in range(tp.tool_count|int) %}
        {% set dy = (svv.get("t%d_dock_y" % i) if svv.get("t%d_dock_y" % i) is not none else (tp.tools[i].dock_y if i < tp.tools|default([])|length else tp["t%d_dock_y" % i]|default(tp.t0_dock_y|default(0))))|float %}
        {% set gap = (dy - tp.clearance_y|float) * tp.dock_dir|float %}
        {% if gap < ns.gap %}
            {% set ns.gap = gap %}
            {% set ns.tool = i %}
            {% set ns.dy = dy %}
        {% endif %}
    {% endfor %}
    {% if ns.gap < min_dock_clearance|float - 0.001 %}
        {% set need = ns.dy - tp.dock_dir|float * min_dock_clearance|float %}
        _INDX_LCD LEVEL=warn MSG="clearance_y too close to T{ns.tool} dock"
        _INDX_RAISE MSG="{'INDX: clearance_y %.3f is only %.2f mm from the T%d dock (dock_y %.3f), it must be at least %.1f mm: clearance_y %.3f or further from the docks. INDX_SET_CLEARANCE AUTO=1 sets it from the docks, or set clearance_y in indx.cfg. No homing or tool change until then.' % (tp.clearance_y|float, ns.gap, ns.tool, ns.dy, min_dock_clearance|float, need)}"
    {% endif %}
    # With docks toward Y min (dock_dir < 0) the clearance line must be at or below
    # Y 0, otherwise the slicer can reach the docked tools. Outside the setup this
    # is a warning only; a hard stop lives in INDX_SET_CLEARANCE. [EL-SET-045]
    {% if tp.dock_dir|float < 0 and tp.clearance_y|float > 0 %}
        RESPOND TYPE=error MSG="INDX ! clearance_y {'%.3f'|format(tp.clearance_y|float)} is above Y 0: the slicer can reach the docked tools. Shift the bed in [stepper_y] to bring the docks below Y 0, then run INDX_SET_CLEARANCE AUTO=1."
    {% endif %}
    # G39: warn about dock coordinates outside the axis or within 2 mm of a limit.
    # Warning only, no stop; callers run _INDX_BUILD_TOOLS before this macro.
    {% set th = printer.toolhead %}
    {% for i in range(tp.tool_count|int) %}
        {% set dx = svv.get("t%d_dock_x" % i) %}
        {% set dy = svv.get("t%d_dock_y" % i) %}
        {% if dx is not none %}
            {% set dx = dx|float %}
            {% if dx < th.axis_minimum.x|float or dx > th.axis_maximum.x|float %}
                RESPOND TYPE=error MSG="INDX ! T{i} dock X {'%.2f'|format(dx)} is outside the X axis ({'%.1f'|format(th.axis_minimum.x)} to {'%.1f'|format(th.axis_maximum.x)} mm). Remeasure the dock with the tool inside the axis, or widen position_min/position_max in [stepper_x]."
            {% elif dx < th.axis_minimum.x|float + 2.0 or dx > th.axis_maximum.x|float - 2.0 %}
                RESPOND TYPE=error MSG="INDX ! T{i} dock X {'%.2f'|format(dx)} is within 2 mm of an X axis limit. Consider widening position_min/position_max in [stepper_x] or remeasuring."
            {% endif %}
        {% endif %}
        {% if dy is not none %}
            {% set dy = dy|float %}
            {% if dy < th.axis_minimum.y|float or dy > th.axis_maximum.y|float %}
                RESPOND TYPE=error MSG="INDX ! T{i} dock Y {'%.2f'|format(dy)} is outside the Y axis ({'%.1f'|format(th.axis_minimum.y)} to {'%.1f'|format(th.axis_maximum.y)} mm). Remeasure the dock with the tool inside the axis, or widen position_min/position_max in [stepper_y]."
            {% elif dy < th.axis_minimum.y|float + 2.0 or dy > th.axis_maximum.y|float - 2.0 %}
                RESPOND TYPE=error MSG="INDX ! T{i} dock Y {'%.2f'|format(dy)} is within 2 mm of a Y axis limit. Consider widening position_min/position_max in [stepper_y] or remeasuring."
            {% endif %}
        {% endif %}
    {% endfor %}
    {% endif %}

[gcode_macro _INDX_CHECK_DOCKS]
description: Inner - refuse to drive into a dock that was never measured. TOOLS=<n,n>: the docks this move uses. FOR=home for the G28 wording
# Measured: t<n>_dock_x and _y in variables.cfg. docks_calibrated: True (or
# missing) in indx.cfg accepts every indx.cfg dock. A dock with no position at
# all is always refused.
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set svv = printer.save_variables.variables %}
    {% set trust_cfg = tp.docks_calibrated|default(True) %}
    {% if true %}
        {% set want = params.TOOLS|default("")|string %}
        {% set want = want.split(",")|map("trim")|select|map("int")|select(">=", 0)|list %}
        {% set ns = namespace(bad=-1) %}
        {% for i in want %}
            {% set saved = svv.get("t%d_dock_x" % i) is not none and svv.get("t%d_dock_y" % i) is not none %}
            {% set in_cfg = ("t%d_x" % i) in tp and tp.get("t%d_dock_y" % i) is not none %}
            {% if ns.bad < 0 and not saved and not (in_cfg and trust_cfg) %}
                {% set ns.bad = i %}
            {% endif %}
        {% endfor %}
        {% if ns.bad >= 0 %}
            {% set t = ns.bad %}
            {% if params.FOR|default("") == "home" %}
                {% set msg = "INDX: the T%d dock is not measured yet, so G28 will not drive into it (the indx.cfg position is a placeholder). Put T%d (the reference tool) on the head by hand and run INDX_SEAT_TOOL_BY_HAND TOOL=%d, then G28. Measure the docks with INDX_CAL_DOCK TOOL=<n> (or INDX_SETUP)." % (t, svv.ref_tool|default(0)|int, svv.ref_tool|default(0)|int) %}
            {% else %}
                {% set msg = "INDX: the T%d dock is not measured yet, so tool changes and parking that use it are refused (the indx.cfg position is a placeholder). Measure it with INDX_CAL_DOCK TOOL=%d (or INDX_SETUP). If every dock in indx.cfg is right, set docks_calibrated: True there and RESTART." % (t, t) %}
            {% endif %}
            _INDX_LCD LEVEL=action MSG="Dock T{t} not measured yet"
            _INDX_RAISE MSG="{msg}"
        {% endif %}
    {% endif %}

[gcode_macro _INDX_DOCK_CONTACT]
description: Inner - TOOL=n was picked up from or parked in its dock: a newly measured dock is no longer new (back to full speed)
gcode:
    {% set t = params.TOOL|int %}
    {% if printer.save_variables.variables["t%d_dock_new" % t]|default(0)|int %}
        SAVE_VARIABLE VARIABLE=t{t}_dock_new VALUE=0
        RESPOND MSG="INDX ok T{t} dock: first contact went fine, tool changes there run at normal speed from now on"
    {% endif %}

[gcode_macro _INDX_MODE_LIMITS]
description: Inner - velocity and acceleration for INDX's own travel outside the dock moves (the purge station, the way back over a front purge lane): the speed mode's share of [printer] max_velocity / max_accel (stealth 20 %, normal 70 %, sport and race 100 %); slow_mult while a slow change runs. The caller restores the limits it found
gcode:
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set cp = printer.configfile.settings.printer %}
    {% set slow = v.slow|default(0)|int %}
    {% set mv = v.slow_mult|float if slow else v.speed_mult|float %}
    {% set ma = v.slow_mult|float if slow else v.accel_mult|float %}
    SET_VELOCITY_LIMIT VELOCITY={cp.max_velocity|float * mv} ACCEL={cp.max_accel|float * ma}

[gcode_macro _INDX_SLOW_SET]
description: Inner - slow tool change moves on (SLOW=1) or off; with SLOW=1 also caps velocity and acceleration at slow_mult
gcode:
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% if params.SLOW|default(0)|int %}
        {% set max_v = printer.configfile.settings.printer.max_velocity %}
        {% set max_a = printer.configfile.settings.printer.max_accel %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=slow VALUE=1
        SET_VELOCITY_LIMIT VELOCITY={max_v * v.slow_mult|float} ACCEL={max_a * v.slow_mult|float}
        RESPOND MSG="INDX > {params.WHY|default('Slow tool change')}: {(v.slow_mult|float * 100)|int} % speed"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=slow VALUE=0
    {% endif %}

[gcode_macro _INDX_SET_ACTIVE_TOOL]
description: Inner - save active_tool (TOOL=<n>, or -1 for an empty head) and mark that tool active on the T<n> macros for Mainsail and Fluidd
# Every write of active_tool goes through here, so the tool buttons show what
# INDX saved [EL-TC-015]. A T<n> macro is touched only when it declares
# variable_active: SET_GCODE_VARIABLE raises on an undeclared one.
gcode:
    {% set t = params.TOOL|int %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    SAVE_VARIABLE VARIABLE=active_tool VALUE={t}
    {% set own = "indx_api" in printer and printer.indx_api.modes.tool_commands == "tool_manager" %}
    {% for i in range(tp.tool_count|int) if not own %}
        {% set name = "gcode_macro T" ~ i %}
        {% if name in printer and printer[name].active is defined %}
            SET_GCODE_VARIABLE MACRO=T{i} VARIABLE=active VALUE={True if i == t else False}
        {% endif %}
    {% endfor %}
    # The heater model's filament follows the tool on every path (pickup, by
    # hand, restart): a stale one can trip Kalico's model check [EL-TC-020]
    {% if t >= 0 and "gcode_macro _APPLY_TOOL_FILAMENT" in printer %}
        _APPLY_TOOL_FILAMENT TOOL={t}
    {% endif %}
    # Extension API: every change of active_tool (inside a change held to its next fire point)
    {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=tool_state TOOL={t}{% endif %}

[gcode_macro _INDX_CHANGE_START]
description: Inner - start of CHANGE_TOOL or PARK_TOOL: forget readings and modes an earlier change left behind
# A park check's empty-head reading is for the same change only. A change that
# died outside _INDX_RAISE leaves race mode and speed limits on. [EL-TC-021]
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_from_park VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_valid VALUE=0
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% if v.change_busy|default(0)|int %}
        RESPOND TYPE=error MSG="INDX: the last tool change did not finish: back to normal tool change mode and the printer's speed limits"
        _INDX_RACE_DROP
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_now VALUE=0
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=change_busy VALUE=0
    {% endif %}

[gcode_macro _INDX_Z_APPLIED]
description: Inner - record the live Z offset INDX just applied (Z=), so the tool change Z sync carries only a user babystep
gcode:
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=applied_z VALUE={params.Z|float}

[gcode_macro _INDX_TC_MARK]
description: Inner - the saved marker of a tool change in progress (ON=1 at its start, before any motion; ON=0 at its end)
# The saved state can be ahead of or behind the motion: a restart with the
# marker set makes INDX ask before moving [EL-TC-022]. ON=1 is written at once
# (INDX_SAVE_NOW); ON=0 like any save.
gcode:
    {% if params.ON|int %}
        {% if "indx_tc_fast" in printer %}
            INDX_SAVE_NOW VARIABLE=tc_busy VALUE=1
        {% else %}
            SAVE_VARIABLE VARIABLE=tc_busy VALUE=1
        {% endif %}
    {% else %}
        SAVE_VARIABLE VARIABLE=tc_busy VALUE=0
    {% endif %}

[gcode_macro _INDX_CHECK_SUSPECT]
description: Inner - refuse to move while a failed pickup or park may have left a tool half seated or loose on the head (saved variable seat_suspect)
# seat_suspect (saved, set by _PICKUP_SEAT_FAIL and _INDX_PARK_HANG_CHECK): a
# tool may be loose on the head. Any move could drive it into a dock or probe Z with it, so G28 Z,
# CHANGE_TOOL and PARK_TOOL refuse until a by-hand command or a passed seat
# check clears it. [EL-TC-023]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set t = svv.seat_suspect|default(-1)|int %}
    {% if svv.tc_busy|default(0)|int and not printer["gcode_macro _TOOLCHANGE_VARS"].change_busy|int %}
        # a tool change was cut off by a shutdown, power loss or crash
        {% set act = svv.active_tool|default(-1)|int %}
        _INDX_LCD LEVEL=warn MSG="Tool change cut off: check the head"
        _INDX_RAISE MSG="A tool change was cut off (shutdown, power loss or crash), so the saved tool and latch state may be wrong (INDX has {('T%d on the head' % act) if act >= 0 else 'the head empty'}). Look at the head and the docks first. A tool fully on and locked: INDX_SEAT_TOOL_BY_HAND TOOL=n LOCKED=1. Head empty: INDX_RELEASE_TOOL_BY_HAND (opens the latch) or, with the latch already open, INDX_FORGET_TOOL. Then try again."
    {% elif t >= 0 %}
        _INDX_LCD LEVEL=warn MSG="T{t} may be on the head: check"
        _INDX_RAISE MSG="T{t} may be half seated or loose on the head after a failed pickup or park. Look at the head first. T{t} fully on and locked: INDX_SEAT_TOOL_BY_HAND TOOL={t} LOCKED=1 (loose on the head: FORCE=1 locks it). Head empty, or take T{t} off by hand: INDX_RELEASE_TOOL_BY_HAND. Then try again."
    {% endif %}

# The INDX tool change. Its public name CHANGE_TOOL is not a macro: a tool
# manager (AFC) registers CHANGE_TOOL itself, so INDX only adds it when the
# name is free (indx_api.py at klippy:ready; INDX Macros: indx_macros_only.cfg).
# INDX's own callers (T<n>, PRINT_TOOLCHANGE, INDX_CHANGE_TOOL, the setup and
# calibration) always call _INDX_CHANGE_TOOL. [EL-API-005]
[gcode_macro _INDX_CHANGE_TOOL]
description: Inner - the INDX tool change behind CHANGE_TOOL. Change to TOOL=n: park the tool on the head, pick up n, apply its offsets, heat to TEMP= if given. Needs: measured docks (homes first if needed). Moves: the head to the docks and back. Saves: active_tool, global_z_offset
gcode:
    {% if 'TOOL' not in params %}
        {action_raise_error("CHANGE_TOOL requires TOOL=<n> (or use T0/T1/...).")}
    {% endif %}
    _INDX_INIT_GATE CMD=CHANGE_TOOL
    {% set t = params.TOOL|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    # Effective docks and clearance first (measured docks, clearance_y auto)
    _INDX_BUILD_TOOLS
    _INDX_CHECK_DOCKS TOOLS={t}{(',%d' % act) if act >= 0 and act != t else ''}
    _INDX_CHECK_CLEARANCE
    _INDX_CHECK_SUSPECT
    _INDX_CHANGE_START
        {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}

        # Bounds check
        {% if t < 0 or t >= tp.tool_count|int %}
            {action_raise_error("T%d is not configured. %d tools available (T0 to T%d)."
                % (t, tp.tool_count|int, tp.tool_count|int - 1))}
        {% endif %}

    # Home here, not inside the swap: homing fetches the reference tool and
    # changes active_tool after this template rendered. _CHANGE_TOOL_APPLY
    # renders after the homing and sees the tool really on the head.
    {% set busy = printer["gcode_macro _TOOLCHANGE_VARS"].homing_busy|default(0)|int %}
    {% if not busy and "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if "indx_dock_sensor" in printer %}_INDX_DSENS_BEFORE_CHANGE TOOL={t} TEMP={params.TEMP|default(-1)}{% endif %}
    _CHANGE_TOOL_APPLY TOOL={t} TEMP={params.TEMP|default(-1)} COLD={params.COLD|default(0)|int} SKIP_Z_CORRECTION={params.SKIP_Z_CORRECTION|default(0)|int} SLOW={params.SLOW|default(0)|int}

[gcode_macro _CHANGE_TOOL_APPLY]
description: Inner - perform the swap. Split from CHANGE_TOOL so active_tool is read after any homing has run, not before.
gcode:
    {% set t = params.TOOL|int %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set temp_param_top = params.TEMP|default(-1)|float %}
    {% if temp_param_top > printer["gcode_macro _INDX_CONSTANTS"].nozzle_max_temp|default(300)|float %}
        {action_raise_error("CHANGE_TOOL: TEMP=%.0f is over the INDX nozzle's rating of %d C." % (temp_param_top, printer["gcode_macro _INDX_CONSTANTS"].nozzle_max_temp|default(300)|int))}
    {% endif %}
    {% if "indx_dock_sensor" in printer and printer.indx_dock_sensor.hold|int %}
        # A dock sensor check held the print before this change moved
        # (_INDX_DSENS_STOP): nothing runs, RESUME redoes the change
    {% elif act != t %}
        # Homing may have changed the tool on the head since CHANGE_TOOL
        # checked: check the docks this swap really uses
        _INDX_CHECK_DOCKS TOOLS={t}{(',%d' % act) if act >= 0 else ''}
        {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=before_change FROM={act} TO={t}{% endif %}
        # A change in progress (cleared at its end): a change that dies on an
        # error is noticed by the next one (_INDX_CHANGE_START) [EL-TC-021]
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=change_busy VALUE=1
        # no pressure advance from the park to the hand-back [EL-TC-076]
        _INDX_PA_HOLD OWNER=change
        # the pickup position check may park and pick up once [EL-TC-077]
        SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=repicked VALUE=0
        # Saved before anything moves: a restart while it is set (shutdown,
        # power loss, crash) asks before any motion (_INDX_CHECK_SUSPECT)
        _INDX_TC_MARK ON=1
        # timings for the telemetry (the motion's own print time, no waits)
        {% if "indx_clog" in printer %}INDX_TC_EVENT PHASE=start FROM={act} TO={t}{% endif %}
        # 1. Save live slicer motion limits
        {% set live_vel = printer.toolhead.max_velocity %}
        {% set live_acc = printer.toolhead.max_accel %}

        # 2. Force Klipper to use raw printer.cfg maximums (scaled by TC mode)
        {% set max_v = printer.configfile.settings.printer.max_velocity %}
        {% set max_a = printer.configfile.settings.printer.max_accel %}
        {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
        SET_VELOCITY_LIMIT VELOCITY={max_v * v.speed_mult} ACCEL={max_a * v.accel_mult}
        # First contact with a newly measured dock (or SLOW=1): 20 %
        {% set svv0 = printer.save_variables.variables %}
        {% set new_t = svv0["t%d_dock_new" % t]|default(0)|int %}
        {% set new_a = act >= 0 and svv0["t%d_dock_new" % act]|default(0)|int %}
        {% if params.SLOW|default(0)|int or new_t or new_a %}
            _INDX_SLOW_SET SLOW=1 WHY="{'First contact with a newly measured dock (T%d)' % (t if new_t else act) if (new_t or new_a) else 'Slow tool change'}"
        {% endif %}
        # Race mode for this change or not (renders after the slow set above)
        _INDX_RACE_GATE

        # 3. The incoming tool's target: TEMP= (its own), else the outgoing
        #    tool's. TEMP <= 0 (an empty slicer placeholder) counts as not
        #    given. no_heat_tools are never heated, whatever the slicer passes.
        {% set no_heat = t in tp.no_heat_tools|default([]) %}
        {% set temp_param = params.TEMP|default(-1)|float %}
        {% if temp_param > printer["gcode_macro _INDX_CONSTANTS"].nozzle_max_temp|default(300)|float %}
            {action_raise_error("CHANGE_TOOL: TEMP=%.0f is over the INDX nozzle's rating of %d C." % (temp_param, printer["gcode_macro _INDX_CONSTANTS"].nozzle_max_temp|default(300)|int))}
        {% endif %}
        #    COLD=1: picked up unheated (the caller heats it). The heater stays
        #    on here: queued print moves may still extrude; the park turns it
        #    off once they have finished. [EL-TC-024]
        {% set target_temp = 0.0 if no_heat or params.COLD|default(0)|int
            else (temp_param if temp_param > 0 else printer.extruder.target|float) %}
        {% if act < 0 %}
            # Nothing on the head to park, so nothing is extruding
            M104 S0
        {% endif %}
        
        # 4. Z sync: a babystep made while this tool printed goes into the
        #    global offset. Only the difference from what INDX applied counts;
        #    a reset to 0 or a jump is reported, not carried. [EL-TC-025]
        {% set svv = printer.save_variables.variables %}
        {% if act >= 0 %}
            {% set live_total_z = printer.gcode_move.homing_origin.z|float %}
            {% set tool_z = svv["t" ~ act ~ "_offset_z"]|default(0.0)|float %}
            {% set gz = svv.global_z_offset|default(0.0)|float %}
            {% set applied = printer["gcode_macro _TOOLCHANGE_VARS"].applied_z %}
            {% set expected = applied|float if applied is not none else tool_z + gz %}
            {% set delta = live_total_z - expected %}
            {% if live_total_z|abs < 0.0005 and expected|abs >= 0.0005 %}
                RESPOND TYPE=error MSG="INDX ! The live Z offset was reset to 0 while T{act} printed (INDX had set {'%.3f'|format(expected)}): not carried into the global Z offset, which stays {'%.3f'|format(gz)}."
            {% elif delta|abs > 0.5 %}
                RESPOND TYPE=error MSG="INDX ! The live Z offset moved {'%+.3f'|format(delta)} mm while T{act} printed, more than a babystep: not carried into the global Z offset, which stays {'%.3f'|format(gz)}."
            {% elif delta|abs >= 0.0005 %}
                SAVE_VARIABLE VARIABLE=global_z_offset VALUE='{"%.4f"|format(gz + delta)}'
                RESPOND MSG="INDX: babystep {'%+.3f'|format(delta)} mm carried into the global Z offset (now {'%.3f'|format(gz + delta)})"
            {% endif %}
        {% endif %}

        # 5. Z hop is blocking: Z clears before any XY travel and drops only
        #    after the Y sprint in _LINEAR_EXIT, so the nozzle never drags
        #    across the print.
        {% set zhop = tp.z_hop|float %}
        {% set restore_z = "0" if ("indx_api" in printer and printer.indx_api.return_none) else "%.3f"|format(printer.gcode_move.gcode_position.z) %}

        # 6. Physical tool swap
        {% if act != -1 %}
            PARK_TOOL ZHOP={zhop} CHANGE=1
            {% if "indx_clog" in printer %}INDX_TC_EVENT PHASE=parked{% endif %}
        {% endif %}

        # Pass ZHOP only when there was no park (act==-1), since PARK_TOOL has
        # already cleared Z otherwise. RESTORE_Z drives the drop back down.
        _PICKUP_TOOL TOOL={t} TARGET={target_temp} ZHOP={0.0 if act != -1 else zhop} RESTORE_Z={restore_z} SKIP_Z_CORRECTION={params.SKIP_Z_CORRECTION|default(0)|int}
        _INDX_PICKUP_POS_REPICK TOOL={t} TARGET={target_temp} RESTORE_Z={restore_z} SKIP_Z_CORRECTION={params.SKIP_Z_CORRECTION|default(0)|int}

        # 8. Restore extruder current to printer.cfg value: toolchange moves use
        #    c.run_current internally; this ensures normal printing current is correct.
        _RESTORE_EXTRUDER_CURRENT
        {% if ("indx_tc_fast" in printer and printer.indx_tc_fast.enabled) %}
            # a failed scheduled latch driver write stops the change here at the latest
            INDX_TMC_CHECK
        {% endif %}

        # 9. Restore live slicer motion limits so the print resumes correctly
        _INDX_SLOW_SET SLOW=0
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_now VALUE=0
        SET_VELOCITY_LIMIT VELOCITY={live_vel} ACCEL={live_acc}

        {% if "indx_clog" in printer %}INDX_TC_EVENT PHASE=done{% endif %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=change_busy VALUE=0
        _INDX_PA_RELEASE OWNER=change
        _INDX_TC_MARK ON=0
        {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=change_done{% endif %}
        # 10. The outgoing tool is parked: did the clog watch see it struggle?
        {% if act >= 0 and act != t %}
            _INDX_CLOG_GATE TOOL={act}
        {% endif %}
    {% elif params.TEMP|default(-1)|float > 0 and not params.COLD|default(0)|int and t not in tp.no_heat_tools|default([]) %}
        # Tool already on the head: no change, but TEMP still applies (RESUME
        # after a hold that turned its heater off) [EL-TC-026]
        M109 S{params.TEMP|float}
    {% endif %}

[gcode_macro PARK_TOOL]
description: Park the tool on the head in its dock. Needs: measured dock (homes first if needed). Moves: the head to the dock and back to clearance_y. Saves: active_tool -1
# Homing happens here, as in CHANGE_TOOL: _PARK_TOOL_APPLY renders after it
# and reads the tool really on the head. _INDX_HOME_FETCH_T0 calls the APPLY
# macro directly, so PARK_TOOL is never on the stack twice.
gcode:
    _INDX_INIT_GATE CMD=PARK_TOOL
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    _INDX_BUILD_TOOLS
    _INDX_CHECK_DOCKS TOOLS={act}
    _INDX_CHECK_CLEARANCE
    _INDX_CHECK_SUSPECT
    # Inside CHANGE_TOOL (CHANGE=1) the change itself is in progress: only a
    # standalone park starts afresh
    {% if not params.CHANGE|default(0)|int %}
        _INDX_CHANGE_START
    {% endif %}
    {% if act != -1 %}
        {% set busy = printer["gcode_macro _TOOLCHANGE_VARS"].homing_busy|default(0)|int %}
        {% if not busy and "xyz" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        _PARK_TOOL_SLOW_APPLY ZHOP={params.ZHOP|default(0.0)|float} SLOW={params.SLOW|default(0)|int} CHANGE={params.CHANGE|default(0)|int}
    {% endif %}

[gcode_macro _PARK_TOOL_SLOW_APPLY]
description: Inner - PARK_TOOL after any homing: slow (20 %) into a newly measured dock or with SLOW=1, then the park
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set slow = params.SLOW|default(0)|int or (act >= 0 and printer.save_variables.variables["t%d_dock_new" % act]|default(0)|int) %}
    {% set change = params.CHANGE|default(0)|int %}
    {% if not change %}{% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=before_change FROM={act} TO=-1{% endif %}{% endif %}
    # Already slow (a slow CHANGE_TOOL parks through here): that one restores
    {% if slow and not printer["gcode_macro _TOOLCHANGE_VARS"].slow|int %}
        {% set live_vel = printer.toolhead.max_velocity %}
        {% set live_acc = printer.toolhead.max_accel %}
        _INDX_SLOW_SET SLOW=1 WHY="{('Slow park of T%d' % act) if params.SLOW|default(0)|int else ('Parking T%d in a newly measured dock' % act)}"
        _INDX_RACE_GATE
        _PARK_TOOL_APPLY ZHOP={params.ZHOP|default(0.0)|float} CHANGE={change}
        _INDX_SLOW_SET SLOW=0
        SET_VELOCITY_LIMIT VELOCITY={live_vel} ACCEL={live_acc}
    {% else %}
        {% if not change %}
            # A park on its own (in a CHANGE_TOOL the gate has run already)
            _INDX_RACE_GATE
        {% endif %}
        _PARK_TOOL_APPLY ZHOP={params.ZHOP|default(0.0)|float} CHANGE={change}
    {% endif %}
    {% if not change %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_now VALUE=0
        {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=change_done{% endif %}
    {% endif %}

[gcode_macro _INDX_PARK_COOL]
description: Inner - park cooling (on by default): the part fan blows on a parked tool's nozzle so it stops oozing while it sits in its dock: less heat creep, ooze and loose filament. mode "blast" (default): the fan at full speed for blast_s seconds, whatever the material; "target": until the nozzle is down to a temperature from its material (Tg) or the chamber. where "dock" (default): in the dock, the fan on from the heater off or the dock arrival so the dance and the open run under it, and what is left of the time waited right before the head peels away; "station": at a set spot (an ooze stopper, part of a prime bucket) with the tool still on the head, before it goes to its dock. Settings on the Settings tab (INDX_SETTING MACRO=_INDX_PARK_COOL)
# enabled     on/off (a saved INDX_SETTING override wins) [EL-TC-027]
# mode        "blast": full fan for blast_s seconds, whatever the material.
#             "target": until the nozzle is at the target below or max_s is up
# blast_s     blast mode: seconds at full fan
# blast_start blast mode: "heater_off" (fan on at the park's heater off; the
#             dock or station waits only what is left) or "dock" (on arrival,
#             so the dance runs under it)
# blast_min_c blast mode: a nozzle cooler than this (C) is not blasted (nothing to ooze)
# fraction    target mode: share of the heat above the chamber to lose:
#             target = chamber + (1 - fraction) * (print temp - chamber)
# max_s       target mode: longest wait (s); the park then goes on anyway
# chamber     chamber temperature (C) when no sensor is named
# sensor      [temperature_sensor] or [heater_generic] name for the chamber; "" uses chamber
# min_above   the target never goes below chamber + this (C)
# settle_ms   wait after the fan is back before the head moves on (and the park
#             check reads); in the dock only when the park check reads after the exit
# where       "dock" or "station"
# station_x/_y/_z  the station spot (G-code coordinates, Z with the tool's Z
#             offset); station_z < 0: not set. Must be behind the clearance line
#             on the dock side and at least dock_min_dx in X from every dock,
#             else the dock is used. Per tool: INDX_SET_PARK_STATION
# station     "auto": the first ready registered [indx_station], else the spot;
#             a station's name: that one (not ready: the dock); "spot". A
#             registered station cools through its cool_enter / cool_leave, or
#             else on the clearance line in front of it. Never extrudes. [EL-TC-028]
variable_enabled: True
variable_mode: "blast"
variable_blast_s: 5
variable_blast_start: "heater_off"
variable_blast_min_c: 80
variable_fraction: 0.6
variable_max_s: 20
variable_chamber: 35.0
variable_sensor: ""
variable_min_above: 25.0
variable_settle_ms: 1000
variable_where: "dock"
# materials: glass transition (C), matched to t<n>_material exactly, then its
# first word (PLA-CF: PLA), then the longest prefix (PA12: PA). A known
# material cools to Tg * (1 + tg_above) [EL-TC-029], an unknown one by fraction.
variable_materials: {"PLA": 60, "PETG": 80, "PCTG": 80, "ABS": 105, "ASA": 100, "HIPS": 100, "PA": 70, "PC": 145, "PVA": 75}
variable_tg_above: 0.2
variable_station_x: 0.0
variable_station_y: 0.0
variable_station_z: -1.0
variable_station: "auto"
# last: the last park's cooling, for the console and the support log:
# [tool, from C, target C, reached C, seconds, reached 1/0]
variable_last: []
# blast_t0, blast_restore: an early blast (blast_start heater_off): when it
# started (print time) and the part fan speed to put back after it (0-255)
variable_blast_t0: -1.0
variable_blast_restore: 0
gcode:

[gcode_macro _INDX_PARK_COOL_WAIT]
description: Inner - park cooling, the head standing still (in the dock right before the peel, or at the station): the part fan at full speed for MAX= seconds (MODE=blast) or until the nozzle is at TARGET= (C) or MAX= seconds are up (MODE=target), then the fan back to its speed before the park and SETTLE= ms (0: none) before the head moves on. EARLY=1: the fan went on earlier (_INDX_PARK_BLAST_START at the heater off or the dock arrival), only the rest of MAX= is waited. TOOL= FROM= for the record
# Drains first: the head stands still for the whole wait, and a slicer M106
# just before the change is in the status (the speed restored after).
gcode:
    M400
    _INDX_PARK_COOL_RUN {rawparams}

[gcode_macro _INDX_PARK_COOL_RUN]
description: Inner - _INDX_PARK_COOL_WAIT after the drain: read the fan speed to restore, then cool
gcode:
    # the part fan as chosen in the hardware checks (a [fan_generic] by
    # name), else [fan]; neither readable (an M106 macro alone): off
    {% set mach = printer["gcode_macro _INDX_MACHINE"] if "gcode_macro _INDX_MACHINE" in printer else {} %}
    {% set pf = mach.part_fan|default("")|string %}
    {% set fo = printer["fan_generic " ~ pf] if pf and ("fan_generic " ~ pf) in printer else (printer.fan if "fan" in printer else none) %}
    {% set pk = printer["gcode_macro _INDX_PARK_COOL"] %}
    {% set blast = params.MODE|default("target") == "blast" %}
    # EARLY=1: the fan has blown since the heater off or the dock arrival
    # (_INDX_PARK_BLAST_START), which recorded the speed to put back; only the
    # rest of MAX= is left (blast: one dwell; target: the steps)
    {% set early = params.EARLY|default(0)|int and pk.blast_t0|default(-1)|float >= 0 %}
    {% set restore = pk.blast_restore|default(0)|int if early else ((fo.speed|default(0)|float if fo is not none else 0.0) * 255)|round|int %}
    {% set wait_s = [params.MAX|float - (printer.toolhead.estimated_print_time|float - pk.blast_t0|float), 0.0]|max if early else params.MAX|float %}
    {% set steps = (wait_s * 2)|int %}
    _INDX_PART_FAN S=255
    SET_GCODE_VARIABLE MACRO=_INDX_PARK_COOL VARIABLE=last VALUE="[{params.TOOL|int}, {params.FROM|float|round(1)}, {params.TARGET|float|round(1)}, 0.0, 0.0, 0]"
    # the steps count from the fan on: the time it already blew is in
    SET_GCODE_VARIABLE MACRO=_INDX_PARK_COOL_STEP VARIABLE=n VALUE={((params.MAX|float - wait_s) * 2)|round|int}
    {% if early %}
        SET_GCODE_VARIABLE MACRO=_INDX_PARK_COOL VARIABLE=blast_t0 VALUE=-1.0
    {% endif %}
    {% if blast %}
        # blast mode: full fan for MAX= seconds (counted from the heater off
        # when EARLY), no temperature reading
        {% if wait_s > 0.05 %}
            G4 P{(wait_s * 1000)|int}
            M400
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_INDX_PARK_COOL_STEP VARIABLE=n VALUE={(params.MAX|float * 2)|int}
    {% else %}
        {% for i in range(steps) %}
            _INDX_PARK_COOL_STEP TARGET={params.TARGET}
        {% endfor %}
    {% endif %}
    # the record and the support log line while the head still stands
    # still with nothing queued, then the fan back and the settle
    _INDX_PARK_COOL_DONE TARGET={params.TARGET} MAX={params.MAX} MAT={params.MAT|default("-")} CHAMBER={params.CHAMBER|default(0)} MODE={params.MODE|default("target")}
    _INDX_PART_FAN S={restore}
    # SETTLE=0 (in the dock with no park check reading after the exit): none
    {% if params.SETTLE|default(1000)|int > 0 %}
        G4 P{params.SETTLE|default(1000)|int}
    {% endif %}

[gcode_macro _INDX_PARK_BLAST_START]
description: Inner - park cooling: the part fan at full speed from the park's heater off (blast_start heater_off) or from the arrival at the dock (blast_start dock, target mode); records when (print time) and the speed to put back, for _INDX_PARK_COOL_WAIT EARLY=1
# Rendered after the heater off: the time is now (after its M400) or the end
# of the queue ([indx_tc_fast], no drain). The speed read here is put back after.
gcode:
    {% set mach = printer["gcode_macro _INDX_MACHINE"] if "gcode_macro _INDX_MACHINE" in printer else {} %}
    {% set pf = mach.part_fan|default("")|string %}
    {% set fo = printer["fan_generic " ~ pf] if pf and ("fan_generic " ~ pf) in printer else (printer.fan if "fan" in printer else none) %}
    {% set th = printer.toolhead %}
    SET_GCODE_VARIABLE MACRO=_INDX_PARK_COOL VARIABLE=blast_restore VALUE={((fo.speed|default(0)|float if fo is not none else 0.0) * 255)|round|int}
    SET_GCODE_VARIABLE MACRO=_INDX_PARK_COOL VARIABLE=blast_t0 VALUE={[th.estimated_print_time|float, th.print_time|default(0)|float]|max|round(3)}
    _INDX_PART_FAN S=255

[gcode_macro _INDX_PARK_BLAST_ABORT]
description: Inner - a park that stops before the dock after the early blast started (_INDX_PARK_BLAST_START): the part fan back to the speed recorded at the heater off, the blast cleared. Nothing when no blast runs
gcode:
    {% set pk = printer["gcode_macro _INDX_PARK_COOL"] %}
    {% if pk.blast_t0|default(-1)|float >= 0 %}
        _INDX_PART_FAN S={pk.blast_restore|default(0)|int}
        SET_GCODE_VARIABLE MACRO=_INDX_PARK_COOL VARIABLE=blast_t0 VALUE=-1.0
    {% endif %}

[gcode_macro _INDX_PARK_COOL_STEP]
description: Inner - one 0.5 s step of the park cooling, skipped once the nozzle is at TARGET=
variable_n: 0
gcode:
    {% if printer.extruder.temperature|float > params.TARGET|float %}
        G4 P500
        M400
        SET_GCODE_VARIABLE MACRO=_INDX_PARK_COOL_STEP VARIABLE=n VALUE={printer["gcode_macro _INDX_PARK_COOL_STEP"].n|int + 1}
    {% endif %}

[gcode_macro _INDX_PARK_COOL_DONE]
description: Inner - the park cooling ended: keep what it did (last: tool, from, target, reached, seconds, reached 1/0, material, chamber), write it to the support log (INDX Suite) and say so when the wait ran out before the target
gcode:
    {% set pc = printer["gcode_macro _INDX_PARK_COOL"] %}
    {% set l = pc.last %}
    {% set t = printer.extruder.temperature|float %}
    {% set secs = printer["gcode_macro _INDX_PARK_COOL_STEP"].n|int * 0.5 %}
    {% set blast = params.MODE|default("target") == "blast" %}
    # blast mode has no target: the blast itself is the result
    {% set ok = blast or t <= params.TARGET|float + 0.5 %}
    SET_GCODE_VARIABLE MACRO=_INDX_PARK_COOL VARIABLE=last VALUE="[{l[0]}, {l[1]}, {l[2]}, {t|round(1)}, {secs}, {1 if ok else 0}, '{params.MAT|default('-')}', {params.CHAMBER|default(0)|float}]"
    {% if "indx_clog" in printer %}
        INDX_SUPPORT_LOG PARKCOOL=1 TOOL={l[0]} MAT={params.MAT|default("-")} FROM={l[1]} TARGET={l[2]} REACHED={"%.1f"|format(t)} SECS={secs} OK={1 if ok else 0} CHAMBER={params.CHAMBER|default(0)} WHERE={printer["gcode_macro _INDX_PARK_COOL"].where} MODE={"blast" if blast else "target"}
    {% endif %}
    {% if not ok %}
        RESPOND MSG="INDX > Park cooling: T{l[0]} at {t|round(0)|int} C after {params.MAX|float|round(0)|int} s, target {l[2]|round(0)|int} C. Parked anyway (park cooling, max_s on the Settings tab)."
    {% endif %}

[gcode_macro _INDX_PARK_STOPPER_NOTE]
description: Inner - park cooling skipped for TOOL='s dock, which has an ooze stopper: one console line per dock and print (every park outside a print)
# A new print: INDX_PRINT_START clears said; without it, a print duration
# lower than the one last seen also means a new print
variable_said: []
variable_seen_s: 0.0
gcode:
    {% set t = params.TOOL|int %}
    {% set ps = printer.print_stats %}
    {% set inprint = ps.state|default("")|string in ["printing", "paused"] %}
    {% set dur = ps.print_duration|default(0)|float %}
    {% set me = printer["gcode_macro _INDX_PARK_STOPPER_NOTE"] %}
    {% set before = me.said|list if inprint and dur >= me.seen_s|float else [] %}
    {% if t not in before %}
        RESPOND MSG="INDX > Park cooling: skipped for T{t}, its dock has an ooze stopper{' (said once per print)' if inprint else ''}. No stopper in that dock? INDX_DOCK_STOPPER TOOL={t} ON=0, or the Tool library."
    {% endif %}
    {% if inprint %}
        SET_GCODE_VARIABLE MACRO=_INDX_PARK_STOPPER_NOTE VARIABLE=said VALUE="{(before + [t]) if t not in before else before}"
        SET_GCODE_VARIABLE MACRO=_INDX_PARK_STOPPER_NOTE VARIABLE=seen_s VALUE={dur|round(1)}
    {% endif %}

[gcode_macro INDX_SET_PARK_STATION]
description: Park cooling at a station: set the spot where a tool is cooled before it goes to its dock (an ooze stopper, part of a prime bucket). TOOL=n X= Y= Z= sets that tool's own spot, CLEAR=1 removes it (the common spot from the Settings tab is used then); HERE=1 takes the head's current X, Y and Z. Checked at every park: behind the clearance line on the dock side, inside the axes, at least 36 mm in X from every dock; else the tool is cooled in its dock. Moves: nothing. Saves: indx_park_station
gcode:
    {% if params.TOOL is not defined %}
        {action_raise_error("Usage: INDX_SET_PARK_STATION TOOL=<n> X= Y= Z= (or HERE=1, or CLEAR=1). The common spot is on the Settings tab (Park cooling).")}
    {% endif %}
    {% set t = params.TOOL|int %}
    {% set d = {} %}
    {% for k, v in (printer.save_variables.variables.indx_park_station|default({})).items() if k != t|string %}{% set _ = d.update({k: v}) %}{% endfor %}
    {% if params.CLEAR|default(0)|int %}
        SAVE_VARIABLE VARIABLE=indx_park_station VALUE="{d}"
        RESPOND MSG="INDX ok T{t}: no own park cooling station spot, the common one is used."
    {% else %}
        {% set g = printer.gcode_move.gcode_position %}
        {% set x = g.x|float if params.HERE|default(0)|int else params.X|default(-9999)|float %}
        {% set y = g.y|float if params.HERE|default(0)|int else params.Y|default(-9999)|float %}
        {% set z = g.z|float if params.HERE|default(0)|int else params.Z|default(-1)|float %}
        {% if x == -9999 or y == -9999 or z < 0 %}
            {action_raise_error("INDX_SET_PARK_STATION: give X=, Y= and Z= (0 or more), or HERE=1. Nothing saved.")}
        {% endif %}
        {% set _ = d.update({t|string: [x|round(3), y|round(3), z|round(3)]}) %}
        SAVE_VARIABLE VARIABLE=indx_park_station VALUE="{d}"
        RESPOND MSG="INDX ok T{t}: park cooling station X{'%.2f'|format(x)} Y{'%.2f'|format(y)} Z{'%.2f'|format(z)}. Used when park cooling is on and set to the station; each park checks it first."
    {% endif %}

[gcode_macro _INDX_PARK_STATION]
description: Inner - park cooling at the station: with the tool still on the head (latch locked, the heater already off), out to the clearance line, along it in X, straight in Y to the station, down to its Z, cool (_INDX_PARK_COOL_WAIT), back up to the travel height and straight back out to the clearance line. NAME= a registered station instead: its cool_enter, the wait, its cool_leave (zone checked before, the return to the clearance line after), or without them the clearance line at X=. Never extrudes. X= Y= Z= the spot, BACKZ= the travel height, TOOL= FROM= TARGET= MAX= SETTLE= for the wait
# _PARK_TOOL_APPLY checked the spot: the way in is beside the docks, never
# over the print or near a dock's activation line.
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set wait = "_INDX_PARK_COOL_WAIT TOOL=%s MAT=%s CHAMBER=%s FROM=%s TARGET=%s MAX=%s MODE=%s SETTLE=%s EARLY=%s" % (params.TOOL, params.MAT|default("-"), params.CHAMBER|default(0), params.FROM, params.TARGET, params.MAX, params.MODE|default("target"), params.SETTLE, params.EARLY|default(0)) %}
    {% set so = printer["indx_station " ~ params.NAME] if params.NAME and ("indx_station " ~ params.NAME) in printer else none %}
    {% if so is not none and so.cool_enter %}
        # the station's own way to its cooling point and back (its safe
        # path), checked like every station call
        _INDX_STATION_CHECK NAME={so.name}
        _INDX_TO_LANE
        {so.cool_enter} TOOL={params.TOOL}
        {wait}
        {so.cool_leave} TOOL={params.TOOL}
        _INDX_STATION_RETURN NAME={so.name}
    {% elif so is not none %}
        # no cooling point of its own: on the clearance line in front of it,
        # outside its frame, at the travel height the park reached
        _INDX_TO_LANE
        _TC_G0 X={params.X} Y={"%.3f"|format(tp.clearance_y|float)}
        {wait}
    {% else %}
        _INDX_TO_LANE
        _TC_G0 X={params.X} Y={"%.3f"|format(tp.clearance_y|float)}
        _TC_G0 Y={params.Y}
        _TC_G0 Z={params.Z}
        {wait}
        _TC_G0 Z={params.BACKZ}
        _TC_G0 Y={"%.3f"|format(tp.clearance_y|float)}
    {% endif %}

[gcode_macro _PARK_TOOL_APPLY]
description: Inner - the park itself. Split from PARK_TOOL so active_tool is read after any homing has run.
gcode:
    # the latch moves of this park are not extrusion: the clog watch skips them
    {% if "indx_clog" in printer %}INDX_CLOG_QUIET ON=1 REASON=park{% endif %}
    _INDX_PA_HOLD OWNER=park
    {% set st = printer["gcode_macro _TOOLCHANGE_VARS"].toolhead_state|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set zhop = params.ZHOP|default(0.0)|float %}
    # CHECK=0: skip the park check (the seat retry parks a tool that may not
    # be on the head at all). CHANGE=1: a pickup follows (CHANGE_TOOL)
    # Race mode (_INDX_RACE_GATE): no park check either
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set race = v.race_now|int and not v.homing_busy|int and not v.slow|int %}
    {% set check = params.CHECK|default(1)|int and not race %}
    {% set fast = ("indx_tc_fast" in printer and printer.indx_tc_fast.enabled) %}
    # Park cooling: rendered before the heater off below, so the print
    # temperature is still the target. Not without a part fan or below target.
    {% set pk = printer["gcode_macro _INDX_PARK_COOL"] %}
    {% set mach = printer["gcode_macro _INDX_MACHINE"] if "gcode_macro _INDX_MACHINE" in printer else {} %}
    {% set pfn = mach.part_fan|default("")|string %}
    {% set has_fan = mach.part_cooling|default("not_set") != "none" and ((pfn and ("fan_generic " ~ pfn) in printer) or "fan" in printer.configfile.settings or "gcode_macro m106" in printer.configfile.settings) %}
    {% set sname = pk.sensor|string %}
    {% set skey = ("temperature_sensor " ~ sname) if ("temperature_sensor " ~ sname) in printer else (("heater_generic " ~ sname) if ("heater_generic " ~ sname) in printer else "") %}
    {% set chamber = printer[skey].temperature|float if sname and skey else pk.chamber|float %}
    {% set hot_from = [printer.extruder.target|float, printer.extruder.temperature|float]|max %}
    # The material recorded for the tool: its Tg floor (exact name, first
    # word, then the longest known name it starts with)
    {% set mat = (printer.save_variables.variables["t%d_material" % act]|default("")|string|upper) if act >= 0 else "" %}
    {% set mns = namespace(tg=none, key="") %}
    {% if mat in pk.materials %}
        {% set mns.tg = pk.materials[mat] %}{% set mns.key = mat %}
    {% elif (mat|replace("+", " ")|replace("-", " ")).split(" ")[0] in pk.materials %}
        {% set mns.key = (mat|replace("+", " ")|replace("-", " ")).split(" ")[0] %}
        {% set mns.tg = pk.materials[mns.key] %}
    {% else %}
        {% for k in pk.materials %}
            {% if mat and mat.startswith(k) and k|length > mns.key|length %}
                {% set mns.tg = pk.materials[k] %}{% set mns.key = k %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% set share_to = chamber + (1.0 - pk.fraction|float) * (hot_from - chamber) %}
    {% set mat_to = (mns.tg|float * (1.0 + pk.tg_above|float)) if mns.tg is not none else share_to %}
    {% set cool_to = [mat_to, chamber + pk.min_above|float]|max %}
    # Race mode cools too [EL-TC-030]. Blast: not for a cold nozzle
    # (blast_min_c). Target: only a nozzle above its target.
    {% set blast = pk.mode|default("blast")|string != "target" %}
    {% set cool_s = pk.blast_s|default(5)|float if blast else pk.max_s|int %}
    {% set cool_mode = "blast" if blast else "target" %}
    {% set warm = printer.extruder.temperature|float >= pk.blast_min_c|default(80)|float if blast else printer.extruder.temperature|float > cool_to + 2 %}
    # A dock with an ooze stopper (t<n>_ooze_stopper) gets no park cooling: the
    # stopper seals the nozzle. Said once per print [EL-TC-031]
    {% set stopper = act >= 0 and printer.save_variables.variables["t%d_ooze_stopper" % act]|default(0)|int %}
    {% set cool = pk.enabled and has_fan and act >= 0 and warm and not stopper %}
    # blast_start heater_off: the blast starts at the heater off below [EL-TC-027]
    {% set early = 1 if cool and blast and pk.blast_start|default("heater_off")|string != "dock" else 0 %}
    # The station spot (per tool, else the common one) must be set, inside the
    # axes, behind the clearance line on the dock side and dock_min_dx in X
    # from every dock, so the way there never crosses the print or touches a
    # dock. Anything wrong: cool in the dock. [EL-TC-028]
    {% set spot = (printer.save_variables.variables.indx_park_station|default({}))[act|string]|default([pk.station_x, pk.station_y, pk.station_z]) if act >= 0 else [0, 0, -1] %}
    {% set sx, sy, sz = spot[0]|float, spot[1]|float, spot[2]|float %}
    {% set th0 = printer.toolhead %}
    {% set min_dx = printer["gcode_macro _CAL_GOTO_CAMPOS"].dock_min_dx|default(36.0)|float if "gcode_macro _CAL_GOTO_CAMPOS" in printer else 36.0 %}
    {% set sns = namespace(why="", near=-1) %}
    # A registered station is ready when enabled_by is on, ready_when holds and
    # its origin is saved. Cooling X without a cooling point: its zone's middle
    {% set svs0 = printer.save_variables.variables %}
    {% set want = pk.station|default("auto")|string %}
    {% set rns = namespace(name="", why="", cx=0.0) %}
    {% if cool and pk.where|string == "station" and want != "spot" %}
        {% for sec in printer.configfile.settings if sec.startswith("indx_station ") and sec in printer and not rns.name and (want == "auto" or sec[13:] == want|lower) %}
            {% set so = printer[sec] %}
            {% set seb = so.enabled_by.split(".") if so.enabled_by else [] %}
            {% set srw = so.ready_when.split("=", 1) if so.ready_when else [] %}
            {% set ok = (not seb or (("gcode_macro " ~ seb[0]) in printer and printer["gcode_macro " ~ seb[0]][seb[1]]|default(False))) and (not srw or (srw[0] in svs0 and (srw|length == 1 or svs0[srw[0]]|string == srw[1]))) and (not so.origin or (so.origin[0] in svs0 and so.origin[1] in svs0)) %}
            {% if ok %}
                {% set rns.name = so.name %}
                {% set cx = (svs0[so.origin[0]]|float if so.origin else 0.0) + (so.zone[0]|float + so.zone[2]|float) / 2.0 %}
                {% set rns.cx = [[cx, printer.toolhead.axis_minimum.x|float]|max, printer.toolhead.axis_maximum.x|float]|min %}
            {% elif want != "auto" %}
                {% set rns.why = "the %s station is not ready (switched off or not calibrated)" % so.name %}
            {% endif %}
        {% endfor %}
        {% if want != "auto" and not rns.name and not rns.why %}
            {% set rns.why = "no station named %s is registered" % want %}
        {% endif %}
        {% set sns.why = rns.why %}
    {% endif %}
    {% if cool and pk.where|string == "station" and not rns.name and not rns.why %}
        {% for i in range(tp.tool_count|int) %}
            {% if sns.near < 0 and (sx - tp.tools[i].x|float)|abs < min_dx %}{% set sns.near = i %}{% endif %}
        {% endfor %}
        {% if sz < 0 %}
            {% set sns.why = "no station spot is set" if want == "spot" else "no registered station is ready and no station spot is set" %}
        {% elif sx < th0.axis_minimum.x|float or sx > th0.axis_maximum.x|float or sy < th0.axis_minimum.y|float or sy > th0.axis_maximum.y|float %}
            {% set sns.why = "the station spot is outside the axes" %}
        {% elif (sy - tp.clearance_y|float) * tp.dock_dir|float <= 0 %}
            {% set sns.why = "the station spot is not behind the clearance line on the dock side (stations sit there, like the docks, so the way to them never crosses the print)" %}
        {% elif sns.near >= 0 %}
            {% set sns.why = "the station spot is %.1f mm from the T%d dock in X, closer than %.0f mm, so the head or its tool could touch the dock or the docked tool" % ((sx - tp.tools[sns.near].x|float)|abs, sns.near, min_dx) %}
        {% endif %}
    {% endif %}
    {% set at_station = cool and pk.where|string == "station" and (rns.name or not sns.why) %}
    {% set at_dock = cool and not at_station %}
    # In the dock the dance runs while the fan blows: a blast not started at the
    # heater off starts on arrival; the peel waits only what is left [EL-TC-027]
    {% set dock_fan = at_dock and not early %}
    # The fan back and settle_ms before the peel only when the park check
    # reads after the exit (not in race mode or with CHECK=0)
    {% set dock_settle = pk.settle_ms|int if check else 0 %}
    {% if act != -1 %}
        # Resolve this tool's dock geometry
        {% set tool = tp.tools[act] %}
        {% set dock_y = tool.dock_y %}
        {% set trigger_y = dock_y - tp.dock_dir * printer["gcode_macro _INDX_CONSTANTS"].magnet_offset|float %}

        {% set clearance_y = tp.clearance_y %}

        # Z hop first, as its own move, so the nozzle never drags across the
        # part. Clamped to the Z travel (less the Z homing origin): after a tall
        # print a full hop would be out of range [EL-TC-032]
        {% set hop_z = [printer.gcode_move.gcode_position.z + zhop, printer.toolhead.axis_maximum.z|float - printer.gcode_move.homing_origin.z|float]|min %}
        G90
        SET_GCODE_OFFSET X=0.0 Y=0.0
        # A print's tool change asked for the park retraction of this tool
        # (PRINT_TOOLCHANGE park_pending): on the Z hop, before the heater
        # off, through the retraction guard [EL-PRI-044]
        {% set ppd = printer["gcode_macro PRINT_TOOLCHANGE"].park_pending if "gcode_macro PRINT_TOOLCHANGE" in printer else [] %}
        {% if ppd|length == 3 and ppd[0]|int == act %}
            _INDX_PARK_RETRACT TOOL={act} E={ppd[1]} BASE={ppd[2]}{(" Z=%.3f" % hop_z) if zhop > 0 else ""}
        {% elif zhop > 0 %}
            _TC_G0 Z={"%.3f"|format(hop_z)}
        {% endif %}
        # SAFETY: heater off before any dock approach, after the queued print
        # moves and the hop (M400), so it is not cut while extruding [EL-TC-024].
        # [indx_tc_fast] turns it off at that moment without the drain.
        {% if fast %}
            INDX_HEATER_OFF_AT_END
        {% else %}
            M400
            M104 S0
        {% endif %}
        {% if early %}
            # Park cooling, blast_start heater_off: the part fan at full speed
            # from the heater off, on the way to the dock (or station)
            _INDX_PARK_BLAST_START
        {% endif %}
        {% if cool and sns.why %}
            RESPOND MSG="INDX > Park cooling: {sns.why}. T{act} is cooled in its dock instead."
        {% endif %}
        {% if stopper and pk.enabled and has_fan and warm %}
            _INDX_PARK_STOPPER_NOTE TOOL={act}
        {% endif %}
        {% if at_station %}
            # Park cooling at the station, tool on the head, heater off; never
            # extrudes. This tool's XY offsets are added (cleared for the docks
            # above), so every nozzle reaches the same spot [EL-TC-028]
            {% set svs = printer.save_variables.variables %}
            {% set sox = svs["t%d_offset_x" % act]|default(0.0)|float %}
            {% set soy = svs["t%d_offset_y" % act]|default(0.0)|float %}
            {% if rns.name %}
            _INDX_PARK_STATION NAME={rns.name} X={"%.3f"|format(rns.cx + sox)} TOOL={act} MAT={mat|replace(" ", "_") or "-"} CHAMBER={"%.1f"|format(chamber)} FROM={hot_from} TARGET={"%.1f"|format(cool_to)} MAX={cool_s} MODE={cool_mode} SETTLE={pk.settle_ms|int} EARLY={early}
            {% else %}
            _INDX_PARK_STATION X={"%.3f"|format(sx + sox)} Y={"%.3f"|format(sy + soy)} Z={"%.3f"|format(sz)} BACKZ={"%.3f"|format([hop_z, sz]|max)} TOOL={act} MAT={mat|replace(" ", "_") or "-"} CHAMBER={"%.1f"|format(chamber)} FROM={hot_from} TARGET={"%.1f"|format(cool_to)} MAX={cool_s} MODE={cool_mode} SETTLE={pk.settle_ms|int} EARLY={early}
            {% endif %}
        {% endif %}
        # Out to the clearance line first, so the X travel never cuts through
        # the docked tools [EL-TC-018]
        _INDX_TO_LANE
        _TC_G0 X={tool.x} Y={"%.3f"|format(clearance_y)}

        # Fast to just before the magnet (magnet_approach_mm), then softly
        # onto it, in every speed mode [EL-TC-002]
        {% set kc = printer["gcode_macro _INDX_CONSTANTS"] %}
        {% set approach_y = trigger_y - tp.dock_dir * kc.magnet_approach_mm|float %}
        {% set vv = printer["gcode_macro _TOOLCHANGE_VARS"] %}
        {% set fmm = vv.slow_dock_mult|default(0.5)|float if vv.slow|default(0)|int else 1.0 %}
        _TC_G0 Y={"%.3f"|format(approach_y)}
        {% if check %}
            # Load cell with the tool seated, for the park check, before the
            # magnet pulls on the head. Short settle: it feeds no seat check [EL-TC-033]
            G4 P150
            M400
            _INDX_LC_STORE VAR=seated
        {% endif %}
        {% if dock_fan and st == 0 %}
            # Park cooling in the dock, fan not on yet: on now, after the seated
            # reading and before the magnet, so the dock steps run under it
            _INDX_PARK_BLAST_START
        {% endif %}
        G1 Y{"%.3f"|format(trigger_y)} F{(kc.magnet_feedrate|float * fmm)|int}
        
        # Latch in mesh at a known spot (a force lock, no E motion since): open
        # to the open position (the fixed full open would hit the stop and lose
        # steps) and skip the homing. Unknown: fixed open and homing. A hard
        # lock opens to latch_hard_open_from_stop and homes after [EL-TC-006]
        {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
        {% set pos = m.lock_pos|float + printer.toolhead.position.e|float - m.lock_e|float %}
        {% set known = st == 0 and m.lock_pos|float >= 0 and (pos - m.lock_pos|float)|abs <= 0.5 %}
        {% set hard = m.lock_force|int != 1 or m.lock_force_g|float|abs >= c.latch_hard_force_g|float %}
        # Race mode, full open by the dance: no latch homing after the park,
        # a blind move to the open position instead (_INDX_LATCH_RACE_OPEN)
        {% set blind = race and st == 0 and not known and "tmc_sg_log" in printer %}
        # the tool's filament up to here (its print, its park retraction):
        # the latch moves below are not filament [EL-DATA-004]
        _INDX_FIL_ACCOUNT
        {% if st == 0 %}
            {% set dance = c.squeeze_e|float + c.wiggle_in_e|float + c.wiggle_out_e|float %}
            {% set target = c.latch_hard_open_from_stop|float if hard else c.latch_open_from_stop|float %}
            {% set open_e = (target - pos - dance) if known else c.full_open_e|float %}
            _SYNC_UNLOCK_DANCE DOCK_Y={dock_y} OPEN_E={"%.3f"|format(open_e)}
            SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=lock_pos VALUE=-1.0
            {% if known %}
                RESPOND MSG="INDX: latch in mesh at {'%.2f'|format(pos)} mm from the stop, park opens {'%.2f'|format(open_e)} mm (not {c.full_open_e}){' to ' ~ target ~ ' mm, hard lock (' ~ m.lock_force_g|float|round(0)|int ~ ' g): latch homing follows' if hard else ''}"
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=2
            SAVE_VARIABLE VARIABLE=toolhead_state VALUE=2
            {% if at_dock %}
                # Park cooling in the dock [EL-TC-027]: right before the peel the
                # rest of the cooling, the fan back, then the settle, so the
                # empty-head reading after the exit sees the fan as without it
                _INDX_PARK_COOL_WAIT TOOL={act} MAT={mat|replace(" ", "_") or "-"} CHAMBER={"%.1f"|format(chamber)} FROM={hot_from} TARGET={"%.1f"|format(cool_to)} MAX={cool_s} MODE={cool_mode} SETTLE={dock_settle} EARLY=1
            {% endif %}
        {% else %}
            # Tool on the head with its latch recorded open: the record is wrong
            # and the latch may be locked. Never into the dock without the
            # dance: stop at the trigger line, fan back first [EL-TC-034]
            _INDX_PARK_BLAST_ABORT
            _INDX_RAISE MSG="INDX: T{act} is recorded on the head but its latch is recorded open, so where the latch is is unknown. Stopped in front of the T{act} dock. Check the head: if T{act} is locked on, INDX_SEAT_TOOL_BY_HAND TOOL={act} LOCKED=1, then PARK_TOOL; if the latch is open or the head is empty, INDX_RELEASE_TOOL_BY_HAND."
        {% endif %}

        # [indx_tc_fast]: switch to the homing's stealthChop current now, so
        # the driver settles during the exit (SG_HOME_E STEALTH_READY checks it)
        {% if fast and "tmc_sg_log" in printer and not (known and not hard) and not blind %}
            INDX_TMC_AT CURRENT={c.latch_home_current} STEALTH=1
        {% endif %}
        _LINEAR_EXIT
        {% if check %}
            # Did the tool really leave the head? (raises, active_tool kept)
            G4 P250
            M400
            _INDX_LC_FROM_WINDOW VAR=seated
            _INDX_PARK_CHECK TOOL={act} CHANGE={params.CHANGE|default(0)|int}
            _INDX_DOCK_CONTACT TOOL={act}
        {% endif %}
        _INDX_FIL_ACCOUNT SKIP=1
        _INDX_SET_ACTIVE_TOOL TOOL=-1
        _INDX_SPOOL_ACTIVE
        {% if blind %}
            _INDX_LATCH_RACE_OPEN
        {% else %}
            _INDX_LATCH_HOME AT_OPEN={1 if known and not hard else 0}
            {% if check and not known and "tmc_sg_log" in printer %}
                # The full open put the latch on its stop: did the tool leave
                # the head? (raises, active_tool kept) [EL-TC-075]
                _INDX_PARK_HANG_CHECK TOOL={act}
            {% endif %}
        {% endif %}
        {% if "indx_dock_sensor" in printer %}_INDX_DSENS_AFTER_PARK TOOL={act} LC={1 if check else 0} CHANGE={params.CHANGE|default(0)|int}{% endif %}
        {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=after_park TOOL={act}{% endif %}
    {% endif %}
    {% if "indx_clog" in printer %}INDX_CLOG_QUIET ON=0 REASON=park{% endif %}
    _INDX_PA_RELEASE OWNER=park

[gcode_macro _PICKUP_TOOL]
description: Inner - pick up TOOL, check it is seated (no retry: a failure stops or pauses), then tare, offsets and heat
# Each step is its own macro, so it renders when it runs and sees what the step
# before found. A failed seat check pauses a print or stops (_PICKUP_SEAT_FAIL).
gcode:
    # the latch moves of this pickup are not extrusion: the clog watch skips them
    {% if "indx_clog" in printer %}INDX_CLOG_QUIET ON=1 REASON=pickup{% endif %}
    _INDX_PA_HOLD OWNER=pickup
    # A dock sensor check held the print after the park of this change
    # (_INDX_DSENS_STOP): no pickup, RESUME redoes the change
    {% set tv0 = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% if "indx_dock_sensor" in printer and printer.indx_dock_sensor.hold|int and tv0.change_busy|int and not tv0.homing_busy|int %}
        RESPOND MSG="INDX > T{params.TOOL} pickup not started: a dock sensor check holds the print (RESUME redoes the tool change)"
    {% else %}
    {% set rz = (" RESTORE_Z=" ~ params.RESTORE_Z) if params.RESTORE_Z|default("")|string|length else "" %}
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set race = v.race_now|int and not v.homing_busy|int and not v.slow|int %}
    # A new pickup ends any earlier hold (a print cancelled while held)
    SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=held VALUE=0
    # and any pending INDX_CONFIRM_TOOL: it was for one G28 [EL-TC-035]
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_PUSH_CHECK VARIABLE=confirmed VALUE=-1
    # Pickup position check (lost X/Y steps, indx_pickup_pos.py): the onset
    # count before this lock, and INDX_CAL_DOCK_Y_FINE's offset (read before the grab)
    {% set pp = "indx_pickup_pos" in printer and "tmc_sg_log" in printer and not race %}
    {% set fine = printer["gcode_macro INDX_CAL_DOCK_Y_FINE"] if "gcode_macro INDX_CAL_DOCK_Y_FINE" in printer else {} %}
    {% set pp_off = (" OFFSET=%.3f" % fine.offset|float) if (fine and fine.left|int > 0 and fine.tool|int == params.TOOL|int) else "" %}
    _PICKUP_GRAB TOOL={params.TOOL} ZHOP={params.ZHOP|default(0.0)}{rz}
    {% if race %}
        # Race mode: no seat check, so no retry and no seat stop either
        _INDX_SEAT_SKIP TOOL={params.TOOL}
    {% else %}
        _INDX_SEAT_CHECK TOOL={params.TOOL}
        _PICKUP_SEAT_RETRY TOOL={params.TOOL}{rz}
        _PICKUP_SEAT_FAIL TOOL={params.TOOL} TARGET={params.TARGET|default(0)} SKIP_Z_CORRECTION={params.SKIP_Z_CORRECTION|default(0)}
        {% if pp %}
            # seated: was the head where INDX thinks it is? Stops here, out
            # of the dock, before the offsets move the head
            _INDX_PICKUP_POS_CHECK TOOL={params.TOOL} SEQ0={printer.tmc_sg_log.onset_seq|default(0)|int}{pp_off} TARGET={params.TARGET|default(0)} SKIP_Z_CORRECTION={params.SKIP_Z_CORRECTION|default(0)}
        {% endif %}
    {% endif %}
    _PICKUP_FINISH TOOL={params.TOOL} TARGET={params.TARGET|default(0)} SKIP_Z_CORRECTION={params.SKIP_Z_CORRECTION|default(0)}
    {% if "indx_dock_sensor" in printer %}_INDX_DSENS_AFTER_PICKUP TOOL={params.TOOL} RACE={1 if race else 0}{% endif %}
    {% endif %}
    {% if "indx_clog" in printer %}INDX_CLOG_QUIET ON=0 REASON=pickup{% endif %}
    _INDX_PA_RELEASE OWNER=pickup

[gcode_macro _PICKUP_LATCH_READY_CHECK]
description: Inner - the latch homing at the dock found no stop: stop there
# The search moved the latch by an unknown amount: a lock from there can stop
# short of the release. Stop in the dock, the tool left in it [EL-TC-036]
gcode:
    {% set lh = printer["gcode_macro _INDX_LATCH_HOME"] %}
    {% if lh.out_of_band|int %}
        _INDX_RAISE MSG="INDX: the latch homing in the dock found a stop {'%.2f'|format(lh.stop_mm|float)} mm into its search, far from where the open latch stops (a slipped or broken gear tooth, or a latch past the release that the dance did not bring into mesh). Stopped in the dock, the tool is still in it and the head is empty. Check the latch and the activation gear, then INDX_CAL_LATCH or try again."
    {% elif not lh.at_open|int %}
        _INDX_RAISE MSG="INDX: the latch homing in the dock found no stop, so where the latch is is unknown. Stopped in the dock, the tool is still in it and the head is empty. Check the latch drive, then INDX_CAL_LATCH or try again."
    {% endif %}

[gcode_macro _PICKUP_GRAB]
description: Inner - the pickup moves: to the dock, open, engage, lock, exit
gcode:
    {% set t = params.TOOL|int %}
    {% set st = printer["gcode_macro _TOOLCHANGE_VARS"].toolhead_state|int %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set zhop = params.ZHOP|default(0.0)|float %}
    {% set restore_z = params.RESTORE_Z|default("")|string %}
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set race = v.race_now|int and not v.homing_busy|int and not v.slow|int %}
    {% set lh = printer["gcode_macro _INDX_LATCH_HOME"] %}
    # Race mode: the race park left the latch at the open position without
    # homing it, and nothing has moved it since
    {% set race_open = race and st == 2 and lh.race_open|int and (printer.toolhead.position.e|float - lh.race_e|float)|abs < 0.001 %}

    # Resolve this tool's dock geometry
    {% set tool = tp.tools[t] %}
    {% set dock_y = tool.dock_y %}
    # INDX_CAL_DOCK_Y_FINE: its pickups grab the tool OFFSET mm further out of
    # the dock (negative: further in); only while its countdown runs
    {% set fine = printer["gcode_macro INDX_CAL_DOCK_Y_FINE"] if "gcode_macro INDX_CAL_DOCK_Y_FINE" in printer else {} %}
    {% if fine and fine.left|int > 0 and fine.tool|int == t %}
        {% set dock_y = dock_y - tp.dock_dir * fine.offset|float %}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_DOCK_Y_FINE VARIABLE=left VALUE={fine.left|int - 1}
    {% endif %}
    {% set trigger_y = dock_y - tp.dock_dir * printer["gcode_macro _INDX_CONSTANTS"].magnet_offset|float %}
    {% if printer.save_variables.variables["t%d_misload" % t]|default(0)|int %}
        # marked after a misload (_INDX_MISLOAD_MARK): a note, not a stop
        RESPOND TYPE=error MSG="INDX ! T{t} is marked after a misload: its filament must be out before this pickup. Loading it or INDX_SET_MATERIAL clears the mark."
    {% endif %}

    {% set clearance_y = tp.clearance_y %}

    # No park before (act -1): the hop is here, as in _PARK_TOOL_APPLY: its own
    # move, clamped to the Z travel [EL-TC-032]
    {% set hop_z = [printer.gcode_move.gcode_position.z + zhop, printer.toolhead.axis_maximum.z|float - printer.gcode_move.homing_origin.z|float]|min %}
    G90
    SET_GCODE_OFFSET X=0.0 Y=0.0
    {% if zhop > 0 %}
        _TC_G0 Z={"%.3f"|format(hop_z)}
        M400
    {% endif %}
    # Out to the clearance line first, as in _PARK_TOOL_APPLY [EL-TC-018]
    _INDX_TO_LANE
    _TC_G0 X={tool.x} Y={"%.3f"|format(clearance_y)}

    # Fast to just before the magnet, softly onto it after the empty reading
    # (free of the magnet's pull) [EL-TC-002]
    {% set approach_y = trigger_y - tp.dock_dir * c.magnet_approach_mm|float %}
    {% set fmm = v.slow_dock_mult|default(0.5)|float if v.slow|default(0)|int else 1.0 %}
    _TC_G0 Y={"%.3f"|format(approach_y)}
    # Empty-head reading right before the pickup, so load cell drift drops out
    # of the seat check; the park check of this change gives one [EL-TC-071]
    {% set s = printer["gcode_macro _INDX_LC_STORE"] %}
    {% if race %}
        # Race mode: no seat check, so no empty-head reading
    {% elif s.empty_from_park|int and s.empty_valid|int %}
    {% else %}
        G4 P250
        M400
        _INDX_LC_STORE VAR=empty
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_park VALUE={1 if s.empty_from_park|int and s.empty_valid|int and not race else 0}
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_from_park VALUE=0
    {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=before_pickup TOOL={t}{% endif %}
    G1 Y{"%.3f"|format(trigger_y)} F{(c.magnet_feedrate|float * fmm)|int}

    # Latch moves work on a cold tool (_TC_LATCH_MOVE)
    _TC_SET_ROTATION_DIST
    G90

    # Latch unknown (no park homed it): treat it as not open and out of mesh.
    # The dance meshes the gear, then the latch homes in the dock [EL-TC-037].
    # A race park's blind open counts as known in race mode only.
    {% set unknown = "tmc_sg_log" in printer and not lh.at_open|int and not race_open %}
    {% if unknown %}
        _SYNC_UNLOCK_DANCE DOCK_Y={dock_y} NO_OPEN=1
        # no park ran before it, so the driver is not in stealthChop yet
        _INDX_LATCH_HOME DIST=-15 READY=0 UNKNOWN=1
        _PICKUP_LATCH_READY_CHECK
        _TC_SET_ROTATION_DIST
        G90
    {% else %}
        {% if st != 2 %}
            # Open latch (currently locked)
            _TC_LATCH_MOVE E={c.full_open_e} F={c.latch_feedrate} I={c.run_current}
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=2
            SAVE_VARIABLE VARIABLE=toolhead_state VALUE=2
        {% endif %}

        # Engagement slide to dock (slow_dock_mult on a slow change: a new dock or SLOW=1)
        {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
        G1 Y{"%.3f"|format(dock_y)} F{(c.engage_feedrate * (v.slow_dock_mult|default(0.5)|float if v.slow|default(0)|int else 1.0))|int}
    {% endif %}

    # Close after the peel, every pickup but race mode, calibrations too
    # [EL-TC-012]: an empty tool's calibration counts are taken here
    # the sensed lock's state (INDX Suite: indx_suite_latch.cfg)
    {% set lf = printer["gcode_macro _INDX_LOCK_FORCE"] if "gcode_macro _INDX_LOCK_FORCE" in printer else {"cal_left": 0} %}
    {% set lpp = printer["gcode_macro _INDX_LOCK_PAST"] if "gcode_macro _INDX_LOCK_PAST" in printer else {"full_left": 0} %}
    {% set lcal = lf.cal_left|int > 0 or lpp.full_left|int > 0 or printer["gcode_macro _INDX_SEAT_CHECK"].allow_short|int > 0 %}
    {% set cap = printer.save_variables.variables.pickup_close_after_peel|default(0)|int and not race and (unknown or lh.at_open|int) and "tmc_sg_log" in printer and "load_cell_probe" in printer %}
    {% set t_empty = not printer.save_variables.variables["t%d_material" % t]|default("")|string %}
    SET_GCODE_VARIABLE MACRO=_INDX_CLOSE VARIABLE=active VALUE={1 if cap else 0}
    SET_GCODE_VARIABLE MACRO=_INDX_CLOSE VARIABLE=fail VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_CLOSE VARIABLE=cal_now VALUE={1 if cap and lcal else 0}
    {% if cap and t_empty and lf.cal_left|int > 0 %}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=cal_left VALUE={lf.cal_left|int - 1}
    {% endif %}
    {% if cap and t_empty and lpp.full_left|int > 0 %}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=full_left VALUE={lpp.full_left|int - 1}
    {% endif %}
    {% if cap %}
        # a misload suspect is this pickup's only (_INDX_MISLOAD_CHECK)
        SET_GCODE_VARIABLE MACRO=_INDX_MISLOAD_CHECK VARIABLE=suspect VALUE=-1
    {% endif %}

    # Lock the tool (frozen is this lock's; the standard lock never sets it)
    {% if "gcode_macro _INDX_LOCK_PAST" in printer %}SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=frozen VALUE=0{% endif %}
    # From the first lock move the latch is neither open nor homed: a stop
    # inside the lock leaves it unknown for the next pickup [EL-TC-038]
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=0
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=0
    SAVE_VARIABLE VARIABLE=toolhead_state VALUE=0
    {% if race and (unknown or lh.at_open|int or race_open) and "tmc_sg_log" in printer %}
        # Race mode: a fixed, unsensed lock from the open position to
        # target_mm + latch_race_margin; the free travel fast. No frozen
        # filament stop. The retraction guard is the standard one.
        {% set e_all = printer["gcode_macro _INDX_LOCK_PAST"].target_mm|float - c.latch_open_from_stop|float + c.latch_race_margin|float %}
        {% set e_fast = c.latch_fast_from_stop|float - c.latch_open_from_stop|float - 0.5 %}
        _TC_LATCH_MOVE E={"%.3f"|format(e_fast)} F={c.latch_fast_feedrate} I={c.run_current}
        _TC_LATCH_MOVE E={"%.3f"|format(e_all - e_fast)} F={c.latch_feedrate} I={c.run_current}
        _TC_RESTORE_ROTATION_DIST
        # not sensed: a tool with filament is taken as short [EL-TC-072]
        _INDX_LOCK_MARK_UNSENSED TOOL={t} KIND=race
        RESPOND MSG="T{t} locked (race mode: fixed lock of {'%.2f'|format(e_all)} mm, not sensed)"
    {% elif cap %}
        # Close after the peel: in the dock only until the clamp has clearly started, at
        # least close_min_from_stop; the close comes after the peel
        _TC_LATCH_MOVE E={c.latch_fast_from_stop - c.latch_open_from_stop} F={c.latch_fast_feedrate} I={c.run_current}
        G4 P150
        M400
        _INDX_LC_FROM_WINDOW VAR=empty
        _INDX_CLAMP_SENSE TOOL={t} ONSET=1
        _INDX_MISLOAD_CHECK TOOL={t}
        _INDX_CLAMP_MIN TOOL={t}
        _TC_RESTORE_ROTATION_DIST
        _INDX_CLAMP_MARK
    {% elif (unknown or lh.at_open|int) and "tmc_sg_log" in printer and "load_cell_probe" in printer %}
        # Latch homed at the last park: lock until the clamp reaches the tool's lock
        # target (t<n>_lock_g, else latch_lock_force_g), at most to lock_max from
        # the stop. The
        # free travel before the clamp builds runs fast, unsensed.
        _TC_LATCH_MOVE E={c.latch_fast_from_stop - c.latch_open_from_stop} F={c.latch_fast_feedrate} I={c.run_current}
        G4 P150
        M400
        _INDX_LC_FROM_WINDOW VAR=empty
        _INDX_LOCK_FORCE TOOL={t} ONSET=1
        _INDX_MISLOAD_CHECK TOOL={t}
        _INDX_LOCK_PAST
        _TC_RESTORE_ROTATION_DIST
        _INDX_LATCH_LOCKED TOOL={t}
    {% else %}
        _TC_LATCH_MOVE E={c.full_lock_e} F={c.latch_feedrate} I={c.run_current}
        _TC_RESTORE_ROTATION_DIST
        # Unsensed lock: it cannot feel frozen filament. A tool with filament
        # is taken as short of the release (ASSUMED=1): no retraction and no
        # probe until a heated push of clear_e [EL-TC-068]
        _INDX_LOCK_MARK_UNSENSED TOOL={t} KIND=lock
    {% endif %}
    # A tip shaped tool: the lock fed part of its retraction back
    _INDX_TIP_FEED TOOL={t}
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=0
    # The tool counts as on the head from the lock on, so a stop parks it first;
    # filament, spool and change count follow a passed check [EL-TC-039]
    _INDX_FIL_ACCOUNT
    _INDX_SET_ACTIVE_TOOL TOOL={t}
    # In-dock reading (dock pushing on the tool), only when a dock tool asks
    # (_INDX_INDOCK) [EL-TC-040]. Not with the close after the peel: the latch
    # only clamps partly in the dock.
    {% set ind = printer["gcode_macro _INDX_INDOCK"].left|int if "gcode_macro _INDX_INDOCK" in printer else 0 %}
    {% if ind > 0 and cap %}
        SET_GCODE_VARIABLE MACRO=_INDX_INDOCK VARIABLE=left VALUE={ind - 1}
    {% elif ind > 0 %}
        SET_GCODE_VARIABLE MACRO=_INDX_INDOCK VARIABLE=left VALUE={ind - 1}
        G4 P250
        M400
        _INDX_LC_STORE VAR=indock
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=0
    SAVE_VARIABLE VARIABLE=toolhead_state VALUE=0

    # Z drops after _LINEAR_EXIT's Y sprint. OFF_Y: the offset _PICKUP_FINISH
    # applies with MOVE=1 right after
    _LINEAR_EXIT RESTORE_Z={restore_z} OFF_Y={printer.save_variables.variables["t%d_offset_y" % t]|default(0.0)|float}
    {% if cap %}
        # Close after the peel: standing still out of the dock, the latch still where it
        # clamped: the hold check, then the close, then the seat check
        G4 P300
        M400
        _INDX_LC_FROM_WINDOW VAR=empty
        _INDX_PEEL_HOLD_CHECK TOOL={t}
        _INDX_CLOSE_RUN TOOL={t}
        G4 P300
        M400
    {% elif not race %}
        # Let the load cell settle before the seat check reads it
        G4 P300
        M400
        _INDX_LC_FROM_WINDOW VAR=empty
        _INDX_LC_FROM_WINDOW VAR=indock
    {% endif %}

[gcode_macro _INDX_PICKUP_POS_HOLD]
description: Inner - the state of a print held by the pickup position check: rehome (the axes still to home before RESUME, "xy" at the hold), the tool and the change to redo; repick (this change parks the tool and picks it up again before it stops) and repicked (the second pickup of this change: a stop holds). Does nothing when run
variable_rehome: ""
variable_tool: -1
variable_cmd: ""
variable_repick: 0
variable_repicked: 0
variable_first_dev: 0.0
gcode:

[gcode_macro _INDX_PICKUP_POS_HOMED]
description: Inner - G28 homed X=1 and/or Y=1: clear them from a pickup position hold's re-home list
gcode:
    {% set h = printer["gcode_macro _INDX_PICKUP_POS_HOLD"] %}
    {% if h.rehome|string %}
        {% set left = h.rehome|string|replace("x" if params.X|default(0)|int else "-", "")|replace("y" if params.Y|default(0)|int else "-", "") %}
        SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=rehome VALUE='"{left}"'
        {% if not left %}
            RESPOND MSG="INDX: X and Y homed again after the pickup position stop: RESUME parks T{h.tool} and redoes the tool change"
        {% endif %}
    {% endif %}

[gcode_macro _INDX_PICKUP_POS_REPICK]
description: Inner - the pickup position check found the clamp start off in a print's tool change: park the tool and pick it up again, once. A second pickup off holds the print (X or Y lost steps); a normal one goes on with a warning (the latch was off, not the head)
# A clamp start off can come from the latch reference, not the head (the
# cases are in the log). A head off in X or Y meets the same dock off
# again on the second pickup; a latch reference off does not. The park takes
# the path the pickup just took. [EL-TC-077]
gcode:
    {% set h = printer["gcode_macro _INDX_PICKUP_POS_HOLD"] %}
    {% if h.repick|int %}
        {% set t = params.TOOL|int %}
        {% set rz = (" RESTORE_Z=" ~ params.RESTORE_Z) if params.RESTORE_Z|default("")|string|length else "" %}
        SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=repick VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=repicked VALUE=1
        PARK_TOOL ZHOP=0 CHANGE=1
        _PICKUP_TOOL TOOL={t} TARGET={params.TARGET|default(0)} ZHOP=0{rz} SKIP_Z_CORRECTION={params.SKIP_Z_CORRECTION|default(0)|int}
        _INDX_PICKUP_POS_REPICK_END TOOL={t}
    {% endif %}

[gcode_macro _INDX_PICKUP_POS_REPICK_END]
description: Inner - the second pickup of a re-pick passed: say so (a second stop has held the print and said its own)
gcode:
    {% set h = printer["gcode_macro _INDX_PICKUP_POS_HOLD"] %}
    {% set r = printer.indx_pickup_pos.last if "indx_pickup_pos" in printer else {} %}
    {% if not printer["gcode_macro _PICKUP_SEAT_FAIL"].held|int and r.verdict|default("") != "stop" %}
        RESPOND TYPE=error MSG="{'INDX ! T%d: the first pickup clamped %+.2f mm off this dock, the second %s: the head was where INDX thinks it is (the latch was off, not X or Y). Printing on. If it repeats on every change of T%d, check its latch and front.' % (params.TOOL|int, h.first_dev|float, ('%+.2f mm, normal' % r.dev|float) if r.dev is number else 'normal', params.TOOL|int)}"
    {% endif %}

[gcode_macro _INDX_CLOSE]
description: Inner - state of the close after the peel (active this pickup), where the latch clamped, the hold after the peel, the peak while closing
variable_active: 0
variable_fail: 0
variable_pos: -1.0
variable_hold_g: 0.0
variable_peak_g: 0.0
# cal_now: this pickup is part of a lock or load cell calibration: weight
# only, its peak is what is being measured
variable_cal_now: 0
gcode:

[gcode_macro _INDX_MISLOAD_MARK]
description: Inner - _INDX_MISLOAD_LOAD's buttons: mark TOOL=n (t<n>_misload: pull the filament out before its next use), then DO=load (tool on the head: the latch opens by hand first; then INDX_LOAD ASK=1: material, color, the pickup confirmed), dock (tool on the head: the latch opens by hand, the tool goes into its dock by hand) or leave (nothing moves). Saves: t<n>_misload
# The mark clears when the tool's filament is recorded again (a load, or
# INDX_SET_MATERIAL, _INDX_FIL_RECORD); until then every pickup of it warns.
gcode:
    {% set t = params.TOOL|int %}
    {% set do = params.DO|default("leave")|string|lower %}
    {% set on = printer.save_variables.variables.active_tool|default(-1)|int == t %}
    SAVE_VARIABLE VARIABLE=t{t}_misload VALUE=1
    RESPOND TYPE=error MSG="INDX ! T{t} marked after a misload: pull the filament out of T{t} before its next use. Loading it (INDX_LOAD) or recording what is in it (INDX_SET_MATERIAL TOOL={t} TYPE=NONE once it is out) clears the mark."
    {% if do == "load" and on %}
        INDX_RELEASE_TOOL_BY_HAND NEXT=INDX_LOAD^TOOL={t}^ASK=1
    {% elif do == "load" %}
        INDX_LOAD TOOL={t} ASK=1
    {% elif do == "dock" and on %}
        INDX_RELEASE_TOOL_BY_HAND
    {% endif %}

[gcode_macro _PICKUP_SEAT_RETRY]
description: Inner - seat check failed: no second pickup; drop sport or race mode to normal and, when the head is clearly empty, open the latch out of the dock. _PICKUP_SEAT_FAIL then stops (or pauses a print)
# No automatic retry: a tool dragged partly out of its dock is not seen, and a
# retry drives into it. The user looks first; RESUME or the next command redoes
# the change. [EL-TC-048]
# dropped: the mode this failure switched to normal (sport, or race when race
# was not used for this change); _PICKUP_FINISH shows the display alert after
# its own clear
variable_dropped: ""
gcode:
    {% set sc = printer["gcode_macro _INDX_SEAT_CHECK"] %}
    {% if not sc.ok|int %}
        {% set t = params.TOOL|int %}
        M104 S0
        # the tool library counts it (memory only, saved with the filament)
        _INDX_PICK_COUNT TOOL={t} FAIL=1
        # A failed pickup in sport or race mode drops to normal speed from
        # then on, until the user picks the mode again
        {% set md = printer["gcode_macro _TOOLCHANGE_VARS"].mode|string|lower %}
        {% if md in ["sport", printer["gcode_macro _TOOLCHANGE_VARS"].race_mode] %}
            MODE_NORMAL
            _TC_APPLY_MODE_LIMITS
            RESPOND TYPE=error MSG="INDX: switched from {md} to normal tool change speed because a T{t} pickup failed. It stays normal, also after a restart, until you run MODE_{md|upper} again."
            _INDX_LCD LEVEL=action MSG="{md|capitalize} mode off: MODE_{md|upper} to restore"
            SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_RETRY VARIABLE=dropped VALUE='"{md}"'
        {% endif %}
        # Head empty, latch in mesh where the lock left it: open and home it
        # here, out of the dock. Nothing else moves.
        {% if not sc.ambiguous|int %}
            {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
            {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
            {% set pos = m.lock_pos|float + printer.toolhead.position.e|float - m.lock_e|float %}
            {% set known = m.lock_pos|float >= 0 and (pos - m.lock_pos|float)|abs <= 0.5 and pos < c.latch_release_from_stop|float %}
            {% set empty = sc.force_g|float|abs < sc.loose_g|float %}
            {% if empty and known and "tmc_sg_log" in printer %}
                _INDX_LATCH_HOME DIST={"%.3f"|format(-(pos + 3.0))} READY=0 EXPECT={"%.3f"|format(pos)}
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _TC_APPLY_MODE_LIMITS]
description: Inner - set the tool change velocity and acceleration limits from the current speed mode (after a mode change in the middle of a tool change)
# Its own macro, so it reads the mode after the switch (_CHANGE_TOOL_APPLY
# sets the limits only at the start)
gcode:
    {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity * v.speed_mult} ACCEL={printer.configfile.settings.printer.max_accel * v.accel_mult}

[gcode_macro _INDX_REHOME_XY]
description: Inner - home X and Y again, from inside G28 too
# Inside the homing override G28 is Klipper's own homing, so the INDX steps
# around it (TMC hooks, Y before X, X at the clearance line) are done here.
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% if printer["gcode_macro _TOOLCHANGE_VARS"].homing_busy|default(0)|int %}
        {% if "gcode_macro _INDX_XY_HOME_BEGIN" in printer %}
            _INDX_XY_HOME_BEGIN
        {% endif %}
        G28 Y
        G90
        G0 Y{"%.3f"|format(tp.clearance_y|float)} F{tp.home_travel_feedrate|default(3000)|int}
        G28 X
        {% if "gcode_macro _INDX_XY_HOME_END" in printer %}
            _INDX_XY_HOME_END
        {% endif %}
    {% else %}
        G28 X Y
    {% endif %}

[gcode_macro _PICKUP_SEAT_FAIL]
description: Inner - not seated: pause a print (RESUME redoes the change), stop anything else
# RESUME runs _INDX_RESUME_HOOK first (indx_prime.cfg; through indx_client.cfg or your own RESUME): with held set it
# redoes the outermost tool change command, then resumes. The print start
# prime uses the PRIME_GRID hold instead.
variable_held: 0
# resuming: a RESUME is redoing the tool change; cleared only when the redo
# got through [EL-TC-049]
variable_resuming: 0
variable_resume_cmd: ""
variable_outer_cmd: ""
gcode:
    {% if not printer["gcode_macro _INDX_SEAT_CHECK"].ok|int %}
        {% set t = params.TOOL|int %}
        {% set f = printer["gcode_macro _INDX_SEAT_CHECK"].force_g|round(0)|int %}
        {% set short = ", and the force lock never reached the spring force" if printer["gcode_macro _INDX_SEAT_CHECK"].lock_short|int else "" %}
        {% set ambiguous = printer["gcode_macro _INDX_SEAT_CHECK"].ambiguous|int %}
        {% set reason = printer["gcode_macro _INDX_SEAT_CHECK"].reason|default("")|string %}
        {% if reason %}
            {% set why = reason %}
        {% elif ambiguous and printer["gcode_macro _INDX_SEAT_CHECK"].lock_short|int %}
            {% set why = "T%d: the latch ran to its travel limit without reaching the lock force target, but the load cell reads %d g against the empty head, so T%d is on the head, possibly badly seated (a weak latch spring or a damaged tool pin show like this). Check the head: if T%d is seated, carry on; if the head is empty, run INDX_RELEASE_TOOL_BY_HAND" % (t, f, t, t) %}
        {% elif ambiguous %}
            {% set why = "T%d: the latch clamped at the spring force but the load cell reads only %d g against the empty head (a seated tool shows at least %d g). T%d may be on the head, badly seated. Check the head: if T%d is seated, carry on; if the head is empty, run INDX_RELEASE_TOOL_BY_HAND" % (t, f, printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(590.0)|float, t, t) %}
        {% else %}
            {% set why = "T%d did not seat (load cell %d g against the empty head, a seated tool shows at least %d g%s). The pickup may have pulled T%d partly out of its dock: check the T%d dock and the head before anything moves" % (t, f, printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(590.0)|float, short, t, t) %}
        {% endif %}
        M104 S0
        _INDX_NOTE LEVEL=stop TITLE="T{t}: tool change failed" MSG="{why}"
        # A tool that may be on the head stays recorded there: the next command
        # then parks it first instead of driving a loaded head into a dock
        _INDX_FIL_ACCOUNT SKIP=1
        _INDX_SET_ACTIVE_TOOL TOOL={t if ambiguous else -1}
        SAVE_VARIABLE VARIABLE=tool_unverified VALUE={1 if ambiguous else 0}
        SAVE_VARIABLE VARIABLE=seat_suspect VALUE={t if ambiguous else -1}
        _INDX_SPOOL_ACTIVE
        {% set pg = printer["gcode_macro PRIME_GRID"] if "gcode_macro PRIME_GRID" in printer else {} %}
        # Inside G28 a failure stops: a pause would let G28 probe Z with an
        # unconfirmed tool [EL-TC-049]
        {% set printing = printer.print_stats.state in ("printing", "paused") and not printer["gcode_macro _TOOLCHANGE_VARS"].homing_busy|default(0)|int %}
        {% if printing and pg.active|default(0)|int %}
            # Print start prime: its own hold, RESUME restarts the prime from this tool
            _PRIME_GRID_HOLD TOOL={t} WHY=seat FORCE={f}
        {% elif printing %}
            # Redo the outermost tool change command with its own temperatures
            {% set me = printer["gcode_macro _PICKUP_SEAT_FAIL"] %}
            {% set cmd = me.outer_cmd if me.outer_cmd|length else "_INDX_CHANGE_TOOL TOOL=%d TEMP=%s SKIP_Z_CORRECTION=%d" % (t, params.TARGET|default(0), params.SKIP_Z_CORRECTION|default(0)|int) %}
            SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=resume_cmd VALUE='"{cmd}"'
            SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=held VALUE=1
            _INDX_LCD LEVEL={'warn' if ambiguous else 'action'} MSG="{('T%d may be on the head' if ambiguous else 'T%d pickup failed: check dock') % t}"
            RESPOND TYPE=error MSG="{why}. Print paused with the heater off. {'Then' if ambiguous else 'Leave T' ~ t ~ ' in its dock and the head empty, then'} RESUME: the tool change runs again and the print continues."
            {% set pm = printer.configfile.settings["gcode_macro pause"] %}
            {pm.rename_existing if pm is defined and pm.rename_existing is defined else "PAUSE"}
            _INDX_PAUSE_STATES
            {% if "indx_api" in printer %}_INDX_EVENT EVENT=stop CHECK=seat PAUSE=1 REASON="{why|replace(';', ',')}"{% endif %}
            # Motors stay on through the hold (_PICKUP_RESUME puts the timeout
            # back) [EL-TC-049]
            SET_IDLE_TIMEOUT TIMEOUT=43200
        {% else %}
            _INDX_LCD LEVEL={'warn' if ambiguous else 'action'} MSG="{('T%d may be on the head' if ambiguous else 'T%d pickup failed: check dock') % t}"
            RESPOND TYPE=error MSG="{why}. Stopped with the heater off.{'' if ambiguous else ' Leave T' ~ t ~ ' in its dock and the head empty. Run INDX_CAL_DOCK_CHECK TOOL=' ~ t ~ ' to inspect the dock and latch before trying again.'}"
            # A misload suspect: ask whether filament was being loaded; the
            # stop is the same either way [EL-TC-009]
            {% if printer["gcode_macro _INDX_CLOSE"].active|int and "gcode_macro _INDX_MISLOAD_CHECK" in printer and printer["gcode_macro _INDX_MISLOAD_CHECK"].suspect|int == t %}
                _INDX_MISLOAD_ASK TOOL={t}
            {% endif %}
            _INDX_RAISE MSG="T{t} pickup failed: not seated, see above"
        {% endif %}
    {% endif %}

[gcode_macro _PICKUP_RESUME]
description: Call first in RESUME when _PICKUP_SEAT_FAIL's held is set: redo the failed tool change, then resume the print
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("INDX: the printer lost its homing while the tool change was held (motors off?). The print cannot continue from here: cancel it.")}
    {% endif %}
    # A pickup position hold (X or Y may have lost steps): not before X and Y
    # were homed again (_INDX_PICKUP_POS_HOMED clears it)
    {% set pph = printer["gcode_macro _INDX_PICKUP_POS_HOLD"].rehome|string %}
    {% if pph %}
        {action_raise_error("INDX: the print was held because X or Y may have lost steps. Home %s first (G28 X Y), then RESUME. The print stays paused." % ("X and Y" if pph|length > 1 else pph|upper))}
    {% endif %}
    _INDX_LCD_CLEAR
    {% set me = printer["gcode_macro _PICKUP_SEAT_FAIL"] %}
    SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=held VALUE=0
    SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=resuming VALUE=1
    SET_IDLE_TIMEOUT TIMEOUT={(printer.configfile.settings.idle_timeout|default({})).timeout|default(600)}
    RESPOND MSG="Redoing the tool change: {me.resume_cmd}"
    {me.resume_cmd}
    _PICKUP_RESUME_END

[gcode_macro _PICKUP_RESUME_END]
description: Inner - the redone tool change finished: resume the print (unless it paused again, or its purge station visit held it)
gcode:
    SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=resuming VALUE=0
    # a station hold in the redo keeps the print paused: its own RESUME
    # (station_resume) goes on from there [EL-PRI-042]
    {% set sr = printer["gcode_macro _INDX_RESUME_HOOK"].station_resume|default("")|string if "gcode_macro _INDX_RESUME_HOOK" in printer else "" %}
    {% if not printer["gcode_macro _PICKUP_SEAT_FAIL"].held|int and not sr %}
        # The print continues from here, not from where the pause saved it
        SAVE_GCODE_STATE NAME=PAUSE_STATE
        _INDX_PAUSE_STATES
        {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=resume{% endif %}
        {% set rm = printer.configfile.settings["gcode_macro resume"] %}
        {rm.rename_existing if rm is defined and rm.rename_existing is defined else "RESUME"}
    {% endif %}

[gcode_macro _PICKUP_FINISH]
description: Inner - seated: apply offsets and filament, record the tool, heat. Nothing while a stop holds the print (the pickup position check)
gcode:
    {% if printer["gcode_macro _INDX_SEAT_CHECK"].ok|int and not printer["gcode_macro _PICKUP_SEAT_FAIL"].held|int and not printer["gcode_macro _INDX_PICKUP_POS_HOLD"].repick|int %}
    {% set t = params.TOOL|int %}

    # No load cell re-zero here: _INDX_PROBE_PREP does it before the next
    # probe; the seat check has weighed the tool [EL-TC-045]

    # Offsets: Z = tool_z + global_z (the babystep widget shows the sum;
    # ADJUST_GLOBAL_Z/SYNC_GLOBAL_Z strip tool_z)
    {% set svv = printer.save_variables.variables %}
    {% set tool_z = svv["t" ~ t ~ "_offset_z"]|default(0.0)|float %}
    {% set global_z = svv.global_z_offset|default(0.0)|float %}
    {% set skip_z = params.SKIP_Z_CORRECTION|default(0)|int %}
    {% set apply_z = global_z if skip_z else (tool_z + global_z) %}
    SET_GCODE_OFFSET X={svv["t"~t~"_offset_x"]|default(0.0)} Y={svv["t"~t~"_offset_y"]|default(0.0)} Z='{"%.3f"|format(apply_z)}' MOVE={0 if ("indx_api" in printer and printer.indx_api.return_none) else 1}
    _INDX_Z_APPLIED Z={"%.4f"|format(apply_z)}

    # The heater model gets this tool's filament [EL-TC-020]
    _APPLY_TOOL_FILAMENT TOOL={t}

    # Save active_tool and count the change once the tool is seated, and
    # before heating: M104/M109 heat nothing while active_tool says the head
    # is empty
    _RECORD_TOOLCHANGE TOOL={t}
    _INDX_DOCK_CONTACT TOOL={t}
    _INDX_LCD_CLEAR
    {% set dropped = printer["gcode_macro _PICKUP_SEAT_RETRY"].dropped|default("")|string %}
    {% if dropped %}
        _INDX_LCD LEVEL=action MSG="{dropped|capitalize} mode off: MODE_{dropped|upper} to restore"
        SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_RETRY VARIABLE=dropped VALUE='""'
    {% endif %}
    {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=after_pickup TOOL={t}{% endif %}

    # Heat last, and wait (M109): the print must not extrude into a cold
    # nozzle. No TARGET (cold calibration pickups): no heating.
    {% if params.TARGET|default(0)|float > 0 %}
        M109 S{params.TARGET|default(0)|float}
    {% endif %}
    {% endif %}

#####################################################################
#  6. HELPER MACROS
#####################################################################

[gcode_macro _RECORD_TOOLCHANGE]
description: Inner - saves active_tool and increments the toolchange counter after every successful pickup
gcode:
    {% set t = params.TOOL|int %}
    # the pickup's latch moves since the lock are not filament [EL-DATA-004]
    _INDX_FIL_ACCOUNT SKIP=1
    _INDX_SET_ACTIVE_TOOL TOOL={t}
    _INDX_SPOOL_ACTIVE
    {% set tc_count = printer.save_variables.variables.toolchange_count|default(0)|int %}
    SAVE_VARIABLE VARIABLE=toolchange_count VALUE={tc_count + 1}
    # and per tool, in memory until the print ends or things are quiet
    _INDX_PICK_COUNT TOOL={t}

[gcode_macro TC_RESET_COUNT]
description: Set the tool change counter to 0. Moves: nothing. Saves: toolchange_count
gcode:
    SAVE_VARIABLE VARIABLE=toolchange_count VALUE=0
    RESPOND MSG="Tool change counter reset to 0"

[gcode_macro _INDX_PART_FAN]
description: Inner - INDX's own use of the part fan (cool-down waits, the prime coast, the cold pull, the tap cue, park cooling): S=0..255, to the part fan chosen in the hardware checks (_INDX_MACHINE part_fan: a [fan_generic] by name, SET_FAN_SPEED), else [fan] or an M106 macro (M106). Does nothing on a machine without a part cooling fan (_INDX_MACHINE part_cooling "none") or without any of them: the nozzle then cools passively, and the callers say so and wait longer
gcode:
    {% set m = printer["gcode_macro _INDX_MACHINE"] if "gcode_macro _INDX_MACHINE" in printer else {} %}
    {% set cfg = printer.configfile.settings %}
    {% set pf = m.part_fan|default("")|string %}
    {% if m.part_cooling|default("not_set") == "none" %}
    {% elif pf and ("fan_generic " ~ pf) in printer %}
        SET_FAN_SPEED FAN={pf} SPEED={"%.3f"|format(params.S|default(0)|int / 255.0)}
    {% elif "fan" in cfg or "gcode_macro m106" in cfg %}
        M106 S{params.S|default(0)|int}
    {% endif %}

[gcode_macro INDX_TEST_ALL_TOOLS]
description: Pick up and park every tool in turn (T0, T1, ...) to prove every dock, then leave the head empty. The first run after the docks were measured goes at 20 % speed (SLOW=1 or SLOW=0 to choose). SETUP=1 (the setup step): asks first, then goes straight on with latch homing and lock force where they are not calibrated yet (INDX Suite, all tools empty). Needs: measured docks (homes if needed). Moves: every dock. Saves: setup progress
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set n = tp.tool_count|int %}
    {% set cal = printer.save_variables.variables.indx_cal|default({}) %}
    {% set slow = params.SLOW|default(0 if cal.tested|default(0)|int else 1)|int %}
    {% set setup = "gcode_macro _INDX_CAL_SET" in printer %}
    {% set chain = setup and params.SETUP|default(0)|int %}
    {% if chain and not params.CONFIRM|default(0)|int %}
        _INDX_SETUP_TC_ASK SLOW={slow}
    {% else %}
        _INDX_PROMPT_END
        {% if setup %}
            _INDX_RUNNING STEP="Tool change test"
        {% endif %}
        RESPOND MSG="INDX > Tool change test: {n} tools{', 20 % speed' if slow else ''}"
        # A test runs every check, also in race mode
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=1
        {% for i in range(n) %}
            RESPOND MSG="INDX >   picking up T{i}"
            _INDX_CHANGE_TOOL TOOL={i} SLOW={slow} COLD=1
            RESPOND MSG="INDX >   parking T{i}"
            PARK_TOOL SLOW={slow}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=0
        {% if setup %}
            _INDX_RUNNING STEP=none
            _INDX_CAL_SET KEY=tested VALUE=1
        {% endif %}
        RESPOND MSG="INDX ok Tool change test passed: every tool picked up and parked, head empty"
        {% if chain %}
            # the setup step goes on: latch homing, then lock force (each its own
            # macro, so each reads what the one before it saved)
            _INDX_SETUP_TC_LATCH
        {% endif %}
    {% endif %}

[gcode_macro TC_CYCLE_ALL]
description: Renamed to INDX_TEST_ALL_TOOLS
gcode:
    _INDX_RENAMED OLD=TC_CYCLE_ALL NEW=INDX_TEST_ALL_TOOLS
    INDX_TEST_ALL_TOOLS {rawparams}

# Calibration macros: indx-cal.cfg, indx_setup.cfg, indx_suite_latch.cfg

[gcode_macro _INDX_PROBE_PREP]
description: Inner - before a probe: re-zero the load cell reference and run the jump test when the tool on the head changed since the last re-zero (FORCE=1: always, G28)
# The reference sets the window each probe's own tare must fall in
# (force_safety_limit): renewed here, not at the pickup [EL-TC-045], with the
# jump test (a lost tool shows as the spring preload missing). zero_tool: the
# tool at the last re-zero (-2: none since the restart).
variable_zero_tool: -2
gcode:
    # Every probe path comes through here: a tool short of the release stops
    # before anything probes [EL-TC-050]
    _INDX_PROBE_GUARD
    {% set me = printer["gcode_macro _INDX_PROBE_PREP"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set cmd = printer["gcode_macro TOOL_POSITIONS"].lc_tare_cmd|default("")|string %}
    {% if cmd|length > 0 and "load_cell_probe" in printer and (params.FORCE|default(0)|int or act != me.zero_tool|int) %}
        _INDX_PICKUP_TARE_BEFORE
        _INDX_LC_TARE
        {% if act >= 0 %}
            _INDX_PICKUP_CHECK TOOL={act}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_INDX_PROBE_PREP VARIABLE=zero_tool VALUE={act}
    {% endif %}

[gcode_macro _INDX_PICKUP_TARE_BEFORE]
description: Inner - remember the load cell reference before the pickup re-zero (_INDX_PICKUP_CHECK compares)
variable_counts: 0.0
variable_valid: 0
gcode:
    {% set lc = printer.load_cell_probe|default({}) %}
    {% set cmd = printer["gcode_macro TOOL_POSITIONS"].lc_tare_cmd|default("")|string %}
    {% if cmd|length > 0 and lc.reference_tare_counts is defined %}
        {% set ref = lc.reference_tare_counts %}
        {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
        SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_TARE_BEFORE VARIABLE=counts VALUE={ref|float}
        SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_TARE_BEFORE VARIABLE=valid VALUE=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_TARE_BEFORE VARIABLE=valid VALUE=0
    {% endif %}

[gcode_macro _INDX_PICKUP_CHECK]
description: Inner - stop if the pickup re-zero says the latch spring preload is missing (pickup failed), before the tool heats
# The re-zero is compared with the last good seated zero (seated): a pickup
# that left the head empty loses the spring preload and jumps. A zero far the
# other way is reported, not kept. The first one after a restart compares
# with the empty-head calibration. [EL-TC-051]
# fail_g: the jump (g, positive) that counts as a failed pickup.
variable_fail_g: 870
variable_seated: 0.0
variable_seated_valid: 0
gcode:
    {% set b = printer["gcode_macro _INDX_PICKUP_TARE_BEFORE"] %}
    {% set me = printer["gcode_macro _INDX_PICKUP_CHECK"] %}
    {% set lc = printer.load_cell_probe|default({}) %}
    {% if b.valid|int and lc.reference_tare_counts is defined and lc.counts_per_gram|default(0)|float > 0 %}
        {% set ref = lc.reference_tare_counts %}
        {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
        {% set cfgl = printer.configfile.settings.load_cell_probe %}
        {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
        {% set base = me.seated|float if me.seated_valid|int else b.counts|float %}
        {% set change = inv * (ref|float - base) / lc.counts_per_gram|float %}
        {% set limit = me.fail_g|float %}
        {% if change >= -limit or not me.seated_valid|int %}
            {% if change <= limit %}
                SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_CHECK VARIABLE=seated VALUE={ref|float}
                SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_CHECK VARIABLE=seated_valid VALUE=1
            {% endif %}
        {% else %}
            RESPOND TYPE=error MSG="T{params.TOOL}: its load cell zero came out {(-change)|round(0)|int} g below the usual seated value (latch still settling, or something pressing on the nozzle). Not kept as the reference; load cell readings with this tool may be off until the next pickup."
        {% endif %}
        # First re-zero after a restart: the calibration zero drifts. A seat
        # check that passed against a fresh empty reading is the proof: the
        # drift is reported and the zero kept [EL-TC-052]
        {% set first_ok = not me.seated_valid|int and printer["gcode_macro _INDX_SEAT_CHECK"].fresh|int and printer["gcode_macro _INDX_SEAT_CHECK"].ok|int %}
        {% if change > limit and first_ok %}
            SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_CHECK VARIABLE=seated VALUE={ref|float}
            SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_CHECK VARIABLE=seated_valid VALUE=1
            RESPOND TYPE=error MSG="INDX ! T{params.TOOL}: the first load cell re-zero since the restart moved {change|round(0)|int} g from the empty-head calibration, while the seat check against an empty-head reading just before passed: the calibration's zero has drifted. Recalibrate when convenient (INDX_CAL_LOADCELL with an empty head)."
        {% endif %}
        # A jump stops before anything heats. The tool stays recorded on the
        # head (an empty record could drive it into a dock); the user confirms.
        {% if change > limit and not first_ok %}
            M104 S0
            SAVE_VARIABLE VARIABLE=tool_unverified VALUE=1
            _INDX_LCD LEVEL=warn MSG="T{params.TOOL} pickup failed? Check head"
            RESPOND TYPE=error MSG="Pickup failed? T{params.TOOL}: the load cell re-zero moved {change|round(0)|int} g, as if the head lost its tool's latch spring preload (a good pickup moves it a few hundred grams at most). Nothing was heated. T{params.TOOL} stays recorded on the head. Check the head and the T{params.TOOL} dock; with T{params.TOOL} seated, carry on (INDX_SEAT_TOOL_BY_HAND TOOL={params.TOOL} LOCKED=1); with the head empty, INDX_RELEASE_TOOL_BY_HAND."
            _INDX_RAISE MSG="Pickup failed? T{params.TOOL}: load cell re-zero moved {change|round(0)|int} g, see above"
        {% endif %}
    {% endif %}

[gcode_macro _INDX_SEAT_CHECK]
description: Inner - end of a pickup: does the load cell see a tool on the head? Stores ok and force_g
# Absolute check against the empty-head calibration: a seated tool adds its
# spring preload. Threshold: home_min_force_g; no load cell: always ok. A
# short lock fails unless the weight passes latch_lock_pass_g. [EL-TC-053]
variable_ok: 1
variable_force_g: 0.0
variable_lock_short: 0
variable_ambiguous: 0
variable_allow_short: 0
variable_dock_skew_g: None
# reason: why the check stopped on a reading the wrong way or a lock far over
# the clamp ("" otherwise); _PICKUP_SEAT_FAIL shows it
variable_reason: ""
# fresh: this check weighed against an empty-head reading taken just before
# the pickup (drift-free), not against the calibration
variable_fresh: 0
# last_tool: the tool this check last weighed (printer.indx_api last_pickup)
variable_last_tool: -1
# loose_g: the loose tool level this check used (the retry reads it)
variable_loose_g: 250.0
gcode:
    {% set lc = printer.load_cell_probe|default({}) %}
    {% set ns = namespace(ok=1, force=0.0, reason="") %}
    {% if lc.counts_per_gram|default(0)|float > 0 and lc.force_g is defined and lc.force_g is not none %}
        {% set cfgl = printer.configfile.settings.load_cell_probe %}
        {% set ref = cfgl.reference_tare_counts %}
        {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
        {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
        {% set ns.force = lc.force_g|float + inv * (lc.tare_counts|float - ref|float) / lc.counts_per_gram|float %}
        # Against the empty-head reading taken at the trigger line just before
        # this pickup when there is one (drift-free), else the calibration
        {% set e = printer["gcode_macro _INDX_LC_STORE"] %}
        {% if e.empty_valid|int %}
            {% set ns.force = ns.force - e.empty_g|float %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=fresh VALUE={1 if e.empty_valid|int else 0}
        {% set min_g = printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(590.0)|float %}
        # Signed: a seated tool reads seat_sign * at least min_g. As much the
        # other way is something else on or against the head: stop below.
        {% set sgn = printer["gcode_macro _INDX_CONSTANTS"].seat_sign|default(-1)|float %}
        {% set ns.ok = 1 if ns.force * sgn >= min_g else 0 %}
        {% if ns.force * sgn <= -min_g %}
            {% set ns.reason = "T%d: the load cell reads %+d g against the empty head, the wrong direction for a seated tool (a seated tool reads %+d g or more). Something is pressing on the head or the tool is caught. Check the head and the T%d dock. If T%d is seated, carry on (INDX_SEAT_TOOL_BY_HAND TOOL=%d LOCKED=1). If the head is empty, run INDX_RELEASE_TOOL_BY_HAND" % (params.TOOL|int, ns.force, sgn * min_g, params.TOOL|int, params.TOOL|int, params.TOOL|int) %}
        {% endif %}
    {% endif %}
    # An empty tool's force lock far above its own clamp pressed on something
    {% set lm = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set svv = printer.save_variables.variables %}
    {% set loaded = svv["t%d_material" % params.TOOL|int]|default("")|string|length > 0 %}
    {% set tcl = svv["t%d_lock_clamp_g" % params.TOOL|int]|default(none) %}
    # Not calibrated yet (also during INDX_CAL_LOCK): checked against 2000 g,
    # above the highest clamp, not the lock force default [EL-TC-054]
    {% set clamp = (tcl if tcl is not none else [printer["gcode_macro _INDX_CONSTANTS"].latch_lock_force_g|default(1390)|float, 2000.0]|max)|float %}
    {% set over = printer["gcode_macro _INDX_CONSTANTS"].latch_over_force_mult|default(2.0)|float * clamp %}
    {% if not ns.reason and not loaded and lm.lock_force|int >= 0 and lm.lock_force_g|float|abs > over %}
        {% set ns.reason = "T%d: the lock read %d g against the empty head, more than %.0f times the clamp of this empty tool (%d g): the latch pressed on something instead of clamping the tool. Check the latch, the T%d pin and its dock before anything moves. If T%d is seated, carry on (INDX_SEAT_TOOL_BY_HAND TOOL=%d LOCKED=1). If the head is empty, run INDX_RELEASE_TOOL_BY_HAND" % (params.TOOL|int, lm.lock_force_g|float, over / clamp, clamp, params.TOOL|int, params.TOOL|int, params.TOOL|int) %}
    {% endif %}
    {% if ns.reason %}
        {% set ns.ok = 0 %}
    {% endif %}
    # Dock skew: weight out of the dock minus in it; less in the dock: the dock
    # sits too high and carries the tool [EL-TC-055]
    {% set e = printer["gcode_macro _INDX_LC_STORE"] %}
    {% set skew = (ns.force|abs - (e.indock_g|float - e.empty_g|float)|abs) if (e.indock_valid|int and e.empty_valid|int and ns.force|abs > 0) else none %}
    {% set skew_warn = printer["gcode_macro _INDX_CONSTANTS"].dock_skew_warn_g|default(350)|float %}
    # Not after a frozen lock: the gears push on the plug in the dock [EL-TC-055]
    {% set frozen = printer["gcode_macro _INDX_LOCK_PAST"].frozen|default(0)|int if "gcode_macro _INDX_LOCK_PAST" in printer else 0 %}
    {% if skew is not none and skew|abs >= skew_warn and not frozen %}
        # Information only: it says more about the dock Y than its Z [EL-TC-055]
        RESPOND MSG="INDX > Dock T{params.TOOL}: with the tool locked in the dock the load cell read {skew|abs|round(0)|int} g {'less' if skew > 0 else 'more'} than once the tool was out (information; INDX_DOCK_CHECK compares all docks)."
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=dock_skew_g VALUE={skew|round(0) if skew is not none else 'None'}
    # Stick indicator, no extra wait [EL-TC-073]: this pickup's empty head for
    # its park to compare; relax: its own empty reading against the last
    # good park's (the head stood empty in between)
    {% set now = printer.toolhead.estimated_print_time|default(0)|float %}
    {% set relax = (e.empty_g|float - e.park_g|float) if (e.empty_valid|int and e.park_valid|int and not e.empty_park|int) else none %}
    {% if e.empty_valid|int %}
        SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=pick_g VALUE={e.empty_g|float}
        SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=pick_at VALUE={now}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=pick_tool VALUE={params.TOOL|int if e.empty_valid|int else -1}
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=indock_valid VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_valid VALUE=0
    # lock_force: 1 reached, 0 did not, -1 not a force lock (unknown)
    {% set short = 1 if printer["gcode_macro _INDX_LOCK_MARK"].lock_force|int == 0 else 0 %}
    # The lock reached its lock target but the weight says no tool:
    # something is on the head, so this is not treated as an empty head
    {% set ambiguous = 1 if not ns.ok and printer["gcode_macro _INDX_LOCK_MARK"].lock_force|int == 1 else 0 %}
    # allow_short: INDX_CAL_LOADCELL_REFINE's pickups may lock to the travel
    # limit (the weight must still confirm). Counted down, cleared on any
    # failure, so an aborted refinement never leaves it on. [EL-TC-053]
    {% set lc_ok = lc.counts_per_gram|default(0)|float > 0 and lc.force_g is defined and lc.force_g is not none %}
    {% set allow = printer["gcode_macro _INDX_SEAT_CHECK"].allow_short|int %}
    {% set weight_seated = lc_ok and ns.ok %}
    # A short lock passes from latch_lock_pass_g [EL-TC-053]
    {% set pass_g = printer["gcode_macro _INDX_CONSTANTS"].latch_lock_pass_g|default(710)|float %}
    # A calibrated tool's own pass level (never under latch_lock_pass_g): its
    # lower lock target alone does not prove the seat. Not while calibrating.
    {% set tpass = printer.save_variables.variables["t%d_pass_g" % params.TOOL|int]|default(none) %}
    {% if tpass is not none and not allow %}
        {% set pass_g = [tpass|float, pass_g]|max %}
    {% else %}
        {% set tpass = none %}
    {% endif %}
    # and never within 5.2 sigma plus the stick of a partly seated tool [EL-TC-074]
    {% set tseat = printer.save_variables.variables["t%d_seat_g" % params.TOOL|int]|default(none) %}
    {% if tseat is not none and not allow %}
        {% set cst = printer["gcode_macro _INDX_CONSTANTS"] %}
        {% set part = cst.seat_partial_frac|default(0.56)|float * tseat|float|abs + 5.2 * cst.lc_pair_sigma_g|default(25)|float + printer["gcode_macro TOOL_POSITIONS"].lc_stick_g|default(80.0)|float %}
        {% set pass_g = [pass_g, part|round(0)]|max %}
    {% endif %}
    {% set strong = weight_seated and ns.force * printer["gcode_macro _INDX_CONSTANTS"].seat_sign|default(-1)|float >= pass_g %}
    # Two levels [EL-TC-056]: a lock that reached its target only needs the
    # confirm level (t<n>_confirm_g, never under home_min_force_g); a short or
    # unsensed lock needs the strict pass level above.
    {% set tconf = printer.save_variables.variables["t%d_confirm_g" % params.TOOL|int]|default(none) %}
    {% set conf_g = [tconf|float if tconf is not none else ((tpass|float * 50.0 / 68.0) if tpass is not none else 0.0), printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(590.0)|float]|max %}
    {% set confirmed = weight_seated and printer["gcode_macro _INDX_LOCK_MARK"].lock_force|int == 1 and ns.force * printer["gcode_macro _INDX_CONSTANTS"].seat_sign|default(-1)|float >= conf_g %}
    # Close after the peel: an empty tool whose close out of the dock did not reach its
    # calibrated peak (_INDX_CLOSE_DONE) fails, whatever the weight
    {% set cl = printer["gcode_macro _INDX_CLOSE"] %}
    {% set close_fail = cl.active|int and cl.fail|int %}
    {% set fails = ((short or tpass is not none) and not strong and not confirmed) or close_fail %}
    {% if short and strong %}
        RESPOND MSG="INDX > T{params.TOOL}: the latch reached its travel limit before the lock force target; seated at {ns.force|round(0)|int} g out of the dock (passes from {pass_g|int} g)"
    {% endif %}
    {% if fails and not (allow and weight_seated) %}
        {% set ns.ok = 0 %}
    {% endif %}
    # A failed check with a weight that says a tool is there: never an empty
    # head; stop and ask [EL-TC-053]
    {% if fails and weight_seated and not ns.ok %}
        {% set ambiguous = 1 %}
    {% endif %}
    # A reading the wrong way or a lock far over the clamp: something is on or
    # against the head. Never an empty head: stop and ask.
    {% if ns.reason %}
        {% set ambiguous = 1 %}
        {% set ns.ok = 0 %}
    {% endif %}
    # The loose level or more the seated way: a tool hangs loose on the head.
    # Never an empty head: stop and ask [EL-TC-057, EL-TC-074]
    {% set cl0 = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set loose = cl0.retry_empty_max_g|default(250)|float %}
    {% set tseat0 = printer.save_variables.variables["t%d_seat_g" % params.TOOL|int]|default(none) %}
    {% if tseat0 is not none and tseat0|float|abs > 0 %}
        {% set loose = [[loose, (cl0.loose_seat_frac|default(0.20)|float * tseat0|float|abs - 5.2 * cl0.lc_pair_sigma_g|default(25)|float - printer["gcode_macro TOOL_POSITIONS"].lc_stick_g|default(80.0)|float)|round(0)]|min, 0.0]|max %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=loose_g VALUE={loose}
    {% if not ns.ok and lc_ok and ns.force * printer["gcode_macro _INDX_CONSTANTS"].seat_sign|default(-1)|float >= loose %}
        {% set ambiguous = 1 %}
    {% endif %}
    # a quote or a ; in the text would break this line (Klipper cuts at ;)
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=reason VALUE='"{ns.reason|replace("'", "")|replace('"', '')|replace(";", ",")}"'
    {% if ns.ok and lc_ok %}
        SAVE_VARIABLE VARIABLE=tool_unverified VALUE=0
        {% if printer.save_variables.variables.seat_suspect|default(-1)|int >= 0 %}
            SAVE_VARIABLE VARIABLE=seat_suspect VALUE=-1
            SAVE_VARIABLE VARIABLE=tc_busy VALUE=0
        {% endif %}
        RESPOND MSG="T{params.TOOL} seated: load cell {ns.force|round(0)|int} g against the empty head"
        {% if fails and allow %}
            RESPOND MSG="INDX > T{params.TOOL}: lock at the travel limit, taken for the load cell refinement"
        {% endif %}
    {% endif %}
    {% if "indx_clog" in printer %}
        {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
        INDX_SUPPORT_LOG PICKUP=1 TOOL={params.TOOL|int} SEAT_G={"%.0f"|format(ns.force)} LOCK_G={"%.0f"|format(m.lock_force_g|float)} LOCK_POS={"%.2f"|format(m.lock_pos|float)} LOCK_FORCE={m.lock_force|int} OK={ns.ok} SHORT={short} AMBIGUOUS={ambiguous} LATCH_STOP={"%.3f"|format(printer["gcode_macro _INDX_LATCH_HOME"].stop_mm|float)} BUILT={"%.0f"|format(printer["gcode_macro _INDX_LOCK_FORCE"].built_g|float)} SKEW={"%.0f"|format(skew) if skew is not none else -99999} PUSH={"%.0f"|format(printer["gcode_macro _INDX_LOCK_FORCE"].push_g|float)} FAST={1 if ("indx_tc_fast" in printer and printer.indx_tc_fast.enabled) else 0} EMPTY={"%.0f"|format(e.empty_g|float) if e.empty_valid|int else -99999} EMPTY_PARK={e.empty_park|int} RELAX={"%.0f"|format(relax) if relax is not none else -99999} RELAX_S={"%.0f"|format(now - e.park_at|float) if relax is not none else -1}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=allow_short VALUE={[allow - 1, 0]|max if ns.ok else 0}
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=lock_short VALUE={short}
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=ambiguous VALUE={ambiguous}
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=ok VALUE={ns.ok}
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=force_g VALUE={ns.force}
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=last_tool VALUE={params.TOOL|int}
    SET_GCODE_VARIABLE MACRO=_INDX_CLOSE VARIABLE=active VALUE=0

[gcode_macro _INDX_SEAT_SKIP]
description: Inner - race mode: no seat check; count the pickup as seated so _PICKUP_FINISH carries on
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=indock_valid VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_valid VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=pick_tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=lock_short VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=ambiguous VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=ok VALUE=1
    # Recorded, not proven: the next G28 checks it first [EL-TC-058]
    SAVE_VARIABLE VARIABLE=tool_unverified VALUE=1
    RESPOND MSG="T{params.TOOL} picked up (race mode: seat not checked)"

[gcode_macro _INDX_INDOCK]
description: Inner - how many of the next pickups read the load cell in the dock (left=); the dock tools set it, a normal tool change leaves it at 0
variable_left: 0
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_INDOCK VARIABLE=left VALUE={params.LEFT|default(0)|int}

[gcode_macro _INDX_LC_STORE]
description: Inner - store the load cell reading (against the empty-head calibration) as the empty, seated or in-dock reference, VAR=empty|seated|indock
# Taken standing still just before the check that uses it, so thermal drift
# drops out [EL-TC-071]
variable_empty_g: 0.0
variable_empty_valid: 0
variable_seated_g: 0.0
variable_seated_valid: 0
variable_indock_g: 0.0
variable_indock_valid: 0
# empty_from_park: the park check of a CHANGE_TOOL stored the empty head as
# empty_g; the pickup that follows uses it (cleared there)
variable_empty_from_park: 0
# Stick indicator [EL-TC-073]: empty-head readings on either side of a load,
# against the calibration zero, for the support log. empty_park: this
# pickup's empty_g came from the park check. pick_*: the empty head the last
# pickup of pick_tool weighed against (at: print time); its park compares.
# park_*: the empty head after the last good park; a pickup with its own
# reading compares.
variable_empty_park: 0
variable_pick_g: 0.0
variable_pick_tool: -1
variable_pick_at: 0.0
variable_park_g: 0.0
variable_park_valid: 0
variable_park_at: 0.0
gcode:
    {% set var = params.VAR|lower %}
    {% set lc = printer.load_cell_probe|default({}) %}
    # WINDOW=1: the mean of this reading's [indx_tc_fast] window instead of
    # the status (same zero: the tare does not change in between)
    {% set w = printer.indx_tc_fast.windows[var]|default(none) if params.WINDOW|default(0)|int and ("indx_tc_fast" in printer and printer.indx_tc_fast.enabled) else none %}
    {% if lc.counts_per_gram|default(0)|float > 0 and lc.force_g is defined and lc.force_g is not none %}
        {% set cfgl = printer.configfile.settings.load_cell_probe %}
        {% set ref = cfgl.reference_tare_counts %}
        {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
        {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
        {% set f = w if w is not none else lc.force_g %}
        {% set g = f|float + inv * (lc.tare_counts|float - ref|float) / lc.counts_per_gram|float %}
        SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE={var}_g VALUE={g}
        SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE={var}_valid VALUE=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE={var}_valid VALUE=0
    {% endif %}

[gcode_macro _INDX_LC_FROM_WINDOW]
description: Inner - store the VAR= load cell reading from its [indx_tc_fast] window when one was taken (waits for its samples; none stops the change)
gcode:
    {% set var = params.VAR|lower %}
    {% if ("indx_tc_fast" in printer and printer.indx_tc_fast.enabled) and var in printer.indx_tc_fast.open %}
        INDX_LC_WINDOW_GET NAME={var}
        _INDX_LC_STORE VAR={var} WINDOW=1
    {% endif %}

[gcode_macro _INDX_TMC_RESTORE]
description: Inner - on a stop: the latch driver back to run current and spreadCycle if [indx_tc_fast] switched it
gcode:
    {% if ("indx_tc_fast" in printer and printer.indx_tc_fast.enabled) %}
        INDX_TMC_AT RESTORE=1
    {% endif %}

[gcode_macro _INDX_PARK_CHECK]
description: Inner - after a park: did the load cell move by about the tool's preload? If not the tool may still be on the head: stop, heater off, tool kept as active. A dock with an ooze stopper (t<n>_ooze_stopper) is checked against its own recorded normal once it has one, never above min_change_g and never under stopper_floor_g plus the load cell stick allowance (lc_stick_g)
# A released tool moves the reading by its preload; both readings are seconds
# apart at the same spot. min_change_g: the least change (g), never under
# stopper_floor_g plus the stick allowance below [EL-TC-059, EL-TC-074]
variable_min_change_g: 380
# Ooze stopper docks (a stopper can hold the nozzle): their own normal, the
# median of recent good parks less 5.2 sigma (upper 95 % bound), once
# stopper_min_n are recorded; never above min_change_g, never under
# stopper_floor_g (g). Only parks passing min_change_g are recorded, so the
# band never teaches itself downward. [EL-TC-031]
# Both sides carry the load cell stick (TOOL_POSITIONS lc_stick_g): the band
# is lowered by it (a stuck session reads every park lower) and the floor
# raised by it (a tool left on the head can read that much more). [EL-TC-073]
variable_stopper_floor_g: 300
variable_stopper_min_n: 10
variable_stopper_keep: 20
# last_tool, last_g: the last park check's tool and load cell change, last_limit_g
# the limit it was held to (printer.indx_api)
variable_last_tool: -1
variable_last_g: None
variable_last_limit_g: 380
gcode:
    {% set t = params.TOOL|int %}
    {% set e = printer["gcode_macro _INDX_LC_STORE"] %}
    {% set lc = printer.load_cell_probe|default({}) %}
    {% if e.seated_valid|int and lc.counts_per_gram|default(0)|float > 0 and lc.force_g is defined and lc.force_g is not none %}
        {% set cfgl = printer.configfile.settings.load_cell_probe %}
        {% set ref = cfgl.reference_tare_counts %}
        {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
        {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
        {% set g = lc.force_g|float + inv * (lc.tare_counts|float - ref|float) / lc.counts_per_gram|float %}
        {% set change = g - e.seated_g|float %}
        # The dock's own record: {"n": the tool's name, "cpg": counts per
        # gram, "g": the last parks}. Another tool in the dock (its own
        # spring) or another load cell calibration: none yet
        {% set svv = printer.save_variables.variables %}
        {% set stopper = svv["t%d_ooze_stopper" % t]|default(0)|int %}
        {% set name = svv["t%d_name" % t]|default("")|string %}
        {% set cpg = lc.counts_per_gram|float %}
        {% set rec = svv["t%d_park_g" % t]|default({}) if stopper else {} %}
        {% set rec = rec if rec is mapping else {} %}
        {% set same = rec.get("n", "")|string == name and rec.get("cpg", 0)|float > 0 and (rec.get("cpg", 0)|float / cpg - 1.0)|abs <= 0.005 %}
        {% set hist = rec.get("g", [])|list if same else [] %}
        {% set stick = printer["gcode_macro TOOL_POSITIONS"].lc_stick_g|default(80.0)|float %}
        {% set floor = stopper_floor_g|float + stick %}
        # the usual limit: a tool left on the head can read the floor too
        {% set usual = [min_change_g|float, floor]|max %}
        {% set lim = namespace(g=usual, med=0.0, own=0.0, n=hist|length) %}
        {% if stopper and lim.n >= [stopper_min_n|int, 10]|max %}
            {% set v = hist|map("float")|list|sort %}
            {% set k = lim.n - 1 %}
            {% set lim.med = v[lim.n // 2] if lim.n % 2 else (v[lim.n // 2 - 1] + v[lim.n // 2]) / 2.0 %}
            {% set mean = (v|sum) / lim.n %}
            {% set acc = namespace(q=0.0) %}
            {% for x in v %}{% set acc.q = acc.q + (x - mean) ** 2 %}{% endfor %}
            # sigma at its upper 95 % bound: s x sqrt(k / chi2(0.05, k)),
            # the chi-square quantile by Wilson-Hilferty (k >= 9 here)
            {% set wh = 1.0 - 2.0 / (9.0 * k) - 1.6449 * (2.0 / (9.0 * k)) ** 0.5 %}
            {% set sd_up = (acc.q / k) ** 0.5 / wh ** 1.5 %}
            {% set lim.own = lim.med - 5.2 * sd_up - stick %}
            {% set lim.g = [[lim.own, floor]|max, usual]|min %}
        {% endif %}
        {% set ok = change|abs >= lim.g %}
        # Stick indicator [EL-TC-073]: the empty head now against the one this
        # tool's pickup weighed against; both empty, one load in between
        {% set now = printer.toolhead.estimated_print_time|default(0)|float %}
        {% set stick_g = (g - e.pick_g|float) if (ok and e.pick_tool|int == t) else none %}
        SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=pick_tool VALUE=-1
        {% if ok %}
            SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=park_g VALUE={g}
            SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=park_valid VALUE=1
            SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=park_at VALUE={now}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=park_valid VALUE=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=seated_valid VALUE=0
        # the last park for printer.indx_api (last_park)
        SET_GCODE_VARIABLE MACRO=_INDX_PARK_CHECK VARIABLE=last_g VALUE={change}
        SET_GCODE_VARIABLE MACRO=_INDX_PARK_CHECK VARIABLE=last_tool VALUE={t}
        SET_GCODE_VARIABLE MACRO=_INDX_PARK_CHECK VARIABLE=last_limit_g VALUE={lim.g|round(1)}
        # every park in the support log: the change, the limit, the stopper flag
        {% if "indx_api" in printer %}_INDX_PARK_LOG TOOL={t} G={"%.1f"|format(change)} LIMIT={"%.1f"|format(lim.g)} STOPPER={stopper} OK={1 if ok else 0} N={lim.n}{(" EMPTY=%.1f" % g) if ok else ""}{(" STICK=%.1f STICK_S=%.0f" % (stick_g, now - e.pick_at|float)) if stick_g is not none else ""}{% endif %}
        {% if ok and stopper and change|abs >= usual %}
            {% set keep = [stopper_keep|int, stopper_min_n|int, 10]|max %}
            {% set nrec = {"n": name, "cpg": cpg|round(4), "g": (hist + [change|abs|round(1)])[-keep:]} %}
            SAVE_VARIABLE VARIABLE=t{t}_park_g VALUE="{nrec}"
        {% elif ok and change|abs < usual %}
            RESPOND MSG="INDX > T{t} park: the load cell changed {change|abs|round(0)|int} g, under the usual {usual|round(0)|int} g but inside its ooze stopper dock's own normal (median {lim.med|round(0)|int} g of {lim.n} parks, limit {lim.g|round(0)|int} g)."
        {% endif %}
        {% if ok and params.CHANGE|default(0)|int %}
            # The tool left the head: this reading (head empty, standing
            # still) is also the empty-head reading of the pickup that follows
            SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_g VALUE={g}
            SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_valid VALUE=1
            SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_from_park VALUE=1
        {% endif %}
        {% if not ok %}
            M104 S0
            # The tool is still on the head, latch locked: record it locked
            # again, or the next park skips the dance [EL-TC-034]
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=0
            SAVE_VARIABLE VARIABLE=toolhead_state VALUE=0
            SAVE_VARIABLE VARIABLE=tool_unverified VALUE=1
            _INDX_TMC_RESTORE
            _INDX_LCD LEVEL=warn MSG="T{t} may still be on the head"
            {% set why = (" The T%d dock has an ooze stopper: the check used its own normal (median %d g of %d parks), limit %d g." % (t, lim.med|round(0)|int, lim.n, lim.g|round(0)|int)) if lim.g < usual else ((" The T%d dock has an ooze stopper: %d of %d parks recorded for its own normal, the usual limit %d g until then." % (t, lim.n, [stopper_min_n|int, 10]|max, usual|round(0)|int)) if stopper else "") %}
            RESPOND TYPE=error MSG="T{t} may still be on the head: the load cell changed only {change|round(0)|int} g at the park (a released tool changes it by its preload, about 1100 to 1900 g). Stopped with the heater off and T{t} kept as the tool on the head. Check the head. If the heater also reported a model divergence, a blob from a detached print may be stuck on the nozzle.{why}"
            _INDX_RAISE MSG="T{t} may still be on the head after the park, see above"
        {% endif %}
    {% endif %}

[gcode_macro _INDX_PARK_HANG_CHECK]
description: Inner - after a park that opened the latch fully (INDX Suite): the latch homing must find its opening stop where it always is. Far from it, or no stop with a calibrated latch homing, the open did not run free: the tool may still hang on the head, unclamped. Stop, heater off, the tool kept as active and as a suspect (G28 Z, CHANGE_TOOL and PARK_TOOL refuse until a by-hand command)
# The full open drives the latch onto its opening stop, so after a good park
# the homing finds it at once (inside the band of _INDX_LATCH_HOME_OPEN). A
# park that missed its dock leaves the tool hanging on the head and the open
# loses steps against it. The park check cannot see that: a tool hanging
# unclamped reads like an empty head. No extra motion. [EL-TC-075]
gcode:
    {% set t = params.TOOL|int %}
    {% set lh = printer["gcode_macro _INDX_LATCH_HOME"] %}
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set cal = printer.save_variables.variables.latch_sg_stop|default(none) is not none %}
    {% set far = lh.out_of_band|int == 1 %}
    {% set lost = lh.stop_mm|float < 0 and not lh.at_open|int and cal %}
    {% if t >= 0 and "tmc_sg_log" in printer and (far or lost) %}
        {% set band = c.latch_home_expect_mm|default(0.65)|float + c.latch_home_band_mm|default(1.35)|float %}
        {% set seen = ("found its opening stop %.2f mm into its search (after a park within %.2f mm)" % (lh.stop_mm|float, band)) if far else "found no stop" %}
        M104 S0
        # The tool may be on the head: recorded there, latch open, suspect
        _INDX_SET_ACTIVE_TOOL TOOL={t}
        _INDX_SPOOL_ACTIVE
        SAVE_VARIABLE VARIABLE=tool_unverified VALUE=1
        SAVE_VARIABLE VARIABLE=seat_suspect VALUE={t}
        SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=park_valid VALUE=0
        _INDX_LCD LEVEL=warn MSG="T{t} may hang on the head"
        RESPOND TYPE=error MSG="T{t} may still hang on the head: after the park the latch homing {seen}, so the latch did not open freely. The park may have missed the T{t} dock (lost X/Y steps or a wrong X/Y home) and left T{t} hanging unclamped on the head, which the load cell cannot tell from an empty head. Stopped with the heater off and T{t} kept as the tool on the head. Look at the head and the T{t} dock before anything moves. T{t} hanging on the head: hold it, INDX_RELEASE_TOOL_BY_HAND, put T{t} in its dock by hand. T{t} in its dock and the head empty: INDX_FORGET_TOOL. Then G28 X Y before the next tool change."
        _INDX_NOTE LEVEL=stop TITLE="T{t} may hang on the head" MSG="After the park the latch homing {seen}. Look at the head before anything moves."
        _INDX_RAISE MSG="T{t} may still hang on the head after the park, see above"
    {% endif %}

[gcode_macro _INDX_NOTE]
description: Inner - a notification that needs the user (LEVEL=stop|warn|info TITLE= MSG=): INDX_NOTIFY when the INDX notification module is loaded (the page bell, Moonraker's notifier, Mobileraker), otherwise Mobileraker straight from the macro when it is installed. The callers write the console and the display themselves
# Not Moonraker's notifier from here: its remote method errors when no
# notifier is configured, and that would stop the macro that called this.
gcode:
    {% set lvl = params.LEVEL|default("info")|lower %}
    {% if "indx_preflight" in printer %}
        INDX_NOTIFY LEVEL={lvl} TITLE="{params.TITLE|default('INDX')}" MSG="{params.MSG|default('')}"
    {% elif "gcode_macro MR_NOTIFY" in printer %}
        MR_NOTIFY TITLE="INDX" MESSAGE="{params.TITLE|default('INDX')}: {params.MSG|default('')}"
    {% endif %}
    {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=notify LEVEL={lvl} TITLE="{params.TITLE|default('INDX')|replace(';', ',')}" MSG="{params.MSG|default('')|replace(';', ',')}"{% endif %}

[gcode_macro _INDX_LCD]
description: Show an INDX alert on the printer display (M117). LEVEL=warn: dangerous to ignore; LEVEL=action: you need to do something. Everything else stays in the console only
# The display line is short (about 40 characters); the console has the rest.
# Cleared after a good pickup, G28 or RESUME, only if INDX put it there.
variable_shown: 0
gcode:
    {% set lvl = params.LEVEL|default("action")|lower %}
    M117 {"! " if lvl == "warn" else "> "}{params.MSG|default("INDX: see console")}
    SET_GCODE_VARIABLE MACRO=_INDX_LCD VARIABLE=shown VALUE=1

[gcode_macro _INDX_LCD_CLEAR]
description: Inner - clear the display line if it shows an INDX alert
gcode:
    {% if printer["gcode_macro _INDX_LCD"].shown|int %}
        M117
        SET_GCODE_VARIABLE MACRO=_INDX_LCD VARIABLE=shown VALUE=0
    {% endif %}

[gcode_macro _INDX_PROMPT]
description: Inner - show a dialog with buttons (action:prompt: Mainsail, Fluidd, KlipperScreen, the INDX page) and print the same choices as plain commands in the console. TITLE= TEXT= LINES= one short line per item separated by ^ (a list on the INDX page) TEXT2..TEXT5= B1..B6="Label|COMMAND|color" G1..G3= a row of buttons separated by ^, F1 F2= footer buttons
# Titles fit in 28 characters. Labels say what happens, one decision per
# dialog, nothing closes by itself;
# every button's command is also printed for console users. Values cannot
# contain double quotes, | (in a label), # ; or *. Colors: primary,
# secondary, info, warning, error.
gcode:
    {% set title = params.TITLE|default("INDX") %}
    {% set ns = namespace(texts=[], buttons=[], footer=[], groups=[]) %}
    {% for k in ["TEXT", "LINES", "TEXT2", "TEXT3", "TEXT4", "TEXT5"] %}
        {% if params[k] is defined and params[k]|length %}
            {% set ns.texts = ns.texts + (params[k].split("^") if k == "LINES" else [params[k]]) %}
        {% endif %}
    {% endfor %}
    {% for k in ["B1", "B2", "B3", "B4", "B5", "B6"] %}
        {% if params[k] is defined and params[k]|length %}
            {% set ns.buttons = ns.buttons + [params[k]] %}
        {% endif %}
    {% endfor %}
    {% for k in ["F1", "F2"] %}
        {% if params[k] is defined and params[k]|length %}
            {% set ns.footer = ns.footer + [params[k]] %}
        {% endif %}
    {% endfor %}
    {% for k in ["G1", "G2", "G3"] %}
        {% if params[k] is defined and params[k]|length %}
            {% set ns.groups = ns.groups + [params[k].split("^")] %}
        {% endif %}
    {% endfor %}
    # Mainsail cuts a dialog title at about 30 characters: a longer one keeps
    # the part before ": " as the title and opens the text with the rest, or
    # opens the text with the whole title under "INDX" [EL-UI-015]
    {% set ns2 = namespace(title=title) %}
    {% if title|length > 28 %}
        {% set head = title.split(": ", 1) %}
        {% if head|length == 2 and head[0]|length <= 28 %}
            {% set ns.texts = [head[1]] + ns.texts %}
            {% set ns2.title = head[0] %}
        {% else %}
            {% set ns.texts = [title] + ns.texts %}
            {% set ns2.title = "INDX" %}
        {% endif %}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin {ns2.title}"
    {% for t in ns.texts %}
    RESPOND TYPE=command MSG="action:prompt_text {t}"
    {% endfor %}
    {% for g in ns.groups %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% for b in g %}
    RESPOND TYPE=command MSG="action:prompt_button {b}"
        {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    {% endfor %}
    {% for b in ns.buttons %}
    RESPOND TYPE=command MSG="action:prompt_button {b}"
    {% endfor %}
    {% for b in ns.footer %}
    RESPOND TYPE=command MSG="action:prompt_footer_button {b}"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_show"
    RESPOND MSG="INDX > {title}"
    {% for t in ns.texts %}
    RESPOND MSG="INDX >   {t}"
    {% endfor %}
    {% for b in (ns.groups|sum(start=[])) + ns.buttons + ns.footer %}
        {% set p = b.split("|") %}
    RESPOND MSG="INDX >   [{p[0]}]  {p[1] if p|length > 1 else ''}"
    {% endfor %}

[gcode_macro _INDX_PROMPT_END]
description: Inner - close an INDX dialog (the Close and Cancel buttons)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro _INDX_DO]
description: Inner - a dialog button: close the dialog, then run CMD (~ stands for a space)
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {params.CMD|default("")|replace("~", " ")}

[gcode_macro _INDX_RAISE]
description: Inner - raise an error from its own macro, so the commands before it (heater off, messages) still run; inside G28 it first undoes the provisional Z home
# Inside G28 it leaves the machine as _INDX_HOME_Z_FAIL would: homing_busy
# cleared, a Z only marked homed at the hop height un-homed [EL-TC-016]. The
# raise is a separate macro: a template raises while it renders.
gcode:
    {% if "gcode_macro _INDX_CAM_SWITCH" in printer %}
        SET_GCODE_VARIABLE MACRO=_INDX_CAM_SWITCH VARIABLE=keep_on VALUE=0
    {% endif %}
    # A stop in a race mode tool change: back to normal, every check on
    _INDX_RACE_DROP
    # A stop in a slow change (new dock, SLOW=1): slow moves off and the [EL-TC-084]
    # printer's speed limits back; any other stop keeps the limits it found
    {% if printer["gcode_macro _TOOLCHANGE_VARS"].slow|default(0)|int %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=change_busy VALUE=0
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=slow VALUE=0
    {% if "gcode_macro _INDX_MISLOAD_CHECK" in printer %}SET_GCODE_VARIABLE MACRO=_INDX_MISLOAD_CHECK VARIABLE=armed VALUE=-1{% endif %}
    # the latch driver back to run current and its own mode [EL-TC-060]
    _INDX_TMC_RESTORE
    # a stop leaves the state INDX recorded for it: not an interrupted change
    {% if printer.save_variables.variables.tc_busy|default(0)|int %}
        SAVE_VARIABLE VARIABLE=tc_busy VALUE=0
    {% endif %}
    # Readings taken for this change are not for a later one [EL-TC-021]
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_from_park VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LC_STORE VARIABLE=empty_valid VALUE=0
    {% if printer["gcode_macro _TOOLCHANGE_VARS"].homing_busy|default(0)|int %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
    {% endif %}
    # Whatever stopped, a provisional Z home is undone, and the next G28 hops
    # again before X/Y pass the docks [EL-TC-061]
    {% if printer["gcode_macro _INDX_HOME_Z"].z_faked|default(0)|int %}
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=0
        RESPOND TYPE=error MSG="INDX: homing stopped, Z is not homed"
    {% endif %}
    {% if "z" not in printer.toolhead.homed_axes %}
        SET_GCODE_VARIABLE MACRO=_INDX_SAFE_Z_HOP VARIABLE=blind_hopped VALUE=False
    {% endif %}
    # Extension API: the last stop for printer.indx_api, and the stop event
    {% if "indx_api" in printer %}_INDX_EVENT EVENT=stop REASON="{params.MSG|default('INDX error')}"{% endif %}
    # The stop for the feedback questions (INDX Suite): only noted in memory,
    # it never raises
    {% if "indx_clog" in printer %}
        INDX_FEEDBACK STOP=1 MSG="{params.MSG|default('INDX error')|replace('"', '')}"
    {% endif %}
    {% if "gcode_macro _INDX_SEAT_CHECK" in printer %}SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=allow_short VALUE=0{% endif %}
    {% if "gcode_macro _INDX_LOCK_PAST" in printer %}SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=full_left VALUE=0{% endif %}
    _INDX_RAISE_NOW MSG="{params.MSG|default('INDX error')}"

[gcode_macro _INDX_RAISE_NOW]
description: Inner - raise the error (called by _INDX_RAISE)
gcode:
    { action_raise_error(params.MSG|default("INDX error")) }

[gcode_macro _INDX_LOCK_MARK]
description: Inner - a tool was just locked: note the extruder position. Retracting it is illegal until it has moved clear_e mm forward (CLEARED=1: the lock already drove it clear)
# Right after a lock the latch sits in its activation window: a retraction
# pulls it open and the tool comes loose. clear_e (mm) of forward motion
# takes it out [EL-TC-062]. lock_pos: latch mm from its stop (-1 unknown).
variable_lock_e: 0.0
variable_clear_e: 2.0
variable_cleared: 0
variable_lock_pos: -1.0
# lock_force: did the force lock reach its lock target (FORCE=): 1 yes,
# 0 no, -1 not a force lock. _INDX_SEAT_CHECK fails a pickup on 0.
variable_lock_force: -1
# lock_force_g: load cell change at the stop of a force lock (FORCE_G=), 0 if none
variable_lock_force_g: 0.0
# short: the sensed lock measured the latch short of the release (SHORT=1:
# frozen filament stopped it). Until clear_e forward the tool must not probe
# (_INDX_PROBE_GUARD). Saved as lock_short, so a restart keeps it.
variable_short: 0
# assumed: short is not measured but taken (ASSUMED=1: a lock that cannot
# feel frozen filament, of a loaded tool: _INDX_LOCK_MARK_UNSENSED) [EL-TC-068]
# Saved as lock_assumed, so a restart keeps it [EL-TC-072].
variable_assumed: 0
gcode:
    {% set short = 0 if params.CLEARED|default(0)|int else params.SHORT|default(0)|int %}
    {% set assumed = 1 if short and params.ASSUMED|default(0)|int else 0 %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=short VALUE={short}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=assumed VALUE={assumed}
    {% if printer.save_variables.variables.lock_short|default(0)|int != short %}
        SAVE_VARIABLE VARIABLE=lock_short VALUE={short}
    {% endif %}
    {% if printer.save_variables.variables.lock_assumed|default(0)|int != assumed %}
        SAVE_VARIABLE VARIABLE=lock_assumed VALUE={assumed}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=lock_force_g VALUE={params.FORCE_G|default(0.0)|float}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=lock_force VALUE={params.FORCE|default(-1)|int}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=lock_e VALUE={printer.toolhead.position.e|float}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=lock_pos VALUE={params.POS|default(-1.0)|float}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=cleared VALUE={params.CLEARED|default(0)|int}
    # CLEAR: forward motion still needed to pass the release (default 2 mm)
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=clear_e VALUE={params.CLEAR|default(2.0)|float}
    # Saved, so a restart keeps the guard (a frozen lock can need more than
    # the default 2 mm) [EL-TC-015]; INIT_STATE restores it
    SAVE_VARIABLE VARIABLE=lock_clear_e VALUE={0.0 if params.CLEARED|default(0)|int else params.CLEAR|default(2.0)|float}

[gcode_macro _INDX_LOCK_MARK_UNSENSED]
description: Inner - the lock mark of a lock that cannot feel frozen filament (an unsensed lock, a race mode lock, a tool recorded locked by hand): TOOL= with filament is taken as short of the release (ASSUMED=1), an empty tool gets the plain mark (EMPTY_MARK=0: none). KIND=lock, race or hand for the console line
# Frozen filament holds the latch short of the release where the gears first
# grip (drive_engage_mm); a lock that is not sensed cannot feel it. A tool
# with filament is taken as short by that much, whatever the nozzle reads
# (the reading at the lock is not yet the new tool's): no probe and no
# retraction until clear_e mm forward, hot (the prime, the G28 unfreeze),
# never on the hope that it was not frozen [EL-TC-068] [EL-TC-072]
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set t = params.TOOL|int %}
    {% set svl = printer.save_variables.variables %}
    {% set ldd = svl["t%d_material" % t]|default("")|string|upper not in ["", "NONE"] or svl["t%d_fil_density" % t]|default(0)|float > 0 %}
    {% if ldd %}
        {% set eng = printer["gcode_macro INDX_TIP_SHAPE"].drive_engage_mm|float if "gcode_macro INDX_TIP_SHAPE" in printer else 11.9 %}
        {% set lclear = [c.latch_release_from_stop|float + 0.2 - (eng - 0.3), 2.0]|max %}
        {% set kind = params.KIND|default("lock")|string|lower %}
        {% set how = "recorded locked by hand" if kind == "hand" else ("locked in race mode (not sensed)" if kind == "race" else "locked without sensing") %}
        _INDX_LOCK_MARK SHORT=1 ASSUMED=1 CLEAR={"%.3f"|format(lclear)}
        # said outside a print (in a print every change would say it)
        {% if printer.print_stats.state not in ["printing", "paused"] %}
            RESPOND MSG="INDX > T{t} {how}, with filament in it: taken as up to {'%.1f'|format(lclear)} mm short of the release (frozen filament cannot be felt here), so it is not probed before a heated push of that much (the prime, or the G28 unfreeze)"
        {% endif %}
    {% elif params.EMPTY_MARK|default(1)|int or printer["gcode_macro _INDX_LOCK_MARK"].short|int %}
        _INDX_LOCK_MARK
    {% endif %}

[gcode_macro _INDX_RETRACT]
description: Retract the active tool E mm at F (mm/min), unless it has not moved clear_e mm forward since its lock (then skip it, the latch would open). TOTAL/BASE - record t<n>_retracted as TOTAL if done, BASE if skipped. DONE=1 - the caller already queued that retraction after the same check: only the guard's mark and the record
# DONE=1: a station queues its retraction right behind its purge (no
# standstill at full pressure) after this same guard check; the forward
# count here then still holds that retraction, so it is added back.
# [EL-BKT-028]
gcode:
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set e = params.E|float %}
    {% set done = params.DONE|default(0)|int %}
    {% set fwd = printer.toolhead.position.e|float - m.lock_e|float + (e if done and e > 0 else 0.0) %}
    {% set ok = e <= 0 or m.cleared|int or fwd >= m.clear_e|float %}
    {% if e <= 0 %}
    {% elif not done and not printer[printer.toolhead.extruder].can_extrude %}
        # Under min_extrude_temp the move would raise mid tool change, and a
        # cold nozzle has nothing to retract
    {% elif ok %}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=cleared VALUE=1
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=short VALUE=0
        {% if printer.save_variables.variables.lock_clear_e|default(0)|float > 0 %}
            SAVE_VARIABLE VARIABLE=lock_clear_e VALUE=0.0
        {% endif %}
        {% if printer.save_variables.variables.lock_short|default(0)|int %}
            SAVE_VARIABLE VARIABLE=lock_short VALUE=0
        {% endif %}
        {% if not done %}
            SAVE_GCODE_STATE NAME=_indx_retract
            M83
            G1 E-{e} F{params.F|default(2100)|float}
            RESTORE_GCODE_STATE NAME=_indx_retract
        {% endif %}
    {% else %}
        RESPOND MSG="No retraction: T{act} has moved {'%.1f'|format(fwd)} mm forward since it was locked, and retracting before {m.clear_e} mm would pull its latch back open"
    {% endif %}
    {% if act >= 0 and "TOTAL" in params %}
        SAVE_VARIABLE VARIABLE=t{act}_retracted VALUE={"%.2f"|format(params.TOTAL|float if ok else params.BASE|default(0)|float)}
    {% endif %}

[gcode_macro _INDX_PARK_RETRACT]
description: Inner - the park retraction of a print's tool change (PRINT_TOOLCHANGE park_pending, from _PARK_TOOL_APPLY): retract TOOL= by E= mm on the park's Z hop to Z= (without Z=: standing), through the retraction guard, and record t<n>_retracted as BASE + E (BASE when the guard or a cold nozzle skips it). Clears park_pending
# On the hop, so the head does not stand still over the print for it; the
# hop runs no faster than the retraction at F= (mm/min, default 2100). A
# tool that has not moved clear_e forward since its lock (frozen, or never
# past the release) is not retracted: that would pull its latch open.
# [EL-PRI-044]
gcode:
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set t = params.TOOL|int %}
    {% set e = params.E|float %}
    {% set base = params.BASE|default(0)|float %}
    {% set f = params.F|default(2100)|float %}
    {% set fwd = printer.toolhead.position.e|float - m.lock_e|float %}
    {% set hot = printer[printer.toolhead.extruder].can_extrude %}
    {% set guard = m.cleared|int or fwd >= m.clear_e|float %}
    {% set ok = e > 0.001 and hot and guard %}
    {% set has_z = params.Z is defined %}
    SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=park_pending VALUE="[]"
    {% if ok %}
        {% set dz = (params.Z|float - printer.gcode_move.gcode_position.z|float)|abs if has_z else 0.0 %}
        {% set v = printer["gcode_macro _TOOLCHANGE_VARS"] %}
        {% set ftc = printer.configfile.settings.printer.max_velocity|float * 60 * (v.slow_mult|float if v.slow|default(0)|int else v.speed_mult|float) %}
        SAVE_GCODE_STATE NAME=_indx_park_retract
        G90
        M83
        {% if dz > 0.05 %}
            G1 Z{params.Z} E-{"%.3f"|format(e)} F{[ftc, f * dz / e]|min|round(0)|int}
        {% else %}
            G1 E-{"%.3f"|format(e)} F{f|round(0)|int}
            {% if has_z %}
                G1 Z{params.Z} F{ftc|round(0)|int}
            {% endif %}
        {% endif %}
        RESTORE_GCODE_STATE NAME=_indx_park_retract
    {% else %}
        {% if has_z %}
            _TC_G0 Z={params.Z}
        {% endif %}
        {% if e > 0.001 %}
            RESPOND MSG="INDX > T{t}: no park retraction ({'%.1f'|format(e)} mm): {'the nozzle is too cold to extrude' if not hot else ('it has moved %.1f mm forward since its lock, and retracting before %s mm would pull its latch back open' % (fwd, m.clear_e))}. Parked retracted by {'%.1f'|format(base)} mm."
        {% endif %}
    {% endif %}
    SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE={"%.2f"|format(base + e if ok else base)}

#####################################################################
#  Frozen filament: the probe guard and tip shaping [EL-TC-050]
#####################################################################
#
#  A loaded tool picked up cold can be frozen: the lock meets the plug in the
#  cold nozzle and the latch stays short of the release (_INDX_LOCK_MARK
#  short). A heated push of clear_e carries it past; until then every probe
#  path stops (_INDX_PROBE_PREP, _INDX_PROBE_GUARD). G28 has its own way out
#  (homing.cfg, _INDX_HOME_Z_DECIDE).
#
#  INDX_TIP_SHAPE forms the tip (docs/tip-forming.md) and retracts at most
#  10 mm, so the next cold pickup passes the release [EL-TC-063]. The load
#  cell judges the final pull (INDX_TIP_VERDICT) and the next lock reports
#  where the tip was (_INDX_TIP_FEED), both into the support log. Run by
#  INDX_PRINT_END (END_TIP=), LOAD_FILAMENT (after_load) and INDX_UNLOAD.
#####################################################################

[gcode_macro _INDX_LOCK_REFRESH]
description: Inner - the tool on the head has moved clear_e mm forward since its lock: mark the retraction guard cleared and the latch past the release (saved, so a restart keeps it)
gcode:
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set fwd = printer.toolhead.position.e|float - m.lock_e|float %}
    {% if act >= 0 and not m.cleared|int and fwd >= m.clear_e|float %}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=cleared VALUE=1
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_MARK VARIABLE=short VALUE=0
        {% if svv.lock_clear_e|default(0)|float > 0 %}
            SAVE_VARIABLE VARIABLE=lock_clear_e VALUE=0.0
        {% endif %}
        {% if svv.lock_short|default(0)|int %}
            SAVE_VARIABLE VARIABLE=lock_short VALUE=0
        {% endif %}
        {% if m.short|int %}
            RESPOND MSG="INDX > T{act}: {'%.2f'|format(fwd)} mm forward since its lock: the latch is past the release now"
        {% endif %}
    {% endif %}

[gcode_macro _INDX_PROBE_GUARD]
description: Inner - before any probe: stop when the tool on the head is short of the release (its lock met frozen filament). _INDX_PROBE_PREP calls it, and every probe path runs that first
# No exceptions: not for hot taps, not before a prime. A frozen tool is
# pushed past the release first (_PRIME_UNFREEZE, the G28 unfreeze).
gcode:
    _INDX_LOCK_REFRESH
    _INDX_PROBE_GUARD_CHECK

[gcode_macro _INDX_PROBE_GUARD_CHECK]
description: Inner - _INDX_PROBE_GUARD after the lock state is refreshed: stop and ask (no automatic heat and prime)
# No automatic heat and prime here: the user chooses [EL-TC-064]
gcode:
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% if act >= 0 and m.short|int and not m.cleared|int %}
        {% set left = [m.clear_e|float - (printer.toolhead.position.e|float - m.lock_e|float), 0.0]|max %}
        {% set why = ("T%d was picked up with filament in it, and this lock could not feel frozen filament (it was not sensed): the latch is taken as up to %.2f mm short of the release." % (act, left)) if m.assumed|default(0)|int else ("T%d was picked up with cold filament in its nozzle: its lock met the plug and the latch stayed %.2f mm short of the release." % (act, left)) %}
        _INDX_PROMPT TITLE="T{act} Is Not Fully Locked" TEXT="{why} INDX does not probe with a tool that is not fully locked, so it stopped before this probe." TEXT2="Unfreeze it first: INDX_TIP_SHAPE heats T{act} over its purge lane slot, pushes until the latch is past the release, forms the tip and retracts it, so its next cold pickup is not frozen. Then run the step again." B1="Unfreeze T{act} now|_INDX_DO CMD=INDX_TIP_SHAPE~TOOL={act}~CONFIRM=1|primary" B2="Shape the tips of all loaded tools|_INDX_DO CMD=INDX_TIP_SHAPE~TOOLS=all~CONFIRM=1|secondary" F1="Close|_INDX_PROMPT_END|secondary"
        _INDX_RAISE MSG="INDX: T{act} is {'%.2f'|format(left)} mm short of the release (frozen filament held its lock), so INDX does not probe with it. INDX_TIP_SHAPE TOOL={act} unfreezes it (heat and push over its purge lane slot, then tip shaping); then run the step again."
    {% endif %}

[gcode_macro _INDX_TIP_FEED]
description: Inner - right after a lock: a tip shaped tool (tN_tip_shaped, its retraction untouched since) got part of its retraction fed back by the lock; record what is left for the next prime to refill
gcode:
    {% set t = params.TOOL|int %}
    {% set svv = printer.save_variables.variables %}
    {% set tipv = svv["t%d_tip_shaped" % t]|default(0)|float %}
    {% if tipv > 0 %}
        {% set ret = svv["t%d_retracted" % t]|default(0)|float %}
        {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
        {% set lp = printer["gcode_macro _INDX_LOCK_PAST"] if "gcode_macro _INDX_LOCK_PAST" in printer else {"frozen": 0, "end": 0.0} %}
        {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
        {% if (ret - tipv)|abs < 0.01 %}
            # sensed lock: from the open position to where it ended; the
            # standard and race locks: their fixed length
            {% set feed = (lp.end|float - c.latch_open_from_stop|float) if m.lock_force|int >= 0 else c.full_lock_e|float %}
            {% if lp.frozen|int %}
                SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE=0
                RESPOND MSG="INDX > T{t} was tip shaped ({'%.1f'|format(tipv)} mm retracted), yet its lock met the plug at {'%.2f'|format(lp.end|float)} mm: that retraction left too little room for this filament (please report it, INDX_TIP_SHAPE retract)"
                {% if "indx_clog" in printer %}
                    INDX_SUPPORT_LOG TIP_PICKUP=1 TOOL={t} SHAPED={"%.2f"|format(tipv)} END={"%.2f"|format(lp.end|float)} FROZEN=1 FED=0
                {% endif %}
            {% else %}
                # The gears grip only above drive_engage_mm: this lock fed from
                # there to its end, and the park before it pulled the same
                # stretch back, so the tip retraction is still all there
                {% set eng = printer["gcode_macro INDX_TIP_SHAPE"].drive_engage_mm|float %}
                {% set fed = [lp.end|float - eng, 0.0]|max if m.lock_force|int >= 0 else 0.0 %}
                SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE={"%.2f"|format(ret)}
                RESPOND MSG="INDX > T{t}: tip shaped {'%.1f'|format(tipv)} mm; this lock fed about {'%.1f'|format(fed)} mm (the gears grip above {'%.1f'|format(eng)} mm) and the park had pulled the same back: {'%.1f'|format(ret)} mm still retracted for the prime to refill"
                {% if "indx_clog" in printer %}
                    INDX_SUPPORT_LOG TIP_PICKUP=1 TOOL={t} SHAPED={"%.2f"|format(tipv)} END={"%.2f"|format(lp.end|float)} FROZEN=0 FED={"%.2f"|format(fed)}
                {% endif %}
            {% endif %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=t{t}_tip_shaped VALUE=0
    {% endif %}

[gcode_macro INDX_TIP_SHAPE]
description: Form the filament tip of a tool and retract it, so its next cold pickup is not frozen (its lock can pass the release). TOOL=n (default the tool on the head) or TOOLS=0,2 or TOOLS=all (every loaded tool), TEMP= (default the recorded load temperature). A tool short of the release is first heated over its purge lane slot and pushed until its latch is past it. Needs: CONFIRM=1 (asks first), homed. Moves: tool changes, the purge lane. Saves: tN_retracted, tN_tip_shaped
# retract: total retraction from a full nozzle, mm, at most 10
#   [EL-TC-063]. It stays retracted over the park and the next pickup
#   (drive_engage_mm), and the next prime refills it.
# margin: forward motion past what the retraction guard asks for, mm
# push_min: the least push when one is needed, mm. 0: only what the guard
#   needs plus the material's tip_purge [EL-TC-065]
# air_z: nozzle height over the purge lane slot for the push, mm: in the
#   air as INDX_UNLOAD, never down at the bed with a Z that may be tilted
# after_load: LOAD_FILAMENT shapes the tip at the end of a load
variable_retract: 10.0
# The forming (docs/tip-forming.md). Per material in the filament presets
# (tip_purge, tip_ram, tip_sep, tip_speed, tip_cool, LOAD_FILAMENT
# filament_presets); these are the values for a material without them.
# tip_purge: fresh plastic pushed out before the forming, mm. 0: none, the
#   melt in the nozzle is what the tip is formed from (no ooze that is
#   unaccounted for) [EL-TC-065].
# tip_ram: ramming cycles (ram_pull back, ram_push forward, at half
#   tip_speed) that shear the melt loose from the wall. 0 for TPU.
# tip_sep: the separation pull, mm at tip_speed mm/s: fast, so the melt
#   necks and parts at the nozzle instead of being drawn into a string.
# tip_speed: the separation speed, mm/s (the material's stringiness knob:
#   PETG and PA fastest, TPU slow). The ramming runs at half of it, the
#   final pull at half of it.
# tip_cool: nozzle temperature of the final pull, C (a solid cone that still
#   comes off the wall); clamped to min_extrude_temp + 5 and forming temp - 10.
variable_tip_purge: 0.0
variable_tip_ram: 2
variable_tip_sep: 4.0
variable_tip_speed: 40.0
variable_tip_cool: 200
# ram_pull, ram_push: one ramming cycle, mm; the push stays smaller than
#   the pull before it [EL-TC-063], so nothing is pushed out
variable_ram_pull: 1.5
variable_ram_push: 1.0
# cool_n: cooling moves while the nozzle drops to tip_cool (heater off, fan
#   on): cool_pull back, cool_push forward at cool_speed mm/s, so the tip
#   does not fuse to the wall and its thread breaks.
variable_cool_n: 5
variable_cool_pull: 1.0
variable_cool_push: 0.8
variable_cool_speed: 5.0
# final_min: the final pull at tip_cool is what is left of the retraction
#   after the ramming, the separation pull and the cooling moves, at least
#   this (the separation pull gives way first)
variable_final_min: 1.5
# drive_engage_mm: latch position (mm from its stop) where the gears grip the
#   filament. A pickup feeds from here to the lock's end and the park pulls
#   the same back: a tip retraction stays for the prime to refill [EL-TC-066]
variable_drive_engage_mm: 11.9
variable_margin: 2.0
variable_push_min: 0.0
variable_air_z: 5.0
variable_after_load: True
# skip: set by _INDX_TIP_PUSH when the tip cannot be shaped where it stands
variable_skip: 0
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set n = tp.tool_count|int %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set no_heat = tp.no_heat_tools|default([]) %}
    {% set raw = params.TOOLS|default(params.TOOL|default(act))|string|replace(" ", "") %}
    {% set ns = namespace(tools=[]) %}
    {% if raw|lower == "all" %}
        {% for t in range(n) if t not in no_heat and svv["t%d_material" % t]|default("")|string|length > 0 %}
            {% set ns.tools = ns.tools + [t] %}
        {% endfor %}
    {% else %}
        {% for p in raw.split(",") if p %}
            {% if p|int(-1) >= 0 and p|int not in ns.tools %}
                {% set ns.tools = ns.tools + [p|int] %}
            {% endif %}
        {% endfor %}
    {% endif %}
    # the tool on the head first: one tool change less
    {% if act in ns.tools %}
        {% set ns.tools = [act] + ns.tools|reject("equalto", act)|list %}
    {% endif %}
    {% if raw|lower == "all" and not ns.tools %}
        {action_raise_error("INDX_TIP_SHAPE TOOLS=all: no loaded tool has filament recorded. Record the material with INDX_SET_MATERIAL for each loaded tool. Nothing moved.")}
    {% endif %}
    {% if not ns.tools %}
        {action_raise_error("INDX_TIP_SHAPE: no tool given and none on the head (TOOL=n, TOOLS=0,2 or TOOLS=all for every loaded tool). Nothing moved.")}
    {% endif %}
    {% for t in ns.tools %}
        {% if t >= n or t in no_heat %}
            {action_raise_error("INDX_TIP_SHAPE: T%d is not a nozzle tool. Nothing moved." % t)}
        {% elif svv["t%d_material" % t]|default("")|string|length == 0 %}
            {action_raise_error("INDX_TIP_SHAPE: T%d has no filament recorded, so there is no tip to shape (INDX_SET_MATERIAL if it is loaded). Nothing moved." % t)}
        {% endif %}
    {% endfor %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("INDX_TIP_SHAPE: not during a print (INDX_PRINT_END shapes the tips of the tools of the print). Nothing moved.")}
    {% endif %}
    {% set tl = ns.tools|join(",") %}
    {% if not params.CONFIRM|default(0)|int %}
        _INDX_PROMPT TITLE="Tip Shaping: T{ns.tools|join(', T')}" TEXT="For each tool: INDX picks it up, heats it to its load temperature over its purge lane slot, pushes a few mm if its latch is still short of the release (frozen filament), then forms the tip and retracts it {printer['gcode_macro INDX_TIP_SHAPE'].retract|round(0)|int} mm in all. Its next cold pickup is then not frozen." TEXT2="Keep the purge lane clear. The heater goes off after each tool." B1="Shape the tips now|INDX_TIP_SHAPE TOOLS={tl}{(' TEMP=' ~ params.TEMP) if params.TEMP is defined else ''} CONFIRM=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_GATE NEEDS=homed STEP="Tip shaping" AGAIN=INDX_TIP_SHAPE~TOOLS={tl}~CONFIRM=1 AUTO=1
        _INDX_PROMPT_END
        _INDX_RUNNING STEP="Tip shaping"
        {% if tp.prime_enabled|default(True) %}
            _PRIME_SLOTS COUNT={n}
        {% endif %}
        {% for t in ns.tools %}
            {% if t != act or not loop.first %}
                _INDX_CHANGE_TOOL TOOL={t}
            {% endif %}
            {% set temp = params.TEMP|default(svv["t%d_temp" % t]|default(0)|int if svv["t%d_temp" % t]|default(0)|int > 0 else 230)|int %}
            _INDX_TIP_SHAPE_TOOL TOOL={t} TEMP={temp} MODE=air
            M104 S0
        {% endfor %}
        _INDX_RUNNING STEP=none
        RESPOND MSG="INDX ok INDX_TIP_SHAPE: T{ns.tools|join(', T')} done, heater off. T{ns.tools[-1]} is on the head."
    {% endif %}

[gcode_macro _INDX_TIP_SHAPE_TOOL]
description: Inner - shape the tip of TOOL, on the head: push it past the release when it is short (MODE=air: in the air over its purge lane slot; X= Y= a bed position and Z= override the spot), then form the tip and retract (MODE=here: where it stands, only when no push is needed and it is hot; FORM=0: the push only)
gcode:
    _INDX_LOCK_REFRESH
    _INDX_TIP_PUSH {rawparams}
    _INDX_LOCK_REFRESH
    _INDX_TIP_FORM {rawparams}

[gcode_macro _INDX_TIP_PUSH]
description: Inner - the push of _INDX_TIP_SHAPE_TOOL: heated forward extrusion until the latch is past the release (clear_e plus margin), plus the material's tip_purge (fresh plastic, normally 0; UNLOAD=1 adds INDX_UNLOAD purge), in the air over the purge lane slot. DX=<mm>: the push runs while the head moves that far in X+, then 5 mm more without extruding (a short line on the strip, nothing left hanging). ZKEEP=1: Z is not known yet (G28): the head stays at the height it is at. Never at a prime bucket slot point, never over the print
gcode:
    {% set t = params.TOOL|int %}
    {% set mode = params.MODE|default("air")|lower %}
    {% set svv = printer.save_variables.variables %}
    {% set me = printer["gcode_macro INDX_TIP_SHAPE"] %}
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set fwd = th.position.e|float - m.lock_e|float %}
    {% set need = 0.0 if m.cleared|int else [m.clear_e|float - fwd, 0.0]|max %}
    {% set mat = svv["t%d_material" % t]|default("")|string %}
    {% set pre = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    {% set purge = (pre[mat].tip_purge|default(me.tip_purge) if mat in pre else me.tip_purge)|float %}
    {% set purge = purge + (printer["gcode_macro INDX_UNLOAD"].purge|float if params.UNLOAD|default(0)|int else 0.0) %}
    {% set push = ([need + me.margin|float, me.push_min|float]|max if need > 0 else 0.0) + purge %}
    {% set temp = params.TEMP|default(svv["t%d_temp" % t]|default(0)|int if svv["t%d_temp" % t]|default(0)|int > 0 else 230)|float %}
    SET_GCODE_VARIABLE MACRO=INDX_TIP_SHAPE VARIABLE=skip VALUE=0
    {% if act != t %}
        _INDX_RAISE MSG="INDX: tip shaping T{t}, but T{act} is on the head. Nothing extruded."
    {% elif mode == "here" %}
        # Where it stands (the print end, over the print): nothing may come
        # out, not the guard's push and not the material's tip_purge either
        {% if need > 0 %}
            SET_GCODE_VARIABLE MACRO=INDX_TIP_SHAPE VARIABLE=skip VALUE=1
            RESPOND MSG="INDX > T{t}: tip not shaped, it still needs {'%.2f'|format(need)} mm forward since its lock and nothing is pushed out here (INDX_TIP_SHAPE TOOL={t} does it over the purge lane)"
        {% elif not printer[th.extruder].can_extrude %}
            SET_GCODE_VARIABLE MACRO=INDX_TIP_SHAPE VARIABLE=skip VALUE=1
            RESPOND MSG="INDX > T{t}: tip not shaped, the nozzle is too cold to extrude"
        {% endif %}
    {% else %}
        {% set zkeep = params.ZKEEP|default(0)|int %}
        {% if ("xy" if zkeep else "xyz") not in th.homed_axes %}
            _INDX_RAISE MSG="INDX: tip shaping T{t} needs X, Y{'' if zkeep else ' and Z'} homed. Nothing extruded."
        {% endif %}
        {% set slots = printer["gcode_macro _PRIME_SETTINGS"].slots|default([]) if tp.prime_enabled|default(True) else [] %}
        {% set o = printer.gcode_move.homing_origin %}
        {% if params.X is defined and params.Y is defined %}
            # a bed position, as the slots
            {% set x, y = params.X|float - o.x|float, params.Y|float - o.y|float %}
        {% elif slots|length > t %}
            {% set x, y = slots[t][0]|float - o.x|float, slots[t][1]|float - o.y|float %}
        {% else %}
            # No purge lane: beside the Z homing spot, so nothing lands where
            # the load cell homes
            {% set px = tp.probe_x|float if tp.probe_x|float >= 0 else (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
            {% set py = tp.probe_y|float if tp.probe_y|float >= 0 else (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
            {% set x = px + 30 if px + 30 <= th.axis_maximum.x - 5 else px - 30 %}
            {% set y = py %}
        {% endif %}
        {% set z = params.Z|default(me.air_z)|float %}
        {% set dx = [[params.DX|default(0)|float, 0.0]|max, th.axis_maximum.x|float - 2 - x]|min %}
        SAVE_GCODE_STATE NAME=_indx_tip_push
        G90
        {% if not zkeep and printer.gcode_move.gcode_position.z|float < z %}
            G1 Z{"%.2f"|format(z)} F900
        {% endif %}
        # Out to the clearance line first if behind it, then straight to the spot
        _INDX_TO_LANE
        G1 X{"%.2f"|format(x)} Y{"%.2f"|format(y)} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
        {% if not zkeep %}
            G1 Z{"%.2f"|format(z)} F900
        {% endif %}
        M104 S{temp}
        TEMPERATURE_WAIT SENSOR={th.extruder} MINIMUM={temp - 3} MAXIMUM={temp + 10}
        {% if push > 0 %}
            M83
            {% if dx > 0 %}
                # moving X+ while it pushes, at the push's own pace (3 mm/s of filament)
                G1 X{"%.2f"|format(x + dx)} E{"%.3f"|format(push)} F{"%.0f"|format([dx / (push / 3.0) * 60.0, 6000.0]|min)}
                # on along X+ without extruding: the strand stays on the strip
                G1 X{"%.2f"|format([x + dx + 5, th.axis_maximum.x|float - 2]|min)} F1200
            {% else %}
                G1 E{"%.3f"|format(push)} F180
            {% endif %}
            M400
            # Frozen: the lock had already closed any gap, so nothing is left
            # retracted; otherwise the push refilled that much first
            SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE={"%.2f"|format(0.0 if m.short|int else [svv["t%d_retracted" % t]|default(0)|float - push, 0.0]|max)}
            RESPOND MSG="INDX > T{t}: pushed {'%.2f'|format(push)} mm at {temp|int} C ({('the latch needed %.2f mm to pass the release' % need) if need > 0 else 'the latch was past the release'}{(', %.1f mm fresh plastic' % purge) if purge > 0 else ''})"
        {% endif %}
        RESTORE_GCODE_STATE NAME=_indx_tip_push
    {% endif %}

[gcode_macro _INDX_TIP_FORM]
description: Inner - form the tip and retract (the guards, then _INDX_TIP_FORM_REST does the moves): never before the latch is past the release, never a cold nozzle, not again on a tool still retracted. UNLOAD=1 (INDX_UNLOAD): forms from where the filament stands, whatever is retracted
gcode:
    {% set t = params.TOOL|int %}
    {% set me = printer["gcode_macro INDX_TIP_SHAPE"] %}
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set svv = printer.save_variables.variables %}
    {% set unload = params.UNLOAD|default(0)|int %}
    {% if me.skip|int %}
        SET_GCODE_VARIABLE MACRO=INDX_TIP_SHAPE VARIABLE=skip VALUE=0
        {% if unload %}
            _INDX_RAISE MSG="INDX: T{t} could not be pushed past the release here, so its tip is not formed and the filament is not pulled out. T{t} is on the head."
        {% endif %}
    {% elif not params.FORM|default(1)|int %}
        # FORM=0: only the push (G28 inside a print: the print start primes
        # this tool next, so no tip forming) [EL-TC-067]
    {% elif svv.active_tool|default(-1)|int != t %}
        _INDX_RAISE MSG="INDX: tip shaping T{t}, but it is not on the head. Nothing retracted."
    {% elif not m.cleared|int %}
        # The retraction guard has the last word: no pull before the latch
        # is past the release, or it pulls the latch back open
        _INDX_RAISE MSG="INDX: T{t} is still short of the release after the push, so its tip is not shaped (a retraction would pull its latch open). Look at the tool and its filament; T{t} is on the head."
    {% elif not printer[printer.toolhead.extruder].can_extrude %}
        RESPOND MSG="INDX > T{t}: tip not shaped, the nozzle is too cold to extrude"
    {% elif not unload and svv["t%d_retracted" % t]|default(0)|float >= me.retract|float %}
        # shaped before and not refilled since: pulling again would only walk
        # the filament out of the gears
        RESPOND MSG="INDX > T{t}: already retracted {'%.1f'|format(svv['t%d_retracted' % t]|default(0)|float)} mm, tip left as it is"
    {% else %}
        _INDX_TIP_FORM_REST TOOL={t} ALREADY={"%.3f"|format(0.0 if unload else svv["t%d_retracted" % t]|default(0)|float)} UNLOAD={unload}{(" TEMP=" ~ params.TEMP) if params.TEMP is defined else ""}
    {% endif %}

[gcode_macro _INDX_TIP_FORM_REST]
description: Inner - the tip forming moves, once _INDX_TIP_FORM has let them through (docs/tip-forming.md): ramming (hot, net backwards), the fast separation pull, heater off and part fan on, cooling moves at each step of the cooling, the final pull at the material's tip temperature, then the load cell verdict. Retracts retract minus ALREADY in all. TEMP= the forming temperature (default the heater's target)
gcode:
    {% set t = params.TOOL|int %}
    {% set me = printer["gcode_macro INDX_TIP_SHAPE"] %}
    {% set svv = printer.save_variables.variables %}
    {% set ext = printer.toolhead.extruder %}
    {% set unload = params.UNLOAD|default(0)|int %}
    {% set mat = svv["t%d_material" % t]|default("")|string %}
    {% set pre = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    {% set p = pre[mat] if mat in pre else {} %}
    {% set ram0 = p.tip_ram|default(me.tip_ram)|int %}
    {% set sep0 = p.tip_sep|default(me.tip_sep)|float %}
    {% set spd = [p.tip_speed|default(me.tip_speed)|float, 1.0]|max %}
    {% set purge = p.tip_purge|default(me.tip_purge)|float %}
    {% set heater = printer[ext] %}
    {% set temp = params.TEMP|default(heater.target if heater.target|float > 0 else heater.temperature)|float %}
    # the final pull's temperature: at least what plain G1 E moves allow, at
    # most 10 C under the forming temperature
    {% set floor = printer.configfile.settings[ext].min_extrude_temp|default(170)|float + 5 %}
    {% set cool_c = [[p.tip_cool|default(me.tip_cool)|float, temp - 10]|min, floor]|max %}
    {% set already = params.ALREADY|default(0)|float %}
    {% set budget = me.retract|float if unload else [me.retract|float - already, 0.0]|max %}
    # the parts share the retraction: ramming and cooling moves net a little
    # each, the separation pull gives way when the budget is short, the
    # final pull takes what is left (at least final_min)
    {% set rn = ram0 * (me.ram_pull|float - me.ram_push|float) %}
    {% set cn0 = me.cool_n|int %}
    {% set cn = cn0 * (me.cool_pull|float - me.cool_push|float) %}
    {% if budget < rn + cn + me.final_min|float + 0.5 %}
        {% set ram0 = 0 %}
        {% set cn0 = 0 %}
        {% set rn = 0.0 %}
        {% set cn = 0.0 %}
    {% endif %}
    {% set sep = [[sep0, budget - rn - cn - me.final_min|float]|min, 0.0]|max %}
    {% set sep = 0.0 if sep < 0.3 else sep %}
    {% set fin = budget - rn - sep - cn %}
    {% set f_sep = spd * 60 %}
    {% set f_ram = [spd / 2, 25.0]|min * 60 %}
    {% set f_cool = [me.cool_speed|float, spd / 2]|min * 60 %}
    {% set f_fin = [spd / 2, 3.0]|max * 60 %}
    {% set mach = printer["gcode_macro _INDX_MACHINE"] if "gcode_macro _INDX_MACHINE" in printer else {} %}
    {% set nofan = mach.part_cooling|default("not_set") == "none" %}
    {% if not printer["gcode_macro _INDX_LOCK_MARK"].cleared|int %}
        _INDX_RAISE MSG="INDX: T{t} is short of the release, so its tip is not formed (a retraction would pull its latch open). T{t} is on the head."
    {% elif not heater.can_extrude %}
        RESPOND MSG="INDX > T{t}: tip not formed, the nozzle is too cold to extrude"
    {% elif budget < 0.5 %}
        RESPOND MSG="INDX > T{t}: nothing left to retract for the tip forming ({'%.1f'|format(already)} mm already), tip left as it is"
    {% else %}
        RESPOND MSG="INDX > T{t}: forming the tip{(' (' ~ mat ~ ')') if mat else ''}: {ram0} ramming cycles, {'%.1f'|format(sep)} mm at {spd|int} mm/s, {cn0} cooling moves to {cool_c|int} C, then {'%.1f'|format(fin)} mm: {'%.1f'|format(budget)} mm in all{' (no part cooling fan: cooling passively, this takes longer)' if nofan else ''}"
        SAVE_GCODE_STATE NAME=_indx_tip_form
        M83
        {% for i in range(ram0) %}
            G1 E-{"%.3f"|format(me.ram_pull|float)} F{f_ram|int}
            G1 E{"%.3f"|format(me.ram_push|float)} F{f_ram|int}
        {% endfor %}
        {% if sep > 0 %}
            G1 E-{"%.3f"|format(sep)} F{f_sep|int}
        {% endif %}
        M400
        M104 S0
        _INDX_PART_FAN S=255
        {% for i in range(cn0) %}
            TEMPERATURE_WAIT SENSOR={ext} MAXIMUM={"%.1f"|format(temp - (i + 1) * (temp - cool_c) / cn0)}
            G1 E-{"%.3f"|format(me.cool_pull|float)} F{f_cool|int}
            G1 E{"%.3f"|format(me.cool_push|float)} F{f_cool|int}
        {% endfor %}
        {% if cn0 == 0 %}
            TEMPERATURE_WAIT SENSOR={ext} MAXIMUM={"%.1f"|format(cool_c)}
        {% endif %}
        G1 E-{"%.3f"|format(fin)} F{f_fin|int}
        M400
        _INDX_PART_FAN S=0
        RESTORE_GCODE_STATE NAME=_indx_tip_form
        {% if "indx_clog" in printer %}
            INDX_TIP_VERDICT TOOL={t} MAT={mat if mat else "-"} TEMP={"%.0f"|format(temp)} COOL={"%.0f"|format(cool_c)} RETRACT={"%.2f"|format(budget)} PURGE={"%.2f"|format(purge)} RAM={ram0} SEP={"%.2f"|format(sep)} SPEED={"%.1f"|format(spd)} COOLN={cn0} FINAL={"%.2f"|format(fin)} UNLOAD={unload} FAN={0 if nofan else 1}
        {% endif %}
        {% set total = already + budget %}
        {% if not unload %}
            SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE={"%.2f"|format(total)}
            SAVE_VARIABLE VARIABLE=t{t}_tip_shaped VALUE={"%.2f"|format(total)}
        {% endif %}
        _INDX_TIP_FORM_SAY TOOL={t} TOTAL={"%.2f"|format(total)} UNLOAD={unload}
    {% endif %}

[gcode_macro _INDX_TIP_FORM_SAY]
description: Inner - after the tip forming (renders then): the console line with the load cell's verdict on the final pull (printer.indx_clog.tip)
gcode:
    {% set t = params.TOOL|int %}
    {% set v = printer.indx_clog.tip if "indx_clog" in printer else {} %}
    {% set vd = v.verdict|default("")|string %}
    {% set note = ", the load cell saw a clean break" if vd == "clean" else (", the load cell saw a string drawn out: look at the tip when you can, and please report it" if vd == "wisp" else (", the pull force was inconclusive" if vd in ["free", "uncertain"] else "")) %}
    {% if params.UNLOAD|default(0)|int %}
        RESPOND MSG="INDX > T{t}: tip formed{note}"
    {% else %}
        RESPOND MSG="INDX > T{t}: tip formed and retracted {'%.1f'|format(params.TOTAL|float)} mm in all{note}: its next cold pickup should not be frozen"
    {% endif %}

[gcode_macro _INDX_LATCH_HOME]
description: Inner - after a park (head empty): home the latch to its opening stop with StallGuard4, then wait at the open position (only with [tmc_sg_log]). UNKNOWN=1: the latch position is unknown (first install, reset, a calibration): any stop within the latch travel is valid, not only the expected band. DIST= the search (-8; longer from a locked latch), EXPECT= mm into the search the stop should be (default from the open position)
variable_at_open: 0
# out_of_band: the last homing found a stop too far from EXPECT [EL-TC-013]
variable_out_of_band: 0
# where the last latch homing found the opening stop (mm into its search), -1 none
variable_stop_mm: -1.0
# race_open: a race mode park left the latch at the open position without
# homing it (_INDX_LATCH_RACE_OPEN), at extruder position race_e. Only a race
# mode pickup uses it; anything else treats the latch as unknown.
variable_race_open: 0
variable_race_e: 0.0
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=out_of_band VALUE=0
    {% if params.AT_OPEN|default(0)|int and "tmc_sg_log" in printer %}
        # The park left the latch at the open position from a measured lock
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=1
    {% elif "tmc_sg_log" in printer %}
        _TC_SET_ROTATION_DIST
        # INDX_CAL_LATCH's threshold, one reading under it is the stop; until
        # it has run, the fallback rule (100, two readings in a row: grinds,
        # never stops early)
        {% set stop = printer.save_variables.variables.latch_sg_stop|default(none) %}
        {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
        # STEALTH_READY: the park switched the driver already ([indx_tc_fast]);
        # SG_HOME_E checks that and otherwise switches it itself
        SG_HOME_E DIST={params.DIST|default(-8)|float} SPEED=5 CURRENT={c.latch_home_current} {("THRESH=%d CONSEC=1" % stop|int) if stop is not none else "THRESH=100"}{" STEALTH_READY=1" if ("indx_tc_fast" in printer and printer.indx_tc_fast.enabled) and params.READY|default(1)|int else ""}
        _INDX_LATCH_HOME_OPEN EXPECT={params.EXPECT|default(c.latch_home_expect_mm|default(0.65))|float} UNKNOWN={params.UNKNOWN|default(0)|int}
    {% endif %}

[gcode_macro _INDX_LATCH_RACE_OPEN]
description: Inner - race mode, after a park that opened the latch with the full unlock dance (head empty): move the latch to the open position without homing it
# The dance opens by its total from the release R, so the latch ends a fixed
# distance below R whatever R is: forward to the open position for the latest
# release, and the race lock passes R by latch_race_margin. Not homed (at_open
# 0): a pickup outside race mode homes it in the dock first. [EL-TC-070]
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set dance = (c.squeeze_e|float + c.wiggle_in_e|float + c.wiggle_out_e|float + c.full_open_e|float)|abs %}
    {% set fwd = c.latch_open_from_stop|float - (c.latch_release_from_stop|float - dance) %}
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
    _TC_SET_ROTATION_DIST
    {% if fwd > 0 %}
        _TC_LATCH_MOVE E={"%.3f"|format(fwd)} F={c.latch_fast_feedrate} I={c.run_current}
    {% endif %}
    _TC_RESTORE_ROTATION_DIST
    _INDX_LATCH_RACE_MARK

[gcode_macro _INDX_LATCH_RACE_MARK]
description: Inner - note the race open and the extruder position it was left at (renders after the move)
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_e VALUE={printer.toolhead.position.e|float}
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=1
