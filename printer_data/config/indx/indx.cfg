#####################################################################
#  INDX USER CONFIGURATION
#####################################################################
#
#  The per-printer INDX settings: docks, clearances, homing and the print
#  start purge lane. The other INDX files read their values
#  from here. A few more things live elsewhere:
#    - printer.cfg: [load_cell_probe] (z_offset is the first-layer gap),
#      [indx] (heater model, written by SAVE_CONFIG), [save_variables].
#    - variables.cfg: everything INDX measures (tool offsets, measured docks,
#      trigger offset, soak times). SHOW_VARIABLES lists them, INDX_STATUS
#      shows what is calibrated.
#
#  HOW MANY TOOLS:
#    Nothing to set here. The setup guide counts the docks: it adds each
#    dock as you slide the head onto its tool (INDX_DOCK_ADD) and you say
#    when that was the last one (INDX_DOCK_DONE), from one tool up to 64.
#    The count is saved in variables.cfg (tool_count) and the Tool library
#    on the INDX page adds or removes docks the same way.
#    The dock positions are measured, never typed in here: INDX_CAL_DOCK
#    saves each one in variables.cfg. Until a dock is measured INDX
#    estimates it from the docks it has measured and dock_spacing below,
#    and never drives into it.
#
#  WHAT IS AUTO-DERIVED:
#    - The dock approach per tool (dock_y and the magnet line, 9 mm in front)
#    - The dock count and the dock positions (the setup guide)
#
#  WHAT NOT TO TOUCH:
#    - E-axis moves and dance geometry are fixed hardware constants
#      defined in indx-tc-macros.cfg. These are determined by the
#      INDX mechanism and must not be changed.
#
#####################################################################

[gcode_macro TOOL_POSITIONS]
description: INDX settings for this printer (indx.cfg). Holds values only, does nothing when run

# ── How many tools are installed ─────────────────────────────────────────────
#  Set by the setup guide, not here: the dock count it saved (tool_count in
#  variables.cfg) replaces this value after every restart. This is only
#  where a new printer starts (the reference tool alone), and a printer
#  set up before the count was saved takes it from here once, when every
#  dock up to it is measured.
variable_tool_count: 1

# ── Z-hop during toolchange ──────────────────────────────────────────────────
#  z_hop = distance (mm) to raise Z before the toolhead travels to the dock.
#          Z moves on its own, never together with XY, so the nozzle does not
#          drag over the print. 0.0 disables it.
variable_z_hop: 1.0

# ── Z homing spot ────────────────────────────────────────────────────────────
#  probe_x / probe_y  = where G28 Z taps the bed with the reference tool (machine coords, mm).
#                       The Z checks (TOOL_Z_MEASURE, PRIME_GRID), SOAK_CURVE,
#                       CAL_Z_LOADED, CAL_Z (its clean probe, probe_location
#                       "home") and INDX_CAL_TRIGGER tap here too.
#  probe_fuzz         = fuzz radius (mm).
#  probe_z_clearance  = Z height (gcode space) the toolhead travels to before
#                       descending to probe. Must clear any bed features.
variable_probe_x:          -1.0   # set to bed centre X, or -1 to auto-detect
variable_probe_y:          -1.0   # set to bed centre Y, or -1 to auto-detect
variable_probe_fuzz:         2.0
variable_probe_z_clearance: 10.0

# ── Homing move speeds ───────────────────────────────────────────────
#  Only the moves the homing override makes itself (step aside to
#  clearance_y, Z hop, travel to the probe point, lift). The homing passes
#  are plain G28 and use your [stepper_*] homing settings.
#  home_travel_feedrate = mm/min for the move out of the docks before XY is
#                         homed. The move to probe_x/probe_y runs at the
#                         tool change travel speed (XY is homed by then).
#  home_z_feedrate      = mm/min for the Z hop and the post-probe lift.
#                         Lower this for a slow leadscrew.
variable_home_travel_feedrate: 3000
variable_home_z_feedrate:       900

#  home_z_cmd = the command that touches the bed to home Z, with the tool
#               seated over the probe point. With an eddy scanner and the
#               scanner_z_seek module, LOAD_CELL_Z_HOME stops 0.5 mm past the
#               expected touch, so a missing tool stops in the air, not in
#               the bed.
variable_home_z_cmd: "G28 Z"

# ── Homing seat check ────────────────────────────────────────────────────────
#  home_check_seat = ask the load cell whether a tool is seated before G28 Z.
#                    It only weighs once the load cell is calibrated (before
#                    that the recorded tool answers). Also on the INDX page
#                    (Settings, Machine, Homing and moves). When the cell and
#                    the recorded tool disagree, G28 first pushes the tool's
#                    filament against its plug (needs [tmc_sg_log]) and
#                    refuses only if the cell feels nothing.
#                    The reading counts from the empty-head calibration
#                    (reference_tare_counts) and drifts with temperature.
#                    False trusts active_tool, as every tool change does.
#                    The load cell stays the Z probe either way. [EL-MAC-001]
#                    Write True or False, capitalised: Klipper parses these as
#                    Python literals and a lower-case true is a startup error.
variable_home_check_seat: True

#  home_min_force_g = grams the load cell must show before G28 Z.
#                     Only used when home_check_seat is True. Raise if an
#                     empty head passes; lower only if a seated tool fails.
variable_home_min_force_g: 590.0

#  Load cell rating shown by INDX_STATUS and the INDX page (display only;
#  the checks use home_min_force_g). Grams against the empty-head reading of
#  the last pickup, sign ignored.
#    Tool on the head: good from seat_ref_min_g to seat_ref_max_g, ok from
#      home_min_force_g to seat_max_g, else check (below: not seated; above:
#      a hard lock, a blob or a crash pressing on the nozzle).
#    Empty head: good below empty_ref_max_g, ok below home_min_force_g,
#      at or above it something is on the head.
variable_seat_ref_min_g: 1185.0   # the spring force 1480 g -20 %
variable_seat_ref_max_g: 1775.0   # the spring force 1480 g +20 % [EL-MAC-002]
variable_seat_max_g: 2600.0
variable_empty_ref_max_g: 130.0

#  lc_stick_g = grams the load cell can stay shifted for many tool changes
#               (it sticks after a load and lets go later, for example after
#               a restart). Checks that compare a reading with a learned
#               history allow this much on top of the spread they measured:
#               the park check of an ooze stopper dock and the wear trends.
#               Checks against a reading taken seconds before need none.
#               The support log records the shift (stick_g) to set it from
#               data. [EL-TC-073]
variable_lc_stick_g: 80.0

# ── Load cell reference tare ─────────────────────────────────────────────────
#  lc_tare_cmd = gcode that re-zeroes the load cell's reference at the current
#                reading, run with a tool seated and the nozzle in the air
#                (before the G28 Z tap and after every pickup), so the
#                force_safety_limit window follows each tool's latch preload.
#                Empty (the default) disables it. Needs a Kalico whose
#                LOAD_CELL_CALIBRATE takes TARE=TRUE.
#                [EL-DOC-002]
variable_lc_tare_cmd: ""

# ── Dock approach direction ──────────────────────────────────────────────────
#  dock_dir = Y sign into the dock: -1 front (min Y), +1 rear (max Y).
#             Flips trigger line, unlock depths, peel, and the homing
#             X-clearance check relative to dock_y.
variable_dock_dir: -1

# ── Dock approach ────────────────────────────────────────────────────────────
#  The magnet line (9 mm in front of dock_y) is INDX hardware, set in
#  _INDX_CONSTANTS (magnet_offset); nothing to set here. [EL-MAC-003]

# ── Safe lateral travel position ─────────────────────────────────────────────
#  clearance_y = Y coordinate where the toolhead clears ALL docked tools.
#                The toolhead moves here before any X travel between tools.
#                It must be at least tool_clearance_depth from the most
#                protruding dock, away from the docks; homing and tool
#                changes refuse otherwise (_INDX_CHECK_CLEARANCE).
#                "auto" (the default) follows the docks: the most protruding
#                dock plus tool_clearance_depth. A number fixes it (still
#                checked). INDX_SET_CLEARANCE changes it.
variable_clearance_y: "auto"     # most protruding dock + tool_clearance_depth; placeholder docks at -26 give 0.0

#  tool_clearance_depth = mm from the most protruding dock to the clearance
#                line. A stock INDX tool needs 25 mm; 26 keeps 1 mm in hand.
#                Also on the INDX page (Settings).
variable_tool_clearance_depth: 26.0

# ── Nozzle camera power (opt-in) ──────────────────────────────────────────────
#  cam_power_device = name of a Moonraker [power] device that runs the nozzle
#                     camera, or "" (the default) to never switch it. INDX
#                     turns it on at the camera and off when the head
#                     leaves. In moonraker.conf, with the camera service
#                     enabled (e.g. sudo systemctl enable crowsnest):
#                       [power nozzle_cam]
#                       type: klipper_device
#                       object_name: gcode_macro _INDX_CAM_POWER
#                       bound_services: crowsnest
#                       initial_state: off
variable_cam_power_device: ""

# ── Dock calibration ──────────────────────────────────────────────────────────
#  A dock counts as measured once INDX_CAL_DOCK (or INDX_CAL_DOCK_X_HERE and
#  INDX_CAL_DOCK_Y_HERE) has saved it in variables.cfg. INDX never drives into
#  a dock that is not measured (the positions below are placeholders). To
#  home before the T0 dock is measured, put T0 on the head by hand and run
#  INDX_SEAT_TOOL_BY_HAND TOOL=0, then G28.
#  The first pickup or park at a newly measured dock runs at 20 % speed.
#
#  docks_calibrated = True accepts every dock below as it is, measured or
#                     not (for a printer whose positions are already known).
#                     False (the default for a new install) asks for each
#                     dock to be measured.
variable_docks_calibrated: False

# ── Dock positions before they are measured ──────────────────────────────────
#  t0_x / t0_dock_y = where INDX expects the T0 dock before anything is
#                     measured (machine mm; dock_y is where the tool sits
#                     fully seated, further along dock_dir is deeper).
#  dock_spacing     = mm in X from one dock to the next (negative when the
#                     docks count up toward X min). A dock not yet measured is
#                     estimated from the nearest measured dock and this
#                     spacing, only to put the head in front of it.
#  Per-dock t1_x, t1_dock_y, ... pairs, if present, are read the same way.
#
variable_t0_x:       0.0
variable_t0_dock_y: -26
variable_dock_spacing: 43.7

# ── Tools that must never be heated ──────────────────────────────────────────
#  no_heat_tools = tools that are never heated (a pen, a cutter, a camera):
#                  changed like any tool, the coil never turns on for them.
#                  Example for a pen in dock 3:  variable_no_heat_tools: [3]
variable_no_heat_tools: []

# ── Print start bed prime (PRIME_GRID) ──────────────────────────────────────
#  At print start every tool of the job is primed, cleaned and Z-checked in a
#  purge lane along the bed edge: one 80 x 3 mm slot per tool, rows of 3 mm
#  from the corner. Every print starts from the first slot again, so clear
#  the strip between prints.
#
#  prime_enabled  = False to use your own purge instead (slicer purge line,
#                   wipe tower). PRIME_GRID then only heats the first tool:
#                   no per-tool Z check, and Z stays as G28 measured it with
#                   the reference tool. PRINT_START PRIME=0 does the same for one print.
#  prime_corner   = front_right, front_left, back_right or back_left.
#                   Front right keeps the lane clear of the tool pickups.
#  prime_bed_size = [] reads the bed from your [stepper_x] / [stepper_y]
#                   limits (Y from 0). Set [x, y] if the sheet is smaller
#                   than the travel (e.g. X travel 353 on a 350 mm bed):
#                   [350, 350].
#  prime_margin_enabled = False (default) starts the lane at the bed edge.
#                   True moves it prime_margin in, for a bed whose very edge
#                   taps wrong.
#  prime_margin   = mm between the bed edges and the lane when
#                   prime_margin_enabled is True.
#  prime_area     = [] uses the bed as above. [x_min, y_min, x_max, y_max]
#                   keeps the lane inside that rectangle (a clip or sensor
#                   on the bed edge); the corner says where the slots start.
#                   At least 80 mm wide and deep enough for tools + spares
#                   (as many as tools, at least 2) in 3 mm rows, e.g. 4 tools
#                   on 160 mm = 8 slots = 4 rows = 12 mm. Slot size is fixed.
#  prime_near_print = True puts the lane prime_print_gap mm in front of (or
#                   behind) the print when its objects are known
#                   (EXCLUDE_OBJECT_DEFINE), else the usual lane.
#  prime_print_gap = mm between the lane and the print.
variable_prime_enabled: True
variable_prime_corner: "front_right"
variable_prime_bed_size: []
variable_prime_margin_enabled: False
variable_prime_margin: 15
variable_prime_area: []
variable_prime_near_print: True
variable_prime_print_gap: 10

# ── Assembled at startup from the variables above: do not edit ──────────────
variable_tools: []

gcode:

#####################################################################
#  TOOL SHORTCUT MACROS (T0 to T3)
#####################################################################
#  Each Tn routes to CHANGE_TOOL, which refuses a tool that does not exist.
#  The INDX Suite adds T4 and up for every counted dock; otherwise add
#  more the same way. variable_active marks the tool on the head for the
#  Mainsail and Fluidd tool buttons.
#####################################################################

[gcode_macro T0]
description: Change to T0 (CHANGE_TOOL TOOL=0)
variable_active: False
gcode: CHANGE_TOOL TOOL=0
[gcode_macro T1]
description: Change to T1 (CHANGE_TOOL TOOL=1)
variable_active: False
gcode: CHANGE_TOOL TOOL=1
[gcode_macro T2]
description: Change to T2 (CHANGE_TOOL TOOL=2)
variable_active: False
gcode: CHANGE_TOOL TOOL=2
[gcode_macro T3]
description: Change to T3 (CHANGE_TOOL TOOL=3)
variable_active: False
gcode: CHANGE_TOOL TOOL=3
