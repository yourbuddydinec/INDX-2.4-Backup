# RESUME and CANCEL_PRINT hooks for Mainsail's and Fluidd's macros
# (mainsail.cfg, fluidd.cfg). Their RESUME runs user_resume_macro first and
# their CANCEL_PRINT runs user_cancel_macro, both read from _CLIENT_VARIABLE:
#   _INDX_RESUME_HOOK  RESUME after an INDX hold (print start prime, failed
#                      tool change) reheats and redoes it, then resumes the
#                      print. Without it the print goes on cold and unprimed.
#   _INDX_CANCEL_HOOK  CANCEL_PRINT forgets the hold, so a later print's
#                      RESUME does not replay it.
#
# Klipper merges this into a _CLIENT_VARIABLE of your own, which keeps its
# other settings; if yours sets these two as well, the last one read wins
# (INDX_STATUS and the print start warn when RESUME skips _INDX_RESUME_HOOK).
# The empty gcode replaces a gcode of your own _CLIENT_VARIABLE.
#
# Your own RESUME macro (not Mainsail's or Fluidd's): make _INDX_RESUME_HOOK
# its first line, and _INDX_CANCEL_HOOK the first line of your CANCEL_PRINT.
[gcode_macro _CLIENT_VARIABLE]
variable_user_resume_macro: "_INDX_RESUME_HOOK"
variable_user_cancel_macro: "_INDX_CANCEL_HOOK"
gcode:
