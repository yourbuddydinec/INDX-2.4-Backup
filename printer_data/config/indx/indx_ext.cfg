#####################################################################
#  INDX extension API: registration and stations [EL-MAC-011]
#
#  [indx_extension <name>] registers an extension (INDX_STATUS lists it, the
#  support log records it). [indx_station <name>] offers a service (the tool
#  change purge, the G28 unfreeze of a frozen reference tool, the INDX_LOAD
#  prime spot); its zone is checked against the docks and axis limits before
#  every call, and the return to the clearance line after it. An extension
#  may add an optional setup step (never counted, never next on its own).
#  Events and printer.indx_api: indx_ext_api.cfg.
#
#  Without an extension nothing here changes what INDX does. Extensions put
#  their cfg in indx/ext/ (included by indx_includes.cfg) and use the modules
#  indx_extension.py and indx_station.py.
#####################################################################

[gcode_macro _INDX_STATIONS]
description: Inner - the registered stations by service (the first [indx_station] that offers it), set 0.7 s after a restart; dock_half_width: how close in X to a dock a station zone may come behind the dock's activation line
variable_purge: ""
variable_unfreeze: ""
variable_load: ""
variable_guards: []
variable_print_starts: []
variable_dock_half_width: 22.0
gcode:

[delayed_gcode _indx_ext_init]
initial_duration: 0.7
gcode:
    _INDX_EXT_INIT

[gcode_macro _INDX_EXT_INIT]
description: Inner - after a restart: note the registered stations per service, and add every extension's optional setup step to the setup steps (_INDX_STEPS, _INDX_STEP_GROUPS)
gcode:
    {% set cs = printer.configfile.settings %}
    {% set ns = namespace(purge="", unfreeze="", load="", guards=[], starts=[], steps=printer["gcode_macro _INDX_STEPS"].steps, groups=printer["gcode_macro _INDX_STEP_GROUPS"].groups, added=0) %}
    {% for sec in cs if sec.startswith("indx_station ") and sec in printer %}
        {% set st = printer[sec] %}
        {% if st.when == "after_pickup" and st.purge and not ns.purge %}{% set ns.purge = st.name %}{% endif %}
        {% if st.unfreeze and not st.moves_z and not ns.unfreeze %}{% set ns.unfreeze = st.name %}{% endif %}
        {% if st.load_enter and not ns.load %}{% set ns.load = st.name %}{% endif %}
        {% if st.guard %}{% set ns.guards = ns.guards + [st.guard] %}{% endif %}
        {% if st.print_start %}{% set ns.starts = ns.starts + [st.print_start] %}{% endif %}
    {% endfor %}
    {% for sec in cs if (sec.startswith("indx_extension ") or sec == "indx_dock_sensor") and sec in printer %}
        {% set e = printer[sec] %}
        {% set su = e.setup %}
        {% if su.key is defined %}
            {% if su.key not in ns.steps|map(attribute="key")|list %}
                {% set ns.steps = ns.steps + [{"key": su.key, "label": su.label, "cmd": su.cmd, "needs": su.needs|default(""), "moves": su.moves|default(""), "time": su.time|default(""), "ext": e.name}] %}
                {% set ns.groups = ns.groups + [{"key": "ext_" ~ su.key, "label": su.label, "hand": su.hand|default(""), "routines": [su.key]}] %}
                {% set ns.added = ns.added + 1 %}
            {% else %}
                RESPOND TYPE=error MSG="INDX ! Extension {e.name}: setup_key '{su.key}' is already registered by another extension. The second registration is ignored."
            {% endif %}
        {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_INDX_STATIONS VARIABLE=purge VALUE='{ns.purge|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATIONS VARIABLE=unfreeze VALUE='{ns.unfreeze|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATIONS VARIABLE=load VALUE='{ns.load|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATIONS VARIABLE=guards VALUE='{ns.guards|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATIONS VARIABLE=print_starts VALUE='{ns.starts|tojson}'
    # the printer's own PAUSE: does it park in or next to the dock zone (indx_api.py)
    {% if "indx_api" in printer %}
        _INDX_PAUSE_CHECK QUIET=1
    {% endif %}
    {% if ns.added %}
        SET_GCODE_VARIABLE MACRO=_INDX_STEPS VARIABLE=steps VALUE='{ns.steps|tojson}'
        SET_GCODE_VARIABLE MACRO=_INDX_STEP_GROUPS VARIABLE=groups VALUE='{ns.groups|tojson}'
    {% endif %}

# A station's readiness (used inline by PRINT_TOOLCHANGE, _INDX_HOME_Z_DECIDE and _INDX_LOAD_SPOT, which must decide while they render): the station is registered, its enabled_by macro variable is true and its ready_when saved variable holds (var=value, or var: defined).

[gcode_macro _INDX_STATION_CHECK]
description: Inner - before a station runs: its zone (from its saved origin) must lie inside the axis limits and keep clear of every dock behind the dock's activation line; else stop before anything moves
gcode:
    {% set name = params.NAME|string %}
    {% set sec = "indx_station " ~ name %}
    {% if sec not in printer %}
        _INDX_RAISE MSG="INDX: station {name} is not registered"
    {% else %}
        {% set st = printer[sec] %}
        {% set sv = printer.save_variables.variables %}
        {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
        {% set th = printer.toolhead %}
        {% set o = printer.gcode_move.homing_origin %}
        {% set hw = printer["gcode_macro _INDX_STATIONS"].dock_half_width|float %}
        {% set mo = printer["gcode_macro _INDX_CONSTANTS"].magnet_offset|float %}
        {% set ox = sv[st.origin[0]]|default(none) if st.origin else 0.0 %}
        {% set oy = sv[st.origin[1]]|default(none) if st.origin else 0.0 %}
        {% set ns = namespace(why=[]) %}
        {% if ox is none or oy is none %}
            {% set _ = ns.why.append("its origin (%s) is not saved: calibrate it first" % st.origin|join(", ")) %}
        {% else %}
            # the zone in machine (carriage) positions, as the axis limits and the docks
            {% set z = [ox|float + st.zone[0] + o.x|float, oy|float + st.zone[1] + o.y|float, ox|float + st.zone[2] + o.x|float, oy|float + st.zone[3] + o.y|float] %}
            {% if z[0] < th.axis_minimum.x or z[2] > th.axis_maximum.x or z[1] < th.axis_minimum.y or z[3] > th.axis_maximum.y %}
                {% set _ = ns.why.append("its zone X%.1f..%.1f Y%.1f..%.1f leaves the axis limits" % (z[0], z[2], z[1], z[3])) %}
            {% endif %}
            {% for d in tp.tools|default([]) if d.x|float >= 0 %}
                {% set trig = d.dock_y|float - tp.dock_dir|float * mo %}
                # behind the activation line: toward the dock (dock_dir) past trig
                {% set deep = z[1] < trig if tp.dock_dir|float < 0 else z[3] > trig %}
                {% if deep and z[0] < d.x|float + hw and z[2] > d.x|float - hw %}
                    {% set _ = ns.why.append("its zone X%.1f..%.1f reaches past the activation line of T%d's dock (X%.1f, line Y%.1f)" % (z[0], z[2], loop.index0, d.x|float, trig)) %}
                {% endif %}
            {% endfor %}
        {% endif %}
        {% if ns.why %}
            RESPOND TYPE=error MSG="INDX ! Station {name} does not run: {ns.why|join('; ')}. Nothing moved."
            _INDX_RAISE MSG="INDX: station {name} zone check failed, see above"
        {% endif %}
    {% endif %}

[gcode_macro _INDX_STATION_RETURN]
description: Inner - after a station ran: it must hand the head back at the dock clearance line (return clearance), or INDX stops
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set y = printer.toolhead.position.y|float %}
    {% if tp.clearance_y is number and (y - tp.clearance_y|float) * tp.dock_dir|float > 0.01 %}
        _INDX_RAISE MSG="INDX: station {params.NAME} handed the head back at Y{'%.2f'|format(y)}, behind the dock clearance line Y{'%.2f'|format(tp.clearance_y|float)}. Stopped where it is."
    {% endif %}
