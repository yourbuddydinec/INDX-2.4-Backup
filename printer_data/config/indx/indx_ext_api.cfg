#####################################################################
#  INDX extension API: printer.indx_api and the INDX events
#
#  klipper_extras/indx_api.py: the status object printer.indx_api (read
#  only, from INDX's own saved and macro state) and _INDX_EVENT, which INDX's
#  macros use to send their events to Python modules ("indx:<event>") and to
#  the on_<event> macros of [indx_extension] sections. See the module for the
#  fields, the events and the rules hooks run under.
#
#  The [indx_api] section that loads the module is in indx_suite.cfg. This
#  file is the INDX Suite's (install.sh links it with the modules): an INDX
#  Macros install has neither the module nor these commands.
#
#  Without an extension nothing listens and the event lines do not render;
#  only the stop path records the last stop for the status (no output).
#####################################################################

#####################################################################
#  Tool manager commands (extension API stage 3, API 1)
#
#  For an [indx_extension] with role: tool_manager (a filament system such
#  as AFC that drives INDX from above); without one they refuse.
#  INDX_CHANGE_TOOL and INDX_PARK_TOOL are in indx_api.py, INDX_SET_TEMP in
#  indx_prime.cfg.
#####################################################################

[gcode_macro _INDX_TM_GATE]
description: Inner - refuse CMD= unless a tool manager is registered
gcode:
    {% if not ("indx_api" in printer and printer.indx_api.tool_manager) %}
        {action_raise_error("%s is INDX's tool manager command: no [indx_extension] with role: tool_manager is registered. Nothing changed." % params.CMD|default("INDX"))}
    {% endif %}

[gcode_macro INDX_FILAMENT_STATE]
description: Tool manager API 1: TOOL=n was loaded (LOADED=1) or unloaded (LOADED=0) outside INDX. Unloaded: no material, the heater model's filament cleared, no retraction to push back. Loaded: no retraction to push back (the manager left the filament where it wants it); TYPE= sets the material (INDX_SET_TOOL_MATERIAL), needed when T<n> has none recorded. Moves: nothing. Saves: tN_retracted, and the material records
gcode:
    _INDX_TM_GATE CMD=INDX_FILAMENT_STATE
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set t = params.TOOL|default(-1)|int %}
    {% set svv = printer.save_variables.variables %}
    {% if t < 0 or t >= tp.tool_count|int %}
        {action_raise_error("INDX_FILAMENT_STATE: TOOL=0 to %d. Nothing changed." % (tp.tool_count|int - 1))}
    {% elif params.LOADED is not defined %}
        {action_raise_error("INDX_FILAMENT_STATE: LOADED=1 (loaded) or LOADED=0 (unloaded). Nothing changed.")}
    {% elif t in tp.no_heat_tools|default([]) and params.LOADED|int %}
        {action_raise_error("INDX_FILAMENT_STATE: T%d is a tool without heating (no_heat_tools), it takes no filament. Nothing changed." % t)}
    {% elif params.LOADED|int and not params.TYPE|default("")|string|trim and not svv["t%d_material" % t]|default("")|string %}
        {action_raise_error("INDX_FILAMENT_STATE: T%d has no material recorded: give TYPE=<material> with LOADED=1. Nothing changed." % t)}
    {% endif %}
    # Whatever INDX pulled back at the last park is not there any more: the
    # manager unloaded, or loaded to where it wants the filament
    SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE=0
    {% if params.LOADED|int %}
        {% if params.TYPE|default("")|string|trim %}
            _INDX_SET_TOOL_MATERIAL_APPLY TOOL={t} TYPE={params.TYPE|string|trim}
        {% endif %}
        {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=filament_state TOOL={t} LOADED=1{% endif %}
    {% else %}
        # no material, no filament for the heater model (fires filament_state)
        _INDX_FIL_RECORD TOOL={t} TYPE=NONE
    {% endif %}

[gcode_macro INDX_SET_TOOL_MATERIAL]
description: Tool manager API 1: the material in TOOL=n changed outside INDX (several lanes feeding one tool): TYPE= a material of LOAD_FILAMENT's presets. Updates the material record and the heater model's filament (density, heat capacity; at once when T<n> is on the head, else at its next pickup) only: no pickup, no prime, no heating. Moves: nothing. Saves: tN_material, tN_fil_density, tN_fil_hc
gcode:
    _INDX_TM_GATE CMD=INDX_SET_TOOL_MATERIAL
    _INDX_SET_TOOL_MATERIAL_APPLY TOOL={params.TOOL|default(-1)|int} TYPE={params.TYPE|default("")|string|trim}

[gcode_macro _INDX_SET_TOOL_MATERIAL_APPLY]
description: Inner - INDX_SET_TOOL_MATERIAL and INDX_FILAMENT_STATE TYPE=: TOOL= TYPE= into the material record and the heater model
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set presets = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    {% set t = params.TOOL|default(-1)|int %}
    {% set type = params.TYPE|default("")|string|upper %}
    {% if t < 0 or t >= tp.tool_count|int %}
        {action_raise_error("INDX_SET_TOOL_MATERIAL: TOOL=0 to %d. Nothing changed." % (tp.tool_count|int - 1))}
    {% elif t in tp.no_heat_tools|default([]) %}
        {action_raise_error("INDX_SET_TOOL_MATERIAL: T%d is a tool without heating (no_heat_tools), it takes no filament. Nothing changed." % t)}
    {% elif type not in presets %}
        {action_raise_error("INDX_SET_TOOL_MATERIAL: TYPE=%s is not a known material (%s). Add it with INDX_FILAMENT_PRESET. Nothing changed." % (type, presets|join(", ")))}
    {% endif %}
    {% set d = presets[type].density|float %}
    {% set h = presets[type].hc|float %}
    SAVE_VARIABLE VARIABLE=t{t}_material VALUE='"{type}"'
    SAVE_VARIABLE VARIABLE=t{t}_last_material VALUE='"{type}"'
    SAVE_VARIABLE VARIABLE=t{t}_fil_density VALUE={d}
    SAVE_VARIABLE VARIABLE=t{t}_fil_hc VALUE={h}
    # the heater model holds the filament of the tool on the head only; a
    # docked tool's is applied at its pickup (_APPLY_TOOL_FILAMENT)
    {% if printer.save_variables.variables.active_tool|default(-1)|int == t %}
        INDX_SET_MODEL_PARAMS FILAMENT_DENSITY={d} FILAMENT_HEAT_CAPACITY={h}
    {% endif %}
    RESPOND MSG="INDX ok T{t}: {type} (density {d} g/cm3, heat capacity {h} J/g/K) for the heater model"
