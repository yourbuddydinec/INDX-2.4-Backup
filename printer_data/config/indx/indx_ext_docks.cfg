#####################################################################
#  INDX dock sensors (extension API stage 2, internal/extension-api.md
#  section 5): the macro side of klipper_extras/indx_dock_sensor.py.
#
#  Optional: without an [indx_dock_sensor] section none of these runs (every
#  call is guarded by "indx_dock_sensor" in printer).
#
#  The module reads the switches and decides; these macros act on its
#  verdict (printer.indx_dock_sensor.verdict) through the INDX stop path:
#    warn                      a warning, a notification, the support log; carry on
#    pause, in a running print, inside a tool change (before it moves, after
#                              the park, after the pickup): held like a failed
#                              pickup: heater off, PAUSE, RESUME redoes the change
#    pause, in a running print, the watch (a docked tool left its dock): PAUSE,
#                              heater off
#    pause, a park on its own  (in a running print, the print end): heater off,
#                              PAUSE, no redo
#    pause, anything else      (outside a print, the print start, G28, the print
#                              start prime): heater off, stop with an error
#  The load cell checks run first and stop on their own.
#####################################################################

[gcode_macro _INDX_DSENS_AFTER_PARK]
description: Inner - dock sensors: after a park the dock must read the tool present. TOOL= the parked tool, LC=1 when the load cell park check ran (it stops by itself when it fails), CHANGE=1 inside a tool change
gcode:
    {% if "indx_dock_sensor" not in printer %}{action_raise_error("INDX: _INDX_DSENS_AFTER_PARK needs the dock sensors ([indx_dock_sensor]); every call from INDX checks for them first. Nothing moved.")}{% endif %}
    {% set e = printer["gcode_macro _INDX_LC_STORE"] %}
    {% set lc = printer.load_cell_probe|default({}) %}
    {% set ran = params.LC|default(0)|int and lc.counts_per_gram|default(0)|float > 0 and lc.force_g is defined and lc.force_g is not none %}
    {% set g = none %}
    {% if ran %}
        {% if e.empty_from_park|int and e.empty_valid|int %}
            # the park check's own two readings (a tool change)
            {% set g = e.empty_g|float - e.seated_g|float %}
        {% else %}
            # a park on its own: the head now against the seated reading
            {% set cfgl = printer.configfile.settings.load_cell_probe %}
            {% set ref = cfgl.reference_tare_counts %}
            {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
            {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
            {% set g = lc.force_g|float + inv * (lc.tare_counts|float - ref|float) / lc.counts_per_gram|float - e.seated_g|float %}
        {% endif %}
    {% endif %}
    _INDX_DSENS_PARK TOOL={params.TOOL|int} LC={1 if ran else 0}{(" LC_G=%.0f" % g) if g is not none else ""} CHANGE={params.CHANGE|default(0)|int}
    _INDX_DSENS_VERDICT CHANGE={params.CHANGE|default(0)|int}

[gcode_macro _INDX_DSENS_AFTER_PICKUP]
description: Inner - dock sensors: after a pickup whose seat check passed, the dock must read empty. TOOL= RACE=1 when the seat was not checked (race mode)
gcode:
    {% if "indx_dock_sensor" not in printer %}{action_raise_error("INDX: _INDX_DSENS_AFTER_PICKUP needs the dock sensors ([indx_dock_sensor]); every call from INDX checks for them first. Nothing moved.")}{% endif %}
    {% set sc = printer["gcode_macro _INDX_SEAT_CHECK"] %}
    {% set lc = printer.load_cell_probe|default({}) %}
    {% set race = params.RACE|default(0)|int %}
    {% set lc_ok = not race and lc.counts_per_gram|default(0)|float > 0 %}
    # a failed seat check has stopped or held the change itself
    {% if sc.ok|int and not printer["gcode_macro _PICKUP_SEAT_FAIL"].held|int %}
        _INDX_DSENS_PICKUP TOOL={params.TOOL|int} LC={1 if lc_ok else 0}{(" LC_G=%.0f" % sc.force_g|float) if lc_ok else ""}
        _INDX_DSENS_VERDICT CHANGE=1
    {% endif %}

[gcode_macro _INDX_DSENS_BEFORE_CHANGE]
description: Inner - dock sensors: before a tool change moves, the next tool must be in its dock, the dock of the tool on the head empty, and every other dock the print uses full. TOOL= TEMP= (for the redo on RESUME)
gcode:
    {% if "indx_dock_sensor" not in printer %}{action_raise_error("INDX: _INDX_DSENS_BEFORE_CHANGE needs the dock sensors ([indx_dock_sensor]); every call from INDX checks for them first. Nothing moved.")}{% endif %}
    _INDX_DSENS_BEFORE TOOL={params.TOOL|int} TEMP={params.TEMP|default(-1)}
    _INDX_DSENS_VERDICT CHANGE=1

[gcode_macro _INDX_DSENS_BEFORE_PRINT]
description: Inner - dock sensors: at the print start, before anything heats, every dock the print uses (TOOLS=) must hold its tool and the dock of the tool on the head must be empty
gcode:
    {% if "indx_dock_sensor" not in printer %}{action_raise_error("INDX: _INDX_DSENS_BEFORE_PRINT needs the dock sensors ([indx_dock_sensor]); every call from INDX checks for them first. Nothing moved.")}{% endif %}
    _INDX_DSENS_PRINT TOOLS={params.TOOLS|default("")}
    _INDX_DSENS_VERDICT

[gcode_macro _INDX_DSENS_VERDICT]
description: Inner - dock sensors: act on the last check (printer.indx_dock_sensor.verdict): stop through _INDX_DSENS_STOP, warn on an unstable switch, nothing when it agreed. CHANGE=1 inside a tool change
gcode:
    {% if "indx_dock_sensor" not in printer %}{action_raise_error("INDX: _INDX_DSENS_VERDICT needs the dock sensors ([indx_dock_sensor]); every call from INDX checks for them first. Nothing moved.")}{% endif %}
    {% set v = printer.indx_dock_sensor.verdict %}
    {% if v.result == "stop" %}
        _INDX_DSENS_STOP CHANGE={params.CHANGE|default(0)|int}
    {% elif v.result == "unstable" %}
        RESPOND TYPE=error MSG="INDX ! {v.msg}"
    {% elif v.check == "dock_before_print" %}
        RESPOND MSG="INDX > Dock sensors, {v.msg}"
    {% endif %}

[gcode_macro _INDX_DSENS_STOP]
description: Inner - dock sensors: a dock check failed. Its severity decides (INDX_SET_SEVERITY): warn carries on; pause holds a tool change in a running print (RESUME redoes it), pauses the print for the watch, and stops with an error anywhere else. Heater off on every pause and stop
gcode:
    {% if "indx_dock_sensor" not in printer %}{action_raise_error("INDX: _INDX_DSENS_STOP needs the dock sensors ([indx_dock_sensor]); every call from INDX checks for them first. Nothing moved.")}{% endif %}
    {% set ds = printer.indx_dock_sensor %}
    {% set v = ds.verdict %}
    {% set lvl = ds.severity[v.check]|default("pause") %}
    {% set tv = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% set pg = printer["gcode_macro PRIME_GRID"] if "gcode_macro PRIME_GRID" in printer else {} %}
    # A running print outside G28 and the print start prime: those stop with
    # an error (G28 must not go on to probe Z, the prime has its own hold)
    {% set printing = printer.print_stats.state == "printing" and not tv.homing_busy|default(0)|int and not pg.active|default(0)|int %}
    {% set pm = printer.configfile.settings["gcode_macro pause"] %}
    {% set pause_base = pm.rename_existing if pm is defined and pm.rename_existing is defined else "PAUSE" %}
    {% if lvl == "warn" %}
        RESPOND TYPE=error MSG="INDX ! {v.msg} The {v.check} check is set to warn: carrying on."
        _INDX_NOTE LEVEL=warn TITLE="{v.title}" MSG="{v.msg}"
    {% elif printing and v.check == "dock_watch" %}
        # Like a filament runout: the print's own PAUSE (the head moves away
        # as the client does it), then the heater off (after the PAUSE, so the
        # client's RESUME heats back to the print temperature)
        _INDX_LCD LEVEL=warn MSG="{v.lcd}"
        _INDX_NOTE LEVEL=stop TITLE="{v.title}" MSG="{v.msg}"
        RESPOND TYPE=error MSG="INDX ! {v.msg} Print paused, heater off."
        {% if "indx_api" in printer %}_INDX_EVENT EVENT=stop CHECK={v.check} PAUSE=1 REASON="{v.msg|replace(';', ',')}"{% endif %}
        PAUSE
        M104 S0
    {% elif printing and params.CHANGE|default(0)|int and v.redo and v.check != "dock_before_print" %}
        # Inside a tool change: held like a failed pickup (_PICKUP_SEAT_FAIL).
        # The rest of the change does not move (_CHANGE_TOOL_APPLY and
        # _PICKUP_TOOL read the hold), the head stays at the clearance line,
        # and RESUME (_INDX_RESUME_HOOK) redoes the outermost tool change
        {% set pf = printer["gcode_macro _PICKUP_SEAT_FAIL"] %}
        {% set cmd = pf.outer_cmd if pf.outer_cmd|length else v.redo %}
        M104 S0
        _INDX_LCD LEVEL=action MSG="{v.lcd}"
        _INDX_NOTE LEVEL=stop TITLE="{v.title}" MSG="{v.msg}"
        SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=resume_cmd VALUE='"{cmd}"'
        SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=held VALUE=1
        _INDX_DSENS_HOLD VALUE=1
        RESPOND TYPE=error MSG="INDX ! {v.msg} Print paused with the heater off. Then RESUME: the tool change runs again and the print goes on."
        {% if "indx_api" in printer %}_INDX_EVENT EVENT=stop CHECK={v.check} PAUSE=1 REASON="{v.msg|replace(';', ',')}"{% endif %}
        {pause_base}
        # motors stay on through the hold (_PICKUP_RESUME puts the timeout back)
        SET_IDLE_TIMEOUT TIMEOUT=43200
    {% elif printing and v.check == "dock_park" %}
        # a park on its own in a running print (the print end): pause, no redo
        M104 S0
        _INDX_LCD LEVEL=action MSG="{v.lcd}"
        _INDX_NOTE LEVEL=stop TITLE="{v.title}" MSG="{v.msg}"
        RESPOND TYPE=error MSG="INDX ! {v.msg} Print paused with the heater off."
        {% if "indx_api" in printer %}_INDX_EVENT EVENT=stop CHECK={v.check} PAUSE=1 REASON="{v.msg|replace(';', ',')}"{% endif %}
        {pause_base}
        _INDX_PAUSE_STATES
    {% else %}
        M104 S0
        _INDX_LCD LEVEL=warn MSG="{v.lcd}"
        _INDX_NOTE LEVEL=stop TITLE="{v.title}" MSG="{v.msg}"
        RESPOND TYPE=error MSG="INDX ! {v.msg} Stopped with the heater off."
        _INDX_RAISE MSG="INDX: {v.title}, see above"
    {% endif %}
