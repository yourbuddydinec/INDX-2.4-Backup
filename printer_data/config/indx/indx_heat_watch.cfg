#####################################################################
#  INDX heat watch: a soft stop on heater deviation
#
#  klipper_extras/indx_heat_watch.py: pauses the print (PAUSE) when a
#  settled nozzle or bed heater drifts away from its target, before
#  verify_heater (or Kalico's max_model_error) shuts Klipper down and loses
#  the print.
#  Loaded by indx_suite.cfg. This file is the INDX Suite's (install.sh links
#  it with the modules); on an INDX Macros install only verify_heater
#  watches the heaters.
#
#  INDX_HEAT_WATCH   each watched heater, its verify_heater settings and the
#                    race against it
#####################################################################

[gcode_macro _INDX_HEAT_WATCH]
description: Inner - the heater soft stop's settings (Settings tab, Safety; INDX_SETTING MACRO=_INDX_HEAT_WATCH). INDX_HEAT_WATCH shows the state
# enabled        the soft stop on (default). Off: only verify_heater watches
# max_deviation  C away from the target (or the heater model's temperature)
#                that pauses when it lasts hold_s; a fault, never a fan or a
#                layer change [EL-MAC-010]
# hold_s         seconds in a row (1 Hz samples); stops before verify_heater
#                [EL-MAC-010]
# include_bed    the bed too
variable_enabled: True
variable_max_deviation: 30.0
variable_hold_s: 3.0
variable_include_bed: True
gcode:
    INDX_HEAT_WATCH
