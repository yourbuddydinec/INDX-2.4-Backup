# Every INDX macro file, in order. printer.cfg needs only:
#   [include indx/indx.cfg]            your own settings (docks, tool count): not updated
#   [include indx/indx_includes.cfg]   this file: INDX updates add new macro files here
# install.sh links these files from the INDX repository into ~/printer_data/config/indx/.
# The INDX Suite (install.sh) links indx_suite.cfg, which loads the INDX
# Klipper modules, and the macro files that only run with them
# (indx_suite_*.cfg, indx_ext*.cfg, indx_heat_watch*.cfg); INDX Macros
# (install.sh --macros-only) links indx_macros_only.cfg instead. All are
# included with a wildcard, so a file that is not linked is simply not there.
# [EL-UI-013]
# With a [display] (an LCD), also include the INDX LCD menu in printer.cfg:
#   [include indx/indx_menu.cfg]
[include indx-tc-macros.cfg]
[include indx-cal.cfg]
[include homing.cfg]
[include indx_setup.cfg]
[include indx_prime.cfg]
[include indx_screen.cfg]
# A file added after v1.0 is included with a wildcard: until the update links
# it (INDX page, Updates: repair) Klipper still starts instead of stopping on
# a missing include.
[include indx_print*.cfg]
# Mainsail's and Fluidd's RESUME and CANCEL_PRINT run INDX's hooks (merged
# into your own _CLIENT_VARIABLE, if you have one: see the file)
[include indx_client*.cfg]
# The INDX extension API (registration, stations, INDX Suite): indx_ext.cfg;
# every installed extension's cfg is in ext/ (none installed: nothing is
# included)
[include indx_ext*.cfg]
# The heater soft stop's settings (indx_heat_watch.py, INDX Suite): pauses
# before verify_heater would shut Klipper down
[include indx_heat_watch*.cfg]
# The INDX Suite: the INDX Klipper modules and the macros that need them
[include indx_suite*.cfg]
# INDX Macros: M104 and M109 with INDX's heat rules (install.sh --macros-only)
[include indx_macros_only*.cfg]
[include ext/*.cfg]
