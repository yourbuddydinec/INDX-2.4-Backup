#####################################################################
#  INDX Macros: what the INDX Suite does in Python, as macros
#
#  Linked only by install.sh --macros-only, and removed by install.sh for
#  the INDX Suite (with the INDX Suite, klipper_extras/indx_api.py registers
#  M104 and M109 itself). Included by indx_includes.cfg's
#  [include indx_macros_only*.cfg].
#
#  M104 and M109 through INDX_SET_TEMP (the heat rules: a T for a tool not on
#  the head is ignored, a tool without heating is never heated), since
#  Klipper's own M104 stops the print on a T it has no extruder for. Klipper's
#  own stay as M99104 and M99109. An M104 or M109 macro of your own replaces
#  these: make it call INDX_SET_TEMP TARGET=<S> WAIT=<0 or 1> SRC=<M104 or
#  M109> [TOOL=<T>]. [EL-UI-008]
#
#  CHANGE_TOOL: INDX's tool change is _INDX_CHANGE_TOOL. With the INDX Suite,
#  indx_api.py adds CHANGE_TOOL only when nothing else (a tool manager such
#  as AFC) has registered it. [EL-API-005]
#####################################################################

[gcode_macro CHANGE_TOOL]
description: Change to TOOL=n: park the tool on the head, pick up n, apply its offsets, heat to TEMP= if given. Needs: measured docks (homes first if needed). Moves: the head to the docks and back. Saves: active_tool, global_z_offset
gcode:
    _INDX_CHANGE_TOOL {rawparams}

[gcode_macro M104]
description: Set the nozzle temperature with INDX's heat rules (INDX_SET_TEMP); a T for a tool that is not on the head is ignored
rename_existing: M99104
gcode:
    INDX_SET_TEMP TARGET={params.S|default(0)} WAIT=0 SRC=M104{(" TOOL=%d" % params.T|int) if params.T is defined else ""}

[gcode_macro M109]
description: Set the nozzle temperature and wait to within 5 C, with INDX's heat rules (INDX_SET_TEMP); a T for a tool that is not on the head is ignored
rename_existing: M99109
gcode:
    INDX_SET_TEMP TARGET={params.S|default(0)} WAIT=1 SRC=M109{(" TOOL=%d" % params.T|int) if params.T is defined else ""}
