#####################################################################
#  The status screen (16x4 layout, 128x64 displays): the nozzle line names
#  the tool on the head ("T0  25°", "--" empty); the bottom line shows the
#  tool, material and Z when printing, else the head or setup progress.
#  Idle, the feed rate corner shows the last seat check: SeatOK, Seat ~
#  (ambiguous or short lock), Seat ! (failed), Seat ? (no pickup since the
#  restart), Seat - (head empty).
#####################################################################

[display_data _default_16x4 extruder]
position: 0, 0
text:
  {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
  {% if "extruder" in printer %}
    {% set heater = printer.extruder %}
    { ("T%d" % act) if act >= 0 else "--" }
    { "%3.0f" % (heater.temperature,) }
    {% if heater.target and (heater.temperature - heater.target)|abs > 2 %}
      ~right_arrow~
      { "%0.0f" % (heater.target,) }
    {% endif %}
    ~degrees~
  {% endif %}

[display_data _default_16x4 speed_factor]
position: 1, 10
text:
  {% if printer.idle_timeout.printing_time %}
    ~feedrate~
    { "{:>4.0%}".format(printer.gcode_move.speed_factor) }
  {% else %}
    {% set sc = printer["gcode_macro _INDX_SEAT_CHECK"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% if act < 0 %}
      Seat -
    {% elif not sc.force_g|float %}
      Seat ?
    {% elif not sc.ok|int %}
      Seat !
    {% elif sc.ambiguous|default(0)|int or sc.lock_short|default(0)|int %}
      Seat ~
    {% else %}
      SeatOK
    {% endif %}
  {% endif %}

[display_data _default_16x4 print_status]
position: 3, 0
text:
  {% set svv = printer.save_variables.variables %}
  {% set act = svv.active_tool|default(-1)|int %}
  {% set mat = svv["t%d_material" % act]|default("")|string if act >= 0 else "" %}
  {% set mat = "" if mat == "NONE" else mat %}
  {% set st = printer["gcode_macro _INDX_STATE"]|default({}) %}
  {% if printer.display_status.message %}
    { printer.display_status.message }
  {% elif printer.idle_timeout.printing_time %}
    { ("T%d " % act if act >= 0 else "") ~ (mat ~ " " if mat else "") ~ ("Z%.2f" % printer.toolhead.position.z) }
  {% elif act < 0 %}
    Head empty
  {% elif st.total|default(0)|int and st.done|default(0)|int < st.total|default(0)|int %}
    { "T%d Setup %d/%d" % (act, st.done|int, st.total|int) }
  {% else %}
    { "T%d %s ready" % (act, mat if mat else "unloaded") }
  {% endif %}
