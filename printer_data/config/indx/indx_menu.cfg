#####################################################################
#  INDX LCD MENU (for a printer with a [display])
#####################################################################
#
#  Include it only on a printer with a [display]: Klipper refuses [menu]
#  sections without one, so indx_includes.cfg does not include it.
#    [include indx/indx_menu.cfg]
#  Its helper macros (the next step, the result waiting for Save, the
#  cleaning spot) are in indx_screen.cfg, which is always loaded.
#
#  Adds "INDX" to the top of the main menu. Anything that moves, heats or
#  forgets sits behind a worded "Yes, ..." item, since a plain display cannot
#  show INDX's dialogs (commands run with CONFIRM=1). Names stay at 18
#  characters or less. Results show as M117 lines starting with "!"
#  (warning), ">" (action needed) or "ok". Pick-up and seat entries cover T0 to T7,
#  dock calibration T0 to T3, XY offsets T1 to T3 (more: copy a block); Troubleshoot acts on the tool on the head.
#
#  The stock Temperature and Filament heat items are redefined without the T
#  of "M104 T0", which INDX ignores unless T0 is on the head. [EL-MAC-008]
#####################################################################

[menu __main __temp __hotend0_target]
type: input
enable: {('extruder' in printer) and ('extruder' in printer.heaters.available_heaters)}
name: {"Ex0:%3.0f (%4.0f)" % (menu.input, printer.extruder.temperature)}
input: {printer.extruder.target}
input_min: 0
input_max: {printer.configfile.config.extruder.max_temp}
input_step: 1
gcode: M104 S{'%.0f' % menu.input}

[menu __main __filament __hotend0_target]
type: input
enable: {('extruder' in printer) and ('extruder' in printer.heaters.available_heaters)}
