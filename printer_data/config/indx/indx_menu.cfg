[menu __main __indx __cal __lc]
type: list
name: Load cell

# One slide (the first install): 1 zeroes the empty head and switches the
# motors off, 2 with the head held on the reference tool in its dock (locks,
# homes X and Y from the dock, calibrates the load cell), 3 saves a dock
# result that failed a check (a passing one saves itself), 4 SAVE_CONFIG.
# By hand: 1b, then 2b or 2c, then 4. [EL-MAC-009]
[menu __main __indx __cal __lc __start]
type: command
name: 1 Empty: slide
gcode: INDX_CAL_LOADCELL CONFIRM=1 DOCK=1

[menu __main __indx __cal __lc __hold]
type: command
name: 2 On T{printer.save_variables.variables.ref_tool|default(0)|int} in dock: go
gcode: INDX_CAL_DOCK TOOL={printer.save_variables.variables.ref_tool|default(0)|int} STEP=hold LC=1

[menu __main __indx __cal __lc __saved]
type: command
name: 3 Save dock result
gcode: INDX_SAVE_PENDING

[menu __main __indx __cal __lc __start_hand]
type: command
name: 1b Empty: by hand
gcode: INDX_CAL_LOADCELL CONFIRM=1

[menu __main __indx __cal __lc __keep]
type: command
name: 2b T{printer.save_variables.variables.ref_tool|default(0)|int} on: cal, keep
gcode: INDX_CAL_LOADCELL_FINISH KEEP=1

[menu __main __indx __cal __lc __finish]
type: command
name: 2c Other: calib.
gcode: INDX_CAL_LOADCELL_FINISH

[menu __main __indx __cal __lc __save]
type: list
name: 4 Save config...

[menu __main __indx __cal __lc __save __yes]
type: command
name: Yes, restart now
gcode: SAVE_CONFIG

