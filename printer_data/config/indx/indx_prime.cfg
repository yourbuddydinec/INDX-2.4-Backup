#####################################################################
#  Nozzle prime + clean before the final Z zero
#
#  PRIME_CLEAN TEMP=<print temp> [X=30] [Y=8] [E=5.0] [L=4] [COAST=80] [COAST_TEMP=160] [PROBE_TEMP=70]
#    Tap the bed where the coast and the wipe run, heat on the way down to
#    Z0.3 (a cold tip never sits low), push back t<n>_retracted, prime a line
#    to (X,Y) with a load cell flow check, a cleaning blob (E mm over L mm,
#    E=0: none), then coast on in +X with the heater off and the fan on until
#    below COAST_TEMP or COAST mm (never back toward the line, never lifting
#    hot). Retract cool_retract_mm before it cools, so a full nozzle does not
#    ooze a drop that sets under the tip [EL-PRI-002]. Soft wipe at Tg + 80
#    to Tg + 50, cold wipe at PROBE_TEMP on clean bed, cold check tap.
#    Nothing moves in Y, so a cell is 3 mm wide.
#    HOT_START=1 and DIRTY=1: see the description.
#    Coast and wipe heights come from those taps only, not from the mesh or
#    any offset: the strip is outside the scanner's reach. Judge the tip by
#    load cell taps, never by load cell minus scanner right after a prime:
#    the hot nozzle warms the scanner. [EL-PRI-001]
#  ZERO_Z_ACTIVE_TOOL (= TOOL_Z_MEASURE MODE=zero)
#    Tap the bed at the Z homing spot with the active tool and fold the error
#    into the INDX global Z offset (as G28 Z with the reference tool would). The shift is kept
#    as zero_z_shift so ZERO_Z_CLEAR takes it back out before the next G28,
#    leaving any user trim alone. INDX_PRINT_END calls ZERO_Z_CLEAR; call it
#    yourself before G28 when ending a print without INDX_PRINT_END.
#####################################################################

[gcode_macro _LOADCELL_TRUE]
description: Measured load cell trigger offset: the G28 trigger fires this far past first contact
# [load_cell_probe] z_offset minus this is the first-layer gap. [EL-PRI-003]
variable_trigger_offset: -0.07
gcode:

[gcode_macro _PRIME_UNFREEZE]
description: Inner - before PRIME_CLEAN of a loaded tool (print start, CAL_Z_LOADED): when its lock met frozen filament (latch short of the release), heat it and push it past in the air over its slot X= Y=, moving X+ while it pushes. Never a tap before that, hot or cold. TEMP= the prime temperature. Nothing happens for a fully locked tool
gcode:
    _INDX_LOCK_REFRESH
    _PRIME_UNFREEZE_RUN {rawparams}

[gcode_macro _PRIME_UNFREEZE_RUN]
description: Inner - _PRIME_UNFREEZE after the lock state is refreshed
gcode:
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% if act >= 0 and m.short|int and not m.cleared|int %}
        {% set left = [m.clear_e|float - (printer.toolhead.position.e|float - m.lock_e|float), 0.0]|max %}
        {% set fz = ("may be up to %.2f mm short of the release (its lock could not feel frozen filament)" % left) if m.assumed|default(0)|int else ("is %.2f mm short of the release (frozen filament)" % left) %}
        RESPOND MSG="INDX > T{act} {fz}: heated and pushed past in the air over its slot before any tap"
        _INDX_TIP_SHAPE_TOOL TOOL={act} TEMP={params.TEMP} MODE=air X={params.X} Y={params.Y} DX={params.DX|default(4)} FORM=0
        _INDX_LOCK_REFRESH
        _PRIME_UNFREEZE_CHECK TOOL={act}
    {% endif %}

[gcode_macro _PRIME_UNFREEZE_CHECK]
description: Inner - after _PRIME_UNFREEZE pushed: still short of the release is a stop, nothing is tapped
gcode:
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% if m.short|int and not m.cleared|int %}
        _INDX_RAISE MSG="INDX: T{params.TOOL} is still short of the release after the push in the air, so it is not tapped or primed. Look at the tool and its filament; T{params.TOOL} is on the head."
    {% endif %}

[gcode_macro PRIME_CLEAN]
description: Prime and clean the active tool in the purge lane: taps, heat on the way down, flow check, blob, coast, a retraction for the cooldown (recorded for the next refill), a soft wipe while the tip is still soft, cold wipe, cold check tap. HOT_START=1 (or the nozzle at COAST_TEMP or more): the taps before the prime are hot taps. DIRTY=1: a cold first tap on a blob heats and taps again hot instead of stopping. EMPTY=1 cleans a tool without filament: no refill, flow check or blob, only the hot coast and the cold wipe. A tool short of the release (frozen) is never tapped: _PRIME_UNFREEZE pushes it past first. Needs: homed, filament loaded (not with EMPTY=1). Moves: the active tool over the bed edge. Saves: tN_retracted
# halted: set when a tap finds residue or the tool does not extrude; the
#   rest of this PRIME_CLEAN is skipped
# LANE=1 (PRIME_GRID): X,Y is a purge lane slot. A first tap there that reads
#   occupied_mm (_PRIME_SETTINGS) or more above the bed is an old purge line
#   in the slot, not a dirty tip: the slot is marked used and the prime moves
#   on to the next unused slot and taps again, occupied_moves times at most.
#   A tip that still reads high there is dirty: the usual handling.
# cx, cy: the slot the prime runs in after those moves
variable_halted: 0
# hot_start: this run's taps before the prime are hot taps (HOT_START=1, the
#   nozzle at COAST_TEMP or more at the start, or after a reheat)
# dirty_ok: DIRTY=1, the tip is known dirty from INDX's own heating: a cold
#   coast tap at residue_mm or more asks for a reheat (reheat 1) instead of
#   stopping; reheated: that reheat ran (once per run)
variable_hot_start: 0
variable_dirty_ok: 0
variable_reheat: 0
variable_reheated: 0
# tip_left: the cold check tap after the wipe read plastic left on the tip
#   (check_mm): the tool is not flagged clean (t<n>_clean)
variable_tip_left: 0
variable_lane: 0
variable_occupied: 0
variable_moves: 0
variable_cx: 0.0
variable_cy: 0.0
# sweep_force, sweep_speed: this run's EMPTY=1 sweep (FORCE=, SPEED=)
variable_sweep_force: 100.0
variable_sweep_speed: 2.0
# last_hot_z, last_sweep_z: gcode Z of the last hot tap's contact (EMPTY=1)
#   and of the sweep after it. SWEEP_Z= / HEAT_Z= skip the tap: heat at
#   HEAT_Z (default SWEEP_Z), sweep at SWEEP_Z once hot. Heating cold at the
#   pressed height would press the growing nozzle into the bed [EL-PRI-004]
variable_last_hot_z: 0.0
variable_last_sweep_z: 0.0
# last_hot_t: the nozzle temperature right after that hot tap (C), for the
#   expansion profile (INDX_HOT_CLEAN's growth)
variable_last_hot_t: 0.0
# low_ok: LOW_OK=1 (INDX_HOT_CLEAN only), set again by every call: a tap
#   that reads the bed lower than Z0 is recorded in low_seen (mm) instead
#   of stopping; Z was homed on plastic the clean is removing, or on a
#   racked gantry. INDX_HOT_CLEAN homes Z again after the clean
variable_low_ok: 0
variable_low_seen: 0.0
gcode:
    # typed by hand without TEMP= it stopped with a Jinja error
    {% if params.TEMP is not defined %}
        {action_raise_error("PRIME_CLEAN needs TEMP=<C>, the print temperature of the tool's filament, for example PRIME_CLEAN TEMP=240. To clean a tip, INDX_HOT_CLEAN is the simpler command.")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=low_ok VALUE={1 if params.LOW_OK|default(0)|int else 0}
    {% set temp = params.TEMP|float %}
    {% set x = params.X|default(30)|float %}
    {% set y = params.Y|default(8)|float %}
    {% set e = params.E|default(5.0)|float %}
    {% set l = params.L|default(4)|float %}
    {% set ptemp = params.PROBE_TEMP|default(70)|float %}
    {% set coast = params.COAST|default(80)|float %}
    {% set ctemp = params.COAST_TEMP|default(160)|float %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("PRIME_CLEAN needs X, Y and Z homed") }
    {% endif %}
    # level the gantry when it has not been levelled yet, unless we are inside [EL-PRI-050]
    # G28 (homing_busy=1: _INDX_LEVEL would call G28 Z recursively)
    {% if "gcode_macro _TOOLCHANGE_VARS" in printer and not printer["gcode_macro _TOOLCHANGE_VARS"].homing_busy|default(0)|int %}
        # the head gets its tool back after the level: the lines below were
        # rendered for that tool
        _INDX_LEVEL FOR="PRIME_CLEAN"
    {% endif %}
    SAVE_GCODE_STATE NAME=_prime_clean
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=halted VALUE=0
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=tip_left VALUE=0
    # Not once this print has run out of slots and started over: every slot
    # then has its own line
    {% set reuse = printer["gcode_macro _PURGE_LANE"].wrapped|int %}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=lane VALUE={1 if params.LANE|default(0)|int and not reuse else 0}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=occupied VALUE=0
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=moves VALUE=0
    # A nozzle that starts hot gets hot taps before the prime (heater off,
    # hot_tap_force_g, read at the cold reference): a cold tap would trigger
    # on the molten film, and cooling first lets the ooze set [EL-PRI-005]
    {% set hs = 1 if not params.EMPTY|default(0)|int and (params.HOT_START|default(0)|int or printer[printer.toolhead.extruder].temperature|float >= ctemp) else 0 %}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=hot_start VALUE={hs}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=dirty_ok VALUE={1 if params.DIRTY|default(0)|int and not params.EMPTY|default(0)|int else 0}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=reheat VALUE=0
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=reheated VALUE=0
    {% if hs %}
        RESPOND MSG="PRIME_CLEAN: T{printer.save_variables.variables.active_tool|default(-1)|int} starts hot ({printer[printer.toolhead.extruder].temperature|float|round(0)|int} C): the taps before the prime are hot taps ({printer['gcode_macro _PRIME_SETTINGS'].hot_tap_force_g|default(100)|int} g, heater off), read at its cold reference by its expansion profile when it has one"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=cx VALUE={x}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=cy VALUE={y}
    # the temperatures of this run's taps (expansion profile): none yet
    SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=coast_t VALUE=-273
    SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=hot_t VALUE=-273
    {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=sweep_force VALUE={params.FORCE|default(st.sweep_force_g)|float}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=sweep_speed VALUE={params.SPEED|default(st.sweep_speed)|float}
    G90
    M83
    G1 Z5 F900
    {% if not params.EMPTY|default(0)|int %}
        # Contact where the coast runs (its middle) and where the wipe runs
        _PRIME_TAP X={x + l + 5 + coast / 2} Y={y} NAME=coast
        # DIRTY=1 and that cold tap on a blob: heat, tap again hot
        _PRIME_CLEAN_REHEAT TEMP={temp} L={l} COAST={coast}
        # An old purge line under the coast tap: on to the next unused slot
        {% for k in range(st.occupied_moves|int) %}
            _PRIME_CLEAN_MOVE L={l} COAST={coast}
            _PRIME_CLEAN_REHEAT TEMP={temp} L={l} COAST={coast}
        {% endfor %}
    {% endif %}
    _PRIME_CLEAN_REST TEMP={temp} E={0 if params.EMPTY|default(0)|int else e} L={l} COAST={coast} COAST_TEMP={ctemp} PROBE_TEMP={ptemp} EMPTY={params.EMPTY|default(0)|int}{(' SWEEP_Z=' ~ params.SWEEP_Z) if params.SWEEP_Z is defined else ''}{(' HEAT_Z=' ~ params.HEAT_Z) if params.HEAT_Z is defined else ''}
    # a loaded tool's prime that got through (not halted, the check tap clean)
    # flags the tool clean; EMPTY=1 passes are judged by INDX_HOT_CLEAN
    _PRIME_CLEAN_MARK EMPTY={params.EMPTY|default(0)|int}
    RESTORE_GCODE_STATE NAME=_prime_clean

[gcode_macro _PRIME_CLEAN_MARK]
description: Inner - after PRIME_CLEAN (renders then): flag the tool clean (t<n>_clean) when the prime was not halted and the cold check tap after the wipe found the tip clean. Not for EMPTY=1 (INDX_HOT_CLEAN flags on its verdict)
gcode:
    {% set pc = printer["gcode_macro PRIME_CLEAN"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% if act >= 0 and not params.EMPTY|default(0)|int and not pc.halted|int and not pc.tip_left|int %}
        _INDX_CLEAN_MARK TOOL={act} BY=PRIME_CLEAN
    {% endif %}

[gcode_macro _INDX_CLEAN_MARK]
description: Inner - flag TOOL clean (t<n>_clean 1) after a clean that passed its check (BY= what cleaned it, kept with the time in t<n>_clean_note). Heating it above the Tg of its filament (or the last one in it) flags it dirty again (indx_clog). Saves: tN_clean, tN_clean_note
# Heating above Tg later flags it dirty; a missing flag counts as dirty.
# [EL-PRI-006]
gcode:
    {% set t = params.TOOL|int %}
    {% set now = printer.indx_clog.now|default("") if "indx_clog" in printer else "" %}
    SAVE_VARIABLE VARIABLE=t{t}_clean VALUE=1
    SAVE_VARIABLE VARIABLE=t{t}_clean_note VALUE='"{params.BY|default("a clean")}{(" " ~ now) if now else ""}"'

[gcode_macro INDX_HOT_CLEAN]
description: Hot clean empty tools: each is heated over its purge lane slot, taps the bed hot, then sweeps on without lifting, pressed into its molten residue (about FORCE g), until cold, and taps again to check. SETUP=1 (INDX_CAL_CLEAN): a tool without a saved Z offset yet counts as clean when two taps in a row agree within 0.015 mm, and the setup prints the verdict line. TOOLS=0,2,3 (default: every tool recorded empty), TEMP= (240), FORCE= (100 g), SPEED= (2 mm/s). Needs: homed, empty tools. Moves: tool changes, the purge lane. Saves: nothing
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|default(4)|int %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("INDX_HOT_CLEAN: home first (G28)") }
    {% endif %}
    {% set ns = namespace(tools=[]) %}
    {% if params.TOOLS is defined %}
        {% for t in (params.TOOLS|string).replace(" ", "").split(",") if t %}
            {% set ns.tools = ns.tools + [t|int] %}
        {% endfor %}
    {% else %}
        {% for t in range(n) %}
            {% if not (svv["t%d_material" % t]|default("")|string|length > 0 or svv["t%d_fil_density" % t]|default(0)|float > 0) %}
                {% set ns.tools = ns.tools + [t] %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% for t in ns.tools %}
        {% if svv["t%d_material" % t]|default("")|string|length > 0 or svv["t%d_fil_density" % t]|default(0)|float > 0 %}
            { action_raise_error("INDX_HOT_CLEAN: T%d has filament recorded (%s). Only empty tools: a loaded tool is cleaned by PRIME_CLEAN. Nothing moved." % (t, svv["t%d_material" % t]|default("?"))) }
        {% endif %}
    {% endfor %}
    {% if not ns.tools %}
        RESPOND MSG="INDX_HOT_CLEAN: no tool is recorded empty, nothing to clean"
    {% endif %}
    {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
    # a re-home after the last hot clean did not finish (G28 Z stopped)
    {% if printer["gcode_macro PRIME_CLEAN"].low_seen|float > 0 %}
        RESPOND MSG="INDX > The last hot clean read the bed lower than Z0 and its G28 Z did not finish. This clean homes Z again when it sees it; before printing, home with G28."
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=low_seen VALUE=0.0
    # the purge lane taps on a level gantry; the loop changes tools itself
    {% if ns.tools %}
        _INDX_LEVEL FOR="Hot clean" BACK=0
    {% endif %}
    {% set args = "TEMP=%s FORCE=%s SPEED=%s PASSES=%d SETUP=%d" % (params.TEMP|default(240), params.FORCE|default(st.sweep_force_g), params.SPEED|default(st.sweep_speed), params.PASSES|default(st.hot_clean_passes)|int, params.SETUP|default(0)|int) %}
    {% if "gcode_macro _INDX_PROGRESS" in printer and ns.tools %}
        _INDX_PROGRESS START=1 STEP="Hot clean" TOTAL={ns.tools|length} EST=180
    {% endif %}
    {% for t in ns.tools %}
        _INDX_CHANGE_TOOL TOOL={t} COLD=1
        # the first round (as _INDX_HOT_CLEAN_TOOL, which runs a second one)
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=low_seen VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=done VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=n VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=low VALUE=99.0
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=sweep_z VALUE=-99.0
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=hot VALUE=99.0
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=growth VALUE=-1.0
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=growth_raw VALUE=0.0
        {% for p in range(params.PASSES|default(st.hot_clean_passes)|int) %}
            _INDX_HOT_CLEAN_RUN TOOL={t} TEMP={params.TEMP|default(240)} FORCE={params.FORCE|default(st.sweep_force_g)} SPEED={params.SPEED|default(st.sweep_speed)} SETUP={params.SETUP|default(0)|int}
        {% endfor %}
        # a round whose taps read the bed lower than Z0 is not judged: Z homes
        # again on the cleaner tip and the tool is cleaned once more
        # [review 2026-11-05]
        _INDX_HOT_CLEAN_REHOME TOOL={t} {args}
        {% if "gcode_macro _INDX_PROGRESS" in printer %}
            _INDX_PROGRESS ITEM=1 PART="T{t}"
        {% endif %}
    {% endfor %}
    {% if "gcode_macro _INDX_PROGRESS" in printer and ns.tools %}
        _INDX_PROGRESS END=1
    {% endif %}

[gcode_macro _INDX_HOT_CLEAN_TOOL]
description: Inner - one INDX_HOT_CLEAN round of TOOL (on the head): its run state reset, then PASSES passes (_INDX_HOT_CLEAN_RUN)
gcode:
    # each round notes its own low taps (an earlier tool's do not re-home this one)
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=low_seen VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=done VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=n VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=low VALUE=99.0
    SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=sweep_z VALUE=-99.0
    SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=hot VALUE=99.0
    SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=growth VALUE=-1.0
    SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=growth_raw VALUE=0.0
    {% for p in range(params.PASSES|int) %}
        _INDX_HOT_CLEAN_RUN TOOL={params.TOOL} TEMP={params.TEMP} FORCE={params.FORCE} SPEED={params.SPEED} SETUP={params.SETUP|int}
    {% endfor %}

[gcode_macro _INDX_HOT_CLEAN_DONE]
description: Inner - after TOOL's last INDX_HOT_CLEAN round (renders then): its verdict and clean flag; none while its taps still read the bed lower than Z0 (measured on a wrong Z)
gcode:
    {% set low = printer["gcode_macro PRIME_CLEAN"].low_seen|float %}
    {% if low > 0 %}
        RESPOND TYPE=error MSG="INDX_HOT_CLEAN: T{params.TOOL} still reads the bed {'%.2f'|format(low)} mm lower than Z0 after Z homed again on a cleaner tip. Not judged and not marked clean: check that the bed and gantry are level (QUAD_GANTRY_LEVEL or Z_TILT_ADJUST) and look at the tip on the camera, then run INDX_HOT_CLEAN TOOLS={params.TOOL} again."
    {% else %}
        {% if not params.SETUP|default(0)|int %}
        _INDX_HOT_CLEAN_SAY TOOL={params.TOOL}
        {% endif %}
        _INDX_HOT_CLEAN_MARK TOOL={params.TOOL} SETUP={params.SETUP|default(0)|int}
    {% endif %}

[gcode_macro _INDX_HOT_CLEAN_REHOME]
description: Inner - after TOOL's first INDX_HOT_CLEAN round (renders then): a tap read the bed lower than Z0 (low_seen), so Z was homed on plastic or an unlevelled gantry and the round swept above the bed (the sweep is never deeper than hot_tap_low_mm under the expected contact): G28 Z again on the cleaner tip, then TOOL cleaned once more on the right Z. Then the verdict (_INDX_HOT_CLEAN_DONE). In the setup too: two passes that both swept above the bed agree, and would mark the tool clean
gcode:
    {% set low = printer["gcode_macro PRIME_CLEAN"].low_seen|float %}
    {% if low > 0 %}
        RESPOND MSG="INDX > Hot clean: the T{params.TOOL} taps read the bed up to {'%.2f'|format(low)} mm lower than Z0, so Z was homed on plastic or an unlevelled gantry and this round swept above the bed. Z homes again now, then T{params.TOOL} is cleaned once more."
        G28 Z
        # cleared only once G28 Z got through: a stopped home is said at the next run
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=low_seen VALUE=0.0
        _INDX_CHANGE_TOOL TOOL={params.TOOL} COLD=1
        _INDX_HOT_CLEAN_TOOL TOOL={params.TOOL} TEMP={params.TEMP} FORCE={params.FORCE} SPEED={params.SPEED} PASSES={params.PASSES} SETUP={params.SETUP|default(0)|int}
    {% endif %}
    _INDX_HOT_CLEAN_DONE TOOL={params.TOOL} SETUP={params.SETUP|default(0)|int}

[gcode_macro _INDX_HOT_CLEAN_RUN]
description: Inner - one INDX_HOT_CLEAN pass with TOOL on the head: PRIME_CLEAN EMPTY=1 over its purge lane slot, then TOOL_Z_MEASURE (skipped once done)
variable_done: 0
variable_n: 0
variable_prev: 0.0
variable_first: 0.0
# low: the lowest cold contact of this tool in this run, mm against its
#   expected contact (the same frame as TOOL_Z_MEASURE's deviation and the hot
#   tap's tap - expect): every Z check (all cold); 99 = none yet
# hot: the first pass's hot tap, same frame (99 = none yet)
# sweep_z, press: this tool's first sweep in this run, gcode Z (-99 = none
#   yet), and how far it ran below its hot contact (mm)
# growth: how much longer the nozzle is hot than cold, mm, from this run: the
#   hot tap minus the cold Z check right after that pass, held to 0 ..
#   hot_growth_max_mm (-1 = not measured yet); growth_raw: before holding;
#   cold: that cold Z check
variable_low: 99.0
variable_hot: 99.0
variable_sweep_z: -99.0
variable_press: 0.0
variable_growth: -1.0
variable_growth_raw: 0.0
variable_cold: 0.0
gcode:
    {% set t = params.TOOL|int %}
    {% if not printer["gcode_macro _INDX_HOT_CLEAN_RUN"].done|int %}
    # Recorded empty, but its lock met filament and it has not been cleared
    # past the release since: never probe a tool short of the release
    # [EL-PRI-007]
    {% if (printer["gcode_macro _INDX_LOCK_PAST"].frozen|default(0)|int if "gcode_macro _INDX_LOCK_PAST" in printer else 0) and not printer["gcode_macro _INDX_LOCK_MARK"].cleared|default(0)|int %}
        _INDX_RAISE MSG="INDX_HOT_CLEAN: T{t} is recorded as empty, but its lock met filament (frozen at the nozzle). Not probing it: unload it (INDX_UNLOAD) and pull the filament out. T{t} is on the head."
    {% endif %}
    {% set slots = printer["gcode_macro _PRIME_SETTINGS"].slots|default([]) %}
    {% set o = printer.gcode_move.homing_origin %}
    {% if slots|length > t %}
        {% set x = slots[t][0]|float - o.x|float %}
        {% set y = slots[t][1]|float - o.y|float %}
    {% else %}
        {% set x = 30.0 %}
        {% set y = 8.0 + 3 * t %}
    {% endif %}
    {% if printer["gcode_macro _INDX_HOT_CLEAN_RUN"].n|int == 0 %}
        TOOL_Z_MEASURE LIMIT=5.0
        _INDX_HOT_CLEAN_JUDGE FIRST=1
    {% endif %}
    _INDX_HOT_CLEAN_PASS TOOL={t} TEMP={params.TEMP} X={x} Y={y} FORCE={params.FORCE} SPEED={params.SPEED} SETUP={params.SETUP|default(0)|int}
    {% endif %}

[gcode_macro _INDX_HOT_CLEAN_PASS]
description: Inner - the clean and check of one pass, unless the first check already found the tool clean
gcode:
    {% set me = printer["gcode_macro _INDX_HOT_CLEAN_RUN"] %}
    {% if not me.done|int %}
        # Each pass runs in the next 3 mm row of the slot (fresh bed). The
        # first pass taps hot and sweeps at the probe stop. Later passes do
        # not tap (they would heat at the pressed height) [EL-PRI-004]; they
        # heat at ref, pressed 0, and once hot drop to sweep:
        #   ref   = expect + min(hot, low + growth)
        #   sweep = max(ref - press x hot_clean_press_frac, floor,
        #               first sweep - (cold - low))
        # floor is hot_tap_low_mm under the expected probe stop. Never pressed
        # harder than the first pass against its own hot tap.
        {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
        {% set trig = printer["gcode_macro _LOADCELL_TRUE"].trigger_offset|float %}
        {% set expect = printer.configfile.settings.load_cell_probe.z_offset|float - trig %}
        {% set floor = expect + trig - st.hot_tap_low_mm|float %}
        {% set first = me.sweep_z|float > -90 %}
        {% set g = [me.growth|float, 0.0]|max %}
        {% set from_cold = me.low|float + g < me.hot|float %}
        {% set ref = expect + [me.hot|float, me.low|float + g]|min %}
        {% set press = me.press|float * st.hot_clean_press_frac|float %}
        {% set drop = [me.cold|float - me.low|float, 0.0]|max if me.growth|float >= 0 else 0.0 %}
        {% set held = me.sweep_z|float - drop %}
        {% set sz = [ref - press, held, floor]|max %}
        {% set hz = [ref, sz]|max %}
        {% if first %}
            RESPOND MSG="INDX_HOT_CLEAN: T{params.TOOL} pass {me.n|int + 1}: heat at Z{'%.3f'|format(hz)} (the hot contact, pressed 0), then sweep at Z{'%.3f'|format(sz)}, pressed {'%.3f'|format(hz - sz)} mm ({st.hot_clean_press_frac|float} x the first pass {'%.3f'|format(me.press|float)} mm){(', held at the first sweep less the cold drop %.3f' % drop) if sz <= held + 0.0005 and ref - press < held - 0.0005 else ''}{', held at the floor' if sz <= floor + 0.0005 else ''}. Hot contact {('%+.3f mm: the lowest cold Z check %+.3f mm plus growth' % (ref - expect, me.low|float)) if from_cold else ('%+.3f mm: the first hot tap' % (ref - expect))}. Growth used {('%.3f mm (measured %+.3f%s)' % (g, me.growth_raw|float, ', capped' if me.growth_raw|float > g + 0.0005 else (', held at 0' if me.growth_raw|float < -0.0005 else ''))) if me.growth|float >= 0 else '0 (not measured)'}"
        {% else %}
            RESPOND MSG="INDX_HOT_CLEAN: T{params.TOOL} pass {me.n|int + 1}: heat at Z0.3, hot tap at {params.FORCE} g with the heater off, sweep at its probe stop (pressed by the trigger offset, {'%.3f'|format(-trig)} mm). Growth used 0 (measured after this pass)"
        {% endif %}
        PRIME_CLEAN TEMP={params.TEMP} EMPTY=1 LOW_OK=1 X={params.X} Y={params.Y|float + 3 * me.n|int} FORCE={params.FORCE} SPEED={params.SPEED}{(' HEAT_Z=%.4f SWEEP_Z=%.4f' % (hz, sz)) if first else ''}
        {% if not first %}
            _INDX_HOT_CLEAN_LOW_HOT TOOL={params.TOOL}
        {% endif %}
        TOOL_Z_MEASURE LIMIT=5.0
        _INDX_HOT_CLEAN_EXP TOOL={params.TOOL}
        _INDX_HOT_CLEAN_JUDGE TOOL={params.TOOL} RELATIVE={params.SETUP|default(0)|int}
    {% endif %}

[gcode_macro _INDX_HOT_CLEAN_LOW_HOT]
description: Inner - after a pass with a hot tap (the first one that got through): its contact (hot), sweep height and press are kept for the later passes
gcode:
    {% set pc = printer["gcode_macro PRIME_CLEAN"] %}
    {% if not pc.halted|int %}
        {% set expect = printer.configfile.settings.load_cell_probe.z_offset|float - printer["gcode_macro _LOADCELL_TRUE"].trigger_offset|float %}
        {% set d = pc.last_hot_z|float - expect %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=hot VALUE={"%.4f"|format(d)}
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=sweep_z VALUE={"%.4f"|format(pc.last_sweep_z|float)}
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=press VALUE={"%.4f"|format(pc.last_hot_z|float - pc.last_sweep_z|float)}
        RESPOND MSG="INDX_HOT_CLEAN: T{params.TOOL} pass {printer['gcode_macro _INDX_HOT_CLEAN_RUN'].n|int + 1}: swept at Z{'%.3f'|format(pc.last_sweep_z|float)}, pressed {'%.3f'|format(pc.last_hot_z|float - pc.last_sweep_z|float)} mm under the hot contact {'%+.3f'|format(d)} mm, growth used 0"
    {% endif %}

[gcode_macro _INDX_HOT_CLEAN_EXP]
description: Inner - after a pass's Z check (renders then): the growth of TOOL's nozzle from that check's temperature (the frame its deviation is in, TOOL_Z_MEASURE last_temp) to the hot tap's (PRIME_CLEAN last_hot_t), from its expansion profile (INDX_TOOL_EXPANSION), which _INDX_HOT_CLEAN_JUDGE uses when the profile covers both
gcode:
    INDX_TOOL_EXPANSION TOOL={params.TOOL} FROM={printer["gcode_macro TOOL_Z_MEASURE"].last_temp|float} TO={printer["gcode_macro PRIME_CLEAN"].last_hot_t|float} QUIET=1

[gcode_macro _INDX_HOT_CLEAN_JUDGE]
description: Inner - after a pass: clean enough (hot_clean_target_mm), or the same as the last pass (the offset), or once more. RELATIVE=1 (the setup, before the Z offsets exist): agreement with the first tap counts from the first pass on
gcode:
    {% set me = printer["gcode_macro _INDX_HOT_CLEAN_RUN"] %}
    {% set target = printer["gcode_macro _PRIME_SETTINGS"].hot_clean_target_mm|float %}
    {% set dev = printer["gcode_macro TOOL_Z_MEASURE"].last_dev|float %}
    # every Z check counts toward the lowest contact of the tool
    SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=low VALUE={"%.4f"|format([me.low|float, dev]|min)}
    # The first Z check after the hot tap: growth = hot tap - this cold check,
    # held to 0 .. hot_growth_max_mm (the two taps are at different bed spots,
    # so a large difference is mesh or residue). An expansion profile covering
    # both temperatures (_INDX_HOT_CLEAN_EXP) wins, uncapped; the measured
    # difference is then only reported
    {% if not params.FIRST|default(0)|int and me.hot|float < 90 and me.growth|float < -0.5 %}
        {% set cap = printer["gcode_macro _PRIME_SETTINGS"].hot_growth_max_mm|float %}
        {% set raw = me.hot|float - dev %}
        {% set xr = printer["gcode_macro INDX_TOOL_EXPANSION"] %}
        {% set prof = xr.ok|int and xr.tool|int == params.TOOL|default(-1)|int %}
        {% set g = [xr.ofs|float, 0.0]|max if prof else [[raw, 0.0]|max, cap]|min %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=growth VALUE={"%.4f"|format(g)}
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=growth_raw VALUE={"%.4f"|format(g if prof else raw)}
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=cold VALUE={"%.4f"|format(dev)}
        {% if prof %}
            RESPOND MSG="INDX_HOT_CLEAN: T{params.TOOL|default('?')} growth {'%.3f'|format(g)} mm from its expansion profile ({xr.t_from|float|round(0)|int} to {xr.t_to|float|round(0)|int} C), hot tap {'%+.3f'|format(me.hot|float)} mm minus this cold Z check {'%+.3f'|format(dev)} mm = {'%+.3f'|format(raw)} mm"
        {% else %}
        RESPOND MSG="INDX_HOT_CLEAN: T{params.TOOL|default('?')} growth {'%.3f'|format(g)} mm: hot tap {'%+.3f'|format(me.hot|float)} mm minus this cold Z check {'%+.3f'|format(dev)} mm = {'%+.3f'|format(raw)} mm{(', capped at %.3f' % cap) if raw > cap else (', held at 0' if raw < 0 else '')}"
        {% endif %}
    {% endif %}
    {% if params.FIRST|default(0)|int %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=first VALUE={dev}
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=prev VALUE={dev}
        {% if dev|abs <= target %}
            SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=done VALUE=1
        {% endif %}
    {% else %}
        {% if dev|abs <= target %}
            SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=done VALUE=1
        {% elif (me.n|int > 0 or params.RELATIVE|default(0)|int) and (dev - me.prev|float)|abs <= 0.015 %}
            SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=done VALUE=2
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=prev VALUE={dev}
        SET_GCODE_VARIABLE MACRO=_INDX_HOT_CLEAN_RUN VARIABLE=n VALUE={me.n|int + 1}
    {% endif %}

[gcode_macro _INDX_HOT_CLEAN_MARK]
description: Inner - after INDX_HOT_CLEAN's passes on TOOL (renders then): flag it clean (t<n>_clean) on a clean verdict: within hot_clean_target_mm (done 1), or in the setup (SETUP=1, no Z offset yet) two taps in a row agreeing (done 2)
gcode:
    {% set d = printer["gcode_macro _INDX_HOT_CLEAN_RUN"].done|int %}
    {% if d == 1 or (params.SETUP|default(0)|int and d == 2) %}
        _INDX_CLEAN_MARK TOOL={params.TOOL} BY=INDX_HOT_CLEAN
    {% endif %}

[gcode_macro _INDX_HOT_CLEAN_SAY]
description: Inner - INDX_HOT_CLEAN's verdict for TOOL
gcode:
    {% set me = printer["gcode_macro _INDX_HOT_CLEAN_RUN"] %}
    {% set target = printer["gcode_macro _PRIME_SETTINGS"].hot_clean_target_mm|float %}
    {% set passes = "%d pass%s" % (me.n|int, "" if me.n|int == 1 else "es") %}
    {% if me.done|int == 1 %}
        RESPOND MSG="INDX_HOT_CLEAN: T{params.TOOL} clean: {'%+.3f'|format(me.prev|float)} mm from its saved offset (was {'%+.3f'|format(me.first|float)}) after {passes}"
    {% elif me.done|int == 2 %}
        RESPOND TYPE=error MSG="INDX_HOT_CLEAN: T{params.TOOL} stays at {'%+.3f'|format(me.prev|float)} mm from its saved offset (was {'%+.3f'|format(me.first|float)}): two passes agree, so its Z offset is probably off (or the residue is hard). Check the tip on the camera; if it is clean, recalibrate its offset."
    {% else %}
        RESPOND TYPE=error MSG="INDX_HOT_CLEAN: T{params.TOOL} still {'%+.3f'|format(me.prev|float)} mm from its saved offset after {passes} (was {'%+.3f'|format(me.first|float)}, target {target})"
    {% endif %}

[gcode_macro _PRIME_CLEAN_MOVE]
description: Inner - the coast tap found an old purge line in this lane slot: take the next unused slot and tap there
gcode:
    {% set pc = printer["gcode_macro PRIME_CLEAN"] %}
    {% if pc.occupied|int and not pc.halted|int %}
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=occupied VALUE=0
        _PURGE_LANE_TAKE OWN={printer["gcode_macro _PURGE_LANE"].cur_own|int} MOVE=1
        _PRIME_CLEAN_RETAP L={params.L} COAST={params.COAST}
    {% endif %}

[gcode_macro _PRIME_CLEAN_RETAP]
description: Inner - the coast tap again, in the slot _PURGE_LANE_TAKE just gave (none left: prime where it is)
gcode:
    {% set pl = printer["gcode_macro _PURGE_LANE"] %}
    {% if pl.got|int %}
        {% set sl = printer["gcode_macro _PRIME_SETTINGS"].slots[pl.cur|int] %}
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=moves VALUE={printer["gcode_macro PRIME_CLEAN"].moves|int + 1}
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=cx VALUE={sl[0]}
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=cy VALUE={sl[1]}
        _PRIME_TAP X={sl[0] + params.L|float + 5 + params.COAST|float / 2} Y={sl[1]} NAME=coast
    {% else %}
        RESPOND MSG="PRIME_CLEAN: no unused purge lane slot left to move to: priming in this one, at contact + 0.05"
    {% endif %}

[gcode_macro _PRIME_CLEAN_REHEAT]
description: Inner - PRIME_CLEAN DIRTY=1 after a coast tap (renders then): a cold coast tap that found a blob (reheat) heats the tool over the start of the prime line, clear of the bed, and taps the coast spot again hot (the blob molten gives way); that hot tap still stops at residue_mm
# A tool dirty from INDX's own heating with a cold blob is cleaned hot
# instead of stopping the G28: it heats 2 mm over the expected contact
# (never pressed) and taps again hot, where molten plastic gives way. Still
# at residue_mm is something hard: _PRIME_RESIDUE stops. Once per run.
# [EL-PRI-008]
gcode:
    {% set pc = printer["gcode_macro PRIME_CLEAN"] %}
    {% if pc.reheat|int and not pc.halted|int %}
        {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
        {% set expect = printer.configfile.settings.load_cell_probe.z_offset|float - printer["gcode_macro _LOADCELL_TRUE"].trigger_offset|float %}
        {% set l = params.L|float %}
        {% set coast = params.COAST|float %}
        RESPOND MSG="PRIME_CLEAN: T{act} is dirty from INDX's own heating and its cold coast tap touched {'%.2f'|format(printer['gcode_macro _PRIME_RUN'].coast_dev|float)} mm above the bed: heating it to {params.TEMP|float|round(0)|int} C clear of the bed and tapping again hot, so the prime and wipe clean it. A hot tap still that high stops."
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=reheat VALUE=0
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=reheated VALUE=1
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=hot_start VALUE=1
        G90
        G1 Z5 F900
        _INDX_TO_LANE
        G1 X{pc.cx|float - 12} Y{pc.cy|float} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
        G1 Z{"%.3f"|format(expect + 2.0)} F600
        M109 S{params.TEMP}
        G1 Z5 F600
        _PRIME_TAP X={pc.cx|float + l + 5 + coast / 2} Y={pc.cy|float} NAME=coast
    {% endif %}

[gcode_macro _PRIME_CLEAN_REST]
description: Inner - PRIME_CLEAN once its slot is settled: the wipe tap, then prime, blob, coast and wipe
gcode:
    {% set pc = printer["gcode_macro PRIME_CLEAN"] %}
    {% set x = pc.cx|float %}
    {% set y = pc.cy|float %}
    {% set l = params.L|float %}
    {% set coast = params.COAST|float %}
    {% if not params.EMPTY|int %}
        _PRIME_TAP X={x + l + coast + 13} Y={y} NAME=wipe
    {% endif %}
    _PRIME_RUN TEMP={params.TEMP} X={x} Y={y} E={params.E} L={l} COAST={coast} COAST_TEMP={params.COAST_TEMP} PROBE_TEMP={params.PROBE_TEMP} EMPTY={params.EMPTY}{(' SWEEP_Z=' ~ params.SWEEP_Z) if params.SWEEP_Z is defined else ''}{(' HEAT_Z=' ~ params.HEAT_Z) if params.HEAT_Z is defined else ''}

[gcode_macro _PRIME_TAP]
description: Inner - tap the bed at X,Y with the load cell and keep the contact height in gcode Z
gcode:
    {% if not printer["gcode_macro PRIME_CLEAN"].halted|int %}
        G1 Z5 F900
        # Out to the clearance line first if behind it
        _INDX_TO_LANE
        G1 X{params.X|float} Y{params.Y|float} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
        # pre: a tap before the prime in a hot start (PRIME_CLEAN hot_start):
        # tapped as a hot tap, read at the cold reference
        {% set pre = printer["gcode_macro PRIME_CLEAN"].hot_start|int and not params.HOT|default(0)|int and params.NAME in ("coast", "wipe") %}
        {% if params.HOT|default(0)|int or pre %}
            # A hot tap: heater off for it, heater power moves the load cell
            # reading (the caller heats again)
            M104 S0
        {% endif %}
        # Let the load cell settle: right after a pickup it can creep for seconds
        M400
        G4 P1500
        # A tap the probe rates bad is kept: _PRIME_TAP_STORE judges the
        # height. Hot taps trigger at hot_tap_force_g, cold taps at 30 g: at
        # 30 g a molten film triggers before the metal meets the bed
        # [EL-PRI-009]
        {% set hot_f = printer["gcode_macro _PRIME_SETTINGS"].hot_tap_force_g|default(100)|int %}
        _INDX_PROBE_PREP
        PROBE SAMPLES=1 TRIGGER_FORCE={hot_f if params.HOT|default(0)|int or pre else 30} BAD_PROBE_STRATEGY=IGNORE
        # The hot tap against the cold taps before it, and the check tap
        # against the hot tap: with an expansion profile of this tool
        # (INDX_CAL_TOOL_EXPANSION) the hot contact is read at the other tap's
        # temperature, so nozzle growth is not taken for a bead or a clean tip
        # (_PRIME_TAP_STORE). Without one: the contact as tapped
        {% set r = printer["gcode_macro _PRIME_RUN"] %}
        {% set xp = params.HOT|default(0)|int or params.NAME == "check" or pre %}
        {% if params.HOT|default(0)|int %}
            INDX_TOOL_EXPANSION FROM=now TO={r.coast_t|float} QUIET=1
        {% elif pre %}
            INDX_TOOL_EXPANSION FROM=now TO=cold QUIET=1
        {% elif params.NAME == "check" %}
            INDX_TOOL_EXPANSION FROM={r.hot_t|float} TO=now QUIET=1
        {% endif %}
        _PRIME_TAP_STORE NAME={params.NAME} X={params.X} Y={params.Y} HOT={params.HOT|default(0)} QUIET={params.QUIET|default(0)} EXP={1 if xp else 0} PRE={1 if pre else 0}
        _PRIME_TAP_UP
    {% endif %}

[gcode_macro _PRIME_SWEEP_TAP]
description: Inner - empty tool: hot tap at X,Y, then on without lifting into the sweep (_PRIME_SWEEP)
gcode:
    {% if not printer["gcode_macro PRIME_CLEAN"].halted|int and params.SWEEP_Z is defined %}
        # A later pass: no new tap, heated at HEAT_Z (pressed 0), now hot it
        # drops to the sweep height passed in (INDX_HOT_CLEAN) [EL-PRI-004];
        # the Z check judges afterwards
        M104 S0
        M400
        _PRIME_SWEEP {rawparams}
    {% elif not printer["gcode_macro PRIME_CLEAN"].halted|int %}
        # Heated at Z0.3 (ooze spreads flat there); up 0.7 mm only so the
        # probe tares in the air
        G1 Z1 F600
        _INDX_TO_LANE
        G1 X{params.X|float} Y{params.Y|float} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
        # Heater off from here: heater power moves the load cell reading
        # [EL-PRI-009]
        M104 S0
        M400
        G4 P800
        _INDX_PROBE_PREP
        # At the sweep force: at 30 g the molten film triggers early and the
        # sweep runs a film thickness high [EL-PRI-009]
        PROBE SAMPLES=1 TRIGGER_FORCE={printer["gcode_macro PRIME_CLEAN"].sweep_force|int} BAD_PROBE_STRATEGY=IGNORE
        _PRIME_SWEEP {rawparams}
    {% endif %}

[gcode_macro _PRIME_SWEEP]
description: Inner - after the hot tap: press the hot plastic at about the sweep force and sweep in +X without lifting until the nozzle is cold
gcode:
    {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
    {% set x0 = params.X|float %}
    {% set y = params.Y|float %}
    {% set end = params.END|float %}
    {% set ptemp = params.PROBE_TEMP|float %}
    {% set off = printer.toolhead.position.z|float - printer.gcode_move.gcode_position.z|float %}
    {% set tap = printer.probe.last_z_result|float - off %}
    {% set trig = printer["gcode_macro _LOADCELL_TRUE"].trigger_offset|float %}
    {% set expect = printer.configfile.settings.load_cell_probe.z_offset|float - trig %}
    # The probe reports first contact and stops trigger_offset further down,
    # at the sweep force: the sweep runs at that stop height. Never deeper
    # than hot_tap_low_mm under the expected contact.
    {% set force = printer["gcode_macro PRIME_CLEAN"].sweep_force|float %}
    {% set known = params.SWEEP_Z is defined %}
    {% if known %}
        # the caller has worked the height out from the hot contact and held
        # it to the floor; the nozzle is hot here, so it drops from HEAT_Z
        {% set z = params.SWEEP_Z|float %}
    {% else %}
        {% set z = tap + trig %}
        {% set z = [z, expect + trig - st.hot_tap_low_mm|float]|max %}
    {% endif %}
    {% set v = printer["gcode_macro PRIME_CLEAN"].sweep_speed|float %}
    {% if not known %}
        _PRIME_TAP_STORE NAME=coast HOT=1 X={x0} Y={y} QUIET=1
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=last_hot_z VALUE={"%.4f"|format(tap)}
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=last_sweep_z VALUE={"%.4f"|format(z)}
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=last_hot_t VALUE={"%.2f"|format(printer[printer.toolhead.extruder].temperature|float)}
    {% endif %}
    {% if not printer["gcode_macro PRIME_CLEAN"].halted|int %}
        G1 Z{"%.4f"|format(z)} F300
        M104 S0
        M106 S255
        # SPEED mm steps of 1 s each, until cold or the slot ends
        {% for k in range(1, ((end - x0) / v)|int + 1) %}
            _PRIME_SWEEP_STEP X={x0 + k * v} F={v * 60} TEMP={ptemp + 4}
        {% endfor %}
        G1 Z1 F600
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ptemp + 4}
        M106 S0
        RESPOND MSG="PRIME_CLEAN: swept at Z{'%.3f'|format(z)} ({('heated at Z%.3f, the hot contact, then down %.3f mm' % (params.HEAT_Z|default(z)|float, params.HEAT_Z|default(z)|float - z)) if known else 'first sweep: hot contact %+.3f mm, pressed %.3f mm, about %d g' % (tap - expect, tap - z, force|int)}, {v} mm/s) until cold"
        # No check tap past the sweep's end (it lands on the plastic pushed
        # ahead): INDX_HOT_CLEAN judges with TOOL_Z_MEASURE [EL-PRI-010]
    {% endif %}

[gcode_macro _PRIME_SWEEP_STEP]
description: Inner - one sweep step, skipped once the nozzle is below TEMP
gcode:
    {% if printer.extruder.temperature > params.TEMP|float %}
        G1 X{params.X|float} F{params.F|default(60)}
        M400
    {% endif %}

[gcode_macro _PRIME_TAP_UP]
description: Inner - back up to Z5 after a tap, unless that tap stopped the prime (the hold has lifted the head)
gcode:
    {% if not printer["gcode_macro PRIME_CLEAN"].halted|int %}
        G1 Z5 F900
    {% endif %}

[gcode_macro _PRIME_TAP_STORE]
description: Inner - convert the last tap from machine Z to gcode Z at this XY (offsets, mesh and all)
gcode:
    {% set off = printer.toolhead.position.z|float - printer.gcode_move.gcode_position.z|float %}
    {% set tap = printer.probe.last_z_result|float - off %}
    # gcode Z of true contact if the frame, mesh and tool offset are right
    {% set expect = printer.configfile.settings.load_cell_probe.z_offset|float - printer["gcode_macro _LOADCELL_TRUE"].trigger_offset|float %}
    {% set pcl = printer["gcode_macro PRIME_CLEAN"] %}
    {% if tap < expect - 0.5 and pcl.low_ok|int %}
        # INDX_HOT_CLEAN: a lower bed means the nozzle is higher than Z0 says
        # (the safe side); the clean's heights come from its own taps. Z homes
        # again once the tips are clean (a stop here would stop the hot clean on
        # the very plastic it is there to remove)
        {% if pcl.low_seen|float <= 0 %}
            RESPOND MSG="INDX > Hot clean: the bed reads {'%.2f'|format(expect - tap)} mm lower than Z0 says. Z was probably homed with plastic on the tip (or on an unlevelled gantry). The clean goes on, and Z homes again when the tips are clean."
        {% endif %}
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=low_seen VALUE={"%.3f"|format([pcl.low_seen|float, expect - tap]|max)}
    {% elif tap < expect - 0.5 %}
        _INDX_LCD LEVEL=warn MSG="Bed below Z0: re-home"
        _INDX_RAISE MSG="{'PRIME_CLEAN: the bed is %.2f mm lower than Z0 says. Re-home before priming.' % (expect - tap)}"
    {% endif %}
    # Before the prime a dirty tip reads high: cap the height and clean the
    # tip; at residue_mm or more it is plastic stuck on: stop. Bad-rated taps
    # are kept, so the height is held to at most 0.1 mm under the expected
    # contact.
    {% set residue = printer["gcode_macro _PRIME_SETTINGS"].residue_mm|float %}
    {% set hot = params.HOT|default(0)|int %}
    {% set low = printer["gcode_macro _PRIME_SETTINGS"].hot_tap_low_mm|float if hot else 0.1 %}
    # EXP=1 (_PRIME_TAP): INDX_TOOL_EXPANSION just gave the hot contact's
    # change to the other tap's temperature (0 without a usable profile)
    {% set xr = printer["gcode_macro INDX_TOOL_EXPANSION"] %}
    {% set xo = xr.ofs|float if params.EXP|default(0)|int and xr.ok|int else 0.0 %}
    {% set tnow = printer[printer.toolhead.extruder].temperature|float %}
    # PRE=1: a hot tap before the prime (hot start), judged as a cold tap on
    # its contact read at the cold reference (tap + xo)
    {% set pre = params.PRE|default(0)|int %}
    {% set zc = [[tap + (xo if hot or pre else 0.0), expect + 0.05]|min, expect - low]|max %}
    {% if hot %}
        # Hot tap: only ever lower the coast, and the wipe with it; the
        # cold-tap checks below do not apply. With a profile it is compared
        # at the cold taps' temperature (the grown nozzle reads high hot)
        {% set r = printer["gcode_macro _PRIME_RUN"] %}
        SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=hot_dev VALUE={"%.4f"|format(tap - expect)}
        SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=hot_t VALUE={"%.2f"|format(tnow)}
        {% set dz = [zc - r.zc_coast|float, 0.0]|min %}
        {% if not params.QUIET|default(0)|int %}
        RESPOND MSG="PRIME_CLEAN: hot coast tap {'%+.2f'|format(tap - expect)} mm{(' at %.0f C, %+.3f mm at the cold taps %.0f C (expansion profile)' % (tnow, tap + xo - expect, r.coast_t|float)) if xo else ''}: coast and wipe {'%.2f mm lower' % (-dz) if dz < 0 else 'unchanged'}"
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=zc_coast VALUE={"%.4f"|format(r.zc_coast|float + dz)}
        SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=zc_wipe VALUE={"%.4f"|format(r.zc_wipe|float + dz)}
    {% elif params.NAME == "check" %}
        # Cold tap after the wipe: plastic left on the tip, against the lower
        # of the hot contact and this run's cold coast contact (the hot tap
        # can land on ooze where the nozzle heated) [EL-PRI-011]
        {% set r = printer["gcode_macro _PRIME_RUN"] %}
        {% set hot_ref = r.hot_dev|float + xo %}
        {% set cold_ref = r.coast_dev|float if r.coast_t|float > -273 else hot_ref %}
        {% set ref = [hot_ref, cold_ref]|min %}
        {% set left = tap - expect - ref %}
        {% set pcc = printer["gcode_macro PRIME_CLEAN"] %}
        {% if (pcc.reheated|int or (pcc.hot_start|int and pcc.dirty_ok|int)) and left > printer["gcode_macro _PRIME_SETTINGS"].residue_mm|float %}
            # a reheat or a hot start of a tool dirty from INDX's own heating
            # (DIRTY=1, G28's reference clean: cleaned instead of
            # stopped): still residue_mm over the hot contact after the prime
            # and wipe is something hard on the tip: stop, never probe on it
            _PRIME_RESIDUE NAME=check DEV={"%.2f"|format(left)} BED=0 X={params.X|default(0)} Y={params.Y|default(0)}
        {% elif left > printer["gcode_macro _PRIME_SETTINGS"].check_mm|float %}
            SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=tip_left VALUE=1
            RESPOND TYPE=error MSG="PRIME_CLEAN: the tip still reads {'%.2f'|format(left)} mm above its {'cold coast' if cold_ref < hot_ref - 0.0005 else 'hot'} contact after the wipe: plastic left on it. Run PRIME_CLEAN again (or clean the tip by hand with a brass brush while it is warm). For an empty nozzle, INDX_HOT_CLEAN can also clean it (needs a homed printer)."
        {% else %}
            RESPOND MSG="PRIME_CLEAN: tip clean (cold check {'%+.2f'|format(left)} mm against the {('cold coast contact, the hot contact read %+.2f mm higher, probably on ooze where it heated' % (hot_ref - cold_ref)) if cold_ref < hot_ref - 0.0005 else 'hot contact'}{(', %+.3f mm of nozzle growth taken out by the expansion profile' % (0.0 - xo)) if xo and cold_ref >= hot_ref - 0.0005 else ''})"
        {% endif %}
    {% else %}
    # a hot tap before the prime (PRE=1): its contact at the cold reference,
    # and coast_t that reference's temperature (the prime's hot tap compares
    # against it); without a usable profile as tapped, at its temperature
    {% set tap = tap + xo if pre else tap %}
    {% if params.NAME == "coast" %}
        SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=coast_dev VALUE={"%.4f"|format(tap - expect)}
        SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=coast_t VALUE={"%.2f"|format(xr.t_to|float if pre and xo else tnow)}
    {% endif %}
    {% set other = printer["gcode_macro _PRIME_RUN"].coast_dev|float %}
    # In a purge lane slot (PRIME_CLEAN LANE=1) the coast tap is the first one
    # there: clearly high but below residue_mm is an old purge line in the
    # slot, not a dirty tip, while moves are left (PRIME_CLEAN tries the next
    # unused slot). The last allowed tap falls through to the dirty-tip
    # handling below, as does anything at residue_mm or more.
    {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
    {% set pc = printer["gcode_macro PRIME_CLEAN"] %}
    {% set occupied = params.NAME == "coast" and pc.lane|int and pc.moves|int < st.occupied_moves|int and tap > expect + st.occupied_mm|float and tap <= expect + residue %}
    {% if tap > expect + residue and params.NAME == "coast" and pc.dirty_ok|int and not pc.hot_start|int and not pc.reheated|int %}
        # DIRTY=1 (the tip dirty from INDX's own heating) and a cold coast
        # tap on a blob: _PRIME_CLEAN_REHEAT heats it and taps again hot
        # instead of stopping [EL-PRI-008]
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=reheat VALUE=1
    {% elif tap > expect + residue %}
        # The coast tap 18 mm away read normal: the nozzle is clean and
        # something is lying on the bed here
        {% set on_bed = params.NAME == "wipe" and other <= 0.2 %}
        _PRIME_RESIDUE NAME={params.NAME} DEV={"%.2f"|format(tap - expect)} BED={1 if on_bed else 0} X={params.X|default(0)} Y={params.Y|default(0)}
    {% elif occupied %}
        RESPOND MSG="PRIME_CLEAN: coast tap {'%+.2f'|format(tap - expect)} mm high in purge lane slot {printer['gcode_macro _PURGE_LANE'].cur|int + 1}: an old purge line is probably there. Marking it used and trying the next unused slot"
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=occupied VALUE=1
    {% elif tap > expect + 0.05 %}
        RESPOND MSG="PRIME_CLEAN: {params.NAME} tap {'%+.2f'|format(tap - expect)} mm high, tip probably dirty: running at contact + 0.05"
    {% elif tap < expect - 0.1 %}
        RESPOND MSG="PRIME_CLEAN: {params.NAME} tap {'%+.2f'|format(tap - expect)} mm low, running at contact - 0.1"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=zc_{params.NAME} VALUE={"%.4f"|format(zc)}
    {% endif %}

[gcode_macro _PRIME_RESIDUE]
description: Inner - a height tap found plastic stuck to the nozzle: stop this prime (hold and pause in a print)
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=halted VALUE=1
    {% set why = "bed" if params.BED|default(0)|int else "residue" %}
    {% if printer["gcode_macro PRIME_GRID"].active|int and printer.print_stats.state in ("printing", "paused") %}
        _PRIME_GRID_HOLD TOOL={act} WHY={why} DEV={params.DEV} X={params.X} Y={params.Y}
    {% elif why == "bed" %}
        M104 S0
        _INDX_LCD LEVEL=warn MSG="Object on the bed: remove it"
        RESPOND TYPE=error MSG="Something {params.DEV} mm tall is on the bed at X{params.X|float|round(1)} Y{params.Y|float|round(1)} (T{act}'s tap there touched it, its other tap read normal). Remove it and try again."
        _INDX_RAISE MSG="Object on the bed, see above"
    {% else %}
        M104 S0
        _INDX_LCD LEVEL=action MSG="T{act} nozzle dirty: clean it"
        RESPOND TYPE=error MSG="T{act} has plastic stuck to its nozzle: the {params.NAME} tap touched {params.DEV} mm above the bed. Clean the nozzle and try again."
        _INDX_RAISE MSG="T{act} nozzle residue, see above"
    {% endif %}

[gcode_macro _PRIME_RUN]
description: Inner - blob, coast and wipe, at the contact heights _PRIME_TAP measured
variable_zc_coast: 0.0
variable_zc_wipe: 0.0
variable_coast_dev: 0.0
variable_hot_dev: 0.0
# coast_t, hot_t: the nozzle temperature at the cold coast tap and at the hot
#   tap of this run (C, -273 = none yet), for the expansion profile
variable_coast_t: -273.0
variable_hot_t: -273.0
# cool_ret: this run's cooldown retraction has run (_PRIME_COOL_RETRACT)
variable_cool_ret: 0
gcode:
    {% set temp = params.TEMP|float %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set e = params.E|float %}
    {% set l = params.L|float %}
    {% set ptemp = params.PROBE_TEMP|float %}
    {% set coast = params.COAST|float %}
    {% set act = printer.save_variables.variables.active_tool|default(0)|int %}
    {% set refill = printer.save_variables.variables["t" ~ act ~ "_retracted"]|default(0)|float %}
    {% if not printer["gcode_macro PRIME_CLEAN"].halted|int %}
    # Heat from 5 mm over the bed, coming down to Z0.3 in about 5 s: a cold
    # tip never sits low on hard residue. Refill and flow check run down
    # there, so ooze lands flat instead of coiling up in the air.
    # Out to the clearance line first if behind it
    _INDX_TO_LANE
    G1 X{x - 12} Y{y} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    G1 Z5 F600
    M400
    M104 S{temp}
    {% if params.SWEEP_Z is defined %}
    # a later hot clean pass: heat at its hot contact (HEAT_Z), pressed 0, so
    # the nozzle growing as it heats ends touching, not pressed; it drops to
    # SWEEP_Z once hot (_PRIME_SWEEP)
    G1 Z{"%.4f"|format(params.HEAT_Z|default(params.SWEEP_Z)|float)} F56
    {% else %}
    G1 Z0.3 F56                            ; 4.7 mm in ~5 s, from the start of heating
    {% endif %}
    M109 S{temp}
    # Hot tap at the prime spot. An empty tool sweeps on from it without
    # lifting until cold (_PRIME_SWEEP_TAP): no blob, coast or wipe. Loaded:
    # back down to line height for the refill and flow line.
    {% if params.EMPTY|default(0)|int %}
        _PRIME_SWEEP_TAP X={x - 12} Y={y} END={x + 62} PROBE_TEMP={ptemp}{(' SWEEP_Z=' ~ params.SWEEP_Z) if params.SWEEP_Z is defined else ''}{(' HEAT_Z=' ~ params.HEAT_Z) if params.HEAT_Z is defined else ''}
    {% else %}
        _PRIME_TAP X={x - 12} Y={y} NAME=coast HOT=1
        G1 X{x - 12} Y{y} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
        G1 Z0.3 F600
        # the tap ran with the heater off (_PRIME_TAP HOT=1)
        M109 S{temp}
    {% endif %}
    {% if refill > 0 and not params.EMPTY|default(0)|int %}
        # a frozen tool: this first heated push carries the latch past the
        # release, a latch move the clog watch must not read as a skipping
        # extruder (INDX_CLOG_QUIET)
        {% set fz = printer.save_variables.variables.lock_short|default(0)|int and "indx_clog" in printer %}
        {% if fz %}INDX_CLOG_QUIET ON=1 REASON=melt{% endif %}
        G1 E{refill} F300                  ; push back what the last print left retracted
        {% if fz %}
            M400
            INDX_CLOG_QUIET ON=0 REASON=melt
        {% endif %}
        SAVE_VARIABLE VARIABLE=t{act}_retracted VALUE=0
    {% endif %}
    # A starved nozzle taps as clean as a full one: check the flow with the
    # load cell after the refill. The test line is the prime; the overfilled
    # blob after it wells up around the nozzle and cleans the face. EMPTY=1:
    # no flow check, straight on to the hot coast.
    {% if not params.EMPTY|default(0)|int %}
        _PRIME_FLOW_CHECK X0={x - 12} X1={x} Z=0.3
    {% endif %}
    {% if not params.EMPTY|default(0)|int %}
        _PRIME_RUN_REST TEMP={temp} X={x} Y={y} E={e} L={l} COAST={coast} COAST_TEMP={params.COAST_TEMP} PROBE_TEMP={ptemp}
    {% endif %}
    {% endif %}

[gcode_macro _PRIME_RUN_REST]
description: Inner - cleaning blob, coast, the cooldown retraction, the soft wipe, cold wipe and check tap, unless the flow check stopped the prime
gcode:
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set e = params.E|float %}
    {% set l = params.L|float %}
    {% set ptemp = params.PROBE_TEMP|float %}
    {% set coast = params.COAST|float %}
    {% set zc_coast = printer["gcode_macro _PRIME_RUN"].zc_coast|float %}
    {% set zc_wipe = printer["gcode_macro _PRIME_RUN"].zc_wipe|float %}
    {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
    {% set cs = printer.configfile.settings %}
    {% set exs = cs[printer.toolhead.extruder] if printer.toolhead.extruder in cs else {} %}
    # the cooldown retraction runs during the coast once the nozzle is down
    # to here (the extruder still moves), or at the coast's end
    {% set rt = (exs.min_extrude_temp if "min_extrude_temp" in exs else 170)|float + 10 %}
    # the soft wipe: back on the coast track, past its first 2 mm, ending 2 mm
    # before the cold wipe's area at the latest
    {% set sx0 = x + l + 7 %}
    {% set sx1 = [sx0 + st.soft_wipe_mm|float, x + l + coast + 8]|min %}
    {% if not printer["gcode_macro PRIME_CLEAN"].halted|int %}
    {% if e > 0 and l > 0 %}
        G1 X{x + l} E{e} F{(l / (e * 2.405 / 5.0) * 60)|round(1)}   ; cleaning blob at ~5 mm3/s, moving +X
    {% endif %}
    M400
    M104 S0
    _INDX_PART_FAN S=255
    SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=cool_ret VALUE=0
    # Down to the tapped contact as soon as the blob is done: the first 2 mm
    # of the coast descend from line height (a straight line, never below
    # the contact), the rest runs at the contact; a drop 5 mm past the line
    # comes too late [EL-PRI-012]
    G1 X{x + l + 2} Z{zc_coast} F120       ; coast off, descending to the tapped contact
    G1 X{x + l + 5} F120                   ; on at the contact
    _PRIME_COAST X={x + l + 5} STEPS={coast|int} TEMP={params.COAST_TEMP} RT={rt}
    # Retract before the nozzle lifts and cools (if the coast has not yet):
    # see cool_retract_mm in _PRIME_SETTINGS [EL-PRI-002]
    _PRIME_COOL_RETRACT
    {% if "gcode_macro _INDX_MACHINE" in printer and printer["gcode_macro _INDX_MACHINE"].part_cooling == "none" %}
        # No part cooling fan: the coast ends before the nozzle is below
        # COAST_TEMP, so it waits there, at contact height, never lifting hot
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={params.COAST_TEMP}
    {% endif %}
    G1 Z5 F{(printer.configfile.settings.printer.max_z_velocity|default(printer.configfile.settings.printer.max_velocity)|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 3000}
    # Lifted, the fan on: at the material's soft temperature a short wipe on
    # the coast track shears off anything still hanging from the tip
    _PRIME_SOFT_WIPE X0={sx0} X1={sx1} Y={y} Z={zc_coast} TEMP={params.TEMP|default(0)} PROBE_TEMP={ptemp} COAST={coast}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ptemp + 4}
    _INDX_PART_FAN S=0
    # Cold wipe: past the end of the coast, on in +X, never toward the blob
    G1 X{x + l + coast + 10} Y{y} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    G1 Z{zc_wipe + 0.5} F600
    G1 Z{zc_wipe} F120
    G1 X{x + l + coast + 16} F300
    G1 Z5 F600
    # Cold check tap in the 2 mm gap after the wipe (check_mm)
    _PRIME_TAP X={x + l + coast + 17} Y={y} NAME=check
    {% endif %}

[gcode_macro _PRIME_FLOW_CHECK]
description: Inner - make sure the active tool extrudes before priming: test, feed more if starved, pause if it never flows
# Each try extrudes TEST mm at ~5 mm3/s (long, so the CHT insert alone does
# not pass it) and reads the load cell's peak against the reading before;
# with X0/X1/Z as a line from X0 to X1 at Z. Below MIN_G the tool is
# starved: feed FEED mm and try again, up to TRIES times. [EL-PRI-037]
variable_ok: 0
variable_base: 0.0
variable_peak: 0.0
variable_fed: 0.0
variable_n: 0
variable_rest: 0.0
gcode:
    {% set tries = params.TRIES|default(6)|int %}
    G4 P300
    M400
    _PRIME_FLOW_REST
    SET_GCODE_VARIABLE MACRO=_PRIME_FLOW_CHECK VARIABLE=ok VALUE=0
    SET_GCODE_VARIABLE MACRO=_PRIME_FLOW_CHECK VARIABLE=fed VALUE=0
    {% for i in range(tries) %}
        _PRIME_FLOW_TRY MIN_G={params.MIN_G|default(52)} FEED={params.FEED|default(10)} TEST={params.TEST|default(6)} X0={params.X0|default(-1)} X1={params.X1|default(-1)} Z={params.Z|default(-1)} LAST={1 if i == tries - 1 else 0}
    {% endfor %}
    _PRIME_FLOW_RESULT

[gcode_macro _PRIME_FLOW_TRY]
description: Inner - one flow test (skipped once flowing)
gcode:
    {% if printer["gcode_macro _PRIME_FLOW_CHECK"].ok|int == 0 %}
        G4 P300
        M400
        _PRIME_FLOW_BASE
        {% set test = params.TEST|float %}
        {% if params.X1|float >= 0 %}
            {% set secs = test * 2.405 / 5.0 %}
            # the prime line: played as a tune when prime_tune is on (_PRIME_TUNE_MOVE)
            _PRIME_TUNE_MOVE X0={params.X0} X1={params.X1} E={test} F={((params.X1|float - params.X0|float)|abs / secs * 60)|round(1)}
        {% else %}
            G1 E{test} F125
        {% endif %}
        M400
        _PRIME_FLOW_EVAL MIN_G={params.MIN_G} FEED={params.FEED} LAST={params.LAST} X0={params.X0} Z={params.Z}
    {% endif %}

[gcode_macro _PRIME_TUNE_MOVE]
description: Inner - one extruding straight line of the prime strip (the flow check line), from X0,Y0 to X1,Y1 with E mm (relative) at F. With _PRIME_SETTINGS prime_tune on it plays a phrase of Du gamla, du fria (traditional), or on some dates the day's tune (dated_tunes, _PRIME_TUNES): one segment per note along the line, each at the speed whose motor step rate is the note's pitch, the same E per mm, a short rest without E between notes. Otherwise one plain G1. Start, end and E are the same either way
# Pitch: f = v * steps_per_mm (from the config) on a pure X or Y move; a
#   diagonal line runs plain. [EL-PRI-013]
# Octave (tune_octave, auto): of -2..2, the one closest to the line's own
#   speed with no note over tune_max_flow (mm3/s) or max_velocity.
# Tempo: tune_bpm; a shorter line plays faster, at most tune_tempo_max
#   times, then the phrase is cut at the line's end. A longer line holds the
#   last note to its end.
# last: what the last call played (octave, bpm, secs, notes; empty: plain)
variable_last: {}
gcode:
    {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
    {% set x0 = params.X0|float %}
    {% set x1 = params.X1|float %}
    {% set y0 = params.Y0|default(0)|float %}
    {% set y1 = params.Y1|default(params.Y0|default(0))|float %}
    {% set e = params.E|float %}
    {% set f = params.F|float %}
    {% set dx = x1 - x0 %}
    {% set dy = y1 - y0 %}
    {% set axis = "x" if dy|abs < 0.0001 else ("y" if dx|abs < 0.0001 else "") %}
    {% set dist = (dx if axis == "x" else dy)|abs %}
    {% set a0 = x0 if axis == "x" else y0 %}
    {% set sgn = 1.0 if (dx if axis == "x" else dy) > 0 else -1.0 %}
    {% set cs = printer.configfile.settings %}
    {% set kin = cs.printer.kinematics|default("")|string|lower %}
    {% set sec = "stepper_x" if kin in ("corexy", "limited_corexy") else "stepper_" ~ (axis or "x") %}
    {% set sc = cs[sec] if sec in cs else {} %}
    {% set rd = sc.rotation_distance|float if "rotation_distance" in sc else 0.0 %}
    {% set ns = namespace(spm=0.0, gr=1.0) %}
    {% if rd > 0 %}
        {% for g in sc.gear_ratio|default([]) if g|length == 2 and g[1]|float > 0 %}
            {% set ns.gr = ns.gr * g[0]|float / g[1]|float %}
        {% endfor %}
        {% set ns.spm = sc.full_steps_per_rotation|default(200)|float * sc.microsteps|default(16)|float * ns.gr / rd %}
    {% endif %}
    # Dated tunes (dated_tunes, _PRIME_TUNES): on a day the indx_fun module
    # names (printer.indx_fun.occasion) the day's tune instead of the
    # phrase: its whole first verse when the line is long enough for it at
    # tune_tempo_max at most, else its first line (cut at the line's end
    # like the phrase). Without indx_fun, or off: the phrase (tune_notes)
    {% set occ = (printer.indx_fun.occasion|default("") if "indx_fun" in printer else "")|string %}
    {% set tt = printer["gcode_macro _PRIME_TUNES"].tunes|default({}) if "gcode_macro _PRIME_TUNES" in printer else {} %}
    {% set dated = st.dated_tunes|default(True) and occ in tt %}
    {% set cands = [["verse", tt[occ].verse], ["line", tt[occ].line]] if dated else [["phrase", st.tune_notes|default([])]] %}
    {% set beat = 60.0 / st.tune_bpm|float %}
    {% set oc = namespace(o=none, score=0.0, notes=[], fb=0.0, part="") %}
    {% if st.prime_tune|default(False) and axis and dist > 0.5 and e > 0 and ns.spm > 0 and kin in ("corexy", "limited_corexy", "cartesian", "limited_cartesian") %}
        {% set exs = cs[printer.toolhead.extruder] if printer.toolhead.extruder in cs else {} %}
        {% set fd = exs.filament_diameter|float if "filament_diameter" in exs else 1.75 %}
        {% set area = 3.14159 * fd * fd / 4.0 %}
        {% set vline = f / 60.0 %}
        {% set want = st.tune_octave|default("auto")|string %}
        {% for cand in cands %}
            {% set notes = cand[1] %}
            {% if oc.o is none and notes|length > 0 %}
                {% set nb = namespace(fb=0.0, b=0.0, fmax=0.0, o=none, score=0.0) %}
                {% for n in notes %}
                    {% set nb.fb = nb.fb + n[0]|float * n[1]|float %}
                    {% set nb.b = nb.b + n[1]|float %}
                    {% set nb.fmax = [nb.fmax, n[0]|float]|max %}
                {% endfor %}
                {% for o in ([-2, -1, 0, 1, 2] if want == "auto" else [want|int]) %}
                    {% set top = nb.fmax * 2.0 ** o / ns.spm %}
                    {% if top * e / dist * area <= st.tune_max_flow|float and top <= printer.toolhead.max_velocity|float %}
                        {% set r = (nb.fb / nb.b * 2.0 ** o / ns.spm) / vline if vline > 0 else 1.0 %}
                        {% set score = [r, 1.0 / r]|max %}
                        {% if nb.o is none or score < nb.score %}
                            {% set nb.o = o %}
                            {% set nb.score = score %}
                        {% endif %}
                    {% endif %}
                {% endfor %}
                # a verse only where it fits at tune_tempo_max; the last
                # candidate (the line, or the phrase) always plays
                {% if nb.o is not none and (loop.last or nb.fb * 2.0 ** nb.o * beat / ns.spm / dist <= st.tune_tempo_max|float) %}
                    {% set oc.o = nb.o %}
                    {% set oc.score = nb.score %}
                    {% set oc.notes = notes %}
                    {% set oc.fb = nb.fb %}
                    {% set oc.part = cand[0] %}
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if oc.o is none %}
        G1 X{params.X1}{(" Y" ~ params.Y1) if params.Y1 is defined else ""} E{params.E} F{params.F}
        SET_GCODE_VARIABLE MACRO=_PRIME_TUNE_MOVE VARIABLE=last VALUE="{ {} }"
    {% else %}
        {% set notes = oc.notes %}
        {% set k = 2.0 ** oc.o %}
        {% set gap = st.tune_gap_ms|default(30)|int %}
        # Tempo: see the macro's header
        {% set lmel = oc.fb * k * beat / ns.spm %}
        {% set tplain = dist / vline if vline > 0 else 0.0 %}
        {% set s = [[1.0, lmel / dist]|max, st.tune_tempo_max|float]|min %}
        {% set sg = namespace(pos=0.0, ep=0.0, done=False, secs=0.0, n=0, prev=0.0) %}
        {% for nt in notes %}
            {% if not sg.done %}
                {% set v = nt[0]|float * k / ns.spm %}
                {% set end = sg.pos + v * nt[1]|float * beat / s %}
                # past the end, or the last note: it ends at the line's end
                # (a line longer than the phrase holds the last note)
                {% if end > dist - 0.05 or loop.last %}
                    {% set end = dist %}
                    {% set sg.done = True %}
                {% endif %}
                {% set ec = e if sg.done else (e * end / dist)|round(5) %}
                # a rest between notes, no E: repeated notes always get one
                {% set rest = gap if gap > 0 else (30 if nt[0]|float == sg.prev else 0) %}
                {% if sg.n > 0 and rest > 0 %}
                    G4 P{rest}
                    {% set sg.secs = sg.secs + rest / 1000.0 %}
                {% endif %}
                G1 {axis|upper}{"%.4f"|format(a0 + sgn * end)} E{"%.5f"|format(ec - sg.ep)} F{"%.2f"|format(v * 60.0)}
                {% set sg.secs = sg.secs + (end - sg.pos) / v %}
                {% set sg.ep = ec %}
                {% set sg.pos = end %}
                {% set sg.prev = nt[0]|float %}
                {% set sg.n = sg.n + 1 %}
            {% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_PRIME_TUNE_MOVE VARIABLE=last VALUE="{ {'octave': oc.o, 'bpm': (st.tune_bpm|float * s)|round(1), 'secs': sg.secs|round(2), 'notes': sg.n, 'plain_secs': tplain|round(2), 'tune': occ if dated else '', 'part': oc.part} }"
    {% endif %}

[gcode_macro _PRIME_FLOW_REST]
description: Inner - load cell reading before the first test (what the nozzle bears on the bed, if anything)
gcode:
    SET_GCODE_VARIABLE MACRO=_PRIME_FLOW_CHECK VARIABLE=rest VALUE={printer.load_cell_probe.force_g|default(0)|float}

[gcode_macro _PRIME_FLOW_BASE]
description: Inner - load cell reading before the test extrusion
gcode:
    SET_GCODE_VARIABLE MACRO=_PRIME_FLOW_CHECK VARIABLE=base VALUE={printer.load_cell_probe.force_g|default(0)|float}

[gcode_macro _PRIME_FLOW_EVAL]
description: Inner - peak extrusion force of the last test; feed more if starved
gcode:
    {% set lc = printer.load_cell_probe %}
    {% set base = printer["gcode_macro _PRIME_FLOW_CHECK"].base|float %}
    # Extrusion pulls the load cell negative, retraction and contact push it
    # positive: only the downward peak counts as flow [EL-PRI-037]
    {% set peak = base - lc.min_force_g|default(base)|float %}
    SET_GCODE_VARIABLE MACRO=_PRIME_FLOW_CHECK VARIABLE=peak VALUE={"%.1f"|format(peak)}
    {% if peak >= params.MIN_G|float %}
        SET_GCODE_VARIABLE MACRO=_PRIME_FLOW_CHECK VARIABLE=ok VALUE=1
    {% elif not params.LAST|int %}
        {% if params.X0|float >= 0 %}
            G1 Z{params.Z|float + 1} F600       ; back to the start of the test line
            G1 X{params.X0} F3000
            G1 Z{params.Z} F600
        {% endif %}
        G1 E{params.FEED} F300
        SET_GCODE_VARIABLE MACRO=_PRIME_FLOW_CHECK VARIABLE=fed VALUE={printer["gcode_macro _PRIME_FLOW_CHECK"].fed|float + params.FEED|float}
    {% endif %}

[gcode_macro _PRIME_FLOW_RESULT]
description: Inner - report the flow check, pause if the tool never extruded
gcode:
    {% set f = printer["gcode_macro _PRIME_FLOW_CHECK"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    SET_GCODE_VARIABLE MACRO=_PRIME_FLOW_CHECK VARIABLE=n VALUE={f.n|int + 1}
    {% if f.ok|int %}
        {% if f.fed|float > 0 %}
            RESPOND MSG="PRIME_CLEAN: T{act} was starved, fed {f.fed|round(0)|int} mm more before it extruded ({f.peak|round(0)|int} g)"
        {% endif %}
    {% else %}
        SET_GCODE_VARIABLE MACRO=PRIME_CLEAN VARIABLE=halted VALUE=1
        {% if printer["gcode_macro PRIME_GRID"].active|int and printer.print_stats.state in ("printing", "paused") %}
            _PRIME_GRID_HOLD TOOL={act} WHY=flow FED={f.fed|round(0)|int}
        {% else %}
            M104 S0
            _INDX_LCD LEVEL=action MSG="T{act} not extruding: check it"
            RESPOND TYPE=error MSG="T{act} is not extruding: no extrusion force even after feeding {f.fed|round(0)|int} mm more. Check that filament is loaded into T{act} and that its nozzle is not clogged."
            _INDX_RAISE MSG="T{act} is not extruding, see above"
        {% endif %}
    {% endif %}

[gcode_macro _PRIME_COAST]
description: Inner - crawl on in +X in 1 mm steps at 1 mm/s until the nozzle is below TEMP (STEPS mm at most). RT=: the cooldown retraction (_PRIME_COOL_RETRACT) at the first step that finds the nozzle at RT or below
gcode:
    {% set x = params.X|float %}
    {% for k in range(1, params.STEPS|default(80)|int + 1) %}
        _PRIME_COAST_STEP X={x + k} TEMP={params.TEMP|default(160)}{(" RT=" ~ params.RT) if params.RT is defined else ""}
    {% endfor %}

[gcode_macro _PRIME_COAST_STEP]
description: Inner - one 1 mm coasting step, skipped once the nozzle is below TEMP; with RT= the cooldown retraction first, once the nozzle is at RT or below (once per run)
gcode:
    {% if params.RT is defined and not printer["gcode_macro _PRIME_RUN"].cool_ret|int and printer.extruder.temperature <= params.RT|float %}
        _PRIME_COOL_RETRACT
    {% endif %}
    {% if printer.extruder.temperature > params.TEMP|float %}
        G1 X{params.X|float} F60
        M400
    {% endif %}

[gcode_macro _PRIME_COOL_RETRACT]
description: Inner - PRIME_CLEAN at the end of its coast (or during it, once the nozzle is down to min_extrude_temp + 10), still at the contact: retract the tool cool_retract_mm (flexible filament cool_retract_flex_mm) through the retraction guard before it lifts and cools, recorded in t<n>_retracted for the next refill. Once per run. Saves: tN_retracted
# Rendered when it runs. Through _INDX_RETRACT (which records BASE for a
# tool short of clear_e since its lock). A nozzle already under
# min_extrude_temp cannot retract: said, nothing recorded, the rest runs.
gcode:
    {% if not printer["gcode_macro _PRIME_RUN"].cool_ret|int and not printer["gcode_macro PRIME_CLEAN"].halted|int %}
        {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
        {% set svv = printer.save_variables.variables %}
        {% set act = svv.active_tool|default(-1)|int %}
        {% set mat = (svv["t%d_material" % act]|default("")|string|upper) if act >= 0 else "" %}
        {% set flex = mat.startswith("TPU") or mat.startswith("TPE") or mat.startswith("FLEX") %}
        {% set e = (st.cool_retract_flex_mm if flex else st.cool_retract_mm)|float %}
        {% set have = svv["t%d_retracted" % act]|default(0)|float if act >= 0 else 0.0 %}
        SET_GCODE_VARIABLE MACRO=_PRIME_RUN VARIABLE=cool_ret VALUE=1
        {% if act >= 0 and e > 0 %}
            {% if printer[printer.toolhead.extruder].can_extrude %}
                RESPOND MSG="PRIME_CLEAN: T{act} retracting {'%.1f'|format(e)} mm at {printer[printer.toolhead.extruder].temperature|float|round(0)|int} C, still at the contact, before it lifts and cools"
                _INDX_RETRACT E={"%.2f"|format(e)} F=2100 TOTAL={"%.2f"|format(have + e)} BASE={"%.2f"|format(have)}
            {% else %}
                RESPOND TYPE=error MSG="PRIME_CLEAN: T{act} was under min_extrude_temp ({printer[printer.toolhead.extruder].temperature|float|round(0)|int} C) before its cooldown retraction: not retracted, it cools full of melt and may ooze a drop (the soft wipe, the cold wipe and the check tap still run)"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _PRIME_SOFT_WIPE]
description: Inner - PRIME_CLEAN, lifted after the coast (renders then): over the soft wipe's start, wait with the fan on until the nozzle is down to the material's soft temperature (Tg + soft_wipe_tg_hi), then the wipe (_PRIME_SOFT_WIPE_RUN). X0 X1 Y: the wipe on the coast track, Z: the coast's contact, TEMP: the print temperature, PROBE_TEMP, COAST (0: no hot coast, no soft wipe)
gcode:
    {% if not printer["gcode_macro PRIME_CLEAN"].halted|int %}
        {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
        {% set svv = printer.save_variables.variables %}
        {% set act = svv.active_tool|default(-1)|int %}
        {% set ret = svv["t%d_retracted" % act]|default(0)|float if act >= 0 else 0.0 %}
        # The material's Tg (_INDX_PARK_COOL materials): exact name, first
        # word, then the longest known name it starts with; 60 C unknown
        {% set mats = printer["gcode_macro _INDX_PARK_COOL"].materials|default({}) if "gcode_macro _INDX_PARK_COOL" in printer else {} %}
        {% set mat = (svv["t%d_material" % act]|default("")|string|upper) if act >= 0 else "" %}
        {% set word = (mat|replace("+", " ")|replace("-", " ")).split(" ")[0] if mat else "" %}
        {% set mns = namespace(tg=none, key="") %}
        {% if mat in mats %}
            {% set mns.tg = mats[mat] %}{% set mns.key = mat %}
        {% elif word and word in mats %}
            {% set mns.tg = mats[word] %}{% set mns.key = word %}
        {% else %}
            {% for k in mats %}
                {% if mat and mat.startswith(k) and k|length > mns.key|length %}
                    {% set mns.tg = mats[k] %}{% set mns.key = k %}
                {% endif %}
            {% endfor %}
        {% endif %}
        {% set tg = mns.tg|float if mns.tg is not none else 60.0 %}
        {% set temp = params.TEMP|default(0)|float %}
        {% set ptemp = params.PROBE_TEMP|default(70)|float %}
        {% set hi = tg + st.soft_wipe_tg_hi|float %}
        {% set hi = [hi, temp - 20]|min if temp > 0 else hi %}
        {% set lo = [[tg + st.soft_wipe_tg_lo|float, ptemp + 10]|max, hi - 5]|min %}
        {% set hi = [hi, lo + 5]|max %}
        {% set x0, x1 = params.X0|float, params.X1|float %}
        {% set what = "%s, Tg %.0f C" % (mns.key, tg) if mns.tg is not none else "%s: Tg unknown, 60 C" % (mat or "no material recorded") %}
        {% set rline = ("T%d retracted %.1f mm for the cooldown (t%d_retracted, the next prime refills it)" % (act, ret, act)) if ret > 0.001 else ("T%d not retracted for the cooldown" % act) %}
        {% if params.COAST|default(0)|float <= 0 or x1 - x0 < 2.0 %}
            RESPOND MSG="PRIME_CLEAN: {rline}; no soft wipe (no hot coast in this run, so no track to wipe on)"
        {% else %}
            RESPOND MSG="PRIME_CLEAN: {rline}; cooling lifted with the fan on to {'%.0f'|format(hi)} C for the soft wipe ({what}: soft from {'%.0f'|format(hi)} down to {'%.0f'|format(lo)} C)"
            G90
            G1 X{"%.2f"|format(x0)} Y{params.Y} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}      ; over the soft wipe's start, still at Z5
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={"%.1f"|format(hi)}
            _PRIME_SOFT_WIPE_RUN X1={"%.2f"|format(x1)} Z={params.Z} LO={"%.1f"|format(lo)} HI={"%.1f"|format(hi)}
        {% endif %}
    {% endif %}

[gcode_macro _PRIME_SOFT_WIPE_RUN]
description: Inner - the soft wipe once the nozzle is down to its soft temperature (renders then): down to the coast's contact Z, on in +X to X1, back up to Z5. Skipped with a line when the nozzle is already below LO (it cooled on the bed past its soft range: nothing could ooze in the air)
gcode:
    {% set t = printer.extruder.temperature|float %}
    {% if t >= params.LO|float %}
        G1 Z{"%.4f"|format(params.Z|float + 0.5)} F600
        G1 Z{"%.4f"|format(params.Z|float)} F120
        G1 X{params.X1} F300                   ; soft wipe on the coast track: what hangs from the tip shears off and stays on the bed
        G1 Z5 F600
        RESPOND MSG="PRIME_CLEAN: soft wipe at {'%.0f'|format(t)} C (soft range {'%.0f'|format(params.HI|float)} to {'%.0f'|format(params.LO|float)} C), on the coast track at its contact"
    {% else %}
        RESPOND MSG="PRIME_CLEAN: no soft wipe: the nozzle is {'%.0f'|format(t)} C, already below its soft range ({'%.0f'|format(params.HI|float)} to {'%.0f'|format(params.LO|float)} C): it cooled on the bed past it, so nothing oozed in the air; the cold wipe follows"
    {% endif %}

[gcode_macro _PRIME_SETTINGS]
description: Inner - fixed geometry of the print start purge lane; the user settings are in indx.cfg (TOOL_POSITIONS prime_*)
# One slot (+X): 2 mm, 12 mm flow test line (the prime), 4 mm blob, 5 mm,
# coast up to 20 mm, 5 mm, 6 mm wipe, 2 mm, two 12 mm re-prime lines: 80 mm.
# Rows are 3 mm apart. [EL-PRI-001]
# clear_z: gcode Z that first-layer tool changes hold while crossing a front
#   lane (PRINT_TOOLCHANGE): the blob height plus 0.5 mm. [EL-PRI-038]
# dock_lane_y: [y_min, y_max] the scanner screw heads cross at the dock X
#   during a pickup: slots there are skipped. [EL-PRI-038]
# residue_mm: a tap before the prime this far above the bed is plastic stuck
#   to the nozzle: the prime stops.
# hold_frac: during a print, a prime that stops (residue, a tool that does
#   not extrude, a failed Z check) raises the head, pauses, and holds the
#   tool at this fraction of its print temperature until RESUME. RESUME
#   restarts the prime from that tool (in a free slot) and prints.
# hold_minutes: after this long without RESUME the heater goes off (RESUME
#   still restarts the prime); the motors stay on so the head keeps its home.
# occupied_mm: a first (coast) tap in a lane slot this far or more above the
#   bed, but below residue_mm, is an old purge line, not a dirty tip
#   [EL-PRI-039]
# occupied_moves: how many times one prime moves on to the next unused slot
#   for that; still high after these moves is a dirty tip.
# lane_rows: rows of slots. 0: as many as all tools plus their spares need
#   (as many spares as tools, at least two). More: more extra cleans per
#   print, more bed taken.
# Within one print start no slot is used twice (_PURGE_LANE).
variable_residue_mm: 0.6
# hot_tap_low_mm: the hot tap at the prime spot before the refill (molten, a
#   cold bead gives way) may sit this far under the expected contact (cold
#   taps 0.1): a bead on the reference tool shifts the Z frame by its
#   thickness. Coast and wipe only ever move down by it. [EL-PRI-014]
# check_mm: the cold tap after the wipe reading this much over the hot tap
#   is plastic left on the tip: a warning, not a stop.
# sweep_force_g: (empty tools) the hot tap's trigger force; the sweep then
#   goes on from there without lifting, set by height (the load cell drifts
#   while the nozzle cools). [EL-PRI-009]
# hot_clean_target_mm, hot_clean_passes: INDX_HOT_CLEAN cleans again while
#   TOOL_Z_MEASURE is further than this from the saved offset, at most that
#   many passes; two passes within 0.015 mm of each other: it stops.
variable_hot_tap_low_mm: 0.4
# hot_tap_force_g: g, a loaded tool's hot tap: through the molten film to
#   the metal [EL-PRI-009]
variable_hot_tap_force_g: 100
variable_check_mm: 0.1
# cool_retract_mm: mm, retracted during the coast (at min_extrude_temp + 10)
#   or at its end, before the nozzle lifts and cools, so a full nozzle does
#   not ooze a drop that sets under the tip. Recorded in t<n>_retracted for
#   the next refill. Flexible filament (TPU, TPE, FLEX): cool_retract_flex_mm.
#   [EL-PRI-002]
variable_cool_retract_mm: 8.0
variable_cool_retract_flex_mm: 1.6
# soft_wipe_tg_hi, soft_wipe_tg_lo (C over Tg), soft_wipe_mm: lifted and
#   cooling, a short +X wipe back on the coast track at its contact while the
#   nozzle is between Tg + hi and Tg + lo: soft enough to shear off what
#   hangs from the tip, too cold to draw a new string. Tg from
#   _INDX_PARK_COOL materials, 60 C unknown. Held under the print
#   temperature - 20 and over PROBE_TEMP + 10. No hot coast: no soft wipe.
#   [EL-PRI-040]
variable_soft_wipe_tg_hi: 80
variable_soft_wipe_tg_lo: 50
variable_soft_wipe_mm: 6
variable_sweep_force_g: 100
# sweep_speed: mm/s. Faster spreads what the tip sheds over more fresh bed;
#   the sweep ends at the slot's end and finishes cooling in the air
variable_sweep_speed: 2.0
variable_hot_clean_target_mm: 0.02
variable_hot_clean_passes: 3
# hot_clean_press_frac: later INDX_HOT_CLEAN passes press this fraction of
#   the first pass's press below their hot contact: harder marks the bed
#   [EL-PRI-004]
# hot_growth_max_mm: mm, the most cold-to-hot nozzle growth a later pass
#   uses (the two taps are at different bed spots) [EL-PRI-004]
variable_hot_clean_press_frac: 0.5
variable_hot_growth_max_mm: 0.05
variable_occupied_mm: 0.15
variable_occupied_moves: 2
variable_lane_rows: 0
variable_hold_frac: 0.7
variable_hold_minutes: 30
variable_dock_lane_y: [16, 18]
variable_slot_x: 80
variable_slot_y: 3
variable_slots: []
variable_exit_y: -1.0
variable_clear_z: 1.7
# bed_z_check: with a ready purge station that takes the first layer's tool
#   changes (the prime bucket), False (the default): only the reference tool
#   (ref_tool) primes, cleans and re-zeroes on the bed at print start; the
#   other tools of the print get no bed prime and no bed Z check and prime
#   in the station at their first pickup (refill, purge, flow check), with a
#   cold Z check on the inductive XY sensor before it when one is installed
#   (_INDX_SENSOR_ZCHECK). True: every tool on the bed as without a station.
#   Without a ready station it changes nothing.
variable_bed_z_check: False
# z_check_limit: that cold sensor Z check stops the print (before anything
#   heats) when a tool's sensor trigger height, relative to the reference
#   tool's, differs from the one CAL_Z recorded (t<n>_sensor_dz) by more
#   than this (mm)
variable_z_check_limit: 0.10
# prime_tune: the prime line (the flow check line) plays the closing line of
#   Du gamla, du fria (traditional) on the XY motors (_PRIME_TUNE_MOVE). Same
#   line, same filament; off: the plain line.
# tune_octave: auto (the octave whose note speeds suit the line) or -2..2
# tune_notes: [Hz, quarter notes]: D5 (upbeat) G5 F#5 G5 A5 B5 G5 C6 B5 A5 G5
# tune_bpm: the score's tempo; faster only to fit a shorter line, at most
#   tune_tempo_max times [EL-PRI-013]
# tune_gap_ms: the rest between notes, no E (separates repeated notes)
# tune_max_flow: mm3/s, the fastest note at the line's E per mm (the plain
#   line runs at 5)
variable_prime_tune: True
variable_tune_octave: "auto"
variable_tune_notes: [[587.33, 0.5], [783.99, 0.75], [739.99, 0.25], [783.99, 0.5], [880.0, 0.5], [987.77, 0.5], [783.99, 0.5], [1046.5, 0.5], [987.77, 0.5], [880.0, 2.0], [783.99, 1.0]]
variable_tune_bpm: 69.0
variable_tune_tempo_max: 4.0
variable_tune_gap_ms: 30
variable_tune_max_flow: 10.0
# dated_tunes: on 6 June the whole first verse of Du gamla, du fria where
#   the line is long enough (else its first line), in the week of Midsummer
#   Eve Sma grodorna, on 13 December Sankta Lucia and in the rest of
#   December Nu ar det jul igen (_PRIME_TUNES; the date from the indx_fun
#   module, INDX Suite). Off: always the phrase above
variable_dated_tunes: True
gcode:

[gcode_macro _PRIME_SLOTS]
description: Inner - lay out the purge lane from the bed size, prime_area and corner, or next to the print (NEAR=1, prime_near_print): every slot of its rows, filled from the corner (stored in _PRIME_SETTINGS.slots, blob start [x, y] first; COUNT: slots the caller needs at least)
# The area: prime_area [x_min, y_min, x_max, y_max], else the bed less
# prime_margin; the corner says where the slots start. NEAR=1 with
# prime_near_print and the objects known (EXCLUDE_OBJECT_DEFINE): the lane
# goes prime_print_gap mm in front of (front corners) or behind the print,
# only as deep as it needs; else the usual area. [EL-PRI-015]
gcode:
    {% set s = printer["gcode_macro _PRIME_SETTINGS"] %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set count = params.COUNT|int %}
    {% set corner = params.CORNER|default(tp.prime_corner|default("front_right"))|string|lower %}
    # The margin is opt-in (prime_margin_enabled): it takes more of the bed
    {% set margin = tp.prime_margin|default(15)|float if tp.prime_margin_enabled|default(False) else 0.0 %}
    {% set bed_size = tp.prime_bed_size|default([]) %}
    {% set area = tp.prime_area|default([]) %}
    {% if corner not in ["front_right", "front_left", "back_right", "back_left"] %}
        { action_raise_error("Purge corner %s: use front_right, front_left, back_right or back_left" % corner) }
    {% endif %}
    {% set bed = bed_size if bed_size|length == 2 else [th.axis_maximum.x, th.axis_maximum.y] %}
    # the bed the head can reach
    {% set bx_lo = [th.axis_minimum.x, 0]|max %}
    {% set bx_hi = [th.axis_maximum.x, bed[0]]|min %}
    {% set by_lo = [th.axis_minimum.y, 0]|max %}
    {% set by_hi = [th.axis_maximum.y, bed[1]]|min %}
    {% if area|length == 4 %}
        {% if area[0]|float < bx_lo or area[2]|float > bx_hi or area[1]|float < by_lo or area[3]|float > by_hi or area[0]|float >= area[2]|float or area[1]|float >= area[3]|float %}
            { action_raise_error("prime_area %s: give [x_min, y_min, x_max, y_max] inside the bed (X %.0f to %.0f, Y %.0f to %.0f)" % (area, bx_lo, bx_hi, by_lo, by_hi)) }
        {% endif %}
        {% set std = [area[0]|float, area[1]|float, area[2]|float, area[3]|float] %}
        {% set where = "prime_area" %}
    {% elif area|length > 0 %}
        { action_raise_error("prime_area %s: give [x_min, y_min, x_max, y_max], or [] for the whole bed" % area) }
    {% else %}
        {% set std = [bx_lo + margin, by_lo + margin, bx_hi - margin, by_hi - margin] %}
        {% set where = "the bed" %}
    {% endif %}
    {% set w = s.slot_x|float %}
    {% set h = s.slot_y|float %}
    {% if ((std[2] - std[0]) / w)|int < 1 %}
        { action_raise_error("Purge lane: %s is narrower than one %.0f mm slot" % (where, w)) }
    {% endif %}
    {% set n_all = tp.tool_count|int + 1 %}
    {% set docks = [] %}
    {% set svv = printer.save_variables.variables %}
    {% set tl = tp.tools|default([]) %}
    {% for i in range(n_all - 1) %}
        {% set _ = docks.append((svv.get("t%d_dock_x" % i) if svv.get("t%d_dock_x" % i) is not none else (tl[i].x if i < tl|length else -1))|float) %}
    {% endfor %}
    {% set lane = s.dock_lane_y %}
    # Slots stay on the bed side of the dock clearance line, by the largest
    # tool Y offset more: docks that reach into the bed would be in the way
    # of the head [EL-PRI-049]
    {% if tp.clearance_y is not number %}
        { action_raise_error("INDX is still starting up (clearance_y not resolved yet). Try again in a few seconds.") }
    {% endif %}
    {% set clr = tp.clearance_y|float %}
    {% set ddir = tp.dock_dir|float %}
    {% set ns_off = namespace(m=0.0) %}
    {% for i in range(n_all - 1) %}
        {% set ns_off.m = [ns_off.m, svv.get("t%d_offset_y" % i, 0.0)|float|abs]|max %}
    {% endfor %}
    {% set std0 = std %}
    {% if ddir < 0 %}
        {% set std = [std[0], [std[1], clr + ns_off.m]|max, std[2], std[3]] %}
    {% else %}
        {% set std = [std[0], std[1], std[2], [std[3], clr - ns_off.m]|min] %}
    {% endif %}
    # A full-machine job reserves a slot per tool plus spares (at least two)
    # for recleans and a held restart: the lane covers them all [EL-PRI-016]
    {% set n_job = tp.tool_count|int + [tp.tool_count|int, 2]|max %}
    {% set want = [count, n_all, n_job]|max %}
    # Candidate areas, first that holds every slot wins: next to the print,
    # then the usual one
    {% set areas = [] %}
    {% set objs = printer.exclude_object.objects|default([]) if "exclude_object" in printer else [] %}
    {% if params.NEAR|default(0)|int and tp.prime_near_print|default(True) and objs|length > 0 %}
        {% set pts = [] %}
        {% for o in objs %}
            {% for pt in (o.polygon if o.polygon is defined and o.polygon else ([o.center] if o.center is defined and o.center else [])) %}
                {% set _ = pts.append(pt) %}
            {% endfor %}
        {% endfor %}
        {% if pts|length > 0 %}
            {% set gap = tp.prime_print_gap|default(10)|float %}
            {% set p_lo = pts|map(attribute=0)|min|float %}
            {% set p_hi = pts|map(attribute=0)|max|float %}
            {% set q_lo = pts|map(attribute=1)|min|float %}
            {% set q_hi = pts|map(attribute=1)|max|float %}
            # at least two slots wide so the lane is not one deep column,
            # inside the usual area
            {% set span = [[p_hi - p_lo, 2 * w]|max, std[2] - std[0]]|min %}
            {% set mid = (p_lo + p_hi) / 2 %}
            {% set xl = [[mid - span / 2, std[0]]|max, std[2] - span]|min %}
            {% set per = ((span) / w)|int %}
            {% set rows = ((want + per - 1) / per)|int %}
            {% if "front" in corner %}
                {% set yh = q_lo - gap %}
                {% set yl = yh - rows * h %}
            {% else %}
                {% set yl = q_hi + gap %}
                {% set yh = yl + rows * h %}
            {% endif %}
            {% if yl >= std[1] and yh <= std[3] %}
                {% set _ = areas.append([xl, yl, xl + span, yh, "next to the print"]) %}
            {% endif %}
        {% endif %}
    {% endif %}
    {% set _ = areas.append(std + [where]) %}
    {% set ns = namespace(slots=[], used=none, per_row=0, got=0, rows=0) %}
    {% for ar in areas %}
      {% if ns.used is none %}
        {% set per_row = ((ar[2] - ar[0]) / w)|int %}
        # Every slot of this area that fits in 12 rows, with its row
        {% set cand = [] %}
        {% for r in range(12) %}
            {% for c in range(per_row) %}
                {% set sx = ar[2] - (c + 1) * w if "right" in corner else ar[0] + c * w %}
                {% set sy = ar[1] + r * h if "front" in corner else ar[3] - (r + 1) * h %}
                {% set inside = sy >= ar[1] - 0.001 and sy + h <= ar[3] + 0.001 %}
                {% set in_lane = lane|length == 2 and docks|length > 0 and sx < docks|max + 30 and sx + w > docks|min - 30 and sy < lane[1] + 1 and sy + h > lane[0] - 1 %}
                {% if inside and not in_lane %}
                    {% set _ = cand.append([sx + 14, sy + h / 2, sy, sy + h, r]) %}
                {% endif %}
            {% endfor %}
        {% endfor %}
        {% set ns.got = cand|length %}
        {% if cand|length >= want %}
            # The lane: the rows the first want slots take, or lane_rows if more
            {% set rows = [[cand[want - 1][4] + 1, s.lane_rows|default(0)|int]|max, 12]|min %}
            {% set slots = [] %}
            {% for sl in cand if sl[4] < rows %}
                {% set _ = slots.append(sl[:4]) %}
            {% endfor %}
            {% set ns.slots = slots %}
            {% set ns.used = ar %}
            {% set ns.per_row = per_row %}
            {% set ns.rows = [rows, cand|map(attribute=4)|max + 1]|min %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {% if ns.used is none %}
        {% set ar = areas[-1] %}
        { action_raise_error("Purge lane: only %d of %d slots fit %s clear of the docks (%.0f x %.0f mm; each slot is %.0f x %.0f mm)" % (ns.got, want, ar[4], ar[2] - ar[0], [ar[3] - ar[1], 0]|max, w, h)) }
    {% endif %}
    {% set slots = ns.slots %}
    {% set ar = ns.used %}
    # from the bed edge (or prime_area's), not the clearance line
    {% set edge = std0 if ar[4] != "next to the print" else ar %}
    {% set depth = (slots|map(attribute=3)|max - edge[1]) if "front" in corner else (edge[3] - slots|map(attribute=2)|min) %}
    SET_GCODE_VARIABLE MACRO=_PRIME_SETTINGS VARIABLE=slots VALUE="{slots}"
    # A front lane is crossed by the travel back from the docks: tool changes
    # leave the lane at this Y before dropping to print height (-1: no need)
    SET_GCODE_VARIABLE MACRO=_PRIME_SETTINGS VARIABLE=exit_y VALUE={(slots|map(attribute=3)|max + 2) if "front" in corner else -1.0}
    {% set size = "%d slots of %d x %d mm (%d per row, %d row%s)" % (slots|length, w|int, h|int, ns.per_row, ns.rows, "s" if ns.rows > 1 else "") %}
    {% if ar[4] == "next to the print" %}
        RESPOND MSG="Purge lane: {size}, {'in front of' if 'front' in corner else 'behind'} the print (X {'%.0f'|format(ar[0])} to {'%.0f'|format(ar[2])}, Y {'%.0f'|format(ar[1])} to {'%.0f'|format(ar[3])}); clear it between prints"
    {% else %}
        RESPOND MSG="Purge lane: {size} from {corner} of {ar[4]}; keep {(depth + (margin if ar[4] == 'the bed' else 0))|round(0)|int} mm along that edge free for {n_all - 1} tools, and clear it between prints"
    {% endif %}

[gcode_macro _PURGE_LANE]
description: Inner - purge lane slots of the running print start: taken (slots this print start has used), cur (the slot just taken, got 0: none), cur_own (whose own slot it is, -1: a spare), own ({tool: [x, y]}: each tool's own slot, its re-zero and first-layer re-prime lines go there), used_n (slots taken), wrapped (1: this print ran out of slots and started over)
# Nothing is kept across prints: every print start begins at the first slot
# (clear the strip between prints). A slot this print start has used is never
# taken again by it; an old line from an earlier print is found by the first
# tap of PRIME_CLEAN LANE=1 (occupied_mm).
variable_taken: []
variable_cur: -1
variable_got: 0
variable_cur_own: -1
variable_own: {}
variable_used_n: 0
variable_wrapped: 0
# pre: [x, y] of the slots this print start used before PRIME_GRID (the
# reference tool's clean in G28, _INDX_REF_CLEAN_NOTE); _PURGE_LANE_PRE marks
# them taken. Kept only in a print, cleared at the print end and a cancel
variable_pre: []
gcode:

[gcode_macro _PURGE_LANE_TAKE]
description: Inner - take the next purge lane slot this print start has not used yet. None left: start over from the first slot (not a tool's own slot) and say so; the print goes on. OWN=<tool>: that tool's own slot. MOVE=1: an unused slot only, no starting over
gcode:
    {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
    {% set pl = printer["gcode_macro _PURGE_LANE"] %}
    {% set slots = st.slots %}
    {% set m = slots|length %}
    {% set taken = pl.taken %}
    {% set free = range(m)|reject("in", taken)|list %}
    {% if params.MOVE|default(0)|int %}
        # Moving on from an occupied slot: only while an unused slot stays
        # for every tool of this print start still to come
        {% set g = printer["gcode_macro PRIME_GRID"] %}
        {% set need = [g.grid.tools|default([])|length - g.done|length - 1, 0]|max %}
        {% if free|length <= need %}
            {% set free = [] %}
        {% endif %}
    {% endif %}
    {% set wrap = m > 0 and not free and not params.MOVE|default(0)|int %}
    {% set owned = [] %}
    {% if wrap %}
        # Start over from the first slot; the tools' own slots stay taken
        # (their re-zero and re-prime lines still go there)
        {% set ownxy = pl.own.values()|list %}
        {% for k in range(m) if slots[k][:2] in ownxy %}
            {% set _ = owned.append(k) %}
        {% endfor %}
        {% set free = range(m)|reject("in", owned)|list or [0] %}
    {% endif %}
    {% if not free %}
        SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=got VALUE=0
    {% else %}
        {% set i = free[0] %}
        {% set t = params.OWN|default(-1)|int %}
        SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=taken VALUE="{(owned + [i]) if wrap else (taken + [i])}"
        SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=cur VALUE={i}
        SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=cur_own VALUE={t}
        SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=got VALUE=1
        SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=used_n VALUE={pl.used_n|int + 1}
        {% if t >= 0 %}
            {% set own = dict(pl.own) %}
            {% set _ = own.update({t: slots[i][:2]}) %}
            SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=own VALUE="{own}"
        {% endif %}
        {% if wrap %}
            SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=wrapped VALUE=1
            RESPOND MSG="Purge lane: this print start has used all {m} slots. It goes on from the first slot again, on top of its own lines, which can make the Z checks read high. For more room: lane_rows (INDX page, Settings, Purge lane)."
        {% endif %}
    {% endif %}

[gcode_macro PRIME_GRID]
description: Print start: prime, clean and Z-check every tool of the job in the purge lane, re-zero Z with the first tool, re-prime it. Needs: homed, soaked bed. Moves: tool changes, the purge lane. Saves: zero_z_shift, global_z_offset
# PRIME_GRID TOOLS=1,2,3 [FIRST=<tool>] [TEMP=240 | TEMPS=240,250,240,240]
#            [CORNER=front_right] [COAST=20] [RECLEAN=0.04] [LIMIT=0.15] [ENABLE=0|1]
# Settings: indx.cfg (TOOL_POSITIONS prime_*); ENABLE and CORNER override
# prime_enabled and prime_corner for one call. TEMPS: a temperature per tool
# number (T0, T1, ...); TEMP the fallback.
# Each tool takes the next unused lane slot (from the first slot at every
# print start; all used: start over and say so). FIRST (default: the first
# in TOOLS) goes last, so its Z re-zero and re-prime come right before
# printing. A slot holds a PRIME_CLEAN and two re-prime lines (FIRST's after
# the re-zero, the first-layer one in PRINT_TOOLCHANGE).
# Z check: every tool taps the Z homing spot against its saved Z offset
# [EL-PRI-041].
# Beyond RECLEAN it is cleaned once more and taps again:
#   - within RECLEAN: fine
#   - repeats within 0.015 mm and within LIMIT: real, accepted
#   - repeats beyond LIMIT: the offset is wrong (CAL_Z out of date): pause
#   - does not repeat: still dirty: pause
# FIRST's accepted tap becomes the Z re-zero.
# A stop during a print holds the tool warm with the head raised and pauses
# (_PRIME_GRID_HOLD). RESUME must run _INDX_RESUME_HOOK first (see the
# example print_start_end.cfg): it restarts the prime from that tool.
variable_failed: 0
variable_grid: {}
variable_pending: 0
variable_pending_dev: 0.0
variable_active: 0
variable_held: 0
# resuming: always 0 (read by older RESUME macros). A RESUME redoing the
# prime keeps held at 1 until the redo got through (_PRIME_GRID_RESUME_END),
# so a redo that stops on an error or a new hold leaves the print held at
# the tool it stopped at and the next RESUME redoes it again [EL-PRI-017]
variable_resuming: 0
variable_held_tool: -1
variable_held_why: ""
variable_done: []
variable_args: ""
variable_cur_temp: 0.0
gcode:
    # A new print start: nothing from an earlier print (a cancel while held,
    # a prime that died) carries over [EL-PRI-018]
    _INDX_PRINT_STATE_CLEAR
    {% set tools = params.TOOLS|default(printer.save_variables.variables.active_tool|default(0))|string %}
    # Tolerates spaces, empty entries and a trailing comma ("1,2,3," from slicer placeholders)
    {% set tools = tools.split(",")|map("trim")|select|map("int")|unique|list %}
    # Tools without heating (pen, cutter, camera: TOOL_POSITIONS no_heat_tools)
    # are never heated or primed [EL-PRI-019]
    {% set no_heat = printer["gcode_macro TOOL_POSITIONS"].no_heat_tools|default([]) %}
    {% set skipped = tools|select("in", no_heat)|list %}
    {% set tools = tools|reject("in", no_heat)|list %}
    {% if skipped %}
        RESPOND MSG="PRIME_GRID: not priming T{skipped|join(', T')} (no_heat_tools)"
    {% endif %}
    # No part cooling fan: the prime is off unless asked for (prime_without_fan),
    # since every coast then waits on the bed for the nozzle to cool
    {% set mach = printer["gcode_macro _INDX_MACHINE"] if "gcode_macro _INDX_MACHINE" in printer else {} %}
    {% set nofan_off = mach.part_cooling|default("not_set") == "none" and not mach.prime_without_fan|default(False) %}
    {% set enabled = params.ENABLE|default(1 if printer["gcode_macro TOOL_POSITIONS"].prime_enabled|default(True) and not nofan_off else 0)|int %}
    {% if not tools %}
        RESPOND MSG="PRIME_GRID: no heated tool to prime"
    {% elif not enabled %}
        # Opted out: no purge, no Z checks, no first-layer re-primes
        {% set first = params.FIRST|default(tools[0])|int %}
        {% set temps = params.TEMPS|default("")|string %}
        {% set temps = temps.split(",")|map("trim")|select|map("float")|list if temps|length > 0 else [] %}
        {% set temp = temps[first] if temps|length > first else params.TEMP|default(240)|float %}
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=grid VALUE="{ {} }"
        SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=retracted VALUE="[]"
        RESPOND MSG="PRIME_GRID: bed prime off, heating T{first} only{'. It is off because the machine has no part cooling fan; to turn it on: INDX_SETTING MACRO=_INDX_MACHINE VAR=prime_without_fan VALUE=1 (the nozzle then waits on the bed after each cleaning blob until it has cooled)' if nofan_off and params.ENABLE is not defined and printer['gcode_macro TOOL_POSITIONS'].prime_enabled|default(True) else ''}"
        _INDX_CHANGE_TOOL TOOL={first} TEMP={temp}
        _PRIME_GRID_OFF_HEAT TEMP={temp}
    {% else %}
    # A ready purge station that takes the first layer's changes (the prime
    # bucket) and bed_z_check off: only the reference tool on the bed, the
    # others prime in the station at their first pickup (_PRIME_SETTINGS
    # bed_z_check)
    {% set sv = printer.save_variables.variables %}
    {% set ref = sv.ref_tool|default(0)|int %}
    {% set first = params.FIRST|default(tools[0])|int %}
    {% set stn = printer["gcode_macro _INDX_STATIONS"].purge if "gcode_macro _INDX_STATIONS" in printer else "" %}
    {% set sto = printer["indx_station " ~ stn] if stn and ("indx_station " ~ stn) in printer else none %}
    {% set seb = sto.enabled_by.split(".") if sto is not none and sto.enabled_by else [] %}
    {% set srw = sto.ready_when.split("=", 1) if sto is not none and sto.ready_when else [] %}
    {% set st_ready = sto is not none and (not seb or (("gcode_macro " ~ seb[0]) in printer and printer["gcode_macro " ~ seb[0]][seb[1]]|default(False))) and (not srw or (srw[0] in sv and (srw|length == 1 or sv[srw[0]]|string == srw[1]))) %}
    {% set bucket = st_ready and sto.first_layer|default(False) and not printer["gcode_macro _PRIME_SETTINGS"].bed_z_check|default(False) and ref not in no_heat %}
    {% if bucket %}
        {% set others = tools|reject("equalto", ref)|list %}
        {% set temps = params.TEMPS|default("")|string %}
        {% set temps = temps.split(",")|map("trim")|select|map("float")|list if temps|length > 0 else [] %}
        {% set ftemp = temps[first] if temps|length > first else params.TEMP|default(240)|float %}
        RESPOND MSG="PRIME_GRID: the {stn} station is ready: {('T' ~ others|join(', T') ~ ' prime there at their first pickup, no bed prime and no bed Z check' ~ (', each with a cold Z check on the XY sensor first' if 'indx_tool_align' in printer else '') ~ '. ') if others else ''}{('T%d (the reference tool) primes, cleans and re-zeroes on the bed.' % ref) if ref in tools else ('The reference tool T%d is not in this print: no bed prime, Z stays as G28 homed it.' % ref)} INDX_SETTING MACRO=_PRIME_SETTINGS VAR=bed_z_check VALUE=1 primes and Z-checks every tool on the bed."
        {% if ref in tools %}
            _PRIME_SLOTS COUNT=3 NEAR=1{(" CORNER=" ~ params.CORNER) if params.CORNER else ""}
            _PRIME_GRID_RUN TOOLS={ref} FIRST={ref} BUCKET={others|join(",") or "none"} BUCKET_FIRST={first if first != ref else -1}{% for k, v in params.items() if k not in ["TOOLS", "CORNER", "ENABLE", "FIRST"] %} {k}={v}{% endfor %}
        {% else %}
            # nothing on the bed: the print's first tool straight to the station
            SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=grid VALUE="{ {'tools': [], 'first': first, 'exit_y': -1.0, 'bucket': others} }"
            SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=retracted VALUE="[]"
            SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=reprimed VALUE="[]"
            _PRIME_GRID_BUCKET_FIRST TOOL={first} TEMP={ftemp}
        {% endif %}
    {% else %}
    # One slot per tool, plus a spare per tool for extra cleans, at least two:
    # one tool that needs an extra clean and then a held restart needs both
    _PRIME_SLOTS COUNT={tools|length + [tools|length, 2]|max} NEAR=1{(" CORNER=" ~ params.CORNER) if params.CORNER else ""}
    _PRIME_GRID_RUN TOOLS={tools|join(",")}{% for k, v in params.items() if k not in ["TOOLS", "CORNER", "ENABLE"] %} {k}={v}{% endfor %}
    {% endif %}
    {% endif %}

[gcode_macro _PRIME_GRID_OFF_HEAT]
description: Inner - PRIME_GRID with the prime off: heat the first tool, unless its pickup failed and holds the print
# Rendered after CHANGE_TOOL: a pickup that failed holds the print with the
# heater off and the tool possibly loose on the head; heating it here would
# undo that. [EL-PRI-020]
gcode:
    {% if not printer["gcode_macro _PICKUP_SEAT_FAIL"].held|int %}
        M109 S{params.TEMP}
    {% endif %}

[gcode_macro _INDX_PRINT_STATE_CLEAR]
description: Inner - forget every hold and print start state of an earlier print (print start, print end, cancel)
# Left set, a later print's RESUME would replay an old job's tool change.
# [EL-PRI-018]
gcode:
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=held VALUE=0
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=resuming VALUE=0
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=held_tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=failed VALUE=0
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=grid VALUE="{ {} }"
    SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=reprimed VALUE="[]"
    SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=zchecked VALUE="[]"
    SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=tower VALUE=-1
    SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=park_pending VALUE="[]"
    SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=held VALUE=0
    SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=resuming VALUE=0
    SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=resume_cmd VALUE='""'
    SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=outer_cmd VALUE='""'
    SET_GCODE_VARIABLE MACRO=_INDX_RESUME_HOOK VARIABLE=station_resume VALUE='""'
    UPDATE_DELAYED_GCODE ID=_prime_hold_off DURATION=0
    SET_IDLE_TIMEOUT TIMEOUT={(printer.configfile.settings.idle_timeout|default({})).timeout|default(600)}

[gcode_macro _INDX_CANCEL_HOOK]
description: Inner - the call CANCEL_PRINT needs: forget INDX's holds so a later print's RESUME does not replay this one. Mainsail and Fluidd CANCEL_PRINT call it through _CLIENT_VARIABLE (variable_user_cancel_macro: "_INDX_CANCEL_HOOK")
gcode:
    _INDX_PRINT_STATE_CLEAR
    SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=pre VALUE=[]

[gcode_macro _PRIME_GRID_RUN]
description: Inner - PRIME_GRID once the slots are laid out
gcode:
    {% set tools = params.TOOLS.split(",")|map("int")|list %}
    {% set first = params.FIRST|default(tools[0])|int %}
    {% set temps = params.TEMPS|default("")|string %}
    {% set temps = temps.split(",")|map("trim")|select|map("float")|list if temps|length > 0 else [] %}
    {% set temp_all = params.TEMP|default(240)|float %}
    {% set coast = params.COAST|default(20)|float %}
    {% set reclean = params.RECLEAN|default(0.04)|float %}
    {% set limit = params.LIMIT|default(0.15)|float %}
    {% if first not in tools %}
        { action_raise_error("PRIME_GRID: FIRST=%d is not in TOOLS" % first) }
    {% endif %}
    {% set g = printer["gcode_macro PRIME_GRID"] %}
    {% set resume = params.RESUME|default(0)|int %}
    # BUCKET: the print's tools that prime in the purge station at their
    # first pickup instead (PRIME_GRID with a ready bucket); BUCKET_FIRST: the
    # print's first tool when it is one of them, picked up through the station
    # once the bed part is done
    {% set btools = params.BUCKET|default("none")|string %}
    {% set btools = [] if btools in ["", "none"] else btools.split(",")|map("int")|list %}
    {% set bfirst = params.BUCKET_FIRST|default(-1)|int %}
    {% set temps_all = temps %}
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=failed VALUE=0
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=pending VALUE=0
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=active VALUE=1
    {% if not resume %}
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=done VALUE="[]"
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=args VALUE="'{params.items()|map("join", "=")|join(" ")}'"
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=grid VALUE="{ {'tools': tools, 'first': first, 'exit_y': printer['gcode_macro _PRIME_SETTINGS'].exit_y|float, 'bucket': btools} }"
        # A new print start: none of the lane's slots are this print's yet,
        # but the ones its G28 reference clean used (_PURGE_LANE_PRE)
        _PURGE_LANE_PRE
        SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=own VALUE="{ {} }"
        SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=retracted VALUE="[]"
        SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=reprimed VALUE="[]"
    {% endif %}
    {% set order = (tools|reject("equalto", first)|list) + [first] %}
    {% if "gcode_macro _INDX_PROGRESS" in printer and order %}
        _INDX_PROGRESS START=1 STEP="Print start prime" TOTAL={order|length} EST=120
    {% endif %}
    {% for t in order if not (resume and t in g.done) %}
        {% set temp = temps[t] if temps|length > t else temp_all %}
        # Each tool takes the next unused slot when its turn comes; after a
        # hold, the tool that stopped starts over in a new one
        _PRIME_GRID_TOOL TOOL={t} FIRST={first} TEMP={temp} COAST={coast} RECLEAN={reclean} LIMIT={limit}
    {% endfor %}
    {% if "gcode_macro _INDX_PROGRESS" in printer %}
        _INDX_PROGRESS END=1
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=active VALUE=0
    {% if bfirst >= 0 %}
        _PRIME_GRID_BUCKET_FIRST TOOL={bfirst} TEMP={temps_all[bfirst] if temps_all|length > bfirst else temp_all}
    {% endif %}

[gcode_macro _PRIME_GRID_BUCKET_FIRST]
description: Inner - PRIME_GRID with a ready bucket, once the bed part is done (or there was none): the print's first tool, when it primes in the station, picked up through PRINT_TOOLCHANGE (cold Z check on the XY sensor, the station's refill, purge and flow check, the retraction pushed back), so the print starts with it primed. Skipped once a check has failed
# PRINT_TOOLCHANGE's own: a failed pickup holds and its RESUME redoes it.
# RETRACT=0 PREV_RETRACT=0: nothing was retracted by the slicer yet, so the
# tool is left full; the slicer's own first tool change (LAYER=-1) then finds
# it on the head and only checks its temperature.
gcode:
    {% set g = printer["gcode_macro PRIME_GRID"] %}
    {% set t = params.TOOL|int %}
    {% if g.failed|int == 0 and not g.held|int and t >= 0 %}
        RESPOND MSG="PRIME_GRID: T{t} starts the print: picked up and primed in the purge station"
        PRINT_TOOLCHANGE NEXT={t} TEMP={params.TEMP} RETRACT=0 PREV_RETRACT=0 LAYER=0
    {% endif %}

[gcode_macro _PRIME_GRID_TOOL]
description: Inner - one tool's slot of PRIME_GRID; skipped once a check has failed
gcode:
    {% set g = printer["gcode_macro PRIME_GRID"] %}
    {% if g.failed|int == 0 %}
        {% if g.held|int %}
            # A RESUME is redoing the prime (held stays 1 until it got
            # through): an error from here leaves the hold at this tool
            SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=held_tool VALUE={params.TOOL|int}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=cur_temp VALUE={params.TEMP|float}
        # Its slot (the tool's own: its re-prime lines sit at +42 and +54)
        _PURGE_LANE_TAKE OWN={params.TOOL|int}
        _PRIME_GRID_TOOL_RUN {rawparams}
    {% endif %}

[gcode_macro _PRIME_GRID_TOOL_RUN]
description: Inner - _PRIME_GRID_TOOL once its slot is taken
gcode:
    {% set pl = printer["gcode_macro _PURGE_LANE"] %}
    {% set t = params.TOOL|int %}
    {% set mode = "zero" if t == params.FIRST|int else "check" %}
    {% if not pl.got|int %}
        _PRIME_GRID_HOLD TOOL={t} WHY=slots
    {% else %}
        {% set sl = printer["gcode_macro _PRIME_SETTINGS"].slots[pl.cur|int] %}
        # Through _PRIME_GRID_STEP: after a hold these must not run, they
        # would switch off the hold heat [EL-PRI-021]
        _PRIME_GRID_STEP CMD="M104 S0"
        _PRIME_GRID_STEP CMD="_INDX_CHANGE_TOOL TOOL={t}"
        _PRIME_GRID_STEP CMD="M104 S0"
        _PRIME_GRID_STEP CMD="_PRIME_UNFREEZE TEMP={params.TEMP} X={sl[0]} Y={sl[1]}"
        _PRIME_GRID_STEP CMD="PRIME_CLEAN TEMP={params.TEMP} X={sl[0]} Y={sl[1]} COAST={params.COAST} LANE=1"
        _PRIME_GRID_STEP CMD="TOOL_Z_MEASURE MODE={mode} RECLEAN={params.RECLEAN} LIMIT={params.LIMIT}"
        _PRIME_GRID_RECLEAN TEMP={params.TEMP} COAST={params.COAST} MODE={mode} RECLEAN={params.RECLEAN} LIMIT={params.LIMIT}
        {% if mode == "zero" %}
            # In the tool's own slot, wherever PRIME_CLEAN ended up priming
            _PRIME_GRID_STEP CMD="_PRIME_GRID_REZERO_LINE TOOL={t} TEMP={params.TEMP}"
        {% endif %}
        _PRIME_GRID_DONE TOOL={t}
    {% endif %}

[gcode_macro _PRIME_GRID_REZERO_LINE]
description: Inner - FIRST's re-prime after the Z re-zero, at +42 in its own slot: refills what its PRIME_CLEAN retracted for the cooldown (t<n>_retracted), so the print starts with it full. Saves: tN_retracted
gcode:
    {% set t = params.TOOL|int %}
    {% set sl = printer["gcode_macro _PURGE_LANE"].own[t] %}
    {% set refill = printer.save_variables.variables["t%d_retracted" % t]|default(0)|float %}
    PRIME_LINE TEMP={params.TEMP} X={sl[0] + 42} Y={sl[1]}{(" REFILL=%.2f" % refill) if refill > 0 else ""}
    {% if refill > 0 %}
        SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE=0
    {% endif %}

[gcode_macro _PRIME_GRID_DONE]
description: Inner - note that a tool finished its prime and check (a resumed PRIME_GRID skips it)
gcode:
    {% set g = printer["gcode_macro PRIME_GRID"] %}
    {% if g.failed|int == 0 %}
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=done VALUE="{g.done + [params.TOOL|int]}"
        {% if "gcode_macro _INDX_PROGRESS" in printer %}
            _INDX_PROGRESS ITEM=1 PART="T{params.TOOL}"
        {% endif %}
    {% endif %}

[gcode_macro _PRIME_GRID_HOLD]
description: Inner - a print start prime stopped: raise the head, pause, hold the tool warm until RESUME (which restarts the prime from this tool)
gcode:
    {% set t = params.TOOL|int %}
    {% set g = printer["gcode_macro PRIME_GRID"] %}
    {% set st = printer["gcode_macro _PRIME_SETTINGS"] %}
    {% set temp = g.cur_temp|float %}
    {% set why = params.WHY|string %}
    # A tool that did not seat is in its dock: the head has nothing to keep warm
    # Never under min_extrude_temp + 5: Mainsail and Fluidd RESUME stop at a
    # nozzle that cannot extrude. INDX_RESUME gets past a cold nozzle.
    {% set ext = printer.configfile.settings[printer.toolhead.extruder or "extruder"] %}
    {% set floor = ext.min_extrude_temp|default(170)|float + 5 %}
    {% set hold = 0 if why == "seat" else ([[st.hold_frac|float * temp, floor]|max, temp]|min)|round(0)|int %}
    {% set dev = params.DEV|default(0)|float %}
    {% set where = "higher" if dev > 0 else "lower" %}
    {% if why == "seat" %}
        {% set msg = "T%d did not seat (load cell %s g against the empty head). The pickup may have pulled T%d partly out of its dock: check the T%d dock and the head, leave T%d in its dock" % (t, params.FORCE|default("?"), t, t, t) %}
    {% elif why == "bed" %}
        {% set msg = "Something %.1f mm tall is on the bed at X%.1f Y%.1f: T%d's tap there touched it, while its other tap read normal. Remove it" % (dev, params.X|default(0)|float, params.Y|default(0)|float, t) %}
    {% elif why == "residue" %}
        {% set msg = "T%d has plastic stuck to its nozzle: its height tap touched %.2f mm above the bed. Clean the nozzle" % (t, dev) %}
    {% elif why == "flow" %}
        {% set msg = "T%d is not extruding: no extrusion force even after feeding %s mm more. Check that filament is loaded into T%d and that the nozzle is not clogged" % (t, params.FED|default(0), t) %}
    {% elif why == "dirty" %}
        {% set msg = "T%d still touches the bed %.2f mm %s than its saved Z offset after an extra clean, and its taps do not agree: plastic is probably stuck to the nozzle. Clean it (if it is clean: were tools moved between docks? Then cancel and run CAL_Z)" % (t, dev|abs, where) %}
    {% elif why == "offset" %}
        {% set msg = "T%d consistently touches the bed %.2f mm %s than its saved Z offset. Inspect the nozzle for plastic or damage; if tools were moved between docks, cancel and run CAL_Z first" % (t, dev|abs, where) %}
    {% else %}
        {% set msg = "T%d needs another prime but the purge lane has no slots laid out. Cancel the print and start it again" % t %}
    {% endif %}
    _INDX_NOTE LEVEL=stop TITLE="Print start held at T{t}" MSG="{msg}. Then RESUME."
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=failed VALUE=1
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=held VALUE=1
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=held_tool VALUE={t}
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=held_why VALUE='"{why}"'
    {% if hold > 0 %}
        _INDX_LCD LEVEL=action MSG="Print start held: see console, RESUME"
        RESPOND TYPE=error MSG="{msg}, then RESUME: the prime starts over from T{t} in a free slot and the print continues. Holding T{t} at {hold} C ({(st.hold_frac|float * 100)|round(0)|int} % of {temp|round(0)|int} C) with the head raised."
    {% else %}
        _INDX_LCD LEVEL=action MSG="Print start held: see console, RESUME"
        RESPOND TYPE=error MSG="{msg}, then RESUME: the prime starts over from T{t} in a free slot and the print continues. Heater off, head raised."
    {% endif %}
    {% set lift = [20, printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float - 5]|min %}
    G91
    G1 Z{[lift, 0]|max} F900
    G90
    # Out of the purge lane too: a cancel or the next print's homing starts
    # its tool changes from wherever the head is left
    {% set ey = printer["gcode_macro _PRIME_SETTINGS"].exit_y|float %}
    {% if ey > printer.toolhead.position.y|float %}
        G1 Y{ey} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    {% endif %}
    # The base pause (no park, no heater off from a PAUSE macro), then the hold
    {% set pm = printer.configfile.settings["gcode_macro pause"] %}
    {pm.rename_existing if pm is defined and pm.rename_existing is defined else "PAUSE"}
    _INDX_PAUSE_STATES
    {% if "indx_api" in printer %}_INDX_EVENT EVENT=stop CHECK=prime_{why} PAUSE=1 REASON="{msg|replace(';', ',')}"{% endif %}
    M104 S{hold}
    # Keep the motors on (a lost home would end the print) and stop the hold
    # heat after hold_minutes
    SET_IDLE_TIMEOUT TIMEOUT=43200
    UPDATE_DELAYED_GCODE ID=_prime_hold_off DURATION={(st.hold_minutes|float * 60)|int}

[delayed_gcode _prime_hold_off]
gcode:
    {% if printer["gcode_macro PRIME_GRID"].held|int %}
        M104 S0
        _INDX_LCD LEVEL=action MSG="Held, heater off: RESUME"
        RESPOND TYPE=error MSG="PRIME_GRID: no RESUME for {printer['gcode_macro _PRIME_SETTINGS'].hold_minutes} min, nozzle heater off. RESUME still restarts the prime."
    {% endif %}

[gcode_macro _INDX_RESUME_HOOK]
description: Inner - the one call RESUME needs: runs _PICKUP_RESUME, _PRIME_GRID_RESUME or a purge station's resume (station_resume) when INDX holds a print, nothing otherwise. Mainsail and Fluidd RESUME call it through _CLIENT_VARIABLE (variable_user_resume_macro: "_INDX_RESUME_HOOK")
# Without it RESUME goes on with the print file, cold and unprimed. Each
# resume here resumes the print itself (RESUME_BASE then does nothing); a
# redo that stops again raises, so RESUME_BASE never un-pauses it.
# [EL-PRI-021]
# station_resume: the command a purge station's hold leaves for RESUME (the
# prime bucket: _BUCKET_RESUME). The station sets it at its hold and clears
# it once its resume got through; while it is set no other resume here
# un-pauses the print. [EL-PRI-042]
variable_station_resume: ""
gcode:
    {% set pf = printer["gcode_macro _PICKUP_SEAT_FAIL"] if "gcode_macro _PICKUP_SEAT_FAIL" in printer else {} %}
    {% set sr = printer["gcode_macro _INDX_RESUME_HOOK"].station_resume|default("")|string %}
    {% if "indx_remap" in printer and printer.indx_remap.pending %}
        # the print start waits for the tool mapping dialog [EL-PRI-047]
        {action_raise_error("INDX: this print waits for the tool mapping dialog (nothing is heated or homed yet). Answer it: _INDX_REMAP_GO CHOICE=map (the proposal) or CHOICE=numbered, or CANCEL_PRINT.")}
    {% elif pf.held|default(0)|int or pf.resuming|default(0)|int %}
        _PICKUP_RESUME
        _INDX_RESUME_HOOK_END
    {% elif printer["gcode_macro PRIME_GRID"].held|int or printer["gcode_macro PRIME_GRID"].resuming|int %}
        _PRIME_GRID_RESUME
        _INDX_RESUME_HOOK_END
    {% elif sr %}
        {sr}
        _INDX_RESUME_HOOK_END
    {% elif printer.print_stats.state == "paused" %}
        # Nothing INDX held: no INDX check to redo, the print resumes as it paused
        {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=resume{% endif %}
    {% endif %}

[gcode_macro _INDX_RESUME_HOOK_END]
description: Inner - the redone prime or tool change stopped again: raise, so the RESUME that called the hook does not un-pause the print
gcode:
    {% if printer["gcode_macro PRIME_GRID"].held|int or ("gcode_macro _PICKUP_SEAT_FAIL" in printer and printer["gcode_macro _PICKUP_SEAT_FAIL"].held|int) or printer["gcode_macro _INDX_RESUME_HOOK"].station_resume|default("")|string %}
        {action_raise_error("INDX held the print again (see above): it stays paused. Fix that, then RESUME.")}
    {% endif %}

[gcode_macro INDX_RESUME]
description: Resume a print INDX holds (print start prime, a failed tool change or a purge station visit) whatever RESUME does: Mainsail and Fluidd RESUME stop at a cold nozzle before INDX can heat it. Any other pause: plain RESUME. Moves: the held prime or tool change
gcode:
    {% set g = printer["gcode_macro PRIME_GRID"] %}
    {% set pf = printer["gcode_macro _PICKUP_SEAT_FAIL"] if "gcode_macro _PICKUP_SEAT_FAIL" in printer else {} %}
    {% set held = g.held|int or g.resuming|int or pf.held|default(0)|int or pf.resuming|default(0)|int or printer["gcode_macro _INDX_RESUME_HOOK"].station_resume|default("")|string %}
    {% if held %}
        _INDX_RESUME_HOOK
    {% else %}
        RESUME
    {% endif %}

[gcode_macro _INDX_RESUME_CHECK]
description: Inner - warn when RESUME does not run _INDX_RESUME_HOOK (a held print would go on cold and unprimed)
gcode:
    {% set cs = printer.configfile.settings %}
    {% set rs = cs["gcode_macro resume"].gcode|default("")|string if "gcode_macro resume" in cs else "" %}
    {% set cv = cs["gcode_macro _client_variable"].variable_user_resume_macro|default("")|string if "gcode_macro _client_variable" in cs else "" %}
    {% set wired = "_INDX_RESUME_HOOK" in rs or "_PRIME_GRID_RESUME" in rs or ("user_resume_macro" in rs and "_INDX_RESUME_HOOK" in cv) %}
    {% if not wired %}
        RESPOND TYPE=error MSG="INDX ! RESUME does not run _INDX_RESUME_HOOK: after a held print start or tool change the print would go on cold and unprimed. Mainsail, Fluidd: add a _CLIENT_VARIABLE macro with variable_user_resume_macro set to _INDX_RESUME_HOOK (see the INDX example config). Your own RESUME: start it with _INDX_RESUME_HOOK. Until then resume a held print with INDX_RESUME."
    {% endif %}
    {% set cg = cs["gcode_macro cancel_print"].gcode|default("")|string if "gcode_macro cancel_print" in cs else "" %}
    {% set ccv = cs["gcode_macro _client_variable"].variable_user_cancel_macro|default("")|string if "gcode_macro _client_variable" in cs else "" %}
    {% set cancel_wired = "_INDX_CANCEL_HOOK" in cg or ("user_cancel_macro" in cg and "_INDX_CANCEL_HOOK" in ccv) %}
    {% if not cancel_wired %}
        RESPOND TYPE=error MSG="INDX ! CANCEL_PRINT does not run _INDX_CANCEL_HOOK: cancelling while the head is behind the dock clearance line or in a station zone would not move it out first. Mainsail, Fluidd: add a _CLIENT_VARIABLE macro with variable_user_cancel_macro set to _INDX_CANCEL_HOOK (see the INDX example config). Your own CANCEL_PRINT: add _INDX_CANCEL_HOOK at the start, before the base cancel."
    {% endif %}

[gcode_macro _INDX_PAUSE_STATES]
description: Inner - INDX holds a print with the base PAUSE (the printer's own PAUSE macro does not run, so nothing it saves exists): save every G-code state that PAUSE macro saves (each SAVE_GCODE_STATE NAME= in its gcode, for example PAUSEPARK) here and now, so the printer's own RESUME finds it. At the hold, and again where INDX resumes the print (the spot the print goes on from)
# Without them the printer's own RESUME fails on an unknown state. Not
# PAUSE_STATE (the base PAUSE's own), not templated names. [EL-PRI-022]
gcode:
    {% set cs = printer.configfile.settings %}
    {% set pg = (cs["gcode_macro pause"].gcode|default("")|string) if "gcode_macro pause" in cs else "" %}
    {% set names = [] %}
    {% for part in pg.replace("save_gcode_state", "SAVE_GCODE_STATE").split("SAVE_GCODE_STATE")[1:] %}
        {% set p = part.lstrip() %}
        {% if p[:5]|upper == "NAME=" and p[5:].split()|length > 0 %}
            {% set n = p[5:].split()[0] %}
            {% if "{" not in n and "%" not in n and n|upper != "PAUSE_STATE" and n not in names %}
                {% set _ = names.append(n) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% for n in names %}
        SAVE_GCODE_STATE NAME={n}
    {% endfor %}

[gcode_macro _INDX_PAUSE_PARK]
description: Park the head for a pause without crossing the docks or a station: straight out to the dock clearance line first when behind it (the pause position is saved again there, so RESUME comes back to the line and never cuts into the dock zone), Z up, then only on the bed side to the park point (Y first, then X). Call it in your PAUSE macro after the base PAUSE, in place of its park move. X= Y= a park point for this call (G-code), Z_HOP= the lift. Moves: Y to the clearance line, Z, Y, X
# The dock zone is the Y side behind TOOL_POSITIONS clearance_y (docks and
# the stations on the dock rail): a park there is crossed twice and RESUME
# primes there [EL-PRI-023]. INDX's PAUSE wrapper (indx_api.py,
# _INDX_SAFE_PAUSE) uses this park when a PAUSE macro parks in or next to
# the zone, or the head is behind the clearance line.
# park_x     -1: the middle of the X axis; else a G-code X
# park_y     -1: the bed edge away from the docks, 5 mm in (the back with
#            the docks at the front); else a G-code Y on the bed side, at
#            least min_clear from the clearance line (else the default, and
#            the console says why)
# z_hop      mm up from the pause height (to the Z limit)
# min_clear  how far from the clearance line, on the bed side, a park point
#            has to be (mm): a RESUME primes at the park, never next to a
#            station or a dock
# guard      True: INDX's PAUSE wrapper takes over a PAUSE macro that parks
#            in or next to the dock zone, and every PAUSE with the head
#            behind the clearance line. False: your PAUSE macro always runs
#            as it is
variable_park_x: -1.0
variable_park_y: -1.0
variable_z_hop: 10.0
variable_min_clear: 30.0
variable_guard: True
gcode:
    {% if printer["gcode_macro TOOL_POSITIONS"].clearance_y is not number %}
        # clearance_y "auto": resolve it first (renders before the park below)
        _INDX_BUILD_TOOLS
    {% endif %}
    _INDX_PAUSE_PARK_GO {rawparams}

[gcode_macro _INDX_PAUSE_PARK_GO]
description: Inner - the moves of _INDX_PAUSE_PARK
gcode:
    {% set pp = printer["gcode_macro _INDX_PAUSE_PARK"] %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set o = printer.gcode_move.homing_origin %}
    {% if "xyz" not in th.homed_axes or tp.clearance_y is not number %}
        RESPOND TYPE=error MSG="INDX ! Pause park skipped: {'X, Y and Z are not homed' if 'xyz' not in th.homed_axes else 'the dock clearance line is not known'}. The head stays where it is."
    {% else %}
        {% set dd = -1.0 if tp.dock_dir|float < 0 else 1.0 %}
        {% set clear = tp.clearance_y|float %}
        {% set behind = (th.position.y|float - clear) * dd > 0.001 %}
        # the default: the bed edge away from the docks, 5 mm in (machine Y)
        {% set ydef = (th.axis_maximum.y|float - 5.0) if dd < 0 else (th.axis_minimum.y|float + 5.0) %}
        {% set ns = namespace(y=ydef, why="") %}
        {% set yw = params.Y|default(pp.park_y)|float %}
        {% if params.Y is defined or yw != -1 %}
            {% set ym = yw + o.y|float %}
            {% if ym < th.axis_minimum.y|float or ym > th.axis_maximum.y|float %}
                {% set ns.why = "park Y%.1f is outside the Y axis" % yw %}
            {% elif (clear - ym) * dd < pp.min_clear|float %}
                {% set ns.why = "park Y%.1f is in the dock zone or within %.0f mm of it (clearance line Y%.1f)" % (yw, pp.min_clear|float, clear - o.y|float) %}
            {% else %}
                {% set ns.y = ym %}
            {% endif %}
        {% endif %}
        {% set xw = params.X|default(pp.park_x)|float %}
        {% set xm = ((th.axis_minimum.x|float + th.axis_maximum.x|float) / 2.0) if (params.X is not defined and xw == -1) else xw + o.x|float %}
        {% set xm = [[xm, th.axis_minimum.x|float]|max, th.axis_maximum.x|float]|min %}
        {% set zt = [printer.gcode_move.gcode_position.z|float + params.Z_HOP|default(pp.z_hop)|float, th.axis_maximum.z|float - o.z|float]|min %}
        {% if ns.why %}
            RESPOND TYPE=error MSG="INDX ! Pause park: {ns.why}. Parked at the default Y{'%.1f'|format(ydef - o.y|float)} instead (_INDX_PAUSE_PARK park_y)."
        {% endif %}
        {% if behind %}
            # Straight out to the line at the pause height, as every INDX
            # travel from behind it (a station's guard first: inside a station
            # off its lane it stops instead). The pause position is saved
            # again there: RESUME returns to the line, never into the zone
            _INDX_TO_LANE
            {% if printer.pause_resume.is_paused %}
                SAVE_GCODE_STATE NAME=PAUSE_STATE
                _INDX_PAUSE_STATES
            {% endif %}
        {% endif %}
        SAVE_GCODE_STATE NAME=_indx_pause_park
        G90
        _TC_G0 Z={"%.3f"|format(zt)}
        # Y first: away from the docks onto the bed side, then X along it
        _TC_G0 Y={"%.3f"|format(ns.y - o.y|float)}
        _TC_G0 X={"%.3f"|format(xm - o.x|float)}
        RESTORE_GCODE_STATE NAME=_indx_pause_park
        RESPOND MSG="INDX: paused, the head parked on the bed side at X{'%.1f'|format(xm - o.x|float)} Y{'%.1f'|format(ns.y - o.y|float)}, clear of the docks and stations"
    {% endif %}

[gcode_macro _INDX_PAUSE_GUARD_MACROS]
description: Inner - INDX Macros (no indx_api, whose PAUSE wrapper parks clear of the docks itself): at a print start, before anything heats, where the printer's own PAUSE macro parks (_INDX_PAUSE_PARK_STATE). Mainsail's or Fluidd's park in or within min_clear of the dock zone: the print start stops with the fix. A PAUSE macro not confirmed in the setup (its pause step): one warning line, the print goes on. The INDX Suite: nothing
# The INDX Suite renders the PAUSE macro and takes over an unsafe one at
# every PAUSE (indx_api.py, _INDX_SAFE_PAUSE). A macro cannot render another
# macro, so on an INDX Macros install a park INDX cannot read is asked once
# in the setup (the pause step after the first home), never at the print
# start [EL-PRI-036] [EL-SET-043]
gcode:
    {% if "indx_api" not in printer %}
        _INDX_PAUSE_PARK_STATE
        _INDX_PAUSE_GUARD_ACT
    {% endif %}

[gcode_macro _INDX_PAUSE_GUARD_ACT]
description: Inner - _INDX_PAUSE_GUARD_MACROS after the check (renders then): stop on a Mainsail or Fluidd park INDX can show to be in or next to the dock zone, one warning line for a PAUSE macro not confirmed
gcode:
    {% set ps = printer["gcode_macro _INDX_PAUSE_PARK_STATE"] %}
    {% if ps.state == "unsafe" %}
        {action_raise_error("INDX: print start stopped before anything heated. " ~ ps.why ~ " The setup's pause step (INDX_SETUP STEP=pause) checks it again.")}
    {% elif ps.state == "ask" %}
        RESPOND TYPE=error MSG="INDX ! Where your PAUSE macro parks is not confirmed: a pause that parks in or next to the dock zone can meet the docks or a station, and the RESUME primes there. INDX_SETUP STEP=pause asks once (again after the PAUSE macro changed)."
    {% endif %}

[gcode_macro _INDX_PAUSE_PARK_STATE]
description: Inner - INDX Macros: where the printer's own PAUSE macro parks, kept in state: ok (no PAUSE macro, one that parks with _INDX_PAUSE_PARK, a Mainsail or Fluidd park on the bed side, a macro confirmed in the setup, or the check turned off), unsafe (a Mainsail or Fluidd park in or next to the dock zone: why says the fix), later (a Mainsail or Fluidd park before the docks are measured), ask (a macro INDX cannot read, not confirmed at its current length). The INDX Suite: nothing (indx_api checks it)
# len: the PAUSE macro's length, the confirmation (pause_park_ok) is kept
# for; a changed macro asks again
variable_state: ""
variable_why: ""
variable_len: -1
gcode:
    {% if "indx_api" not in printer %}
        {% set pp = printer["gcode_macro _INDX_PAUSE_PARK"] %}
        {% set cs = printer.configfile.settings %}
        {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
        {% set svv = printer.save_variables.variables %}
        {% set code = cs["gcode_macro pause"].gcode|default("")|string if "gcode_macro pause" in cs else "" %}
        {% set docks = (svv.indx_cal|default({})).docks_done|default(0)|int and tp.clearance_y is number %}
        {% set ns = namespace(state="ok", why="") %}
        {% if not pp.guard|default(True) or "gcode_macro pause" not in cs or "_INDX_PAUSE_PARK" in code|upper %}
            # no PAUSE macro (the base PAUSE does not move), or it parks
            # through INDX's own park: clear of the dock zone
        {% elif "_TOOLHEAD_PARK_PAUSE_CANCEL" in code|upper %}
            # Mainsail's and Fluidd's PAUSE: their park in G-code Y, the
            # custom one from _CLIENT_VARIABLE, else 5 mm in from the Y maximum
            {% if not docks %}
                {% set ns.state = "later" %}
            {% else %}
                {% set th = printer.toolhead %}
                {% set o = printer.gcode_move.homing_origin %}
                {% set dd = -1.0 if tp.dock_dir|float < 0 else 1.0 %}
                {% set clear = tp.clearance_y|float %}
                {% set ydef = (th.axis_maximum.y|float - 5.0) if dd < 0 else (th.axis_minimum.y|float + 5.0) %}
                {% set cl = printer["gcode_macro _CLIENT_VARIABLE"] if "gcode_macro _CLIENT_VARIABLE" in printer else {} %}
                {% set custom = cl.use_custom_pos|default(false)|string|lower == "true" %}
                {% set yg = cl.custom_park_y|default(0.0)|float if custom else th.axis_maximum.y|float - 5.0 %}
                {% set d = (clear - (yg + o.y|float)) * dd %}
                {% if d < pp.min_clear|float %}
                    {% set ns.state = "unsafe" %}
                    {% set ns.why = "Your PAUSE (Mainsail or Fluidd) parks at Y%.1f, %s the dock clearance line Y%.1f: a pause there can meet the docks or a station, and its RESUME primes there. Set variable_use_custom_pos: True and variable_custom_park_y: %.1f in your _CLIENT_VARIABLE (a Y on the bed side, %.0f mm or more from the docks), then restart Klipper." % (yg, ("behind" if d < 0.001 else "%.0f mm from" % d), clear - o.y|float, ydef - o.y|float, pp.min_clear|float) %}
                {% endif %}
            {% endif %}
        {% elif svv.pause_park_ok|default(-1)|int != code|length %}
            {% set ns.state = "ask" %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_INDX_PAUSE_PARK_STATE VARIABLE=state VALUE='"{ns.state}"'
        SET_GCODE_VARIABLE MACRO=_INDX_PAUSE_PARK_STATE VARIABLE=why VALUE='{ns.why|tojson}'
        SET_GCODE_VARIABLE MACRO=_INDX_PAUSE_PARK_STATE VARIABLE=len VALUE={code|length}
    {% endif %}

[gcode_macro _INDX_PAUSE_PARK_ASK]
description: Inner - the setup's pause step (INDX Macros): where the printer's own PAUSE macro parks. A macro INDX cannot read: asks once whether it parks on the bed side; a Mainsail or Fluidd park next to the docks: the fix; fine: on to the next step
gcode:
    _INDX_BUILD_TOOLS
    _INDX_PAUSE_PARK_STATE
    _INDX_PAUSE_PARK_ASK_RUN

[gcode_macro _INDX_PAUSE_PARK_ASK_RUN]
description: Inner - _INDX_PAUSE_PARK_ASK after the check (renders then)
gcode:
    {% set ps = printer["gcode_macro _INDX_PAUSE_PARK_STATE"] %}
    {% set pp = printer["gcode_macro _INDX_PAUSE_PARK"] %}
    {% if ps.state == "ask" %}
        _INDX_PROMPT TITLE="Where Does Your PAUSE Park?" TEXT="INDX Macros cannot read where your own PAUSE macro moves the head. A park in the dock zone, or less than {pp.min_clear|float|round(0)|int} mm from the dock clearance line (the line in front of the docks), can meet the docks or a station, and the RESUME primes there." TEXT2="Check your PAUSE macro: it should park on the bed side, at least {pp.min_clear|float|round(0)|int} mm from that line, or call _INDX_PAUSE_PARK in place of its park move. INDX asks again only when the macro changes." B1="It parks on the bed side|_INDX_PAUSE_PARK_OK LEN={ps.len|int}|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% elif ps.state == "unsafe" %}
        _INDX_PROMPT TITLE="PAUSE Parks by the Docks" TEXT="{ps.why}" TEXT2="The print start stops until it is fixed." B1="Check again|_INDX_PAUSE_PARK_ASK|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT_END
        RESPOND MSG="INDX ok PAUSE: {'its park is checked once the docks are measured' if ps.state == 'later' else 'parks clear of the docks'}"
        _INDX_GUIDE_LATER
    {% endif %}

[gcode_macro _INDX_PAUSE_PARK_OK]
description: Inner - INDX Macros: the PAUSE macro (LEN= its length) parks on the bed side, as the person checked; not asked again until it changes. Saves: pause_park_ok
gcode:
    _INDX_PROMPT_END
    SAVE_VARIABLE VARIABLE=pause_park_ok VALUE={params.LEN|default(-1)|int}
    SET_GCODE_VARIABLE MACRO=_INDX_PAUSE_PARK_STATE VARIABLE=state VALUE='"ok"'
    RESPOND MSG="INDX ok Noted: your PAUSE macro parks on the bed side. INDX asks again only when it changes."
    _INDX_GUIDE_LATER

[delayed_gcode _indx_pause_step_init]
initial_duration: 0.8
gcode:
    _INDX_PAUSE_STEP_INIT

[gcode_macro _INDX_PAUSE_STEP_INIT]
description: Inner - INDX Macros, after a restart: the setup's pause step (where PAUSE parks) right after the first home, in the setup steps (_INDX_STEPS after trigger, _INDX_STEP_GROUPS after home). The INDX Suite: nothing (indx_api checks the PAUSE macro itself)
gcode:
    {% set steps = printer["gcode_macro _INDX_STEPS"].steps %}
    {% if "indx_api" not in printer and "pause" not in steps|map(attribute="key")|list %}
        {% set groups = printer["gcode_macro _INDX_STEP_GROUPS"].groups %}
        {% set ns = namespace(steps=[], groups=[]) %}
        {% for s in steps %}
            {% set ns.steps = ns.steps + [s] %}
            {% if s.key == "trigger" %}
                {% set ns.steps = ns.steps + [{"key": "pause", "label": "Where PAUSE parks", "cmd": "_INDX_PAUSE_PARK_ASK", "needs": "Nothing", "moves": "Nothing", "time": "1 min"}] %}
            {% endif %}
        {% endfor %}
        {% for g in groups %}
            {% set ns.groups = ns.groups + [g] %}
            {% if g.key == "home" %}
                {% set ns.groups = ns.groups + [{"key": "pause", "label": "Confirm where your PAUSE macro parks", "hand": "You answer once whether your PAUSE macro parks on the bed side (asked again only when it changes)", "routines": ["pause"], "min": {"fixed": [1, 2], "at": [1, 2], "at_why": "one answer", "est": 1}}] %}
            {% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_INDX_STEPS VARIABLE=steps VALUE='{ns.steps|tojson}'
        SET_GCODE_VARIABLE MACRO=_INDX_STEP_GROUPS VARIABLE=groups VALUE='{ns.groups|tojson}'
    {% endif %}

[gcode_macro _PRIME_GRID_RESUME]
description: Call first in RESUME when PRIME_GRID's held is set: restart the prime from the held tool, then resume the print
gcode:
    _INDX_LCD_CLEAR
    {% set g = printer["gcode_macro PRIME_GRID"] %}
    # held stays 1 through the redo, so an error in it leaves the print held
    # and the next RESUME redoes it; _PRIME_GRID_RESUME_END clears it
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=resuming VALUE=0
    UPDATE_DELAYED_GCODE ID=_prime_hold_off DURATION=0
    # Back to the configured idle timeout (600 s without an [idle_timeout]
    # section) [EL-PRI-024]
    SET_IDLE_TIMEOUT TIMEOUT={(printer.configfile.settings.idle_timeout|default({})).timeout|default(600)}
    RESPOND MSG="PRIME_GRID: starting over from T{g.held_tool}"
    _PRIME_GRID_RUN {g.args} RESUME=1
    _PRIME_GRID_RESUME_END

[gcode_macro _PRIME_GRID_RESUME_END]
description: Inner - the resumed prime finished: resume the print, unless it stopped again (a new hold: failed is set, held stays 1)
gcode:
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=resuming VALUE=0
    # nor while a pickup holds (the print start's first tool through a purge
    # station, _PRIME_GRID_BUCKET_FIRST): its own RESUME redoes it
    {% set sr = printer["gcode_macro _INDX_RESUME_HOOK"].station_resume|default("")|string %}
    {% set psf_held = printer["gcode_macro _PICKUP_SEAT_FAIL"].held|default(0)|int if "gcode_macro _PICKUP_SEAT_FAIL" in printer else 0 %}
    {% if not printer["gcode_macro PRIME_GRID"].failed|int and not psf_held and sr %}
        # the prime got through, but the first tool's purge station visit
        # held the print: its own RESUME (station_resume) goes on from there
        # [EL-PRI-042]
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=held VALUE=0
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=held_tool VALUE=-1
    {% elif not printer["gcode_macro PRIME_GRID"].failed|int and not psf_held %}
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=held VALUE=0
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=held_tool VALUE=-1
        # The print continues from here, not from where the pause saved it
        SAVE_GCODE_STATE NAME=PAUSE_STATE
        _INDX_PAUSE_STATES
        {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=resume{% endif %}
        {% set rm = printer.configfile.settings["gcode_macro resume"] %}
        {rm.rename_existing if rm is defined and rm.rename_existing is defined else "RESUME"}
    {% endif %}

[gcode_macro _PRIME_GRID_RECLEAN]
description: Inner - the last tap looked dirty: clean the tool once more in the next free slot and tap again
gcode:
    {% set g = printer["gcode_macro PRIME_GRID"] %}
    {% if g.failed|int == 0 and g.pending|int %}
        # A spare slot: the tool's re-prime lines stay in its own slot
        _PURGE_LANE_TAKE OWN=-1
        _PRIME_GRID_RECLEAN_RUN {rawparams}
    {% endif %}

[gcode_macro _PRIME_GRID_RECLEAN_RUN]
description: Inner - _PRIME_GRID_RECLEAN once its slot is taken
gcode:
    {% set g = printer["gcode_macro PRIME_GRID"] %}
    {% set pl = printer["gcode_macro _PURGE_LANE"] %}
    {% if not pl.got|int %}
        # No slot: a hold, not a template error [EL-PRI-025]
        _PRIME_GRID_HOLD TOOL={printer.save_variables.variables.active_tool|default(-1)|int} WHY=slots
    {% else %}
        {% set sl = printer["gcode_macro _PRIME_SETTINGS"].slots[pl.cur|int] %}
        # Through _PRIME_GRID_STEP: a clean that held must not be followed
        # by a tap with the dirty or dry tool [EL-PRI-026]
        _PRIME_GRID_STEP CMD="_PRIME_UNFREEZE TEMP={params.TEMP} X={sl[0]} Y={sl[1]}"
        _PRIME_GRID_STEP CMD="PRIME_CLEAN TEMP={params.TEMP} X={sl[0]} Y={sl[1]} COAST={params.COAST} LANE=1"
        _PRIME_GRID_STEP CMD="TOOL_Z_MEASURE MODE={params.MODE} RECLEAN={params.RECLEAN} LIMIT={params.LIMIT} PREV={g.pending_dev}"
    {% endif %}

[gcode_macro _PRIME_GRID_STEP]
description: Inner - run CMD unless a check has failed
gcode:
    {% if printer["gcode_macro PRIME_GRID"].failed|int == 0 %}
        {params.CMD}
    {% endif %}

[gcode_macro PRINT_TOOLCHANGE]
description: Slicer tool change: outgoing heater off, change, heat, and on the first layer re-prime in the tool's PRIME_GRID row
# PRINT_TOOLCHANGE NEXT=<tool> TEMP=<temp> [RETRACT=<mm>] [PREV_RETRACT=<mm>] [LAYER=<n>]
# RETRACT: the next tool's tool change retraction (what the slicer deretracts
# it by when it returns); PREV_RETRACT: the outgoing tool's, what the slicer
# just retracted it by (default RETRACT). Per tool, so filament overrides work.
#                  [PURGE=<mm3>] [MAXVOL=<mm3/s>] [FLEX=0|1]
# PURGE / MAXVOL / FLEX: the next filament's purge volume, max volumetric
# speed and whether it is flexible, passed on to the prime bucket (PrusaSlicer:
# filament_minimal_purge_on_wipe_tower, filament_max_volumetric_speed,
# filament_type == FLEX). The INDX profile passes MAXVOL and FLEX, so the
# purge runs at Prusa's speeds for that filament; without MAXVOL the station
# uses its own default. [EL-PRI-045]
# The head is left z_hop (TOOL_POSITIONS) above the change's start height,
# so the slicer's travel back starts high.
# LAYER: the slicer's layer number, 0 = first layer (PrusaSlicer
# LAYER=[layer_num]); without it: nozzle below 2 mm.
# DERETRACT: what the slicer deretracts the incoming tool by at its first
# print move, when the tool change G-code sets it itself (PrusaSlicer:
# {e_retracted[next_extruder] = ...} with the wipe tower off, as Prusa's
# own INDX profile). INDX then hands the tool back retracted by exactly
# that, whether the slicer retracted it before or not. Without it: RETRACT
# when the slicer retracted the tool at its last change, else 0.
# [EL-PRI-045]
# The slicer retracts the outgoing tool before this and deretracts a
# returning tool by RETRACT after it; a tool it still counts as retracted is
# retracted again after a PRIME_LINE to keep its bookkeeping right.
# Re-prime only at a tool's first pickup on the first layer: lower down next
# to a tall part is not safe; later changes use the wipe tower.
# Front lane: below clear_z the change runs at clear_z and moves back past
# the lane (exit_y) before dropping, clear of its blobs. [EL-PRI-038]
# Purge station ([indx_station] purge: True, for example the prime bucket):
# above the first layer (on it too with first_layer: True) a ready station
# takes the purge, called with TEMP= RETRACT= PURGE= MAXVOL= FLEX=; it
# records its retraction in t<n>_retracted, settled against what the slicer
# expects where control returns (_PRINT_TOOLCHANGE_PUSH). A station tool's
# first pickup gets the cold Z check on the XY sensor first.
# Return over the print (_TC_INFILL): above the first layer, without a front
# lane, the change ends over the incoming tool's first infill line, pushes
# back and wipes along it (_PRINT_TOOLCHANGE_INFILL). [EL-PRI-027]
# TOWER: 1 when the slicer's wipe tower is on, 0 off (PrusaSlicer
# {if wipe_tower}, OrcaSlicer {if enable_prime_tower}); missing: the print
# start's WIPE_TOWER= (tower), else unknown. [EL-PRI-044]
# Park retraction: the outgoing tool is retracted up to its park total
# (_TC_INFILL park_retract_mm, t<n>_park_retract_mm) on top of the slicer's
# PREV_RETRACT, on the park's Z hop (_INDX_PARK_RETRACT), recorded in
# t<n>_retracted. Not with a wipe tower (it rams and retracts the old tool)
# and not while the tower is unknown, except for a station change (a station
# purges with the tower off). [EL-PRI-044]
variable_retracted: []
variable_reprimed: []
# zchecked: tools that had their cold sensor Z check this print
variable_zchecked: []
# push_keep: what the slicer expects the last station tool to be left
# retracted by (a paused station visit settles it on RESUME)
variable_push_keep: 0.0
# tower: the print start's WIPE_TOWER= (1, 0; -1 not given)
variable_tower: -1
# park_pending: [tool, mm, base] for the park of this change (_INDX_PARK_RETRACT)
variable_park_pending: []
# Remap [EL-PRI-047]: NEXT is the slicer's tool, run through this print's map
# (printer.indx_remap.map) to a dock; the slicer's own retraction bookkeeping
# (retracted, WAS_RETRACTED) stays in slicer tools, slicer_cur is the slicer
# tool printing now. DOCK=1: NEXT is a dock already (a spool join, JOIN=1,
# which also skips a purge station and keeps the slicer's bookkeeping).
variable_slicer_cur: -1
gcode:
    {% set rmap = printer.indx_remap.map if "indx_remap" in printer else {} %}
    {% set dock_given = params.DOCK|default(0)|int == 1 %}
    {% set join = params.JOIN|default(0)|int == 1 %}
    {% set snxt = params.NEXT|int %}
    {% set nxt = snxt if dock_given or snxt not in rmap else rmap[snxt]|int %}
    # A tool without heating (no_heat_tools) is never heated or primed, and a
    # TEMP of 0 or less (a slicer placeholder that did not resolve) falls
    # back to the current target instead of printing cold. The target is
    # read here, before the outgoing heater goes off below. [EL-PRI-019]
    {% set no_heat = nxt in printer["gcode_macro TOOL_POSITIONS"].no_heat_tools|default([]) %}
    {% set temp = params.TEMP|default(0)|float %}
    {% if no_heat %}
        {% set temp = 0.0 %}
    {% elif temp <= 0 %}
        {% set temp = printer.extruder.target|float %}
    {% endif %}
    {% set rlen = params.RETRACT|default(5)|float %}
    {% set prev_rlen = params.PREV_RETRACT|default(rlen)|float %}
    {% set prev = printer.save_variables.variables.active_tool|default(-1)|int %}
    # the slicer's view: the slicer tool it changes from and to (with a map
    # the dock numbers differ, and two slicer tools may share a dock)
    {% set scur = printer["gcode_macro PRINT_TOOLCHANGE"].slicer_cur|int %}
    {% set sprev = (scur if scur >= 0 else prev) if rmap else prev %}
    {% set retracted = printer["gcode_macro PRINT_TOOLCHANGE"].retracted %}
    {% if not join and sprev >= 0 and sprev != snxt and sprev not in retracted %}
        {% set retracted = retracted + [sprev] %}
    {% endif %}
    {% set grid = printer["gcode_macro PRIME_GRID"].grid %}
    # First pickup of each tool only, on the first layer (LAYER=0, or without
    # LAYER the nozzle below Z2): its slot has room for one line (FIRST's for
    # one more).
    # Higher up, going down to the bed next to a part is not safe.
    {% set reprimed = printer["gcode_macro PRINT_TOOLCHANGE"].reprimed %}
    {% set first_layer = params.LAYER|int == 0 if params.LAYER is defined else printer.gcode_move.gcode_position.z|float < 2.0 %}
    # The tool primed in its own slot (_PURGE_LANE own) at this print start
    {% set reprime = grid and nxt in grid.tools and nxt in printer["gcode_macro _PURGE_LANE"].own and nxt not in reprimed and first_layer %}
    {% set sv = printer.save_variables.variables %}
    # Already on the head (PrusaSlicer also runs the tool change gcode for the
    # initial tool, LAYER=-1, right after PRINT_START has primed it): no
    # change and no purge, only the temperature
    {% set same = nxt == prev %}
    {% set reprime = reprime and not same and not no_heat %}
    # the registered purge station, when enabled and calibrated (_INDX_STATIONS, indx_ext.cfg)
    {% set stn = printer["gcode_macro _INDX_STATIONS"].purge if "gcode_macro _INDX_STATIONS" in printer else "" %}
    {% set sto = printer["indx_station " ~ stn] if stn and ("indx_station " ~ stn) in printer else none %}
    {% set seb = sto.enabled_by.split(".") if sto is not none and sto.enabled_by else [] %}
    {% set srw = sto.ready_when.split("=", 1) if sto is not none and sto.ready_when else [] %}
    {% set st_ready = sto is not none and (not seb or (("gcode_macro " ~ seb[0]) in printer and printer["gcode_macro " ~ seb[0]][seb[1]]|default(False))) and (not srw or (srw[0] in sv and (srw|length == 1 or sv[srw[0]]|string == srw[1]))) %}
    # A station with first_layer: True takes the first layer's changes too (instead of the first-layer re-prime)
    {% set bucket = not same and not no_heat and not join and st_ready and (not first_layer or sto.first_layer|default(False)) %}
    {% set reprime = reprime and not bucket %}
    # Outgoing tool: the park turns its heater off once the queued print
    # moves have finished (an M104 S0 here would run while they may still be
    # extruding) [EL-PRI-028]. A tool may park dirty: PRINT_START copes with
    # any tip condition, so no time is spent cleaning it here. The slicer has
    # just retracted it by PREV_RETRACT (default RETRACT): record that, so the
    # next prime refills it.
    {% if prev >= 0 and prev != nxt %}
        SAVE_VARIABLE VARIABLE=t{prev}_retracted VALUE={prev_rlen}
    {% endif %}
    # The wipe tower: TOWER=, else the print start's WIPE_TOWER=, else unknown (-1)
    {% set pt = printer["gcode_macro PRINT_TOOLCHANGE"] %}
    {% set tw = (params.TOWER|int if params.TOWER|string|trim in ["0", "1"] else -1) if params.TOWER is defined else pt.tower|default(-1)|int %}
    # The park retraction tops the slicer's retraction up to the tool's park
    # total (_TC_INFILL park_retract_mm, its own t<n>_park_retract_mm, the
    # live values of INDX_REFILL_TUNE) [EL-PRI-044]
    {% set ptot = 0.0 %}
    {% if prev >= 0 and prev != nxt and prev not in printer["gcode_macro TOOL_POSITIONS"].no_heat_tools|default([]) and tw != 1 and (bucket or tw == 0) %}
        {% set ci = printer["gcode_macro _TC_INFILL"] %}
        {% set lpt = ci.live_park_tool if ci.live_park_tool is mapping else {} %}
        {% set lv = lpt[prev] if prev in lpt else none %}
        {% set so = sv["t%d_park_retract_mm" % prev] if ("t%d_park_retract_mm" % prev) in sv else none %}
        {% set glob = ci.live_park if ci.live_park is number else ci.park_retract_mm|default(5.0) %}
        {% set ptot = [[(lv if lv is number and lv >= 0 else (glob if lv is number else (so if so is number and so >= 0 else glob)))|float, 0.0]|max, 15.0]|min %}
    {% endif %}
    {% set ptop = [ptot - prev_rlen, 0.0]|max %}
    {% if ptop > 0.001 %}
        SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=park_pending VALUE="[{prev}, {'%.3f'|format(ptop)}, {prev_rlen}]"
    {% endif %}
    {% set z0 = printer.gcode_move.gcode_position.z|float %}
    {% set zt = [z0 + printer["gcode_macro TOOL_POSITIONS"].z_hop|float, printer.toolhead.axis_maximum.z|float - 1]|min %}
    {% set clear_z = printer["gcode_macro _PRIME_SETTINGS"].clear_z|float %}
    {% set lane = not same and grid and grid.exit_y|default(-1)|float >= 0 and z0 < clear_z %}
    # The return over the print (_TC_INFILL): above the first layer, without
    # a front lane, for a station or plain change of a heated tool. Where to
    # is read first, before anything moves (_INDX_TC_SPOT reads the file
    # from the line after this one)
    {% set tci = printer["gcode_macro _TC_INFILL"] %}
    # Not with a wipe tower: the slicer goes there next, the tower primes
    {% set spot = tci.enabled|default(False) and "indx_api" in printer and not same and not reprime and not lane and not first_layer and not no_heat and tw != 1 %}
    {% if spot %}
        _INDX_TC_SPOT WIPE={tci.wipe_mm} MIN={tci.min_line_mm} KB={tci.scan_kb}
    {% endif %}
    {% if not same %}{% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=before_change FROM={prev} TO={nxt}{% endif %}{% endif %}
    {% if lane %}
        G90
        G1 Z{clear_z} F900                 ; clear the lane's blobs on the way to the dock and back
    {% endif %}
    # A pickup that does not seat pauses the print (_PICKUP_SEAT_FAIL); RESUME
    # then runs this whole command again, with the slicer's own values
    # (a spool join: its own command, which also goes back to the print point)
    SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=outer_cmd VALUE='"{'_INDX_SPOOL_JOIN_RUN' if join else 'PRINT_TOOLCHANGE ' ~ rawparams}"'
    # No pressure advance from the park to the end of the station visit or
    # prime: put back once, by the tail [EL-TC-076]
    {% if not same %}_INDX_PA_HOLD OWNER=print{% endif %}
    {% if reprime %}
        # Pick up cold and heat over the re-prime spot (PRIME_LINE), so what
        # oozes while heating lands in the purge, not on the way
        _INDX_CHANGE_TOOL TOOL={nxt} COLD=1
    {% elif bucket %}
        # Purge station: pick up cold, the station heats as soon as the pickup
        # is done, on its way in (CHANGE_TOOL TEMP= would heat no sooner: INDX
        # heats after the dock exit and the load cell tare, then waits there)
        _INDX_CHANGE_TOOL TOOL={nxt} COLD=1
    {% elif not same %}
        # The slicer deretracts the returning tool itself
        _INDX_CHANGE_TOOL TOOL={nxt} TEMP={temp}
    {% endif %}
    {% if ptop > 0.001 %}
        # not used by this park (a held change): never by a later one
        SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=park_pending VALUE="[]"
    {% endif %}
    # NEXT= the dock when the map changed it (after the slicer's own NEXT in
    # rawparams: the last one counts).
    # SHARE=1: two slicer tools on one dock, the slicer changes between them
    # (many to one): no change, the retraction evened out [EL-PRI-047]
    _PRINT_TOOLCHANGE_AFTER {rawparams}{(" NEXT=%d" % nxt) if nxt != snxt else ""} HEAT_TEMP={temp} KIND={"reprime" if reprime else ("station" if bucket else ("same" if same else "plain"))} STATION={stn if bucket else "none"} WAS_RETRACTED={0 if join else (1 if snxt in retracted else 0)} LANE={1 if lane else 0} ZT={zt}{(" SPOT=1 Z0=" ~ z0) if spot else ""}{" SHARE=1" if same and not join and rmap and sprev >= 0 and sprev != snxt else ""}
    _PRINT_TOOLCHANGE_TAIL HELD_LIST="{retracted}" DONE_LIST="{retracted if join else retracted|reject('equalto', snxt)|list}"{(" SCUR=%d" % (-2 if join else snxt)) if "indx_remap" in printer else ""}

[gcode_macro _PRINT_TOOLCHANGE_TAIL]
description: Inner - PRINT_TOOLCHANGE's last bookkeeping, after the pickup: skipped while a failed pickup holds the print
# Rendered after the pickup. While a pickup holds, the incoming tool must stay
# counted as retracted, or the redo on RESUME (which runs PRINT_TOOLCHANGE
# again) sees it as not retracted and the slicer's deretract lands on a full
# nozzle; the outgoing tool's retraction is kept. [EL-PRI-029]
gcode:
    {% if printer["gcode_macro _PICKUP_SEAT_FAIL"].held|int %}
        SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=retracted VALUE="{params.HELD_LIST}"
    {% else %}
        SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=retracted VALUE="{params.DONE_LIST}"
        {% if params.SCUR|default(-2)|int > -2 %}
            # the slicer tool printing from here (a spool join keeps it)
            SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=slicer_cur VALUE={params.SCUR|int}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=outer_cmd VALUE='""'
    {% endif %}
    _INDX_PA_RELEASE OWNER=print

[gcode_macro _PRINT_TOOLCHANGE_AFTER]
description: Inner - PRINT_TOOLCHANGE after the pickup: prime, purge or heat, then leave the dock area. Skipped while a failed pickup holds the print
# Its own macro so it renders after the pickup: when the tool did not seat
# the print is paused with the head empty, and nothing here may run (RESUME
# redoes the whole PRINT_TOOLCHANGE).
gcode:
    {% if not printer["gcode_macro _PICKUP_SEAT_FAIL"].held|int %}
    {% set nxt = params.NEXT|int %}
    # HEAT_TEMP: PRINT_TOOLCHANGE's temperature after the fallback (0 for a
    # tool without heating); TEMP is the slicer's raw value
    {% set temp = params.HEAT_TEMP|default(params.TEMP)|float %}
    {% set rlen = params.RETRACT|default(5)|float %}
    {% set kind = params.KIND %}
    {% set was_retracted = params.WAS_RETRACTED|int %}
    # KEEP: what the slicer deretracts this tool by at its first print move:
    # DERETRACT= when the tool change G-code sets it (PrusaSlicer's
    # e_retracted, as Prusa's own INDX profile: the slicer then always
    # deretracts at the print, also at a tool's first use), else its RETRACT
    # when it retracted the tool, else 0 [EL-PRI-045]
    {% set dr = params.DERETRACT|default("")|string|trim %}
    {% set given = dr != "" and dr|float(-1) >= 0 %}
    {% set keep = dr|float if given else (rlen if was_retracted else 0.0) %}
    {% set grid = printer["gcode_macro PRIME_GRID"].grid %}
    {% set clear_z = printer["gcode_macro _PRIME_SETTINGS"].clear_z|float %}
    # own: a plain change of a tool INDX left retracted by more than the
    # slicer deretracts (KEEP: its RETRACT when it retracted the tool, else
    # 0): PRIME_CLEAN's cooldown retraction or a print end's tip forming at
    # its first pickup, the park retraction on top of the slicer's
    # [EL-PRI-044]. The rest is pushed back at the end of the change as after
    # a station visit (_PRINT_TOOLCHANGE_PUSH, or over the infill), never
    # zeroed unfilled. A tool the slicer parked without a park retraction
    # has its record set to the slicer's retraction at the park: not own.
    # With DERETRACT= the slicer deretracts even a tool INDX left fuller
    # than that: the difference is retracted the same way [EL-PRI-045]
    {% set have = printer.save_variables.variables["t" ~ nxt ~ "_retracted"]|default(0)|float %}
    {% set own = kind == "plain" and temp > 0 and (have > keep + 0.001 or (given and have < keep - 0.001)) %}
    {% if kind == "reprime" %}
        M104 S0
        {% set sl = printer["gcode_macro _PURGE_LANE"].own[nxt] %}
        PRIME_LINE TEMP={temp} X={sl[0] + (54 if nxt == grid.first else 42)} Y={sl[1]} REFILL={printer.save_variables.variables["t" ~ nxt ~ "_retracted"]|default(0)}
        SAVE_VARIABLE VARIABLE=t{nxt}_retracted VALUE=0
        SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=reprimed VALUE="{printer['gcode_macro PRINT_TOOLCHANGE'].reprimed + [nxt]}"
        {% if keep > 0 %}
            _INDX_RETRACT E={keep} F=2100
        {% endif %}
    {% elif kind == "station" %}
        # The purge station (an extension): zone checked first, the head back at the clearance line after
        # calls: (the station's command, [indx_station] command:)
        {% set sto = printer["indx_station " ~ params.STATION] %}
        # the first pickup of a tool the print start left to the station: its
        # cold Z check on the inductive XY sensor, before anything heats
        {% if nxt in printer["gcode_macro PRIME_GRID"].grid.bucket|default([]) %}
            {% if "gcode_macro _INDX_SENSOR_ZCHECK" in printer %}_INDX_SENSOR_ZCHECK TOOL={nxt}{% endif %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=push_keep VALUE={keep}
        _INDX_STATION_CHECK NAME={params.STATION}
        {sto.command} TEMP={temp} RETRACT={rlen}{(" PURGE=" ~ params.PURGE) if params.PURGE is defined else ""}{(" MAXVOL=" ~ params.MAXVOL) if params.MAXVOL is defined else ""} FLEX={params.FLEX|default(0)}
        _INDX_STATION_RETURN NAME={params.STATION}
    {% elif kind == "same" %}
        {% if temp > 0 %}
            M104 S{temp}
            TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={temp - 5} MAXIMUM={temp + 5}
        {% endif %}
        {% if params.SHARE|default(0)|int and temp > 0 %}
            # Two slicer tools on one dock: the slicer just retracted the one
            # it left by PREV_RETRACT and deretracts the one it goes to by
            # KEEP. Same tool, so the difference is evened out here.
            {% set diff = keep - params.PREV_RETRACT|default(rlen)|float %}
            {% if diff > 0.001 %}
                _INDX_RETRACT E={diff} F=2100
            {% elif diff < -0.001 %}
                SAVE_GCODE_STATE NAME=_indx_share
                M83
                G1 E{0 - diff} F300
                RESTORE_GCODE_STATE NAME=_indx_share
            {% endif %}
        {% endif %}
    {% else %}
        {% if temp > 0 %}
            M109 S{temp}
        {% endif %}
        {% if not own %}
            SAVE_VARIABLE VARIABLE=t{nxt}_retracted VALUE=0
        {% endif %}
    {% endif %}
    {% if kind != "same" %}{% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=before_return TOOL={nxt} Z={params.ZT}{% endif %}{% endif %}
    # From a station: the way back at the speed mode's share of the machine's limits (_INDX_MODE_LIMITS)
    {% set cp = printer.configfile.settings.printer %}
    {% set th = printer.toolhead %}
    # SPOT=1: PRINT_TOOLCHANGE read where the return over the print goes
    {% set infill = params.SPOT|default(0)|int and not params.LANE|int %}
    {% if kind == "station" and params.LANE|int %}
        _INDX_MODE_LIMITS
    {% endif %}
    {% if params.LANE|int %}
        G90
        G1 Z{clear_z} F900
        {% if kind != "station" %}
            G1 Y{grid.exit_y} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}            ; straight back past the lane
        {% endif %}
    {% endif %}
    {% if kind == "station" %}
        # Where control returns to the slicer, without a standstill (as in
        # _PRINT_TOOLCHANGE_PUSH) [EL-PRI-030]: the way back past the lane,
        # the z_hop and the station's retraction settled against what the
        # slicer expects (it deretracts RETRACT only when it retracted this
        # tool), pushed back during those moves
        {% if infill %}
            # over the incoming tool's infill instead (_PRINT_TOOLCHANGE_INFILL)
            _PRINT_TOOLCHANGE_INFILL TOOL={nxt} KIND=station KEEP={keep} ZT={params.ZT} Z0={params.Z0} F={(cp.max_velocity|float * 60)|round(0)|int} E_F={600 if params.FLEX|default(0)|int else 1200}
        {% else %}
            _PRINT_TOOLCHANGE_PUSH TOOL={nxt} KEEP={keep} ZT={params.ZT}{(" EXIT_Y=" ~ grid.exit_y) if params.LANE|int else ""} F={(cp.max_velocity|float * 60)|round(0)|int} E_F={600 if params.FLEX|default(0)|int else 1200}
        {% endif %}
        {% if params.LANE|int %}
            SET_VELOCITY_LIMIT VELOCITY={th.max_velocity} ACCEL={th.max_accel}
        {% endif %}
    {% elif kind != "same" %}
        {% if own %}
            # INDX's own retraction (own above): pushed back as after a
            # station, during the way back or over the infill
            {% if infill %}
                _PRINT_TOOLCHANGE_INFILL TOOL={nxt} KIND=plain OWN=1 KEEP={keep} ZT={params.ZT} Z0={params.Z0} F={(cp.max_velocity|float * 60)|round(0)|int} E_F={600 if params.FLEX|default(0)|int else 1200}
            {% else %}
                _PRINT_TOOLCHANGE_PUSH TOOL={nxt} KEEP={keep} ZT={params.ZT} F={(cp.max_velocity|float * 60)|round(0)|int} E_F={600 if params.FLEX|default(0)|int else 1200} OWN=1
            {% endif %}
        {% elif infill %}
            # the slicer's own deretract and retraction over the incoming tool's infill
            _PRINT_TOOLCHANGE_INFILL TOOL={nxt} KIND=plain KEEP={keep} ZT={params.ZT} Z0={params.Z0} F={(cp.max_velocity|float * 60)|round(0)|int} E_F={600 if params.FLEX|default(0)|int else 1200}
        {% else %}
            G90
            G1 Z{params.ZT} F900               ; z_hop over the change height: the slicer's travel starts there
        {% endif %}
    {% endif %}
    {% if kind != "same" %}
        {% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=change_done{% endif %}
    {% endif %}
    {% endif %}

[gcode_macro _PRINT_TOOLCHANGE_PUSH]
description: Inner - after a purge station visit, where control returns to the slicer: push back the refill, the difference between what the station left the tool retracted by (t<n>_retracted) and what the slicer expects (KEEP=: its RETRACT when it will deretract this tool, else 0) plus _TC_INFILL's refill loss and the tool's t<n>_refill_adj_mm (OWN=1, INDX's own retraction: the difference only), or retract when that is below 0, then record 0 (the slicer's deretract follows). With ZT= (the end of a station change) the push rides on the way back: EXIT_Y= (past a front lane), then straight away from the docks in Y down or up to ZT, never a standstill. While the print is paused (the station held it) only the moves run: its RESUME settles it
# Rendered here, after the station has recorded its retraction. Pushes
# back what the station retracted beyond KEEP plus the compensation
# (_TC_INFILL, the same sum as _PRINT_TOOLCHANGE_INFILL) [EL-PRI-043]; a sum
# below 0 is retracted through the retraction guard.
# No standstill at the hand-back point, where a standing push oozes
# [EL-PRI-030]: the push rides on the moves that run anyway (EXIT_Y past a
# front lane, then straight away from the docks in Y to ZT), within 80 % of
# max_extrude_cross_section at E_F. Going up to ZT comes first, on its own.
# The nozzle stays at least KEEP retracted. What does not fit is pushed
# standing; without ZT= (the bucket's RESUME) the plain standing push.
# A quiet window for the clog watch, without flushing the lookahead
# [EL-PRI-031].
gcode:
    {% set t = params.TOOL|int %}
    {% set keep = params.KEEP|default(0)|float %}
    {% set sv = printer.save_variables.variables %}
    {% set have = sv["t" ~ t ~ "_retracted"]|default(0)|float %}
    # the refill: the net plus the compensation (_TC_INFILL) [EL-PRI-043]
    {% set cfg = printer["gcode_macro _TC_INFILL"] %}
    {% set exs0 = printer.configfile.settings[printer.toolhead.extruder] if printer.toolhead.extruder in printer.configfile.settings else {} %}
    {% set fd0 = exs0.filament_diameter|float if "filament_diameter" in exs0 else 1.75 %}
    {% set loss = [[(cfg.live_loss if cfg.live_loss is number else cfg.refill_loss_mm3|default(0))|float, 0.0]|max, 20.0]|min %}
    {% set adj = [[(cfg.live_adj[t] if cfg.live_adj is mapping and t in cfg.live_adj else sv["t%d_refill_adj_mm" % t]|default(cfg.refill_adj_mm|default(0.0)))|float, -5.0]|max, 5.0]|min %}
    {% set net = have - keep %}
    # after a station: also at a net of 0 (it left the slicer's retraction)
    {% set comp = loss / (3.14159 * (fd0 if fd0 > 0 else 1.75) ** 2 / 4.0) + adj if net > -0.001 and not params.OWN|default(0)|int else 0.0 %}
    {% set push = net + comp %}
    # held: print_stats says paused only once the print file's current line
    # has ended; pause_resume knows right after a hold inside this change
    # [EL-BKT-027]
    {% set held = (printer.print_stats.state == "paused" or ("pause_resume" in printer and printer.pause_resume.is_paused)) and not params.RESUMING|default(0)|int %}
    {% set mine = sv.active_tool|default(-1)|int == t and not held %}
    {% set ef = params.E_F|default(1200)|float %}
    {% set ns = namespace(left=push if mine and push > 0.001 else 0.0) %}
    {% if "indx_clog" in printer %}INDX_CLOG_QUIET ON=1 REASON=push{% endif %}
    {% if params.ZT is defined %}
        {% set th = printer.toolhead %}
        {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
        {% set cs = printer.configfile.settings %}
        {% set exs = cs[th.extruder] if th.extruder in cs else {} %}
        {% set nd = exs.nozzle_diameter|float if "nozzle_diameter" in exs else 0.4 %}
        {% set fd = exs.filament_diameter|float if "filament_diameter" in exs else 1.75 %}
        {% set xc = exs.max_extrude_cross_section|float if "max_extrude_cross_section" in exs else 4.0 * nd * nd %}
        {% set ratio = 0.8 * (xc if xc > 0 else 0.64) / (3.14159 * (fd if fd > 0 else 1.75) ** 2 / 4.0) %}
        {% set f = params.F|default(6000)|float %}
        {% set pos = printer.gcode_move.gcode_position %}
        {% set ns2 = namespace(y=pos.y|float, z=pos.z|float) %}
        {% set zt = params.ZT|float %}
        SAVE_GCODE_STATE NAME=_tc_push
        G90
        M83
        {% if params.EXIT_Y is defined %}
            # straight back past the lane, at clear_z (over the lane's blobs)
            {% set ey = params.EXIT_Y|float %}
            {% set d = (ey - ns2.y)|abs %}
            {% set e = [ns.left, ratio * d]|min %}
            {% if e > 0.001 %}
                G1 Y{ey} E{"%.3f"|format(e)} F{[f, d / (e / (ef / 60.0)) * 60.0]|min|round(0)|int}
                {% set ns.left = ns.left - e %}
            {% else %}
                G1 Y{ey} F{f|round(0)|int}
            {% endif %}
            {% set ns2.y = ey %}
        {% endif %}
        {% if ns.left > 0.001 %}
            # away from the docks in Y while going to ZT, as long as the rest
            # of the push needs, within the Y travel
            {% set away = -1.0 if tp.dock_dir|float > 0 else 1.0 %}
            {% set lo = th.axis_minimum.y|float - printer.gcode_move.homing_origin.y|float + 2.0 %}
            {% set hi = th.axis_maximum.y|float - printer.gcode_move.homing_origin.y|float - 2.0 %}
            {% set y2 = [[ns2.y + away * ns.left / ratio, lo]|max, hi]|min %}
            {% set d = (y2 - ns2.y)|abs %}
            {% set e = [ns.left, ratio * d]|min %}
            {% if e > 0.001 %}
                {% if zt > ns2.z + 0.001 %}
                    # up first, as its own move: rising along the Y move would
                    # leave the nozzle at the print's height as it starts
                    G1 Z{zt} F900
                    {% set ns2.z = zt %}
                {% endif %}
                {% set dd = (d * d + (zt - ns2.z) * (zt - ns2.z)) ** 0.5 %}
                G1 Y{"%.3f"|format(y2)}{(" Z%s" % zt) if zt < ns2.z - 0.001 else ""} E{"%.3f"|format(e)} F{[f, dd / (e / (ef / 60.0)) * 60.0]|min|round(0)|int}
                {% set ns.left = ns.left - e %}
            {% else %}
                G1 Z{zt} F900
            {% endif %}
        {% else %}
            G1 Z{zt} F900                  ; z_hop over the change height: the slicer's travel starts there
        {% endif %}
        RESTORE_GCODE_STATE NAME=_tc_push
    {% endif %}
    {% if mine %}
        {% if ns.left > 0.001 %}
            SAVE_GCODE_STATE NAME=_tc_retract
            M83
            G1 E{"%.3f"|format(ns.left)} F{ef|round(0)|int}
            RESTORE_GCODE_STATE NAME=_tc_retract
        {% elif push < -0.001 %}
            _INDX_RETRACT E={"%.3f"|format(0 - push)} F=2100
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_TC_INFILL VARIABLE=last_refill VALUE="{[t, push|round(3), comp|round(3), printer.toolhead.estimated_print_time|default(0)|float|round(1)]}"
        SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE=0
    {% endif %}
    {% if "indx_clog" in printer %}INDX_CLOG_QUIET ON=0 REASON=push{% endif %}

[gcode_macro _TC_INFILL]
description: Inner - the settings of the return over the print after a tool change (_PRINT_TOOLCHANGE_INFILL); INDX_SETTING MACRO=_TC_INFILL changes them. Does nothing when run
# enabled: after a print's tool change (above the first layer, without a
#   front lane) the head goes over the incoming tool's first infill line on
#   this layer, pushes back there, wipes along it and then hands back.
#   False: the push on the way back, the slicer's deretract at its first
#   point (often the outer wall's seam).
# clear_mm: mm over the highest point printed there so far.
# The refill after a purge station visit [EL-PRI-043]: the station leaves the
#   tool retracted by t<n>_retracted (the slicer's RETRACT after a tool
#   change purge [EL-PRI-044]), the slicer deretracts KEEP after the
#   change. INDX pushes back the net (t<n>_retracted less KEEP, 0 when the
#   slicer deretracts what the station left) plus the refill loss and the
#   tool's own adjustment, at the infill spot or on the way back
#   (_PRINT_TOOLCHANGE_PUSH): the same sum on both paths, never silently
#   less than the net. A sum below 0 is retracted through the latch guard.
#   Only after a station visit; INDX's own retraction (OWN=1) and a station
#   that left less than KEEP get the plain net.
# park_retract_mm: the total a parked tool is retracted by, 0 to 15 mm
#   [EL-PRI-044]. PRINT_TOOLCHANGE retracts the outgoing tool by this less
#   the slicer's PREV_RETRACT on the park's Z hop (_INDX_PARK_RETRACT, never
#   less than the slicer did); not with a wipe tower. t<n>_park_retract_mm
#   (saved, Tool properties; below 0 or not set: this one) is a tool's own.
#   Read per change.
# live_park / live_park_tool: INDX_REFILL_TUNE PARK= for this session (the
#   whole printer, or TOOL='s; -1 for a tool: the printer's value). They win
#   over the saved values until RESET=1 or a restart.
# refill_loss_mm3: mm3 of filament a refill from a deep retraction does not
#   bring back into the melt zone, pushed on top of the net (as length of the
#   extruder's filament_diameter). 0 to 20. Read per call.
# t<n>_refill_adj_mm (saved variable, Tool properties): the tool's own mm on
#   top of that, -5 to 5. Read per call.
# refill_adj_mm: the adjustment of a tool without its own t<n>_refill_adj_mm,
#   -5 to 5, default 0: the slicer's deretract per filament tunes the rest.
#   [EL-PRI-046]
# live_loss / live_adj: INDX_REFILL_TUNE's values for this session (a tuning
#   print); they win over the two above until INDX_REFILL_TUNE RESET=1 or a
#   restart. last_refill: [tool, mm pushed, of it the compensation, time].
# wipe_mm: the wipe along the infill line (0: none). It is cut to fit the
#   line.
# min_line_mm: the infill line must be at least this long.
# scan_kb: how far ahead in the print file to look for it.
variable_refill_adj_mm: 0.0
variable_enabled: True
variable_clear_mm: 0.3
variable_refill_loss_mm3: 0.0
variable_live_loss: None
variable_live_adj: {}
variable_park_retract_mm: 5.0
variable_live_park: None
variable_live_park_tool: {}
variable_last_refill: []
variable_wipe_mm: 4.0
variable_min_line_mm: 3.0
variable_scan_kb: 256
gcode:

[gcode_macro INDX_REFILL_TUNE]
description: The refill after a purge station visit and the park retraction, live for a tuning print: LOSS= (mm3, 0 to 20, _TC_INFILL refill_loss_mm3), TOOL= ADJ= (mm, -5 to 5, t<n>_refill_adj_mm) and PARK= (mm, 0 to 15, the total a parked tool is retracted by: _TC_INFILL park_retract_mm, with TOOL= t<n>_park_retract_mm, -1 back to the printer's) for this session; SAVE=1 keeps the given values instead (LOSS and PARK through INDX_SETTING, the tool's as saved variables); RESET=1 drops the live values (back to the saved ones). BAND= BANDS= label the report. Without parameters: the report line. Safe between tool changes in a print: the next change reads it. Moves: nothing. Saves: only with SAVE=1
# Out of range values are clamped with a line, never an error: an error in a
# print file would stop the print. [EL-PRI-043]
gcode:
    {% set cfg = printer["gcode_macro _TC_INFILL"] %}
    {% set save = params.SAVE|default(0)|int %}
    {% set live = {} %}
    {% if cfg.live_adj is mapping and not params.RESET|default(0)|int %}
        {% for k, v in cfg.live_adj.items() %}{% set _ = live.update({k|int: v|float}) %}{% endfor %}
    {% endif %}
    {% set ns = namespace(loss=cfg.live_loss if not params.RESET|default(0)|int else None) %}
    {% if params.LOSS is defined %}
        {% set raw = params.LOSS|float %}
        {% set x = [[raw, 0.0]|max, 20.0]|min %}
        {% if x != raw %}
            RESPOND MSG="INDX_REFILL_TUNE: LOSS={raw} is outside 0 to 20 mm3, {x} used"
        {% endif %}
        {% if save %}
            INDX_SETTING MACRO=_TC_INFILL VAR=refill_loss_mm3 VALUE={x}
            {% set ns.loss = None %}
        {% else %}
            {% set ns.loss = x %}
        {% endif %}
    {% endif %}
    {% if params.ADJ is defined %}
        {% if params.TOOL is not defined %}
            RESPOND MSG="INDX_REFILL_TUNE: ADJ= needs TOOL=, not changed"
        {% else %}
            {% set t = params.TOOL|int %}
            {% set raw = params.ADJ|float %}
            {% set x = [[raw, -5.0]|max, 5.0]|min %}
            {% if x != raw %}
                RESPOND MSG="INDX_REFILL_TUNE: ADJ={raw} is outside -5 to 5 mm, {x} used"
            {% endif %}
            {% if save %}
                SAVE_VARIABLE VARIABLE=t{t}_refill_adj_mm VALUE={x}
                {% set _ = live.pop(t, None) %}
            {% else %}
                {% set _ = live.update({t: x}) %}
            {% endif %}
        {% endif %}
    {% endif %}
    # PARK=: the park total (mm, 0 to 15) [EL-PRI-044]; with TOOL= that
    # tool's own (-1: the printer's value), else the printer's
    {% set lpt = {} %}
    {% if cfg.live_park_tool is mapping and not params.RESET|default(0)|int %}
        {% for k, v in cfg.live_park_tool.items() %}{% set _ = lpt.update({k|int: v|float}) %}{% endfor %}
    {% endif %}
    {% set pns = namespace(glob=cfg.live_park if not params.RESET|default(0)|int else None) %}
    {% if params.PARK is defined %}
        {% set raw = params.PARK|float %}
        {% set tool_p = params.TOOL is defined %}
        {% set x = -1.0 if tool_p and raw < 0 else [[raw, 0.0]|max, 15.0]|min %}
        {% if x != raw %}
            RESPOND MSG="INDX_REFILL_TUNE: PARK={raw} is outside 0 to 15 mm, {x} used"
        {% endif %}
        {% if tool_p %}
            {% set t = params.TOOL|int %}
            {% if save %}
                SAVE_VARIABLE VARIABLE=t{t}_park_retract_mm VALUE={x}
                {% set _ = lpt.pop(t, None) %}
            {% else %}
                {% set _ = lpt.update({t: x}) %}
            {% endif %}
        {% elif save %}
            INDX_SETTING MACRO=_TC_INFILL VAR=park_retract_mm VALUE={x}
            {% set pns.glob = None %}
        {% else %}
            {% set pns.glob = x %}
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TC_INFILL VARIABLE=live_loss VALUE={ns.loss}
    SET_GCODE_VARIABLE MACRO=_TC_INFILL VARIABLE=live_adj VALUE="{live}"
    SET_GCODE_VARIABLE MACRO=_TC_INFILL VARIABLE=live_park VALUE={pns.glob}
    SET_GCODE_VARIABLE MACRO=_TC_INFILL VARIABLE=live_park_tool VALUE="{lpt}"
    _INDX_REFILL_REPORT{(" BAND=" ~ params.BAND) if params.BAND is defined else ""}{(" BANDS=" ~ params.BANDS) if params.BANDS is defined else ""}

[gcode_macro _INDX_REFILL_REPORT]
description: Inner - INDX_REFILL_TUNE's one line: the refill settings in force (renders after they are set)
gcode:
    {% set cfg = printer["gcode_macro _TC_INFILL"] %}
    {% set sv = printer.save_variables.variables %}
    {% set exs = printer.configfile.settings[printer.toolhead.extruder] if printer.toolhead.extruder in printer.configfile.settings else {} %}
    {% set fd = exs.filament_diameter|float if "filament_diameter" in exs else 1.75 %}
    {% set lv = cfg.live_loss is number %}
    {% set loss = [[(cfg.live_loss if lv else cfg.refill_loss_mm3|default(0))|float, 0.0]|max, 20.0]|min %}
    {% set la = cfg.live_adj if cfg.live_adj is mapping else {} %}
    {% set parts = [] %}
    {% for t in range(printer["gcode_macro TOOL_POSITIONS"].tool_count|default(4)|int) %}
        {% set a = [[(la[t] if t in la else sv["t%d_refill_adj_mm" % t]|default(cfg.refill_adj_mm|default(0.0)))|float, -5.0]|max, 5.0]|min %}
        {% set _ = parts.append("T%d %+.2f%s" % (t, a, " live" if t in la else "")) %}
    {% endfor %}
    {% set band = ("band %s%s: " % (params.BAND, ("/" ~ params.BANDS) if params.BANDS is defined else "")) if params.BAND is defined else "" %}
    # the park total, the printer's and each tool's own where it has one
    {% set lpg = cfg.live_park is number %}
    {% set glob = [[(cfg.live_park if lpg else cfg.park_retract_mm|default(5.0))|float, 0.0]|max, 15.0]|min %}
    {% set lpt = cfg.live_park_tool if cfg.live_park_tool is mapping else {} %}
    {% set pparts = [] %}
    {% for t in range(printer["gcode_macro TOOL_POSITIONS"].tool_count|default(4)|int) %}
        {% set so = sv["t%d_park_retract_mm" % t] if ("t%d_park_retract_mm" % t) in sv else none %}
        {% if t in lpt and lpt[t]|float >= 0 %}
            {% set _ = pparts.append("T%d %.1f live" % (t, [lpt[t]|float, 15.0]|min)) %}
        {% elif t not in lpt and so is number and so >= 0 %}
            {% set _ = pparts.append("T%d %.1f" % (t, [so|float, 15.0]|min)) %}
        {% endif %}
    {% endfor %}
    RESPOND MSG="INDX refill {band}loss {"%.1f"|format(loss)} mm3 {"live" if lv else "saved"} ({"%.2f"|format(loss / (3.14159 * fd * fd / 4.0))} mm), adj {parts|join(", ")} mm, park total {"%.1f"|format(glob)} mm {"live" if lpg else "saved"}{(" (own: " ~ pparts|join(", ") ~ ")") if pparts else ""}. After a station: net + loss + adj."

[gcode_macro _PRINT_TOOLCHANGE_INFILL]
description: Inner - the end of a print's tool change (KIND=station or plain), with the return over the print: travel at the z_hop height to the incoming tool's first infill line on this layer (printer.indx_api.tc_spot, from _INDX_TC_SPOT), down to clear_mm over it, push back the refill there (the retraction less KEEP, plus after a station _TC_INFILL's refill loss and the tool's t<n>_refill_adj_mm; below 0: retracted after the wipe), wipe along the line, up to ZT, recorded 0. Without a usable spot: _PRINT_TOOLCHANGE_PUSH, or up to ZT
# Rendered after the station (or the plain heat), so it reads the recorded
# retraction and a hold. The push and the ooze land on a line the slicer
# prints next, not at the outer wall's seam [EL-PRI-027]. t<n>_retracted
# records 0 either way.
# Height: clear_mm over the lower of Z0 (where the change started) and the
# line's print Z; the travel at ZT, at least 1 mm over Z0.
# Guards: both wipe ends 2 mm or more on the bed side of the clearance line
# and inside the axis limits, a tool that can extrude, the retraction guard
# clear, the print not held, something to refill; else the plain ending
# (_PRINT_TOOLCHANGE_PUSH).
gcode:
    {% set t = params.TOOL|int %}
    {% set kind = params.KIND|default("station") %}
    {% set keep = params.KEEP|default(0)|float %}
    {% set zt = params.ZT|float %}
    {% set z0 = params.Z0|default(params.ZT)|float %}
    {% set f = params.F|default(6000)|float %}
    {% set ef = params.E_F|default(1200)|float %}
    {% set cfg = printer["gcode_macro _TC_INFILL"] %}
    {% set sp = printer.indx_api.tc_spot if "indx_api" in printer else {} %}
    {% set sv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set org = printer.gcode_move.homing_origin %}
    {% set lm = printer["gcode_macro _INDX_LOCK_MARK"] %}
    # what the nozzle is retracted by now: the station's record (OWN=1: a
    # plain first pickup INDX left retracted, PRIME_CLEAN's cooldown
    # retraction), or the slicer's retraction a plain change brings back
    {% set own = params.OWN|default(0)|int %}
    {% set have = sv["t" ~ t ~ "_retracted"]|default(0)|float if kind == "station" or own else keep %}
    # the refill: the net plus, after a station, the compensation (the same
    # sum as _PRINT_TOOLCHANGE_PUSH) [EL-PRI-043]
    {% set exs0 = printer.configfile.settings[th.extruder] if th.extruder in printer.configfile.settings else {} %}
    {% set fd0 = exs0.filament_diameter|float if "filament_diameter" in exs0 else 1.75 %}
    {% set loss = [[(cfg.live_loss if cfg.live_loss is number else cfg.refill_loss_mm3|default(0))|float, 0.0]|max, 20.0]|min %}
    {% set adj = [[(cfg.live_adj[t] if cfg.live_adj is mapping and t in cfg.live_adj else sv["t%d_refill_adj_mm" % t]|default(cfg.refill_adj_mm|default(0.0)))|float, -5.0]|max, 5.0]|min %}
    {% set net = have - keep %}
    {% set comp = loss / (3.14159 * (fd0 if fd0 > 0 else 1.75) ** 2 / 4.0) + adj if kind == "station" and not own and net > -0.001 else 0.0 %}
    {% set total = net + comp %}
    {% set ns = namespace(ok=sp is mapping and sp.x is defined and sp.wx is defined, why="") %}
    {% if ns.ok %}
        {% set dd = tp.dock_dir|float %}
        {% for px, py in [(sp.x|float, sp.y|float), (sp.wx|float, sp.wy|float)] %}
            {% set mx = px + org.x|float %}
            {% set my = py + org.y|float %}
            {% if tp.clearance_y is not number or (my - tp.clearance_y|float) * dd > -2.0 %}
                {% set ns.ok = False %}
            {% elif mx < th.axis_minimum.x|float + 1.0 or mx > th.axis_maximum.x|float - 1.0 or my < th.axis_minimum.y|float + 1.0 or my > th.axis_maximum.y|float - 1.0 %}
                {% set ns.ok = False %}
            {% endif %}
        {% endfor %}
    {% endif %}
    # held right after a hold in this change too (print_stats lags) [EL-BKT-027]
    {% set held = printer.print_stats.state == "paused" or ("pause_resume" in printer and printer.pause_resume.is_paused) %}
    {% set mine = sv.active_tool|default(-1)|int == t %}
    {% set fwd = th.position.e|float - lm.lock_e|default(0)|float %}
    {% set can_ret = keep <= 0.001 or lm.cleared|default(1)|int or fwd + have >= lm.clear_e|default(2.0)|float %}
    {% set ok = ns.ok and not held and mine and have > 0.001 and printer[th.extruder].can_extrude and can_ret %}
    {% if not ok %}
        {% if kind == "station" or own %}
            _PRINT_TOOLCHANGE_PUSH TOOL={t} KEEP={keep} ZT={zt} F={f|round(0)|int} E_F={ef|round(0)|int}{" OWN=1" if own else ""}
        {% else %}
            G90
            G1 Z{zt} F900                  ; z_hop over the change height: the slicer's travel starts there
        {% endif %}
    {% else %}
        {% set surf = [z0, sp.z|float]|min if sp.z is number else z0 %}
        {% set zs = surf + cfg.clear_mm|default(0.3)|float %}
        {% set zh = [zt, zs]|max %}
        {% set cz = printer.gcode_move.gcode_position.z|float %}
        {% set ztr = [cz, zh, z0 + 1.0]|max %}
        {% if "indx_clog" in printer %}INDX_CLOG_QUIET ON=1 REASON=push{% endif %}
        SAVE_GCODE_STATE NAME=_tc_infill
        G90
        M83
        {% if ztr > cz + 0.001 %}
            G1 Z{"%.3f"|format(ztr)} F900       ; up first, at the clearance line
        {% endif %}
        G1 X{sp.x} Y{sp.y} F{f|round(0)|int}     ; over the incoming tool's infill line, retracted
        G1 Z{"%.3f"|format(zs)} F900
        # The refill [EL-PRI-043]: pushed here, so what oozes lands on that line
        {% set push = [total, 0.0]|max %}
        {% if push > 0.001 %}
            G1 E{"%.3f"|format(push)} F{ef|round(0)|int}     ; push there: what oozes lands on that line
        {% endif %}
        {% if (sp.wx|float - sp.x|float)|abs + (sp.wy|float - sp.y|float)|abs > 0.1 %}
            G1 X{sp.wx} Y{sp.wy} F3000         ; wipe along the line
        {% endif %}
        RESTORE_GCODE_STATE NAME=_tc_infill
        {% if net < -0.001 %}
            # the station left less than the slicer deretracts
            _INDX_RETRACT E={"%.3f"|format(0 - net)} F=2100
        {% elif total < -0.001 %}
            # a negative adjustment beyond the net: retracted extra, never
            # refilled (through the latch guard; skipped with a line when it
            # refuses)
            {% if lm.cleared|default(1)|int or fwd >= lm.clear_e|default(2.0)|float %}
                _INDX_RETRACT E={"%.3f"|format(0 - total)} F=2100
            {% else %}
                RESPOND MSG="INDX: T{t} extra retraction at the infill spot ({"%.2f"|format(0 - total)} mm, t{t}_refill_adj_mm) skipped: the latch guard needs {lm.clear_e|default(2.0)} mm forward since the lock first"
            {% endif %}
        {% endif %}
        {% if kind == "station" or own %}
            SET_GCODE_VARIABLE MACRO=_TC_INFILL VARIABLE=last_refill VALUE="{[t, total|round(3), comp|round(3), printer.toolhead.estimated_print_time|default(0)|float|round(1)]}"
        {% endif %}
        SAVE_GCODE_STATE NAME=_tc_infill
        G90
        G1 Z{"%.3f"|format(zh)} F900           ; the slicer's travel starts here
        RESTORE_GCODE_STATE NAME=_tc_infill
        SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE=0
        {% if "indx_clog" in printer %}INDX_CLOG_QUIET ON=0 REASON=push{% endif %}
    {% endif %}

[gcode_macro INDX_SET_TEMP]
description: Set the nozzle target with every INDX heat rule (extension API 1): TARGET= C, TOOL= (default: the tool on the head), WAIT=1 waits to within 5 C. A tool not on the head, an empty head, a tool without heating: nothing heats; with no tool recorded on the head (WAIT=0) INDX first asks which tool is on it. M104 and M109 run through here; a tool manager's own M104/M109 call it
# The heat rules, in one place [EL-PRI-032]:
# - TOOL= a tool not on the head: nothing (slicers send M104 T<n> for every
#   tool; INDX has one heater, on the head). A parked tool heats at pickup.
# - No tool recorded on the head: WAIT=0 asks which tool is on it
#   [EL-PRI-033]; WAIT=1 says so and does not heat (it would never end).
# - A tool in no_heat_tools is never heated. [EL-PRI-019]
# indx_api.py registers M104/M109 onto this (SRC= names the request), unless
# a tool manager owns them. The heater is set through M99104, Klipper's own
# M104, so a manager's M104 that calls this never comes back here.
gcode:
    {% set wait = params.WAIT|default(0)|int %}
    {% set src = params.SRC|default("INDX_SET_TEMP")|string|upper %}
    {% set raw = params.TARGET|default(0)|string %}
    {% set s = raw|float %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set no_heat = act in printer["gcode_macro TOOL_POSITIONS"].no_heat_tools|default([]) %}
    {% set label = ("M104 S%s" % raw) if src == "M104" else (("M109 S%s" % s) if src == "M109" else ("INDX_SET_TEMP TARGET=%s%s" % (raw, " WAIT=1" if wait else ""))) %}
    {% set hooked = "indx_api" in printer and printer.indx_api.hooked %}
    # Klipper's own M104: M99104 with the INDX Suite (indx_api.py keeps that
    # name); without it the name a [gcode_macro M104] renamed it to
    # (indx_macros_only.cfg: M99104), or M104 itself when nothing wraps it
    {% set m104 = printer.configfile.settings["gcode_macro m104"] if "gcode_macro m104" in printer.configfile.settings else {} %}
    {% set base = "M99104" if "indx_api" in printer else (m104.rename_existing|default("M104")|string|upper if m104 else "M104") %}
    # M104/M109 T<n> come from the slicer: its tool number, through this
    # print's map (printer.indx_remap.map) [EL-PRI-047]
    {% set rmap = printer.indx_remap.map if "indx_remap" in printer and src in ["M104", "M109"] else {} %}
    {% set tool_p = (rmap[params.TOOL|int]|int if params.TOOL|int in rmap else params.TOOL|int) if params.TOOL is defined else none %}
    # Two slicer tools on one dock: an M104 T<n> for the one not printing now
    # (the slicer cooling the tool it left) is not for the tool on the head
    {% set scur = printer["gcode_macro PRINT_TOOLCHANGE"].slicer_cur|int %}
    {% if rmap and tool_p == act and scur >= 0 and params.TOOL|int != scur %}
        {% set tool_p = -1 %}
    {% endif %}
    {% if tool_p is not none and tool_p != act %}
        # not on the head: nothing to heat
        {% if src == "INDX_SET_TEMP" %}
            RESPOND MSG="{label} TOOL={tool_p}: T{tool_p} is not on the head ({('T%d is' % act) if act >= 0 else 'the head is empty'}), nothing heats. INDX heats a tool at its pickup (INDX_CHANGE_TOOL TEMP=)."
        {% endif %}
    {% elif act < 0 and s > 0 %}
        {% if wait %}
            RESPOND MSG="{label}: no tool on the head, not heating (INDX heats each tool at pickup)"
        {% else %}
            _INDX_HEAT_WHICH_TOOL TARGET={s} CMD="{label}"
        {% endif %}
    {% elif no_heat and s > 0 %}
        # A tool without heating (no_heat_tools) is never heated, and there is nothing to wait for
        RESPOND MSG="{label}: T{act} is a tool without heating (no_heat_tools), not heating"
        {base} S0
        {% if wait and hooked %}_INDX_EVENT EVENT=heating TOOL={act} TARGET=0.0{% endif %}
    {% else %}
        {base} S{raw if src == "M104" else s}
        {% if hooked %}_INDX_EVENT EVENT=heating TOOL={act} TARGET={s}{% endif %}
        {% if wait and s > 0 %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s - 5} MAXIMUM={s + 5}
            {% if hooked %}_INDX_EVENT EVENT=heating TOOL={act} TARGET={s} READY=1{% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_HEAT_WHICH_TOOL]
description: Inner - a heat command with no tool recorded on the head: ask which tool is on the head, record it (INDX_SEAT_TOOL_BY_HAND LOCKED=1), then run the heat command; or the head is empty and nothing heats. TARGET= the temperature, CMD= the command to run after (spaces as ~)
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set n = tp.tool_count|int %}
    {% set no_heat = tp.no_heat_tools|default([]) %}
    # The heat command rides inside _INDX_DO's own command, whose ~ become
    # spaces: its spaces are ^ instead, which INDX_SEAT_TOOL_BY_HAND turns
    # back when it runs NEXT (with ~ the button falls apart into NEXT=M104 S215)
    {% set cmd = params.CMD|replace("~", " ")|replace(" ", "^") %}
    {% set ns = namespace(b=[]) %}
    {% for t in range(n) if t not in no_heat %}
        {% set ns.b = ns.b + ["T%d is on the head, locked: record it and heat|_INDX_DO CMD=INDX_SEAT_TOOL_BY_HAND~TOOL=%d~LOCKED=1~NEXT=%s|primary" % (t, t, cmd)] %}
    {% endfor %}
    _INDX_PROMPT TITLE="Which Tool Is on the Head?" TEXT="INDX has the head recorded as empty, so it does not heat: the coil would run with no tool on it. If a tool is on the head and locked, say which one; INDX records it and heats to {params.TARGET|float|round(0)|int} C." TEXT2="Head really empty: nothing to heat. Pick a tool up first (CHANGE_TOOL TOOL=n)." B1="{ns.b[0] if ns.b|length > 0 else 'Close|_INDX_PROMPT_END|secondary'}" B2="{ns.b[1] if ns.b|length > 1 else ''}" B3="{ns.b[2] if ns.b|length > 2 else ''}" B4="{ns.b[3] if ns.b|length > 3 else ''}" F1="Head is empty: do not heat|_INDX_PROMPT_END|secondary"
    RESPOND MSG="INDX > {params.CMD|replace('~', ' ')}: no tool recorded on the head, not heating until you say which tool is on it (the dialog)"

[gcode_macro SET_HEATER_TEMPERATURE]
description: Set a heater's target; for the nozzle the same guard as M104: with no tool recorded on the head it asks which tool is on it first (Mainsail and KlipperScreen heat with this command)
rename_existing: _INDX_SET_HEATER_TEMPERATURE
gcode:
    {% set heater = params.HEATER|default("")|string %}
    {% set target = params.TARGET|default(0)|float %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% if heater == printer.toolhead.extruder and target > 0 and act < 0 %}
        _INDX_HEAT_WHICH_TOOL TARGET={target} CMD="SET_HEATER_TEMPERATURE HEATER={heater} TARGET={target}"
    {% elif heater == printer.toolhead.extruder and target > 0 and act in printer["gcode_macro TOOL_POSITIONS"].no_heat_tools|default([]) %}
        RESPOND MSG="SET_HEATER_TEMPERATURE: T{act} is a tool without heating (no_heat_tools), not heating"
    {% else %}
        _INDX_SET_HEATER_TEMPERATURE {rawparams}
        {% if heater == printer.toolhead.extruder %}{% if "indx_api" in printer and printer.indx_api.hooked %}_INDX_EVENT EVENT=heating TOOL={act} TARGET={target}{% endif %}{% endif %}
    {% endif %}

[gcode_macro TOOL_Z_MEASURE]
description: Tap the Z homing spot with the active tool and compare with its saved Z offset (MODE=zero also re-zeroes Z, from 3 taps averaged and only beyond their noise). Needs: homed, clean tip. Moves: to the Z homing spot. Saves: zero_z_shift with MODE=zero when the shift is beyond the noise band
# TOOL_Z_MEASURE [MODE=check|zero] [RECLEAN=0] [LIMIT=0.15] [PREV=<mm>] [SAMPLES=]
# RECLEAN=0 (default, for manual use): no re-clean, just apply (zero) or check
# against LIMIT. With RECLEAN > 0 a first tap beyond it is held back for a
# re-clean (PRIME_GRID does that); PREV is that first tap's deviation.
# SAMPLES: taps, averaged (default 1 for check, 3 for zero). MODE=zero
# changes the Z frame of the whole print, so it takes 3 taps and shifts only
# beyond a band from their noise (_TOOL_Z_JUDGE); a check only reports or
# stops, and stays one tap.
# The last check's tool, deviation (mm), verdict and a count stay in last_*
# for the INDX page; last_band is the last re-zero's noise band (mm).
# taps: this measurement's tap heights (gcode Z)
variable_last_tool: -1
variable_last_dev: 0.0
variable_last_ok: -1
variable_last_n: 0
variable_last_band: 0.0
variable_taps: []
# temps, xofs: each tap's nozzle temperature and the expansion profile's
#   correction onto the tool's cold reference (mm; None: no usable profile
#   or outside its range, the tap as measured); taps holds the heights
#   after that correction.
# last_temp: the temperature the last deviation belongs to (the profile's
#   cold reference when every tap was corrected, else the taps' mean)
variable_temps: []
variable_xofs: []
variable_last_temp: 0.0
gcode:
    # No tool recorded on the head: nothing to measure, and the judgement would
    # use a 't-1' offset [EL-PRI-034]
    {% if printer.save_variables.variables.active_tool|default(-1)|int < 0 %}
        {action_raise_error("TOOL_Z_MEASURE: no tool is recorded on the head. Pick one up first (CHANGE_TOOL TOOL=<n>).")}
    {% endif %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set px = tp.probe_x|float if tp.probe_x|float >= 0 else (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% set py = tp.probe_y|float if tp.probe_y|float >= 0 else (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    SAVE_GCODE_STATE NAME=_tool_z_measure
    G90
    G1 Z5 F900
    # Out to the clearance line first if behind it
    _INDX_TO_LANE
    G1 X{px} Y{py} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    {% set mode = params.MODE|default("check")|string %}
    {% set n = [params.SAMPLES|default(3 if mode == "zero" else 1)|int, 1]|max %}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=taps VALUE="[]"
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=temps VALUE="[]"
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=xofs VALUE="[]"
    {% for i in range(n) %}
        # every tap from the same height and the same pause
        G1 Z3 F900
        M400
        G4 P{1500 if i == 0 else 500}
        _INDX_PROBE_PREP
        PROBE SAMPLES=1 TRIGGER_FORCE=30
        # a warm tap onto the tool's cold reference, the frame of G28 and the
        # saved offsets, when it has an expansion profile covering it
        INDX_TOOL_EXPANSION FROM=now TO=cold QUIET=1
        _TOOL_Z_TAP_STORE
    {% endfor %}
    G1 Z5 F900
    RESTORE_GCODE_STATE NAME=_tool_z_measure
    # After the restore: RESTORE_GCODE_STATE would put an old offset back
    _TOOL_Z_JUDGE MODE={mode} RECLEAN={params.RECLEAN|default(0)} LIMIT={params.LIMIT|default(0.15)} PREV={params.PREV|default("none")}

[gcode_macro _TOOL_Z_TAP_STORE]
description: Inner - keep the tap PROBE just made for TOOL_Z_MEASURE, onto the tool's cold reference when INDX_TOOL_EXPANSION (just before) had a usable profile for it
gcode:
    {% set me = printer["gcode_macro TOOL_Z_MEASURE"] %}
    {% set xr = printer["gcode_macro INDX_TOOL_EXPANSION"] %}
    {% set xo = xr.ofs|float if xr.ok|int else 0.0 %}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=taps VALUE="{me.taps + [(printer.probe.last_z_result|float + xo)|round(5)]}"
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=temps VALUE="{me.temps + [printer[printer.toolhead.extruder].temperature|float|round(1)]}"
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=xofs VALUE="{me.xofs + [(xo|round(5)) if xr.ok|int else none]}"

[gcode_macro _TOOL_Z_JUDGE]
description: Inner - judge the last measurement (its taps averaged) against the active tool's saved Z offset; MODE=zero re-zeroes only beyond the taps' noise band
# Assumes a soaked bed: a growing bed reads as residue on the tip.
# A second tap that repeats the first within 0.015 mm is real, not residue.
# The re-zero moves the whole print's Z frame, so it follows the margin rule
# [EL-PRI-035]: it shifts only when the mean of the taps is beyond 5.2 sigma
# of that mean. sigma: indx_probe_check pooled with these taps, times
# sd_up[dof] (chi-square 95 % upper bound, sqrt(dof / chi2(0.05, dof)), 30
# past 30), at least sd_floor (mm). One tap or no noise data: report only.
# The checks that stop judge the mean with the single-tap limits.
variable_sd_up: [0, 15.947, 4.415, 2.92, 2.372, 2.089, 1.915, 1.797, 1.711, 1.645, 1.593, 1.551, 1.515, 1.485, 1.46, 1.437, 1.418, 1.4, 1.384, 1.37, 1.358, 1.346, 1.335, 1.326, 1.316, 1.308, 1.3, 1.293, 1.286, 1.28, 1.274]
variable_sd_floor: 0.002
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(0)|int %}
    {% set mode = params.MODE|string %}
    {% set reclean = params.RECLEAN|float %}
    {% set limit = params.LIMIT|float %}
    {% set prev = params.PREV|string %}
    {% set tool_z = svv["t" ~ act ~ "_offset_z"]|default(0.0)|float %}
    # Same frame as G28 Z with the configured z_offset: true contact of this
    # tool lands at its offset minus the first-layer gap
    {% set gap = printer["gcode_macro _LOADCELL_TRUE"].trigger_offset|float - printer.configfile.settings.load_cell_probe.z_offset|float %}
    {% set applied = svv.zero_z_shift|default(0.0)|float if mode == "check" else 0.0 %}
    {% set taps = printer["gcode_macro TOOL_Z_MEASURE"].taps|default([]) %}
    {% set n = taps|length %}
    {% set z = (taps|sum / n) if n else printer.probe.last_z_result|float %}
    {% set dev = z - (tool_z - gap) - applied %}
    {% set repeats = prev != "none" and (dev - prev|float)|abs <= 0.015 %}
    # the re-zero's noise band (see above)
    {% set me = printer["gcode_macro _TOOL_Z_JUDGE"] %}
    {% set pc = svv.indx_probe_check|default({}) %}
    {% set pdof = (pc.n|default(0)|int - 1) if pc.sd is defined and pc.n|default(0)|int >= 2 else 0 %}
    {% set own_ss = namespace(v=0.0) %}
    {% for t in taps %}{% set own_ss.v = own_ss.v + (t - z) ** 2 %}{% endfor %}
    {% set dof = pdof + [n - 1, 0]|max %}
    {% set var = ((pdof * pc.sd|default(0)|float ** 2 + own_ss.v) / dof) if dof > 0 else 0.0 %}
    {% set s95 = [var ** 0.5 * me.sd_up[[dof, 30]|min]|float, me.sd_floor|float]|max %}
    {% set band = 5.2 * s95 / n ** 0.5 if n >= 2 and dof > 0 else 99.0 %}
    {% set ok = (reclean > 0 and dev|abs <= reclean) or (reclean <= 0 and dev|abs <= limit) or (repeats and dev|abs <= limit) %}
    # the expansion profile: every tap corrected onto the cold reference, or
    # the deviation belongs to the taps' own temperature
    {% set tz = printer["gcode_macro TOOL_Z_MEASURE"] %}
    {% set xl = tz.xofs|default([]) %}
    {% set tl = tz.temps|default([]) %}
    {% set allx = xl|length > 0 and none not in xl %}
    {% set tmean = (tl|sum / tl|length) if tl|length else printer[printer.toolhead.extruder].temperature|float %}
    {% set xmean = (xl|sum / xl|length) if allx else 0.0 %}
    {% set pf = svv["t%d_expansion" % act]|default({}) %}
    {% set tref = pf.pts[0][0]|float if allx and pf.pts is defined else tmean %}
    {% set xnote = (" (%.0f C: %+.4f mm of nozzle growth taken out by its expansion profile)" % (tmean, 0.0 - xmean)) if allx and xmean|abs >= 0.0005 else "" %}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=last_temp VALUE={"%.2f"|format(tref)}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=last_tool VALUE={act}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=last_dev VALUE={"%.4f"|format(dev)}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=last_ok VALUE={1 if ok else 0}
    SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=last_n VALUE={printer["gcode_macro TOOL_Z_MEASURE"].last_n|int + 1}
    {% if ok %}
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=pending VALUE=0
        {% if repeats and dev|abs > reclean %}
            RESPOND MSG="T{act} tapped {'%+.3f'|format(dev)} mm from its saved offset twice in a row: real, accepted"
        {% endif %}
        {% if mode == "zero" %}
            SET_GCODE_VARIABLE MACRO=TOOL_Z_MEASURE VARIABLE=last_band VALUE={"%.4f"|format([band, 9.0]|min)}
            {% if dev|abs > band %}
                RESPOND MSG="T{act} re-zero: {n} taps average {'%+.4f'|format(dev)} mm from its saved offset{xnote}, beyond the noise band of {'%.4f'|format(band)} mm (5.2 sigma of the mean): Z re-zeroed"
                _ZERO_Z_SET SHIFT={dev}
            {% else %}
                RESPOND MSG="T{act} re-zero: {n} tap{'s average' if n > 1 else ''} {'%+.4f'|format(dev)} mm from its saved offset{xnote}, {('inside the noise band of %.4f mm (5.2 sigma of the mean)' % band) if band < 90 else ('not shifted from one tap or without noise data: SAMPLES=3, or run the probe accuracy check')}: the Z frame of the G28 is kept"
            {% endif %}
        {% else %}
            RESPOND MSG="T{act} Z check: touches {'%+.3f'|format(dev)} mm from its saved offset{xnote}"
        {% endif %}
    {% elif reclean > 0 and prev == "none" %}
        # First tap beyond RECLEAN: most likely residue on the tip. Hold it
        # back; PRIME_GRID cleans once more and taps again.
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=pending VALUE=1
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=pending_dev VALUE={"%.4f"|format(dev)}
        RESPOND MSG="T{act} tapped {'%+.3f'|format(dev)} mm from its saved offset: tip probably dirty, cleaning it once more"
    {% else %}
        SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=pending VALUE=0
        _TOOL_Z_FAIL TOOL={act} DEV={dev} WHY={"offset" if repeats or reclean <= 0 else "dirty"}
    {% endif %}

[gcode_macro _TOOL_Z_FAIL]
description: Inner - a tool keeps touching away from its saved Z offset: stop priming, heater off, pause and explain
gcode:
    {% set t = params.TOOL|int %}
    {% set dev = params.DEV|float %}
    {% set where = "higher" if dev > 0 else "lower" %}
    {% if printer["gcode_macro PRIME_GRID"].active|int and printer.print_stats.state in ("printing", "paused") %}
        _PRIME_GRID_HOLD TOOL={t} WHY={params.WHY} DEV={dev}
    {% else %}
    SET_GCODE_VARIABLE MACRO=PRIME_GRID VARIABLE=failed VALUE=1
    M104 S0
    {% if params.WHY|string == "dirty" %}
        _INDX_LCD LEVEL=action MSG="T{t} Z check failed: clean nozzle"
        RESPOND TYPE=error MSG="T{t} still touches the bed {'%.2f'|format(dev|abs)} mm {where} than its saved Z offset after an extra clean, and its taps do not agree. Plastic is probably stuck to the T{t} nozzle: inspect and clean it by hand. If the nozzle is clean, were tools moved between docks without recalibrating? Then run CAL_Z first. Cancel the print, or RESUME only if you are sure."
    {% else %}
        _INDX_LCD LEVEL=action MSG="T{t} Z check failed: inspect"
        RESPOND TYPE=error MSG="T{t} consistently touches the bed {'%.2f'|format(dev|abs)} mm {where} than its saved Z offset. Inspect the T{t} nozzle for plastic or damage. Were tools moved between docks without recalibrating? If so, run CAL_Z (and the XY offset calibration) before printing. Cancel the print, or RESUME only if you are sure the offset is right."
    {% endif %}
    _INDX_RAISE MSG="T{t} Z check failed, see above"
    {% endif %}

[gcode_macro PRIME_LINE]
description: Short re-prime of the active tool at print temperature: purge spread along the first 6 mm, then a line to 10 mm
# PRIME_LINE TEMP=<print temp> X=<start> Y=<row> [LEN=10] [REFILL=<mm>]
# Takes LEN + 2 mm in +X (the wipe off the end) and under 3 mm in Y.
# Refills the nozzle after a prime that cooled it, or after a tool change,
# and leaves it at print temperature with no retraction pending.
gcode:
    {% if params.TEMP is not defined or params.X is not defined or params.Y is not defined %}
        {action_raise_error("PRIME_LINE needs TEMP=<C>, X= and Y= (the start of the line), for example PRIME_LINE TEMP=240 X=30 Y=8.")}
    {% endif %}
    {% if printer.save_variables.variables.active_tool|default(-1)|int < 0 %}
        {action_raise_error("PRIME_LINE: no tool on the head. Load a tool first.")}
    {% endif %}
    {% set temp = params.TEMP|float %}
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set len = params.LEN|default(10)|float %}
    {% set exs = printer.configfile.settings[printer.toolhead.extruder or "extruder"]|default({}) %}
    {% set fd = exs.filament_diameter|float if "filament_diameter" in exs else 1.75 %}
    {% set epm = ((0.5 - 0.2) * 0.2 + 3.1416 * 0.01) / (3.14159 * (fd / 2) ** 2) %}
    {% set zsafe = [printer.gcode_move.gcode_position.z|float, 5.0]|max %}
    # by hand, Z0.2 at the lane on a level gantry (nothing in a print); the
    # tool on the head comes back, it primes
    _INDX_LEVEL FOR="PRIME_LINE"
    SAVE_GCODE_STATE NAME=_prime_line
    G90
    M83
    G1 Z{zsafe} F900
    # Out to the clearance line first if behind it
    _INDX_TO_LANE
    G1 X{x} Y{y} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    G1 Z0.5 F600                          ; heat hovering over the spot: ooze lands in the purge
    M109 S{temp}
    {% if params.REFILL|default(0)|float > 0 %}
        G1 E{params.REFILL|float} F1200   ; push back the retraction: fills the melt zone, little comes out
    {% endif %}
    G1 Z0.3 F600
    G1 X{x + 6} E1.5 F300                  ; purge spread over 6 mm (~2 mm wide), not piled in one spot
    G1 Z0.2 F600
    G1 X{x + len} E{"%.3f"|format((len - 6) * epm)} F1200
    G1 X{x + len + 2} F3000                ; wipe off the end without extruding
    G1 Z2 F900
    RESTORE_GCODE_STATE NAME=_prime_line

[gcode_macro ZERO_Z_ACTIVE_TOOL]
description: Re-zero Z with the active tool at the Z homing spot (TOOL_Z_MEASURE MODE=zero). Needs: homed, clean tip. Moves: to the Z homing spot. Saves: zero_z_shift, global_z_offset
# The correction goes into the INDX global Z offset, which CHANGE_TOOL applies
# to every tool, so the result is the same as a G28 Z with the reference tool but measured
# with the cleaned print tool. No SET_KINEMATIC_POSITION, no force_move.
# Same as TOOL_Z_MEASURE MODE=zero; takes its RECLEAN, LIMIT and PREV too.
gcode:
    TOOL_Z_MEASURE MODE=zero {rawparams}

[gcode_macro _ZERO_Z_SET]
description: Inner - fold SHIFT into the global Z offset so the active tool's contact lands at its offset
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(0)|int %}
    {% set tool_z = svv["t" ~ act ~ "_offset_z"]|default(0.0)|float if act >= 0 else 0.0 %}
    {% set shift = params.SHIFT|float %}
    # global_z_offset = user trim + zero_z_shift; replace only the shift part
    {% set user = svv.global_z_offset|default(0.0)|float - svv.zero_z_shift|default(0.0)|float %}
    SAVE_VARIABLE VARIABLE=zero_z_shift VALUE='{"%.4f"|format(shift)}'
    SAVE_VARIABLE VARIABLE=global_z_offset VALUE='{"%.4f"|format(user + shift)}'
    SET_GCODE_OFFSET Z='{"%.4f"|format(tool_z + user + shift)}' MOVE=0
    _INDX_Z_APPLIED Z={"%.4f"|format(tool_z + user + shift)}
    {% if "z_thermal_adjust" in printer %}
        # Z was just re-measured: frame expansion counts from now
        SET_Z_THERMAL_ADJUST REF_TEMP={printer.z_thermal_adjust.temperature}
    {% endif %}
    RESPOND MSG="Z re-zeroed with T{act}: shift {'%+.4f'|format(shift)} mm from its saved offset"

[gcode_macro ZERO_Z_CLEAR]
description: Take the print start re-zero shift out of the global Z offset (PRINT_START before G28, PRINT_END). Moves: nothing. Saves: zero_z_shift 0, global_z_offset
# The shift belongs to the G28 it was measured against. Left in, the next
# G28 would apply it on top of a fresh frame. Any user trim stays.
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set shift = svv.zero_z_shift|default(0.0)|float %}
    {% if shift != 0 %}
        {% set gz = svv.global_z_offset|default(0.0)|float - shift %}
        SAVE_VARIABLE VARIABLE=global_z_offset VALUE='{"%.4f"|format(gz)}'
        SAVE_VARIABLE VARIABLE=zero_z_shift VALUE=0.0
        {% set act = svv.active_tool|default(-1)|int %}
        {% set tool_z = svv["t" ~ act ~ "_offset_z"]|default(0.0)|float if act >= 0 else 0.0 %}
        SET_GCODE_OFFSET Z='{"%.4f"|format(tool_z + gz)}' MOVE=0
        _INDX_Z_APPLIED Z={"%.4f"|format(tool_z + gz)}
    {% endif %}

[gcode_macro CAL_Z_LOADED]
description: Measure Z offsets of tools with filament loaded: prime and clean each, tap against the reference tool (ref_tool, T0 unless changed; drift interpolated out). Needs: homed, filament loaded, purge lane free. Moves: tool changes, purge lane, Z homing spot. Saves: tN_offset_z (SAVE=0: report only)
# CAL_Z_LOADED [TOOLS=1,2,3] [LOADED=1,2,3] [TEMP=240 | TEMPS=240,240,250,240] [SAMPLES=5]
# TOOLS: the tools measured (default: every tool but the reference); only
# those are picked up and tapped, the reference first and last. LOADED: which
# of them to prime and clean first (default: all of them). The prime
# temperature is each tool's recorded one (t<n>_temp) unless TEMP= or TEMPS=
# is given (240 C for a tool with none recorded).
#              [CORNER=] [COAST=20] [TAP_TEMP=70] [SAVE=ask|1|0]
# EMPTY=1: the tools in LOADED have no filament but dirty tips: each is only
# heated and coasted on the bed (no prime), then tapped as usual.
# DY=: clean that many mm in from the slot row, toward the bed center.
# SAVE=ask (default) shows old and new values with Save / Discard; SAVE=1
# saves without asking, SAVE=0 only reports.
# CAL_Z is for empty, clean tools; this one primes and cleans each tool in
# LOADED (default: every tool but the reference) in its lane slot, then taps
# the Z homing spot (median of SAMPLES). The reference tool taps first and
# last, so drift over the run is interpolated out. Every tool is held at
# TAP_TEMP for its taps, so thermal expansion is the same for all
# (TAP_TEMP=0: as it is).
variable_taps: []
gcode:
    # homed, and the gantry level for the lane slots (the run changes tools)
    _INDX_LEVEL FOR="Loaded Z offsets" HOME=1 BACK=0
    _PRIME_SLOTS COUNT={printer["gcode_macro TOOL_POSITIONS"].tool_count|int}{(" CORNER=" ~ params.CORNER) if params.CORNER else ""}
    _CAL_Z_LOADED_RUN {rawparams}

[gcode_macro _CAL_Z_LOADED_RUN]
description: Inner - CAL_Z_LOADED once the slots are laid out
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set n = tp.tool_count|int %}
    {% set ref = printer.save_variables.variables.ref_tool|default(0)|int %}
    {% set svv = printer.save_variables.variables %}
    {% set others = [] %}
    {% for i in range(n) if i != ref %}{% set _ = others.append(i) %}{% endfor %}
    # only the tools asked for are picked up and tapped [EL-CAL-020]
    {% set measured = (params.TOOLS|default(others|join(","))|string).split(",")|map("trim")|select|map("int")|reject("equalto", ref)|list %}
    {% for t in measured if t < 0 or t >= n %}
        {action_raise_error("CAL_Z_LOADED: TOOLS=%s: T%d is not a dock (0 to %d). Nothing moved." % (params.TOOLS, t, n - 1))}
    {% endfor %}
    {% set loaded = params.LOADED|default(measured|join(","))|string %}
    {% set loaded = loaded.split(",")|map("trim")|select|map("int")|list %}
    {% set temps = params.TEMPS|default("")|string %}
    {% set temps = temps.split(",")|map("trim")|select|map("float")|list if temps|length > 0 else [] %}
    {% set slots = printer["gcode_macro _PRIME_SETTINGS"].slots %}
    {% set coast = params.COAST|default(20)|float %}
    {% set samples = params.SAMPLES|default(5)|int %}
    {% set tap_temp = params.TAP_TEMP|default(70)|float %}
    # DY: move the cleaning that many mm in from the slot row (toward the bed
    # center), where a bed's front edge runs low
    {% set dy = params.DY|default(0)|float %}
    {% set into = -1.0 if slots and slots[0][1] > (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 else 1.0 %}
    SET_GCODE_VARIABLE MACRO=CAL_Z_LOADED VARIABLE=taps VALUE="[]"
    # the reference first and last: its drift over the run is interpolated out
    {% set order = [ref] + measured + [ref] %}
    {% for t in order %}
        {% set step = loop.index0 %}
        {% set prime = t in loaded and not (t == ref and step > 0) %}
        # TEMPS= per tool, else TEMP=, else the tool's recorded temperature
        {% set rec = svv["t%d_temp" % t]|default(0)|float %}
        {% set temp = temps[t] if temps|length > t else (params.TEMP|float if params.TEMP is defined else (rec if rec > 0 else 240.0)) %}
        _CAL_Z_LOADED_TOOL TOOL={t} STEP={step} PRIME={1 if prime else 0} TEMP={temp} X={slots[t][0]} Y={slots[t][1] + into * dy} COAST={coast} SAMPLES={samples} TAP_TEMP={tap_temp} EMPTY={params.EMPTY|default(0)|int}
    {% endfor %}
    _CAL_Z_LOADED_REPORT STEPS={order|length} SAVE={params.SAVE|default("ask")}

[gcode_macro _CAL_Z_LOADED_TOOL]
description: Inner - change to TOOL, prime and clean it if loaded, tap the Z homing spot
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set px = tp.probe_x|float if tp.probe_x|float >= 0 else (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% set py = tp.probe_y|float if tp.probe_y|float >= 0 else (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    M104 S0
    # a calibration: every check, also in race mode
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=1
    _INDX_CHANGE_TOOL TOOL={params.TOOL}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=0
    M104 S0
    {% if params.PRIME|int %}
        {% if not params.EMPTY|default(0)|int %}
            _PRIME_UNFREEZE TEMP={params.TEMP} X={params.X} Y={params.Y}
        {% endif %}
        PRIME_CLEAN TEMP={params.TEMP} X={params.X} Y={params.Y} COAST={params.COAST} EMPTY={params.EMPTY|default(0)|int}
    {% endif %}
    SAVE_GCODE_STATE NAME=_cal_z_loaded
    G90
    G1 Z5 F900
    # Out to the clearance line first if behind it
    _INDX_TO_LANE
    G1 X{px} Y{py} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    G1 Z3 F900
    M400
    {% set tt = params.TAP_TEMP|default(0)|float %}
    {% if tt > 0 %}
        # Same nozzle temperature for every tool: wait inside +-1.5 C, then
        # 30 s more so the nozzle and heater block are at it all through
        _INDX_PART_FAN S=0
        M104 S{tt}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={tt - 1.5} MAXIMUM={tt + 1.5}
        G4 P30000
        _CAL_Z_LOADED_SAY_TEMP TOOL={params.TOOL} HOLD={tt}
    {% endif %}
    G4 P1500
    _INDX_PROBE_PREP
    PROBE SAMPLES={params.SAMPLES} SAMPLES_RESULT=median TRIGGER_FORCE=30
    # held at TAP_TEMP: with an expansion profile, onto the cold reference
    INDX_TOOL_EXPANSION TOOL={params.TOOL} FROM=now TO=cold QUIET=1
    G1 Z5 F900
    M104 S0
    RESTORE_GCODE_STATE NAME=_cal_z_loaded
    _CAL_Z_LOADED_STORE TOOL={params.TOOL} STEP={params.STEP}

[gcode_macro _CAL_Z_LOADED_SAY_TEMP]
description: Inner - report the nozzle temperature a CAL_Z_LOADED tap starts at
gcode:
    RESPOND MSG="CAL_Z_LOADED: T{params.TOOL} tapping at {'%.1f'|format(printer.extruder.temperature)} C (held at {params.HOLD|float|round(1)} C)"

[gcode_macro _CAL_Z_LOADED_STORE]
description: Inner - remember the last tap for CAL_Z_LOADED
gcode:
    {% set taps = printer["gcode_macro CAL_Z_LOADED"].taps %}
    {% set c = printer.probe.last_z_result|float %}
    # [step, tool, contact, the expansion profile's correction onto the
    # tool's cold reference or none] (INDX_TOOL_EXPANSION right after the tap)
    {% set xr = printer["gcode_macro INDX_TOOL_EXPANSION"] %}
    {% set xo = xr.ofs|float|round(5) if xr.ok|int and xr.tool|int == params.TOOL|int else none %}
    SET_GCODE_VARIABLE MACRO=CAL_Z_LOADED VARIABLE=taps VALUE="{taps + [[params.STEP|int, params.TOOL|int, c, xo]]}"
    RESPOND MSG="CAL_Z_LOADED: T{params.TOOL} taps at {'%.4f'|format(c)}{(' (%+.4f mm onto its cold reference by its expansion profile)' % xo) if xo is not none else ''}"

[gcode_macro _CAL_Z_LOADED_REPORT]
description: Inner - offsets against the drift-corrected reference tool, report old vs new and save
gcode:
    {% set taps = printer["gcode_macro CAL_Z_LOADED"].taps %}
    {% set svv = printer.save_variables.variables %}
    {% set steps = params.STEPS|int %}
    {% set mode = params.SAVE|default("ask")|string|lower %}
    {% set r0 = taps[0][2] %}
    {% set r1 = taps[-1][2] %}
    {% set ns = namespace(vars={}, txt=[], tools=[], big=0) %}
    {% set reft = taps[0][1] %}
    {% set redo = (svv.indx_cal|default({})).redo_z|default([]) %}
    # Expansion profiles: when the reference tool's taps and a tool's tap are
    # all corrected onto their cold references, that tool's offset is the
    # cold one (the frame of CAL_Z and G28); otherwise the taps as held
    {% set rx = taps[0]|length > 3 and taps[0][3] is not none and taps[-1][3] is not none %}
    RESPOND MSG="CAL_Z_LOADED: the reference T{reft} drifted {'%+.4f'|format(r1 - r0)} mm over the run (interpolated out)"
    {% for p in taps if p[1] != reft %}
        {% set s, t, c = p[0], p[1], p[2] %}
        {% set cx = rx and p|length > 3 and p[3] is not none %}
        {% set ref = r0 + (r1 - r0) * s / (steps - 1) + ((taps[0][3] + (taps[-1][3] - taps[0][3]) * s / (steps - 1)) if cx else 0.0) %}
        {% set new = c + (p[3] if cx else 0.0) - ref %}
        {% set had = ("t%d_offset_z" % t) in svv %}
        {% set old = svv["t" ~ t ~ "_offset_z"]|default(0.0)|float %}
        {% set _ = ns.vars.update({"t%d_offset_z" % t: new|round(3)}) %}
        {% set ns.txt = ns.txt + ["T%d %+.3f (was %s)" % (t, new, ("%+.3f" % old) if had else "not set")] %}
        {% set ns.tools = ns.tools + [t] %}
        # a first measurement has nothing to change from (as CAL_Z)
        # a tool marked for redo (a new tool) is expected to change [EL-CAL-021]
        {% if had and t not in redo and (new - old)|abs > 0.1 %}{% set ns.big = 1 %}{% endif %}
        RESPOND MSG="CAL_Z_LOADED: T{t} offset {'%+.3f'|format(new)} mm (was {'%+.3f'|format(old)}, change {'%+.3f'|format(new - old)}){' (both tools onto their cold references by their expansion profiles)' if cx else ''}"
        {% if mode == "1" %}
            SAVE_VARIABLE VARIABLE=t{t}_offset_z VALUE={"%.3f"|format(new)}
        {% endif %}
    {% endfor %}
    {% if mode == "1" %}
        {% if "gcode_macro _INDX_Z_SAVED" in printer %}
            _INDX_Z_SAVED TOOLS={ns.tools|join(",")}
        {% endif %}
    {% elif mode == "ask" and "gcode_macro _INDX_PENDING_SET" in printer %}
        # Measure again keeps the route (INDX_CAL_TOOLS: XY after Save)
        {% set chain = printer["gcode_macro INDX_CAL_TOOLS"].chain|int if "gcode_macro INDX_CAL_TOOLS" in printer else 0 %}
        {% set sub = ns.tools|length != printer["gcode_macro TOOL_POSITIONS"].tool_count|int - 1 %}
        _INDX_PENDING_SET VARS='{ns.vars|tojson}' POST="_INDX_Z_SAVED~TOOLS={ns.tools|join(',')}" WHAT="Z offsets {ns.txt|join(', ')}" AGAIN="INDX_CAL_Z~LOADED=1~CHAIN={chain}{('~TOOLS=' ~ ns.tools|join(',')) if sub else ''}"
        _INDX_RUNNING STEP=none
        _INDX_PENDING_ASK TITLE="CAL_Z_LOADED: Save Offsets?" TEXT="{ns.txt|join(', ')} mm." TEXT2="{'One or more changed by more than 0.1 mm: check the tips are clean.' if ns.big else ('Changes are within 0.1 mm.' if not (ns.tools|select('in', redo)|list) else 'Changes are within 0.1 mm, apart from a tool marked for redo (a new tool).')}" WARN={ns.big}
    {% else %}
        RESPOND MSG="CAL_Z_LOADED: SAVE=0, nothing written"
    {% endif %}

[gcode_macro _TOOL_RETRACT_ADD]
description: Inner - record that the active tool was just retracted by AMOUNT mm more (PRIME_CLEAN refills it)
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% if act >= 0 %}
        SAVE_VARIABLE VARIABLE=t{act}_retracted VALUE={"%.2f"|format(svv["t" ~ act ~ "_retracted"]|default(0)|float + params.AMOUNT|float)}
    {% endif %}

[gcode_macro SOAK_CURVE]
description: Measure how long the bed must soak before homing: heat to TARGET=, tap the Z homing spot once a minute until the contact stops moving. Needs: cold bed, homed, clean cold tool. Moves: taps at the Z homing spot. Saves: the soak time for that bed temperature
# SOAK_CURVE TARGET=<bed C> [WARM=1] [MINUTES=30] [STABLE=0.002] [EVERY=60]
# Start with a cold bed, Z homed, and a clean, cold tool on the head (the reference tool). The
# contact height is logged against time, bed and frame temperature. Once the
# bed is at temperature it reports how long until the contact moves less than
# STABLE mm over three taps in a row (two minutes): a slow creep still counts
# as moving. That is the soak time to use (PRINT_START SOAK=). Stops
# then, or after MINUTES at temperature. Load cell only. SOAK_CURVE_STOP ends
# it early.
variable_active: 0
variable_target: 0.0
variable_every: 60
variable_minutes: 30.0
variable_stable: 0.002
variable_t0: 0.0
variable_t_at: -1.0
variable_z_cold: 0.0
variable_taps: []
gcode:
    {% if params.TARGET is not defined %}
        { action_raise_error("SOAK_CURVE needs TARGET=<bed C>, for example SOAK_CURVE TARGET=70") }
    {% endif %}
    # WARM=1: started on a warm bed on purpose (the setup's "Measure anyway")
    {% if printer.heater_bed.temperature|float > 40 and not params.WARM|default(0)|int %}
        { action_raise_error("SOAK_CURVE: start with a cold bed (currently %.1f C). Turn off the bed heater and wait for it to cool below 40 C, or add WARM=1 to measure from a warm bed (the soak then reads too short)." % printer.heater_bed.temperature|float) }
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("SOAK_CURVE: home first (G28), on a cold bed") }
    {% endif %}
    {% set target = params.TARGET|float %}
    SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=target VALUE={target}
    SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=minutes VALUE={params.MINUTES|default(30)|float}
    SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=stable VALUE={params.STABLE|default(0.002)|float}
    SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=every VALUE={params.EVERY|default(60)|int}
    SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=t0 VALUE={printer.toolhead.estimated_print_time}
    SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=t_at VALUE=-1.0
    SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=taps VALUE="[]"
    SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=active VALUE=1
    RESPOND MSG="SOAK_CURVE: cold tap first, then heating the bed to {target|round(1)} C"
    _SOAK_TAP
    _SOAK_STORE COLD=1
    M140 S{target}
    UPDATE_DELAYED_GCODE ID=_soak_loop DURATION={params.EVERY|default(60)|int}

[gcode_macro SOAK_CURVE_STOP]
description: Stop a running SOAK_CURVE. Moves: nothing
gcode:
    SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_soak_loop DURATION=0
    M140 S0
    RESPOND MSG="SOAK_CURVE: stopped, bed heater off"

[delayed_gcode _soak_loop]
gcode:
    {% if printer["gcode_macro SOAK_CURVE"].active|int %}
        _SOAK_TAP
        _SOAK_STORE
        _SOAK_NEXT
    {% endif %}

[gcode_macro _SOAK_TAP]
description: Inner - tap the Z homing spot (median of 3 at 30 g)
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set px = tp.probe_x|float if tp.probe_x|float >= 0 else (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% set py = tp.probe_y|float if tp.probe_y|float >= 0 else (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    SAVE_GCODE_STATE NAME=_soak_tap
    G90
    G1 Z3 F900
    # Out to the clearance line first if behind it
    _INDX_TO_LANE
    G1 X{px} Y{py} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    M400
    G4 P1500
    _INDX_PROBE_PREP
    PROBE SAMPLES=3 SAMPLES_RESULT=median TRIGGER_FORCE=30
    G1 Z3 F900
    RESTORE_GCODE_STATE NAME=_soak_tap

[gcode_macro _SOAK_STORE]
description: Inner - log the last tap against time and temperatures
gcode:
    {% set s = printer["gcode_macro SOAK_CURVE"] %}
    {% set c = printer.probe.last_z_result|float %}
    {% set now = (printer.toolhead.estimated_print_time - s.t0|float) / 60 %}
    {% set bed = printer.heater_bed.temperature|float %}
    {% set frame = printer.z_thermal_adjust.temperature|float if "z_thermal_adjust" in printer else 0.0 %}
    {% if params.COLD|default(0)|int %}
        SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=z_cold VALUE={c}
        RESPOND MSG="SOAK_CURVE: cold contact {'%+.4f'|format(c)} (bed {bed|round(1)} C)"
    {% else %}
        {% set t_at = s.t_at|float %}
        {% if t_at < 0 and bed >= s.target|float - 0.5 %}
            {% set t_at = now %}
            SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=t_at VALUE={now}
        {% endif %}
        {% set taps = s.taps + [[now|round(2), bed|round(1), c|round(4)]] if t_at >= 0 else s.taps %}
        SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=taps VALUE="{taps}"
        RESPOND MSG="SOAK_CURVE: {'%5.1f'|format(now)} min, bed {'%5.1f'|format(bed)} C, frame {'%4.1f'|format(frame)} C, contact {'%+.4f'|format(c)} ({'%+.4f'|format(c - s.z_cold|float)} vs cold){(' at temperature +%.1f min' % (now - t_at)) if t_at >= 0 else ''}"
    {% endif %}

[gcode_macro _SOAK_NEXT]
description: Inner - stop when stable or out of time, otherwise schedule the next tap
gcode:
    {% set s = printer["gcode_macro SOAK_CURVE"] %}
    {% set taps = s.taps %}
    {% set now = (printer.toolhead.estimated_print_time - s.t0|float) / 60 %}
    {% set last = taps[-3:] %}
    {% set zs = last|map(attribute=2)|list %}
    {% if last|length == 3 and (zs[-1] - zs[0])|abs <= s.stable|float %}
        {% set minutes = ((last[0][0] - s.t_at|float) + 0.5)|round(0, 'ceil')|int %}
        RESPOND MSG="SOAK_CURVE: moving less than {'%.3f'|format(s.stable|float)} mm per two minutes after {'%.1f'|format(last[0][0] - s.t_at|float)} min at temperature (moved {'%+.4f'|format(zs[-1] - taps[0][2])} mm since reaching it, {'%+.4f'|format(zs[-1] - s.z_cold|float)} since cold). Use INDX_PRINT_START SOAK={minutes}."
        SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=active VALUE=0
        # the measurement is done: bed heater off
        M140 S0
        {% if "gcode_macro _INDX_PROGRESS" in printer %}
            _INDX_PROGRESS END=1
        {% endif %}
        # Saved per bed temperature: PRINT_START uses it when SOAK= is not given
        {% if "gcode_macro _INDX_SOAK_SAVE" in printer %}
            _INDX_SOAK_SAVE BED={s.target|float} MIN={minutes}
        {% endif %}
    {% elif s.t_at|float >= 0 and now - s.t_at|float >= s.minutes|float %}
        RESPOND MSG="SOAK_CURVE: not stable within {'%.3f'|format(s.stable|float)} mm after {s.minutes|round(1)} min at temperature. Nothing saved, bed heater off."
        SET_GCODE_VARIABLE MACRO=SOAK_CURVE VARIABLE=active VALUE=0
        M140 S0
        {% if "gcode_macro _INDX_PROGRESS" in printer %}
            _INDX_PROGRESS END=1
        {% endif %}
    {% else %}
        UPDATE_DELAYED_GCODE ID=_soak_loop DURATION={s.every|int}
    {% endif %}
