#####################################################################
#  INDX PRINT START AND END
#####################################################################
#
#  INDX_PRINT_START and INDX_PRINT_END, called from the slicer or from your
#  own PRINT_START / PRINT_END (the Slicer tab on the INDX page has the
#  G-code). INDX_PRINT_SETUP (or the Print start card) sets what runs and
#  saves it in variables.cfg (indx_print); the defaults below work without it.
#
#  Order: print check (before anything heats), bed heat and soak, G28,
#  leveling and a second Z home, mesh, then PRIME_GRID.
#####################################################################

[gcode_macro _INDX_PRINT_DEFAULTS]
description: Inner - INDX_PRINT_START / INDX_PRINT_END defaults; INDX_PRINT_SETUP saves your choices over them
# level: auto | none | qgl | z_tilt | custom (level_cmd)
# mesh: adaptive | full | none | custom (mesh_cmd) | scanner (INDX_SCANNER_MESH,
#   Kalico's rapid scan with the scanner twist map; without it the full
#   load cell mesh)
# soak: auto (the time INDX_CAL_SOAK measured for that bed temperature, else
#   10 min) or minutes; soak_when_hot: skip | full
# before_home, after_mesh: one command each (a macro of yours), "" for none
# end_park: park the tool at the print end (True) or keep it on the head
# end_tip: tip shaping at the print end so the next cold pickup is not
#   frozen: ref (default, the tool G28 homes with) | used | off. As in
#   _INDX_PRINT_END_RUN [EL-MAC-004]
variable_cfg: {"level": "auto", "level_cmd": "", "level_args": "", "rehome_z": True,
               "mesh": "adaptive", "mesh_cmd": "", "mesh_args": "",
               "soak": "auto", "soak_when_hot": "skip",
               "before_home": "", "after_mesh": "", "end_park": False, "end_tip": "ref"}
gcode:

[gcode_macro INDX_PRINT_SETUP]
description: Set what INDX_PRINT_START and INDX_PRINT_END do on this printer. LEVEL=auto|none|qgl|z_tilt|custom LEVEL_CMD= LEVEL_ARGS= REHOME_Z=0|1 MESH=adaptive|full|none|custom|scanner MESH_CMD= MESH_ARGS= SOAK=auto|<min> SOAK_WHEN_HOT=skip|full BEFORE_HOME= AFTER_MESH= END_PARK=0|1 END_TIP=used|ref|off; RESET=1 back to the defaults. Without parameters: shows the setup. Moves: nothing. Saves: indx_print
gcode:
    {% set dflt = printer["gcode_macro _INDX_PRINT_DEFAULTS"].cfg %}
    {% set cur = printer.save_variables.variables.indx_print|default({}) %}
    {% set ns = namespace(c={}, bad=[]) %}
    {% if not params.RESET|default(0)|int %}
        {% for k, v in dflt.items() %}{% set _ = ns.c.update({k: cur[k] if k in cur else v}) %}{% endfor %}
    {% else %}
        {% for k, v in dflt.items() %}{% set _ = ns.c.update({k: v}) %}{% endfor %}
    {% endif %}
    {% set choices = {"level": ["auto", "none", "qgl", "z_tilt", "custom"], "mesh": ["adaptive", "full", "none", "custom", "scanner"], "soak_when_hot": ["skip", "full"], "end_tip": ["used", "ref", "off"]} %}
    {% for k in dflt %}
        {% if k|upper in params %}
            {% set v = params[k|upper]|string %}
            {% if k in choices %}
                {% if v|lower in choices[k] %}{% set _ = ns.c.update({k: v|lower}) %}{% else %}{% set ns.bad = ns.bad + ["%s=%s (one of %s)" % (k|upper, v, choices[k]|join(", "))] %}{% endif %}
            {% elif k in ["rehome_z", "end_park"] %}
                {% set _ = ns.c.update({k: v|lower in ["1", "true", "yes", "on"]}) %}
            {% elif k == "soak" %}
                {% if v|lower == "auto" %}{% set _ = ns.c.update({k: "auto"}) %}
                {% elif v|float(-1) >= 0 %}{% set _ = ns.c.update({k: v|float}) %}
                {% else %}{% set ns.bad = ns.bad + ["SOAK=%s (auto or minutes)" % v] %}{% endif %}
            {% else %}
                {% set _ = ns.c.update({k: v|trim}) %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if ns.bad %}
        {action_raise_error("INDX_PRINT_SETUP: " ~ ns.bad|join("; "))}
    {% endif %}
    {% if ns.c.level == "custom" and not ns.c.level_cmd %}
        {action_raise_error("INDX_PRINT_SETUP: LEVEL=custom needs LEVEL_CMD= (the command that levels your bed or gantry)")}
    {% endif %}
    {% if ns.c.mesh == "custom" and not ns.c.mesh_cmd %}
        {action_raise_error("INDX_PRINT_SETUP: MESH=custom needs MESH_CMD= (the command that makes your mesh)")}
    {% endif %}
    {% set changed = params|length > 0 %}
    {% if changed %}
        SAVE_VARIABLE VARIABLE=indx_print VALUE="{ns.c}"
    {% endif %}
    _INDX_PRINT_SHOW SAVED={1 if changed else 0}

[gcode_macro _INDX_PRINT_SHOW]
description: Inner - INDX_PRINT_SETUP: what INDX_PRINT_START will do (renders after the save, so it shows the saved setup)
gcode:
    {% set c = printer.save_variables.variables.indx_print|default({}) %}
    {% set dflt = printer["gcode_macro _INDX_PRINT_DEFAULTS"].cfg %}
    {% set ns = namespace(c={}) %}
    {% for k, v in dflt.items() %}{% set _ = ns.c.update({k: c[k] if k in c else v}) %}{% endfor %}
    {% set c = ns.c %}
    {% set lv = c.level %}
    {% if lv == "auto" %}
        {% set lv_txt = "auto: " ~ ("QUAD_GANTRY_LEVEL" if "quad_gantry_level" in printer else ("Z_TILT_ADJUST" if "z_tilt" in printer or "z_tilt_ng" in printer else "none (no [quad_gantry_level], [z_tilt] or [z_tilt_ng])")) %}
    {% elif lv == "custom" %}{% set lv_txt = c.level_cmd %}
    {% else %}{% set lv_txt = lv %}{% endif %}
    {% set me_txt = (c.mesh_cmd if c.mesh == "custom" else c.mesh) ~ ("" if "bed_mesh" in printer or c.mesh in ["none", "custom"] else " (no [bed_mesh]: skipped)") %}
    {% if c.mesh == "scanner" and "bed_mesh" in printer %}
        {% set me_txt = me_txt ~ ((" (INDX_SCANNER_MESH, Kalico's rapid scan with the scanner twist map, " ~ ("the scan made at the same bed temperature is reused" if printer["gcode_macro _INDX_SCAN_MESH"].mesh_reuse else "a new scan every print") ~ ". Without the twist map: the load cell mesh)") if "scanner_z_seek" in printer and "gcode_macro _INDX_SCAN_MESH" in printer else " (no [scanner_z_seek]: the full load cell mesh instead)") %}
    {% endif %}
    RESPOND MSG="INDX > Print start {'saved' if params.SAVED|default(0)|int else 'setup'}: leveling {lv_txt}{(' ' ~ c.level_args) if c.level_args else ''}{', then Z again' if c.rehome_z and lv != 'none' else ''}; mesh {me_txt}{(' ' ~ c.mesh_args) if c.mesh_args else ''}; soak {c.soak}{' min' if c.soak is number else ''}, {'skipped' if c.soak_when_hot == 'skip' else 'in full'} when the bed is already hot; before homing {c.before_home or 'nothing'}; after the mesh {c.after_mesh or 'nothing'}; print end {'parks the tool' if c.end_park else 'keeps the tool on the head'}, tip shaping {({'used': 'for every tool of the print', 'ref': 'for the tool on the head and the reference tool', 'off': 'off'})[c.end_tip]|default(c.end_tip)}."

[gcode_macro _INDX_PRINT_CFG]
description: Inner - the print start setup (saved over the defaults) for INDX_PRINT_START / INDX_PRINT_END to read
variable_c: {}
gcode:
    {% set dflt = printer["gcode_macro _INDX_PRINT_DEFAULTS"].cfg %}
    {% set cur = printer.save_variables.variables.indx_print|default({}) %}
    {% set ns = namespace(c={}) %}
    {% for k, v in dflt.items() %}{% set _ = ns.c.update({k: cur[k] if k in cur else v}) %}{% endfor %}
    SET_GCODE_VARIABLE MACRO=_INDX_PRINT_CFG VARIABLE=c VALUE="{ns.c}"

[gcode_macro INDX_PRINT_START]
description: Print start: print check, bed heat and soak, home, level, mesh, then PRIME_GRID. BED= EXTRUDER= TOOL= TOOLS= TEMPS= MATERIALS= NOZZLES= [SOAK=<min>] [LEVEL=] [MESH=] [PRIME=0] [GRID_CORNER=] [TOOLCHANGES=] [DRY=1: only list what it would do]. What runs: INDX_PRINT_SETUP. Moves: homing, leveling, mesh, tool changes, the purge lane
# TOOL=<n>: the first tool (slicer: TOOL=[initial_tool]), used for the final
# Z zero. TOOLS=<n,n,...>: every tool of the job (default: TOOL).
# DOCKS=<n,n,...>: required with a tool manager that owns T<n>; the docks the
# print uses, the first starts it (TOOL= and TOOLS= unused, TEMPS= per dock).
gcode:
    {% if params.BED is not defined or params.EXTRUDER is not defined %}
        {action_raise_error("INDX_PRINT_START: needs BED= and EXTRUDER= from the slicer (see the Slicer tab on the INDX page)")}
    {% endif %}
    # INDX Macros: what is off (one line), and where the
    # printer's own PAUSE parks (a warning when not confirmed, a stop next to
    # the docks), before anything heats [EL-SET-042] [EL-SET-043]
    _INDX_SUITE_NOTICE WHEN=print
    {% if not params.DRY|default(0)|int %}
        _INDX_PAUSE_GUARD_MACROS
    {% endif %}
    _INDX_PRINT_CFG
    {% if not params.DRY|default(0)|int %}
        # a new print: the ooze stopper park cooling line is said again
        SET_GCODE_VARIABLE MACRO=_INDX_PARK_STOPPER_NOTE VARIABLE=said VALUE="[]"
        # pressure advance a change that stopped halfway held off: back [EL-TC-076]
        _INDX_PA_RELEASE FORCE=1
    {% endif %}
    # no pressure advance until the print start has finished: its primes,
    # cleans and Z checks are not printing (_INDX_PRINT_START_RUN opens it
    # as its last step) [EL-TC-079]
    {% if "indx_tc_fast" in printer and not params.DRY|default(0)|int %}INDX_PA_GATE START=1{% endif %}
    # Remap (INDX Suite) [EL-PRI-047]: the file's slicer tools against the
    # loaded tools first; a proposal waits for the dialog, paused, before
    # anything heats or moves (_INDX_REMAP_START)
    {% if "indx_remap" in printer and "gcode_macro _INDX_REMAP_START" in printer %}
        INDX_REMAP_PLAN {rawparams}
        _INDX_REMAP_START {rawparams}
    {% else %}
        _INDX_PRINT_START_RUN {rawparams}
    {% endif %}

[gcode_macro _INDX_PRINT_START_RUN]
description: Inner - INDX_PRINT_START once the setup is read: builds the steps, then runs them (or lists them with DRY=1)
gcode:
    {% set c = printer["gcode_macro _INDX_PRINT_CFG"].c %}
    {% set svv = printer.save_variables.variables %}
    {% set dry = params.DRY|default(0)|int %}
    {% set bedtemp = params.BED|float %}
    {% set nozzletemp = params.EXTRUDER|int %}
    {% set tool = params.TOOL|default(svv.ref_tool|default(0))|int %}
    {% if tool < 0 %}{% set tool = 0 %}{% endif %}
    # the slicer list ends in a comma ({if is_extruder_used[n]}n,{endif})
    {% set tools = params.TOOLS|default(tool|string)|string|replace(" ", "") %}
    {% if tools.endswith(",") %}{% set tools = tools[:-1] %}{% endif %}
    {% if not tools %}{% set tools = tool|string %}{% endif %}
    # A tool manager that owns T<n>: the docks of the print come from it (DOCKS=)
    {% set tm = "indx_api" in printer and printer.indx_api.modes.tool_commands == "tool_manager" %}
    {% if tm %}
        {% set docks = params.DOCKS|default("")|string|replace(" ", "") %}
        {% set docks = docks.split(",")|reject("equalto", "")|join(",") %}
        {% if not docks %}
            {action_raise_error("INDX_PRINT_START: the tool manager %s owns the T<n> commands, so it must give the docks this print uses: DOCKS=<n,n,...> (the first one starts the print). Nothing ran." % printer.indx_api.tool_manager)}
        {% endif %}
        {% set ndocks = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
        {% for d in docks.split(",") if not d.isdigit() or d|int >= ndocks %}
            {action_raise_error("INDX_PRINT_START: DOCKS=%s: %s is not a dock (0 to %d). Nothing ran." % (docks, d, ndocks - 1))}
        {% endfor %}
        {% set tools = docks %}
        {% set tool = docks.split(",")[0]|int %}
    {% endif %}
    # Remap [EL-PRI-047]: the slicer's tools to docks (printer.indx_remap.map,
    # set before this ran). From here on TOOL, TOOLS and the per-tool lists
    # TEMPS, MATERIALS and NOZZLES are in docks; stool is the slicer's first tool
    {% set rmap = printer.indx_remap.map if "indx_remap" in printer and not tm else {} %}
    {% set stool = tool %}
    {% set lists = {"TEMPS": params.TEMPS|default("")|string, "MATERIALS": params.MATERIALS|default("")|string, "NOZZLES": params.NOZZLES|default("")|string} %}
    {% if rmap %}
        {% set rs = namespace(tools=[], lists={}) %}
        {% set src = {} %}
        {% for name, v in lists.items() %}
            {% set _ = src.update({name: v.split(",")}) %}
        {% endfor %}
        {% set got = {} %}
        {% for k in tools.split(",") if k|trim|length %}
            {% set ki = k|int %}
            {% set d = rmap[ki]|int if ki in rmap else ki %}
            {% if d not in rs.tools %}
                {% set rs.tools = rs.tools + [d] %}
                {% set _ = got.update({d: ki}) %}
            {% endif %}
        {% endfor %}
        {% set top = ([rs.tools|max + 1] + src.values()|map("length")|list)|max %}
        {% for name, v in src.items() %}
            {% set out = [] %}
            {% for d in range(top) %}
                # a dock the print does not use: nothing (TEMPS: 0, PRIME_GRID
                # drops empty entries and would shift the rest)
                {% set k = got[d] if d in got else -1 %}
                {% set _ = out.append(v[k] if 0 <= k < v|length else ("0" if name == "TEMPS" else "")) %}
            {% endfor %}
            {% set _ = rs.lists.update({name: out|join(",") if v|join("")|length else ""}) %}
        {% endfor %}
        {% set lists = rs.lists %}
        {% set tool = rmap[tool]|int if tool in rmap else tool %}
        {% set tools = rs.tools|join(",") %}
    {% endif %}
    {% set bed = printer.heater_bed|default({}) %}
    # A bed already at the print temperature (its target set and within 1 C)
    # is taken as soaked: a heat soak done before the print is kept
    {% set hot = bed and bed.target|float == bedtemp and bed.temperature|float >= bedtemp - 1.0 %}
    {% set ns = namespace(s=[]) %}
    # the slicer tool the print starts with (PRINT_TOOLCHANGE's bookkeeping
    # follows slicer tools)
    {% if "indx_remap" in printer %}
        {% set ns.s = ns.s + ["SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=slicer_cur VALUE=%d" % (-1 if tm else stool)] %}
    {% endif %}

    # Extension API before_prime: before the print check and the first pickup
    # (a tool manager loads its lanes into the tools here)
    {% if "indx_api" in printer and printer.indx_api.hooked %}
        {% set ns.s = ns.s + ["_INDX_EVENT EVENT=before_prime DOCKS=%s FIRST=%d" % (tools, tool)] %}
    {% endif %}
    # The file against the tools, before anything heats; a mismatch stops
    # the print (INDX_PRINT_CHECK when the preflight module is not loaded)
    {% if tm %}
        {% set ns.s = ns.s + ["_INDX_CHECK_DOCKS TOOLS=%s" % tools, "INDX_PRINT_CHECK DOCKS=%s" % tools] %}
    {% else %}
    {% if "indx_preflight" in printer %}
        {% set ns.s = ns.s + ["INDX_PREFLIGHT TOOL=%d" % stool] %}
    {% endif %}
    {% set ns.s = ns.s + ["INDX_PRINT_CHECK TOOLS=%s MATERIALS=%s NOZZLES=%s" % (tools, lists.MATERIALS, lists.NOZZLES)] %}
    {% endif %}
    {% if "indx_dock_sensor" in printer %}{% set ns.s = ns.s + ["_INDX_DSENS_BEFORE_PRINT TOOLS=%s" % tools] %}{% endif %}
    {% set ns.s = ns.s + ["_INDX_RESUME_CHECK"] %}
    # warns when the printer's own PAUSE parks in or next to the dock zone (indx_api.py)
    {% if "indx_api" in printer %}{% set ns.s = ns.s + ["_INDX_PAUSE_CHECK QUIET=1"] %}{% endif %}
    # Stations (extensions) that check the print before anything heats ([indx_station] print_start:)
    {% for m in (printer["gcode_macro _INDX_STATIONS"].print_starts if "gcode_macro _INDX_STATIONS" in printer else []) %}
        {% set ns.s = ns.s + ["%s CHANGES=%s WIPE_TOWER=%s" % (m, params.TOOLCHANGES|default(-1), params.WIPE_TOWER|default(-1))] %}
    {% endfor %}
    # the last print's re-zero shift, mesh and offset go before the fresh G28
    {% set ns.s = ns.s + ["ZERO_Z_CLEAR", "BED_MESH_CLEAR", "SET_GCODE_OFFSET Z=0", "_INDX_Z_APPLIED Z=0"] %}

    # Bed heated and soaked before homing, so Z is homed on the bed as it
    # will print. The bed is never turned off or lowered here.
    {% if bed %}
        {% set sns = namespace(t=none, m=10.0, src="default") %}
        {% for k, v in ((svv.indx_cal|default({})).soak|default({})).items() %}
            {% if k|int >= bedtemp - 3 and (sns.t is none or k|int < sns.t) %}
                {% set sns.t = k|int %}
                {% set sns.m = v|float %}
                {% set sns.src = "measured at %s C" % k %}
            {% endif %}
        {% endfor %}
        {% if params.SOAK is defined %}
            {% set soak, why = params.SOAK|float, "SOAK=" %}
        {% elif hot and c.soak_when_hot == "skip" %}
            {% set soak, why = 0, "the bed was already at temperature" %}
        {% elif c.soak is number %}
            {% set soak, why = c.soak|float, "print start setup" %}
        {% else %}
            {% set soak, why = sns.m, sns.src %}
        {% endif %}
        {% set ns.s = ns.s + ["M190 S%s" % bedtemp] %}
        {% if soak > 0 %}
            {% set ns.s = ns.s + ['RESPOND MSG="INDX > Print start: soaking the bed for %.1f min (%s)"' % (soak, why), "_INDX_SOAK_RUN SECONDS=%d" % (soak * 60)] %}
        {% else %}
            {% set ns.s = ns.s + ['RESPOND MSG="INDX > Print start: no bed soak (%s)"' % why] %}
        {% endif %}
    {% endif %}

    {% if c.before_home %}
        {% set ns.s = ns.s + [c.before_home] %}
    {% endif %}
    # X, Y, then Z with the reference tool
    {% set ns.s = ns.s + ["G28", "G90", ("G1 Z10 F%d" % ((printer.configfile.settings.printer.max_z_velocity|default(printer.configfile.settings.printer.max_velocity)|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 3000))] %}

    {% set lv_raw = params.LEVEL|default(c.level)|string|lower %}
    {% set lv = lv_raw %}
    {% if lv == "auto" %}
        {% set lv = "qgl" if "quad_gantry_level" in printer else ("z_tilt" if "z_tilt" in printer or "z_tilt_ng" in printer else "none") %}
    {% endif %}
    {% if lv != "none" %}
        {% set cmd = {"qgl": "QUAD_GANTRY_LEVEL", "z_tilt": "Z_TILT_ADJUST", "custom": c.level_cmd}[lv]|default("") %}
        {% if not cmd %}
            {action_raise_error("INDX_PRINT_START: LEVEL=%s is not auto, none, qgl, z_tilt or custom" % lv)}
        {% endif %}
        # [EL-PRI-050] auto: skip leveling when the gantry is already level (a manual QUAD_GANTRY_LEVEL
        # or Z_TILT_ADJUST before PRINT_START, or a second print on the same gantry).
        # .applied is True after a successful level and is reset to False when steppers
        # go off (stepper_enable:motor_off event handled by ZAdjustStatus._motor_off in
        # z_tilt.py; quad_gantry_level.py uses the same class via z_tilt.ZAdjustStatus).
        {% set applied_sec = "quad_gantry_level" if lv == "qgl" else ("z_tilt_ng" if "z_tilt_ng" in printer else "z_tilt") %}
        {% set skip_lv = lv_raw == "auto" and printer[applied_sec].applied|default(False) %}
        {% if not skip_lv %}
            {% set ns.s = ns.s + [(cmd ~ " " ~ c.level_args)|trim] %}
            {% if c.rehome_z %}
                # leveling moved Z: home it again
                {% set ns.s = ns.s + ["G28 Z"] %}
            {% endif %}
            {% set ns.s = ns.s + ["G90", ("G1 Z10 F%d" % ((printer.configfile.settings.printer.max_z_velocity|default(printer.configfile.settings.printer.max_velocity)|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 3000))] %}
        {% else %}
            {% set ns.s = ns.s + ['RESPOND MSG="INDX > Print start: gantry is already level, skipping %s"' % cmd] %}
        {% endif %}
    {% endif %}

    {% set me = params.MESH|default(c.mesh)|string|lower %}
    {% set ml = "" %}
    {% if me == "custom" %}
        {% set ml = (c.mesh_cmd ~ " " ~ c.mesh_args)|trim %}
    {% elif me == "scanner" and "bed_mesh" in printer and "scanner_z_seek" in printer and "gcode_macro _INDX_SCAN_MESH" in printer %}
        # Kalico's rapid scan with the scanner twist map (or the scan made at
        # this bed temperature, with mesh_reuse); without the twist map the
        # full load cell mesh, said
        {% set ns.s = ns.s + [("INDX_SCANNER_MESH PRINT_START=1 REUSE=%d BED=%.1f" % (1 if printer["gcode_macro _INDX_SCAN_MESH"].mesh_reuse else 0, bedtemp) ~ " " ~ c.mesh_args)|trim] %}
    {% elif me == "scanner" and "bed_mesh" in printer %}
        {% set ns.s = ns.s + ['RESPOND MSG="INDX > Print start: mesh scanner, but there is no [scanner_z_seek] (the scanner module): the full load cell mesh instead"', "BED_MESH_CALIBRATE"] %}
    {% elif me in ["adaptive", "full"] and "bed_mesh" in printer %}
        {% set ml = ("BED_MESH_CALIBRATE" ~ (" ADAPTIVE=1" if me == "adaptive" else "") ~ " " ~ c.mesh_args)|trim %}
    {% endif %}
    # A BED_MESH_CALIBRATE macro over Klipper's (KAMP's adaptive meshing,
    # which renames Klipper's to _BED_MESH_CALIBRATE) runs its own mesh and
    # drops the arguments: PROFILE=, PROBE=, METHOD= and the rest. Said
    # before the mesh, which still runs. INDX's scanner mesh calls the
    # renamed command itself.
    {% set cfs = printer.configfile.settings %}
    {% set mw = ml.split() %}
    {% if mw and mw[0]|upper == "BED_MESH_CALIBRATE" and "gcode_macro bed_mesh_calibrate" in cfs and mw[1:]|reject("equalto", "ADAPTIVE=1")|list %}
        {% set w = cfs["gcode_macro bed_mesh_calibrate"] %}
        {% set who = "KAMP's BED_MESH_CALIBRATE" if "gcode_macro _kamp_settings" in cfs else "The BED_MESH_CALIBRATE macro in your config" %}
        {% set ns.s = ns.s + ['RESPOND TYPE=error MSG="INDX ! Print start: %s drops the mesh arguments (%s). To keep them call %s in the mesh command (MESH=custom)"' % (who, mw[1:]|join(" "), (w.rename_existing|string|upper if "rename_existing" in w else "the command it renames") or "_BED_MESH_CALIBRATE")] %}
    {% endif %}
    {% if ml %}
        {% set ns.s = ns.s + [ml] %}
    {% endif %}
    {% if c.after_mesh %}
        {% set ns.s = ns.s + [c.after_mesh] %}
    {% endif %}

    # every tool primed, cleaned and Z-checked; the first re-zeroes Z
    {% set ns.s = ns.s + ["PRIME_GRID TOOLS=%s FIRST=%d TEMP=%d" % (tools, tool, nozzletemp) ~ ((" ENABLE=" ~ params.PRIME) if params.PRIME is defined else "") ~ ((" CORNER=" ~ params.GRID_CORNER) if params.GRID_CORNER else "") ~ ((" TEMPS=" ~ lists.TEMPS) if lists.TEMPS else "")] %}
    # the wipe tower for PRINT_TOOLCHANGE when its line has no TOWER= (after
    # PRIME_GRID, which clears it) [EL-PRI-044]
    {% if params.WIPE_TOWER|default("")|string|trim in ["0", "1"] %}
        {% set ns.s = ns.s + ["SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=tower VALUE=%s" % params.WIPE_TOWER|string|trim] %}
    {% endif %}

    # the print start is done: pressure advance for the print file [EL-TC-079]
    {% if "indx_tc_fast" in printer %}
        {% set ns.s = ns.s + ["INDX_PA_GATE START=0"] %}
    {% endif %}
    {% if dry %}
        RESPOND MSG="INDX > INDX_PRINT_START DRY=1: nothing runs. It would do, in order:"
        {% for l in ns.s %}
            RESPOND MSG="INDX >   {loop.index}. {l|replace('"', '')}"
        {% endfor %}
    {% else %}
        {% for l in ns.s %}
            {l}
        {% endfor %}
    {% endif %}

# The bed soak in 5 s steps. Each step renders when it runs, so it sees a
# skip sent through indx_clog's webhook (Skip soak, POST /server/indx/soak/skip);
# a typed command waits for the gcode mutex. INDX Macros: runs to its end.
[gcode_macro _INDX_SOAK_RUN]
description: Inner - the print start bed soak in 5 s steps, so Skip soak on the INDX page can end it. SECONDS=
gcode:
    {% set secs = [params.SECONDS|default(0)|int, 0]|max %}
    {% if "indx_clog" in printer %}
        _INDX_SOAK_STATE START=1 SECONDS={secs}
        RESPOND MSG="INDX > Print start: Skip soak on the INDX page ends the soak (Moonraker: POST /server/indx/soak/skip). A typed command waits until the print start is done."
    {% else %}
        RESPOND MSG="INDX > Print start: the soak cannot be skipped on this install (no indx_clog module, and typed commands wait until the print start is done)."
    {% endif %}
    # the part of a 5 s step first, so the minutes left fall on whole steps
    {% if secs % 5 %}
        _INDX_SOAK_STEP MS={(secs % 5) * 1000}
    {% endif %}
    {% for i in range(secs // 5) %}
        {% set left = (secs // 5 - i) * 5 %}
        _INDX_SOAK_STEP MS=5000{(" LEFT=%d" % left) if left % 60 == 0 and left < secs else ""}
    {% endfor %}
    {% if "indx_clog" in printer %}
        _INDX_SOAK_STATE END=1
    {% endif %}

[gcode_macro _INDX_SOAK_STEP]
description: Inner - one step of the print start bed soak: waits MS= unless the soak was skipped. LEFT= says the minutes left
gcode:
    {% set s = printer.indx_clog.soak|default({}) if "indx_clog" in printer else {} %}
    {% if not s.skip|default(false) %}
        {% if params.LEFT is defined %}
            RESPOND MSG="INDX > Print start: soak, {(params.LEFT|int / 60)|round|int} min left.{' Skip: Skip soak on the INDX page.' if s else ''}"
        {% endif %}
        G4 P{params.MS|default(5000)|int}
    {% endif %}

[gcode_macro INDX_PRINT_END]
description: Print end: retract the last tool to its tool change retraction and record it, heaters off, park the head (and the tool with end_park). RETRACT=<mm> RETRACTED=<mm> from the slicer. Moves: up and to the back (and a park)
gcode:
    # the print's end is not printing: no pressure advance from here [EL-TC-079]
    {% if "indx_tc_fast" in printer %}INDX_PA_GATE END=1{% endif %}
    _INDX_PRINT_CFG
    _INDX_PRINT_END_RUN {rawparams}

[gcode_macro _INDX_PRINT_END_RUN]
description: Inner - INDX_PRINT_END once the setup is read
gcode:
    {% set c = printer["gcode_macro _INDX_PRINT_CFG"].c %}
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + 5, th.axis_maximum.z]|min %}
    # The tool ends up retracted by RETRACT in all (RETRACTED: what the
    # slicer already did), recorded so the next prime refills it exactly.
    # At least its park total (_TC_INFILL park_retract_mm, its own
    # t<n>_park_retract_mm), as a tool parked in a change [EL-PRI-044]
    {% set sv0 = printer.save_variables.variables %}
    {% set a0 = sv0.active_tool|default(-1)|int %}
    {% set ci = printer["gcode_macro _TC_INFILL"] if "gcode_macro _TC_INFILL" in printer else {} %}
    {% set lpt = ci.live_park_tool if ci.live_park_tool is mapping else {} %}
    {% set lv = lpt[a0] if a0 in lpt else none %}
    {% set so = sv0["t%d_park_retract_mm" % a0] if ("t%d_park_retract_mm" % a0) in sv0 else none %}
    {% set glob = ci.live_park if ci.live_park is number else ci.park_retract_mm|default(0.0) %}
    {% set ptot = [[(lv if lv is number and lv >= 0 else (glob if lv is number else (so if so is number and so >= 0 else glob)))|float, 0.0]|max, 15.0]|min if a0 >= 0 else 0.0 %}
    {% set retract = [params.RETRACT|default(5)|float, ptot]|max %}
    {% set already = params.RETRACTED|default(0)|float %}
    {% set more = [retract - already, 0]|max %}
    M400
    G92 E0
    M83
    # _INDX_RETRACT skips it on a tool that has not moved forward since its
    # pickup (a cancel during the print start): that would pull the latch open
    _INDX_RETRACT E={more} F=2100 TOTAL={[retract, already]|max} BASE={already}
    # Tip shaping (end_tip), so the next cold pickup is not frozen (a frozen
    # tool may not probe). On the head: shaped where it stands, still hot.
    # In its dock: picked up and shaped over its own purge slot. [EL-MAC-004]
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set ref = svv.ref_tool|default(0)|int %}
    {% set tip = c.end_tip|default("ref")|string|lower %}
    {% set grid = printer["gcode_macro PRIME_GRID"].grid %}
    # the tools a purge station primed at their first pickup count too (PRIME_GRID bucket)
    {% set used = (grid.tools|default([]) + grid.bucket|default([])) if grid else [] %}
    {% set others = (used|reject("equalto", act)|list) if tip == "used" else ([ref] if tip == "ref" and ref != act else []) %}
    {% if (tip == "used" or (tip == "ref" and act == ref)) and act >= 0 %}
        _INDX_TIP_SHAPE_TOOL TOOL={act} MODE=here
    {% endif %}
    TURN_OFF_HEATERS
    # a cancel before anything homed (a print waiting at its first dialog):
    # heaters and fan off and the state cleared, no move
    {% set homed = "xyz" in th.homed_axes %}
    {% if not homed %}
        RESPOND MSG="INDX > Print end: not homed, nothing moves (heaters off)"
    {% endif %}
    G90
    {% if homed %}
    G0 Z{z_safe} F{(printer.configfile.settings.printer.max_z_velocity|default(printer.configfile.settings.printer.max_velocity)|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 3000}
    {% if others %}
        _INDX_PRINT_END_TIPS TOOLS={others|join(",")} Z={z_safe}
    {% endif %}
    {% if c.end_park and printer.save_variables.variables.active_tool|default(-1)|int >= 0 %}
        PARK_TOOL
    {% endif %}
    G90
    G0 X{(th.axis_minimum.x + th.axis_maximum.x) / 2} Y{th.axis_maximum.y - 2} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}   ; to the back, away from the docks
    {% endif %}
    _INDX_PART_FAN S=0
    BED_MESH_CLEAR
    ZERO_Z_CLEAR                   ; the re-zero shift only holds for this print's G28
    _INDX_PRINT_STATE_CLEAR        ; no hold or print start state outlives the print [EL-MAC-005]
    SET_GCODE_VARIABLE MACRO=_PURGE_LANE VARIABLE=pre VALUE=[]

[gcode_macro _INDX_PRINT_END_TIPS]
description: Inner - INDX_PRINT_END: shape the tips of the other tools of the print (TOOLS=), each picked up, unfrozen and shaped in the air over its own purge lane slot at Z= (above the print), heater off after each
gcode:
    {% set grid = printer["gcode_macro PRIME_GRID"].grid %}
    # each tool's own slot of this print start (_PURGE_LANE own)
    {% set own = printer["gcode_macro _PURGE_LANE"].own if "gcode_macro _PURGE_LANE" in printer else {} %}
    {% set svv = printer.save_variables.variables %}
    {% for t in params.TOOLS.split(",")|map("int") %}
        {% set temp = svv["t%d_temp" % t]|default(0)|int if svv["t%d_temp" % t]|default(0)|int > 0 else 230 %}
        {% if grid and t in grid.tools|default([]) and t in own %}
            {% set sl = own[t] %}
            _INDX_CHANGE_TOOL TOOL={t}
            _INDX_TIP_SHAPE_TOOL TOOL={t} TEMP={temp} MODE=air X={sl[0]} Y={sl[1]} Z={params.Z}
            M104 S0
        {% else %}
            RESPOND MSG="INDX > Print end: T{t} has no purge lane slot in this print, its tip is not shaped (INDX_TIP_SHAPE TOOL={t} does it)"
        {% endif %}
    {% endfor %}
