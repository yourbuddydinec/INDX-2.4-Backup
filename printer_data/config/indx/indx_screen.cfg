# INDX on screens: the helpers the LCD menu (indx_menu.cfg) and INDX_CLEAN_TOOL
# use, which load on every printer (the menu file only with a [display]).
# On a touch screen (KlipperScreen), and in any interface that shows
# macro prompts (Mainsail, Fluidd): actions that need a tool open a dialog
# with one button per dock, so the screen menu follows the docks and the
# tool names without editing it. klipperscreen/indx.conf is the menu.
#
#   INDX_SCREEN_TOOLS ACTION=change|load|unload|clean|coldpull|prime|zcheck|dockcheck|onhead
#       the dialog; nothing moves until a tool is picked (picking it is the
#       second step for the actions that heat or move without asking)
#
# Copyright (C) 2026 Bondtech AB. GPLv3.

[gcode_macro INDX_SCREEN_TOOLS]
description: Pick a tool for an action in a dialog (KlipperScreen, Mainsail, Fluidd): ACTION=change, load, unload, clean, coldpull, prime, zcheck, dockcheck or onhead. Moves: nothing until a tool is picked
gcode:
    {% set a = params.ACTION|default("change")|lower %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set n = tp.tool_count|default(1)|int %}
    {% set noheat = tp.no_heat_tools|default([]) %}
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set info = {
        "change": ["Change Tool", "Pick the tool to put on the head. Homes first if needed."],
        "load": ["Load Filament", "Pick the tool. Then pick the material: Load says what will move before it heats."],
        "unload": ["Unload Filament", "Pick the tool. It is picked up, heated, the tip is formed and the filament pulled out of the gears."],
        "clean": ["Hot Cleaning", "Pick the tool. It goes to the cleaning spot and heats to 170 °C so you can clean the nozzle by hand. Heater off when you are done."],
        "coldpull": ["Cold Pull", "Pick the tool. It asks before it heats and moves."],
        "prime": ["Prime Test", "Pick the tool. It is picked up, heated and primed over the purge lane: a full blob means it flows."],
        "zcheck": ["Check Z", "Pick the tool. It is picked up and taps the Z homing spot: the result is how far it is from its saved Z offset."],
        "onhead": ["Mark a Tool as Seated", "Pick it. You are then asked whether it is locked on (recorded, nothing moves) or loose (the latch locks on it)."],
        "dockcheck": ["Check a Dock Slowly", "Pick the dock. With the head empty, it drives slowly to just before the dock so you can see the pins line up, then you step in 1 mm at a time."]} %}
    {% if a not in info %}
        {action_raise_error("INDX_SCREEN_TOOLS: ACTION=change, load, unload, clean, coldpull, prime, zcheck, dockcheck or onhead")}
    {% endif %}
    {% set heats = a not in ("change", "dockcheck", "onhead") %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin {info[a][0]}"
    RESPOND TYPE=command MSG="action:prompt_text {info[a][1]}"
    {% set ns = namespace(k=0) %}
    {% for t in range(n) %}
        {% if not (heats and t in noheat) %}
            {% if ns.k % 2 == 0 %}RESPOND TYPE=command MSG="action:prompt_button_group_start"{% endif %}
            {% set nm = svv["t" ~ t ~ "_name"]|default("")|string %}
            {% set mat = svv["t" ~ t ~ "_material"]|default("")|string %}
            {% set label = "T%d%s%s%s" % (t, (" " ~ nm) if nm else "", (" · " ~ mat) if mat and mat != "NONE" else "", " (on the head)" if t == act else "") %}
            RESPOND TYPE=command MSG="action:prompt_button {label}|_INDX_SCREEN_RUN ACTION={a} TOOL={t}|{'primary' if t == act else 'secondary'}"
            {% if ns.k % 2 == 1 %}RESPOND TYPE=command MSG="action:prompt_button_group_end"{% endif %}
            {% set ns.k = ns.k + 1 %}
        {% endif %}
    {% endfor %}
    {% if ns.k % 2 == 1 %}RESPOND TYPE=command MSG="action:prompt_button_group_end"{% endif %}
    {% if ns.k == 0 %}RESPOND TYPE=command MSG="action:prompt_text No tool with heating in a dock."{% endif %}
    {% if a == "clean" and ns.k > 1 %}RESPOND TYPE=command MSG="action:prompt_button Clean all tools in turn|_INDX_SCREEN_RUN ACTION=cleanall TOOL=-1|primary"{% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|_INDX_PROMPT_END|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _INDX_SCREEN_RUN]
description: Inner - run the action picked in INDX_SCREEN_TOOLS on TOOL=n
gcode:
    {% set t = params.TOOL|int %}
    {% set a = params.ACTION|lower %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if a == "change" %}
        T{t}
    {% elif a == "load" %}
        INDX_LOAD TOOL={t}
    {% elif a == "unload" %}
        INDX_UNLOAD TOOL={t}
    {% elif a == "cleanall" %}
        INDX_CLEAN_ALL
    {% elif a == "clean" %}
        INDX_CLEAN_TOOL TOOL={t}
    {% elif a == "coldpull" %}
        INDX_COLD_PULL TOOL={t}
    {% elif a == "prime" %}
        T{t}
        PRIME_CLEAN
    {% elif a == "zcheck" %}
        T{t}
        TOOL_Z_MEASURE
    {% elif a == "dockcheck" %}
        INDX_CAL_DOCK_CHECK TOOL={t}
    {% elif a == "onhead" %}
        INDX_SEAT_TOOL_BY_HAND TOOL={t} LOCKED=1
    {% endif %}

# ---- helpers for the LCD menu (indx_menu.cfg) and the cleaning spot ----
[gcode_macro _INDX_MENU_NEXT]
description: Inner - LCD: work out the next setup step and show it on the display
gcode:
    _INDX_BUILD_TOOLS
    _INDX_SEAT_G
    _INDX_PAUSE_PARK_STATE
    _INDX_STATUS_COMPUTE
    _INDX_MENU_NEXT_SHOW

[gcode_macro _INDX_MENU_NEXT_SHOW]
description: Inner - LCD: M117 the stored next step
gcode:
    {% set s = printer["gcode_macro _INDX_STATE"] %}
    {% if s.next %}
        M117 > {s.done}/{s.total} {('step %d: ' % s.next_group_n|int) if s.next_group_n|int else 'next: '}{s.next_text}
    {% else %}
        M117 ok INDX setup complete
    {% endif %}
    INDX_STATUS BRIEF=1

[gcode_macro _INDX_MENU_COOLING]
description: Inner - LCD: the part cooling choice of the hardware checks, on the display (VALUE= one of the INDX_SETTING choices for _INDX_MACHINE part_cooling); then the heater model can run
gcode:
    INDX_SETTING MACRO=_INDX_MACHINE VAR=part_cooling VALUE={params.VALUE}
    _INDX_MENU_COOLING_SAID

[gcode_macro _INDX_MENU_COOLING_SAID]
description: Inner - LCD: say the part cooling just chosen, and what still needs the INDX page or the console
gcode:
    {% set m = printer["gcode_macro _INDX_MACHINE"] %}
    {% set cfg = printer.configfile.settings %}
    {% set gens = [] %}
    {% for k in cfg if k.startswith("fan_generic ") %}{% set _ = gens.append(k) %}{% endfor %}
    M117 ok Cooling: {m.names[m.part_cooling]|default(m.part_cooling)|truncate(28, True, "")}
    {% if m.part_cooling != "none" and gens and not m.part_fan|default("")|string %}
        RESPOND MSG="INDX > Part cooling set from the display. printer.cfg has a [fan_generic]: say which fan is the part fan in the hardware checks (INDX_CAL_HARDWARE Q=2) or Settings, Part fan; until then INDX uses [fan]."
    {% endif %}

[gcode_macro _INDX_MENU_HEATER]
description: Inner - LCD: the heater model, once the part cooling is chosen (the choice is in the same menu); with no part fan the fan calibration is skipped
gcode:
    {% set pc = printer["gcode_macro _INDX_MACHINE"].part_cooling|default("not_set") %}
    {% if pc == "not_set" %}
        M117 > Pick cooling first
        RESPOND MSG="INDX > Heater model: choose the part cooling first (the Cooling entry in this menu, the hardware checks, or Settings): the fan term is measured with it. Nothing moved."
    {% else %}
        INDX_CAL_HEATER CONFIRM=1 FAN={0 if pc == "none" else 1}
    {% endif %}

[gcode_macro _INDX_MENU_PENDING]
description: Inner - LCD: show the result waiting for Save
gcode:
    {% set p = printer.save_variables.variables.indx_pending|default({}) %}
    {% if p and (p.vars|default({}) or p.post|default([])) %}
        M117 > {p.what|default('')|truncate(40, True, '')}
    {% else %}
        M117 Nothing to save
    {% endif %}

[gcode_macro TOOL_CLEAN_HEAT]
description: Bring the tool on the head (or TOOL=n) to the cleaning spot and heat it (TEMP=, default 170 C) so you can clean the nozzle by hand. Needs: a tool on the head or TOOL= (homes if needed, then puts that tool back on). Moves: up to Z60 at least, out to Y5, along X, then in Y to the spot. Heats: the nozzle
# The spot: x (-1 = bed center) and y, gcode coordinates
variable_x: -1.0
variable_y: 20.0
variable_z_min: 60.0
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set t = params.TOOL|default(act)|int %}
    {% if t < 0 %}
        {action_raise_error("TOOL_CLEAN_HEAT: no tool on the head. Pick one up first, or give TOOL=n.")}
    {% endif %}
    # G28 homes Z with the reference tool, so an unhomed printer comes back
    # with the reference tool on the head. CHANGE_TOOL homes before it plans the swap and then
    # picks the requested tool against the tool that is really on the head:
    # the same restore every other INDX command gets from it.
    {% if t != act or "xyz" not in printer.toolhead.homed_axes %}
        _INDX_CHANGE_TOOL TOOL={t} COLD=1
    {% endif %}
    _TOOL_CLEAN_HEAT_GO TOOL={t} TEMP={params.TEMP|default(170)|int}

[gcode_macro _TOOL_CLEAN_HEAT_GO]
description: Inner - TOOL_CLEAN_HEAT after any homing and tool change: the route to the cleaning spot, then heat TOOL= only
gcode:
    {% set me = printer["gcode_macro TOOL_CLEAN_HEAT"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    # Renders after the home and the change: never heat a tool other than the
    # one asked for
    {% if act != params.TOOL|int or "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("TOOL_CLEAN_HEAT: T%d was asked for but %s, so nothing is heated. Run CHANGE_TOOL TOOL=%d (homes if needed), then TOOL_CLEAN_HEAT again." % (params.TOOL|int, ("T%d is on the head" % act) if act >= 0 else "the head is empty", params.TOOL|int))}
    {% endif %}
    {% set th = printer.toolhead %}
    {% set g = printer.gcode_move.gcode_position %}
    {% set x = me.x|float if me.x|float >= 0 else (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% set z = [g.z|float, me.z_min|float]|max %}
    G90
    G1 Z{"%.3f"|format(z)} F1200
    # Out to the clearance line first if behind it
    _INDX_TO_LANE
    # Out of the dock strip first, straight, then along X, then in Y
    {% if g.y|float < 5 %}
        G1 Y5 F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    {% endif %}
    G1 X{"%.3f"|format(x)} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    G1 Y{"%.3f"|format([me.y|float, 5]|max)} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    M104 S{params.TEMP|int}
