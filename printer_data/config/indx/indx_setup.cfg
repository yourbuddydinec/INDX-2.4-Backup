#####################################################################
#  INDX SETUP AND CALIBRATION
#####################################################################
#
#  Include after the other INDX files:
#    [include indx/indx_setup.cfg]
#
#  One front door: INDX_SETUP shows what is done, what is next and why,
#  and offers the next step as a button (Mainsail, Fluidd, KlipperScreen,
#  the INDX web page) and as a command in the console. INDX_STATUS prints
#  the whole picture. Every step also runs on its own from the console.
#
#  Console lines start with "INDX ok", "INDX >" (action needed) or
#  "INDX !" (warning), so the meaning does not depend on color.
#
#  What INDX remembers lives in variables.cfg:
#    indx_cal          setup progress (a dict, see _INDX_CAL_SET)
#    t<n>_dock_x/_y    measured docks; t<n>_dock_new = not yet driven into
#    indx_clearance    "auto" or a number, wins over clearance_y in indx.cfg
#    lc_trigger_offset measured load cell trigger offset
#  Jinja has no clock, so ages are counted in tool changes.
#####################################################################

#####################################################################
#  1. STATE
#####################################################################

[gcode_macro _INDX_CAL_SET]
description: Inner - set one key of the indx_cal record in variables.cfg. KEY= VALUE= a JSON literal: 1, "text", [1, 2], {"80": 9}
# Each call reads the record fresh (it renders when it runs), so several calls
# in a row from one macro all land. The other keys are written back as JSON,
# which SAVE_VARIABLE reads as a Python literal (no true/false/null used).
gcode:
    {% set cal = printer.save_variables.variables.indx_cal|default({}) %}
    {% set k = params.KEY|lower %}
    {% set rest = {} %}
    {% for kk, vv in cal.items() if kk != k %}
        {% set _ = rest.update({kk: vv}) %}
    {% endfor %}
    {% set item = '"' ~ k ~ '": ' ~ params.VALUE|default("1") %}
    {% set j = rest|tojson %}
    {% set out = ("{" ~ item ~ "}") if rest|length == 0 else ("{" ~ item ~ ", " ~ j[1:]) %}
    SAVE_VARIABLE VARIABLE=indx_cal VALUE='{out}'

[gcode_macro _INDX_SRC]
description: Inner - note where values came from: KEYS= comma list (dock_0, trigger, z_1, xy_1, soak_60, clearance), SRC=cal (a calibration measured it) or manual (typed in). Saves: indx_src
gcode:
    {% set src = printer.save_variables.variables.indx_src|default({}) %}
    {% set d = {} %}
    {% if src is mapping %}{% for k, v in src.items() %}{% set _ = d.update({k: v}) %}{% endfor %}{% endif %}
    {% set how = "manual" if params.SRC|default("cal")|lower == "manual" else "cal" %}
    {% for k in (params.KEYS|default("")|string|lower|replace(" ", "")).split(",") if k %}
        {% set _ = d.update({k: how}) %}
    {% endfor %}
    SAVE_VARIABLE VARIABLE=indx_src VALUE="{d}"

[gcode_macro _INDX_CAL_REDO]
description: Inner - mark or clear tools whose offsets need redoing. KIND=z|xy, ADD=<n,n> or CLEAR=<n,n|all>. SOFT=1 marks a light "check recommended" instead (offsets restored from a stored tool); clearing a redo mark clears that too
gcode:
    _INDX_CAL_REDO_SET {rawparams}
    # Clearing a redo clears the check mark too; a separate macro, as Klipper
    # refuses a macro calling itself
    {% if params.CLEAR is defined and not params.SOFT|default(0)|int %}
        _INDX_CAL_REDO_SET KIND={params.KIND} CLEAR={params.CLEAR} SOFT=1
    {% endif %}

[gcode_macro _INDX_CAL_REDO_SET]
description: Inner - _INDX_CAL_REDO for one mark list (redo_, or check_ with SOFT=1)
gcode:
    {% set key = ("check_" if params.SOFT|default(0)|int else "redo_") ~ params.KIND|lower %}
    {% set cur = printer.save_variables.variables.indx_cal|default({}) %}
    {% set lst = cur[key]|default([]) %}
    {% set add = params.ADD|default("")|string %}
    {% set add = add.split(",")|map("trim")|select|map("int")|list %}
    {% set clr = params.CLEAR|default("")|string %}
    {% if clr == "all" %}
        {% set new = [] %}
    {% else %}
        {% set clr = clr.split(",")|map("trim")|select|map("int")|list %}
        {% set new = (lst + add)|unique|reject("in", clr)|list|sort %}
    {% endif %}
    _INDX_CAL_SET KEY={key} VALUE='{new|tojson}'

[gcode_macro _INDX_CAL_XY_DONE]
description: Inner - TOOL=n has a fresh XY offset: note it and clear its redo mark
gcode:
    {% set t = params.TOOL|int %}
    {% set cur = printer.save_variables.variables.indx_cal|default({}) %}
    {% set lst = (cur.xy|default([]) + [t])|unique|list|sort %}
    _INDX_CAL_SET KEY=xy VALUE='{lst|tojson}'
    _INDX_CAL_REDO KIND=xy CLEAR={t}
    _INDX_SRC KEYS=xy_{t} SRC={params.SRC|default("cal")}

[gcode_macro INDX_NOZZLE_CHANGED]
description: Mark TOOL=n's Z and XY offsets for redo after a nozzle swap. Moves: nothing. Saves: indx_cal redo marks (INDX_STATUS shows them)
gcode:
    {% if "TOOL" not in params %}
        {action_raise_error("Usage: INDX_NOZZLE_CHANGED TOOL=<n>")}
    {% endif %}
    {% set t_str = params.TOOL|string|trim %}
    {% if t_str|int|string != t_str %}
        {action_raise_error("INDX_NOZZLE_CHANGED: TOOL= must be a whole number. Got: " ~ t_str)}
    {% endif %}
    {% set t = t_str|int %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% if t < 0 or t >= n %}
        {action_raise_error("INDX_NOZZLE_CHANGED: TOOL= %d is out of range, must be 0 to %d." % (t, [n - 1, 0]|max))}
    {% endif %}
    _INDX_CAL_REDO KIND=z ADD={t}
    _INDX_CAL_REDO KIND=xy ADD={t}
    RESPOND MSG="INDX > T{t}: Z and XY offsets marked for redo. INDX_SETUP takes you there."

[gcode_macro _INDX_STEPS]
description: Inner - the setup steps in order (read by INDX_SETUP, INDX_STATUS and the INDX web page)
# key, label, the command that starts it, what it needs, what moves, time.
# The keys are stored in indx_cal and read by the web page: never rename them.
# The order keeps tool handling and heat cycles down (docs/setup-streamline.md):
# everything that needs empty tools comes before any heat, and the reference
# tool loads last and ends on the head fully locked.
variable_steps: [
    {"key": "hw", "label": "Hardware checks and part cooling", "cmd": "INDX_CAL_HARDWARE", "needs": "Power on", "moves": "Nothing", "time": "5 min"},
    {"key": "lc", "label": "Load cell and the reference tool's dock, one slide", "cmd": "INDX_CAL_LOADCELL", "needs": "An empty head (a new head has no tool; a tool already on it comes off first) and the reference tool (T0 unless changed), empty, in its dock: you slide the head onto it, INDX locks it, measures the dock and calibrates; it stays on for the first home", "moves": "X and Y home, the latch, X and Y home again from the dock with the reference tool, then Klipper restarts (SAVE_CONFIG)", "time": "5 min"},
    {"key": "home", "label": "First home, machine checks and trigger offset", "cmd": "INDX_SETUP STEP=home", "needs": "Load cell calibrated and saved; the reference tool on the head (from the load cell step) or a measured dock to fetch it from; clean and cold", "moves": "All axes home with the reference tool, then the machine checks (endstops, probe) and the trigger offset, in one go", "time": "7 min"},
    {"key": "homing", "label": "Machine checks: endstops and probe", "cmd": "INDX_MACHINE_CHECKS", "needs": "Homed, the reference tool clean and cold", "moves": "X and Y creep onto their endstops 10 times each, then the reference tool taps the Z homing spot 10 times", "time": "4 min"},
    {"key": "trigger", "label": "Load cell trigger offset", "cmd": "INDX_CAL_TRIGGER", "needs": "The reference tool clean and cold, homed", "moves": "G28 Z, then taps at the Z homing spot", "time": "3 min"},
    {"key": "docks", "label": "Docks, one at a time, until the last", "cmd": "INDX_DOCKS", "needs": "Each tool in its dock, the head empty (the reference tool is parked by INDX once its dock is measured; another tool comes off by hand, under 70 C, into its dock), motors off. You say how many docks there are: Add the next dock for each one, That was the last dock after it (one tool: at once)", "moves": "Homed: INDX drives the empty head in front of where it expects the next dock, at the clearance line; you slide it straight onto the docked tool, then X and Y home and the dock is added", "time": "3 min per tool"},
    {"key": "clearance", "label": "Dock clearance line", "cmd": "INDX_SET_CLEARANCE AUTO=1", "needs": "Docks measured", "moves": "Nothing", "time": "1 min"},
    {"key": "test", "label": "Tool change test, latch homing and lock force", "cmd": "INDX_TEST_ALL_TOOLS SETUP=1", "needs": "Docks and clearance, all tools empty (no filament), the bed clear", "moves": "Every tool picked up and parked, slowly the first time; then only the latch; then every tool picked up 3 times", "time": "3 min, plus 2 min and 1 min per tool on the INDX Suite"},
    {"key": "latch", "label": "Latch homing", "cmd": "INDX_CAL_LATCH", "needs": "Docks tested, homed", "moves": "Parks the tool on the head, then only the latch", "time": "2 min"},
    {"key": "lock", "label": "Lock force per tool", "cmd": "INDX_CAL_LOCK", "needs": "Latch homing, all tools empty", "moves": "Every tool picked up 3 times", "time": "1 min per tool"},
    {"key": "heater", "label": "Heater safety model", "cmd": "INDX_CAL_HEATER", "needs": "Homed, part cooling chosen; INDX fetches the first tool to load, empty. SAVE_CONFIG comes at the end of the setup; the part fan term takes assumed values for the chosen part cooling until INDX_CAL_FAN measures it (optional, with the bed soak)", "moves": "Heats the nozzle through a ramp in the air, part fan off", "time": "5 to 10 min"},
    {"key": "clean", "label": "Hot clean of every tool", "cmd": "INDX_CAL_CLEAN", "needs": "Load cell calibrated, homed, every tool empty (a loaded tool is left to the print start's PRIME_CLEAN); INDX_HOT_CLEAN installed. Runs by itself; the trigger offset is measured again after it", "moves": "Each empty tool in turn: heated over its purge lane slot, a hot tap, a sweep until cold, a cold tap at the Z homing spot to check the tip; again while the tip still reads high", "time": "1 to 2 min per tool"},
    {"key": "z", "label": "Tool Z offsets, then XY", "cmd": "INDX_CAL_Z", "needs": "Homed, docks tested; empty, clean, cold tools (no heating, no cool-down wait)", "moves": "Tool changes, taps on the bed, then the XY method you pick", "time": "2 min per tool"},
    {"key": "xy", "label": "Tool XY offsets", "cmd": "INDX_CAL_XY", "needs": "Z offsets; cold tools. Print and measure needs filament first", "moves": "Depends on the method", "time": "5 to 30 min"},
    {"key": "filament", "label": "Filament in each tool", "cmd": "INDX_LOAD", "needs": "Heater model. The other tools first, the reference tool last, so it ends on the head fully locked; each load ends with the tip shaped", "moves": "Tool change, heats and feeds over the purge lane slot (or the prime bucket's purge point)", "time": "2 min per tool"},
    {"key": "soak", "label": "Bed soak time and part fan tuning (optional)", "cmd": "INDX_CAL_SOAK", "needs": "Cold bed, a cold tool on the head that is empty or fully locked (not frozen), homed. Runs by itself, once per bed temperature you print at; the first run measures the part fan term of the heater model (INDX_CAL_FAN, over the purge lane slot) while it is assumed", "moves": "The part fan term first: nozzle hot at Z0.2 over the purge lane slot, the fan through its range; then a tap at the Z homing spot every minute", "time": "15 to 40 min, plus 15 min for the fan term, unattended"}
    ]
gcode:

[gcode_macro _INDX_STEP_GROUPS]
description: Inner - the setup steps as the user sees them: one step per intervention (an answer, a slide, a press, a choice, filament pushed in), with the routines of _INDX_STEPS that run inside it (read by INDX_SETUP, INDX_STATUS and the INDX web page)
# One step per user intervention; the routines inside keep their own marks. [EL-SET-002]
# hand: what the user does; routines: _INDX_STEPS keys in order; tools: 1 = only
# with two tools or more; label1: the label with one tool. T0 in label, label1
# and hand is the reference tool: INDX_STATUS and the INDX page put in T<ref>.
# min: [low, high] minutes, fixed / tool (per tool) / other (per tool but the
# reference); at, at_tool, at_other: the part spent at the printer, at_why: what
# for; optional: 1 = not counted; est: 1 = the time is still an estimate. [EL-SET-001]
variable_groups: [
    {"key": "answer", "label": "Answer two hardware questions", "hand": "You answer: the extruder direction, the part cooling", "routines": ["hw"], "min": {"fixed": [2, 4], "at": [2, 4], "at_why": "watch the latch wave, answer", "est": 1}},
    {"key": "slide_ref", "label": "Slide the head onto T0 in its dock", "hand": "You slide once. Inside: the load cell calibrated from the slide, the T0 dock measured, SAVE_CONFIG and a restart", "routines": ["lc"], "min": {"fixed": [4, 7], "at": [1, 2], "at_why": "the slide", "est": 1}},
    {"key": "home", "label": "Confirm the first home after the restart", "hand": "You press once. Inside: G28 with T0, the machine checks, the trigger offset", "routines": ["home", "homing", "trigger"], "tools": 0, "min": {"fixed": [5, 9], "at": [0, 1], "at_why": "one press after the restart", "est": 1}},
    {"key": "slides", "label": "Add each other dock: slide onto it, until the last", "hand": "Per dock you press Add the next dock and slide the head onto it; after the last you press That was the last dock (one tool: at once). Inside: each dock, the clearance line, and after the last one the tool change test, latch homing, the lock force, the heater model, the hot clean of every tool, the trigger offset again and the Z offsets", "routines": ["docks", "clearance", "test", "latch", "lock", "heater", "clean", "z"], "label1": "Test the T0 dock and clean the tip (one tool: runs by itself)", "min": {"fixed": [12, 20], "tool": [6, 10], "other": [2, 3], "at_other": [1, 2], "at_why": "each Add the next dock and its slide, then That was the last dock, at the start of the step; the rest runs by itself", "est": 1}},
    {"key": "xy", "label": "Choose how to measure the XY offsets", "hand": "You choose the method (print and measure, camera, by hand, sensor); its own actions follow", "routines": ["xy"], "tools": 1, "min": {"fixed": [3, 6], "other": [1.5, 2.5], "at": [1, 3], "at_why": "the choice, and on a new printer the camera or sensor found by hand once; print and measure adds a test print, 15 to 30 min", "est": 1}},
    {"key": "filament", "label": "Choose the filament and push it into each tool", "hand": "You choose once, then push the filament into each tool when asked. Inside: the loads with tip forming, the final SAVE_CONFIG", "routines": ["filament"], "min": {"fixed": [2, 4], "tool": [3, 6], "at": [1, 1], "at_tool": [3, 6], "at_why": "the whole step: each load asks for the filament", "est": 1}},
    {"key": "soak", "label": "Bed soak time and part fan tuning (optional)", "hand": "Nothing: it runs by itself from a cold bed, 15 to 40 min; the first run measures the part fan term first", "routines": ["soak"], "min": {"fixed": [15, 55], "optional": 1, "at_why": "nothing, it runs by itself", "est": 1}}
    ]
gcode:

[gcode_macro _INDX_STATE]
description: Inner - the last INDX_STATUS result, machine readable (rows: [state, text], steps: [key, state] per routine, groups: [key, state, label] per step, marks: [routine key, end index] slicing rows per routine). States: ok, todo, redo, stop, new, info. done/total count the steps (interventions), rdone/rtotal the routines
variable_rows: []
variable_steps: []
variable_groups: []
variable_marks: []
variable_done: 0
variable_total: 0
variable_rdone: 0
variable_rtotal: 0
variable_presses: 0
# times: the time per step for this printer's tool count (from
# _INDX_STEP_GROUPS min): {"n": tools, "steps": [[key, lo, hi, at_lo,
# at_hi], ...], "total": {"n": [lo, hi, at_lo, at_hi], "4": [...], "10":
# [...]}, "opt": [[key, lo, hi], ...]}, minutes
variable_times: {}
variable_next: ""
variable_next_cmd: ""
variable_next_text: ""
variable_next_group: ""
variable_next_group_text: ""
variable_next_group_n: 0
variable_running: ""
# unsaved: measured values SAVE_CONFIG has not written yet ("" when none)
variable_unsaved: ""
gcode:

#####################################################################
#  2. STATUS
#####################################################################

[gcode_macro INDX_STATUS]
description: Show what is set up and calibrated, what is next, and the state of the head. BRIEF=1: two lines. DETAIL=1 adds the tool offsets. Moves: nothing
gcode:
    _INDX_BUILD_TOOLS
    _INDX_SEAT_G
    _INDX_PAUSE_PARK_STATE
    _INDX_STATUS_COMPUTE
    {% if not params.QUIET|default(0)|int %}
        _INDX_STATUS_PRINT BRIEF={params.BRIEF|default(0)|int} DETAIL={params.DETAIL|default(0)|int}
    {% endif %}

[gcode_macro TOOL_STATUS]
description: Renamed to INDX_STATUS
gcode:
    _INDX_RENAMED OLD=TOOL_STATUS NEW=INDX_STATUS
    INDX_STATUS {rawparams}

[gcode_macro INDX]
description: Same as INDX_STATUS
gcode:
    INDX_STATUS {rawparams}

[gcode_macro CAL_CHECK_OFFSETS]
description: Renamed to INDX_STATUS DETAIL=1
gcode:
    _INDX_RENAMED OLD=CAL_CHECK_OFFSETS NEW="INDX_STATUS DETAIL=1"
    INDX_STATUS DETAIL=1

[gcode_macro _INDX_STATUS_COMPUTE]
description: Inner - work out every setup item and store it in _INDX_STATE
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set cal = svv.indx_cal|default({}) %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set n = tp.tool_count|int %}
    # the tools with offsets: every tool but the reference
    {% set rt = svv.ref_tool|default(0)|int %}
    {% set others = ("T1 to T%d" % (n - 1)) if rt == 0 else ("every tool but the reference T%d" % rt) %}
    {% set th = printer.toolhead %}
    {% set raw = printer.configfile.config %}
    {% set table = printer["gcode_macro _INDX_STEPS"].steps %}
    {% set min_c = printer["gcode_macro TOOL_POSITIONS"].tool_clearance_depth|default(printer["gcode_macro _INDX_CHECK_CLEARANCE"].min_dock_clearance)|float %}
    {% set no_heat = tp.no_heat_tools|default([]) %}
    # the dock count is complete once the user said that was the last dock
    # (INDX_DOCK_DONE); until then the number of tools is not known
    {% set docks_done = cal.docks_done|default(0)|int %}
    {% set ns = namespace(rows=[], steps=[], next="", next_cmd="", next_text="", ok=1, miss=[], first=-1, marks=[], zsens=0) %}

    # Step stopped mid-run (set while a long step runs, cleared at its end;
    # may be from a Kalico error or a Klipper restart) [EL-SET-046]
    {% set running = cal.running|default("")|string %}
    {% if running %}
        {% set ns.rows = ns.rows + [["stop", "Stopped mid-step: " ~ running ~ ". INDX_SETUP resumes safely (it asks what is on the head first)."]] %}
    {% endif %}

    # A measured result waiting for Save (survives a restart)
    {% set pend = svv.indx_pending|default({}) %}
    {% set waiting = pend and (pend.vars|default({}) or pend.post|default([])) %}
    {% if waiting %}
        {% set ns.rows = ns.rows + [["new", "Waiting for Save: " ~ pend.what|default("a result") ~ ". INDX_SAVE_PENDING or INDX_DISCARD_PENDING"]] %}
    {% endif %}
    # the last result saved by itself (its checks passed), until the setup ends
    {% set asv = cal.autosaved|default("")|string %}
    {% if asv %}
        {% set ns.rows = ns.rows + [["new", "Saved by itself, checks passed: " ~ asv ~ ". Measure the step again any time to replace it"]] %}
    {% endif %}
    {% set dr = printer["gcode_macro _INDX_PENDING"] %}
    {% if dr.xy or dr.trim is not none %}
        {% set ns.rows = ns.rows + [["new", "Unsaved edits: " ~ ((dr.xy.keys()|map("string")|map("replace", "", "T", 1)|join(", ") ~ " XY offset") if dr.xy else "") ~ (", " if dr.xy and dr.trim is not none else "") ~ ("first-layer trim" if dr.trim is not none else "") ~ ". Save them in INDX_SET_TOOL_OFFSET or INDX_FIRST_LAYER, or on the INDX page"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["", ns.rows|length]] %}
    # hw: the hardware questions and the part cooling choice (_INDX_MACHINE,
    # kept in indx_settings). Both count: the heater model's fan term is
    # measured with that part cooling.
    {% set pcool = printer["gcode_macro _INDX_MACHINE"].part_cooling|default("not_set")|string %}
    {% set pc_names = printer["gcode_macro _INDX_MACHINE"].names|default({}) %}
    {% set hw_q = cal.hw|default(0)|int %}
    {% if hw_q and pcool != "not_set" %}
        {% set ns.rows = ns.rows + [["ok", "Hardware checks confirmed, part cooling: " ~ pc_names[pcool]|default(pcool)]] %}
        {% set ns.steps = ns.steps + [["hw", "ok"]] %}
    {% elif hw_q %}
        {% set ns.rows = ns.rows + [["todo", "Part cooling not chosen yet (hardware checks, question 2): the heater model's fan term is measured with it"]] %}
        {% set ns.steps = ns.steps + [["hw", "todo"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["todo", "Hardware checks not confirmed yet"]] %}
        {% set ns.steps = ns.steps + [["hw", "todo"]] %}
    {% endif %}
    # The part fan as INDX drives it (M106, [fan]): off_below cuts the low
    # speeds the heater model's fan calibration steps through
    {% set pfn = printer["gcode_macro _INDX_MACHINE"].part_fan|default("")|string %}
    {% set fcfg = printer.configfile.settings["fan_generic " ~ pfn]|default(none) if pfn and pfn != "fan" else none %}
    {% set fcfg = fcfg if fcfg is not none else printer.configfile.settings.fan|default(none) %}
    {% if pcool == "none" %}
    {% elif fcfg is none and "gcode_macro m106" not in printer.configfile.settings %}
        {% set ns.rows = ns.rows + [["warn", "No [fan] section: INDX runs the part fan with M106 during every nozzle cool-down and the heater model calibrates it. Set up the part fan as [fan]"]] %}
    {% elif fcfg.off_below|default(0)|float > 0 %}
        {% set ns.rows = ns.rows + [["warn", "Part fan off_below %.2f cuts the low fan speeds: the heater model's fan calibration steps through them. Remove off_below from [fan], RESTART, then calibrate the heater model" % fcfg.off_below|float]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["hw", ns.rows|length]] %}
    # load cell
    {% if "load_cell_probe" not in printer %}
        {% set ns.rows = ns.rows + [["stop", "No [load_cell_probe] in printer.cfg: Z cannot home"]] %}
        {% set ns.steps = ns.steps + [["lc", "stop"]] %}
    {% elif printer.load_cell_probe.is_calibrated|default(false) and "load_cell_probe" in printer.configfile.save_config_pending_items|default({}) and "indx_clog" in printer and printer.indx_clog.lc_cpg_only|default(false) %}
        # only counts per gram changed (the reference tare is the saved one):
        # in use at once, the final SAVE_CONFIG of the setup writes it
        {% set ns.rows = ns.rows + [["ok", "Load cell calibrated, counts per gram %.4f in use, not saved yet: SAVE_CONFIG at the end of the setup writes it (a restart before that goes back to the saved value)" % printer.load_cell_probe.counts_per_gram|float]] %}
        {% set ns.steps = ns.steps + [["lc", "ok"]] %}
    {% elif printer.load_cell_probe.is_calibrated|default(false) and "load_cell_probe" in printer.configfile.save_config_pending_items|default({}) %}
        # The G28 seat check weighs against the saved reference
        # (configfile settings), so an unsaved calibration does not count
        {% set ns.rows = ns.rows + [["todo", "Load cell calibrated but not saved: SAVE_CONFIG (Klipper restarts; a tool locked on the head stays on) before homing"]] %}
        {% set ns.steps = ns.steps + [["lc", "todo"]] %}
    {% elif printer.load_cell_probe.is_calibrated|default(false) %}
        {% set ns.rows = ns.rows + [["ok", "Load cell calibrated"]] %}
        {% set ns.steps = ns.steps + [["lc", "ok"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["todo", "Load cell not calibrated: Z cannot home yet"]] %}
        {% set ns.steps = ns.steps + [["lc", "todo"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["lc", ns.rows|length]] %}
    # first home
    {% if cal.homed|default(0)|int or "xyz" in th.homed_axes %}
        {% set ns.rows = ns.rows + [["ok", "Homed with the reference tool at least once"]] %}
        {% set ns.steps = ns.steps + [["home", "ok"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["todo", "Never homed: the first home probes with the reference tool (T%d): on the head from the load cell step, or fetched from its dock once that is measured" % printer.save_variables.variables.ref_tool|default(0)|int]] %}
        {% set ns.steps = ns.steps + [["home", "todo"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["home", ns.rows|length]] %}
    # Machine checks: X/Y endstop accuracy (switch endstops only) and probe accuracy
    {% set hc = svv.indx_homing_check|default({}) %}
    {% set pc = svv.indx_probe_check|default({}) %}
    {% set cfgs = printer.configfile.settings %}
    {% set sl = [] %}
    {% for ax in ["x", "y"] %}
        {% if "virtual_endstop" in cfgs["stepper_" ~ ax].endstop_pin|default("")|string %}{% set _ = sl.append(ax) %}{% endif %}
    {% endfor %}
    {% set mc = namespace(state="ok") %}
    # Results kept from an earlier setup count only once this setup has homed [EL-SET-003]
    {% set this_setup = cal.homed|default(0)|int %}
    {% if not this_setup %}
        {% set hc = {} %}
        {% set pc = {} %}
    {% endif %}
    {% if sl|length == 2 %}
        {% set ns.rows = ns.rows + [["info", "X/Y endstop accuracy: not measurable with sensorless homing (a StallGuard stall only fires while the motor moves). Sensorless homes can land whole motor steps apart, switch endstops are more repeatable"]] %}
    {% elif not hc %}
        {% set ns.rows = ns.rows + [["todo", "X/Y endstop accuracy not checked yet: docks and every saved position rely on the home"]] %}
        {% set mc.state = "todo" %}
    {% elif hc.verdict == "bad" %}
        {% set ns.rows = ns.rows + [["stop", "X/Y endstops not repeatable: spread up to %.3f mm over %d touches. Check the switches and their mounts before docks and offsets" % (hc.worst, hc.n)]] %}
        {% set mc.state = "stop" %}
    {% else %}
        {% set ns.rows = ns.rows + [["ok", "X/Y endstops %s: spread up to %.3f mm over %d touches per axis" % (hc.verdict, hc.worst, hc.n)]] %}
    {% endif %}
    {% if not pc %}
        {% set ns.rows = ns.rows + [["todo", "Probe accuracy not checked yet: 10 taps of the reference tool at the Z homing spot"]] %}
        {% if mc.state == "ok" %}{% set mc.state = "todo" %}{% endif %}
    {% elif pc.verdict == "bad" %}
        {% set ns.rows = ns.rows + [["stop", "Probe accuracy %.4f mm over %d taps, worse than %.2f mm: something may be wrong with the machine (tool seating, a loose nozzle or bed, Z play, residue on the tip)" % (pc.range, pc.n, pc.limit)]] %}
        {% set mc.state = "stop" %}
    {% else %}
        {% set ns.rows = ns.rows + [["ok", "Probe accuracy %.4f mm over %d taps (sd %.4f)" % (pc.range, pc.n, pc.sd)]] %}
    {% endif %}
    {% set ns.steps = ns.steps + [["homing", mc.state]] %}

    {% set ns.marks = ns.marks + [["homing", ns.rows|length]] %}
    # trigger offset
    {% set lt = printer["gcode_macro _LOADCELL_TRUE"] if "gcode_macro _LOADCELL_TRUE" in printer else none %}
    {% if svv.lc_trigger_offset is defined and cal.trigger_recheck|default(0)|int == 2 %}
        # the load cell's counts per gram changed (_INDX_LC_SYNC): the tap
        # threshold is a fixed gram value, so it fires at other counts now
        {% set ns.rows = ns.rows + [["redo", "Load cell trigger offset %.3f mm was measured before the load cell calibration changed: measure it again (INDX_CAL_TRIGGER), the tap threshold is in grams" % svv.lc_trigger_offset|float]] %}
        {% set ns.steps = ns.steps + [["trigger", "redo"]] %}
    {% elif svv.lc_trigger_offset is defined and cal.trigger_recheck|default(0)|int %}
        # measured before the hot clean of the tips: plastic on the reference
        # tool's tip would have shifted it
        {% set ns.rows = ns.rows + [["redo", "Load cell trigger offset %.3f mm was measured before the hot clean of T%d: measure it again (INDX_CAL_TRIGGER), plastic on the tip would have shifted it" % (svv.lc_trigger_offset|float, svv.ref_tool|default(0)|int)]] %}
        {% set ns.steps = ns.steps + [["trigger", "redo"]] %}
    {% elif svv.lc_trigger_offset is defined %}
        {% set ns.rows = ns.rows + [["ok", "Load cell trigger offset %.3f mm (measured)" % svv.lc_trigger_offset|float]] %}
        {% set ns.steps = ns.steps + [["trigger", "ok"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["todo", "Load cell trigger offset not measured (using %s, the default)" % (("%.3f" % lt.trigger_offset|float) if lt is not none else "none")]] %}
        {% set ns.steps = ns.steps + [["trigger", "todo"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["trigger", ns.rows|length]] %}
    # INDX Macros only: where the printer's own PAUSE macro parks, asked once
    # right after the first home (_INDX_PAUSE_STEP_INIT adds the step; the
    # INDX Suite checks it itself) [EL-SET-043]
    {% if "pause" in table|map(attribute="key")|list and "gcode_macro _INDX_PAUSE_PARK_STATE" in printer %}
        {% set pks = printer["gcode_macro _INDX_PAUSE_PARK_STATE"] %}
        {% if pks.state == "ask" or pks.state == "" %}
            {% set ns.rows = ns.rows + [["todo", "Where your PAUSE macro parks is not confirmed (INDX Macros cannot read it): asked once, again when the macro changes"]] %}
            {% set ns.steps = ns.steps + [["pause", "todo"]] %}
        {% elif pks.state == "unsafe" %}
            {% set ns.rows = ns.rows + [["todo", pks.why]] %}
            {% set ns.steps = ns.steps + [["pause", "todo"]] %}
        {% elif pks.state == "later" %}
            {% set ns.rows = ns.rows + [["ok", "PAUSE is Mainsail's or Fluidd's: its park is checked against the dock clearance line once the docks are measured"]] %}
            {% set ns.steps = ns.steps + [["pause", "ok"]] %}
        {% else %}
            {% set ns.rows = ns.rows + [["ok", "PAUSE parks clear of the docks"]] %}
            {% set ns.steps = ns.steps + [["pause", "ok"]] %}
        {% endif %}
        {% set ns.marks = ns.marks + [["pause", ns.rows|length]] %}
    {% endif %}
    # Heater model: INDX_CALIBRATE writes max_power, model_thermal_capacity and
    # model_to_ambient_r into [indx] (no defaults: the model needs them);
    # INDX_FAN_CALIBRATE writes the fan term (default 0). Unsaved values are pending.
    {% set icfg = raw.indx|default({}) %}
    {% set pend = (printer.configfile.save_config_pending_items|default({})).indx|default({}) %}
    {% set hkeys = ["max_power", "model_thermal_capacity", "model_to_ambient_r"] %}
    {% set heat_ok = hkeys|select("in", icfg)|list|length == 3 %}
    {% set heat_pend = hkeys|select("in", pend)|list|length == 3 %}
    {% set fan_ok = "model_part_cooling_fan_a" in icfg and icfg.model_part_cooling_fan_a|float != 0.0 %}
    {% set fan_pend = "model_part_cooling_fan_a" in pend %}
    # heater_pc: the part cooling the model was measured with (none: not recorded, not asked)
    {% set hpc = cal.heater_pc|default("")|string %}
    # The plugin uses measured parameters at once (live model, staged for
    # SAVE_CONFIG); a restart before the setup's final save loses them (todo again).
    {% set uns = namespace(items=[]) %}
    {% if heat_pend %}
        {% set ns.rows = ns.rows + [["new", "Heater model measured, not saved yet: INDX uses it as measured; SAVE_CONFIG (Klipper restarts) at the end of the setup writes it, a restart before that loses it"]] %}
        {% set ns.steps = ns.steps + [["heater", "ok"]] %}
        {% set uns.items = uns.items + ["the heater model"] %}
    {% elif heat_ok and hpc and hpc != "not_set" and pcool != "not_set" and hpc != pcool %}
        {% set ns.rows = ns.rows + [["redo", "Heater model measured with %s, the part cooling is now %s: calibrate it again (INDX_CAL_HEATER), the fan term depends on it" % (pc_names[hpc]|default(hpc), pc_names[pcool]|default(pcool))]] %}
        {% set ns.steps = ns.steps + [["heater", "redo"]] %}
    {% elif heat_ok %}
        {% set fa = cal.fan_assumed|default("")|string %}
        {% set ns.rows = ns.rows + [["ok", "Heater model calibrated" ~ (", part fan term measured" if fan_ok else (", part fan term measured, SAVE_CONFIG keeps it" if fan_pend else ((", part fan term: values Bondtech measured for " if fa in printer["gcode_macro _INDX_FAN_MODEL"].measured else ", part fan term assumed for ") ~ pc_names[fa]|default(fa) ~ " (INDX_CAL_FAN measures it here, optional, with the bed soak)") if fa and fa != "none" else (", no part fan term" if pcool == "none" else ", part fan term not set")))]] %}
        {% set ns.steps = ns.steps + [["heater", "ok"]] %}
        {% if fan_pend %}{% set uns.items = uns.items + ["the part fan term"] %}{% endif %}
    {% else %}
        {% set ns.rows = ns.rows + [["todo", "Heater safety model not calibrated (needed before the filament loads)"]] %}
        {% set ns.steps = ns.steps + [["heater", "todo"]] %}
    {% endif %}
    {% if "load_cell_probe" in printer and printer.load_cell_probe.is_calibrated|default(false) and "load_cell_probe" in printer.configfile.save_config_pending_items|default({}) %}
        {% set uns.items = ["the load cell calibration"] + uns.items %}
    {% endif %}
    # the XY sensor position found in the XY step (INDX_ALIGN_SET_SENSOR
    # stages it; the setup's final SAVE_CONFIG writes it)
    {% if "indx_tool_align" in printer.configfile.save_config_pending_items|default({}) %}
        {% set uns.items = uns.items + ["the XY sensor position"] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["heater", ns.rows|length]] %}
    # docks: the count is the setup's (INDX_DOCK_ADD adds a dock when its
    # measurement is saved, INDX_DOCK_DONE says the count is complete)
    {% set ns.ok = 1 %}
    {% set ns.first = -1 %}
    {% set tools = tp.tools|default([]) %}
    {% for i in range(n) %}
        {% set meas = svv.get("t%d_dock_x" % i) is not none and svv.get("t%d_dock_y" % i) is not none %}
        {% set x = (svv.get("t%d_dock_x" % i) if svv.get("t%d_dock_x" % i) is not none else (tools[i].x if i < tools|length else -1))|float %}
        {% set y = (svv.get("t%d_dock_y" % i) if svv.get("t%d_dock_y" % i) is not none else (tools[i].dock_y if i < tools|length else 0))|float %}
        {% if meas and svv["t%d_dock_new" % i]|default(0)|int %}
            {% set ns.rows = ns.rows + [["new", "Dock T%d X%.2f Y%.2f measured, not driven into yet: first contact at 20 %% speed" % (i, x, y)]] %}
        {% elif meas %}
            {% set ns.rows = ns.rows + [["ok", "Dock T%d X%.2f Y%.2f measured" % (i, x, y)]] %}
        {% elif tp.docks_calibrated|default(True) %}
            {% set ns.rows = ns.rows + [["ok", "Dock T%d X%.2f Y%.2f from indx.cfg, marked as measured there" % (i, x, y)]] %}
        {% else %}
            {% set ns.rows = ns.rows + [["stop", "Dock T%d not measured: tool changes to T%d are refused" % (i, i)]] %}
            {% set ns.ok = 0 %}
            {% if ns.first < 0 %}{% set ns.first = i %}{% endif %}
        {% endif %}
    {% endfor %}
    {% set dock_first = ns.first %}
    {% if ns.ok and not docks_done %}
        {% set ns.rows = ns.rows + [["todo", "%d dock%s measured: is there another tool in a dock? Add the next dock (INDX_DOCK_ADD, you slide onto it) or say that was the last (INDX_DOCK_DONE)" % (n, "s" if n != 1 else "")]] %}
    {% endif %}
    {% set ns.steps = ns.steps + [["docks", ("ok" if docks_done else "todo") if ns.ok else "stop"]] %}

    {% set ns.marks = ns.marks + [["docks", ns.rows|length]] %}
    # clearance
    {% set ns.first = -1 %}
    {% set clr = tp.clearance_y if tp.clearance_y is number else 0.0 %}
    {% set gns = namespace(gap=999.0, tool=-1, dy=0.0) %}
    {% for i in range(n) %}
        {% set dy = (svv.get("t%d_dock_y" % i) if svv.get("t%d_dock_y" % i) is not none else (tp.tools[i].dock_y if i < tp.tools|default([])|length else tp["t%d_dock_y" % i]|default(tp.t0_dock_y|default(0))))|float %}
        {% set gap = (dy - clr) * tp.dock_dir|float %}
        {% if gap < gns.gap %}
            {% set gns.gap = gap %}
            {% set gns.tool = i %}
            {% set gns.dy = dy %}
        {% endif %}
    {% endfor %}
    {% set src = printer["gcode_macro _INDX_BUILD_TOOLS"].clearance_src|default("") %}
    {% if gns.gap >= min_c - 0.001 and not (ns.ok and docks_done) %}
        # Not done until every dock is measured: placeholder docks pass auto by
        # construction. Too close stays a stop below. [EL-SET-003]
        {% set ns.rows = ns.rows + [["todo", "clearance_y %.2f %s: checked against the docks once every dock is measured and the count is complete" % (clr, src or "indx.cfg")]] %}
        {% set ns.steps = ns.steps + [["clearance", "todo"]] %}
    {% elif gns.gap >= min_c - 0.001 %}
        {% if src == "auto" %}
            {% set ns.rows = ns.rows + [["ok", "clearance_y %.2f auto (most protruding dock T%d %.2f, plus %.1f)" % (clr, gns.tool, gns.dy, min_c)]] %}
        {% else %}
            {% set ns.rows = ns.rows + [["ok", "clearance_y %.2f from %s, %.2f mm from the nearest dock (T%d, needs %.1f)" % (clr, src or "indx.cfg", gns.gap, gns.tool, min_c)]] %}
        {% endif %}
        {% set ns.steps = ns.steps + [["clearance", "ok"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["stop", "clearance_y %.2f is only %.2f mm from the T%d dock, needs %.1f: homing and tool changes are refused (INDX_SET_CLEARANCE AUTO=1)" % (clr, gns.gap, gns.tool, min_c)]] %}
        {% set ns.steps = ns.steps + [["clearance", "stop"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["clearance", ns.rows|length]] %}
    # first tool change test
    {% set ns.miss = [] %}
    {% for i in range(n) %}
        {% if svv["t%d_dock_new" % i]|default(0)|int %}{% set ns.miss = ns.miss + [i] %}{% endif %}
    {% endfor %}
    {% if cal.tested|default(0)|int and not ns.miss %}
        {% set ns.rows = ns.rows + [["ok", "Tool change test passed"]] %}
        {% set ns.steps = ns.steps + [["test", "ok"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["todo", "Tool change test not run since the docks were measured"]] %}
        {% set ns.steps = ns.steps + [["test", "todo"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["test", ns.rows|length]] %}
    # latch homing threshold (INDX Suite: tmc_sg_log)
    {% if "tmc_sg_log" not in printer %}
        # nothing to calibrate with INDX Macros: not counted (info),
        # so the routine count does not start at done ones
        {% set ns.rows = ns.rows + [["info", "Latch homing calibration: part of the INDX Suite (tmc_sg_log), not of INDX Macros"]] %}
        {% set ns.steps = ns.steps + [["latch", "info"]] %}
    {% elif svv.latch_sg_stop is defined %}
        {% set ns.rows = ns.rows + [["ok", "Latch homing stops on one reading under %d (free-running band from %d)" % (svv.latch_sg_stop|int, svv.latch_sg_band|default(0)|int)]] %}
        {% set ns.steps = ns.steps + [["latch", "ok"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["todo", "Latch homing not calibrated (INDX_CAL_LATCH): it grinds against its stop until it notices"]] %}
        {% set ns.steps = ns.steps + [["latch", "todo"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["latch", ns.rows|length]] %}
    # lock force per tool (INDX Suite: tmc_sg_log)
    {% set lk = namespace(miss=[]) %}
    {% for i in range(tp.tool_count|int) %}
        {% if svv["t%d_lock_g" % i]|default(none) is none %}{% set lk.miss = lk.miss + ["T%d" % i] %}{% endif %}
    {% endfor %}
    {% if "tmc_sg_log" not in printer %}
        {% set ns.rows = ns.rows + [["info", "Lock force per tool: part of the INDX Suite (tmc_sg_log), not of INDX Macros"]] %}
        {% set ns.steps = ns.steps + [["lock", "info"]] %}
    {% elif not lk.miss %}
        # measured at a gentler tool change than now: locks can run to the
        # travel limit and seats read higher, so it is asked for again
        {% set tv = printer["gcode_macro _TOOLCHANGE_VARS"] %}
        {% set pc = printer.configfile.settings.printer %}
        {% set now_v = pc.max_velocity|float * tv.speed_mult|float %}
        {% set now_a = pc.max_accel|float * tv.accel_mult|float %}
        {% set cal_v = svv.lock_motion_v|default(0)|float %}
        {% set cal_a = svv.lock_motion_a|default(0)|float %}
        {% if cal_a > 0 and (now_a > cal_a * 1.15 or now_v > cal_v * 1.15) %}
            {% set ns.rows = ns.rows + [["redo", "Lock force calibrated at %d mm/s, %d mm/s2; tool changes now run at %d mm/s, %d mm/s2: run INDX_CAL_LOCK again (all tools empty)" % (cal_v, cal_a, now_v, now_a)]] %}
            {% set ns.steps = ns.steps + [["lock", "redo"]] %}
        {% else %}
            {% set ns.rows = ns.rows + [["ok", "Lock force calibrated for every tool (INDX_CAL_LOCK, with empty tools, also the health check)" ~ ((", at %d mm/s, %d mm/s2" % (cal_v, cal_a)) if cal_a > 0 else "")]] %}
            {% set ns.steps = ns.steps + [["lock", "ok"]] %}
        {% endif %}
    {% else %}
        {% set ns.rows = ns.rows + [["todo", "Lock force not calibrated for %s (INDX_CAL_LOCK, all tools empty): those lock to the global target" % lk.miss|join(", ")]] %}
        {% set ns.steps = ns.steps + [["lock", "todo"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["lock", ns.rows|length]] %}
    # hot clean of the tips (INDX_CAL_CLEAN): plastic on a tip shifts every tap;
    # cleared when a dock or the lock force is measured again [EL-SET-004]
    {% if "gcode_macro INDX_HOT_CLEAN" not in printer %}
        {% set ns.rows = ns.rows + [["info", "Hot clean of the tips not available (INDX_HOT_CLEAN is not installed): the setup does not check the tips for plastic. On a printer that has printed before, wipe every nozzle tip by hand before the trigger offset and the Z offsets"]] %}
        {% set ns.steps = ns.steps + [["clean", "info"]] %}
    {% elif cal.cleaned|default(0)|int %}
        {% set ns.rows = ns.rows + [["ok", "Nozzle tips hot cleaned and checked (INDX_CAL_CLEAN)"]] %}
        {% set ns.steps = ns.steps + [["clean", "ok"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["todo", "Nozzle tips not hot cleaned since the docks and the lock force (INDX_CAL_CLEAN): plastic on a tip shifts the trigger offset and the Z offsets"]] %}
        {% set ns.steps = ns.steps + [["clean", "todo"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["clean", ns.rows|length]] %}
    # Z offsets
    {% set redo_z = cal.redo_z|default([])|select("lessthan", n)|list %}
    {% set ns.miss = [] %}
    {% for i in range(n) if i != printer.save_variables.variables.ref_tool|default(0)|int %}
        {% if ("t%d_offset_z" % i) not in svv %}{% set ns.miss = ns.miss + [i] %}{% endif %}
    {% endfor %}
    {% set age = (" (%d tool changes ago)" % (svv.toolchange_count|default(0)|int - cal.z_tc|int)) if cal.z_tc is defined else "" %}
    {% if n < 2 and not docks_done %}
        {% set ns.rows = ns.rows + [["todo", "Z offsets: measured after the docks, once the count is complete"]] %}
        {% set ns.steps = ns.steps + [["z", "todo"]] %}
    {% elif n < 2 %}
        # not part of a one-tool setup: info, not counted
        {% set ns.rows = ns.rows + [["info", "One tool: no Z offsets needed"]] %}
        {% set ns.steps = ns.steps + [["z", "info"]] %}
    {% elif ns.miss %}
        {% set ns.rows = ns.rows + [["todo", "Z offsets missing for T" ~ ns.miss|join(", T")]] %}
        {% set ns.steps = ns.steps + [["z", "todo"]] %}
    {% elif redo_z %}
        {% set ns.rows = ns.rows + [["redo", "Z offsets to redo for T" ~ redo_z|join(", T") ~ " (dock re-measured or nozzle changed)" ~ age]] %}
        {% set ns.steps = ns.steps + [["z", "redo"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["ok", "Z offsets set for %s%s" % (others, age)]] %}
        {% set ns.steps = ns.steps + [["z", "ok"]] %}
    {% endif %}
    # The XY sensor: CAL_Z with empty, cold tools records each tool's trigger height
    # on it (t<n>_sensor_dz, sensor_ref_z) for a print's first cold Z check
    # (_INDX_SENSOR_ZCHECK). Missing ones make the Z step todo once the sensor is found.
    {% if "indx_tool_align" in printer and n >= 2 %}
        {% set zref = svv.ref_tool|default(0)|int %}
        {% set zsm = namespace(l=[]) %}
        {% for i in range(n) if i != zref and ("t%d_sensor_dz" % i) not in svv %}{% set zsm.l = zsm.l + [i] %}{% endfor %}
        {% set zpos = none not in printer.indx_tool_align.sensor|default([none, none, none]) %}
        {% if "sensor_ref_z" in svv and not zsm.l %}
            {% set ns.rows = ns.rows + [["ok", "XY sensor Z references from CAL_Z for %s (the first pickup's cold Z check in a print)" % others]] %}
        {% elif not zpos %}
            {% set ns.rows = ns.rows + [["info", "XY sensor Z references: CAL_Z records them once the sensor position is found (XY step); until then the first pickup's cold Z check on the sensor is skipped"]] %}
        {% else %}
            {% set what = ("T" ~ zsm.l|join(", T")) if "sensor_ref_z" in svv else ("the reference tool T%d and every other tool" % zref) %}
            {% set ns.rows = ns.rows + [["todo", "XY sensor Z references missing for %s: the first pickup's cold Z check on the sensor is skipped. Run CAL_Z (INDX_CAL_Z) with empty, cold tools: it records them with the Z offsets" % what]] %}
            {% if ns.steps[-1][1] in ["ok", "info"] %}
                {% set ns.steps = ns.steps[:-1] + [["z", "todo"]] %}
                # only the sensor references: CAL_Z alone (empty tools), no XY after it
                {% set ns.zsens = 1 %}
            {% endif %}
        {% endif %}
    {% endif %}

    {% set ns.marks = ns.marks + [["z", ns.rows|length]] %}
    # XY offsets
    {% set redo_xy = cal.redo_xy|default([])|select("lessthan", n)|list %}
    {% set ns.miss = [] %}
    {% for i in range(n) if i != printer.save_variables.variables.ref_tool|default(0)|int %}
        {% if i not in cal.xy|default([]) and not (("t%d_offset_x" % i) in svv and ("t%d_offset_y" % i) in svv) %}
            {% set ns.miss = ns.miss + [i] %}
        {% endif %}
    {% endfor %}
    {% if n < 2 and not docks_done %}
        {% set ns.rows = ns.rows + [["todo", "XY offsets: measured after the docks, once the count is complete"]] %}
        {% set ns.steps = ns.steps + [["xy", "todo"]] %}
    {% elif n < 2 %}
        {% set ns.rows = ns.rows + [["info", "One tool: no XY offsets needed"]] %}
        {% set ns.steps = ns.steps + [["xy", "info"]] %}
    {% elif ns.miss %}
        {% set ns.rows = ns.rows + [["todo", "XY offsets not set for T" ~ ns.miss|join(", T")]] %}
        {% set ns.steps = ns.steps + [["xy", "todo"]] %}
    {% elif redo_xy %}
        {% set ns.rows = ns.rows + [["redo", "XY offsets to redo for T" ~ redo_xy|join(", T")]] %}
        {% set ns.steps = ns.steps + [["xy", "redo"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["ok", "XY offsets set for %s" % others]] %}
        {% set ns.steps = ns.steps + [["xy", "ok"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["xy", ns.rows|length]] %}
    # filament: the other tools first, the reference tool last, so it ends fully
    # locked on the head and the next G28 has nothing to fetch (a loaded tool parked
    # full locks short at its next cold pickup, and nothing probes with it)
    {% set ns.miss = [] %}
    {% set reft = svv.ref_tool|default(0)|int %}
    # loaded: a material recorded, or a density (the one test everywhere)
    {% for i in range(n) if i != reft %}
        {% if i not in no_heat and not (svv["t%d_material" % i]|default("")|string or svv["t%d_fil_density" % i]|default(0)|float > 0) %}{% set ns.miss = ns.miss + [i] %}{% endif %}
    {% endfor %}
    {% if reft not in no_heat and not (svv["t%d_material" % reft]|default("")|string or svv["t%d_fil_density" % reft]|default(0)|float > 0) %}{% set ns.miss = ns.miss + [reft] %}{% endif %}
    {% set fil_first = ns.miss[0] if ns.miss else -1 %}
    {% if ns.miss %}
        {% set ns.rows = ns.rows + [["todo", "Filament not recorded for T" ~ ns.miss|join(", T") ~ " (heater safety model)"]] %}
        {% set ns.steps = ns.steps + [["filament", "todo"]] %}
    {% else %}
        {% set mats = [] %}
        {% for i in range(n) if i not in no_heat %}
            {% set mv = svv["t%d_material" % i]|default(none) %}
            {% set _ = mats.append("T%d %s" % (i, "not recorded" if mv is none else (mv or "empty"))) %}
        {% endfor %}
        {% set ns.rows = ns.rows + [["ok", "Filament: " ~ mats|join(", ")]] %}
        {% set ns.steps = ns.steps + [["filament", "ok"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["filament", ns.rows|length]] %}
    # soak: optional (info). The bed keeps growing after it reads at temperature; a
    # measured soak lets PRINT_START wait as long as this bed needs
    {% set soak = cal.soak|default({}) %}
    {% if soak|length %}
        {% set ns.rows = ns.rows + [["ok", "Bed soak: " ~ soak|dictsort|map("join", " C ")|join(" min, ") ~ " min (PRINT_START uses it)"]] %}
        {% set ns.steps = ns.steps + [["soak", "ok"]] %}
    {% else %}
        {% set ns.rows = ns.rows + [["info", "Bed soak time not measured (optional): PRINT_START waits a fixed 10 min at every bed temperature until it is. Measured once per bed temperature (INDX_CAL_SOAK BED=<C>, unattended), it waits exactly as long as this bed needs: shorter prints and a correct first layer" ~ (". The same run measures the part fan term first (INDX_CAL_FAN) while it is assumed" if cal.fan_assumed|default("")|string not in ["", "none"] else "")]] %}
        {% set ns.steps = ns.steps + [["soak", "info"]] %}
    {% endif %}

    {% set ns.marks = ns.marks + [["soak", ns.rows|length]] %}
    # extensions: one row listing them, and each one's optional setup step
    # (indx_ext.cfg added it to the table; optional: state info, not counted,
    # never the next step; ok when its setup_done saved variable holds)
    {% set ens = namespace(names=[]) %}
    {% for sec in printer.configfile.settings if (sec.startswith("indx_extension ") or sec == "indx_dock_sensor") and sec in printer %}
        {% set e = printer[sec] %}
        {% if sec != "indx_dock_sensor" %}{% set ens.names = ens.names + ["%s %s" % (e.name, e.version)] %}{% endif %}
        {% if e.setup.key is defined and e.setup.key in table|map(attribute="key")|list %}
            {% set dw = e.setup.done|default("")|string %}
            {% set dk = dw.split("=", 1) %}
            {% set ok = dw and dk[0] in svv and (dk|length == 1 or svv[dk[0]]|string == dk[1]) %}
            {% if ok %}
                {% set ns.rows = ns.rows + [["ok", e.setup.label ~ ": done (" ~ e.name ~ ")"]] %}
                {% set ns.steps = ns.steps + [[e.setup.key, "ok"]] %}
            {% else %}
                {% set ns.rows = ns.rows + [["info", e.setup.todo|default(e.setup.label ~ ": not done (optional, " ~ e.setup.cmd ~ ")")]] %}
                {% set ns.steps = ns.steps + [[e.setup.key, "info"]] %}
            {% endif %}
            {% set ns.marks = ns.marks + [[e.setup.key, ns.rows|length]] %}
        {% endif %}
    {% endfor %}
    {% if ens.names %}
        {% set ns.rows = ns.rows + [["info", "Extensions: " ~ ens.names|join(", ")]] %}
    {% endif %}
    # info: tier, first layer, head
    {% set sns = namespace(found=0) %}
    {% for k in raw %}
        {% if k.startswith("probe_eddy_current") %}{% set sns.found = 1 %}{% endif %}
    {% endfor %}
    {% set scanner = sns.found %}
    {% set tier = "Plus (eddy scanner)" if scanner else "Essential (load cell only)" %}
    {% set cam = " plus camera add-on (reference set)" if svv.cam_pos_x is defined else "" %}
    {% set ns.rows = ns.rows + [["info", "Tier: " ~ tier ~ cam ~ ("" if scanner else ". The INDX Eddy Current Scanner adds scanner bed meshes: www.bondtech.se/product/indx-eddy-scanner/")]] %}
    {% if lt is not none and "load_cell_probe" in printer.configfile.settings %}
        {% set zo = printer.configfile.settings.load_cell_probe.z_offset|default(0.0)|float %}
        {% set trig = lt.trigger_offset|float %}
        {% set shift = svv.zero_z_shift|default(0.0)|float %}
        {% set trim = svv.global_z_offset|default(0.0)|float - shift %}
        {% set ns.rows = ns.rows + [["info", "First layer: gap %.3f mm (z_offset %.3f, trigger %.3f), trim %+.3f, print start re-zero %+.3f (INDX_FIRST_LAYER)" % (trig - zo, zo, trig, trim, shift)]] %}
    {% endif %}
    # Purge lane: what the current or last print start used (since the restart)
    {% if tp.prime_enabled|default(True) and "gcode_macro _PURGE_LANE" in printer %}
        {% set pl = printer["gcode_macro _PURGE_LANE"] %}
        {% set pl_n = printer["gcode_macro _PRIME_SETTINGS"].slots|length %}
        {% if pl.used_n|int > 0 and pl_n > 0 %}
            {% set ns.rows = ns.rows + [["info", "Purge lane: the last print start took %d slots of %d%s" % (pl.used_n|int, pl_n, (", ran out and started over from the first slot" if pl.wrapped|int else ""))]] %}
        {% endif %}
    {% endif %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set st = printer["gcode_macro _TOOLCHANGE_VARS"].toolhead_state|int %}
    {% set sg = printer["gcode_macro _INDX_SEAT_G"] %}
    {% set min_g = tp.home_min_force_g|default(590.0)|float %}
    # Rated against the empty-head reading the last pickup took at the dock
    # (_INDX_LC_STORE empty_g): the calibration's empty head drifts. [EL-SET-005]
    {% set store = printer["gcode_macro _INDX_LC_STORE"]|default({}) %}
    {% set e0 = store.empty_g|default(0.0)|float %}
    {% if sg.valid|int and e0 == 0.0 %}
        {% set lc_txt = "load cell %.0f g against the calibration (rated after the next tool change: the calibration's empty head drifts)" % sg.seat_g|float %}
    {% elif sg.valid|int %}
        {% set g = (sg.seat_g|float - e0)|abs %}
        {% if act >= 0 %}
            {% if g >= tp.seat_ref_min_g|default(1185.0)|float and g <= tp.seat_ref_max_g|default(1775.0)|float %}
                {% set rate = "good, seated" %}
            {% elif g >= min_g and g <= tp.seat_max_g|default(2600.0)|float %}
                {% set rate = "ok, seated but outside the usual range" %}
            {% elif g < min_g %}
                {% set rate = "CHECK: reads like an empty head" %}
            {% else %}
                {% set rate = "CHECK: pressed much harder than a seated tool" %}
            {% endif %}
        {% else %}
            {% if g < tp.empty_ref_max_g|default(130.0)|float %}
                {% set rate = "good, empty" %}
            {% elif g < min_g %}
                {% set rate = "ok, empty but not near zero" %}
            {% else %}
                {% set rate = "CHECK: reads like a tool on the head" %}
            {% endif %}
        {% endif %}
        {% set lc_txt = "load cell %.0f g against the last empty-head reading (%s)" % (sg.seat_g|float - e0, rate) %}
    {% else %}
        {% set lc_txt = "load cell: no reading" %}
    {% endif %}
    {% set ns.rows = ns.rows + [["info", "Head: %s, latch %s, %s. Homed: %s. Speed mode %s, %d tool changes" % (("T%d" % act) if act >= 0 else "empty", "locked" if st == 0 else "open", lc_txt, th.homed_axes or "no", printer["gcode_macro _TOOLCHANGE_VARS"].mode ~ (" (lagom)" if printer["gcode_macro _TOOLCHANGE_VARS"].mode|string|lower == "normal" else ""), svv.toolchange_count|default(0)|int)]] %}
    # Race mode is on: say so every time, as a warning
    {% set tcv = printer["gcode_macro _TOOLCHANGE_VARS"] %}
    {% if tcv.mode|string|lower == tcv.race_mode|default("race") %}
        {% set ns.rows = ns.rows + [["warn", "Race mode is on: tool changes run without the seat check, the park check and the latch homing. A missed pickup or park is not noticed and can crash into a dock or the print. MODE_SPORT or MODE_NORMAL turns it off."]] %}
    {% endif %}
    # RESUME has to run _INDX_RESUME_HOOK (same test as _INDX_RESUME_CHECK)
    {% set cs = printer.configfile.settings %}
    {% set rs = cs["gcode_macro resume"].gcode|default("")|string if "gcode_macro resume" in cs else "" %}
    {% set cv = cs["gcode_macro _client_variable"].variable_user_resume_macro|default("")|string if "gcode_macro _client_variable" in cs else "" %}
    {% if not ("_INDX_RESUME_HOOK" in rs or "_PRIME_GRID_RESUME" in rs or ("user_resume_macro" in rs and "_INDX_RESUME_HOOK" in cv)) %}
        {% set ns.rows = ns.rows + [["warn", "RESUME does not run _INDX_RESUME_HOOK: a held print start or tool change would go on cold and unprimed. Mainsail, Fluidd: a _CLIENT_VARIABLE macro with variable_user_resume_macro set to _INDX_RESUME_HOOK. Until then: INDX_RESUME."]] %}
    {% endif %}
    # PAUSE must not park in or next to the dock zone (indx_api.py checks it at start and at the print start)
    {% set ppk = printer.indx_api.pause_park if "indx_api" in printer else {} %}
    {% if ppk.state|default("") == "unsafe" %}
        {% set ns.rows = ns.rows + [["warn", "Your PAUSE macro parks at %s. INDX pauses with its own park instead until it is fixed: _INDX_PAUSE_CHECK says how." % ppk.why]] %}
    {% endif %}

    # next step
    {% set done = ns.steps|selectattr(1, "equalto", "ok")|list|length %}
    # optional steps (info) are not counted and never the next step
    {% set total = ns.steps|rejectattr(1, "equalto", "info")|list|length %}
    # in the order of _INDX_STEPS (the table), whatever order the checks ran in
    {% set smap = {} %}
    {% for st in ns.steps %}{% set _ = smap.update({st[0]: st[1]}) %}{% endfor %}
    {% set todo = [] %}
    {% for r in table if smap[r.key]|default("ok") not in ["ok", "info"] %}{% set _ = todo.append([r.key, smap[r.key]]) %}{% endfor %}
    # print and measure XY needs filament: deferred, it comes after the loads
    {% if cal.xy_after_fil|default(0)|int and smap.filament|default("ok") != "ok" and smap.xy|default("ok") not in ["ok", "info"] %}
        {% set todo = (todo|rejectattr(0, "equalto", "xy")|list) + [["xy", smap.xy]] %}
    {% endif %}
    # A trigger offset to measure again waits for the hot clean, which marks it
    # again anyway (a clean skipped without running leaves the mark)
    {% if smap.trigger|default("ok") == "redo" and smap.clean|default("ok") not in ["ok", "info"] %}
        {% set tq = namespace(l=[]) %}
        {% for e in todo if e[0] != "trigger" %}
            {% set tq.l = tq.l + [e] %}
            {% if e[0] == "clean" %}{% set tq.l = tq.l + [["trigger", "redo"]] %}{% endif %}
        {% endfor %}
        {% set todo = tq.l %}
    {% endif %}
    {% if running %}
        {% set ns.next = "resume" %}
        {% set ns.next_text = "Resume after a stopped step (" ~ running ~ ")" %}
        {% set ns.next_cmd = "INDX_SETUP" %}
    {% elif waiting %}
        {% set ns.next = "pending" %}
        {% set ns.next_text = "Save or discard: " ~ pend.what|default("the last result") %}
        {% set ns.next_cmd = "INDX_SETUP STEP=pending" %}
    {% elif todo %}
        {% set key = todo[0][0] %}
        {% set row = table|selectattr("key", "equalto", key)|first %}
        {% set ns.next = key %}
        {% set ns.next_text = row.label %}
        {% if key == "hw" and hw_q %}
            {% set ns.next_cmd = "INDX_CAL_HARDWARE Q=2" %}
            {% set ns.next_text = "Part cooling" %}
        {% elif key == "lc" and "load_cell_probe" in printer and printer.load_cell_probe.is_calibrated|default(false) %}
            # a dialog first: the Setup tab's Start and the bell's buttons
            # run next_cmd in one click, and a restart takes a second step
            {% set ns.next_cmd = "_INDX_LC_SAVE_ASK" %}
            {% set ns.next_text = "Save the load cell calibration (Klipper restarts)" %}
        {% elif key == "heater" and fil_first >= 0 %}
            # Before the hot clean (Kalico does not heat without a heater model), on the
            # first tool to load, empty [EL-SET-006]
            {% set ns.next_cmd = "INDX_CAL_HEATER TOOL=%d" % fil_first %}
            {% set ns.next_text = "Heater safety model, on T%d" % fil_first %}
        {% elif key == "docks" and dock_first >= 0 %}
            {% set ns.next_cmd = "INDX_CAL_DOCK TOOL=%d" % dock_first %}
            {% set ns.next_text = "Dock T%d" % dock_first %}
        {% elif key == "docks" %}
            # every dock in the count is measured: the next one or that was
            # the last (a choice)
            {% set ns.next_cmd = "INDX_DOCKS" %}
            {% set ns.next_text = "%d dock%s measured: add the next or say that was the last" % (n, "s" if n != 1 else "") %}
        {% elif key == "z" and ns.zsens %}
            # the XY sensor Z references only: CAL_Z with empty, cold tools;
            # with filament recorded, a dialog says what to do first
            {% set zl = namespace(l=[]) %}
            {% for i in range(n) if i not in no_heat %}
                {% if svv["t%d_material" % i]|default("")|string or svv["t%d_fil_density" % i]|default(0)|float > 0 %}{% set zl.l = zl.l + [i] %}{% endif %}
            {% endfor %}
            {% set ns.next_cmd = "_INDX_SENSOR_REF_ASK" if zl.l else "INDX_CAL_Z LOADED=0" %}
            {% set ns.next_text = "XY sensor Z references (CAL_Z with empty, cold tools)" %}
        {% elif key == "filament" %}
            {% set ns.next_cmd = "INDX_LOAD TOOL=%d" % fil_first %}
            {% set ns.next_text = "Filament in T%d" % fil_first %}
        {% else %}
            {% set ns.next_cmd = row.cmd %}
        {% endif %}
    {% endif %}
    # the steps as the user sees them: a step's state is the worst of its routines;
    # done/total count steps, rdone/rtotal routines. presses: Start, 2 hardware answers,
    # head empty, the slide, the home, the last dock, the material, per other tool Add
    # and its slide, per tool "Filament is in", and the XY method with two tools or
    # more. Until the dock count is complete: shown for 4 tools (kn)
    {% set one = n < 2 and docks_done %}
    {% set kn = n if docks_done else 4 %}
    {% set gtab = printer["gcode_macro _INDX_STEP_GROUPS"].groups %}
    {% set gns = namespace(groups=[], gdone=0, gtotal=0, gnext="", gnext_text="", gnum=0) %}
    {% for g in gtab if not (g.tools|default(0)|int and one) %}
        {% set sts = [] %}
        {% for rk in g.routines %}{% set _ = sts.append(smap[rk]|default("ok")) %}{% endfor %}
        {% set gs = "stop" if "stop" in sts else ("redo" if "redo" in sts else ("todo" if "todo" in sts else ("ok" if "ok" in sts else "info"))) %}
        {% set lbl = (g.label1 if one and g.label1 is defined else g.label)|replace("T0", "T%d" % reft) %}
        {% set gns.groups = gns.groups + [[g.key, gs, lbl]] %}
        {% if gs != "info" %}{% set gns.gtotal = gns.gtotal + 1 %}{% endif %}
        {% if gs == "ok" %}{% set gns.gdone = gns.gdone + 1 %}{% endif %}
        {% if ns.next in g.routines and not gns.gnext %}
            {% set gns.gnext = g.key %}
            {% set gns.gnext_text = lbl %}
            {% set gns.gnum = gns.groups|length %}
        {% endif %}
    {% endfor %}
    {% set presses = 6 + 3 * kn + (1 if kn >= 2 else 0) + (1 if "pause" in smap else 0) %}
    # time per step (_INDX_STEP_GROUPS min, estimates until measured): for
    # this printer's tool count once the dock count is complete (known), for
    # 4 tools before that, and the totals for 4 and 10 tools
    {% set tms = namespace(steps=[], opt=[], tot={}) %}
    {% for k in [kn, 4, 10] %}
        {% set outer_first = loop.first %}
        {% set acc = namespace(lo=0.0, hi=0.0, alo=0.0, ahi=0.0) %}
        {% for g in gtab if g.min is defined and not (g.tools|default(0)|int and k < 2) %}
            {% set mm = g.min %}
            {% set o = [k - 1, 0]|max %}
            {% set lo = (mm.fixed|default([0, 0]))[0] + k * (mm.tool|default([0, 0]))[0] + o * (mm.other|default([0, 0]))[0] %}
            {% set hi = (mm.fixed|default([0, 0]))[1] + k * (mm.tool|default([0, 0]))[1] + o * (mm.other|default([0, 0]))[1] %}
            {% set alo = (mm.at|default([0, 0]))[0] + k * (mm.at_tool|default([0, 0]))[0] + o * (mm.at_other|default([0, 0]))[0] %}
            {% set ahi = (mm.at|default([0, 0]))[1] + k * (mm.at_tool|default([0, 0]))[1] + o * (mm.at_other|default([0, 0]))[1] %}
            {% if mm.optional|default(0)|int %}
                {% if outer_first %}{% set tms.opt = tms.opt + [[g.key, lo, hi]] %}{% endif %}
            {% else %}
                {% if outer_first %}{% set tms.steps = tms.steps + [[g.key, lo, hi, alo, ahi]] %}{% endif %}
                {% set acc.lo = acc.lo + lo %}
                {% set acc.hi = acc.hi + hi %}
                {% set acc.alo = acc.alo + alo %}
                {% set acc.ahi = acc.ahi + ahi %}
            {% endif %}
        {% endfor %}
        {% set _ = tms.tot.update({("n" if loop.first else (k|string)): [acc.lo, acc.hi, acc.alo, acc.ahi]}) %}
    {% endfor %}
    {% set times = {"n": kn, "known": docks_done, "steps": tms.steps, "total": tms.tot, "opt": tms.opt} %}
    # values typed in by hand instead of calibrated (indx_src)
    {% set srcs = svv.indx_src|default({}) %}
    {% set man = [] %}
    {% if srcs is mapping %}
        {% for k, v in srcs|dictsort if v == "manual" %}
            {% set _ = man.append(k|replace("dock_", "dock T")|replace("z_", "Z offset T")|replace("xy_", "XY offset T")|replace("soak_", "soak ")|replace("trigger", "trigger offset")|replace("clearance", "clearance line")) %}
        {% endfor %}
    {% endif %}
    {% if man %}
        {% set ns.rows = ns.rows + [["info", "Entered by hand, not calibrated: " ~ man|join(", ")]] %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=rows VALUE='{ns.rows|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=steps VALUE='{ns.steps|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=groups VALUE='{gns.groups|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=marks VALUE='{ns.marks|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=done VALUE={gns.gdone}
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=total VALUE={gns.gtotal}
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=rdone VALUE={done}
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=rtotal VALUE={total}
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=presses VALUE={presses}
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=times VALUE='{times|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=next_group VALUE='{gns.gnext|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=next_group_text VALUE='{gns.gnext_text|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=next_group_n VALUE={gns.gnum}
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=unsaved VALUE='{(uns.items|join(" and "))|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=next VALUE='{ns.next|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=next_cmd VALUE='{ns.next_cmd|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=next_text VALUE='{ns.next_text|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_STATE VARIABLE=running VALUE='{running|tojson}'

[gcode_macro _INDX_STATUS_PRINT]
description: Inner - print the stored status (BRIEF=1: headline and head only, DETAIL=1: plus offsets)
gcode:
    {% set s = printer["gcode_macro _INDX_STATE"] %}
    {% set tags = {"ok": "[ok]  ", "todo": "[ ]   ", "redo": "[redo]", "stop": "[STOP]", "warn": "[WARN]", "new": "[new] ", "info": "[info]"} %}
    {% if s.next and s.next_group_n|int %}
        {% set head = "INDX %d of %d setup steps done (%d of %d routines). Next: step %d, %s: %s (INDX_SETUP, or %s)" % (s.done, s.total, s.rdone, s.rtotal, s.next_group_n, s.next_group_text, s.next_text, s.next_cmd) %}
    {% elif s.next %}
        {% set head = "INDX %d of %d setup steps done (%d of %d routines). Next: %s (INDX_SETUP, or %s)" % (s.done, s.total, s.rdone, s.rtotal, s.next_text, s.next_cmd) %}
    {% else %}
        {% set head = "INDX ok All %d setup steps done (%d routines)." % (s.total, s.rtotal) %}
    {% endif %}
    {% set ns = namespace(lines=[head]) %}
    {% set marks = s.marks|default([]) %}
    {% if params.BRIEF|default(0)|int or not marks %}
        {% for r in s.rows %}
            {% if not params.BRIEF|default(0)|int or r[0] in ["stop", "warn"] or r[1].startswith("Head:") %}
                {% set ns.lines = ns.lines + [tags[r[0]] ~ " " ~ r[1]] %}
            {% endif %}
        {% endfor %}
    {% else %}
        # the rows of each routine (marks: the end index of its rows), under
        # the step they belong to; the general rows first, the head and the
        # machine last
        {% set span = {} %}
        {% set pns = namespace(prev=0) %}
        {% for mk in marks %}{% set _ = span.update({mk[0]: [pns.prev, mk[1]]}) %}{% set pns.prev = mk[1] %}{% endfor %}
        {% set gtab = printer["gcode_macro _INDX_STEP_GROUPS"].groups %}
        {% for r in s.rows[:span[""][1]] %}{% set ns.lines = ns.lines + [tags[r[0]] ~ " " ~ r[1]] %}{% endfor %}
        {% for g in s.groups %}
            {% set gdef = gtab|selectattr("key", "equalto", g[0])|first %}
            {% set ns.lines = ns.lines + [tags[g[1]] ~ (" Step %d: %s" % (loop.index, g[2]) if g[1] != "info" else " " ~ g[2])] %}
            {% for rk in gdef.routines if rk in span %}
                {% for r in s.rows[span[rk][0]:span[rk][1]] %}
                    {% set ns.lines = ns.lines + ["    " ~ tags[r[0]] ~ " " ~ r[1]] %}
                {% endfor %}
            {% endfor %}
        {% endfor %}
        {% for r in s.rows[pns.prev:] %}{% set ns.lines = ns.lines + [tags[r[0]] ~ " " ~ r[1]] %}{% endfor %}
    {% endif %}
    {% if params.DETAIL|default(0)|int %}
        {% set svv = printer.save_variables.variables %}
        {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
        {% set act = svv.active_tool|default(-1)|int %}
        {% set act_z = svv["t%d_offset_z" % act]|default(0.0)|float if act >= 0 else 0.0 %}
        {% set ns.lines = ns.lines + ["Tool offsets (mm, relative to the reference tool T%d):" % svv.ref_tool|default(0)|int] %}
        {% for i in range(n) %}
            {% set ns.lines = ns.lines + ["  T%d  X %s  Y %s  Z %s" % (i, svv["t%d_offset_x" % i]|default("--"), svv["t%d_offset_y" % i]|default("--"), svv["t%d_offset_z" % i]|default("--"))] %}
        {% endfor %}
        {% set ns.lines = ns.lines + ["Saved global Z %.3f mm, live %.3f mm (INDX_FIRST_LAYER ADJUST= to trim)" % (svv.global_z_offset|default(0.0)|float, printer.gcode_move.homing_origin.z|float - act_z)] %}
    {% endif %}
    {action_respond_info(ns.lines|join("\n"))}

#####################################################################
#  3. INDX_SETUP: the front door
#####################################################################

#####################################################################
#  THE GUIDE: autosave on a passing check, then on to the next step
#####################################################################
#
#  The guide asks as little of the user as possible without affecting the
#  end result. A result that passes its checks is saved by itself and the
#  guide runs on, until a hand action, a failed check (Save anyway / Measure
#  again / Discard), a SAVE_CONFIG restart (nothing moves after it until a
#  button) or a choice only the user can make. Every safety stop and every
#  hand-action confirmation stays. [EL-SET-007]
#
#  _INDX_GUIDE.on: 1 while the guide runs; a restart clears it and the
#  after-restart dialog sets it again. Off, a step still saves a passing
#  result by itself but does not run on to another step.
#
#####################################################################

[gcode_macro _INDX_GUIDE]
description: Inner - the guide's state: on (1 while the guide runs on by itself), skip (1: the step that just saved takes over, the next INDX_SAVE_PENDING does not advance)
variable_on: 0
variable_skip: 0
gcode:

[gcode_macro _INDX_LATER]
description: Inner - run CMD (~ for spaces) a moment later, from a delayed_gcode, once the macro that is running now has returned. Every hand-over from one setup step to the next goes through here: Klipper refuses a macro that is reached again while it still runs ("called recursively"). One command waits at a time; a second call replaces it
variable_cmd: ""
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_LATER VARIABLE=cmd VALUE='{params.CMD|default("")|replace("~", " ")|tojson}'
    UPDATE_DELAYED_GCODE ID=_indx_later DURATION=0.2

[delayed_gcode _indx_later]
gcode:
    {% set c = printer["gcode_macro _INDX_LATER"].cmd|string %}
    {% if c %}
        SET_GCODE_VARIABLE MACRO=_INDX_LATER VARIABLE=cmd VALUE='""'
        {c}
    {% endif %}

[gcode_macro _INDX_GUIDE_LATER]
description: Inner - the guide's hand-over: when the guide is on, the next step runs a moment later (_INDX_LATER), after the step that calls this has returned
gcode:
    {% if printer["gcode_macro _INDX_GUIDE"].on|int %}
        _INDX_LATER CMD=_INDX_GUIDE_NEXT
    {% endif %}

[gcode_macro _INDX_GUIDE_RUN]
description: Inner - start the guide from a button (INDX_SETUP's Start, the INDX page's Start, the bell): guide on, then the next step runs by itself (CMD= another command instead, ~ for spaces)
gcode:
    _INDX_PROMPT_END
    SET_GCODE_VARIABLE MACRO=_INDX_GUIDE VARIABLE=on VALUE=1
    {% if params.CMD is defined %}
        {params.CMD|replace("~", " ")}
    {% else %}
        _INDX_GUIDE_NEXT
    {% endif %}

[gcode_macro _INDX_GUIDE_NEXT]
description: Inner - the guide runs on: work out the next step and run it without asking where nothing but INDX is needed (the status is computed first, the step chosen in _INDX_GUIDE_STEP, which renders after it). Only ever reached from a button or from _INDX_LATER, never from inside a step
gcode:
    {% if printer["gcode_macro _INDX_GUIDE"].on|int %}
        _INDX_BUILD_TOOLS
        _INDX_SEAT_G
        _INDX_PAUSE_PARK_STATE
        _INDX_STATUS_COMPUTE
        _INDX_GUIDE_STEP
    {% endif %}

[gcode_macro _INDX_GUIDE_STEP]
description: Inner - run the next setup step the way the guide does: by itself where only INDX is needed, with a dialog where a hand, a choice or a restart is involved
gcode:
    # calls: INDX_CAL_HARDWARE, INDX_CAL_LOADCELL, INDX_SETUP, INDX_MACHINE_CHECKS, INDX_CAL_TRIGGER, INDX_CAL_DOCK, INDX_DOCKS, INDX_SET_CLEARANCE, INDX_TEST_ALL_TOOLS, _INDX_SETUP_TC_LATCH, INDX_CAL_CLEAN, INDX_CAL_Z, _INDX_SENSOR_REF_ASK, INDX_CAL_TOOLS, INDX_CAL_XY, INDX_CAL_XY_PRINT, INDX_CAL_HEATER, INDX_LOAD_PLAN, _INDX_SAVE_CONFIG
    {% set s = printer["gcode_macro _INDX_STATE"] %}
    {% set svv = printer.save_variables.variables %}
    {% set cal = svv.indx_cal|default({}) %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set key = s.next|string %}
    {% set cmd = s.next_cmd|string %}
    {% set pcool = printer["gcode_macro _INDX_MACHINE"].part_cooling|default("not_set")|string %}
    {% set ns = namespace(loaded=[]) %}
    {% for i in range(tp.tool_count|int) if i not in tp.no_heat_tools|default([]) %}
        {% if svv["t%d_material" % i]|default("")|string or svv["t%d_fil_density" % i]|default(0)|float > 0 %}{% set ns.loaded = ns.loaded + ["T%d" % i] %}{% endif %}
    {% endfor %}
    {% set lc_unsaved = "load_cell_probe" in printer and printer.load_cell_probe.is_calibrated|default(false) and "load_cell_probe" in printer.configfile.save_config_pending_items|default({}) and not ("indx_clog" in printer and printer.indx_clog.lc_cpg_only|default(false)) %}
    {% if key in ["resume", "pending"] %}
        # an interrupted step or a result that failed its check: the dialogs
        INDX_SETUP
    {% elif not key %}
        {% if s.unsaved|default("")|string %}
            # the end: the measured values go into printer.cfg by themselves,
            # the all-done dialog opens after the restart
            RESPOND MSG="INDX > Setup: every step is done. SAVE_CONFIG writes {s.unsaved} into printer.cfg and restarts Klipper."
            _INDX_SAVE_CONFIG THEN=setup
        {% else %}
            INDX_SETUP
        {% endif %}
    {% elif key == "hw" %}
        # two answers only the user can give
        {cmd}
    {% elif key == "lc" and lc_unsaved %}
        RESPOND MSG="INDX > Setup: the load cell calibration goes into printer.cfg by itself (SAVE_CONFIG, Klipper restarts), then the first home."
        _INDX_SAVE_CONFIG THEN=home
    {% elif key == "lc" %}
        # the head must be empty before the latch opens: a confirmation
        INDX_CAL_LOADCELL
    {% elif key == "home" %}
        # after the restart: the dialog says what will happen first
        INDX_SETUP STEP=home
    {% elif key == "homing" %}
        INDX_MACHINE_CHECKS CONFIRM=1
    {% elif key == "trigger" %}
        INDX_CAL_TRIGGER CONFIRM=1
    {% elif key == "docks" and cmd.startswith("INDX_CAL_DOCK") %}
        # a dock in the count without a measurement: ends in the slide dialog (a hand)
        {cmd} STEP=off
    {% elif key == "docks" %}
        # every dock in the count measured: add the next dock or that was
        # the last (a choice, the user knows how many docks there are)
        INDX_DOCKS
    {% elif key == "clearance" %}
        INDX_SET_CLEARANCE AUTO=1
        _INDX_GUIDE_LATER
    {% elif key == "test" %}
        {% if ns.loaded %}
            # filament in a tool: the lock force needs empty tools, the user decides
            INDX_TEST_ALL_TOOLS SETUP=1
        {% else %}
            RESPOND MSG="INDX > Setup: tool change test{', latch homing and lock force' if 'tmc_sg_log' in printer else ''}, every tool recorded empty"
            INDX_TEST_ALL_TOOLS SETUP=1 CONFIRM=1
        {% endif %}
    {% elif key in ["latch", "lock"] %}
        {% if ns.loaded %}
            INDX_TEST_ALL_TOOLS SETUP=1
        {% else %}
            # the test has passed: only latch homing and the lock force are left
            RESPOND MSG="INDX > Setup: {'latch homing and ' if key == 'latch' else ''}lock force, every tool recorded empty"
            _INDX_SETUP_TC_LATCH
        {% endif %}
    {% elif key == "clean" %}
        # runs by itself: every empty tool in turn, one console line each;
        # it stops with a dialog when a tip still reads high after its passes
        INDX_CAL_CLEAN CONFIRM=1
    {% elif key == "z" and cmd in ["INDX_CAL_Z LOADED=0", "_INDX_SENSOR_REF_ASK"] %}
        # only the XY sensor Z references are missing: CAL_Z by itself with
        # empty tools (no XY after it), or the dialog when filament is recorded
        RESPOND MSG="INDX > Setup: XY sensor Z references, CAL_Z with every tool empty and cold"
        {cmd}
    {% elif key == "z" %}
        {% if ns.loaded %}
            INDX_CAL_Z
        {% else %}
            RESPOND MSG="INDX > Setup: tool offsets, Z then XY, every tool recorded empty"
            INDX_CAL_TOOLS EMPTY=1 CONFIRM=1
        {% endif %}
    {% elif key == "xy" and cal.xy_after_fil|default(0)|int %}
        # print and measure, deferred until the filament was loaded
        INDX_CAL_XY_PRINT
    {% elif key == "xy" %}
        # the method is the user's choice
        INDX_CAL_XY
    {% elif key == "heater" %}
        {% if pcool == "not_set" %}
            INDX_CAL_HARDWARE Q=2
        {% else %}
            RESPOND MSG="INDX > Setup: heater safety model ({cmd}), the heater only{'' if pcool == 'none' else '; the part fan term takes assumed values until INDX_CAL_FAN measures it'}"
            {cmd} CONFIRM=1 FAN=0
        {% endif %}
    {% elif key == "filament" %}
        # one material choice for all tools, then each load asks only for
        # the filament to be pushed in
        INDX_LOAD_PLAN
    {% else %}
        {cmd}
    {% endif %}

[gcode_macro _INDX_GUIDE_XY_CHECK]
description: Inner - after an XY offset was saved by the camera or by hand: in the guide, once every tool has one, run on to the next step
gcode:
    {% if printer["gcode_macro _INDX_GUIDE"].on|int %}
        {% set svv = printer.save_variables.variables %}
        {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
        {% set cal = svv.indx_cal|default({}) %}
        {% set ref = svv.ref_tool|default(0)|int %}
        {% set ns = namespace(miss=0) %}
        {% for i in range(tp.tool_count|int) if i != ref %}
            {% if i not in cal.xy|default([]) and not (("t%d_offset_x" % i) in svv and ("t%d_offset_y" % i) in svv) %}{% set ns.miss = 1 %}{% endif %}
        {% endfor %}
        {% if not ns.miss %}
            RESPOND MSG="INDX > Setup: every tool has its XY offset, on to the next step"
            _INDX_GUIDE_LATER
        {% endif %}
    {% endif %}

[gcode_macro _INDX_XY_DEFER]
description: Inner - the print and measure XY method needs filament: do the XY offsets after the loads (the guide runs the print method then). Saves: indx_cal xy_after_fil
gcode:
    _INDX_PROMPT_END
    _INDX_CAL_SET KEY=xy_after_fil VALUE=1
    RESPOND MSG="INDX > XY offsets: after the filament loads (print and measure). The setup goes on with the heater model and the filament."
    {% if printer["gcode_macro _INDX_GUIDE"].on|int %}
        _INDX_GUIDE_LATER
    {% else %}
        INDX_SETUP
    {% endif %}

[gcode_macro INDX_LOAD_PLAN]
description: Setup: which filament goes into which tool, asked once before the loads (the same for every tool, or per tool), so each load only asks for the filament to be pushed in. TYPE=<material>: every tool; TOOL=n TYPE=: one tool; TOOL=n alone: ask for that tool. Saves: indx_cal fil_plan
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set n = tp.tool_count|int %}
    {% set ref = svv.ref_tool|default(0)|int %}
    {% set pre = printer["gcode_macro LOAD_FILAMENT"].filament_presets %}
    {% set plan = (svv.indx_cal|default({})).fil_plan|default({}) %}
    # the tools to load, in the load order: the others first, the reference last
    {% set ns = namespace(todo=[], first=-1) %}
    {% for i in range(n) if i != ref and i not in tp.no_heat_tools|default([]) %}
        {% if not (svv["t%d_material" % i]|default("")|string or svv["t%d_fil_density" % i]|default(0)|float > 0) %}{% set ns.todo = ns.todo + [i] %}{% endif %}
    {% endfor %}
    {% if ref not in tp.no_heat_tools|default([]) and not (svv["t%d_material" % ref]|default("")|string or svv["t%d_fil_density" % ref]|default(0)|float > 0) %}{% set ns.todo = ns.todo + [ref] %}{% endif %}
    {% set planned = ns.todo|reject("in", plan.keys()|map("int")|list)|list %}
    {% if not ns.todo %}
        RESPOND MSG="INDX > Load plan: every tool has filament recorded."
        _INDX_GUIDE_LATER
    {% elif params.TYPE is not defined and params.TOOL is not defined and not planned %}
        # a plan from before an interruption covers every tool left: no question
        _INDX_LOAD_PLAN_GO
    {% elif params.TYPE is defined %}
        {% set type = params.TYPE|upper %}
        {% if type not in pre %}
            {action_raise_error("INDX_LOAD_PLAN: unknown TYPE '%s'. Known types: %s." % (type, pre|join(", ")))}
        {% endif %}
        _INDX_PROMPT_END
        {% set d = {} %}
        {% for k, v in plan.items() %}{% set _ = d.update({k|string: v}) %}{% endfor %}
        {% if params.TOOL is defined %}
            {% set _ = d.update({params.TOOL|int|string: type}) %}
        {% else %}
            {% for i in ns.todo %}{% set _ = d.update({i|string: type}) %}{% endfor %}
        {% endif %}
        _INDX_CAL_SET KEY=fil_plan VALUE='{d|tojson}'
        _INDX_LOAD_PLAN_GO
    {% elif params.TOOL is defined %}
        {% set t = params.TOOL|int %}
        {% set nsb = namespace(a=[], b=[]) %}
        {% for m in pre.keys()|list %}
            {% set btn = "%s %d C|INDX_LOAD_PLAN TOOL=%d TYPE=%s|primary" % (m, pre[m].temp, t, m) %}
            {% if loop.index <= 4 %}{% set nsb.a = nsb.a + [btn] %}{% else %}{% set nsb.b = nsb.b + [btn] %}{% endif %}
        {% endfor %}
        _INDX_PROMPT TITLE="Filament for T{t}" TEXT="Which filament goes into T{t}? {('Already chosen: ' ~ plan[t|string] ~ '. ') if (t|string) in plan else ''}Tools without a choice are asked next; the loads start when every tool has one." G1="{nsb.a|join('^')}" G2="{nsb.b|join('^')}" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        {% set nsb = namespace(a=[], b=[]) %}
        {% for m in pre.keys()|list %}
            {% set btn = "%s %d C|INDX_LOAD_PLAN TYPE=%s|primary" % (m, pre[m].temp, m) %}
            {% if loop.index <= 4 %}{% set nsb.a = nsb.a + [btn] %}{% else %}{% set nsb.b = nsb.b + [btn] %}{% endif %}
        {% endfor %}
        _INDX_PROMPT TITLE="Which Filament in Each Tool?" TEXT="One choice for every tool: T{ns.todo|join(', T')} are loaded in that order (the reference tool last, so it ends on the head)." TEXT2="Then you push the filament into each tool in its dock until it stops at the gears, and INDX loads them in turn: it picks each up, heats, feeds, primes and shapes the tip." G1="{nsb.a|join('^')}" G2="{nsb.b|join('^')}" B1="Different filaments per tool|INDX_LOAD_PLAN TOOL={ns.todo[0]}|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_LOAD_PLAN_GO]
description: Inner - INDX_LOAD_PLAN: with a filament chosen for every tool to load, start the first load (its pickup, then the push dialog); else ask for the next tool without one
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set n = tp.tool_count|int %}
    {% set ref = svv.ref_tool|default(0)|int %}
    {% set plan = (svv.indx_cal|default({})).fil_plan|default({}) %}
    {% set ns = namespace(todo=[]) %}
    {% for i in range(n) if i != ref and i not in tp.no_heat_tools|default([]) %}
        {% if not (svv["t%d_material" % i]|default("")|string or svv["t%d_fil_density" % i]|default(0)|float > 0) %}{% set ns.todo = ns.todo + [i] %}{% endif %}
    {% endfor %}
    {% if ref not in tp.no_heat_tools|default([]) and not (svv["t%d_material" % ref]|default("")|string or svv["t%d_fil_density" % ref]|default(0)|float > 0) %}{% set ns.todo = ns.todo + [ref] %}{% endif %}
    {% set miss = ns.todo|reject("in", plan.keys()|map("int")|list)|list %}
    {% if miss %}
        # the next tool's question, once this call has returned
        _INDX_LATER CMD=INDX_LOAD_PLAN~TOOL={miss[0]}
    {% elif ns.todo %}
        {% set t = ns.todo[0] %}
        {% set txt = [] %}
        {% for i in ns.todo %}{% set _ = txt.append("T%d %s" % (i, plan[i|string])) %}{% endfor %}
        {% set types = [] %}{% for i in ns.todo %}{% set _ = types.append(plan[i|string]) %}{% endfor %}
        RESPOND MSG="INDX > Load plan: {txt|join(', ')}, in that order."
        # all at once (filament pushed in the docks) is the recommended way;
        # the dialog offers one at a time too [EL-SET-044]
        INDX_LOAD_ALL TOOLS={ns.todo|join(",")} TYPES={types|join(",")} PLAN=1
    {% endif %}

[gcode_macro INDX_SETUP]
description: Guided setup: shows what is done and offers the next step as a button (a result waiting for Save comes first). STEP=<key> opens that step, DONE=hw marks the hardware checks done. Moves: nothing by itself
gcode:
    {% if params.DONE is defined %}
        {% set k = params.DONE|lower %}
        {% if k in ["hw", "tested", "homed"] %}
            _INDX_CAL_SET KEY={k} VALUE=1
            RESPOND MSG="INDX ok Setup step {k} marked done."
        {% else %}
            {action_raise_error("INDX_SETUP DONE= takes hw; the other steps are checked from what INDX measured or saved.")}
        {% endif %}
    {% endif %}
    _INDX_BUILD_TOOLS
    _INDX_SEAT_G
    _INDX_PAUSE_PARK_STATE
    _INDX_STATUS_COMPUTE
    _INDX_SETUP_SHOW STEP={params.STEP|default("")|lower}

[gcode_macro _INDX_LC_SAVE_ASK]
description: Inner - the load cell calibration is not saved yet: from the overview or the console a dialog asks before SAVE_CONFIG restarts Klipper (a tool locked on the head stays on); the guide itself runs the restart without asking
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    _INDX_PROMPT TITLE="Save Load Cell Calibration" TEXT="SAVE_CONFIG writes the load cell calibration to printer.cfg and restarts Klipper. Homing waits for it: the homing seat check weighs against the saved calibration." TEXT2="{('T%d stays locked on the head through the restart.' % act) if act >= 0 else 'The head is recorded empty.'}" B1="Save config: Klipper restarts, then the first home|_INDX_SAVE_CONFIG THEN=home|warning" F1="Later|_INDX_PROMPT_END|secondary"

[gcode_macro _INDX_SAVE_CONFIG]
description: Inner - SAVE_CONFIG from a setup dialog: note what the setup shows once Klipper is back (THEN=home: the first home dialog, THEN=none: nothing, a calibration outside the setup, anything else: INDX_SETUP), then SAVE_CONFIG (Klipper restarts). Nothing moves after the restart until a button is pressed
gcode:
    _INDX_PROMPT_END
    {% set then = params.THEN|default("setup")|string %}
    _INDX_CAL_SET KEY=after_restart VALUE='"{"" if then == "none" else then}"'
    SAVE_CONFIG

[delayed_gcode _indx_after_restart]
# A few seconds after Klipper is ready, so Mainsail, Fluidd or the INDX page
# have reconnected and show the dialog. The marker is used once.
initial_duration: 8.0
gcode:
    {% set cal = printer.save_variables.variables.indx_cal|default({}) %}
    {% set then = cal.after_restart|default("")|string %}
    {% if then and "gcode_macro _INDX_STATE" in printer %}
        {% if then == "hw" %}
            # dir_pin inverted by hand: the latch wave again (only the latch
            # moves; the guide state is as it was)
            # Clear the flag only after the action is queued, so a crash in this
            # window does not lose the resume intent
            _INDX_CAL_SET KEY=after_restart VALUE='""'
            RESPOND MSG="INDX > Back after the restart: the latch wave runs again."
            INDX_CAL_HARDWARE Q=1
        {% else %}
        # back in the guide: the dialog says what will happen, its button
        # runs on from there (the user may have touched the printer)
        _INDX_CAL_SET KEY=after_restart VALUE='""'
        SET_GCODE_VARIABLE MACRO=_INDX_GUIDE VARIABLE=on VALUE=1
        RESPOND MSG="INDX > Back after the restart: {'the first home' if then == 'home' else 'the setup'} is next. Nothing moves until you press a button."
        {% if then == "home" %}
            INDX_SETUP STEP=home
        {% else %}
            INDX_SETUP
        {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_SETUP_SHOW]
description: Inner - the INDX_SETUP dialog for the next step (or STEP=)
gcode:
    {% set s = printer["gcode_macro _INDX_STATE"] %}
    {% set table = printer["gcode_macro _INDX_STEPS"].steps %}
    {% set want = params.STEP|default("")|string %}
    {% set key = want if want else s.next %}
    {% if key == "resume" %}
        _INDX_RESUME_ASK
    {% elif key == "pending" %}
        # a result that failed its check (a passing one is saved by itself)
        _INDX_PENDING_ASK TITLE="A Result Waits for Save" AUTO=0
    {% elif key == "home" %}
        _INDX_SETUP_HOME
    {% elif not key %}
        _INDX_STATUS_PRINT
        # the guide ends here
        SET_GCODE_VARIABLE MACRO=_INDX_GUIDE VARIABLE=on VALUE=0
        _INDX_CAL_SET KEY=autosaved VALUE='""'
        {% set uns = s.unsaved|default("")|string %}
        {% set soak = (printer.save_variables.variables.indx_cal|default({})).soak|default({}) %}
        {% set fan_due = (printer.save_variables.variables.indx_cal|default({})).fan_assumed|default("")|string not in ["", "none"] %}
        {% set soak_txt = "" if soak|length else "Optional, worth doing once per bed temperature you print at: the bed keeps growing for minutes after it reads at temperature, and the first-layer height drifts with it. A measured soak time makes PRINT_START wait exactly as long as this bed needs instead of a fixed 10 minutes: shorter prints and a correct first layer. INDX_CAL_SOAK taps once a minute from a cold bed, 15 to 40 minutes, by itself." ~ (" The same run first measures the part fan term of the heater model on this printer (INDX_CAL_FAN, about 15 min over the purge lane slot): until then it uses assumed values for your part cooling." if fan_due else "") %}
        _INDX_PROMPT TITLE="Setup: All {s.total} Steps Done" TEXT="Every routine ({s.rtotal}) is done. {('Not saved yet: ' ~ uns ~ '. INDX uses the measured values now; SAVE_CONFIG writes them into printer.cfg and restarts Klipper, and a restart before that loses them. ') if uns else 'Everything INDX checks is set. '}Redo a step any time from INDX_STATUS or the INDX page." TEXT2="{soak_txt}" B1="{('Save config: Klipper restarts|_INDX_SAVE_CONFIG THEN=setup|warning') if uns else ''}" B2="{(('Measure the bed soak time and the part fan term (optional)' if fan_due else 'Measure the bed soak time (optional)') ~ '|_INDX_DO CMD=INDX_CAL_SOAK|' ~ ('secondary' if uns else 'primary')) if not soak|length else ''}" B3="Show the full status|_INDX_DO CMD=INDX_STATUS~DETAIL=1|info" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        {% set row = table|selectattr("key", "equalto", key)|first %}
        {% set cmd = s.next_cmd if key == s.next else row.cmd %}
        {% set mark = ("INDX_SETUP DONE=" ~ key) if key == "hw" and not (printer.save_variables.variables.indx_cal|default({})).hw|default(0)|int else "" %}
        _INDX_STATUS_PRINT BRIEF=1
        # Start runs the guide from here: the next step by itself where only
        # INDX is needed, a dialog where a hand or a choice is (a step opened
        # with STEP= that is not the next one runs its own command)
        {% set start = "_INDX_GUIDE_RUN" if key == s.next else cmd|replace(' ', '~') %}
        # the step (what the user does) this routine belongs to
        {% set gtab = printer["gcode_macro _INDX_STEP_GROUPS"].groups %}
        {% set gn = namespace(n=0, text="") %}
        {% for g in s.groups %}{% set gd = gtab|selectattr("key", "equalto", g[0])|first %}{% if key in gd.routines %}{% set gn.n = loop.index %}{% set gn.text = g[2] %}{% endif %}{% endfor %}
        # at the start of the setup: how long it takes and when the user is
        # needed at the printer (_INDX_STATE.times, estimates until measured)
        {% set tm = s.times|default({}) %}
        {% set tl = namespace(lines=[]) %}
        {% if s.done|int == 0 and tm.steps is defined %}
            {% for st in tm.steps %}
                {% set gd = gtab|selectattr("key", "equalto", st[0])|first %}
                {% set tl.lines = tl.lines + ["%d. %d to %d min%s" % (loop.index, st[1], st[2], (", at the printer %d to %d min (%s)" % (st[3], st[4], gd.min.at_why)) if st[4] > 0 else ", by itself")] %}
            {% endfor %}
            {% for st in tm.opt %}
                {% set gd = gtab|selectattr("key", "equalto", st[0])|first %}
                {% set tl.lines = tl.lines + ["Optional, %s: %d to %d min, by itself" % (gd.label|replace(" (optional)", ""), st[1], st[2])] %}
            {% endfor %}
        {% endif %}
        {% set rnd = namespace(t="") %}
        {% if tl.lines %}
            {% set t = tm.total %}
            {% if not tm.known|default(1)|int %}
            # the dock count is not known yet: the examples only, the list
            # below is for 4 tools
            {% set rnd.t = "Time, estimated, by the number of tools (the docks step counts them): for 4 tools about %d to %d min, of it about %d to %d min at the printer, the rest runs by itself. Each tool more adds about %d to %d min. The steps below are for 4 tools. These times are estimates until setups have been timed." % ((t["4"][0] / 5)|round(0, "floor")|int * 5, (t["4"][1] / 5)|round(0, "ceil")|int * 5, (t["4"][2] / 5)|round(0, "floor")|int * 5, (t["4"][3] / 5)|round(0, "ceil")|int * 5, ((t["10"][0] - t["4"][0]) / 6)|round(0, "floor")|int, ((t["10"][1] - t["4"][1]) / 6)|round(0, "ceil")|int) %}
            {% else %}
            {% set rnd.t = "Time, estimated: about %d to %d min for this printer (%d tool%s), of it about %d to %d min at the printer, the rest runs by itself. Each tool more adds about %d to %d min. These times are estimates until setups have been timed." % ((t.n[0] / 5)|round(0, "floor")|int * 5, (t.n[1] / 5)|round(0, "ceil")|int * 5, tm.n, "" if tm.n == 1 else "s", (t.n[2] / 5)|round(0, "floor")|int * 5, (t.n[3] / 5)|round(0, "ceil")|int * 5, ((t["10"][0] - t["4"][0]) / 6)|round(0, "floor")|int, ((t["10"][1] - t["4"][1]) / 6)|round(0, "ceil")|int) %}
            {% endif %}
        {% endif %}
        _INDX_PROMPT TITLE="Setup: {s.done} of {s.total} Done" TEXT="{('Step %d of %d: %s. Next inside it: ' % (gn.n, s.total, gn.text)) if gn.n else 'Next: '}{s.next_text if key == s.next else row.label}. From here the guide runs on by itself: a result that passes its checks is saved, and it stops where a hand, a choice or a failed check needs you." TEXT2="Needs: {row.needs}. Moves: {row.moves}. Takes about {row.time}." TEXT3="Command: {cmd}. The steps are what you do, about {s.presses} presses in all {'on this printer' if tm.known|default(1)|int else 'for 4 tools'}. The routines inside run by themselves." TEXT4="{rnd.t}" TEXT5="{tl.lines|join('. ')}" B1="Start: {s.next_text if key == s.next else row.label}|_INDX_DO CMD={start}|primary" B2="{('Already done: mark it|' ~ mark ~ '|secondary') if mark else ''}" B3="Show the full status|_INDX_DO CMD=INDX_STATUS|info" F1="Close|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_SETUP_HOME]
description: Inner - setup step: the first home with the reference tool, from whatever is on the head: the reference tool (from the load cell step), an empty head (G28 fetches it when its dock is measured, else it goes on by hand) or another tool (G28 swaps it when both docks are measured, else by hand)
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set ref = svv.ref_tool|default(0)|int %}
    {% set dcal = tp.docks_calibrated|default(False) %}
    {% set ref_ok = dcal or svv.get("t%d_dock_x" % ref) is not none %}
    {% set act_ok = act < 0 or dcal or svv.get("t%d_dock_x" % act) is not none %}
    {% set then = "Then, in one go: X and Y creep onto their endstops 10 times each to check they are repeatable (switch endstops, sensorless is skipped), T%d taps the Z homing spot 10 times to check the probe is accurate, then Z homes again and T%d taps 5 times for the load cell trigger offset (Save asks first)." % (ref, ref) %}
    {% if act == ref %}
        _INDX_PROMPT TITLE="Home With T{ref}" TEXT="T{ref} is recorded on the head. G28 homes Y, then X, then Z with a tap of T{ref} at the Z homing spot. {then}" TEXT2="Keep the bed clear. T{ref} must be clean and cold. About 6 minutes." B1="Home, check, measure|_INDX_DO CMD=INDX_FIRST_HOME|primary" B2="Only home (G28)|_INDX_DO CMD=_INDX_FIRST_HOME_ONLY|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% elif (act < 0 and ref_ok) or (act >= 0 and act_ok and ref_ok) %}
        _INDX_PROMPT TITLE="Home With T{ref}" TEXT="{('The head is empty. G28 fetches T%d from its dock' % ref) if act < 0 else ('T%d is on the head. G28 parks it and fetches T%d' % (act, ref))}, then homes Z with a tap of T{ref} at the Z homing spot. {then}" TEXT2="Keep the bed clear. T{ref} must be clean and cold. About 7 minutes." B1="Home, check, measure|_INDX_DO CMD=INDX_FIRST_HOME|primary" B2="Only home (G28)|_INDX_DO CMD=_INDX_FIRST_HOME_ONLY|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% elif act >= 0 %}
        _INDX_PROMPT TITLE="Home With T{ref}" TEXT="T{act} is recorded on the head. Z always homes with T{ref}, and {('the T%d dock' % act) if not act_ok else ('the T%d dock' % ref)} is not measured yet, so INDX cannot swap them." TEXT2="Take T{act} off by hand (Open latch), put T{ref} on, then lock it." B1="Open latch: T{act} will drop|INDX_RELEASE_TOOL_BY_HAND CONFIRM=1|warning" B2="T{ref} is on the head: lock it|INDX_SEAT_TOOL_BY_HAND TOOL={ref} NEXT=INDX_SETUP~STEP=home|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT TITLE="Put T{ref} On by Hand" TEXT="Z homes with the T{ref} nozzle as its probe, and INDX will not fetch T{ref} from a dock it has not measured." TEXT2="Open the latch if it is closed, put T{ref} on the head by hand, then press Lock{' or tap the nozzle 3 times' if 'indx_clog' in printer and printer['indx_clog'].tap.available else ''}." B1="T{ref} is on the head: lock it|INDX_SEAT_TOOL_BY_HAND TOOL={ref} NEXT=INDX_SETUP~STEP=home|primary" B2="Open latch first (head is empty)|INDX_RELEASE_TOOL_BY_HAND CONFIRM=1|secondary" F1="Close|_INDX_PROMPT_END|secondary"
        _INDX_TAP_CONFIRM CMD="INDX_SEAT_TOOL_BY_HAND TOOL={ref} NEXT=INDX_SETUP~STEP=home"
    {% endif %}

[gcode_macro INDX_FIRST_HOME]
description: Setup: G28 with the reference tool, then the X/Y endstop accuracy check (switch endstops, 10 creeps per axis), the probe accuracy check (10 taps), then the load cell trigger offset (G28 Z, 5 taps), in one go. Stops after a check that fails, and asks. Needs: the load cell, and the reference tool on the head or a G28 that can fetch it (its dock measured, and the dock of any other tool on the head). Moves: homing, creeping onto the X/Y endstops, taps at the Z homing spot. Saves: the check; the trigger offset after you press Save
gcode:
    _INDX_GATE NEEDS=lc,refhome STEP="First home" AGAIN=INDX_FIRST_HOME
    _INDX_PROMPT_END
    _INDX_RUNNING STEP="First home"
    G28
    _INDX_CAL_SET KEY=homed VALUE=1
    SET_GCODE_VARIABLE MACRO=INDX_CAL_HOMING VARIABLE=then VALUE='"_INDX_FIRST_HOME_NEXT"'
    INDX_CAL_HOMING CONFIRM=1 QUIET=1

[gcode_macro _INDX_FIRST_HOME_NEXT]
description: Inner - after the endstop check: go on to the trigger offset, or stop when an endstop is not repeatable
gcode:
    {% set hc = printer.save_variables.variables.indx_homing_check|default({}) %}
    {% if hc and hc.verdict|default("") == "bad" and not params.ANYWAY|default(0)|int %}
        _INDX_RUNNING STEP=none
        _INDX_PROMPT TITLE="An Endstop Is Not Repeatable" TEXT="X/Y endstop spread up to {'%.3f'|format(hc.worst)} mm over {hc.n} touches. Docks, the camera reference and every saved position are only as good as the home." TEXT2="Check the switch, its mount and its wiring, then INDX_CAL_HOMING checks it again." B1="Check again|_INDX_DO CMD=_INDX_FIRST_HOME_RECHECK~WHAT=homing|primary" B2="Measure the trigger offset anyway|_INDX_DO CMD=_INDX_FIRST_HOME_NEXT~ANYWAY=1|warning" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        # Restore the running marker for the "measure anyway" path: the bad branch
        # cleared it, but the step continues here
        _INDX_RUNNING STEP="First home"
        SET_GCODE_VARIABLE MACRO=INDX_CAL_PROBE VARIABLE=then VALUE='"_INDX_FIRST_HOME_TRIG"'
        INDX_CAL_PROBE CONFIRM=1 QUIET=1
    {% endif %}

[gcode_macro _INDX_FIRST_HOME_TRIG]
description: Inner - after the probe check: on to the trigger offset, or stop when the probe is not accurate enough
gcode:
    {% set pc = printer.save_variables.variables.indx_probe_check|default({}) %}
    {% if pc and pc.verdict|default("") == "bad" and not params.ANYWAY|default(0)|int %}
        _INDX_RUNNING STEP=none
        _INDX_PROMPT TITLE="Probe Not Accurate Enough" TEXT="10 taps of the reference tool at the Z homing spot spread {'%.4f'|format(pc.range)} mm, worse than {pc.limit} mm. Something may be wrong with the machine." TEXT2="Check: T{printer.save_variables.variables.ref_tool|default(0)|int} seated and the latch locked, the nozzle tight, no plastic on the tip, the bed and its mount firm, no play in Z (belts, lead screws, gantry), the toolboard and load cell mount. Then INDX_CAL_PROBE checks it again." B1="Check again|_INDX_DO CMD=_INDX_FIRST_HOME_RECHECK~WHAT=probe|primary" B2="Measure the trigger offset anyway|_INDX_DO CMD=_INDX_FIRST_HOME_TRIG~ANYWAY=1|warning" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        # Restore the running marker for the "measure anyway" path
        _INDX_RUNNING STEP="First home"
        INDX_CAL_TRIGGER CONFIRM=1
    {% endif %}

[gcode_macro INDX_MACHINE_CHECKS]
description: Setup step: the machine checks: X/Y endstop accuracy (switch endstops, sensorless is skipped) then probe accuracy (10 taps of the reference tool). Needs: CONFIRM=1 (asks first), homed with the reference tool. Moves: X and Y onto their endstops, taps at the Z homing spot. Saves: both results
gcode:
    {% if not params.CONFIRM|default(0)|int %}
        _INDX_PROMPT TITLE="Machine Checks" TEXT="1. X/Y endstop accuracy: each axis creeps onto its endstop 10 times (switch endstops only, sensorless is skipped). 2. Probe accuracy: the reference tool taps the Z homing spot 10 times in the same place. Worse than 0.01 mm means something may be wrong with the machine." TEXT2="T{printer.save_variables.variables.ref_tool|default(0)|int} (the reference tool) on the head, clean and cold. Keep the bed clear." B1="Run the machine checks|INDX_MACHINE_CHECKS CONFIRM=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_GATE NEEDS=lc,homed,t0 STEP="Machine checks" AGAIN=INDX_MACHINE_CHECKS~CONFIRM=1 AUTO=1
        _INDX_PROMPT_END
        _INDX_RUNNING STEP="Machine checks"
        # one count over both parts: 10 touches per switch endstop axis (about
        # 15 s each), then 10 probe taps (about 5 s each)
        {% set cfg = printer.configfile.settings %}
        {% set ns = namespace(sw=0) %}
        {% for ax in ["x", "y"] %}
            {% if "virtual_endstop" not in cfg["stepper_" ~ ax].endstop_pin|default("")|string %}{% set ns.sw = ns.sw + 1 %}{% endif %}
        {% endfor %}
        {% set nh = printer["gcode_macro INDX_CAL_HOMING"].samples|int %}
        {% set npb = printer["gcode_macro INDX_CAL_PROBE"].samples|int %}
        {% set tot = ns.sw * nh + npb %}
        _INDX_PROGRESS START=1 STEP="Machine checks" TOTAL={tot} EST={((ns.sw * nh * 15 + npb * 5) / [tot, 1]|max)|round(1)}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_HOMING VARIABLE=then VALUE='"_INDX_MACHINE_PROBE"'
        INDX_CAL_HOMING CONFIRM=1 QUIET=1
    {% endif %}

[gcode_macro _INDX_MACHINE_PROBE]
description: Inner - machine checks, part 2: probe accuracy after the endstop check (Z may need homing again after X/Y moves), then _INDX_MACHINE_CHECKS_DONE
gcode:
    {% if "z" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    SET_GCODE_VARIABLE MACRO=INDX_CAL_PROBE VARIABLE=then VALUE='"_INDX_MACHINE_CHECKS_DONE"'
    INDX_CAL_PROBE CONFIRM=1 QUIET=1

[gcode_macro _INDX_MACHINE_CHECKS_DONE]
description: Inner - both machine checks ran: in the guide the next step follows (the trigger offset), else say what is next
gcode:
    _INDX_RUNNING STEP=none
    {% if printer["gcode_macro _INDX_GUIDE"].on|int %}
        _INDX_GUIDE_LATER
    {% else %}
        RESPOND MSG="INDX > Machine checks done. Next: INDX_SETUP, or INDX_CAL_TRIGGER for the trigger offset."
    {% endif %}

[gcode_macro _INDX_FIRST_HOME_RECHECK]
description: Inner - Check again after a failed machine check in the first home chain: WHAT=homing runs the endstop check and leads on to the probe check and the trigger offset; WHAT=probe runs the probe check and leads on to the trigger offset
gcode:
    _INDX_PROMPT_END
    _INDX_RUNNING STEP="First home"
    {% if params.WHAT|default("homing") == "probe" %}
        {% if "z" not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_PROBE VARIABLE=then VALUE='"_INDX_FIRST_HOME_TRIG"'
        INDX_CAL_PROBE CONFIRM=1 QUIET=1
    {% else %}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_HOMING VARIABLE=then VALUE='"_INDX_FIRST_HOME_NEXT"'
        INDX_CAL_HOMING CONFIRM=1 QUIET=1
    {% endif %}

[gcode_macro _INDX_FIRST_HOME_ONLY]
description: Inner - Only home (G28) from the first home dialog: home with the reference tool and mark the step, then the setup overview (the machine checks and the trigger offset stay to do)
gcode:
    _INDX_PROMPT_END
    G28
    _INDX_CAL_SET KEY=homed VALUE=1
    RESPOND MSG="INDX ok Homed. The machine checks and the trigger offset are still to do: the setup overview has them."
    INDX_SETUP

[gcode_macro INDX_CAL_PROBE]
description: Machine check: probe accuracy. The reference tool taps the Z homing spot SAMPLES times (10) in the same place, lifting LIFT mm (2) between taps, and the spread of the contacts is rated: worse than LIMIT (0.01 mm) warns that something may be wrong with the machine. Needs: CONFIRM=1 (asks first), homed with the reference tool. Moves: taps at the Z homing spot. Saves: the result (indx_probe_check)
variable_samples: 10
variable_limit: 0.01
variable_then: ""
variable_pts: []
gcode:
    {% set n = params.SAMPLES|default(samples)|int %}
    {% if not params.CONFIRM|default(0)|int %}
        _INDX_PROMPT TITLE="Probe Accuracy" TEXT="The reference tool taps the Z homing spot {n} times in the same place. A spread worse than {limit} mm means something may be wrong with the machine." TEXT2="T{printer.save_variables.variables.ref_tool|default(0)|int} (the reference tool) on the head, clean and cold. Keep the bed clear." B1="Check the probe|INDX_CAL_PROBE CONFIRM=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_GATE NEEDS=lc,homed,t0,unfrozen STEP="Probe accuracy" AGAIN=INDX_CAL_PROBE~CONFIRM=1 AUTO=1
        _INDX_PROMPT_END
        {% if not params.QUIET|default(0)|int %}
            _INDX_RUNNING STEP="Probe accuracy"
        {% endif %}
        {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
        {% set th = printer.toolhead %}
        {% set px = tp.probe_x|float if tp.probe_x|float >= 0 else (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
        {% set py = tp.probe_y|float if tp.probe_y|float >= 0 else (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
        {% set lift = params.LIFT|default(2)|float %}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_PROBE VARIABLE=pts VALUE="[]"
        _INDX_PROGRESS START=1 IFNONE=1 STEP="Probe accuracy" TOTAL={n} EST=5
        SAVE_GCODE_STATE NAME=_indx_probe_chk
        G90
        G1 Z5 F900
        _INDX_TO_LANE
        G1 X{px} Y{py} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
        G1 Z3 F900
        M400
        G4 P1500
        {% for i in range(n) %}
            _INDX_PROBE_PREP
            PROBE SAMPLES=1
            _INDX_PC_STORE
            _INDX_PROGRESS ITEM=1 PART="probe tap {i + 1}/{n}"
            G91
            G1 Z{lift} F600
            G90
        {% endfor %}
        G1 Z5 F900
        RESTORE_GCODE_STATE NAME=_indx_probe_chk
        _INDX_PC_REPORT
    {% endif %}

[gcode_macro _INDX_PC_STORE]
description: Inner - keep the last probe contact for INDX_CAL_PROBE
gcode:
    {% set pts = printer["gcode_macro INDX_CAL_PROBE"].pts %}
    SET_GCODE_VARIABLE MACRO=INDX_CAL_PROBE VARIABLE=pts VALUE="{pts + [printer.probe.last_z_result|float|round(5)]}"

[gcode_macro _INDX_PC_REPORT]
description: Inner - INDX_CAL_PROBE result: spread, rating, saved as indx_probe_check
gcode:
    {% set c = printer["gcode_macro INDX_CAL_PROBE"] %}
    {% set pts = c.pts %}
    {% set n = pts|length %}
    {% set mean = (pts|sum) / n %}
    {% set ns = namespace(v=0.0) %}
    {% for q in pts %}{% set ns.v = ns.v + (q - mean) ** 2 %}{% endfor %}
    {% set sd = (ns.v / n) ** 0.5 %}
    {% set rng = (pts|max) - (pts|min) %}
    {% set bad = rng > c.limit|float %}
    {% set res = {"n": n, "range": rng|round(5), "sd": sd|round(5), "limit": c.limit|float, "verdict": "bad" if bad else "good", "pts": pts} %}
    SAVE_VARIABLE VARIABLE=indx_probe_check VALUE="{res}"
    {% if bad %}
        RESPOND TYPE=error MSG="INDX ! Probe accuracy {'%.4f'|format(rng)} mm over {n} taps (sd {'%.4f'|format(sd)}), worse than {c.limit} mm: something may be wrong with the machine. Check the tool seating and latch, a loose nozzle, residue on the tip, the bed and its mount, play in Z (belts, lead screws, gantry), the toolboard and load cell mount."
    {% else %}
        RESPOND MSG="INDX ok Probe accuracy {'%.4f'|format(rng)} mm over {n} taps (sd {'%.4f'|format(sd)}), within {c.limit} mm."
    {% endif %}
    {% if c.then %}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_PROBE VARIABLE=then VALUE='""'
        {c.then}
    {% else %}
        _INDX_RUNNING STEP=none
    {% endif %}

[gcode_macro INDX_CAL_HOMING]
description: Setup step: X/Y endstop accuracy. Each axis creeps onto its endstop SAMPLES times (10): 0.05 mm steps until it triggers, back off in 0.05 mm steps until it releases (at most the axis' homing_retract_dist) and 0.05 mm more, then 0.005 mm steps, QUERY_ENDSTOPS after each, and the trigger positions are compared. For switch endstops (mechanical, inductive, optical); sensorless (virtual) endstops are skipped with a warning. Needs: CONFIRM=1 (asks first), X/Y homed. Moves: X and Y near their endstops. Saves: the result (indx_homing_check)
variable_samples: 10
variable_then: ""
variable_st: {}
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set axes = [] %}
    {% set sl = [] %}
    {% for ax in ["x", "y"] %}
        {% if "virtual_endstop" in cfg["stepper_" ~ ax].endstop_pin|default("")|string %}
            {% set _ = sl.append(ax) %}
        {% else %}
            {% set _ = axes.append(ax) %}
        {% endif %}
    {% endfor %}
    {% set n = params.SAMPLES|default(samples)|int %}
    {% if not axes %}
        # information, not a stop: an error line reads as a stop on the INDX page [EL-SET-008]
        RESPOND MSG="INDX ok X/Y endstop accuracy: skipped, both axes home sensorless (not a fault). A StallGuard stall only fires while the motor moves, so this check cannot measure them; switch endstops (mechanical, inductive or optical) are more repeatable than sensorless homes."
        {% if then %}
            SET_GCODE_VARIABLE MACRO=INDX_CAL_HOMING VARIABLE=then VALUE='""'
            {then}
        {% else %}
            _INDX_RUNNING STEP=none
        {% endif %}
    {% elif not params.CONFIRM|default(0)|int %}
        _INDX_PROMPT TITLE="X/Y Endstop Accuracy" TEXT="{axes|join(' and ')|upper} creep onto the endstop {n} times each: 0.05 mm steps until it triggers, back off, then 0.005 mm steps. The spread of the trigger points is how repeatable the home is." TEXT2="{('Sensorless ' ~ (sl|join(', ')|upper) ~ ' is skipped: not measurable this way. ') if sl else ''}Docks, the camera reference and every saved position rely on the home. Keep the bed clear." B1="Check the endstops|INDX_CAL_HOMING CONFIRM=1 SAMPLES={n}|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
            {action_raise_error("INDX_CAL_HOMING: home X and Y first (G28).")}
        {% endif %}
        _INDX_PROMPT_END
        {% if not params.QUIET|default(0)|int %}
            _INDX_RUNNING STEP="X/Y endstop accuracy"
        {% endif %}
        {% if sl %}
            RESPOND MSG="INDX ok X/Y endstop accuracy: {sl|join(', ')|upper} skipped, it homes sensorless (not a fault, not measurable this way)."
        {% endif %}
        {% set st = {"axes": axes, "skip": sl, "ai": 0, "phase": "away", "k": 0, "steps": 0, "n": n, "pts": {}} %}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_HOMING VARIABLE=st VALUE="{st|tojson|replace('"', "'")}"
        # its own count when run alone; inside Machine checks that one counts
        _INDX_PROGRESS START=1 IFNONE=1 STEP="X/Y endstop accuracy" TOTAL={axes|length * n} EST=15
        SAVE_GCODE_STATE NAME=_indx_homing_chk
        UPDATE_DELAYED_GCODE ID=_indx_homing_loop DURATION=0.1
    {% endif %}

[delayed_gcode _indx_homing_loop]
gcode:
    _INDX_HC_STEP

[gcode_macro _INDX_HC_STEP]
description: Inner - one step of INDX_CAL_HOMING (away, coarse 0.05 mm steps, back off, fine 0.005 mm steps, record)
gcode:
    {% set st = printer["gcode_macro INDX_CAL_HOMING"].st %}
    {% set cfg = printer.configfile.settings %}
    {% set ax = st.axes[st.ai] %}
    {% set i = 0 if ax == "x" else 1 %}
    {% set sc = cfg["stepper_" ~ ax] %}
    {% set endpos = sc.position_endstop|float %}
    # The homing direction as Klipper decides it: homing_positive_dir when set,
    # else an endstop in the top quarter of the axis homes positive (an endstop
    # at 500 with position_max 502 homes positive; position_endstop equal to
    # position_max is not required)
    {% set pmin = sc.position_min|default(0)|float %}
    {% set pmax = sc.position_max|float %}
    {% set hpd = sc.homing_positive_dir if sc.homing_positive_dir is defined else none %}
    {% set pos_dir = hpd if hpd is not none else endpos >= pmax - (pmax - pmin) / 4.0 %}
    {% set d = 1 if pos_dir else -1 %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set org = (o.x if ax == "x" else o.y)|float %}
    {% set trig = 1 if printer.query_endstops.last_query[ax]|default(0) else 0 %}
    {% set AX = ax|upper %}
    {% set ns = namespace(st=st, cmd="", done=false, err="") %}
    {% if st.phase == "away" %}
        {% set ns.cmd = "G90\nG1 %s%.4f F1200\nM400\nQUERY_ENDSTOPS" % (AX, endpos - d * 1.0 - org) %}
        {% set _ = ns.st.update({"phase": "coarse", "steps": 0}) %}
    {% elif st.phase == "coarse" %}
        {% if trig %}
            # Back off until the switch releases, in 0.05 mm steps, at most the
            # axis' homing_retract_dist: a fixed short back-off failed switches
            # with more hysteresis (inductive, some optical, worn microswitches)
            {% set ns.cmd = "G91\nG1 %s%.4f F120\nG90\nM400\nQUERY_ENDSTOPS" % (AX, -d * 0.05) %}
            {% set _ = ns.st.update({"phase": "release", "steps": 1}) %}
        {% elif st.steps > 60 %}
            {% set ns.err = "no trigger in the 3 mm search window (%.1f to %.1f mm) of position_endstop %.1f on %s. Check that position_endstop in [stepper_%s] is within 1 mm of where the switch fires: re-run G28 and note the homed position, or adjust position_endstop. If using sensorless homing, verify that endstop_pin includes virtual_endstop." % ([endpos - d * 1.0, endpos + d * 2.0]|min, [endpos - d * 1.0, endpos + d * 2.0]|max, endpos, AX, ax) %}
        {% else %}
            {% set ns.cmd = "G91\nG1 %s%.4f F120\nG90\nM400\nQUERY_ENDSTOPS" % (AX, d * 0.05) %}
            {% set _ = ns.st.update({"steps": st.steps + 1}) %}
        {% endif %}
    {% elif st.phase == "release" %}
        {% set retract = sc.homing_retract_dist|default(2.0)|float %}
        {% set retract = retract if retract > 0 else 2.0 %}
        {% if trig and st.steps * 0.05 >= retract - 0.0001 %}
            {% set ns.err = AX ~ " endstop still triggered after backing off %.2f mm (homing_retract_dist): it releases late, bounces or is stuck" % retract %}
        {% elif trig %}
            {% set ns.cmd = "G91\nG1 %s%.4f F120\nG90\nM400\nQUERY_ENDSTOPS" % (AX, -d * 0.05) %}
            {% set _ = ns.st.update({"steps": st.steps + 1}) %}
        {% else %}
            # released: 0.05 mm more, then creep back in 0.005 mm steps (the
            # fine phase may travel the release distance plus that margin)
            {% set ns.cmd = "G91\nG1 %s%.4f F120\nG90\nM400\nQUERY_ENDSTOPS" % (AX, -d * 0.05) %}
            {% set _ = ns.st.update({"phase": "fine", "steps": 0, "rel": st.steps + 1}) %}
        {% endif %}
    {% elif st.phase == "fine" %}
        {% if trig and st.steps == 0 %}
            {% set ns.err = AX ~ " endstop triggered again with nothing moving after it released: it bounces" %}
        {% elif trig %}
            # counts first: ns.st is the same dict as st, so update() changes st too
            {% set kk = st.k + 1 %}
            {% set ai = st.ai %}
            {% set pts = st.pts %}
            {% set _ = pts.update({ax: pts[ax]|default([]) + [printer.toolhead.position[i]|float|round(4)]}) %}
            {% set _ = ns.st.update({"pts": pts, "k": kk, "phase": "away"}) %}
            {% set sp = (pts[ax]|max - pts[ax]|min) if pts[ax]|length > 1 else 0.0 %}
            {% set prog = '\n_INDX_PROGRESS ITEM=1 PART="%s endstop touch %d/%d" NOTE="spread so far %.4f mm"' % (AX, kk, st.n, sp) %}
            {% if kk >= st.n %}
                {% if ai + 1 >= st.axes|length %}
                    {% set ns.done = true %}
                {% else %}
                    {% set _ = ns.st.update({"ai": ai + 1, "k": 0}) %}
                {% endif %}
            {% endif %}
            {% set ns.cmd = "M400" ~ prog %}
        {% elif st.steps > st.rel|default(3) * 10 + 20 %}
            {% set ns.err = "no trigger within %.2f mm in fine steps on %s" % ((st.rel|default(3) * 10 + 20) * 0.005, AX) %}
        {% else %}
            {% set ns.cmd = "G91\nG1 %s%.4f F30\nG90\nM400\nQUERY_ENDSTOPS" % (AX, d * 0.005) %}
            {% set _ = ns.st.update({"steps": st.steps + 1}) %}
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=INDX_CAL_HOMING VARIABLE=st VALUE="{ns.st|tojson|replace('"', "'")}"
    {% if ns.err %}
        RESTORE_GCODE_STATE NAME=_indx_homing_chk
        _INDX_RUNNING STEP=none
        SET_GCODE_VARIABLE MACRO=INDX_CAL_HOMING VARIABLE=then VALUE='""'
        # a raise in this template would drop the lines above (it raises while
        # it renders): _INDX_RAISE raises from its own macro, after them
        _INDX_RAISE MSG="{'INDX_CAL_HOMING: ' ~ ns.err ~ '. Nothing saved.'}"
    {% elif ns.done %}
        {ns.cmd}
        G90
        G1 {AX}{"%.3f"|format(endpos - d * 5.0 - org)} F1200
        RESTORE_GCODE_STATE NAME=_indx_homing_chk
        _INDX_HC_REPORT
    {% else %}
        {ns.cmd}
        UPDATE_DELAYED_GCODE ID=_indx_homing_loop DURATION=0.01
    {% endif %}

[gcode_macro _INDX_HC_REPORT]
description: Inner - INDX_CAL_HOMING result: spread per axis, rating, saved as indx_homing_check
gcode:
    {% set st = printer["gcode_macro INDX_CAL_HOMING"].st %}
    {% set then = printer["gcode_macro INDX_CAL_HOMING"].then %}
    {% set ns = namespace(worst=0.0, axes={}, txt=[]) %}
    {% for ax, pts in st.pts|dictsort %}
        {% set mean = (pts|sum) / (pts|length) %}
        {% set ns2 = namespace(v=0.0) %}
        {% for q in pts %}{% set ns2.v = ns2.v + (q - mean) ** 2 %}{% endfor %}
        {% set sd = (ns2.v / (pts|length)) ** 0.5 %}
        {% set rng = (pts|max) - (pts|min) %}
        {% set ns.worst = [ns.worst, rng]|max %}
        {% set _ = ns.axes.update({ax: {"range": rng|round(4), "sd": sd|round(4), "pts": pts}}) %}
        {% set ns.txt = ns.txt + ["%s spread %.3f mm (sd %.4f)" % (ax|upper, rng, sd)] %}
    {% endfor %}
    {% set verdict = "good" if ns.worst <= 0.02 else ("ok" if ns.worst <= 0.05 else "bad") %}
    {% set res = {"method": "endstop", "n": st.n, "worst": ns.worst|round(4), "verdict": verdict, "axes": ns.axes, "skip": st.skip, "good": 0.02, "ok": 0.05} %}
    SAVE_VARIABLE VARIABLE=indx_homing_check VALUE="{res|tojson|replace('"', "'")}"
    RESPOND MSG="INDX {'ok' if verdict != 'bad' else '!'} X/Y endstop accuracy, {st.n} touches per axis: {ns.txt|join(', ')}. {'Good: within 0.02 mm.' if verdict == 'good' else ('OK: within 0.05 mm.' if verdict == 'ok' else 'Not repeatable: more than 0.05 mm. Check the switch, its mount and wiring before docks and offsets.')}{(' Sensorless ' ~ (st.skip|join(', ')|upper) ~ ' not measured.') if st.skip else ''}"
    {% if then %}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_HOMING VARIABLE=then VALUE='""'
        {then}
    {% else %}
        _INDX_RUNNING STEP=none
    {% endif %}

[gcode_macro _INDX_RESUME_ASK]
description: Inner - after an interrupted step: ask what is on the head before anything moves
# Never continues by itself: after a restart mid-step the head is unknown, so
# show the load cell and ask; the recorded head and the cell order the answers.
# A release away from a dock needs a magnet on the activation boss. [EL-SET-009]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set cal = svv.indx_cal|default({}) %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% set sg = printer["gcode_macro _INDX_SEAT_G"] %}
    {% set min_g = printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(590.0)|float %}
    {% set rd = sg.valid|int %}
    {% set lc_tool = rd and sg.seat_g|float|abs >= min_g %}
    {% set lc = ("%.0f g, " % sg.seat_g|float ~ ("like a tool on the head" if lc_tool else "like an empty head")) if rd else "no reading" %}
    {% set empty_b = "The head is empty|_INDX_RESUME_SET HEAD=-1|" %}
    {% set rel_b = "Not sure: release it by hand (magnet on the activation boss)|_INDX_RESUME_SET HEAD=release|warning" %}
    {% set ns = namespace(tools=[]) %}
    {% for i in range(n) if not (i == act and act >= 0) %}
        {% set ns.tools = ns.tools + ["T%d on the head|_INDX_RESUME_SET HEAD=%d|%s" % (i, i, "primary" if lc_tool and act < 0 else "secondary")] %}
    {% endfor %}
    {% set rec = ("T%d" % act) if act >= 0 else "no tool" %}
    {% set rel_txt = "Not sure: away from a dock the latch only opens while a magnet sits on the activation boss (the spot where the dock magnet touches the head, the magnet of another tool works). Hold the magnet there and the tool with your other hand, then answer: INDX asks once more before the latch opens." %}
    {% if act >= 0 and (lc_tool or not rd) %}
        # recorded and read (or no reading): that tool first
        _INDX_PROMPT TITLE="Stopped mid-step: {cal.running|default('a step')}" TEXT="Nothing moves until you say what is on the head. INDX has {rec} recorded, load cell {lc}." TEXT2="Another tool on the head: press its number." TEXT3="{rel_txt}" G1="T{act} is on the head and locked|_INDX_RESUME_SET HEAD={act}|primary" G2="{ns.tools|join('^')}" B1="{empty_b}secondary" B2="{rel_b}" F1="Close|_INDX_PROMPT_END|secondary"
    {% elif lc_tool %}
        # nothing recorded, the cell reads a tool: which one, every tool
        _INDX_PROMPT TITLE="Stopped mid-step: {cal.running|default('a step')}" TEXT="Nothing moves until you say what is on the head. INDX has no tool recorded, but the load cell reads {lc}." TEXT2="Which tool is on the head, locked?" TEXT3="{rel_txt}" G1="{ns.tools|join('^')}" B1="{empty_b}secondary" B2="{rel_b}" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        # both say empty (or nothing recorded and no reading), or the cell
        # reads empty while a tool is recorded: the empty head first
        _INDX_PROMPT TITLE="Stopped mid-step: {cal.running|default('a step')}" TEXT="Nothing moves until you say what is on the head. INDX has {rec} recorded, load cell {lc}." TEXT2="{('The record and the load cell disagree: look at the head. ' if act >= 0 and rd else '')}A tool on the head, locked: press its number." TEXT3="{rel_txt}" G1="{empty_b}primary" G2="{(('T%d on the head (as recorded)|_INDX_RESUME_SET HEAD=%d|secondary^' % (act, act)) if act >= 0 else '') ~ ns.tools|join('^')}" B1="{rel_b}" F1="Close|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_RESUME_SET]
description: Inner - the answer to the resume question: record the head, clear the interruption, then offer the step again (G28 first only for steps that need it) once the head question is fully answered
# The step is offered by _INDX_RESUME_NEXT (NEXT=), after any seat or release
# question, which it would otherwise replace. [EL-SET-010]
variable_run: ""
gcode:
    {% set h = params.HEAD|string %}
    # read before the interruption is cleared below
    {% set run = (printer.save_variables.variables.indx_cal|default({})).running|default("")|string %}
    _INDX_PROMPT_END
    SET_GCODE_VARIABLE MACRO=_INDX_RESUME_SET VARIABLE=run VALUE='{run|tojson}'
    _INDX_CAL_SET KEY=running VALUE='""'
    {% if h == "release" %}
        # the release question itself (no CONFIRM): it explains the magnet
        # on the activation boss, and the latch opens only on its button
        INDX_RELEASE_TOOL_BY_HAND NEXT=_INDX_RESUME_NEXT
    {% elif h|int >= 0 %}
        INDX_SEAT_TOOL_BY_HAND TOOL={h|int} LOCKED=1 NEXT=_INDX_RESUME_NEXT
    {% else %}
        INDX_FORGET_TOOL CONFIRM=1
        _INDX_RESUME_NEXT
    {% endif %}

[gcode_macro _INDX_RESUME_NEXT]
description: Inner - the head is recorded after an interruption: offer the interrupted step again (_INDX_RESUME_SET keeps which one)
gcode:
    {% set run = printer["gcode_macro _INDX_RESUME_SET"].run|string %}
    SET_GCODE_VARIABLE MACRO=_INDX_RESUME_SET VARIABLE=run VALUE='""'
    # Steps that home by themselves (a dock measurement, the first home) start
    # straight away; the others start from a homed printer. [EL-SET-011]
    {% if run.endswith(" and load cell") %}
        # the one-slide step: the load cell is not calibrated, so no G28;
        # it starts from an empty head (a tool recorded on it is refused there)
        _INDX_PROMPT TITLE="Redo the Load Cell Step" TEXT="The head is recorded. The load cell is not calibrated yet, so nothing homes Z first: the one-slide step starts again from an empty head (take a tool off by hand if one is on), homes X and Y and zeroes the cell." B1="Start again: load cell, one slide|_INDX_DO CMD=INDX_CAL_LOADCELL|primary" B2="Back to setup|_INDX_DO CMD=INDX_SETUP|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% elif run.startswith("Dock T") and run[6:]|int(-1) >= 0 %}
        _INDX_PROMPT TITLE="Start {run} Again" TEXT="The head is recorded. This step turns the motors off and homes X and Y by itself from the dock: no homing needed first." B1="Start again: {run}|_INDX_DO CMD=INDX_CAL_DOCK~TOOL={run[6:]|int}|primary" B2="Back to setup|_INDX_DO CMD=INDX_SETUP|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% elif run == "First home" %}
        _INDX_PROMPT TITLE="Start the First Home Again" TEXT="The head is recorded. This step homes by itself." B1="Start again: First home|_INDX_DO CMD=INDX_SETUP~STEP=home|primary" B2="Back to setup|_INDX_DO CMD=INDX_SETUP|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT TITLE="Home Next" TEXT="The head is recorded. Home before the step starts again from the beginning." B1="Home all axes (G28)|_INDX_DO CMD=G28|primary" B2="Back to setup|_INDX_DO CMD=INDX_SETUP|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_RUNNING]
description: Inner - note the long step that is running (STEP=), or that it ended (STEP=none). INDX_SETUP asks before resuming after a restart
gcode:
    {% set s = params.STEP|default("none") %}
    _INDX_CAL_SET KEY=running VALUE='"{'' if s == 'none' else s}"'
    # a step that ends (done or stopped) ends its progress count too
    {% if s == "none" and printer["gcode_macro _INDX_PROGRESS"].p %}
        _INDX_PROGRESS END=1
    {% endif %}

[gcode_macro _INDX_PROGRESS]
description: Inner - progress of a long routine: START=1 STEP=<name> TOTAL=<items> [EST=<s per item>], then ITEM=1 [PART=<what>] [NOTE=<result so far>] after each item, END=1 at the end. One console line per item ("<step>: 13 of 30 ..., about 4 min left", read by the INDX page's progress bar), the same short on the printer display (M117)
# A long routine with no output looks like a loop: each item says the count [EL-SET-047]
# and the time left. The time left: EST per item until two
# items are done, then the measured rate. The clock is the toolhead's
# estimated_print_time (seconds, on INDX Macros installs too).
variable_p: {}
gcode:
    {% set now = printer.toolhead.estimated_print_time|float %}
    {% set p = printer["gcode_macro _INDX_PROGRESS"].p %}
    # IFNONE=1: a routine that also runs inside a longer step starts its own
    # count only when that step has none running
    {% if params.START|default(0)|int and params.IFNONE|default(0)|int and p.step is defined %}
    {% elif params.START|default(0)|int %}
        {% set p = {"step": params.STEP|default("Running")|string, "n": [params.TOTAL|default(1)|int, 1]|max, "i": 0, "t0": now, "est": params.EST|default(0)|float, "auto": params.IFNONE|default(0)|int} %}
        SET_GCODE_VARIABLE MACRO=_INDX_PROGRESS VARIABLE=p VALUE="{p|tojson|replace('"', "'")}"
        {% set tot = p.est * p.n %}
        RESPOND MSG="INDX > {p.step}: 0 of {p.n}{(', about %d min left' % [(tot / 60.0)|round(0, 'ceil')|int, 1]|max) if tot > 0 else ''}."
        M117 INDX: {p.step} 0/{p.n}
    {% elif params.ITEM|default(0)|int and p.step is defined and p.n|default(0)|int > 0 %}
        {% set i = [p.i|int + 1, p.n|int]|min %}
        {% set took = now - p.t0|float %}
        {% set per = (took / i) if i >= 2 else (p.est|float if p.est|float > 0 else took / i) %}
        {% set left = per * (p.n|int - i) %}
        {% set ltxt = "done" if i >= p.n|int else ("under a minute left" if left < 60 else "about %d min left" % ((left / 60.0)|round(0, 'ceil')|int)) %}
        {% set fin = i >= p.n|int and p.auto|default(0)|int %}
        # a sub-check that counted for itself ends its count at its last item
        {% set q = {} if fin else {"step": p.step, "n": p.n, "i": i, "t0": p.t0, "est": p.est, "auto": p.auto|default(0)} %}
        SET_GCODE_VARIABLE MACRO=_INDX_PROGRESS VARIABLE=p VALUE="{q|tojson|replace('"', "'")}"
        {% set part = params.PART|default("")|string %}
        {% set note = params.NOTE|default("")|string %}
        RESPOND MSG="INDX > {p.step}: {i} of {p.n}{(', ' ~ part) if part else ''}{(', ' ~ note) if note else ''}, {ltxt}."
        {% if fin %}
            M117
        {% else %}
            M117 INDX: {p.step} {i}/{p.n}{(', ' ~ ltxt|replace('about ', '~')) if i < p.n|int else ''}
        {% endif %}
    {% elif params.END|default(0)|int %}
        SET_GCODE_VARIABLE MACRO=_INDX_PROGRESS VARIABLE=p VALUE="{ {} }"
        M117
    {% endif %}

#####################################################################
#  4. GATES
#####################################################################

[gcode_macro _INDX_GATE]
description: Inner - check what a step needs before it moves anything; on a miss fix it (AUTO=1) or show what to do and stop. NEEDS=homed,lc,ref (or t0: the reference tool),tool,empty,docks,refhome (a G28 can bring the reference tool: it is on the head, or its dock is measured and so is the dock of any other tool on the head),unfrozen (a loaded tool on the head must not be short of the release: no probe with a frozen tool) STEP=<name> AGAIN=<command to run after the fix, ~ for spaces> AUTO=1
# Called first by every step. The checks read live state; "empty" also asks the
# load cell. AUTO=1 (the step's dialog was confirmed): what INDX can do itself
# (G28, fetch the reference tool, park the tool) it does instead of stopping; in early setup, when
# it cannot, the step stops and says how. The seat reading is refreshed first and
# the checks run in a separate macro, so they never read a stale value.
gcode:
    _INDX_SEAT_G
    _INDX_GATE_RUN {rawparams}

[gcode_macro _INDX_GATE_RUN]
description: Inner - the checks of _INDX_GATE, run after a fresh load cell seat reading (call _INDX_GATE)
gcode:
    {% set needs = params.NEEDS|default("")|lower %}
    {% set needs = needs.split(",")|map("trim")|select|list %}
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set sg = printer["gcode_macro _INDX_SEAT_G"] %}
    {% set min_g = tp.home_min_force_g|default(590.0)|float %}
    {% set step = params.STEP|default("This step") %}
    {% set again = params.AGAIN|default("") %}
    {% set ns = namespace(why="", fix="", fix2="", do=[], say=[]) %}
    {% set auto = params.AUTO|default(0)|int %}
    # A tool is fetched or parked once its own dock is measured (the first contact
    # with a newly measured dock runs slow). [EL-SET-011]
    {% set ref = svv.ref_tool|default(0)|int %}
    {% set dcal = tp.docks_calibrated|default(False) %}
    {% set ref_ok = dcal or svv.get("t%d_dock_x" % ref) is not none %}
    {% set lc_cal = (printer.load_cell_probe|default({})).is_calibrated|default(false) %}
    # A calibration not saved yet: the G28 seat check weighs against the
    # saved reference (configfile settings), so it is not trusted until
    # SAVE_CONFIG has written it and Klipper has restarted
    {% set lc_unsaved = lc_cal and "load_cell_probe" in printer.configfile.save_config_pending_items|default({}) %}
    # Except a counts per gram change alone (INDX_LC_SET_CPG): the reference tare
    # stays the saved one, so the seat check holds live; a restart before the final
    # SAVE_CONFIG converts gram values back and marks the trigger offset [EL-SET-012]
    {% set lc_unsaved = lc_unsaved and not ("indx_clog" in printer and printer.indx_clog.lc_cpg_only|default(false)) %}
    {% set lc_ok = lc_cal and not lc_unsaved %}
    # the head as it will be after the fixes before it in the list
    {% set hns = namespace(act=act, homed="xyz" in printer.toolhead.homed_axes) %}
    {% for need in needs %}
        {% set need = "t0" if need == "ref" else need %}
        {% set act_ok = hns.act < 0 or dcal or svv.get("t%d_dock_x" % hns.act) is not none %}
        {% if ns.why %}
        {% elif auto and need == "homed" and not hns.homed and lc_ok and (hns.act == ref or (ref_ok and act_ok)) %}
            {% set ns.do = ns.do + ["G28"] %}
            {% set ns.say = ns.say + ["homing"] %}
            {% set hns.homed = true %}
            {% set hns.act = ref %}
        {% elif auto and need in ["t0", "tool"] and hns.homed and ref_ok and act_ok and (hns.act < 0 or (need == "t0" and hns.act != ref)) %}
            {% set ns.do = ns.do + ["T%d" % ref] %}
            {% set ns.say = ns.say + ["fetching T%d" % ref] %}
            {% set hns.act = ref %}
        {% elif auto and need == "empty" and hns.homed and act_ok and hns.act >= 0 %}
            {% set ns.do = ns.do + ["PARK_TOOL"] %}
            {% set ns.say = ns.say + ["parking T%d" % hns.act] %}
            {% set hns.act = -1 %}
        {% elif (need in ["t0", "tool"] and hns.act < 0 and not ref_ok) or (need == "homed" and not hns.homed and hns.act < 0 and not ref_ok) %}
            {% set ns.why = "it needs the reference tool T%d on the head, and the T%d dock is not measured yet, so INDX cannot fetch it. Put T%d on the head by hand, or measure its dock first (INDX_CAL_DOCK TOOL=%d)" % (ref, ref, ref, ref) %}
            {% set ns.fix = "T%d is on the head: lock it|_INDX_DO CMD=INDX_SEAT_TOOL_BY_HAND~TOOL=%d|primary" % (ref, ref) %}
        {% elif need == "refhome" and hns.act < 0 and not ref_ok %}
            # the normal first setup: an empty head, no dock measured yet
            {% set ns.why = "the first home probes with the reference tool T%d, and the T%d dock is not measured yet, so INDX cannot fetch it. Put T%d on the head by hand (the load cell step does it), or measure its dock first (INDX_CAL_DOCK TOOL=%d)" % (ref, ref, ref, ref) %}
            {% set ns.fix = "T%d is on the head: lock it|_INDX_DO CMD=INDX_SEAT_TOOL_BY_HAND~TOOL=%d|primary" % (ref, ref) %}
        {% elif hns.act >= 0 and not act_ok and ((need in ["t0", "refhome"] and hns.act != ref) or need == "empty" or (need == "homed" and not hns.homed and hns.act != ref)) %}
            # Only when the step would park this tool: the reference tool on the head needs
            # no dock [EL-SET-013]
            {% set ns.why = "T%d is on the head and its dock is not measured yet, so INDX cannot park it. Measure its dock (INDX_CAL_DOCK TOOL=%d) or take it off by hand" % (hns.act, hns.act) %}
            {% set ns.fix = "Open latch: T%d will drop|INDX_RELEASE_TOOL_BY_HAND CONFIRM=1|warning" % hns.act %}
        {% elif hns.act >= 0 and hns.act != ref and not ref_ok and (need in ["t0", "refhome"] or (need == "homed" and not hns.homed)) %}
            # another tool on the head (a setup started over): its dock is
            # measured, the reference tool's is not, so a G28 cannot swap them
            {% set ns.why = "T%d is on the head and the T%d dock is not measured yet, so INDX cannot swap it for the reference tool T%d. Take T%d off by hand and put T%d on, or measure the T%d dock first (INDX_CAL_DOCK TOOL=%d)" % (hns.act, ref, ref, hns.act, ref, ref, ref) %}
            {% set ns.fix = "Open latch: T%d will drop|INDX_RELEASE_TOOL_BY_HAND CONFIRM=1|warning" % hns.act %}
        {% elif need == "lc" and not lc_cal %}
            {% set ns.why = "the load cell is not calibrated" %}
            {% set ns.fix = "Calibrate the load cell|_INDX_DO CMD=INDX_CAL_LOADCELL|primary" %}
        {% elif need == "lc" and lc_unsaved %}
            {% set ns.why = "the load cell calibration is not saved yet, and the homing seat check weighs against the saved one. SAVE_CONFIG saves it and restarts Klipper; a tool locked on the head stays on" %}
            {% set ns.fix = "Save config: Klipper restarts|_INDX_SAVE_CONFIG THEN=home|warning" %}
        {% elif need == "unfrozen" and hns.act >= 0 and (svv["t%d_material" % hns.act]|default("")|string or svv["t%d_fil_density" % hns.act]|default(0)|float > 0) and (("gcode_macro _INDX_LOCK_PAST" in printer and printer["gcode_macro _INDX_LOCK_PAST"].frozen|default(0)|int) or svv.lock_short|default(0)) %}
            # Rule: nothing probes with a tool short of the release (frozen): a Z tap would
            # read the plug. Stop and ask, no automatic heat [EL-SET-014]
            {% set ns.why = "T%d's lock stopped short of the release: its filament is frozen at the nozzle, and nothing probes with a tool that is not fully locked. Give it a heated prime or shape its tip first" % hns.act %}
            {% set ns.fix = ("Shape the tip of T%d|_INDX_DO CMD=INDX_TIP_SHAPE~TOOL=%d~CONFIRM=1|primary" % (hns.act, hns.act)) if "gcode_macro INDX_TIP_SHAPE" in printer else ("Unload T%d|_INDX_DO CMD=INDX_UNLOAD~TOOL=%d|primary" % (hns.act, hns.act)) %}
        {% elif need == "homed" and not hns.homed %}
            {% set ns.why = "the printer is not homed" %}
            {% set ns.fix = "Home all axes (G28)|_INDX_DO CMD=G28|primary" %}
        {% elif need == "t0" and hns.act != ref %}
            {% set ns.why = "it needs the reference tool T%d on the head (INDX has %s)" % (ref, ("T%d" % hns.act) if hns.act >= 0 else "no tool") %}
            {% set ns.fix = "Pick up T%d|_INDX_DO CMD=T%d|primary" % (ref, ref) %}
        {% elif need == "tool" and hns.act < 0 %}
            {% set ns.why = "it needs a tool on the head" %}
            {% set ns.fix = "Pick up T%d|_INDX_DO CMD=T%d|primary" % (ref, ref) %}
        {% elif need == "empty" and hns.act >= 0 %}
            {% set ns.why = "it needs an empty head (INDX has T%d)" % hns.act %}
            {% set ns.fix = "Park T%d|_INDX_DO CMD=PARK_TOOL|primary" % hns.act %}
        {% elif need == "empty" and not ns.do and sg.valid|int and sg.seat_g|float|abs >= min_g %}
            {% set ns.why = "the head is recorded empty but the load cell reads %.0f g, like a tool on the head" % sg.seat_g|float %}
            {% set ns.fix = "Open latch: tool will drop|INDX_RELEASE_TOOL_BY_HAND CONFIRM=1|warning" %}
        {% endif %}
    {% endfor %}
    {% if ns.do and not ns.why %}
        RESPOND MSG="INDX > {step}: {ns.say|join(', then ')} first"
        # calls: G28, PARK_TOOL
        {% for c in ns.do %}
            {c}
        {% endfor %}
        {% if "unfrozen" in needs %}
            # the tool just fetched may have locked short (frozen): checked
            # again now that it is on the head (renders after the fetch)
            _INDX_GATE_FROZEN STEP="{step}" AGAIN="{again}"
        {% endif %}
    {% endif %}
    {% if ns.why %}
        _INDX_LCD LEVEL=action MSG="{step}: see console"
        _INDX_PROMPT TITLE="{step} Cannot Start Yet" TEXT="{step} stopped before moving anything: {ns.why}." B1="{ns.fix}" B2="{('Then start ' ~ step ~ ' again|_INDX_DO CMD=' ~ again ~ '|secondary') if again else ''}" F1="Close|_INDX_PROMPT_END|secondary"
        _INDX_RAISE MSG="{step}: {ns.why}. Nothing moved."
    {% endif %}

[gcode_macro _INDX_GATE_FROZEN]
description: Inner - the unfrozen need, checked again after a gate fetched a tool itself: a loaded tool whose lock met its plug is not probed (STEP= AGAIN=)
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set loaded = act >= 0 and (svv["t%d_material" % act]|default("")|string or svv["t%d_fil_density" % act]|default(0)|float > 0) %}
    {% set frozen = ("gcode_macro _INDX_LOCK_PAST" in printer and printer["gcode_macro _INDX_LOCK_PAST"].frozen|default(0)|int) or svv.lock_short|default(0) %}
    {% if loaded and frozen %}
        {% set step = params.STEP|default("This step") %}
        {% set fix = ("Shape the tip of T%d|_INDX_DO CMD=INDX_TIP_SHAPE~TOOL=%d~CONFIRM=1|primary" % (act, act)) if "gcode_macro INDX_TIP_SHAPE" in printer else ("Unload T%d|_INDX_DO CMD=INDX_UNLOAD~TOOL=%d|primary" % (act, act)) %}
        _INDX_LCD LEVEL=action MSG="{step}: see console"
        _INDX_PROMPT TITLE="{step} Cannot Start Yet" TEXT="{step} stopped: T{act} was fetched, and its lock stopped short of the release: its filament is frozen at the nozzle, and nothing probes with a tool that is not fully locked. Give it a heated prime or shape its tip first." B1="{fix}" B2="{('Then start ' ~ step ~ ' again|_INDX_DO CMD=' ~ params.AGAIN ~ '|secondary') if params.AGAIN|default('') else ''}" F1="Close|_INDX_PROMPT_END|secondary"
        _INDX_RAISE MSG="{step}: T{act}'s lock stopped short of the release (frozen filament), so it is not probed. Nothing more moved."
    {% endif %}

#####################################################################
#  5. MEASURE, SHOW, THEN SAVE: values are saved by INDX, never pasted
#####################################################################

[gcode_macro _INDX_PENDING]
description: Inner - edits made with +/- buttons that are not saved yet (in memory only): xy {"1": [x, y]} per tool, trim (None = no change waiting). Measured results wait in variables.cfg instead (indx_pending)
variable_xy: {}
variable_trim: None
gcode:

[gcode_macro _INDX_PENDING_SET]
description: Inner - store a measured result for Save or Discard in variables.cfg (indx_pending), so it survives a restart. VARS= JSON dict of saved variables, POST= commands to run on Save, separated by ^ (~ for spaces), WHAT= one line, AGAIN= command to measure again
# One result waits at a time; a new one replaces it (and says so).
gcode:
    {% set post = params.POST|default("")|string %}
    {% set post = post.split("^")|map("trim")|select|map("replace", "~", " ")|list %}
    {% set old = printer.save_variables.variables.indx_pending|default({}) %}
    {% if old and (old.vars|default({}) or old.post|default([])) %}
        RESPOND MSG="INDX > This replaces the result that was waiting for Save: {old.what|default('')}"
    {% endif %}
    {% set j = '{"vars": ' ~ params.VARS|default("{}") ~ ', "post": ' ~ (post|tojson) ~ ', "what": ' ~ (params.WHAT|default("")|tojson) ~ ', "again": ' ~ (params.AGAIN|default("")|tojson) ~ '}' %}
    SAVE_VARIABLE VARIABLE=indx_pending VALUE='{j}'

[gcode_macro INDX_SAVE_PENDING]
description: Save the measured result that waits for Save (INDX_STATUS shows it). AUTO=1: the result passed its checks and is saved by itself (the status shows what). In the guide, the next step follows. Moves: nothing. Saves: what the result lists
gcode:
    {% set p = printer.save_variables.variables.indx_pending|default({}) %}
    _INDX_PROMPT_END
    {% if not p or not (p.vars|default({}) or p.post|default([])) %}
        RESPOND MSG="INDX > Nothing waiting to be saved."
    {% else %}
        {% for k, v in p.vars|default({})|dictsort %}
            SAVE_VARIABLE VARIABLE={k} VALUE='{v|tojson}'
        {% endfor %}
        SAVE_VARIABLE VARIABLE=indx_pending VALUE='{"{}"}'
        {% if params.AUTO|default(0)|int %}
            RESPOND MSG="INDX ok Saved by itself (its checks passed): {p.what}. INDX_STATUS shows it; a step can be measured again any time."
            _INDX_CAL_SET KEY=autosaved VALUE='{p.what|tojson}'
        {% else %}
            RESPOND MSG="INDX ok Saved: {p.what}"
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_INDX_GUIDE VARIABLE=skip VALUE=0
        {% for c in p.post|default([]) %}
            {c}
        {% endfor %}
        # the guide runs on, unless the step's own follow-up took over (skip)
        _INDX_GUIDE_AFTER_SAVE
    {% endif %}

[gcode_macro _INDX_GUIDE_AFTER_SAVE]
description: Inner - after a saved result: the guide's next step, unless the step that saved set skip (renders after the save's follow-up commands)
gcode:
    {% set g = printer["gcode_macro _INDX_GUIDE"] %}
    {% if g.skip|int %}
        SET_GCODE_VARIABLE MACRO=_INDX_GUIDE VARIABLE=skip VALUE=0
    {% elif g.on|int %}
        _INDX_GUIDE_LATER
    {% endif %}

[gcode_macro INDX_DISCARD_PENDING]
description: Throw away the measured result that waits for Save. Moves: nothing
gcode:
    {% set p = printer.save_variables.variables.indx_pending|default({}) %}
    _INDX_PROMPT_END
    SAVE_VARIABLE VARIABLE=indx_pending VALUE='{"{}"}'
    RESPOND MSG="INDX ok Not saved{(': ' ~ p.what) if p.what is defined and p.what else ''}"
    {% if "_INDX_DOCK_ADDED" in p.post|default([])|join(" ") %}
        # the next dock was not added: back to the docks dialog (add it
        # again, or that was the last), a moment later
        RESPOND MSG="INDX > The dock was not added."
        _INDX_LATER CMD=INDX_DOCKS
    {% endif %}

[gcode_macro _INDX_PENDING_ASK]
description: Inner - a measured result: passed its checks (WARN=0, the default) it is saved by itself (AUTO=0 asks anyway); failed (WARN=1) it waits in a dialog with Save anyway, Measure again and Discard. TITLE= TEXT= TEXT2= TEXT3=
# A passing check saves by itself; only a failed one stops with the dialog
# (as in THE GUIDE header) [EL-SET-007]
gcode:
    {% set p = printer.save_variables.variables.indx_pending|default({}) %}
    {% set warn = params.WARN|default(0)|int %}
    {% set again = p.again|default("") %}
    {% if not warn and params.AUTO|default(1)|int %}
        RESPOND MSG="INDX > {params.TITLE|default('Result')}: {params.TEXT2|default('checks passed')|replace('Checks passed: ', '')}"
        INDX_SAVE_PENDING AUTO=1
    {% else %}
    _INDX_PROMPT TITLE="{params.TITLE|default('Save the Result?')}" TEXT="{params.TEXT|default(p.what|default(''))}" TEXT2="{params.TEXT2|default('')}" TEXT3="{params.TEXT3|default('')}" B1="{'Save anyway: the check above failed' if warn else 'Save'}|INDX_SAVE_PENDING|{'warning' if warn else 'primary'}" B2="{('Measure again|_INDX_DO CMD=' ~ again ~ '|secondary') if again else ''}" F1="Discard, keep the old value|INDX_DISCARD_PENDING|secondary"
    {% endif %}

#####################################################################
