#####################################################################
#  INDX Suite: the INDX Klipper modules
#
#  The sections that load INDX's own Python modules (klipper_extras/, which
#  install.sh links into klippy/plugins/). Included by indx_includes.cfg's
#  [include indx_suite*.cfg]: install.sh links this file together with the
#  modules, and install.sh --macros-only leaves it out, so a macros-only
#  printer never sees a section whose module is not there. [EL-UI-008]
#
#  Each section only loads its module with its defaults. Options go into
#  printer.cfg under the same section name (Klipper merges the two), for
#  example [indx_clog] mode: pause, or [tmc_sg_log] stepper: extruder.
#
#  Hardware add-ons are not here: add them in printer.cfg only where the
#  hardware fits ([scanner_z_seek] the INDX eddy scanner, [indx_tool_align]
#  an inductive XY sensor, [xy_dual_stall] sensorless CoreXY homing,
#  [indx_dock_sensor] dock switches).
#####################################################################

# The extension API: printer.indx_api, the INDX events, the tool manager
# commands, INDX's M104/M109 heat rules and the PAUSE park check
[indx_api]

# Clog watch, the support log, wear trends, nozzle taps, the load cell means;
# with [tmc_sg_log] also the faster tool changes (indx_tc_fast). Loads the
# print summary and support bundle (indx_data) and the little extras
# (indx_fun)
[indx_clog]

# Print preflight from the file's own metadata, notifications
[indx_preflight]

# Latch homing, the force lock with frozen filament detection, the misload
# check and the pickup position check (indx_pickup_pos)
[tmc_sg_log]

# The heater soft stop: pauses before verify_heater would shut Klipper down
[indx_heat_watch]
#stop_ahead_s: 5.0       stop when verify_heater's shutdown is this close (s)
#guard_s: 2.0            heater target to 0 this long before that shutdown
#heater_off_guard: True
#use_model: True         also against the heater model (INDX heater, Kalico MPC)
