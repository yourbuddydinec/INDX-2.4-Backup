#####################################################################
#  INDX Suite: the hardware add-ons' macros
#
#  Macros that only run with an INDX add-on module: the inductive XY sensor
#  (indx_tool_align), sensorless CoreXY homing (xy_dual_stall) and the eddy
#  scanner (scanner_z_seek). The modules are INDX Python, so these come with
#  the INDX Suite only: linked by install.sh (the INDX Suite) and included
#  by indx_includes.cfg's [include indx_suite*.cfg]. With the INDX Suite
#  but without the add-on in printer.cfg they are there and the core macros
#  still check for the module first. [EL-UI-013]
#####################################################################

[gcode_macro _INDX_HOME_TOUCH]
description: Inner - after a sensorless X/Y home: the reference touch corrects the frame (COREXY_MOTOR_TOUCH APPLY=1), then reports how far the sensorless home was off
gcode:
    # an add-on's step (xy_dual_stall): the callers check first
    {% if "xy_dual_stall" not in printer %}{action_raise_error("INDX: _INDX_HOME_TOUCH needs sensorless CoreXY homing (xy_dual_stall). Nothing moved.")}{% endif %}
    # a disagreement over stop_mm is not corrected: G28 stops before any dock move [EL-PY-019]
    # SOFT=1: a first failure homes X and Y once more (_INDX_HOME_TOUCH_AGAIN) [EL-HOM-030]
    COREXY_MOTOR_TOUCH APPLY=1 MAX={printer["gcode_macro _INDX_HOME_TOUCH_REPORT"].stop_mm|float} SOFT=1
    _INDX_HOME_TOUCH_AGAIN

[gcode_macro _INDX_HOME_TOUCH_AGAIN]
description: Inner - the reference touch after a sensorless X/Y home failed once (touches that do not agree, or a frame further off than stop_mm): home X and Y once more and touch again; a second failure stops as before, X and Y unhomed
# The first home after a Klipper restart or a cold night can false-stall
# short of the stop; the next home works. [EL-HOM-030]
gcode:
    {% set t = printer.xy_dual_stall.touch|default({}) %}
    {% if t and t.failed|default("") %}
        RESPOND TYPE=error MSG="INDX ! G28: the first X/Y home did not agree with the reference touch (a home that starts at its stop, or the first one after a restart or a cold night, can stop early): homing X and Y once more, 30 mm from the stops. Nothing went near a dock."
        # the touches left the head near the X and Y max stops, out of the dock
        # area: 30 mm back from both before the second home
        {% set p = printer.toolhead.position %}
        SET_KINEMATIC_POSITION X={"%.3f"|format(p.x|float)} Y={"%.3f"|format(p.y|float)} SET_HOMED=XY
        G91
        G1 X-30 Y-30 F3000
        G90
        # inside the homing override: the inner X/Y home, never G28 [EL-HOM-031]
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=1
        _INDX_REHOME_XY
        COREXY_MOTOR_TOUCH APPLY=1 MAX={printer["gcode_macro _INDX_HOME_TOUCH_REPORT"].stop_mm|float}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
    {% endif %}
    _INDX_HOME_TOUCH_REPORT

[gcode_macro _INDX_HOME_TOUCH_REPORT]
description: Inner - the correction the reference touch just applied
# warn_mm: mm off the reference frame above which the correction is reported
# as an error line (still corrected); stop_mm: above this nothing is corrected
# and G28 stops with X and Y unhomed (0: no limit)
variable_warn_mm: 0.5
variable_stop_mm: 2.0
gcode:
    # an add-on's step (xy_dual_stall): the callers check first
    {% if "xy_dual_stall" not in printer %}{action_raise_error("INDX: _INDX_HOME_TOUCH_REPORT needs sensorless CoreXY homing (xy_dual_stall). Nothing moved.")}{% endif %}
    {% set t = printer.xy_dual_stall.touch|default({}) %}
    {% if t and t.dx is not none %}
        {% set off = [t.dx|float|abs, t.dy|float|abs]|max %}
        {% if off > printer["gcode_macro _INDX_HOME_TOUCH_REPORT"].warn_mm|float %}
            RESPOND TYPE=error MSG="INDX ! G28: the sensorless home was X{'%+.3f'|format(t.dx|float)} Y{'%+.3f'|format(t.dy|float)} mm off the reference touch; corrected. A difference this large after a driver change means the sensorless homing needs re-tuning."
        {% else %}
            RESPOND MSG="INDX > G28: reference touch X{'%+.3f'|format(t.dx|float)} Y{'%+.3f'|format(t.dy|float)} mm, corrected"
        {% endif %}
    {% endif %}

[gcode_macro _CZ_SENSOR]
description: Inner - CAL_Z after a cold pickup, with the inductive XY sensor: read the tool's trigger height (INDX_ALIGN_PROBE_Z, one coarse and one slow sample), then out of the dock strip; a warm tool or a sensor without its position: skipped with a line
gcode:
    # an add-on's step (indx_tool_align): the callers check first
    {% if "indx_tool_align" not in printer %}{action_raise_error("INDX: _CZ_SENSOR needs the inductive XY sensor (indx_tool_align). Nothing moved.")}{% endif %}
    {% set t = params.TOOL|int %}
    {% set ta = printer.indx_tool_align %}
    {% set sens = ta.sensor|default([none, none, none]) %}
    {% set temp = printer[printer.toolhead.extruder].temperature|float %}
    {% set tmax = ta.max_tool_temp|default(40)|float %}
    {% if none in sens %}
        RESPOND MSG="  T{t}: no reading on the XY sensor (its position is not set)"
    {% elif temp >= tmax %}
        RESPOND MSG="  T{t}: no reading on the XY sensor, the nozzle is {temp|round(0)|int} C (the sensor reads tools under {tmax|round(0)|int} C)"
    {% else %}
        INDX_ALIGN_PROBE_Z SAMPLES=1
        _INDX_TO_LANE
        _CZ_SENSOR_REC TOOL={t}
    {% endif %}

[gcode_macro _CZ_SENSOR_REC]
description: Inner - keep the XY sensor reading INDX_ALIGN_PROBE_Z just made for TOOL (CAL_Z saves it with the offsets)
gcode:
    # an add-on's step (indx_tool_align): the callers check first
    {% if "indx_tool_align" not in printer %}{action_raise_error("INDX: _CZ_SENSOR_REC needs the inductive XY sensor (indx_tool_align). Nothing moved.")}{% endif %}
    {% set t = params.TOOL|int %}
    {% set lz = printer.indx_tool_align.last_z|default(none) %}
    {% if lz is none or lz.tool|default(-1)|int != t %}
        RESPOND MSG="  T{t}: the XY sensor module gave no Z reading (an older indx_tool_align: update INDX)"
    {% else %}
        {% set d = dict(printer["gcode_macro _CZ_STATE"].sensor) %}
        {% set _ = d.update({t: lz.z|float}) %}
        SET_GCODE_VARIABLE MACRO=_CZ_STATE VARIABLE=sensor VALUE="{d}"
        RESPOND MSG="  T{t} on the XY sensor: trigger at Z {'%.4f'|format(lz.z|float)}"
    {% endif %}

# ---- Scanner twist and scanner meshes (Plus: the eddy scanner) ----
# The scanner sits behind the nozzle, so a twisting gantry makes it read the
# bed a little differently from the nozzle at each place. Kalico's
# mesh-based [axis_twist_compensation] keeps a map per probe: calibrated
# against the load cell (the reference probe) it is applied by Kalico to
# every probing with the scanner, rapid scans included. INDX applies no twist
# of its own, so the map is never applied twice. [EL-CAL-019]
#
# Kalico with that map (and not the older line-based twist compensation)
# is told apart in INDX_CAL_SCANNER_TWIST and INDX_SCANNER_MESH the same
# way. Any one of these shows it:
#   - a map object of a probe, "axis_twist_compensation <probe>" (only the
#     map-based module has these; one exists once a map is calibrated or
#     saved)
#   - a base [axis_twist_compensation] with mesh_min or mesh_radius and no
#     calibrate_start_x: the line-based module requires calibrate_start_x,
#     so it cannot have loaded that section
#   - the help text of AXIS_TWIST_COMPENSATION_CALIBRATE names a mesh (the
#     line-based one speaks of points along the X axis)
[gcode_macro INDX_CAL_SCANNER_TWIST]
description: Calibration (eddy scanner): the scanner's twist map against the load cell, Kalico's AXIS_TWIST_COMPENSATION_CALIBRATE PROBE=<scanner> REFERENCE_PROBE=<load cell> over the [axis_twist_compensation] area. The map is active at once and applied to every scanner probing and scanner mesh; SAVE_CONFIG keeps it. Needs: CONFIRM=1 (asks first), [scanner_z_seek], a Kalico with the mesh-based twist compensation and its [axis_twist_compensation] section (reference_probe the load cell), homed with the reference tool on the head cold, clean and fully locked, the bed clear and at print temperature. Moves: the scanner over every map point, then a load cell tap at each (7 x 6 points take about 9 min). Saves: nothing until SAVE_CONFIG ([axis_twist_compensation <scanner>]). CLEAN=1: the tip was checked clean by eye
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set raw = printer.configfile.config %}
    {% set sc = printer.scanner_z_seek.probe|string if "scanner_z_seek" in printer else "" %}
    {% set zs = printer.scanner_z_seek if "scanner_z_seek" in printer else {} %}
    {% set lc = zs.home_probe|string if "home_probe" in zs else "load_cell_probe" %}
    {% set akey = "axis_twist_compensation " ~ sc %}
    {% set tb = cfg.axis_twist_compensation if "axis_twist_compensation" in cfg else {} %}
    {% set tn = cfg[akey] if akey in cfg else {} %}
    {% set cmds = printer.gcode.commands if "gcode" in printer else {} %}
    {% set ahelp = (cmds.AXIS_TWIST_COMPENSATION_CALIBRATE.help if "AXIS_TWIST_COMPENSATION_CALIBRATE" in cmds else "")|string|lower %}
    {% set has_sec = "axis_twist_compensation" in cfg or "axis_twist_compensation" in raw or akey in cfg %}
    {% set map_kalico = akey in printer or "mesh" in ahelp or (("mesh_min" in tb or "mesh_radius" in tb) and "calibrate_start_x" not in tb) %}
    # the target's own section overrides the base one (Kalico does the same)
    {% set ref = tn.reference_probe if "reference_probe" in tn else (tb.reference_probe if "reference_probe" in tb else "manual") %}
    {% set tmin = tn.mesh_min if "mesh_min" in tn else (tb.mesh_min if "mesh_min" in tb else none) %}
    {% set tmax = tn.mesh_max if "mesh_max" in tn else (tb.mesh_max if "mesh_max" in tb else none) %}
    {% set pc = tn.probe_count if "probe_count" in tn else (tb.probe_count if "probe_count" in tb else 3) %}
    # The base [axis_twist_compensation] reads its options with config.get, so
    # printer.configfile.settings can hold them as strings ("20, 35"); a map
    # section parses them as lists. Both are taken (read as lists, the
    # strings gave a map of 2,0 to 3,3 and 0 x 0 points)
    {% set tmin = (tmin.split(",")|map("float")|list) if tmin is string else tmin %}
    {% set tmax = (tmax.split(",")|map("float")|list) if tmax is string else tmax %}
    {% set pc = (pc.split(",")|map("int")|list) if pc is string else ((pc|list) if pc is iterable else [pc|int]) %}
    {% set pc = [pc[0]|int, pc[-1]|int] %}
    {% set round_map = "mesh_radius" in tn or "mesh_radius" in tb %}
    {% set bmc = cfg.bed_mesh if "bed_mesh" in cfg else {} %}
    {% set ns = namespace(bad="", warn="") %}
    {% if not sc or "bed_mesh" not in printer %}
        {% set ns.bad = "module" %}
    {% elif not has_sec %}
        {% set ns.bad = "printer.cfg has no [axis_twist_compensation]: add it (docs/scanner.md, Scanner Twist). It needs a Kalico with the mesh-based twist compensation: if Kalico refuses the section, update Kalico" %}
    {% elif not map_kalico %}
        {% set ns.bad = "this Kalico has the older line-based twist compensation. The scanner twist needs Kalico's mesh-based twist compensation: update Kalico (Mainsail or Fluidd, Update Manager), then run INDX_CAL_SCANNER_TWIST again" %}
    {% elif ref|string != lc %}
        {% set ns.bad = "[axis_twist_compensation] has reference_probe: %s. The scanner is measured against the load cell: set reference_probe: %s" % (ref, lc) %}
    {% elif not round_map and (tmin is none or tmax is none) %}
        {% set ns.bad = "[axis_twist_compensation] has no mesh_min and mesh_max (the area of the map)" %}
    {% endif %}
    # the map has to cover the scanned area ([bed_mesh] mesh_min to
    # mesh_max): outside it Kalico uses the nearest edge of the map, and the
    # twist there is not corrected
    {% if not ns.bad and not round_map and "mesh_min" in bmc and "mesh_max" in bmc %}
        {% set bmin, bmax = bmc.mesh_min, bmc.mesh_max %}
        {% if tmin[0]|float > bmin[0]|float + 0.5 or tmin[1]|float > bmin[1]|float + 0.5 or tmax[0]|float < bmax[0]|float - 0.5 or tmax[1]|float < bmax[1]|float - 0.5 %}
            {% set ns.warn = "The map (%s,%s to %s,%s) does not cover the scanned area, [bed_mesh] %s,%s to %s,%s: outside the map the scanner mesh keeps the twist. Set mesh_min and mesh_max in [axis_twist_compensation] to those of [bed_mesh]." % (tmin[0]|float, tmin[1]|float, tmax[0]|float, tmax[1]|float, bmin[0]|float, bmin[1]|float, bmax[0]|float, bmax[1]|float) %}
        {% endif %}
    {% endif %}
    {% set mins = ((pc[0] * pc[1] * 12 / 60)|round(0, "ceil"))|int %}
    {% if ns.bad == "module" %}
        RESPOND TYPE=error MSG="INDX ! Scanner twist needs the eddy scanner module ([scanner_z_seek]) and a [bed_mesh] section"
    {% elif ns.bad %}
        RESPOND TYPE=error MSG="INDX ! INDX_CAL_SCANNER_TWIST: {ns.bad}. Nothing moved."
    {% elif not params.CONFIRM|default(0)|int %}
        _INDX_PROMPT TITLE="Scanner Twist" TEXT="The scanner reads {pc[0]} x {pc[1]} places over the bed, then the reference tool taps the same places with the load cell, about {mins} min. The difference becomes the scanner's twist map: Kalico applies it to every scanner mesh from then on." TEXT2="The reference tool on the head, cold and clean (a tip with plastic on it reads high), the bed clear and heated to the temperature you print at most. The active mesh is cleared." {('TEXT3="' ~ ns.warn ~ '"') if ns.warn else ''} B1="Measure the twist|INDX_CAL_SCANNER_TWIST CONFIRM=1{' CLEAN=1' if params.CLEAN|default(0)|int else ''}|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        {% if ns.warn %}
            RESPOND TYPE=error MSG="INDX ! Scanner twist: {ns.warn}"
        {% endif %}
        _INDX_GATE NEEDS=homed,lc,t0,unfrozen STEP="Scanner twist" AGAIN=INDX_CAL_SCANNER_TWIST~CONFIRM=1{'~CLEAN=1' if params.CLEAN|default(0)|int else ''} AUTO=1
        _INDX_PROMPT_END
        # the map is measured on a level gantry, as the meshes it corrects
        _INDX_LEVEL FOR="Scanner twist"
        _INDX_TWIST_RUN CLEAN={params.CLEAN|default(0)|int}
    {% endif %}

[gcode_macro _INDX_TWIST_RUN]
description: Inner - INDX_CAL_SCANNER_TWIST after its gate (renders then): the reference tool cold and clean, the bed at print temperature, every map point reachable on the print side, then Kalico's calibration
gcode:
    {% if "scanner_z_seek" not in printer %}{action_raise_error("INDX: _INDX_TWIST_RUN needs the eddy scanner module (scanner_z_seek). Nothing moved.")}{% endif %}
    {% set cfg = printer.configfile.settings %}
    {% set svv = printer.save_variables.variables %}
    {% set sc = printer.scanner_z_seek.probe|string %}
    {% set zs = printer.scanner_z_seek %}
    {% set lc = zs.home_probe|string if "home_probe" in zs else "load_cell_probe" %}
    {% set akey = "axis_twist_compensation " ~ sc %}
    {% set tb = cfg.axis_twist_compensation if "axis_twist_compensation" in cfg else {} %}
    {% set tn = cfg[akey] if akey in cfg else {} %}
    {% set tmin = tn.mesh_min if "mesh_min" in tn else (tb.mesh_min if "mesh_min" in tb else none) %}
    {% set tmax = tn.mesh_max if "mesh_max" in tn else (tb.mesh_max if "mesh_max" in tb else none) %}
    # strings or lists, as in INDX_CAL_SCANNER_TWIST
    {% set tmin = (tmin.split(",")|map("float")|list) if tmin is string else tmin %}
    {% set tmax = (tmax.split(",")|map("float")|list) if tmax is string else tmax %}
    {% set scc = cfg["probe_eddy_current " ~ sc] if ("probe_eddy_current " ~ sc) in cfg else {} %}
    {% set xo, yo = scc.x_offset|default(0)|float, scc.y_offset|default(0)|float %}
    {% set th = printer.toolhead %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set noz = printer[th.extruder].temperature|float if th.extruder else 0.0 %}
    {% set hb = printer.heater_bed if "heater_bed" in printer else {} %}
    # loaded: a material, or a filament density above 0 (an unload writes 0.0:
    # the key stays: an empty tool was asked for a clean tip)
    {% set loaded = act >= 0 and (svv["t%d_material" % act]|default("")|string|upper not in ["", "NONE"] or svv["t%d_fil_density" % act]|default(0)|float > 0) %}
    {% set clean = svv["t%d_clean" % act]|default(0)|int == 1 if act >= 0 else False %}
    {% set ns = namespace(bad="") %}
    {% if noz > 50 %}
        {% set ns.bad = "the nozzle is at %.0f C: the taps need the reference tool cold (under 50 C, no ooze on the bed)" % noz %}
    {% elif hb and hb.target|float <= 0 %}
        {% set ns.bad = "the bed heater is off: heat the bed to the temperature you print at most (M190 S<C>) and run it again" %}
    {% elif hb and (hb.temperature|float - hb.target|float)|abs > 3 %}
        {% set ns.bad = "the bed is at %.0f C, heating to %.0f C: wait until it is there (M190 S%.0f) and run it again" % (hb.temperature|float, hb.target|float, hb.target|float) %}
    {% endif %}
    # every map point: the scanner over it (the nozzle at the point minus the
    # scanner offset), then the nozzle over it for the tap; all on the print
    # side of the clearance line
    {% if not ns.bad and tmin is not none and tmax is not none %}
        {% for nx, ny in [(tmin[0]|float, tmin[1]|float), (tmax[0]|float, tmax[1]|float), (tmin[0]|float - xo, tmin[1]|float - yo), (tmax[0]|float - xo, tmax[1]|float - yo)] %}
            {% if not ns.bad and not (th.axis_minimum.x <= nx <= th.axis_maximum.x and th.axis_minimum.y <= ny <= th.axis_maximum.y) %}
                {% set ns.bad = "the nozzle would go to X%.1f Y%.1f, outside the axes: check mesh_min and mesh_max in [axis_twist_compensation] and the scanner offsets" % (nx, ny) %}
            {% elif not ns.bad and tp.clearance_y is number and (ny - tp.clearance_y|float) * tp.dock_dir|float > 0 %}
                {% set ns.bad = "the nozzle would go to Y%.1f, past the clearance line (Y%.1f) toward the docks: move mesh_min or mesh_max in [axis_twist_compensation]" % (ny, tp.clearance_y|float) %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if ns.bad %}
        _INDX_RAISE MSG="INDX_CAL_SCANNER_TWIST: {ns.bad}. Nothing moved."
    {% elif loaded and not clean and not params.CLEAN|default(0)|int %}
        # a tip with plastic on it taps high at every point: the map would
        # carry that
        _INDX_PROMPT TITLE="Is the Tip Clean?" TEXT="T{act} has filament and is not flagged clean since it last heated. The load cell taps every map point with it: plastic on the tip reads high everywhere and goes into the map." TEXT2="Clean it (INDX_HOT_CLEAN, then let it cool under 50 C), or check the tip by eye." B1="It is clean: measure|INDX_CAL_SCANNER_TWIST CONFIRM=1 CLEAN=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        RESPOND MSG="INDX > Scanner twist: Kalico measures the map, the scanner ({sc}) first, then the load cell ({lc}) at the same places. The active mesh is cleared."
        BED_MESH_CLEAR
        SAVE_GCODE_STATE NAME=_indx_twist
        G90
        G1 Z5 F900
        # the load cell re-zero and the frozen guard, once for all the taps
        _INDX_PROBE_PREP
        _INDX_TO_LANE
        AXIS_TWIST_COMPENSATION_CALIBRATE PROBE={sc} REFERENCE_PROBE={lc}
        G1 Z5 F900
        RESTORE_GCODE_STATE NAME=_indx_twist
        _INDX_TWIST_DONE
    {% endif %}

[gcode_macro _INDX_TWIST_DONE]
description: Inner - INDX_CAL_SCANNER_TWIST after Kalico's calibration (renders then): the map's spread in one line, then SAVE_CONFIG offered
gcode:
    {% set sc = printer.scanner_z_seek.probe|string %}
    {% set akey = "axis_twist_compensation " ~ sc %}
    {% set m = printer[akey].mesh_matrix if akey in printer else [] %}
    {% set flat = m|sum(start=[]) %}
    {% if flat %}
        RESPOND MSG="INDX ok Scanner twist map measured: {'%+.3f'|format(flat|min)} to {'%+.3f'|format(flat|max)} mm across the bed, active now for every scanner mesh. The scanner meshes saved before are scanned again. SAVE_CONFIG keeps the map ([{akey}] in printer.cfg)."
    {% else %}
        RESPOND MSG="INDX ok Scanner twist map measured, active now for every scanner mesh. SAVE_CONFIG keeps it ([{akey}] in printer.cfg)."
    {% endif %}
    _INDX_PROMPT TITLE="Scanner Twist Measured" TEXT="The map is active now. SAVE_CONFIG writes it to printer.cfg and restarts Klipper. Without it the map is gone after the next restart." B1="Save config, Klipper restarts|_INDX_SAVE_CONFIG THEN=none|warning" F1="Later|_INDX_PROMPT_END|secondary"

# INDX's own scanner twist (scanner_twist in variables.cfg) is replaced by
# Kalico's twist map: an old one is dropped once, with one line, and the
# scanner meshes made with it are not reused (scanner_meshes).
[delayed_gcode _indx_scanner_twist_drop]
initial_duration: 4.0
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.scanner_twist is defined and svv.scanner_twist %}
        SAVE_VARIABLE VARIABLE=scanner_twist VALUE="{ {} }"
        RESPOND MSG="INDX > The scanner twist INDX measured before is dropped: Kalico's twist map replaces it. Run INDX_CAL_SCANNER_TWIST once on the new Kalico."
    {% endif %}
    {% if svv.scanner_meshes is defined and svv.scanner_meshes %}
        SAVE_VARIABLE VARIABLE=scanner_meshes VALUE="{ {} }"
    {% endif %}

[gcode_macro INDX_SCANNER_MESH]
description: Scanner bed mesh: Kalico's rapid scan (BED_MESH_CALIBRATE PROBE=<scanner> METHOD=rapid_scan) with the scanner's twist map, zeroed at zero_reference_position, saved as the bed mesh profile scanner_<bed C>. REUSE=1 (the print start) loads the scan made at the same bed temperature (within 2 C) instead, unless the twist map, the [bed_mesh] area or the scanner calibration changed since. [REUSE=0|1] [BED=<C>] [COUNT=<points per axis>] [SPEED=<mm/s>]. Needs: [scanner_z_seek], the twist map (INDX_CAL_SCANNER_TWIST), homed with a tool on the head, the bed clear. Moves: the scanner over the [bed_mesh] area. Saves: scanner_scans
gcode:
    {% set ps = params.PRINT_START|default(0)|int %}
    {% set cfg = printer.configfile.settings %}
    {% set raw = printer.configfile.config %}
    {% set svv = printer.save_variables.variables %}
    {% set me = printer["gcode_macro _INDX_SCAN_MESH"] %}
    {% set sc = printer.scanner_z_seek.probe|string if "scanner_z_seek" in printer else "" %}
    {% set bmc = cfg.bed_mesh if "bed_mesh" in cfg else {} %}
    {% set sck = "probe_eddy_current " ~ sc %}
    {% set scc = cfg[sck] if sck in cfg else {} %}
    # Kalico's twist map for the scanner: told apart from the line-based
    # twist compensation as in INDX_CAL_SCANNER_TWIST (see above it)
    {% set akey = "axis_twist_compensation " ~ sc %}
    {% set tb = cfg.axis_twist_compensation if "axis_twist_compensation" in cfg else {} %}
    {% set cmds = printer.gcode.commands if "gcode" in printer else {} %}
    {% set ahelp = (cmds.AXIS_TWIST_COMPENSATION_CALIBRATE.help if "AXIS_TWIST_COMPENSATION_CALIBRATE" in cmds else "")|string|lower %}
    {% set has_sec = "axis_twist_compensation" in cfg or "axis_twist_compensation" in raw or akey in cfg %}
    {% set map_kalico = akey in printer or "mesh" in ahelp or (("mesh_min" in tb or "mesh_radius" in tb) and "calibrate_start_x" not in tb) %}
    {% set tm = printer[akey].mesh_matrix if akey in printer else [] %}
    # a BED_MESH_CALIBRATE macro (KAMP's) drops PROBE=, METHOD= and PROFILE=:
    # the scan calls the command it renamed (_BED_MESH_CALIBRATE)
    {% set w = cfg["gcode_macro bed_mesh_calibrate"] if "gcode_macro bed_mesh_calibrate" in cfg else {} %}
    {% set bm_cmd = (w.rename_existing|string|upper if "rename_existing" in w else "") or "BED_MESH_CALIBRATE" %}
    {% set hb = printer.heater_bed if "heater_bed" in printer else {} %}
    {% set bed = params.BED|float if params.BED is defined else (hb.target|float if hb and hb.target|float > 0 else (hb.temperature|float if hb else 0.0)) %}
    {% set cnt = params.COUNT|default(me.count)|int %}
    {% set th = printer.toolhead %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set yo = scc.y_offset|default(0)|float %}
    {% set ns = namespace(stop="", fb="") %}
    {% if not sc or "bed_mesh" not in printer %}
        {% set ns.stop = "needs the eddy scanner module ([scanner_z_seek]) and a [bed_mesh] section" %}
    {% elif not scc %}
        {% set ns.stop = "printer.cfg has no [%s]" % sck %}
    {% elif 0 < cnt < 3 %}
        {% set ns.stop = "COUNT= 0 (the [bed_mesh] probe_count) or 3 and more" %}
    {% elif "x" not in th.homed_axes or "y" not in th.homed_axes or "z" not in th.homed_axes %}
        {% set ns.stop = "needs X, Y and Z homed (G28)" %}
    {% elif printer.print_stats.state in ["printing", "paused"] and not ps %}
        {% set ns.stop = "not during a print (the print start scans itself with MESH=scanner)" %}
    {% elif svv.active_tool|default(-1)|int < 0 %}
        {% set ns.stop = "needs a tool on the head (the Z frame is the tool's)" %}
    {% elif "zero_reference_position" not in bmc %}
        {% set ns.stop = "needs zero_reference_position in [bed_mesh] (the G28 Z tap point): the mesh is zeroed there" %}
    {% elif not has_sec %}
        {% set ns.fb = "printer.cfg has no [axis_twist_compensation]: the scanner mesh needs Kalico's twist map for the scanner (docs/scanner.md, Scanner Twist, and update Kalico if it refuses the section)" %}
    {% elif not map_kalico %}
        {% set ns.fb = "this Kalico has the older line-based twist compensation: the scanner mesh needs Kalico's mesh-based twist map. Update Kalico, then run INDX_CAL_SCANNER_TWIST" %}
    {% elif not tm %}
        {% set ns.fb = "the scanner has no twist map yet: run INDX_CAL_SCANNER_TWIST (and SAVE_CONFIG) once" %}
    {% endif %}
    # each mesh row puts the nozzle a scanner offset in front of the row: on
    # the print side of the clearance line
    {% if not ns.stop and not ns.fb and "mesh_min" in bmc and "mesh_max" in bmc %}
        {% for ny in [bmc.mesh_min[1]|float - yo, bmc.mesh_max[1]|float - yo] %}
            {% if not ns.stop and not th.axis_minimum.y <= ny <= th.axis_maximum.y %}
                {% set ns.stop = "the nozzle would go to Y%.1f, outside the axis: check mesh_min, mesh_max and the scanner y_offset" % ny %}
            {% elif not ns.stop and tp.clearance_y is number and (ny - tp.clearance_y|float) * tp.dock_dir|float > 0 %}
                {% set ns.stop = "the nozzle would go to Y%.1f, past the clearance line (Y%.1f) toward the docks: move mesh_min or mesh_max in [bed_mesh]" % (ny, tp.clearance_y|float) %}
            {% endif %}
        {% endfor %}
    {% endif %}
    # what a saved scan must match to be reused: the [bed_mesh] area and zero
    # point, the points per axis, the scanner calibration and the twist map
    {% set cs = scc.calibrate|default("")|string %}
    {% set pcnt = bmc.probe_count|default([0])|list %}
    {% set cnt_key = cnt if cnt >= 3 else (pcnt[0]|int if pcnt else 0) %}
    {% set key = "%s|%s|%s|%d|%d:%s|%d:%.6f" % (bmc.mesh_min|default("")|string, bmc.mesh_max|default("")|string, bmc.zero_reference_position|default("")|string, cnt_key, cs|length, (cs.split()|join(" "))[-24:], tm|length, tm|map("sum")|sum) %}
    {% set store = svv.scanner_scans if svv.scanner_scans is defined and svv.scanner_scans is mapping else {} %}
    {% set profiles = printer.bed_mesh.profiles if "bed_mesh" in printer else {} %}
    {% set rs = namespace(hit="", seq=-1, bed=0.0) %}
    {% if params.REUSE|default(0)|int %}
        {% for name, e in store.items() %}
            {% if name in profiles and e["key"]|default("") == key and (e["bed"]|float - bed)|abs <= 2.0 and e["seq"]|int > rs.seq %}
                {% set rs.hit = name %}
                {% set rs.seq = e["seq"]|int %}
                {% set rs.bed = e["bed"]|float %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% set pname = "scanner_%d" % (bed|round(0)|int) %}
    {% set extra = "" %}
    {% if cnt >= 3 %}
        {% set extra = extra ~ (" PROBE_COUNT=%d,%d" % (cnt, cnt)) ~ (" ALGORITHM=bicubic" if cnt > 6 else "") %}
    {% endif %}
    {% set spd = params.SPEED|default(me.speed)|float %}
    {% if spd > 0 %}
        {% set extra = extra ~ (" SCAN_SPEED=%.0f" % ([spd, th.max_velocity|float]|min)) %}
    {% endif %}
    {% if ns.stop %}
        {action_raise_error("INDX_SCANNER_MESH: " ~ ns.stop ~ ". Nothing moved.")}
    {% elif ns.fb and ps %}
        RESPOND TYPE=error MSG="INDX ! Print start: no scanner mesh, {ns.fb}. The load cell meshes the full bed instead."
        BED_MESH_CALIBRATE
    {% elif ns.fb %}
        {action_raise_error("INDX_SCANNER_MESH: " ~ ns.fb ~ ". Nothing moved.")}
    {% elif rs.hit %}
        # a mesh is right only on the gantry it was made on: level
        _INDX_LEVEL FOR="Scanner mesh"
        BED_MESH_PROFILE LOAD={rs.hit}
        {% set se = store[rs.hit] %}
        SET_GCODE_VARIABLE MACRO=_INDX_SCAN_MESH VARIABLE=last VALUE="{ {'profile': rs.hit, 'bed': rs.bed, 'reused': True, 'points': se['points']|default(0)|int, 'range': se['range']|default(0.0)|float} }"
        RESPOND MSG="INDX > Scanner mesh: loaded {rs.hit}, scanned at a {'%.0f'|format(rs.bed)} C bed (target {'%.0f'|format(bed)} C), no scan. INDX_SCANNER_MESH scans again"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_INDX_SCAN_MESH VARIABLE=pending VALUE="{ {'profile': pname, 'bed': bed|round(1), 'key': key} }"
        _INDX_LEVEL FOR="Scanner mesh"
        # out to the lane first: the travel to the first row never crosses the docks
        _INDX_TO_LANE
        {bm_cmd} PROBE={sc} METHOD=rapid_scan PROFILE={pname}{extra}
        _INDX_SCAN_MESH_DONE
    {% endif %}

[gcode_macro _INDX_SCAN_MESH_DONE]
description: Inner - INDX_SCANNER_MESH after the scan (renders then): the scan kept for reuse at its bed temperature (scanner_scans, the newest keep of _INDX_SCAN_MESH), the profiles it replaces removed, one line with the mesh range
gcode:
    {% set me = printer["gcode_macro _INDX_SCAN_MESH"] %}
    {% set p = me.pending %}
    {% set bm = printer.bed_mesh %}
    {% if not p or bm.profile_name != p["profile"] %}
        {action_raise_error("INDX_SCANNER_MESH: the scan did not load its profile " ~ (p["profile"] if p else "") ~ ": see the console above")}
    {% endif %}
    {% set svv = printer.save_variables.variables %}
    {% set old = svv.scanner_scans if svv.scanner_scans is defined and svv.scanner_scans is mapping else {} %}
    # a scan replaces the ones within 2 C of its bed temperature; the newest
    # keep stay
    {% set ns = namespace(seq=0, keep={}, drop=[]) %}
    {% for name, e in old.items() %}
        {% if e["seq"]|default(0)|int > ns.seq %}{% set ns.seq = e["seq"]|int %}{% endif %}
    {% endfor %}
    {% for name, e in old.items() if name != p["profile"] %}
        {% if name not in bm.profiles or (e["bed"]|default(-99)|float - p["bed"]|float)|abs <= 2.0 %}
            {% set ns.drop = ns.drop + [name] %}
        {% else %}
            {% set _ = ns.keep.update({name: e}) %}
        {% endif %}
    {% endfor %}
    {% set flat = bm.probed_matrix|sum(start=[]) %}
    {% set lo = flat|min if flat else 0.0 %}
    {% set hi = flat|max if flat else 0.0 %}
    {% set _ = ns.keep.update({p["profile"]: {"bed": p["bed"]|float, "seq": ns.seq + 1, "key": p["key"], "points": flat|length, "range": (hi - lo)|round(4)}}) %}
    {% set order = [] %}
    {% for name, e in ns.keep.items() %}{% set _ = order.append([e["seq"]|int, name]) %}{% endfor %}
    {% set store = {} %}
    {% for q in order|sort(reverse=True) %}
        {% if loop.index <= me.keep|int %}
            {% set _ = store.update({q[1]: ns.keep[q[1]]}) %}
        {% else %}
            {% set ns.drop = ns.drop + [q[1]] %}
        {% endif %}
    {% endfor %}
    {% for name in ns.drop if name in bm.profiles %}
        BED_MESH_PROFILE REMOVE={name}
    {% endfor %}
    SAVE_VARIABLE VARIABLE=scanner_scans VALUE="{store}"
    SET_GCODE_VARIABLE MACRO=_INDX_SCAN_MESH VARIABLE=last VALUE="{ {'profile': p['profile'], 'bed': p['bed']|float, 'reused': False, 'points': flat|length, 'range': (hi - lo)|round(4)} }"
    SET_GCODE_VARIABLE MACRO=_INDX_SCAN_MESH VARIABLE=pending VALUE="{ {} }"
    RESPOND MSG="INDX > Scanner mesh: {flat|length} points, {'%+.3f'|format(lo)} to {'%+.3f'|format(hi)} mm (range {'%.3f'|format(hi - lo)}), zeroed at zero_reference_position, with the scanner's twist map. Profile {p['profile']} (SAVE_CONFIG keeps it in printer.cfg), reused by the print start at a {'%.0f'|format(p['bed']|float)} C bed until the twist map, the [bed_mesh] area or the scanner calibration changes"

[gcode_macro _INDX_SENSOR_ZCHECK]
description: Inner - PRINT_TOOLCHANGE, the first pickup in a print of a tool that primes in the purge station: with the inductive XY sensor ([indx_tool_align]), a cold Z reading (INDX_ALIGN_PROBE_Z, one coarse and one slow sample) against the one CAL_Z recorded relative to the reference tool (t<n>_sensor_dz, sensor_ref_z); out of spec (z_check_limit) stops before anything heats. Warm or frozen tools, the reference tool, no sensor or no CAL_Z reading: skipped with a line
# The reference is the reference tool's CAL_Z reading (sensor_ref_z): it is
# warm at every pickup in a print, and the sensor reads cold tools only. The
# sensor still refuses a warm tool, a heater on and any move past its min_y.
# A tool short of the release (frozen) is never probed.
gcode:
    {% set t = params.TOOL|int %}
    {% set sv = printer.save_variables.variables %}
    {% set ref = sv.ref_tool|default(0)|int %}
    {% set pt = printer["gcode_macro PRINT_TOOLCHANGE"] %}
    {% if "indx_tool_align" in printer and t != ref and t not in pt.zchecked %}
        {% set ta = printer.indx_tool_align %}
        {% set tmax = ta.max_tool_temp|default(40)|float %}
        {% set temp = printer[printer.toolhead.extruder].temperature|float %}
        {% set dz = sv["t%d_sensor_dz" % t] if ("t%d_sensor_dz" % t) in sv else none %}
        SET_GCODE_VARIABLE MACRO=PRINT_TOOLCHANGE VARIABLE=zchecked VALUE="{pt.zchecked + [t]}"
        {% if dz is none or sv.sensor_ref_z is not defined %}
            RESPOND MSG="INDX > T{t}: no cold Z check on the XY sensor (no reading from CAL_Z yet: CAL_Z records one per tool when the sensor is installed)"
        {% elif temp >= tmax %}
            RESPOND MSG="INDX > T{t}: no cold Z check on the XY sensor, the nozzle is {temp|round(0)|int} C (the sensor reads tools under {tmax|round(0)|int} C)"
        {% elif sv.lock_short|default(0)|int or printer["gcode_macro _INDX_LOCK_MARK"].short|int %}
            RESPOND MSG="INDX > T{t}: no cold Z check on the XY sensor, its latch is short of the release (frozen): no probing until the purge has carried it past"
        {% else %}
            INDX_ALIGN_PROBE_Z SAMPLES=1
            # out of the dock strip before anything else
            _INDX_TO_LANE
            _INDX_SENSOR_ZJUDGE TOOL={t}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_SENSOR_ZJUDGE]
description: Inner - _INDX_SENSOR_ZCHECK after the reading: the tool's trigger height minus the reference tool's (CAL_Z, sensor_ref_z) against t<n>_sensor_dz; beyond z_check_limit stop (nothing has heated), else one line
gcode:
    # an add-on's step (indx_tool_align): the callers check first
    {% if "indx_tool_align" not in printer %}{action_raise_error("INDX: _INDX_SENSOR_ZJUDGE needs the inductive XY sensor (indx_tool_align). Nothing moved.")}{% endif %}
    {% set t = params.TOOL|int %}
    {% set sv = printer.save_variables.variables %}
    {% set ref = sv.ref_tool|default(0)|int %}
    {% set lim = printer["gcode_macro _PRIME_SETTINGS"].z_check_limit|float %}
    {% set lz = printer.indx_tool_align.last_z|default(none) %}
    {% if lz is none or lz.tool|default(-1)|int != t %}
        RESPOND MSG="INDX > T{t}: the XY sensor module gave no Z reading to check (an older indx_tool_align: update INDX), not checked"
    {% else %}
        {% set now = lz.z|float - sv.sensor_ref_z|float %}
        {% set dev = now - sv["t%d_sensor_dz" % t]|float %}
        {% set where = "lower" if dev > 0 else "higher" %}
        {% if dev|abs > lim %}
            RESPOND TYPE=error MSG="INDX ! T{t} cold Z check on the XY sensor: its nozzle sits {'%.3f'|format(dev|abs)} mm {where} than at CAL_Z (relative to T{ref}; {'%+.3f'|format(now)} now, {'%+.3f'|format(sv['t%d_sensor_dz' % t]|float)} then), the limit is {'%.2f'|format(lim)} mm. Nothing has heated. Check that T{t} sits right on the head and its nozzle is tight and unchanged; after a nozzle change run CAL_Z."
            _INDX_RAISE MSG="T{t} cold Z check: {'%.3f'|format(dev|abs)} mm {where} than at CAL_Z, see above"
        {% else %}
            RESPOND MSG="INDX > T{t} cold Z check on the XY sensor: {'%+.3f'|format(dev)} mm against CAL_Z (relative to T{ref}), within {'%.2f'|format(lim)} mm"
        {% endif %}
    {% endif %}

[gcode_macro _INDX_SCAN_MESH]
description: Setting - the scanner mesh (INDX_SCANNER_MESH, print start MESH=scanner): mesh_reuse loads the scan made at the same bed temperature (within 2 C) instead of scanning at every print start; speed the scan speed, mm/s (0: the [bed_mesh] speed); count the points per axis (0: the [bed_mesh] probe_count); keep the scans kept for reuse. INDX_SETTING MACRO=_INDX_SCAN_MESH VAR=mesh_reuse VALUE=0 scans every print
variable_mesh_reuse: True
variable_speed: 0
variable_count: 0
variable_keep: 6
# last: the last scanner mesh, made or reused (the print summary of the
# support log keeps it); pending: the scan INDX_SCANNER_MESH started, for
# _INDX_SCAN_MESH_DONE
variable_last: {}
variable_pending: {}
gcode:
    RESPOND MSG="INDX > Scanner mesh: {'reuses the scan made at the same bed temperature' if mesh_reuse else 'scans at every print start'}, {('%.0f mm/s' % speed|float) if speed|float > 0 else 'the [bed_mesh] speed'}, {count if count|int > 0 else 'the [bed_mesh] probe_count'} points per axis. INDX_SCANNER_MESH scans now."

[gcode_macro INDX_CAL_XY_SENSOR]
description: XY offsets with the inductive XY sensor (indxy, plugin indx_tool_align: INDX_ALIGN_CALIBRATE, then INDX_ALIGN_APPLY). Asks first; the plugin changes tools and moves the head itself. The reference tool is measured before the other tools and after the last one: when it held still the result is saved by itself, else it waits for Save. Needs: the plugin, the sensor position (found by hand once, INDX_XY_LOCATE), homed, every dock measured and tested, a rigid sensor mount, a clear bed. ARGS= extra INDX_ALIGN_CALIBRATE parameters (~ for spaces)
# The reference tool is measured before the other tools and after the last, so a
# sensor mount that moves in the run stops the autosave: it must be rigid. [EL-SET-028]
gcode:
    {% if "indx_tool_align" not in printer.configfile.config %}
        _INDX_PROMPT TITLE="XY Sensor Not Installed" TEXT="The indxy sensor plugin (indx_tool_align) is not loaded on this printer, so this method is not available." TEXT2="Use print and measure, the nozzle camera, or offsets by hand." B1="Other XY methods|_INDX_DO CMD=INDX_CAL_XY|primary" F1="Close|_INDX_PROMPT_END|secondary"
        RESPOND MSG="INDX > INDX_CAL_XY_SENSOR: no [indx_tool_align] in the config, skipped"
    {% else %}
        _INDX_BUILD_TOOLS
        _INDX_SEAT_G
        _INDX_GATE NEEDS=lc,homed STEP="XY sensor" AGAIN=INDX_CAL_XY_SENSOR
        _INDX_CHECK_DOCKS TOOLS={range(printer["gcode_macro TOOL_POSITIONS"].tool_count|int)|join(",")}
        _INDX_CHECK_CLEARANCE
        {% set sens = printer.indx_tool_align.sensor|default([none, none, none]) if "indx_tool_align" in printer else [none, none, none] %}
        {% if sens[0] is none or sens[1] is none or sens[2] is none %}
            # a new printer: where the sensor is is found by hand once
            RESPOND MSG="INDX > The XY sensor position is not saved yet: find it first (T{printer.save_variables.variables.ref_tool|default(0)|int} over the sensor by hand)."
            INDX_XY_LOCATE WHAT=sensor
        {% else %}
            _INDX_XY_SENSOR_RUN {rawparams}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_XY_SENSOR_RUN]
description: Inner - INDX_CAL_XY_SENSOR after its gates: ask, then run the sensor calibration (INDX_ALIGN_CALIBRATE, INDX_ALIGN_APPLY) and check that the reference held still
# Two plugin copies: INDX's own reports ref_first and ref_last. An older copy in a
# printer's own Kalico tree measures T0 as the reference and reports only last,
# last_offsets and sensor, so INDX measures T0 itself right before and after the
# calibration, on the same pickups.
# Settle pass: the first measurement after G28 reads off, so one discarded pass of
# the reference comes first (INDX's copy does it itself; else SAMPLES=1 here).
# pickups: PICKUPS= unless ARGS sets it (both copies take it) [EL-SET-029]
variable_pickups: 2
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set cal = svv.indx_cal|default({}) %}
    {% set ta = printer.indx_tool_align if "indx_tool_align" in printer else {} %}
    {% set args = params.ARGS|default("")|replace("~", " ") %}
    {% set pk = "" if "PICKUPS" in args|upper else "PICKUPS=%d" % printer["gcode_macro _INDX_XY_SENSOR_RUN"].pickups|int %}
    # TOOLS=: only those tools against the reference (first and last) [EL-CAL-020]
    {% set tl = ("TOOLS=" ~ params.TOOLS) if params.TOOLS is defined and "TOOLS" not in args|upper else "" %}
    {% if not cal.tested|default(0)|int %}
        _INDX_PROMPT TITLE="Test the Tool Changes First" TEXT="The sensor run picks up every tool. Run the tool change test once first, so every dock is proven." B1="Test all tools|_INDX_DO CMD=INDX_TEST_ALL_TOOLS|primary" F1="Close|_INDX_PROMPT_END|secondary"
        _INDX_RAISE MSG="INDX_CAL_XY_SENSOR: run INDX_TEST_ALL_TOOLS first. Nothing moved."
    {% elif not params.CONFIRM|default(0)|int %}
        {% set ref = svv.ref_tool|default(0)|int if ta.ref_first is defined else 0 %}
        _INDX_PROMPT TITLE="XY Offsets With the Sensor" TEXT="INDX picks up {('T%s' % params.TOOLS|replace(',', ', T')) if params.TOOLS is defined else 'every tool'} in turn, T{ref} first, and measures each nozzle over the inductive XY sensor, cold. T{ref} is measured again after the last tool: if it moved, the sensor mount moved, and the result waits for you instead of saving by itself." TEXT2="The sensor must not move between or during runs: mount it rigidly." TEXT3="The bed must be clear. A result whose check passes is saved by itself, else it waits for Save with the old values next to it." B1="Bed is clear: run it|INDX_CAL_XY_SENSOR CONFIRM=1{(' TOOLS=' ~ params.TOOLS) if params.TOOLS is defined else ''}{(' ARGS=' ~ params.ARGS) if params.ARGS is defined else ''}|primary" B2="Measure the sensor position again|_INDX_DO CMD=INDX_XY_LOCATE~WHAT=sensor|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT_END
        _INDX_RUNNING STEP="XY sensor"
        _INDX_XY_SNAPSHOT
        {% if ta.ref_first is not defined %}
            # the older copy: T0 on the head and measured before the run
            {% if svv.active_tool|default(-1)|int != 0 %}
                T0
            {% endif %}
            # the settle pass, discarded: the kept T0 measurement is not the
            # first pass after the travel
            INDX_ALIGN_MEASURE SAMPLES=1
            INDX_ALIGN_MEASURE
            _INDX_XY_SENSOR_KEEP WHICH=first
        {% endif %}
        # The plugin's own commands (klipper_extras/indx_tool_align.py): the
        # calibration measures every tool against the reference tool, the
        # apply writes tN_offset_x/y. The old offsets go back right after
        # (_INDX_XY_SENSOR_RESULT) until the check passes or Save is pressed
        INDX_ALIGN_CALIBRATE {[args, pk, tl]|select|join(" ")}
        INDX_ALIGN_APPLY CONFIRM=1
        {% if ta.ref_first is not defined %}
            # the older copy ends its calibration with T0 on the head
            INDX_ALIGN_MEASURE
            _INDX_XY_SENSOR_KEEP WHICH=last
        {% endif %}
        # Done at the station: straight out to the clearance line before anything else
        _INDX_TO_LANE
        _INDX_XY_SENSOR_RESULT
    {% endif %}

[gcode_macro _INDX_XY_SENSOR_KEEP]
description: Inner - the older indx_tool_align copy: keep the reference measurement INDX_ALIGN_MEASURE just made (its status last) as WHICH=first or last
variable_first: []
variable_last: []
gcode:
    {% set which = params.WHICH|default("first")|lower %}
    {% set l = printer.indx_tool_align.last|default(none) if "indx_tool_align" in printer else none %}
    {% set v = [l.x|float|round(4), l.y|float|round(4)] if l and l.x is defined and l.y is defined else [] %}
    {% if which not in ["first", "last"] %}
        {action_raise_error("_INDX_XY_SENSOR_KEEP: WHICH=first or WHICH=last")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_XY_SENSOR_KEEP VARIABLE={which} VALUE='{v|tojson}'

[gcode_macro _INDX_XY_SNAPSHOT]
description: Inner - remember every tool's XY offset before the sensor run (INDX_ALIGN_APPLY saves its results)
variable_old: {}
# had: the tools that had an XY offset before (the result says "first
# measurement" for the others)
variable_had: []
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set old = {} %}
    {% set had = [] %}
    {% for i in range(printer["gcode_macro TOOL_POSITIONS"].tool_count|int) if i != svv.ref_tool|default(0)|int %}
        {% for a in ["x", "y"] %}
            {% set k = "t%d_offset_%s" % (i, a) %}
            {% set _ = old.update({k: svv[k]|default(0.0)|float}) %}
        {% endfor %}
        {% if ("t%d_offset_x" % i) in svv and ("t%d_offset_y" % i) in svv %}{% set _ = had.append(i) %}{% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_INDX_XY_SNAPSHOT VARIABLE=old VALUE='{old|tojson}'
    SET_GCODE_VARIABLE MACRO=_INDX_XY_SNAPSHOT VARIABLE=had VALUE='{had|tojson}'
    # no reference measurement from an earlier run may stand in for this one
    SET_GCODE_VARIABLE MACRO=_INDX_XY_SENSOR_KEEP VARIABLE=first VALUE='[]'
    SET_GCODE_VARIABLE MACRO=_INDX_XY_SENSOR_KEEP VARIABLE=last VALUE='[]'

[gcode_macro _INDX_XY_SENSOR_RESULT]
description: Inner - after the sensor run: put the old offsets back, then save the new ones by themselves when the reference held still between its first and last measurement (ref_move_max), else offer them with Save anyway, Measure again and Discard
# The one check: the reference is measured before the other tools and after the
# last; a mount or reference seat that moved in the run shows as the difference.
# INDX's copy also takes each tool against the reference interpolated to its
# moment and checks each reference against the one before (ref_steps): one
# outlier pickup is dropped, a sensor that moved and stayed has the tools since
# the last good reference measured again (held here), a second move stops the
# run. The older copy has the first-to-last check only. No hold for a large
# change of a saved offset: offsets are relative to the same run's reference.
# ref_move_max: the larger of the X and Y difference (mm). [EL-SET-030]
variable_ref_move_max: 0.10
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set old = printer["gcode_macro _INDX_XY_SNAPSHOT"].old %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set ref = svv.ref_tool|default(0)|int %}
    {% set ta = printer.indx_tool_align if "indx_tool_align" in printer else {} %}
    {% set keep = printer["gcode_macro _INDX_XY_SENSOR_KEEP"] %}
    {% set lim = printer["gcode_macro _INDX_XY_SENSOR_RESULT"].ref_move_max|float %}
    # INDX's copy: the calibration's own first and last reference
    # measurement, against ref_tool, and INDX_ALIGN_APPLY leaves the
    # reference out. The older copy: INDX's own T0 measurements around the
    # run, offsets against T0 and written for every tool but T0, so with
    # another reference tool they are moved onto it (minus the reference's)
    {% set newcopy = ta.ref_first is defined %}
    {% set a = (ta.ref_first or []) if newcopy else keep.first %}
    {% set b = (ta.ref_last or []) if newcopy else keep.last %}
    {% set mref = ref if newcopy else 0 %}
    {% set moved = [(a[0]|float - b[0]|float)|abs, (a[1]|float - b[1]|float)|abs]|max if a|length >= 2 and b|length >= 2 else none %}
    {% set steps = (ta.ref_steps or []) if newcopy else [] %}
    {% set jumps = steps|selectattr("kind", "equalto", "moved")|map(attribute="step")|list %}
    {% set outl = steps|selectattr("kind", "equalto", "outlier")|map(attribute="step")|list %}
    {% set bad = moved is none or moved > lim or jumps %}
    {% set conv = not newcopy and ref != 0 %}
    {% set bx = svv["t%d_offset_x" % ref]|default(0.0)|float if conv else 0.0 %}
    {% set by = svv["t%d_offset_y" % ref]|default(0.0)|float if conv else 0.0 %}
    {% set ns = namespace(vars={}, txt=[], tools=[]) %}
    {% for i in range(printer["gcode_macro TOOL_POSITIONS"].tool_count|int) if i != ref %}
        {% set kx = "t%d_offset_x" % i %}
        {% set ky = "t%d_offset_y" % i %}
        {% set nx = ((svv[kx]|default(0.0)|float if i else 0.0) - bx) if conv else svv[kx]|default(0.0)|float %}
        {% set ny = ((svv[ky]|default(0.0)|float if i else 0.0) - by) if conv else svv[ky]|default(0.0)|float %}
        {% set ox = old[kx]|default(0.0)|float %}
        {% set oy = old[ky]|default(0.0)|float %}
        {% if (nx - ox)|abs > 0.00005 or (ny - oy)|abs > 0.00005 %}
            {% set _ = ns.vars.update({kx: nx|round(4), ky: ny|round(4)}) %}
            {% set first = i not in printer["gcode_macro _INDX_XY_SNAPSHOT"].had|default([]) %}
            {% set ns.txt = ns.txt + [("T%d X %.3f Y %.3f (first measurement)" % (i, nx, ny)) if first else ("T%d X %.3f Y %.3f (was %.3f, %.3f)" % (i, nx, ny, ox, oy))] %}
            {% set ns.tools = ns.tools + [i] %}
        {% endif %}
    {% endfor %}
    _INDX_RUNNING STEP=none
    {% if conv %}
        # the older copy wrote the reference's offset against T0: back to 0
        SAVE_VARIABLE VARIABLE=t{ref}_offset_x VALUE=0.0
        SAVE_VARIABLE VARIABLE=t{ref}_offset_y VALUE=0.0
    {% endif %}
    {% if not ns.tools %}
        RESPOND MSG="INDX > The sensor run changed no tool offset. Nothing to save: the saved offsets stand{', the setup goes on' if printer['gcode_macro _INDX_GUIDE'].on|int else ' (INDX_SETUP for the next step)'}."
        {% for i in range(printer["gcode_macro TOOL_POSITIONS"].tool_count|int) if i != ref %}
            _INDX_CAL_XY_DONE TOOL={i}
        {% endfor %}
        _INDX_GUIDE_LATER
    {% else %}
        # Back to the old values until Save
        {% for k, v in old.items() if k in ns.vars %}
            SAVE_VARIABLE VARIABLE={k} VALUE={"%.4f"|format(v|float)}
        {% endfor %}
        {% if act in ns.tools %}
            SET_GCODE_OFFSET X={"%.4f"|format(old["t%d_offset_x" % act]|float)} Y={"%.4f"|format(old["t%d_offset_y" % act]|float)}
        {% endif %}
        _INDX_PENDING_SET VARS='{ns.vars|tojson}' POST="_INDX_XY_SENSOR_SAVED~TOOLS={ns.tools|join(',')}" WHAT="XY offsets from the sensor: {ns.txt|join(', ')}" AGAIN="INDX_CAL_XY_SENSOR"
        {% if moved is none %}
            {% set why = "INDX could not compare T%d's measurements before and after the run (no reference result from the sensor plugin), so it cannot tell whether the sensor held still. Run it again; save only if you know the mount is rigid." % mref %}
        {% elif jumps %}
            {% set why = "The sensor moved %s during the run and stayed there. INDX measured the tools around the move again, so the offsets are against the new place, but a sensor that moves once can move again: check that it is fixed, then save or run it again." % jumps|join(", ") %}
        {% elif bad %}
            {% set why = "T%d (the reference) moved %.3f mm between its measurement before the tools and after the last one (limit %.2f): the sensor mount or T%d's seat moved during the run. Check that the sensor is fixed, then run it again." % (mref, moved, lim, mref) %}
        {% else %}
            {% set why = "Checks passed: T%d (the reference) held still, %.3f mm between before and after the run (limit %.2f)." % (mref, moved, lim) %}
            {% if outl %}
                {% set why = why ~ " One reference pickup read %s off and was measured again: it was the pickup, not the sensor, and was left out." % outl|join(", ") %}
            {% endif %}
        {% endif %}
        _INDX_PENDING_ASK TITLE="XY Sensor: Save the Offsets?" TEXT="{ns.txt|join(', ')}." TEXT2="{why}" WARN={1 if bad else 0}
    {% endif %}

[gcode_macro _INDX_XY_SENSOR_SAVED]
description: Inner - sensor offsets saved for TOOLS=: mark them done and apply the live offset of the tool on the head
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set tools = params.TOOLS|default("")|string %}
    {% set tools = tools.split(",")|map("trim")|select|map("int")|list %}
    {% for t in tools %}
        _INDX_CAL_XY_DONE TOOL={t}
    {% endfor %}
    {% if act in tools %}
        SET_GCODE_OFFSET X={svv["t%d_offset_x" % act]|default(0.0)} Y={svv["t%d_offset_y" % act]|default(0.0)}
    {% endif %}
    {% set nt = printer["gcode_macro _INDX_TOOL_NEW_CAL"].tool|int if "gcode_macro _INDX_TOOL_NEW_CAL" in printer else -1 %}
    {% if nt in tools %}
        # a new tool's own calibration: done, or Z still to do [EL-CAL-021]
        _INDX_TOOL_NEW_CAL TOOL={nt}
    {% endif %}

[delayed_gcode _indx_xy_locate_result_motor]
gcode:
    {% set m = printer.xy_dual_stall.home|default(none) if "xy_dual_stall" in printer else none %}
    {% if m %}
        _INDX_XY_LOCATE_FOUND X={m.start[0]|float} Y={m.start[1]|float}
    {% else %}
        _INDX_RUNNING STEP=none
        RESPOND TYPE=error MSG="INDX ! No measurement of the spot: did COREXY_MOTOR_HOME run?"
    {% endif %}

[gcode_macro _INDX_XY_LOCATE_FACE]
description: Inner - INDX_XY_LOCATE, sensor: the paper drags: the face is 0.1 mm under the nozzle; set the rough position and the face, then the sensor measures its own center
gcode:
    # an add-on's step (indx_tool_align): the callers check first
    {% if "indx_tool_align" not in printer %}{action_raise_error("INDX: _INDX_XY_LOCATE_FACE needs the inductive XY sensor (indx_tool_align). Nothing moved.")}{% endif %}
    {% set me = printer["gcode_macro INDX_XY_LOCATE"] %}
    {% set p = printer.toolhead.position %}
    {% set face = p.z|float - 0.1 %}
    RESPOND MSG="INDX ok Sensor face at Z{'%.3f'|format(face)} (0.1 mm under the nozzle). Measuring the sensor center with T{printer.save_variables.variables.ref_tool|default(0)|int}."
    INDX_ALIGN_SET_SENSOR X={"%.3f"|format(me.x|float)} Y={"%.3f"|format(me.y|float)} FACE_Z={"%.3f"|format(face)}
    INDX_ALIGN_MEASURE
    _INDX_XY_LOCATE_SENSOR_SET

[gcode_macro _INDX_XY_LOCATE_SENSOR_SET]
description: Inner - INDX_XY_LOCATE, sensor: its own measurement found the center: keep it as the sensor position (staged for the setup's SAVE_CONFIG), then on to the sensor XY offsets
gcode:
    # an add-on's step (indx_tool_align): the callers check first
    {% if "indx_tool_align" not in printer %}{action_raise_error("INDX: _INDX_XY_LOCATE_SENSOR_SET needs the inductive XY sensor (indx_tool_align). Nothing moved.")}{% endif %}
    {% set me = printer["gcode_macro INDX_XY_LOCATE"] %}
    {% set last = printer.indx_tool_align.last|default(none) %}
    SET_GCODE_VARIABLE MACRO=INDX_XY_LOCATE VARIABLE=active VALUE=0
    _INDX_RUNNING STEP=none
    {% if last is none or last.x is not defined %}
        RESPOND TYPE=error MSG="INDX ! The sensor measurement gave no center: the rough position is kept. INDX_ALIGN_MEASURE with the reference tool shows why."
    {% elif (last.x|float - me.x|float)|abs > 5 or (last.y|float - me.y|float)|abs > 5 %}
        RESPOND TYPE=error MSG="INDX ! The sensor center X{'%.3f'|format(last.x|float)} Y{'%.3f'|format(last.y|float)} is more than 5 mm from where the head was held (X{'%.2f'|format(me.x|float)} Y{'%.2f'|format(me.y|float)}): not kept. Find it again (INDX_XY_LOCATE WHAT=sensor)."
    {% else %}
        INDX_ALIGN_SET_SENSOR X={"%.3f"|format(last.x|float)} Y={"%.3f"|format(last.y|float)}
        RESPOND MSG="INDX ok XY sensor center X{'%.3f'|format(last.x|float)} Y{'%.3f'|format(last.y|float)} (machine), from the rough spot X{'%.2f'|format(me.x|float)} Y{'%.2f'|format(me.y|float)}. The setup's SAVE_CONFIG keeps it. Next: the XY offsets with the sensor."
        _INDX_TO_LANE
        _INDX_LATER CMD=INDX_CAL_XY_SENSOR
    {% endif %}

[delayed_gcode _indx_cal_dock_result_motor]
gcode:
    {% set t = printer["gcode_macro INDX_CAL_DOCK"].tool|int %}
    {% set m = printer.xy_dual_stall.home|default(none) if "xy_dual_stall" in printer else none %}
    {% if m and t >= 0 %}
        _INDX_CAL_DOCK_RESULT TOOL={t} X={m.start[0]|float} Y={m.start[1]|float} SRC="COREXY_MOTOR_HOME"
    {% else %}
        RESPOND TYPE=error MSG="INDX ! No dock measurement: did COREXY_MOTOR_HOME run?"
    {% endif %}
