#####################################################################
#  INDX Suite: the extension API's PAUSE (indx_api)
#
#  Macros that only indx_api.py runs. Linked by install.sh (the INDX Suite)
#  only and included by indx_includes.cfg's [include indx_suite*.cfg]; an
#  INDX Macros install does not have them. [EL-UI-013]
#####################################################################

[gcode_macro _INDX_SAFE_PAUSE]
description: Inner - PAUSE through INDX (indx_api.py wraps PAUSE) when the printer's own PAUSE macro would park in or next to the dock zone, or the head is behind the clearance line: the base PAUSE, the G-code states that macro saves (so its RESUME finds them), then INDX's park. WHY= for the console
gcode:
    {% set pm = printer.configfile.settings["gcode_macro pause"] %}
    {pm.rename_existing if pm is defined and pm.rename_existing is defined else "PAUSE_BASE"}
    _INDX_PAUSE_STATES
    RESPOND TYPE=error MSG="INDX ! PAUSE: {params.WHY|default('your PAUSE macro parks in or next to the dock zone')}. INDX parks the head itself instead (_INDX_PAUSE_PARK: out to the clearance line, then only on the bed side). RESUME works as before. Fix your PAUSE macro: _INDX_PAUSE_CHECK says how."
    _INDX_PAUSE_PARK
