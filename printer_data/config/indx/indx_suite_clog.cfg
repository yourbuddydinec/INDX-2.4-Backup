#####################################################################
#  INDX Suite: clog watch, support log, feedback and extras (indx_clog)
#
#  Macros that only run with the INDX Suite's indx_clog module (with
#  indx_fun, which it loads): the load cell weight calibration, the clog
#  watch test, the feedback questions, the bed soak skip, the nozzle tap
#  answers of the hot cleaning, the dated prime tunes and the extras.
#  Linked by install.sh (the INDX Suite) only and included by
#  indx_includes.cfg's [include indx_suite*.cfg]; an INDX Macros install
#  does not have them. [EL-UI-013]
#####################################################################

#####################################################################
#  INDX_CAL_LOADCELL_WEIGHT: optional, a known weight instead of the
#  latch spring
#####################################################################
#  Springs differ, so a known weight is more exact than the assumed spring
#  force [EL-CAL-011]. It hangs on the head's three steel balls, on a plate
#  or hook that touches nothing else. Each cycle's change is taken against
#  the empty readings on both sides, so slow drift drops out. Every run goes
#  into the support log.
#####################################################################

[gcode_macro INDX_CAL_LOADCELL_WEIGHT]
description: Optional, more exact load cell calibration with a known weight hung on the head's three steel balls (GRAMS=, 200 g or more; CYCLES= 3): empty, weight and empty readings, the change per cycle, counts per gram from them. Asks before it applies anything. Needs: a calibrated load cell, the head empty. Moves: Z up to 100 mm when homed and lower. Saves: counts_per_gram (SAVE_CONFIG, after you choose)
variable_grams: 0.0
variable_cycles: 3
# [weight on (0/1), mean g, sd g] per reading
variable_seq: []
# a cycle whose empty readings moved more than this fraction of the weight
# is not used
variable_flip_frac: 0.05
# the result is offered when at least two cycles agree within this (%)
variable_spread_max: 2.0
gcode:
    {% set grams = params.GRAMS|default(0)|float %}
    {% set cycles = params.CYCLES|default(3)|int %}
    {% set lc = printer.load_cell_probe|default({}) %}
    {% if lc.counts_per_gram|default(0)|float <= 0 %}
        {action_raise_error("INDX_CAL_LOADCELL_WEIGHT: calibrate the load cell first (INDX_CAL_LOADCELL); the weight refines it. Nothing moved.")}
    {% elif printer.save_variables.variables.active_tool|default(-1)|int >= 0 %}
        {action_raise_error("INDX_CAL_LOADCELL_WEIGHT: a tool is recorded on the head; park it first (PARK_TOOL). Nothing moved.")}
    {% elif printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("INDX_CAL_LOADCELL_WEIGHT: not during a print. Nothing moved.")}
    {% elif grams < 200 or cycles < 2 or cycles > 6 %}
        {action_raise_error("INDX_CAL_LOADCELL_WEIGHT: GRAMS= the weight in grams, 200 or more (the heavier, the more exact), CYCLES= 2 to 6. Nothing moved.")}
    {% endif %}
    {% if not params.CONFIRM|default(0)|int %}
        _INDX_PROMPT TITLE="Load Cell: Known Weight" TEXT="A weight of exactly {grams|round(1)} g hangs on the head's three steel balls, where a tool seats, on a plate or hook that touches nothing else. INDX reads the head empty, with the weight and empty again, {cycles} times, and works out the calibration from the changes." TEXT2="The head must be empty with the latch open. {'The head goes up to Z100 first so the weight hangs free.' if 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z < 100 else 'Make sure the weight can hang free under the head.'}" TEXT3="Nothing is applied until you choose. Optional: the standard calibration is good for printing; this makes the grams exact." B1="Start|INDX_CAL_LOADCELL_WEIGHT GRAMS={grams} CYCLES={cycles} CONFIRM=1|primary" F1="Cancel|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT_END
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LOADCELL_WEIGHT VARIABLE=grams VALUE={grams}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LOADCELL_WEIGHT VARIABLE=cycles VALUE={cycles}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LOADCELL_WEIGHT VARIABLE=seq VALUE="[]"
        {% if "z" in printer.toolhead.homed_axes and printer.toolhead.position.z < 100 %}
            G90
            G0 Z100 F600
            M400
        {% endif %}
        _INDX_LCW_ASK STEP=0
    {% endif %}

[gcode_macro _INDX_LCW_ASK]
description: Inner - INDX_CAL_LOADCELL_WEIGHT: ask for the next reading (STEP=; even: empty, odd: the weight on)
gcode:
    {% set me = printer["gcode_macro INDX_CAL_LOADCELL_WEIGHT"] %}
    {% set n = params.STEP|int %}
    {% set total = 2 * me.cycles|int + 1 %}
    {% if n % 2 == 0 %}
        _INDX_PROMPT TITLE="Known Weight: {n + 1} of {total}" TEXT="{'Make sure the head is empty: nothing on the balls.' if n == 0 else 'Take the weight off.'} Then let go: nothing may touch the head while it reads (3 s)." B1="Read the empty head|_INDX_LCW_MEASURE STEP={n}|primary" F1="Cancel|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT TITLE="Known Weight: {n + 1} of {total}" TEXT="Hang the {me.grams|round(1)} g weight on the three steel balls. Let go: it must hang still and touch nothing else while it reads (3 s)." B1="Read with the weight|_INDX_LCW_MEASURE STEP={n}|primary" F1="Cancel|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_LCW_MEASURE]
description: Inner - INDX_CAL_LOADCELL_WEIGHT: settle, average 3 s of samples, store
gcode:
    _INDX_PROMPT_END
    # the hand has just left the head
    G4 P1500
    INDX_LC_MEAN NAME=lcw SECONDS=3
    _INDX_LCW_STORE STEP={params.STEP}

[gcode_macro _INDX_LCW_STORE]
description: Inner - INDX_CAL_LOADCELL_WEIGHT: keep the reading, then the next step or the result
gcode:
    {% set me = printer["gcode_macro INDX_CAL_LOADCELL_WEIGHT"] %}
    {% set n = params.STEP|int %}
    {% set r = printer.indx_clog.lc_means.lcw %}
    SET_GCODE_VARIABLE MACRO=INDX_CAL_LOADCELL_WEIGHT VARIABLE=seq VALUE="{me.seq + [[n % 2, r.mean|float, r.sd|float]]}"
    {% if n + 1 < 2 * me.cycles|int + 1 %}
        _INDX_LCW_ASK STEP={n + 1}
    {% else %}
        _INDX_LCW_RESULT
    {% endif %}

[gcode_macro _INDX_LCW_RESULT]
description: Inner - INDX_CAL_LOADCELL_WEIGHT: the change per cycle, the cycles used, counts per gram, and the choice to apply
gcode:
    {% set me = printer["gcode_macro INDX_CAL_LOADCELL_WEIGHT"] %}
    {% set seq = me.seq %}
    {% set grams = me.grams|float %}
    {% set cpg = printer.load_cell_probe.counts_per_gram|float %}
    {% set lim = me.flip_frac|float * grams %}
    {% set ns = namespace(d=[], f=[], used=[], lines=[]) %}
    {% for i in range(me.cycles|int) %}
        {% set e0, l, e1 = seq[2 * i][1], seq[2 * i + 1][1], seq[2 * i + 2][1] %}
        {% set d = ((e0 + e1) / 2.0 - l)|abs %}
        {% set fl = (e1 - e0)|abs %}
        {% set ns.d = ns.d + [d|round(1)] %}
        {% set ns.f = ns.f + [fl|round(1)] %}
        {% if fl <= lim %}{% set ns.used = ns.used + [d] %}{% endif %}
        {% set ns.lines = ns.lines + ["Cycle %d: %.1f g%s" % (i + 1, d, (", not used: the empty head moved %.0f g" % fl) if fl > lim else "")] %}
    {% endfor %}
    {% set svv = printer.save_variables.variables %}
    {% set seats = [] %}
    {% for t in range(printer["gcode_macro TOOL_POSITIONS"].tool_count|int) %}
        {% if svv["t%d_seat_g" % t] is defined and svv["t%d_seat_g" % t] is not none %}{% set _ = seats.append("T%d:%d" % (t, svv["t%d_seat_g" % t]|float)) %}{% endif %}
    {% endfor %}
    {% if ns.used|length >= 2 %}
        {% set mean = (ns.used|sum) / ns.used|length %}
        {% set spread = (ns.used|max - ns.used|min) / mean * 100.0 %}
        {% set new = cpg * mean / grams %}
    {% else %}
        {% set mean, spread, new = 0.0, 100.0, cpg %}
    {% endif %}
    {% set ok = ns.used|length >= 2 and spread <= me.spread_max|float and (new / cpg - 1.0)|abs <= 0.3 %}
    INDX_SUPPORT_LOG LCW=1 GRAMS={grams} CPG_OLD={"%.5f"|format(cpg)} CPG_NEW={"%.5f"|format(new)} DELTAS={ns.d|join(",")} FLIPS={ns.f|join(",")} USED={ns.used|length} SPREAD={"%.2f"|format(spread)} SAVED=0 SEATS={seats|join(",") or "none"}
    RESPOND MSG="INDX > load cell weight calibration, {grams|round(1)} g: {ns.lines|join('; ')}. Counts per gram {'%.4f'|format(cpg)} -> {'%.4f'|format(new)} ({ns.used|length} of {me.cycles} cycles used, spread {'%.1f'|format(spread)} %)"
    {% if ok %}
        _INDX_PROMPT TITLE="Load Cell: Known Weight" TEXT="The {grams|round(1)} g weight reads {mean|round(1)} g on the current calibration, {(((mean / grams) - 1.0) * 100)|abs|round(1)} % {'high' if mean > grams else 'low'}. {ns.used|length} cycles agree within {'%.1f'|format(spread)} %." LINES="{ns.lines|join('^')}" TEXT2="Applying sets counts per gram {'%.4f'|format(cpg)} -> {'%.4f'|format(new)}: every gram reading changes by {(((grams / mean) - 1.0) * 100)|round(1)} %. {'Run Lock force per tool (INDX_CAL_LOCK) again afterwards: its targets are in grams.' if ((new / cpg) - 1.0)|abs > 0.03 else ''}" B1="Apply|_INDX_LCW_APPLY CPG={'%.5f'|format(new)}|primary" B2="Apply and save config (Klipper restarts)|_INDX_LCW_APPLY CPG={'%.5f'|format(new)} SAVE=1|warning" F1="Discard|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT TITLE="Known Weight: No Result" TEXT="{'Fewer than two cycles could be used: the empty head reading moved between them.' if ns.used|length < 2 else ('The cycles differ by %.1f %%, more than %.1f %%.' % (spread, me.spread_max|float) if spread > me.spread_max|float else 'The result is more than 30 % from the current calibration: check the weight and that it hangs free.')}" LINES="{ns.lines|join('^')}" TEXT2="Make sure the weight hangs still and touches nothing but the balls, and that nothing else touches the head, then run it again. Nothing was changed." B1="Run it again|INDX_CAL_LOADCELL_WEIGHT GRAMS={grams} CYCLES={me.cycles} CONFIRM=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_LCW_APPLY]
description: Inner - INDX_CAL_LOADCELL_WEIGHT: apply counts per gram (CPG=), SAVE=1 also SAVE_CONFIG (Klipper restarts)
gcode:
    _INDX_PROMPT_END
    INDX_SUPPORT_LOG LCW=1 GRAMS={printer["gcode_macro INDX_CAL_LOADCELL_WEIGHT"].grams} CPG_OLD={"%.5f"|format(printer.load_cell_probe.counts_per_gram|float)} CPG_NEW={params.CPG} SAVED=1
    # the saved gram values follow (_INDX_LC_SYNC, run by it)
    INDX_LC_SET_CPG CPG={params.CPG} WHY=weight SRC=weight
    {% if params.SAVE|default(0)|int %}
        SAVE_CONFIG
    {% else %}
        RESPOND MSG="INDX ok Load cell calibration applied until the next restart; SAVE_CONFIG keeps it."
    {% endif %}

