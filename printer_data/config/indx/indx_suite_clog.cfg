[gcode_macro INDX_SOAK_SKIP]
description: Skip the rest of the INDX_PRINT_START bed soak. Typed, it waits until a running print start is done: use Skip soak on the INDX page or Moonraker POST /server/indx/soak/skip, which act at once
gcode:
    _INDX_SOAK_STATE SKIP=1

#####################################################################
#  FEEDBACK AFTER A PRINT AND IN CONTEXT (beta)
#####################################################################
#
#  After a print, and in context (an INDX stop, a setup step with errors,
#  troubleshooting): how it went, was the message clear, did the fix work.
#  A finished print asks Good, Blobs, Starving or Other (SIGN=) [EL-MAC-006].
#  indx_clog decides when (idle, never during a print) and records each
#  answer in the support log. These macros only show the dialogs.
#  INDX_FEEDBACK opens them by hand; _INDX_FEEDBACK.enabled turns the
#  automatic ones off.
#####################################################################

[gcode_macro _INDX_FEEDBACK]
description: Inner - the feedback questions that come by themselves (after prints, stops, failed setup steps, troubleshooting): enabled (an INDX setting; off: only INDX_FEEDBACK by hand opens them)
variable_enabled: True
gcode:

#####################################################################
#  LITTLE EXTRAS (easter eggs) [EL-MAC-007]
#####################################################################
#
#  The indx_fun module (klipper_extras/indx_fun.py) adds friendly console
#  lines (fika units, kanelbullens dag, a semla, purge milestones), never in
#  an error, a warning or a failed print. enabled turns them off; the dated
#  prime line tunes have their own setting (_PRIME_SETTINGS.dated_tunes).
#####################################################################

[gcode_macro _INDX_FUN]
description: Inner - the easter eggs of the indx_fun module: enabled (an INDX setting), bun_g (grams to a kanelbulle), fika_h (hours of printing before "Dags for fika?")
variable_enabled: True
variable_bun_g: 65
variable_fika_h: 3.0
gcode:

[gcode_macro _INDX_FEEDBACK_ASK]
description: Inner - the first feedback question: how it went, or in context whether the message was clear (indx_clog shows it when the printer is idle; INDX_FEEDBACK by hand). Moves: nothing
gcode:
    {% set fb = printer.indx_clog.feedback|default({}) if "indx_clog" in printer else {} %}
    {% if fb and printer.print_stats.state|default("") not in ["printing", "paused"] %}
        {% set end = fb.end|default("general") %}
        # titles short enough for a dialog header (Mainsail cuts at about 30 characters)
        {% set titles = {"finished": "How Did It Print?", "cancelled": "How Did the Print Go?",
                         "fault": "What Stopped the Print?", "shutdown": "Was the Shutdown a Problem?",
                         "stop": "Was the Stop Message Clear?", "step": "Was the Step Message Clear?",
                         "trouble": "Were the Steps Clear?", "general": "Feedback on INDX"} %}
        {% if end in ["stop", "step", "trouble"] %}
            {% set g = "Clear, I knew what to do|INDX_FEEDBACK CLEAR=yes|primary^Unclear|INDX_FEEDBACK CLEAR=no|warning" %}
        {% elif end == "shutdown" %}
            {% set g = "No problem, I caused it|INDX_FEEDBACK OUTCOME=good|secondary^A real problem|INDX_FEEDBACK OUTCOME=failed|primary" %}
        {% elif end == "finished" %}
            # a finished print: what it looked like, one click (Other: then where)
            {% set g = "Good|INDX_FEEDBACK OUTCOME=good|primary^Blobs|INDX_FEEDBACK OUTCOME=issues SIGN=blobs|warning^Starving|INDX_FEEDBACK OUTCOME=issues SIGN=starving|warning^Other|INDX_FEEDBACK OUTCOME=issues SIGN=other|secondary" %}
        {% else %}
            {% set g = "Good|INDX_FEEDBACK OUTCOME=good|primary^Had issues|INDX_FEEDBACK OUTCOME=issues|warning^Failed|INDX_FEEDBACK OUTCOME=failed|error" %}
        {% endif %}
        _INDX_PROMPT TITLE="{titles[end]|default('Feedback on INDX')}" TEXT="{('File: ' ~ fb.file) if fb.file else ''}" TEXT2="{fb.text}" TEXT3="Your answer is saved in the INDX support log on this printer. No file names, nothing about you." G1="{g}" F1="Skip|INDX_FEEDBACK SKIP=1|secondary" F2="Do not ask again|INDX_FEEDBACK OFF=1|secondary"
    {% endif %}

[gcode_macro _INDX_FEEDBACK_AREA]
description: Inner - the second feedback question after a print: could anything have been better. OUTCOME=good|issues|failed. Moves: nothing
gcode:
    {% set o = params.OUTCOME|default("issues")|lower %}
    {% set ns = namespace(b=[]) %}
    {% for k, label in [["tool_change", "Tool change"], ["prime", "Prime and purge"], ["first_layer", "First layer and Z"],
                        ["quality", "Print quality"], ["filament", "Filament and loading"], ["other", "Something else"]] %}
        {% set ns.b = ns.b + ["%s|INDX_FEEDBACK OUTCOME=%s AREA=%s|secondary" % (label, o, k)] %}
    {% endfor %}
    _INDX_PROMPT TITLE="Anything to Improve?" TEXT="{'Pick the closest one, or Nothing.' if o == 'good' else 'Pick where the trouble was.'}" TEXT2="To say more: Feedback in Settings, About on the INDX page. Please leave out names and addresses." G1="{ns.b[:3]|join('^')}" G2="{ns.b[3:]|join('^')}" B1="Nothing, it was fine|INDX_FEEDBACK OUTCOME={o} AREA=none|primary" F1="Skip this question|INDX_FEEDBACK DONE=1|secondary"

[gcode_macro _INDX_FEEDBACK_FIX]
description: Inner - the second feedback question in context: did the suggested fix work. Moves: nothing
gcode:
    _INDX_PROMPT TITLE="Did the Suggested Fix Work?" TEXT="Only if the message suggested something to try." TEXT2="To say more: Feedback in Settings, About on the INDX page." G1="It worked|INDX_FEEDBACK FIX=worked|primary^It did not work|INDX_FEEDBACK FIX=failed|warning^Not tried yet|INDX_FEEDBACK FIX=untried|secondary" F1="Skip this question|INDX_FEEDBACK DONE=1|secondary"

# What the test is for and where its samples go: [EL-CLOG-021]
[gcode_macro INDX_CLOG_TEST]
description: Clog watch test: push filament through TOOL=n in the air over its purge lane slot at rising flow (FLOWS= mm3/s, comma separated) until the extruder cannot keep up, so the clog watch sees it skip, then save the load cell samples (INDX_CLOG_DUMP). TEMP= (default 20 C under the recorded temperature: harder to push), LEN= mm per step (6). Needs: CONFIRM=1 (asks first), [indx_clog], filament loaded, homed. Moves: tool change, to the purge lane, Z20. Grinds the filament a little at the top flows
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set t = params.TOOL|default(svv.active_tool|default(0))|int %}
    {% set rec = svv["t%d_temp" % t]|default(0)|int %}
    {% set temp = params.TEMP|default((rec - 20) if rec > 0 else 210)|int %}
    {% set flows = params.FLOWS|default("4,8,12,16,20,24,28,32")|string %}
    {% set len = params.LEN|default(6)|float %}
    {% if temp < 170 or temp > 300 %}
        {action_raise_error("INDX_CLOG_TEST: TEMP= 170 to 300 C. Nothing moved.")}
    {% elif not svv["t%d_material" % t]|default("") %}
        {action_raise_error("INDX_CLOG_TEST: T%d has no filament recorded. Load it first. Nothing moved." % t)}
    {% endif %}
    {% if not params.CONFIRM|default(0)|int %}
        _INDX_PROMPT TITLE="Clog Watch Test, T{t}" TEXT="INDX picks up T{t}, goes 20 mm over its purge lane slot, heats to {temp} C and pushes {len|round(0)|int} mm at each flow: {flows} mm3/s, in the air." TEXT2="At the top flows the extruder skips on purpose, so the clog watch can see it. The filament gets ground a little and a strand hangs from the nozzle: take it off afterwards." TEXT3="The load cell samples are written to a temporary file afterwards (INDX_CLOG_DUMP)." B1="Run the test|INDX_CLOG_TEST TOOL={t} TEMP={temp} FLOWS={flows} LEN={len} CONFIRM=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_GATE NEEDS=homed STEP="Clog watch test" AGAIN=INDX_CLOG_TEST~TOOL={t} AUTO=1
        _INDX_PROMPT_END
        _INDX_RUNNING STEP="Clog watch test T{t}"
        {% if printer["gcode_macro TOOL_POSITIONS"].prime_enabled|default(True) %}
            _PRIME_SLOTS COUNT={printer["gcode_macro TOOL_POSITIONS"].tool_count|int}
        {% endif %}
        _INDX_CHANGE_TOOL TOOL={t}
        _INDX_CLOG_TEST_RUN TOOL={t} TEMP={temp} FLOWS={flows} LEN={len}
    {% endif %}

[gcode_macro _INDX_CLOG_TEST_RUN]
description: Inner - INDX_CLOG_TEST once T is on the head
gcode:
    {% set t = params.TOOL|int %}
    {% set temp = params.TEMP|int %}
    {% set len = params.LEN|float %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set slots = printer["gcode_macro _PRIME_SETTINGS"].slots|default([]) if tp.prime_enabled|default(True) else [] %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set dia = printer.configfile.settings.extruder.filament_diameter|default(1.75)|float %}
    {% set area = 0.7854 * dia * dia %}
    SAVE_GCODE_STATE NAME=_indx_clog_test
    G90
    G1 Z20 F900
    {% if slots|length > t %}
        _INDX_TO_LANE
        G1 X{"%.2f"|format(slots[t][0] - o.x|float)} Y{"%.2f"|format(slots[t][1] - o.y|float)} F{(printer.configfile.settings.printer.max_velocity|float * 60 * printer["gcode_macro _TOOLCHANGE_VARS"].speed_mult|float)|int or 6000}
    {% endif %}
    M104 S{temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3} MAXIMUM={temp + 10}
    M83
    # a slow push first: a full melt zone and the latch lock cleared
    G1 E5 F120
    M400
    G4 P1500
    INDX_CLOG RESET=1
    {% for fl in params.FLOWS.split(",") %}
        {% set v = fl|float / area %}
        RESPOND MSG="INDX clog test: {fl|float|round(0)|int} mm3/s ({'%.1f'|format(v)} mm/s of filament)"
        G1 E{len} F{"%.1f"|format(v * 60)}
        M400
        G4 P800
    {% endfor %}
    G1 E-2 F1800
    M104 S0
    M400
    INDX_CLOG_DUMP NAME=test_T{t}
    INDX_CLOG
    RESTORE_GCODE_STATE NAME=_indx_clog_test
    SAVE_VARIABLE VARIABLE=t{t}_retracted VALUE=2
    _INDX_RUNNING STEP=none

[gcode_macro _INDX_CLEAN_TAP]
description: Inner - a tap pattern during INDX_CLEAN_ALL, from indx_clog: COUNT=2 20 C more, 3 the next tool (the last tool: done), 4 done
gcode:
    {% set s = printer["gcode_macro INDX_CLEAN_ALL"] %}
    {% set c = params.COUNT|int %}
    {% set l = s.tools.split(",") if s.tools else [] %}
    {% set last = s.idx|int + 1 >= l|length %}
    {% if not s.active|int or s.state != "cleaning" %}
        RESPOND MSG="INDX > {c} taps: no hot cleaning is waiting for taps, nothing done."
    {% elif c == 2 %}
        _INDX_CLEAN_HOTTER
    {% elif c == 3 and not last %}
        _INDX_TAP_ACK COUNT=3 MSG="3 taps: T{s.tool} done, next T{l[s.idx|int + 1]}"
        INDX_CLEAN_NEXT
    {% elif c == 3 or c == 4 %}
        _INDX_TAP_ACK COUNT={c} MSG="{c} taps: cleaning done"
        INDX_CLEAN_DONE
    {% endif %}

[gcode_macro _INDX_CLEAN_HOTTER]
description: Inner - 2 taps during INDX_CLEAN_ALL: 20 C more on this tool, never over max_temp (250 C) nor the heater's max_temp. The next tool starts at the session's TEMP again
gcode:
    {% set s = printer["gcode_macro INDX_CLEAN_ALL"] %}
    {% set ext = printer.configfile.settings.extruder|default({}) %}
    {% set top = [s.max_temp|float, ext.max_temp|default(s.max_temp)|float]|min %}
    {% set cur = printer.extruder.target|float %}
    {% set new = [cur + 20, top]|min %}
    UPDATE_DELAYED_GCODE ID=_indx_clean_timeout DURATION={s.timeout|int}
    {% if cur <= 0 %}
        _INDX_TAP_ACK COUNT=2 MSG="2 taps: the heater is off, nothing changed"
    {% elif new <= cur %}
        _INDX_TAP_ACK COUNT=2 MSG="2 taps: T{s.tool} stays at {cur|int} C, the most for cleaning"
    {% else %}
        M104 S{new|int}
        _INDX_TAP_ACK COUNT=2 MSG="2 taps: T{s.tool} heating to {new|int} C"
    {% endif %}

[gcode_macro _INDX_TAP_ACK]
description: Inner - acknowledge a recognized tap pattern without a screen: MSG= on the console and the display, then a cue: a white flash of the LED named in led (the INDX head front LEDs, [neopixel indx], by default), else COUNT= beeps when an M300 macro exists, else a 0.3 s part fan blip (no part cooling fan: the console and display message only)
variable_led: "indx"        # the [neopixel <name>] or [led <name>] to flash; "" for none
gcode:
    {% set me = printer["gcode_macro _INDX_TAP_ACK"] %}
    {% set c = params.COUNT|default(1)|int %}
    {% set msg = params.MSG|default("%d taps" % c) %}
    {% set led = me.led|string %}
    {% set key = ("neopixel " ~ led) if ("neopixel " ~ led) in printer else (("led " ~ led) if ("led " ~ led) in printer else "") %}
    RESPOND MSG="INDX ok {msg}"
    _INDX_LCD LEVEL=action MSG="{msg}"
    {% if led and key %}
        # one white flash per tap, then the color it had (as Klipper last set it)
        {% set cd = printer[key].color_data[0] %}
        {% for i in range(c) %}
        SET_LED LED={led} RED=1 GREEN=1 BLUE=1 WHITE=0
        G4 P200
        SET_LED LED={led} RED={cd[0]} GREEN={cd[1]} BLUE={cd[2]} WHITE={cd[3]|default(0)}
        G4 P150
        {% endfor %}
    {% elif "gcode_macro M300" in printer %}
        {% for i in range(c) %}
        M300 S2000 P60
        G4 P90
        {% endfor %}
    {% elif ("fan" in printer or ("fan_generic " ~ printer["gcode_macro _INDX_MACHINE"].part_fan|default("")) in printer) and not ("gcode_macro _INDX_MACHINE" in printer and printer["gcode_macro _INDX_MACHINE"].part_cooling == "none") %}
        # kept short, it cools the nozzle
        _INDX_PART_FAN S=255
        G4 P300
        _INDX_PART_FAN S=0
    {% endif %}
