#####################################################################
#  INDX Suite: latch homing and the sensed lock (tmc_sg_log)
#
#  Macros that only run with the INDX Suite's tmc_sg_log module (with
#  indx_pickup_pos, which it loads): the sensed lock with frozen filament
#  detection, the close after the peel, the misload check, the pickup
#  position check, latch homing and lock force calibration, the tip gap and
#  the MCU latch stop. Linked by install.sh (the INDX Suite) only and
#  included by indx_includes.cfg's [include indx_suite*.cfg]; an INDX Macros
#  install does not have them, and the core macros skip every call to them
#  there (they check for the module or the macro). [EL-UI-013]
#####################################################################

[gcode_macro _INDX_PICKUP_POS_CHECK]
description: Inner - the pickup position check (lost X/Y steps): this pickup's clamp onset against its dock's history (indx_pickup_pos.py); a seated pickup with no onset reading is not judged
# SEQ0: onset_seq before this pickup; exactly one sensed lock since makes the
# reading this pickup's. OFFSET: an INDX_CAL_DOCK_Y_FINE grab (slope only).
# Not judged: a failed seat check, a misload suspect [EL-TC-009]
gcode:
    {% set t = params.TOOL|int %}
    {% set r = printer.tmc_sg_log|default({}) %}
    {% set mis = ("gcode_macro _INDX_MISLOAD_CHECK" in printer and printer["gcode_macro _INDX_MISLOAD_CHECK"].suspect|default(-1)|int == t) %}
    {% if "indx_pickup_pos" in printer and printer["gcode_macro _INDX_SEAT_CHECK"].ok|int and not mis and r.onset_seq|default(0)|int == params.SEQ0|default(-1)|int + 1 and r.onset_mm is number %}
        INDX_PICKUP_POS TOOL={t} MM={"%.3f"|format(r.onset_mm|float)}{(" OFFSET=" ~ params.OFFSET) if params.OFFSET is defined else ""}
        _INDX_PICKUP_POS_ACT TOOL={t} TARGET={params.TARGET|default(0)} SKIP_Z_CORRECTION={params.SKIP_Z_CORRECTION|default(0)}
    {% endif %}

[gcode_macro _INDX_PICKUP_POS_ACT]
description: Inner - the pickup position check said stop: heater off, T<n> stays on the head (seated, at the clearance line). In a print's tool change: the print pauses there and RESUME refuses until X and Y were homed again, then parks T<n> and redoes the change. Anywhere else (G28, the print start prime, no print): stop before anything moves
# Runs at the clearance line, tool seated: the hold needs no move. Held like a
# failed pickup, plus rehome "xy": RESUME refuses until G28 X and Y clear it;
# the redo parks T<n> and runs the change again.
gcode:
    {% set t = params.TOOL|int %}
    {% set r = printer.indx_pickup_pos.last %}
    {% if r.verdict|default("") == "stop" and r.tool|default(-1)|int == t %}
        {% set y = (", about %.2f mm in Y" % r.y_est|float) if r.y_est is number else "" %}
        {% set slip = printer.indx_pickup_pos.slip_mm %}
        {% set slip_s = (" (one motor slip moves the head %.2f mm in X and Y)" % slip|float) if slip is number else "" %}
        {% set drv = (" XY drivers report: %s." % r.xy_drv) if r.xy_drv|default("")|string else "" %}
        {% set tv = printer["gcode_macro _TOOLCHANGE_VARS"] %}
        {% set pg = printer["gcode_macro PRIME_GRID"] if "gcode_macro PRIME_GRID" in printer else {} %}
        {% set printing = printer.print_stats.state == "printing" and not tv.homing_busy|default(0)|int and not pg.active|default(0)|int %}
        {% set ph = printer["gcode_macro _INDX_PICKUP_POS_HOLD"] %}
        {% if printing and tv.change_busy|int and not ph.repicked|int %}
        # In a print's tool change, first park and pick up again: a second
        # pickup off holds below, a normal one prints on (_INDX_PICKUP_POS_REPICK)
        # [EL-TC-077]
        SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=repick VALUE=1
        SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=first_dev VALUE={r.dev|float}
        RESPOND MSG="{'INDX > T%d pickup: the clamp started at %.2f mm of latch travel, %+.2f mm from where the last %d pickups from this dock started it (limit %.2f mm): parking T%d and picking it up again to tell the head from the latch' % (t, r.mm|float, r.dev|float, r.n|int, r.limit|float, t)}"
        {% else %}
        M104 S0
        _INDX_LCD LEVEL=action MSG="T{t}: XY lost steps? Home X/Y"
        _INDX_NOTE LEVEL=stop TITLE="T{t}: head position off" MSG="The clamp started {'%+.2f'|format(r.dev|float)} mm off this dock's last pickups: X or Y may have lost steps. Home X and Y before anything moves."
        {% if printing %}
            {% set pf = printer["gcode_macro _PICKUP_SEAT_FAIL"] %}
            {% set cmd = pf.outer_cmd if pf.outer_cmd|length else "_INDX_CHANGE_TOOL TOOL=%d TEMP=%s SKIP_Z_CORRECTION=%d" % (t, params.TARGET|default(0), params.SKIP_Z_CORRECTION|default(0)|int) %}
            SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=rehome VALUE='"xy"'
            SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=tool VALUE={t}
            SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=cmd VALUE='"{cmd}"'
            SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=resume_cmd VALUE='"_INDX_PICKUP_POS_REDO"'
            SET_GCODE_VARIABLE MACRO=_PICKUP_SEAT_FAIL VARIABLE=held VALUE=1
            RESPOND TYPE=error MSG="{'INDX: T%d pickup: the clamp started at %.2f mm of latch travel, %+.2f mm from where the last %d good pickups from this dock started it (%.2f mm; limit %.2f mm, 5.2 sigma of their spread%s). The head is probably not where INDX thinks it is: X or Y lost steps%s, from a blocked or bumped head or a slipping belt or pulley. The next dock move could crash. Print paused with the heater off; T%d is seated on the head at the clearance line. Look at the head and the belts, then home X and Y (G28 X Y), then RESUME: T%d is parked and the tool change runs again. RESUME refuses until X and Y are homed.%s' % (t, r.mm|float, r.dev|float, r.n|int, r.mean|float, r.limit|float, y, slip_s, t, t, drv)}"
            {% set pm = printer.configfile.settings["gcode_macro pause"] %}
            {pm.rename_existing if pm is defined and pm.rename_existing is defined else "PAUSE"}
            _INDX_PAUSE_STATES
            {% if "indx_api" in printer %}_INDX_EVENT EVENT=stop CHECK=pickup_pos PAUSE=1 REASON="T{t}: X or Y may have lost steps"{% endif %}
            # Keep the motors on through the hold (_PICKUP_RESUME puts the
            # timeout back): motors off would lose the homing for good
            SET_IDLE_TIMEOUT TIMEOUT=43200
        {% else %}
            _INDX_RAISE MSG="{'INDX: T%d pickup: the clamp started at %.2f mm of latch travel, %+.2f mm from where the last %d good pickups from this dock started it (%.2f mm; limit %.2f mm, 5.2 sigma of their spread%s). The head is probably not where INDX thinks it is: X or Y lost steps%s, from a blocked or bumped head or a slipping belt or pulley. The next dock move could crash. Stopped with the heater off; T%d is seated on the head out of its dock. Look at the head and the belts, then home X and Y (G28 homes them before it goes near a dock). If T%d or its dock was changed on purpose, measure the dock again (INDX_CAL_DOCK TOOL=%d) and the lock (INDX_CAL_LOCK): this dock then starts a new history.%s' % (t, r.mm|float, r.dev|float, r.n|int, r.mean|float, r.limit|float, y, slip_s, t, t, t, drv)}"
        {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_PICKUP_POS_REDO]
description: Inner - RESUME after a pickup position hold (X and Y homed again): park the tool the hold kept on the head, then the tool change again from the start
gcode:
    {% set h = printer["gcode_macro _INDX_PICKUP_POS_HOLD"] %}
    SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_INDX_PICKUP_POS_HOLD VARIABLE=cmd VALUE='""'
    {% if printer.save_variables.variables.active_tool|default(-1)|int >= 0 %}
        PARK_TOOL
    {% endif %}
    {h.cmd}

[gcode_macro _INDX_LOCK_FORCE]
description: Inner - the sensed part of a force lock: lock until the clamp, counted from the empty head before this pickup, reaches latch_lock_force_g
# The target counts from the empty head, but SG_HOME_E counts from where it
# starts: the force already built is taken off [EL-TC-041]. Its own macro, so
# it renders after the fast move. A calibrated tool locks to t<n>_lock_g;
# while INDX_CAL_LOCK runs (cal_left > 0) every lock runs to the travel limit.
variable_built_g: 0.0
variable_cal_left: 0
# log: a file path (one lock) for SG_HOME_E LOG_FILE= (development: the force
# curve at 500 Hz against latch travel); cleared after use
variable_log: ""
# push_g, push_at: the largest force against the clamp before the trigger
# (SG_HOME_E push_max_g / push_at_mm), for the misload check
variable_push_g: 0.0
variable_push_at: -1.0
# start_mm: where the latch is when this lock (or the close after the peel's clamp sense)
# starts, from the opening stop: START=, else the end of the fast travel
variable_start_mm: 6.5
# speed_live: force lock speed (mm/s) when the MCU latch stop runs LIVE on
# this move (it stops within one sample); the host stop keeps 5 mm/s [EL-DOC-222]
variable_speed_live: 7.5
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set start = params.START|default(c.latch_fast_from_stop)|float %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=start_mm VALUE={start}
    # None: the tool in that dock has no lock data of its own (Tool identities, indx_setup.cfg)
    {% set tl = printer.save_variables.variables["t%d_lock_g" % params.TOOL|default(-1)|int]|default(none) %}
    {% set target = (tl if tl is not none else c.latch_lock_force_g|default(1390))|float %}
    {% set cal = printer["gcode_macro _INDX_LOCK_FORCE"].cal_left|int %}
    {% if cal %}
        {% set target = 99999.0 %}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=cal_left VALUE={cal - 1}
    {% endif %}
    # Calibrations read with the latch fully closed (no rise stop), only for a
    # tool with no filament, so a leftover count never reaches a loaded one
    {% set lp = printer["gcode_macro _INDX_LOCK_PAST"] %}
    # LOADED=1: a tool recorded empty that the close after the peel treats as
    # loaded (a misload suspect, _INDX_CLOSE_RUN): never a full close
    {% set full = lp.full_left|int > 0 and not printer.save_variables.variables["t%d_material" % params.TOOL|default(-1)|int]|default("")|string and not params.LOADED|default(0)|int %}
    {% if lp.full_left|int > 0 %}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=full_left VALUE={lp.full_left|int - 1}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=full_now VALUE={1 if full else 0}
    # A tool with filament (or none given): the MCU latch stop stays SHADOW;
    # its R comes from empty tools and LIVE could stop a frozen lock short [EL-TC-042],
    # unless INDX_LC_MCU LOADED= lists this tool (its SHADOW series passed) [EL-DOC-221]
    {% set ll = printer.save_variables.variables.lc_mcu_live_loaded|default("")|string|replace(" ", "") %}
    {% set ok_live = params.TOOL is defined and (ll == "all" or (params.TOOL|int|string) in ll.split(",")) %}
    {% set loaded = 1 if params.TOOL is not defined or ((params.LOADED|default(0)|int or printer.save_variables.variables["t%d_material" % params.TOOL|int]|default("")|string) and not ok_live) else 0 %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=loaded VALUE={loaded}
    # the faster speeds only where the move is meant to run LIVE
    {% set live = printer.save_variables.variables.lc_mcu_mode|default("off")|string == "live" and printer.tmc_sg_log.lc_mcu_live_allowed|default(0)|int and not loaded %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=live VALUE={1 if live else 0}
    {% set s = printer["gcode_macro _INDX_LC_STORE"] %}
    {% set lc = printer.load_cell_probe|default({}) %}
    {% set ns = namespace(built=0.0) %}
    {% if s.empty_valid|int and lc.counts_per_gram|default(0)|float > 0 and lc.force_g is defined and lc.force_g is not none %}
        {% set cfgl = printer.configfile.settings.load_cell_probe %}
        {% set ref = cfgl.reference_tare_counts %}
        {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
        {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
        {% set g = lc.force_g|float + inv * (lc.tare_counts|float - ref|float) / lc.counts_per_gram|float %}
        {% set ns.built = ((g - s.empty_g|float) * c.seat_sign|default(-1)|float) %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=built_g VALUE={ns.built|round(1)}
    {% set log = printer["gcode_macro _INDX_LOCK_FORCE"].log|default("")|string %}
    {% set d2 = lp.target_mm|float - c.latch_lock_max_from_stop|float %}
    # One move each for the force lock and the lock past, in both modes: a
    # combined move runs past the release before the misload check [EL-TC-043]
    # LC_SIGN: only the clamp direction triggers; the push the other way is
    # measured (misload) [EL-TC-009]. LC_MCU=AUTO: as INDX_LC_MCU set it [EL-TC-042].
    # ONSET=1: also where the clamp started (_INDX_PICKUP_POS_CHECK)
    {% set onset = (" ONSET_G=%.0f ONSET_FROM=%.3f" % (printer.indx_pickup_pos.onset_g|float, start)) if (params.ONSET|default(0)|int and "indx_pickup_pos" in printer) else "" %}
    SG_HOME_E DIST={"%.3f"|format([c.latch_lock_max_from_stop - start, 0.05]|max)} SPEED={"%.2f"|format(printer["gcode_macro _INDX_LOCK_FORCE"].speed_live|float if live else 5.0)} CURRENT={c.run_current} STEALTH=0 THRESH=0 LC_DELTA={"%.0f"|format([target - ns.built, 100.0]|max)} LC_SIGN={c.seat_sign|default(-1)|int}{(" LOG_FILE=" ~ log) if log else ""} LC_MCU=AUTO LC_MCU_R=400 LC_MCU_NO_LIVE={loaded} LC_MCU_TAG=lock{onset}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=log VALUE='""'
    _INDX_LOCK_BACK

# Why it is optional and how it is rolled out: [EL-LC-007]
[gcode_macro INDX_LC_MCU]
description: Optional: the MCU latch stop on the load cell for the sensed latch moves of a pickup (force lock, lock past). MODE=off (default: the host stops the latch), shadow (the load cell's MCU trigger is armed and records where it would stop; the host rule still stops the latch) or live (the MCU stops the latch; needs lc_mcu_ready and lc_mcu_live: True in [tmc_sg_log]). LOADED=1,2,3 (or all): live also for those tools with filament, once their shadow runs have passed; LOADED=0: tools with filament stay shadow (default). Without MODE or LOADED: show the state. Moves: nothing
# Saved as lc_mcu_mode, read by SG_HOME_E LC_MCU=AUTO. The G28 push check stays
# on the host path [EL-TC-044]. Live falls back to shadow when it cannot arm.
# README, MCU Latch Stop, before using shadow or live; the design: [EL-LC-007].
gcode:
    {% set sg = printer.tmc_sg_log %}
    {% set cur = printer.save_variables.variables.lc_mcu_mode|default("off")|string %}
    {% set ll = printer.save_variables.variables.lc_mcu_live_loaded|default("")|string %}
    {% if params.LOADED is defined %}
        # loaded tools are shadow-only until their SHADOW series passes [EL-DOC-221]
        {% set v = params.LOADED|string|lower|replace(" ", "") %}
        {% set v = "" if v in ["0", "off", "none"] else v %}
        SAVE_VARIABLE VARIABLE=lc_mcu_live_loaded VALUE='"{v}"'
        RESPOND MSG="INDX > MCU latch stop: live for tools with filament: {('T' ~ v.split(',')|join(', T')) if v and v != 'all' else (v or 'none, they run shadow')}"
    {% endif %}
    {% if params.MODE is not defined and params.LOADED is not defined %}
        RESPOND MSG="INDX > MCU latch stop: mode {cur}, live for tools with filament: {ll or 'none'}; shadow possible {sg.lc_mcu_shadow_ok|default(0)}, live possible {sg.lc_mcu_ready|default(0)}, live enabled {sg.lc_mcu_live_allowed|default(0)}: {sg.lc_mcu_why|default('not available')}"
    {% elif params.MODE is defined %}
        {% set m = params.MODE|string|lower %}
        {% if m not in ["off", "shadow", "live"] %}
            {action_raise_error("INDX_LC_MCU: MODE must be off, shadow or live")}
        {% endif %}
        {% if m == "live" and not sg.lc_mcu_ready|default(0)|int %}
            {action_raise_error("INDX_LC_MCU: live refused, the mode stays " ~ cur ~ ": " ~ (sg.lc_mcu_why|default("not available")))}
        {% endif %}
        {% if m == "live" and not sg.lc_mcu_live_allowed|default(0)|int %}
            {action_raise_error("INDX_LC_MCU: live refused, the mode stays " ~ cur ~ ": set lc_mcu_live: True in [tmc_sg_log] (printer.cfg) once shadow runs have passed, then restart")}
        {% endif %}
        {% if m == "shadow" and not sg.lc_mcu_shadow_ok|default(0)|int %}
            RESPOND TYPE=error MSG="INDX > MCU latch stop: shadow set, but it cannot arm on this machine ({sg.lc_mcu_why|default('not available')}): moves record why and the host stops the latch"
        {% endif %}
        SAVE_VARIABLE VARIABLE=lc_mcu_mode VALUE='"{m}"'
        RESPOND MSG="INDX > MCU latch stop: mode {m} (was {cur})"
    {% endif %}

[gcode_macro _INDX_CLAMP_SENSE]
description: Inner - close after the peel, in the dock: from the end of the fast travel, sense until the clamp has clearly started (close_clamp_start_g over the empty head), at most to the lock limit
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set s = printer["gcode_macro _INDX_LC_STORE"] %}
    {% set lc = printer.load_cell_probe|default({}) %}
    {% set ns = namespace(built=0.0) %}
    {% if s.empty_valid|int and lc.counts_per_gram|default(0)|float > 0 and lc.force_g is defined and lc.force_g is not none %}
        {% set cfgl = printer.configfile.settings.load_cell_probe %}
        {% set ref = cfgl.reference_tare_counts %}
        {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
        {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
        {% set g = lc.force_g|float + inv * (lc.tare_counts|float - ref|float) / lc.counts_per_gram|float %}
        {% set ns.built = ((g - s.empty_g|float) * c.seat_sign|default(-1)|float) %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=built_g VALUE={ns.built|round(1)}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=start_mm VALUE={c.latch_fast_from_stop|float}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_BACK VARIABLE=backed_mm VALUE=0.0
    # LC_SIGN: the clamp direction triggers it, a push the other way before
    # it is measured (misload) [EL-TC-009]
    # ONSET=1: also where the clamp started (_INDX_PICKUP_POS_CHECK)
    {% set onset = (" ONSET_G=%.0f ONSET_FROM=%.3f" % (printer.indx_pickup_pos.onset_g|float, c.latch_fast_from_stop|float)) if (params.ONSET|default(0)|int and "indx_pickup_pos" in printer) else "" %}
    SG_HOME_E DIST={"%.3f"|format(c.latch_lock_max_from_stop|float - c.latch_fast_from_stop|float)} SPEED=5 CURRENT={c.run_current} STEALTH=0 THRESH=0 LC_DELTA={"%.0f"|format([c.close_clamp_start_g|default(175)|float - [ns.built, 0.0]|max, 50.0]|max)} LC_SIGN={c.seat_sign|default(-1)|int}{onset}
    _INDX_CLAMP_SENSE_DONE

[gcode_macro _INDX_CLAMP_SENSE_DONE]
description: Inner - close after the peel: keep the push before the clamp for the misload check (renders after the sense)
gcode:
    {% set r = printer.tmc_sg_log %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=push_g VALUE={r.push_max_g|default(0, true)|float}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=push_at VALUE={r.push_at_mm|default(-1, true)|float}

[gcode_macro _INDX_CLAMP_MIN]
description: Inner - close after the peel, in the dock: no clamp by the lock limit stops there; a clamp sensed short of close_min_from_stop goes on to it
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set r = printer.tmc_sg_log %}
    {% set t = params.TOOL|int %}
    {% set pos = c.latch_fast_from_stop|float + r.moved_mm|default(0)|float %}
    # An empty tool closes further (no plug) [EL-TC-012]. A misload suspect
    # counts as loaded: going on would feed its filament further in.
    {% set empty_t = not printer.save_variables.variables["t%d_material" % t]|default("")|string and printer["gcode_macro _INDX_MISLOAD_CHECK"].suspect|int != t %}
    {% set lo = (c.close_min_empty_from_stop|default(10.0) if empty_t else c.close_min_from_stop|default(9.0))|float %}
    {% if not r.triggered|int %}
        # No clamp by the lock limit: a peel could drag a caught tool out and
        # the latch may be past the release. Stop, nothing moves.
        SET_GCODE_VARIABLE MACRO=_INDX_CLOSE VARIABLE=pos VALUE={pos}
        _INDX_LCD LEVEL=action MSG="T{t}: no clamp in the dock"
        _INDX_RAISE MSG="T{t}: the latch reached {'%.2f'|format(pos)} mm from its stop in the dock without the clamp starting ({c.close_clamp_start_g|default(175)|int} g): T{t} is not in its dock or not engaged. Stopped in the dock, the head is recorded empty and the latch closed. Look at the T{t} dock and the latch before anything moves: if the head is empty, INDX_RELEASE_TOOL_BY_HAND opens the latch."
    {% else %}
        {% set at = c.latch_fast_from_stop|float + r.trigger_mm|default(0, true)|float %}
        {% if pos < lo %}
            _TC_LATCH_MOVE E={"%.3f"|format(lo - pos)} F={c.latch_feedrate} I={c.run_current}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_INDX_CLOSE VARIABLE=pos VALUE={[pos, lo]|max}
        RESPOND MSG="INDX > T{t}: clamp from {'%.2f'|format(at)} mm, latch at {'%.2f'|format([pos, lo]|max)} mm for the peel"
    {% endif %}

[gcode_macro _INDX_CLAMP_MARK]
description: Inner - close after the peel: the latch sits in mesh short of the release until the close: no retraction until the close (or forward motion) has passed it
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set cpos = printer["gcode_macro _INDX_CLOSE"].pos|float %}
    _INDX_LOCK_MARK CLEAR={"%.3f"|format([c.latch_release_from_stop|float + 0.2 - cpos, 0.0]|max)} POS={"%.3f"|format(cpos)} FORCE=-1

[gcode_macro _INDX_PEEL_HOLD_CHECK]
description: Inner - close after the peel, out of the dock and standing still: the tool must hold close_hold_frac of its spring force against the empty head, else stop (heater off, tool kept as on the head)
# A tool held too weakly can come out of the dock partly seated or hanging.
# Measured with the latch where it clamped in the dock. [EL-TC-012]
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set t = params.TOOL|int %}
    {% set svv = printer.save_variables.variables %}
    {% set s = printer["gcode_macro _INDX_LC_STORE"] %}
    {% set lc = printer.load_cell_probe|default({}) %}
    {% set cpos = printer["gcode_macro _INDX_CLOSE"].pos|float %}
    {% set sref = svv["t%d_seat_g" % t]|default(none) %}
    {% set ref = sref|float|abs if sref is not none else printer["gcode_macro TOOL_POSITIONS"].seat_ref_min_g|default(1185.0)|float %}
    {% set need = c.close_hold_frac|default(0.50)|float * ref %}
    {% if not (s.empty_valid|int and lc.counts_per_gram|default(0)|float > 0 and lc.force_g is defined and lc.force_g is not none) %}
        M104 S0
        _INDX_LCD LEVEL=action MSG="T{t}: no load cell reading"
        _INDX_RAISE MSG="T{t}: no load cell reading after the peel, so the hold cannot be checked. Stopped out of the dock with the heater off; T{t} is kept as on the head, latch at {'%.2f'|format(cpos)} mm (in mesh, not locked). Look at T{t} before anything moves."
    {% else %}
        {% set cfgl = printer.configfile.settings.load_cell_probe %}
        {% set rt = cfgl.reference_tare_counts %}
        {% if rt is not number %}{% set rt = rt|sum %}{% endif %}
        {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
        {% set g = lc.force_g|float + inv * (lc.tare_counts|float - rt|float) / lc.counts_per_gram|float %}
        {% set held = (g - s.empty_g|float) * c.seat_sign|default(-1)|float %}
        SET_GCODE_VARIABLE MACRO=_INDX_CLOSE VARIABLE=hold_g VALUE={held|round(1)}
        {% if held < need %}
            M104 S0
            _INDX_LCD LEVEL=action MSG="T{t}: weak hold after the peel"
            _INDX_RAISE MSG="T{t}: after the peel the load cell reads {held|round(0)|int} g against the empty head, under {(c.close_hold_frac|default(0.50)|float * 100)|round(0)|int} % of its spring force ({ref|round(0)|int} g{'' if sref is not none else ', not calibrated: seat_ref_min_g'}). The dock may have pulled it partly out, or it hangs loose. Stopped out of the dock with the heater off; T{t} is kept as on the head, latch at {'%.2f'|format(cpos)} mm (in mesh, not locked). Look at T{t} before anything moves."
        {% else %}
            RESPOND MSG="INDX > T{t}: holds {held|round(0)|int} g after the peel ({(held / ref * 100)|round(0)|int} % of its spring force {ref|round(0)|int} g{'' if sref is not none else ', not calibrated'})"
        {% endif %}
    {% endif %}

[gcode_macro _INDX_CLOSE_RUN]
description: Inner - close after the peel, out of the dock: close the latch. Empty tool: past the release, the clamp peak read on the way. Tool with filament, or a misload suspect: the sensed lock and the lock past
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set t = params.TOOL|int %}
    {% set svv = printer.save_variables.variables %}
    {% set lp = printer["gcode_macro _INDX_LOCK_PAST"] %}
    {% set cpos = printer["gcode_macro _INDX_CLOSE"].pos|float %}
    # A misload suspect takes the loaded path: the empty close has no rise
    # stop and would feed its filament blind [EL-TC-009]
    {% set suspect = printer["gcode_macro _INDX_MISLOAD_CHECK"].suspect|int == t %}
    {% set loaded = svv["t%d_material" % t]|default("")|string|length > 0 or suspect %}
    _TC_SET_ROTATION_DIST
    G90
    {% if not loaded %}
        # No filament: no plug to push into, so no rise stop; the peak is
        # the check (LC_DELTA out of reach, LC_SIGN for the peak)
        SG_HOME_E DIST={"%.3f"|format([lp.target_mm|float - cpos, 0.05]|max)} SPEED={lp.speed} CURRENT={c.run_current} STEALTH=0 THRESH=0 LC_DELTA=99999 LC_SIGN={c.seat_sign|default(-1)|int}
        _TC_RESTORE_ROTATION_DIST
        _INDX_CLOSE_DONE TOOL={t}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_BACK VARIABLE=backed_mm VALUE=0.0
        _INDX_LOCK_FORCE TOOL={t} START={"%.3f"|format(cpos)}{" LOADED=1" if suspect else ""}
        _INDX_LOCK_PAST
        _TC_RESTORE_ROTATION_DIST
        _INDX_LATCH_LOCKED TOOL={t}
    {% endif %}

[gcode_macro _INDX_CLOSE_DONE]
description: Inner - close after the peel: an empty tool closed out of the dock: the peak against its calibrated one, the lock mark (past the release, retractions allowed)
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set t = params.TOOL|int %}
    {% set r = printer.tmc_sg_log %}
    {% set cl = printer["gcode_macro _INDX_CLOSE"] %}
    {% set s = printer["gcode_macro _INDX_LC_STORE"] %}
    {% set sgn = c.seat_sign|default(-1)|float %}
    {% set end = cl.pos|float + r.moved_mm|default(0)|float %}
    {% set lc = printer.load_cell_probe|default({}) %}
    {% set cfgl = printer.configfile.settings.load_cell_probe|default({}) %}
    {% set ns = namespace(peak=none) %}
    {% if r.start_force_g is defined and r.start_force_g is not none and r.peak_g is defined and r.peak_g is not none and s.empty_valid|int and lc.counts_per_gram|default(0)|float > 0 and cfgl.reference_tare_counts is defined %}
        {% set rt = cfgl.reference_tare_counts %}
        {% if rt is not number %}{% set rt = rt|sum %}{% endif %}
        {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
        # the start force against the empty head, plus the rise from it
        {% set start = (r.start_force_g|float + inv * (lc.tare_counts|float - rt|float) / lc.counts_per_gram|float - s.empty_g|float) * sgn %}
        {% set ns.peak = start + r.peak_g|float %}
    {% endif %}
    {% set cal = printer.save_variables.variables["t%d_close_peak_g" % t]|default(none) %}
    {% set need = c.close_peak_frac|default(0.75)|float * cal|float if cal is not none else none %}
    {% if ns.peak is none %}
        {% set force = 0 %}
        RESPOND TYPE=error MSG="INDX ! T{t}: no clamp peak read while closing: the seat check fails this pickup"
    {% elif cl.cal_now|int or need is none %}
        {% set force = -1 %}
        RESPOND MSG="INDX > T{t}: closed to {'%.2f'|format(end)} mm out of the dock, clamp peak {ns.peak|round(0)|int} g{' (measuring)' if cl.cal_now|int else '; not calibrated, the seat check goes by the weight only (INDX_CAL_LOCK)'}"
    {% else %}
        {% set force = 1 if ns.peak >= need else 0 %}
        RESPOND MSG="INDX > T{t}: closed to {'%.2f'|format(end)} mm out of the dock, clamp peak {ns.peak|round(0)|int} g ({(ns.peak / cal|float * 100)|round(0)|int} % of its calibrated {cal|float|round(0)|int} g, passes from {(c.close_peak_frac|default(0.75)|float * 100)|round(0)|int} %)"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_INDX_CLOSE VARIABLE=peak_g VALUE={ns.peak|round(1) if ns.peak is not none else 0.0}
    SET_GCODE_VARIABLE MACRO=_INDX_CLOSE VARIABLE=fail VALUE={1 if force == 0 else 0}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=frozen VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=end VALUE={end}
    # Past the release: retractions are allowed at once, and the gear is out
    # of mesh (the park opens fully and homes the latch, as after a lock past)
    _INDX_LOCK_MARK CLEARED=1 CLEAR=0 POS=-1.0 FORCE={force} FORCE_G={(sgn * ns.peak)|round(1) if ns.peak is not none else 0.0}

[gcode_macro _INDX_MISLOAD_CHECK]
description: Inner - after the force lock, still in mesh in the dock: a push against the clamp before it started means filament in the gears of the docked tool (misload): open the latch, leave the tool in its dock and stop. With the close after the peel: information only, recorded as a misload suspect
# Filament pushed into a docked tool's gears pushes against the clamp and the
# lock misses its target. Checked before the lock past, while the latch can
# still be opened. Only on LOAD_FILAMENT's pickup (armed): a misload happens
# while loading. With the close after the peel it never stops: suspect is
# recorded, the tool closes as a loaded one and a failed seat check asks
# (_INDX_MISLOAD_ASK). [EL-TC-009]
variable_armed: -1
variable_suspect: -1
variable_suspect_g: 0.0
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set lf = printer["gcode_macro _INDX_LOCK_FORCE"] %}
    {% set t = params.TOOL|int %}
    {% set armed = printer["gcode_macro _INDX_MISLOAD_CHECK"].armed|int == t %}
    SET_GCODE_VARIABLE MACRO=_INDX_MISLOAD_CHECK VARIABLE=armed VALUE=-1
    # The push alone overlaps with empty tools; a real misload also keeps the
    # lock from its target. Both together stop [EL-TC-009]
    {% set r = printer.tmc_sg_log %}
    # Close after the peel: the sensed move in the dock stops at the
    # clamp start, not at a lock target: information only, no stop
    {% set cap = printer["gcode_macro _INDX_CLOSE"].active|int %}
    {% set reached = r.triggered|default(0)|int == 1 and not cap %}
    {% if armed and lf.push_g|float > c.misload_push_g|default(87)|float and cap %}
        SET_GCODE_VARIABLE MACRO=_INDX_MISLOAD_CHECK VARIABLE=suspect VALUE={t}
        SET_GCODE_VARIABLE MACRO=_INDX_MISLOAD_CHECK VARIABLE=suspect_g VALUE={lf.push_g|float|round(1)}
        RESPOND MSG="INDX > T{t}: {lf.push_g|float|round(0)|int} g push against the latch before the clamp (a misload pushes more than {c.misload_push_g|default(87)|float|round(0)|int} g): information only with the close after the peel, the pickup goes on and T{t} closes as a loaded tool (sensed lock, frozen detection). If it does not seat, the stop asks whether you were loading filament."
    {% endif %}
    {% if armed and lf.push_g|float > c.misload_push_g|default(87)|float and reached %}
        RESPOND MSG="INDX > T{t}: {lf.push_g|float|round(0)|int} g push against the latch before the clamp, but the lock reached its target: not a misload"
    {% endif %}
    {% if armed and lf.push_g|float > c.misload_push_g|default(87)|float and not reached and not cap %}
        {% set pos = lf.start_mm|float + r.moved_mm|default(0)|float - printer["gcode_macro _INDX_LOCK_BACK"].backed_mm|float %}
        _TC_LATCH_MOVE E={"%.3f"|format(c.latch_open_from_stop|float - pos)} F={c.latch_feedrate} I={c.run_current}
        _TC_RESTORE_ROTATION_DIST
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=1
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=2
        SAVE_VARIABLE VARIABLE=toolhead_state VALUE=2
        _LINEAR_EXIT
        M104 S0
        _INDX_LCD LEVEL=action MSG="T{t}: filament misloaded"
        RESPOND TYPE=error MSG="T{t}: filament seems pushed into its gears while it sat in the dock: it pushed {lf.push_g|float|round(0)|int} g against the latch at {'%.1f'|format(lf.start_mm|float + lf.push_at|float)} mm, before the clamp. T{t} was left in its dock and the head is empty. Pull the filament back out of T{t}, pick T{t} up, then push the filament in with the tool on the head (or load it from the INDX page)."
        _INDX_RAISE MSG="T{t}: filament misload, see above"
    {% endif %}

[gcode_macro _INDX_LOCK_BACK]
description: Inner - after a force lock that the load cell stopped: back the latch off to where the clamp really crossed the target
# The load cell status lags, so the latch overshoots the crossing. SG_HOME_E
# finds the real crossing from timestamped samples (past_crossing_mm); the
# latch goes back by that much. A stop at the travel limit is left. [EL-TC-045]
variable_backed_mm: 0.0
variable_before_g: 0.0
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set r = printer.tmc_sg_log %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=push_g VALUE={r.push_max_g|default(0, true)|float}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=push_at VALUE={r.push_at_mm|default(-1, true)|float}
    {% set past = r.past_crossing_mm if r.past_crossing_mm is defined and r.past_crossing_mm is not none else 0.0 %}
    {% set lc = printer.load_cell_probe|default({}) %}
    {% if r.triggered|int and (r.why|default("") or "").startswith("load cell") and past > 0.03 and past <= 0.8 %}
        # Back off at 10 mm/s, then stand until the overshoot force is out of
        # the load cell's 0.5 s averaging window (the lock past starts from it) [EL-TC-045]
        _TC_LATCH_MOVE E={"%.3f"|format(-past)} F=600 I={c.run_current}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_BACK VARIABLE=backed_mm VALUE={past}
        G4 P450
        M400
        _INDX_LOCK_BACK_REPORT
    {% else %}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_BACK VARIABLE=backed_mm VALUE=0.0
    {% endif %}

[gcode_macro _INDX_LOCK_BACK_BEFORE]
description: Inner - store the clamp before the lock back-off
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_BACK VARIABLE=before_g VALUE={printer.load_cell_probe.force_g|default(0)|float}

[gcode_macro _INDX_LOCK_BACK_REPORT]
description: Inner - log the clamp change of the lock back-off
gcode:
    {% set b = printer["gcode_macro _INDX_LOCK_BACK"] %}
    {% set r = printer.tmc_sg_log %}
    {% set f = printer.load_cell_probe.force_g|default(0)|float %}
    RESPOND MSG="INDX > lock: crossing at {'%.3f'|format(r.crossing_mm|float)} mm, stopped {'%.3f'|format(r.past_crossing_mm|float)} mm past it, backed off; load cell {'%.0f'|format(f)} g"

[gcode_macro _INDX_LOCK_PAST]
description: Inner - after the force lock: on slowly to the release + 0.2 mm, so retractions are legal at once; a steep force rise (the filament against its plug: frozen) stops it short
# Close past the zone where retractions are illegal whenever possible. The
# gears feed the filament as the latch goes on: a frozen plug shows as a steep
# rise and stops it (rise_g). Frozen is not a fault: the latch stays short, the
# retraction guard stays on, the first heated prime carries it past. [EL-TC-046]
# speed (mm/s) is slow so the load cell lag costs little travel into a plug.
variable_target_mm: 13.4
# rise_g: rise (g) that marks frozen, above empty tools' own clamp build-up
# by the 5.2 sigma margin rule [EL-TC-047]
variable_rise_g: 750
variable_speed: 2.0
# speed_live: the same when the MCU latch stop runs LIVE on it; live: set by
# _INDX_LOCK_FORCE for this pickup
variable_speed_live: 3.0
variable_live: 0
# results: latch position after the force lock and after this part, whether
# a rise stopped it, and the force lock's own result (kept for
# _INDX_LATCH_LOCKED: this part's SG_HOME_E overwrites printer.tmc_sg_log)
variable_pos: -1.0
variable_end: -1.0
variable_frozen: 0
variable_lock_triggered: 0
variable_lock_why: ""
# full_left: locks still to close fully (calibrations set it); full_now: this
# lock does (set by _INDX_LOCK_FORCE)
variable_full_left: 0
variable_full_now: 0
# loaded: the tool has filament recorded (set by _INDX_LOCK_FORCE): the MCU
# latch stop stays SHADOW on both sensed moves
variable_loaded: 1
# log: a file path (one run) for SG_HOME_E LOG_FILE= (development)
variable_log: ""
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set me = printer["gcode_macro _INDX_LOCK_PAST"] %}
    {% set r = printer.tmc_sg_log %}
    {% set pos = printer["gcode_macro _INDX_LOCK_FORCE"].start_mm|float + r.moved_mm|float - printer["gcode_macro _INDX_LOCK_BACK"].backed_mm|float %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=pos VALUE={pos}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=end VALUE={pos}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=frozen VALUE=0
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=lock_triggered VALUE={r.triggered|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=lock_why VALUE='"{r.why|default("") or ""}"'
    {% set dist = me.target_mm|float - pos %}
    {% if dist > 0.05 %}
        # Only a fall counts (the plug); the release shows as a rise [EL-TC-046].
        # LC_MCU R is above the largest release step; the MCU takes LC_DELTA as is.
        SG_HOME_E DIST={"%.3f"|format(dist)} SPEED={me.speed_live if me.live|int else me.speed} CURRENT={c.run_current} STEALTH=0 THRESH=0 LC_DELTA={99999 if me.full_now|int else me.rise_g} LC_SIGN=-1 IGNORE=0.05{(" LOG_FILE=" ~ me.log) if me.log else ""} LC_MCU=AUTO LC_MCU_R=850 LC_MCU_NO_LIVE={me.loaded|int} LC_MCU_TAG=past
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=log VALUE='""'
        _INDX_LOCK_PAST_DONE
    {% else %}RESPOND MSG="INDX > lock: already within 0.05 mm of past target ({'%.3f'|format(dist)} mm left), no second move"{% endif %}

[gcode_macro _INDX_LOCK_PAST_DONE]
description: Inner - where the latch ended after _INDX_LOCK_PAST, and whether a force rise (frozen filament) stopped it
gcode:
    {% set me = printer["gcode_macro _INDX_LOCK_PAST"] %}
    {% set sg = printer.tmc_sg_log %}
    {% set r = sg %}
    {% set frozen = 1 if r.triggered|int else 0 %}
    # Frozen: the lag puts the latch into the plug and the seat reads far off.
    # Back off to where the rise started, as the force lock does [EL-TC-046]
    {% set past = r.past_crossing_mm if r.past_crossing_mm is defined and r.past_crossing_mm is not none else 0.0 %}
    {% set back = past if frozen and past > 0.02 and past <= 0.8 else 0.0 %}
    {% if back > 0 %}
        {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
        _TC_LATCH_MOVE E={"%.3f"|format(-back)} F=120 I={c.run_current}
        M400
    {% endif %}
    {% set end = me.pos|float + r.moved_mm|float - back %}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=end VALUE={end}
    SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=frozen VALUE={frozen}
    {% if frozen %}
        RESPOND MSG="INDX > lock: the filament met its plug at {'%.2f'|format(end)} mm ({r.why}): frozen, the latch stays short of the release until the first heated prime"
    {% else %}
        RESPOND MSG="INDX > lock: on to {'%.2f'|format(end)} mm with no force rise: past the release, retractions allowed"
    {% endif %}

# What the tip gap readings are for: [EL-TC-078]
[gcode_macro INDX_TIP_GAP]
description: Measure where a tip shaped tool's tip sits: pushes TOOL=n's filament (on the head, cold or hot, latch past the release) slowly until the load cell feels it meet the plug, reports the gap in mm, then pulls the same distance back so the retraction is unchanged. For tuning the tip shaping (docs/tip-forming.md). Needs: the head in front of the dock clearance line. Moves: the extruder only. Saves: nothing
# rise_g, speed: as the G28 push check (_INDX_HOME_PUSH_CHECK)
variable_rise_g: 260
variable_speed: 2.0
variable_max_mm: 14.0
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set act = svv.active_tool|default(-1)|int %}
    {% set t = params.TOOL|default(act)|int %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set m = printer["gcode_macro _INDX_LOCK_MARK"] %}
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set me = printer["gcode_macro INDX_TIP_GAP"] %}
    {% if t != act or t < 0 %}
        {action_raise_error("INDX_TIP_GAP: T%d is not on the head. Nothing moved." % t)}
    {% elif not (svv["t%d_material" % t]|default("")|string or svv["t%d_fil_density" % t]|default(0)|float > 0) %}
        {action_raise_error("INDX_TIP_GAP: T%d has no filament recorded. Nothing moved." % t)}
    {% elif printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("INDX_TIP_GAP: not during a print. Nothing moved.")}
    {% elif m.short|int and not m.cleared|int %}
        {action_raise_error("INDX_TIP_GAP: T%d is short of the release (frozen): its lock already met the plug, there is no gap to measure. Nothing moved." % t)}
    {% elif tp.clearance_y is not number or (printer.toolhead.position.y|float - tp.clearance_y|float) * tp.dock_dir|float > 0.001 %}
        # Behind the clearance line the activation gear may mesh with a dock
        {action_raise_error("INDX_TIP_GAP: the head is behind the dock clearance line, where the extruder could move a latch. Move it out first. Nothing moved.")}
    {% endif %}
    {% set dist = [svv["t%d_retracted" % t]|default(0)|float + 2.0, me.max_mm|float]|min %}
    SG_HOME_E DIST={"%.3f"|format(dist)} SPEED={me.speed} CURRENT={c.run_current} STEALTH=0 THRESH=0 LC_DELTA={me.rise_g} LC_SIGN=-1 IGNORE=0.05
    _INDX_TIP_GAP_EVAL TOOL={t} DIST={"%.3f"|format(dist)}

[gcode_macro _INDX_TIP_GAP_EVAL]
description: Inner - INDX_TIP_GAP after the push (renders then): the gap, the pull back, the record
gcode:
    {% set t = params.TOOL|int %}
    {% set r = printer.tmc_sg_log|default({}) %}
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set moved = r.moved_mm|default(0)|float %}
    {% set hit = r.triggered|default(0)|int %}
    {% set ret = printer.save_variables.variables["t%d_retracted" % t]|default(0)|float %}
    {% if moved > 0.01 %}
        # back to where it was, cold moves allowed
        _TC_LATCH_MOVE E={"%.3f"|format(-moved)} F=120 I={c.run_current}
        M400
    {% endif %}
    {% if hit %}
        RESPOND MSG="INDX > T{t}: the filament met its plug after {'%.2f'|format(moved)} mm (recorded retraction {'%.1f'|format(ret)} mm, so the tip sits {'%.2f'|format(ret - moved)} mm {'lower' if ret - moved > 0 else 'higher'} than the bookkeeping says); pulled back the same"
    {% else %}
        RESPOND MSG="INDX > T{t}: pushed {'%.2f'|format(moved)} mm and the load cell felt no plug (the nozzle may be open: no plug, or the tip is further up than {'%.1f'|format(params.DIST|float)} mm); pulled back the same"
    {% endif %}
    {% if "indx_clog" in printer %}
        INDX_SUPPORT_LOG TIP_GAP=1 TOOL={t} GAP={"%.3f"|format(moved)} HIT={hit} RETRACTED={"%.2f"|format(ret)} TEMP={"%.0f"|format(printer[printer.toolhead.extruder].temperature|float)}
    {% endif %}

[gcode_macro _INDX_LATCH_HOME_OPEN]
description: Inner - the stop was found: drive to the open position; not found: the latch stays unknown and the next pickup homes it in the dock first (it stops there if it finds no stop again)
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set r = printer.tmc_sg_log %}
    {% set hit = r.triggered|default(0)|int and r.trigger_mm is not none %}
    SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=stop_mm VALUE={r.trigger_mm|abs if hit else -1.0}
    {% set expect = params.EXPECT|default(c.latch_home_expect_mm|default(0.65))|float %}
    {% set band = c.latch_home_band_mm|default(1.35)|float %}
    {% set unknown = params.UNKNOWN|default(0)|int %}
    {% set travel = c.latch_travel_mm|default(13.4)|float %}
    {% if hit and unknown and r.trigger_mm|float|abs > travel + 0.5 %}
        # from an unknown position the stop can be anywhere within the latch
        # travel; beyond it the gear is out of mesh or the stall was false
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=out_of_band VALUE=1
        RESPOND TYPE=error MSG="INDX ! Latch homing found a stop {'%.2f'|format(r.trigger_mm|float|abs)} mm into its search, beyond the latch travel ({'%.1f'|format(travel)} mm). Not trusted: the latch position is unknown; check the latch drive."
    {% elif hit and unknown %}
        {% if (r.trigger_mm|float|abs - expect)|abs > band %}
            RESPOND MSG="INDX > Latch homing from an unknown position found the stop {'%.2f'|format(r.trigger_mm|float|abs)} mm into its search: within the latch travel, a valid home (the {'%.2f'|format(expect)} +/- {'%.2f'|format(band)} band applies after a park)"
        {% endif %}
        _TC_LATCH_MOVE E={c.latch_open_from_stop} F={c.latch_fast_feedrate} I={c.run_current}
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=1
        {% if printer["gcode_macro _TOOLCHANGE_VARS"].toolhead_state|int != 2 %}
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=2
            SAVE_VARIABLE VARIABLE=toolhead_state VALUE=2
        {% endif %}
    {% elif hit and (r.trigger_mm|float|abs - expect)|abs > band %}
        # Not the opening stop: not trusted, the latch stays unknown and the
        # next pickup homes it in the dock (stops if off again) [EL-TC-013]
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=out_of_band VALUE=1
        RESPOND TYPE=error MSG="INDX ! Latch homing found a stop {'%.2f'|format(r.trigger_mm|float|abs)} mm into its search, expected about {'%.2f'|format(expect)} (+/- {'%.2f'|format(band)}). Not trusted: the latch position is unknown."
    {% elif hit %}
        _TC_LATCH_MOVE E={c.latch_open_from_stop} F={c.latch_fast_feedrate} I={c.run_current}
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=1
        # the latch is open now, whatever was recorded before
        {% if printer["gcode_macro _TOOLCHANGE_VARS"].toolhead_state|int != 2 %}
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=2
            SAVE_VARIABLE VARIABLE=toolhead_state VALUE=2
        {% endif %}
    {% else %}
        RESPOND TYPE=error MSG="INDX: latch homing found no stop; the next pickup uses the standard lock"
    {% endif %}
    _TC_RESTORE_ROTATION_DIST

[gcode_macro _INDX_LATCH_LOCKED]
description: Inner - after a force lock: report where it stopped and set the retraction guard to the distance left to the release
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    # the force lock's result as _INDX_LOCK_PAST kept it, and where the latch
    # ended after that part (its own SG_HOME_E overwrote printer.tmc_sg_log)
    {% set lp = printer["gcode_macro _INDX_LOCK_PAST"] %}
    {% set r = {"triggered": lp.lock_triggered|int, "why": lp.lock_why|string} %}
    {% set pos = lp.end|float %}
    {% set clear = [c.latch_release_from_stop|float + 0.2 - pos, 0.0]|max %}
    # why reads "load cell <grams> g" when the force stopped it
    {% set fg = r.why.split(" ")[2]|float if r.triggered|int and r.why.startswith("load cell") else 0.0 %}
    # the clamp from the empty head: what the slow part saw plus what had
    # built before it (_INDX_LOCK_FORCE)
    {% set b = printer["gcode_macro _INDX_LOCK_FORCE"].built_g|float %}
    {% set fg = (fg - b) if fg < 0 else ((fg + b) if fg > 0 else 0.0) %}
    # A lock at its travel limit: the clamp it reached, for the log only (the
    # dock pushes on the tool; the seat check judges out of the dock) [EL-TC-053]
    {% set ns = namespace(at_limit=0.0, ok=r.triggered|int) %}
    {% if not r.triggered|int %}
        {% set s = printer["gcode_macro _INDX_LC_STORE"] %}
        {% set lc = printer.load_cell_probe|default({}) %}
        {% if s.empty_valid|int and lc.counts_per_gram|default(0)|float > 0 and lc.force_g is defined and lc.force_g is not none %}
            {% set cfgl = printer.configfile.settings.load_cell_probe %}
            {% set ref = cfgl.reference_tare_counts %}
            {% if ref is not number %}{% set ref = ref|sum %}{% endif %}
            {% set inv = -1.0 if cfgl.sensor_orientation|default("normal") == "inverted" else 1.0 %}
            {% set g = lc.force_g|float + inv * (lc.tare_counts|float - ref|float) / lc.counts_per_gram|float %}
            {% set ns.at_limit = g - s.empty_g|float %}
            {% set fg = ns.at_limit %}
        {% endif %}
    {% endif %}
    # Past the release the gear is out of mesh (the park opens fully and homes).
    # Short of it: no probing until it is past [EL-TC-050]
    _INDX_LOCK_MARK CLEAR={"%.3f"|format(clear)} POS={"%.3f"|format(pos) if pos < c.latch_release_from_stop|float else "-1.0"} FORCE={ns.ok} FORCE_G={fg} SHORT={1 if pos < c.latch_release_from_stop|float and clear > 0 else 0}
    RESPOND MSG="T{params.TOOL} locked at {'%.2f'|format(pos)} mm from the latch stop ({('clamp %+.0f g from the empty head' % fg) if fg else (r.why if r.triggered|int else 'spring force not reached, lock max')}{', at the travel limit (in the dock)' if not r.triggered|int else ''}); no retraction for the next {'%.2f'|format(clear)} mm"

#####################################################################
#  LATCH HOMING
#####################################################################
#
#  After a park the latch homes against its opening stop with StallGuard:
#  at the stop the reading drops out of its free-running band at once. The
#  stop is one reading under a threshold set from that band over the whole
#  homing range: INDX_CAL_LATCH measures it in three runs (without touching
#  the stop), sets the threshold 15 under the lowest reading (at most 100),
#  refuses when the band comes within 95, and checks it with three homings
#  from the open position before saving (latch_sg_stop). Until then the
#  default rule (100, two readings in a row) grinds but never stops early.
#  [EL-SET-037]
#
#####################################################################

[gcode_macro INDX_CAL_LATCH]
description: Calibrate latch homing: measure the free-running StallGuard band, set the stop threshold under it and check it with three homings. Needs: CONFIRM=1 (asks first), X/Y homed, docks tested. Moves: parks the tool on the head, then only the latch. Saves: latch_sg_stop, latch_sg_band
variable_band: []
variable_stops: []
variable_cand: 0
gcode:
    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
        {action_raise_error("INDX_CAL_LATCH: home X and Y first (G28). Nothing moved.")}
    {% endif %}
    {% if not params.CONFIRM|default(0)|int %}
        _INDX_PROMPT TITLE="Calibrate Latch Homing" TEXT="The tool on the head is parked, then only the latch moves: three runs toward its opening stop from 10 mm that stop short of it, then three homings against it to check the result." TEXT2="About 2 minutes. The bed must be clear for the park." B1="Start|INDX_CAL_LATCH CONFIRM=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT_END
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LATCH VARIABLE=band VALUE="[]"
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LATCH VARIABLE=stops VALUE="[]"
        {% if printer.save_variables.variables.active_tool|default(-1)|int >= 0 %}
            # every check, also in race mode
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=1
            PARK_TOOL
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=race_block VALUE=0
        {% elif not printer["gcode_macro _INDX_LATCH_HOME"].at_open|int %}
            _INDX_LATCH_HOME DIST=-15 UNKNOWN=1
        {% endif %}
        _INDX_CAL_LATCH_RUN
    {% endif %}

[gcode_macro _INDX_CAL_LATCH_RUN]
description: Inner - INDX_CAL_LATCH: the three band runs, then the threshold and its check
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% if not printer["gcode_macro _INDX_LATCH_HOME"].at_open|int %}
        {action_raise_error("INDX_CAL_LATCH: the latch is not at its open position (its homing found no stop). Nothing calibrated.")}
    {% endif %}
    _TC_SET_ROTATION_DIST
    {% for i in range(3) %}
        # from the open position out to 10 mm from the stop, then 7.5 mm back
        # toward it with the stop off: ends 0.5 mm short of the open position
        _TC_LATCH_MOVE E={10.0 - c.latch_open_from_stop|float} F=600 I={c.run_current}
        SG_HOME_E DIST=-7.5 SPEED=5 CURRENT=0.3 THRESH=0
        _INDX_CAL_LATCH_BAND
        _TC_LATCH_MOVE E={c.latch_open_from_stop|float - 2.5} F=300 I={c.run_current}
    {% endfor %}
    _INDX_CAL_LATCH_SET

[gcode_macro _INDX_CAL_LATCH_BAND]
description: Inner - INDX_CAL_LATCH: keep the band of the run just done
gcode:
    {% set r = printer.tmc_sg_log %}
    {% set b = printer["gcode_macro INDX_CAL_LATCH"].band + [[r.band_min|default(0)|int, r.band_mean|default(0)|float, r.band_n|default(0)|int]] %}
    SET_GCODE_VARIABLE MACRO=INDX_CAL_LATCH VARIABLE=band VALUE="{b}"

[gcode_macro _INDX_CAL_LATCH_SET]
description: Inner - INDX_CAL_LATCH: the threshold from the band, then three check homings
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set b = printer["gcode_macro INDX_CAL_LATCH"].band %}
    {% set lows = b|map(attribute=0)|list %}
    {% set n = b|map(attribute=2)|sum %}
    {% if b|length < 3 or n < 150 or lows|min < 95 %}
        # (an error raised while this renders would skip the restore)
        _TC_RESTORE_ROTATION_DIST
        _INDX_RAISE MSG="INDX_CAL_LATCH: the free-running band is too low or too short to set a threshold above the old one (lowest readings {lows|join(', ')}, {n} readings). Nothing saved; latch homing keeps its threshold."
    {% else %}
    {% set cand = [100, lows|min - 15]|min %}
    SET_GCODE_VARIABLE MACRO=INDX_CAL_LATCH VARIABLE=cand VALUE={cand}
    RESPOND MSG="INDX > latch: free-running band from {lows|min} (runs {lows|join(', ')}, means {b|map(attribute=1)|join(', ')}); checking threshold {cand} with three homings"
    {% for i in range(3) %}
        SG_HOME_E DIST=-4 SPEED=5 CURRENT=0.3 THRESH={cand} CONSEC=1
        _INDX_CAL_LATCH_STOP
        _TC_LATCH_MOVE E={c.latch_open_from_stop} F=300 I={c.run_current}
    {% endfor %}
    _TC_RESTORE_ROTATION_DIST
    _INDX_CAL_LATCH_RESULT
    {% endif %}

[gcode_macro _INDX_CAL_LATCH_STOP]
description: Inner - INDX_CAL_LATCH: keep where a check homing stopped (-1: no stop)
gcode:
    {% set r = printer.tmc_sg_log %}
    {% set s = printer["gcode_macro INDX_CAL_LATCH"].stops + [r.trigger_mm|float if r.triggered|int and r.trigger_mm is not none else -1.0] %}
    SET_GCODE_VARIABLE MACRO=INDX_CAL_LATCH VARIABLE=stops VALUE="{s}"

[gcode_macro _INDX_CAL_LATCH_RESULT]
description: Inner - INDX_CAL_LATCH: save the threshold when every check homing found the stop where it is
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set me = printer["gcode_macro INDX_CAL_LATCH"] %}
    {% set want = c.latch_open_from_stop|float %}
    # the stop is latch_open_from_stop away; the trigger comes a little after
    # it (detection), never well before (that would be free running)
    {% set good = me.stops|select("ge", want - 0.4)|select("le", want + 0.4)|list %}
    {% set low = (me.band|map(attribute=0)|list)|min %}
    {% if good|length == me.stops|length and me.stops|length == 3 %}
        SAVE_VARIABLE VARIABLE=latch_sg_stop VALUE={me.cand}
        SAVE_VARIABLE VARIABLE=latch_sg_band VALUE={low}
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=1
        # saved by itself (the three check homings are its check); in the guide the
        # lock force follows
        _INDX_CAL_SET KEY=autosaved VALUE='"Latch homing threshold {me.cand}"'
        _INDX_GUIDE_LATER
        RESPOND MSG="INDX ok Latch homing threshold {me.cand} (one reading) saved (band from {low}); the check homings found the stop at {me.stops|map('round', 2)|join(', ')} mm (expected {'%.2f'|format(want)})"
    {% else %}
        # the latch may not be where it is believed: home it with the old one
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=at_open VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_LATCH_HOME VARIABLE=race_open VALUE=0
        _INDX_LATCH_HOME DIST=-15 UNKNOWN=1
        RESPOND TYPE=error MSG="INDX ! Latch homing threshold {me.cand} not saved: the check homings stopped at {me.stops|map('round', 2)|join(', ')} mm, expected {'%.2f'|format(want)} (-1: no stop). Latch homing keeps its threshold."
    {% endif %}

#####################################################################
#  LOCK FORCE PER TOOL (and its health check)
#####################################################################
#
#  Each latch spring and tool clamps a little differently, so each tool gets
#  its own lock target and seat pass level. INDX_CAL_LOCK picks every tool up
#  ROUNDS= times (3) with the lock run to its travel limit, reading its clamp
#  in the dock and its seat out of it:
#    lock target  t<n>_lock_g = 85 % of its lowest clamp
#    pass level   t<n>_pass_g = 68 % of its lowest seat weight (at least
#                 latch_lock_pass_g), for a lock that ran to its travel limit
#    confirm      t<n>_confirm_g = 50 % of it (at least home_min_force_g),
#                 for a lock that reached its target
#  Starting values until beta data. Empty tools only: with filament the drive
#  gears push it into the tip. Also a health check: a clamp or seat that moved
#  over 15 % is flagged and asks before saving. [EL-SET-038]
#
#  The same run refines the load cell: with 3 or more tools the mean seat is
#  the latch spring force (as INDX_CAL_LOADCELL_REFINE ref_g) and counts per
#  gram are scaled to it on save, not after a weight calibration or within
#  noise; every saved gram value follows (_INDX_LC_SYNC). A tool whose seats
#  spread over seat_spread_pct of their mean stops the run with nothing
#  saved: a low seat would lower its pass level. [EL-SET-027]
#
#####################################################################

[gcode_macro INDX_CAL_LOCK]
description: Lock force per tool, also the health check: every EMPTY tool picked up ROUNDS= times (3), the clamp read (at the travel limit in the dock, or with pickup_close_after_peel the peak while closing out of the dock) and the seat with the latch fully closed; sets each tool's lock target (85 % of its clamp) and seat pass level (68 % of its seat weight), flags changes over 15 %, stops when a tool's seats spread over 20 %, saves by itself when nothing is flagged, else asks. With 3 or more tools it also refines the load cell from the seats (counts per gram, every saved gram value converted). Needs: CONFIRM=1 (asks first), homed, docks tested, all tools empty. Moves: tool changes. Saves: t<n>_lock_g, t<n>_pass_g, t<n>_confirm_g, t<n>_lock_clamp_g, t<n>_seat_g (and t<n>_close_peak_g after the peel), the tool library's copy with the date, counts per gram (live, SAVE_CONFIG keeps it)
variable_samples: []
variable_pending: {}
# the refined counts per gram waiting for the save (0: none)
variable_refine: 0.0
# a tool's seats may spread this much of their mean (see above)
variable_seat_spread_pct: 20.0
variable_seat_sd_frac: 0.03
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set n = tp.tool_count|int %}
    {% set rounds = params.ROUNDS|default(3)|int %}
    {% set ns = namespace(loaded=[]) %}
    {% for i in range(n) if i not in tp.no_heat_tools|default([]) %}
        {% if svv["t%d_material" % i]|default("")|string or svv["t%d_fil_density" % i]|default(0)|float > 0 %}{% set ns.loaded = ns.loaded + ["T%d" % i] %}{% endif %}
    {% endfor %}
    {% if ns.loaded %}
        {action_raise_error("INDX_CAL_LOCK: every tool must be empty; %s %s filament recorded (filament changes the lock force). Unload first. Nothing moved." % (ns.loaded|join(", "), "has" if ns.loaded|length == 1 else "have"))}
    {% elif rounds < 1 or rounds > 5 %}
        {action_raise_error("INDX_CAL_LOCK: ROUNDS= 1 to 5.")}
    {% endif %}
    {% if not params.CONFIRM|default(0)|int %}
        _INDX_PROMPT TITLE="Lock Force per Tool" TEXT="Every tool is picked up {rounds} times: its clamp is read with the latch at its travel limit in the dock, its seat weight with the latch fully closed out of it. That sets its lock target and seat check level; changes over 15 % since the last run are flagged." TEXT2="All tools must be empty: no filament in any of them. The bed must be clear." TEXT3="About {(n * rounds * 0.25)|round(0)|int} minutes. Nothing is saved until you press Save. It measures at the current tool change speed and acceleration: run it again after raising max_velocity, max_accel or the speed mode." B1="All tools are empty: start|INDX_CAL_LOCK ROUNDS={rounds} CONFIRM=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_GATE NEEDS=lc,homed,empty,docks STEP="Lock force per tool" AGAIN=INDX_CAL_LOCK~CONFIRM=1 AUTO=1
        _INDX_PROMPT_END
        _INDX_RUNNING STEP="Lock force per tool"
        {% if "gcode_macro _INDX_PROGRESS" in printer %}_INDX_PROGRESS START=1 STEP="Lock force per tool" TOTAL={n * rounds} EST=20{% endif %}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=samples VALUE="[]"
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=refine VALUE=0
        # a tool already on the head would skip its first pickup
        {% if svv.active_tool|default(-1)|int >= 0 %}
            PARK_TOOL
        {% endif %}
        # every lock to the travel limit, taken by the seat check when the
        # weight confirms it (both count down, any failure clears them)
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=cal_left VALUE={n * rounds}
        SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=allow_short VALUE={n * rounds}
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=full_left VALUE={n * rounds}
        {% for r in range(rounds) %}
            {% for i in range(n) %}
                _INDX_CHANGE_TOOL TOOL={i}
                _INDX_CAL_LOCK_RECORD TOOL={i}
                {% if "gcode_macro _INDX_PROGRESS" in printer %}_INDX_PROGRESS ITEM=1 PART="T{i} round {r + 1}/{rounds}"{% endif %}
            {% endfor %}
        {% endfor %}
        PARK_TOOL
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_FORCE VARIABLE=cal_left VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_SEAT_CHECK VARIABLE=allow_short VALUE=0
        SET_GCODE_VARIABLE MACRO=_INDX_LOCK_PAST VARIABLE=full_left VALUE=0
        _INDX_RUNNING STEP=none
        _INDX_CAL_LOCK_RESULT
    {% endif %}

[gcode_macro _INDX_CAL_LOCK_RECORD]
description: Inner - INDX_CAL_LOCK: the clamp at the travel limit (in the dock) and the seat weight (out of it) of the pickup just done
gcode:
    {% set clamp = printer["gcode_macro _INDX_LOCK_MARK"].lock_force_g|float|abs %}
    {% set seat = printer["gcode_macro _INDX_SEAT_CHECK"].force_g|float|abs %}
    {% set cur = printer["gcode_macro INDX_CAL_LOCK"].samples %}
    # after the peel: the clamp is the peak while closing out of the dock [EL-SET-039]
    {% set out = printer["gcode_macro _INDX_CLOSE"].cal_now|int if "gcode_macro _INDX_CLOSE" in printer else 0 %}
    SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=samples VALUE="{cur + [[params.TOOL|int, clamp|round(1), seat|round(1), out]]}"
    RESPOND MSG="INDX > lock force: T{params.TOOL} clamps {clamp|round(0)|int} g {'closing out of the dock' if out else 'in the dock'}, seats at {seat|round(0)|int} g"

[gcode_macro _INDX_CAL_LOCK_RESULT]
description: Inner - INDX_CAL_LOCK: per tool target and pass level, changes against the last calibration, the seat spread check and the load cell refinement from the seats; saves by itself when every check passes, else a dialog
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set me = printer["gcode_macro INDX_CAL_LOCK"] %}
    {% set s = me.samples %}
    {% set floor = printer["gcode_macro _INDX_CONSTANTS"].latch_lock_pass_g|default(710)|float %}
    {% set lim = me.seat_spread_pct|default(20)|float %}
    {% set ns = namespace(lines=[], rows=[], flags=[], pend={}, nb="", means=[], nread=0, wide=[], wdet=[]) %}
    {% for t in range(printer["gcode_macro TOOL_POSITIONS"].tool_count|int) %}
        {% set cl = s|selectattr(0, "equalto", t)|map(attribute=1)|list %}
        {% set se = s|selectattr(0, "equalto", t)|map(attribute=2)|list %}
        {% if cl and se %}
            {% set c0, s0 = cl|min, se|min %}
            {% set tgt, pas = (0.85 * c0)|round(0), [0.68 * s0, floor]|max|round(0) %}
            {% set oc = svv["t%d_lock_clamp_g" % t]|default(none) %}
            {% set os = svv["t%d_seat_g" % t]|default(none) %}
            {% set dc = ((c0 - oc|float) / oc|float * 100.0) if oc else none %}
            {% set ds = ((s0 - os|float) / os|float * 100.0) if os else none %}
            {% set flag = (dc is not none and dc|abs > 15.0) or (ds is not none and ds|abs > 15.0) %}
            {% if flag %}{% set ns.flags = ns.flags + ["T%d" % t] %}{% endif %}
            # the seats of one tool must agree (see the header)
            {% set sm = (se|sum) / se|length %}
            {% set sp = ((se|max - se|min) / sm * 100.0) if sm > 0 else 0.0 %}
            {% if se|length >= 2 and sp > lim %}
                {% set ns.wide = ns.wide + ["T%d" % t] %}
                {% set ns.wdet = ns.wdet + ["T%d seats %d to %d g over %d pickups, %.0f %% of its mean" % (t, se|min, se|max, se|length, sp)] %}
            {% endif %}
            {% set ns.means = ns.means + [sm] %}
            {% set ns.nread = ns.nread + se|length %}
            {% set ns.lines = ns.lines + ["T%d clamp %d g (%d..%d), seat %d g (%d..%d): target %d g, pass %d g%s%s" % (t, c0, cl|min, cl|max, s0, se|min, se|max, tgt, pas, (", was clamp %d (%+.0f %%), seat %d (%+.0f %%)" % (oc|float, dc, os|float, ds)) if dc is not none and ds is not none else ", first calibration", " CHANGED" if flag else "")] %}
            # the dialog: one short line per tool, the detail is in the console
            {% if dc is not none and ds is not none %}
                {% set ns.rows = ns.rows + ["T%d: clamp %d g (%+.0f %%), seat %d g (%+.0f %%)%s" % (t, c0, dc, s0, ds, ", changed" if flag else "")] %}
            {% else %}
                {% set ns.rows = ns.rows + ["T%d: clamp %d g, seat %d g (first calibration)" % (t, c0, s0)] %}
            {% endif %}
            # all of this tool's pickups closed after the peel: the clamp is
            # also its close peak (the 75 % seat criterion) [EL-SET-039]
            {% set outs = s|selectattr(0, "equalto", t)|map(attribute=3)|list %}
            {% set _ = ns.pend.update({t|string: [tgt, pas, c0|round(0), s0|round(0), (c0|round(0)) if outs and outs|min|int == 1 else none]}) %}
        {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=pending VALUE="{ns.pend}"
    RESPOND MSG="INDX > Lock force per tool: {ns.lines|join('; ')}"
    # The load cell from the seats: the mean of the tools' mean seats is the
    # latch spring force (ref_g), as INDX_CAL_LOADCELL_REFINE takes it
    {% set ref_g = printer["gcode_macro INDX_CAL_LOADCELL_REFINE"].ref_g|float %}
    {% set cpg = printer.load_cell_probe.counts_per_gram|default(0)|float %}
    {% set rf = namespace(new=0.0, say="", far=false, f=1.0, mean=0.0) %}
    {% if ns.means|length < 3 %}
        {% set rf.say = "fewer than 3 tools, the load cell is not refined from the seats" %}
    {% elif cpg > 0 %}
        {% set rf.mean = (ns.means|sum) / ns.means|length %}
        {% set rf.f = rf.mean / ref_g %}
        # within this the change is noise: twice the standard error of the
        # mean of the seats read
        {% set dead = 2.0 * me.seat_sd_frac|default(0.03)|float / (ns.nread ** 0.5) %}
        {% set head = "mean seat of %d tools %.0f g against %.0f g, x%.4f" % (ns.means|length, rf.mean, ref_g, rf.f) %}
        {% if svv.lc_cpg_src|default("")|string == "weight" %}
            {% set rf.say = head ~ ": the load cell is calibrated with a weight, which is more exact, so it is kept" %}
        {% elif (rf.f - 1.0)|abs > 0.3 %}
            {% set rf.far = true %}
            {% set rf.say = head ~ ": more than 30 % off, too far to refine" %}
        {% elif (rf.f - 1.0)|abs < dead %}
            {% set rf.say = head ~ (": within the noise of %d seats (%.1f %%), counts per gram stays %.4f" % (ns.nread, dead * 100.0, cpg)) %}
        {% else %}
            {% set rf.new = cpg * rf.f %}
            {% set rf.say = head ~ (": counts per gram %.4f to %.4f with the save, every saved gram value follows" % (cpg, rf.new)) %}
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=refine VALUE={"%.5f"|format(rf.new)}
    {% if rf.say %}
        RESPOND MSG="INDX > Load cell from the seats: {rf.say}"
    {% endif %}
    {% set after = s|map(attribute=3)|select|list|length > 0 if s and s[0]|length > 3 else false %}
    {% set head = ("The lowest clamp (peak while closing out of the dock, after the peel) and seat per tool, against the last calibration. A last calibration made in the dock reads differently: a change there is the new method, not the tool." if after else "The lowest clamp (in the dock) and seat (out of it) per tool, against the last calibration:") %}
    {% set how = "Saving sets the lock target (85 % of the clamp) and the seat check levels of each tool (68 % of the seat for a lock that ran to its travel limit, 50 % when the lock reached its target)" ~ ((", and refines the load cell from the seats (x%.3f, every saved gram value follows)" % rf.f) if rf.new > 0 else "") ~ ". Ranges and targets are in the console." %}
    {% if ns.wide %}
        # a failed check: nothing is saved, the dialog names the tools
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=refine VALUE=0
        RESPOND TYPE=error MSG="INDX ! Lock force per tool: not saved, the seats of {ns.wide|join(', ')} spread over {lim|round(0)|int} %: {ns.wdet|join('. ')}"
        _INDX_PROMPT TITLE="Uneven Seat: {ns.wide|join(', ')}" TEXT="{ns.wdet|join('. ')}. More than {lim|round(0)|int} % apart: one pickup may not have seated fully, or the tool pin, the latch spring or the dock needs a look." TEXT2="Nothing is saved, neither the lock force nor the load cell. Check {ns.wide|join(', ')}: seated straight, clean pins and balls, the dock not pushing on it. Then measure again." B1="Checked: measure again|_INDX_DO CMD=INDX_CAL_LOCK~CONFIRM=1|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% elif rf.far %}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=refine VALUE=0
        RESPOND TYPE=error MSG="INDX ! Lock force per tool: not saved, the tools seat at {rf.mean|round(0)|int} g on average, {((rf.f - 1) * 100)|round(0)|int} % from {ref_g|round(0)|int} g: the load cell calibration is off."
        _INDX_PROMPT TITLE="Load Cell: Too Far Off" TEXT="The tools seat at {rf.mean|round(0)|int} g on average, {((rf.f - 1) * 100)|round(0)|int} % from the {ref_g|round(0)|int} g of the latch spring. That is more than a refinement should change." TEXT2="Nothing is saved. The latch springs of a set can differ this much: calibrate the load cell again with another empty tool from its dock, or with a known weight (INDX_CAL_LOADCELL_WEIGHT, the most exact), check that every tool is empty and seats well, then measure the lock force again." B1="Calibrate the load cell|_INDX_DO CMD=INDX_CAL_LOADCELL|primary" F1="Close|_INDX_PROMPT_END|secondary"
    {% elif ns.flags %}
        # A big change can also mean another tool now sits in that dock
        {% for f in ns.flags[:4] %}
            {% set ns.nb = ns.nb ~ ' B%d="%s is a new tool|_INDX_CAL_LOCK_ASK WHAT=new TOOL=%s|secondary"' % (loop.index + 1, f, f[1:]) %}
        {% endfor %}
        _INDX_PROMPT TITLE="Lock Force per Tool" TEXT="{head}" LINES="{ns.rows|join('^')}" TEXT2="Changed more than 15 %: {ns.flags|join(', ')}. Either a different tool is in that dock now, or something changed on it: a tired latch spring, a damaged tool pin or a moved dock. Check before saving." TEXT3="{how}" B1="Same tools: save|_INDX_CAL_LOCK_ASK WHAT=same|primary"{ns.nb} F1="Discard|_INDX_PROMPT_END|secondary"
    {% else %}
        # the checks passed: saved by itself; in the guide the tool offsets follow
        # [EL-SET-007]
        RESPOND MSG="INDX > Lock force per tool: no change over 15 %, every tool's seats within {lim|round(0)|int} %, saved by itself."
        _INDX_CAL_LOCK_SAVE NEXT=1 AUTO=1
    {% endif %}

[gcode_macro _INDX_CAL_LOCK_SAVE]
description: Inner - INDX_CAL_LOCK: save the per tool lock target and pass level (TOOL= only that tool). NEXT=1: then offer the next setup step; CHAIN=1: go straight on to Z, then XY (INDX_CAL_TOOLS EMPTY=1)
gcode:
    {% set p = printer["gcode_macro INDX_CAL_LOCK"].pending %}
    {% set only = params.TOOL|default("")|string %}
    {% set ns = namespace(names=[]) %}
    _INDX_PROMPT_END
    {% for t, v in p.items() if not only or t == only %}
        SAVE_VARIABLE VARIABLE=t{t}_lock_g VALUE={v[0]}
        SAVE_VARIABLE VARIABLE=t{t}_pass_g VALUE={v[1]}
        SAVE_VARIABLE VARIABLE=t{t}_lock_clamp_g VALUE={v[2]}
        SAVE_VARIABLE VARIABLE=t{t}_seat_g VALUE={v[3]}
        {% if v|length > 4 and v[4] is not none %}
            SAVE_VARIABLE VARIABLE=t{t}_close_peak_g VALUE={v[4]}
        {% endif %}
        # the seat check's level when the lock reached its target
        SAVE_VARIABLE VARIABLE=t{t}_confirm_g VALUE={(0.50 * v[3]|float)|round(0)}
        # and the same values with the tool in the library, dated
        _INDX_TOOL_CAL_OUT TOOL={t} KEYS=lock_g,pass_g,lock_clamp_g,seat_g,confirm_g{',close_peak_g' if v|length > 4 and v[4] is not none else ''}
        {% set ns.names = ns.names + ["T" ~ t] %}
    {% endfor %}
    {% if ns.names %}
        _INDX_CAL_MOTION_SAVE VARIABLE=lock_motion
    {% endif %}
    {% if ns.names and not only %}
        # the load cell refined from this run's seats, when it was (every
        # saved gram value, the ones just saved included, follows it)
        _INDX_CAL_LOCK_REFINE
    {% endif %}
    {% set hc = "gcode_macro INDX_HOT_CLEAN" in printer %}
    {% if ns.names and not only %}
        # the lock force measured again: the hot clean of the tips follows
        # again (the setup must not carry plastic on a tip) [EL-SET-004]
        _INDX_CAL_SET KEY=cleaned VALUE=0
    {% endif %}
    RESPOND MSG="INDX ok Lock force saved for {ns.names|join(', ') if ns.names else 'no tool'}"
    {% if params.AUTO|default(0)|int %}
        _INDX_CAL_SET KEY=autosaved VALUE='"Lock force per tool ({ns.names|join(', ')})"'
    {% endif %}
    {% if only %}
        # one tool (a new tool registered by _INDX_CAL_LOCK_NEW): its own
        # dialog follows, the guide does not run on under it
    {% elif printer["gcode_macro _INDX_GUIDE"].on|int %}
        # the guide runs on: Z, then XY (every tool empty) or whatever is next
        _INDX_GUIDE_LATER
    {% elif params.CHAIN|default(0)|int %}
        # straight on to Z, then XY: INDX_CAL_TOOLS EMPTY=1 refuses by itself
        # if filament is recorded anywhere
        RESPOND MSG="INDX > Setup: on to the tool offsets, Z then XY, with the tools empty and cold"
        INDX_CAL_TOOLS EMPTY=1 CONFIRM=1
    {% elif params.NEXT|default(0)|int %}
        # as after "Tool changes tested": the setup leads on
        _INDX_PROMPT TITLE="Lock Force Saved" TEXT="Saved for {ns.names|join(', ') if ns.names else 'no tool'}. INDX uses it from the next pickup, no restart." TEXT2="In the setup {'the hot clean of every tool comes next (plastic on a tip would shift every tap), then ' if hc else ''}the tool Z offsets{' come next' if not hc else ''}, then XY, with the tools still empty and cold." B1="{'Hot clean every tool now|_INDX_DO CMD=INDX_CAL_CLEAN~CONFIRM=1|primary' if hc else 'Z, then XY now|_INDX_DO CMD=INDX_CAL_TOOLS~EMPTY=1~CONFIRM=1|primary'}" B2="Next setup step|_INDX_DO CMD=INDX_SETUP|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_CAL_LOCK_REFINE]
description: Inner - INDX_CAL_LOCK saved: apply the counts per gram refined from that run's seats (refine, 0 when none), then every saved gram value follows (_INDX_LC_SYNC: old/new, the trigger offset marked). Live; the setup's final SAVE_CONFIG writes it
gcode:
    {% set new = printer["gcode_macro INDX_CAL_LOCK"].refine|float %}
    {% if new > 0 and "indx_clog" in printer %}
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=refine VALUE=0
        # saved: the result is not waiting any more
        SET_GCODE_VARIABLE MACRO=INDX_CAL_LOCK VARIABLE=pending VALUE="{ {} }"
        INDX_LC_SET_CPG CPG={"%.5f"|format(new)} WHY=lock SRC=seats
    {% endif %}

[gcode_macro _INDX_CAL_LOCK_ASK]
description: Inner - INDX_CAL_LOCK found a change over 15 %: ask before saving (WHAT=same: keep the tools, save the new values; WHAT=new TOOL=n: register a new tool in dock n)
# Nothing is saved without this second answer: a broken tool pin, a tired
# latch spring or a moved dock show the same way as a new tool, and saving
# would make the weaker values the reference the seat check passes against.
gcode:
    {% set warn = "A clamp or seat weight this different can also mean something is broken: a broken tool pin (the pin the latch presses on), a tired latch spring, a moved or loose dock, a damaged tool. Saving makes the new values the reference, and the seat check then accepts them." %}
    {% if params.WHAT == "new" %}
        {% set t = params.TOOL|int %}
        _INDX_PROMPT TITLE="Is a New Tool in T{t}?" TEXT="Only if you put a different tool into the T{t} dock: it is registered as a new tool (a new name, the old tool stored with its totals and offsets), its lock force is saved and its Z and XY offsets are marked for redo." TEXT2="{warn} If you did not swap the tool, check T{t} instead." B1="Yes, a new tool: register and save|_INDX_CAL_LOCK_NEW TOOL={t}|primary" F1="No, do not save|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT TITLE="Save the Changed Values?" TEXT="The tools are the same ones, and their new lock force is saved as it was measured." TEXT2="{warn} Check the changed tools first." B1="Checked: save|_INDX_CAL_LOCK_SAVE NEXT=1|warning" F1="No, do not save|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_CAL_LOCK_NEW]
description: Inner - INDX_CAL_LOCK found a big change on TOOL=n and the user says it is a new tool: register it (INDX_TOOL_NEW: a new name, the old tool stored, Z and XY marked for redo), save its lock force, then offer naming and its calibration
gcode:
    {% set t = params.TOOL|int %}
    _INDX_PROMPT_END
    INDX_TOOL_NEW TOOL={t} PROMPT=0
    _INDX_CAL_LOCK_SAVE TOOL={t}
    _INDX_CAL_LOCK_NEW_NEXT TOOL={t}

[gcode_macro _INDX_CAL_LOCK_NEW_NEXT]
description: Inner - the next steps for a new tool found by INDX_CAL_LOCK
gcode:
    # the new tool only, against the reference [EL-CAL-021]
    _INDX_TOOL_NEW_CAL TOOL={params.TOOL|int} NEW=1

[gcode_macro _INDX_MISLOAD_ASK]
description: Inner - close after the peel: a load pickup recorded a misload suspect (_INDX_MISLOAD_CHECK) and then failed its seat check: ask what happened (loading filament, or something wrong with the pickup). Shown by _PICKUP_SEAT_FAIL before its stop, outside a print. Moves: nothing
# Only the question next to the stop; renders after _PICKUP_SEAT_FAIL recorded
# the head, so it reads the state the stop leaves.
gcode:
    {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
    {% set t = params.TOOL|int %}
    {% set ms = printer["gcode_macro _INDX_MISLOAD_CHECK"] %}
    {% set on = printer.save_variables.variables.active_tool|default(-1)|int == t %}
    {% set f = printer["gcode_macro _INDX_SEAT_CHECK"].force_g|float|round(0)|int %}
    {% if on %}
        {% set state = "Now: T%d may be on the head, not properly seated. It stays recorded on the head, not confirmed (load cell %d g against the empty head), with the latch closed on it as far as the lock went. The heater is off and nothing moves until you choose." % (t, f) %}
    {% else %}
        {% set state = "Now: the head is recorded empty and T%d as in its dock (load cell %d g against the empty head), and the pickup may have pulled T%d partly out of its dock. The latch is %s. The heater is off and nothing moves until you choose." % (t, f, t, "open" if printer["gcode_macro _INDX_LATCH_HOME"].at_open|int else "not homed (the next pickup homes it in the dock first)") %}
    {% endif %}
    _INDX_PROMPT TITLE="T{t}: Pickup Stopped" TEXT="T{t} did not seat. Before the clamp, this pickup pushed {ms.suspect_g|float|round(0)|int} g against the latch (over {c.misload_push_g|default(87)|float|round(0)|int} g): filament pushed into the gears of a tool in its dock does that." TEXT2="{state}" TEXT3="What happened?" B1="I was loading filament into T{t}|_INDX_DO CMD=_INDX_MISLOAD_LOAD~TOOL={t}|primary" B2="Something was wrong with the pickup|_INDX_DO CMD=_INDX_MISLOAD_PICKUP~TOOL={t}|secondary" F1="Close|_INDX_PROMPT_END|secondary"

[gcode_macro _INDX_MISLOAD_LOAD]
description: Inner - _INDX_MISLOAD_ASK, "I was loading filament": a misload suspect that did not seat is a fault, so there are two ways on only: load T<n> properly (filament out, material, color, INDX_LOAD) or T<n> back into (or left in) its dock. Both mark T<n> (filament out before its next use). Moves: nothing until a button
# Never "keep the filament in and carry on" [EL-TC-009]. A tool on the head goes
# back by hand: a park could drive a loose tool into its dock [EL-TC-048]
gcode:
    {% set t = params.TOOL|int %}
    {% set on = printer.save_variables.variables.active_tool|default(-1)|int == t %}
    {% set mark = "Either way T%d is marked: pull the filament out of it before its next use." % t %}
    {% if on %}
        _INDX_PROMPT TITLE="T{t} Misload, on the Head" TEXT="T{t} may be on the head, not properly seated, with filament stuck in its gears. That is a fault: T{t} is not used like this. The heater is off." TEXT2="Load filament into T{t}: INDX opens the latch first (hold T{t}, it drops into your hand). Pull the stuck filament back out of T{t} and put T{t} in its dock by hand. Then pick the material and the color: INDX picks T{t} up with the filament out and asks for the filament once T{t} is on the head." TEXT3="Put T{t} back in its dock: INDX opens the latch (hold T{t}) and you put T{t} in its dock by hand. The seat check failed, so INDX does not park it itself." TEXT4="{mark}" B1="Load filament into T{t}|_INDX_DO CMD=_INDX_MISLOAD_MARK~TOOL={t}~DO=load|primary" B2="Put T{t} back in its dock|_INDX_DO CMD=_INDX_MISLOAD_MARK~TOOL={t}~DO=dock|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT TITLE="T{t} Misload, in Its Dock" TEXT="The head is empty and T{t} is in its dock with filament stuck in its gears (the pickup may have pulled T{t} partly out). That is a fault: T{t} is not used like this. The heater is off." TEXT2="Load filament into T{t}: first pull the stuck filament back out of T{t} by hand, and check T{t} sits straight and fully in its dock (push it back in by hand if needed). Then pick the material and the color: INDX picks T{t} up with the filament out and asks for the filament once T{t} is on the head." TEXT3="Leave T{t} in its dock: nothing moves." TEXT4="{mark}" B1="Filament is out: load filament into T{t}|_INDX_DO CMD=_INDX_MISLOAD_MARK~TOOL={t}~DO=load|primary" B2="Leave T{t} in its dock|_INDX_DO CMD=_INDX_MISLOAD_MARK~TOOL={t}~DO=leave|secondary" F1="Close|_INDX_PROMPT_END|secondary"
    {% endif %}

[gcode_macro _INDX_MISLOAD_PICKUP]
description: Inner - _INDX_MISLOAD_ASK, "Something was wrong with the pickup": the seat check stop's own advice for the state it left (as _PICKUP_SEAT_FAIL prints it), with its commands as buttons. Moves: nothing until a button
gcode:
    {% set t = params.TOOL|int %}
    {% set on = printer.save_variables.variables.active_tool|default(-1)|int == t %}
    {% if on %}
        _INDX_PROMPT TITLE="T{t}: Pickup Failed" TEXT="T{t} may be on the head, badly seated. It stays recorded on the head. The console shows what the seat check read." TEXT2="Check the head: if T{t} is seated, carry on (record it). If the head is empty, open the latch." B1="T{t} is seated: record it|_INDX_DO CMD=INDX_SEAT_TOOL_BY_HAND~TOOL={t}~LOCKED=1|primary" B2="Head is empty: open the latch|_INDX_DO CMD=INDX_RELEASE_TOOL_BY_HAND|warning" F1="Close|_INDX_PROMPT_END|secondary"
    {% else %}
        _INDX_PROMPT TITLE="T{t}: Pickup Failed" TEXT="The pickup may have pulled T{t} partly out of its dock. Check the T{t} dock and the head before anything moves. The console shows what the seat check read." TEXT2="Leave T{t} in its dock and the head empty, then try again." F1="Close|_INDX_PROMPT_END|secondary"
    {% endif %}
