#####################################################################
#  INDX Suite: remap and spool join (klipper_extras/indx_remap.py)
#
#  Macros that only indx_remap.py runs. Linked by install.sh (the INDX
#  Suite) only and included by indx_includes.cfg's
#  [include indx_suite*.cfg]; an INDX Macros install does not have them.
#  INDX_PRINT_START runs the remap only when this file is there.
#  [EL-PRI-047] [EL-PRI-048]
#####################################################################

[gcode_macro _INDX_REMAP_START]
description: Inner - INDX_PRINT_START after the remap plan: the print start as before, or (a proposal) the tool mapping dialog with the print paused before anything heats or moves
gcode:
    {% if printer.indx_remap.pending %}
        _INDX_REMAP_HOLD
    {% else %}
        _INDX_PRINT_START_RUN {rawparams}
    {% endif %}

[gcode_macro _INDX_REMAP_HOLD]
description: Inner - the remap proposal: the dialog (use the mapping, print as numbered, cancel), then the base PAUSE. Nothing has heated or moved
gcode:
    {% set r = printer.indx_remap %}
    {% set pl = r.plan %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% set missing = pl.state == "missing" %}
    {% set nodock = pl.tools|select("ge", n)|list %}
    {% if missing %}
        {% set text = "No loaded tool fits every filament this file asks for. Load the missing filament and start the print again, or print as numbered and the print check decides." %}
    {% else %}
        # why it opened first ("T0 is empty"), then the rows
        {% set rs = pl.reason|default([]) %}
        {% set text = ((rs|join(", ") ~ ". ") if rs else "The loaded tools fit this file better in another order. ") ~ "INDX can print the file with these tools:" %}
    {% endif %}
    _INDX_PROMPT TITLE="{'Tools Missing for This Print' if missing else 'Tools for This Print?'}" TEXT="{text}" LINES="{pl.lines|join('^')}" TEXT2="Nothing has heated or moved yet: the print waits paused for your answer." B1="{'' if missing else 'Print with these tools|_INDX_REMAP_GO CHOICE=map|primary'}" B2="{'' if nodock else 'Print as numbered|_INDX_REMAP_GO CHOICE=numbered|secondary'}" F1="Cancel the print|CANCEL_PRINT|error"
    _INDX_NOTE LEVEL=warn TITLE="{'Tools missing for this print' if missing else 'Tools for this print?'}" MSG="The print waits for the tool mapping dialog: {pl.lines|join(', ')|replace(';', ',')}"
    # The base pause (no park: nothing is homed), as PRIME_GRID's hold
    {% set pm = printer.configfile.settings["gcode_macro pause"] %}
    {pm.rename_existing if pm is defined and pm.rename_existing is defined else "PAUSE"}
    _INDX_PAUSE_STATES

[gcode_macro _INDX_REMAP_RESUME]
description: Inner - the tool mapping dialog was answered: resume the print where it paused (nothing has moved, so no move), then _INDX_REMAP_GO runs the print start
gcode:
    _INDX_PROMPT_END
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    _INDX_PAUSE_STATES
    {% set rm = printer.configfile.settings["gcode_macro resume"] %}
    {rm.rename_existing if rm is defined and rm.rename_existing is defined else "RESUME"}

[gcode_macro _INDX_REMAP_STOPPED]
description: Inner - the print start after the tool mapping dialog stopped: pause the print again, so the file does not go on without it
# pause_resume's own flag, not print_stats: right after the base RESUME the
# file reader has not started yet, so print_stats still says paused while the
# print is already resumed (a base PAUSE now stops the reader before its first
# line: Kalico's virtual_sdcard checks must_pause_work before the gcode lock)
gcode:
    {% if "pause_resume" in printer and not printer.pause_resume.is_paused %}
        {% set pm = printer.configfile.settings["gcode_macro pause"] %}
        {pm.rename_existing if pm is defined and pm.rename_existing is defined else "PAUSE"}
        _INDX_PAUSE_STATES
    {% endif %}
    M104 S0
    _INDX_NOTE LEVEL=stop TITLE="Print start stopped" MSG="The print start stopped after the tool mapping dialog (see the console). The print is paused: cancel it."

# The spool join [EL-PRI-048]: the tool on the head ran out and another tool
# holds the same filament (indx_remap.py picked it and moved the map). From
# the runout, between two lines of the print: retract, the change, back to
# the exact print point. The change is PRINT_TOOLCHANGE with the print's own
# checks (DOCK=1: NEXT is the dock; JOIN=1: no purge station, the slicer's
# bookkeeping kept, and a held pickup's redo is _INDX_SPOOL_JOIN_RUN, which
# goes back to the print point too). DERETRACT=0: the new tool is handed back
# full, the slicer goes on mid-line.
[gcode_macro _INDX_SPOOL_JOIN]
description: Inner - a spool ran out on the tool on the head: retract it, then change to the tool with the same filament and go back to the print point (_INDX_SPOOL_JOIN_RUN)
gcode:
    {% set j = printer.indx_remap.join %}
    {% if j %}
        RESPOND TYPE=error MSG="INDX ! T{j.from}'s spool ran out: spool join, T{j.to} (same filament) takes over at X{j.x} Y{j.y} Z{j.z}"
        # the tail's force drop is expected: no clog watch pause in the change
        {% if "indx_clog" in printer %}INDX_CLOG ACK={j.from}{% endif %}
        _INDX_RETRACT E={j.r} F=2100
        _INDX_SPOOL_JOIN_RUN
    {% endif %}

[gcode_macro _INDX_SPOOL_JOIN_RUN]
description: Inner - the spool join's tool change and the way back to the print point (also the redo after a held pickup)
gcode:
    {% set j = printer.indx_remap.join %}
    {% if j %}
        PRINT_TOOLCHANGE NEXT={j.to} DOCK=1 JOIN=1 TEMP={j.temp} RETRACT={j.r} PREV_RETRACT={j.r} TOWER=0 DERETRACT=0
        _INDX_SPOOL_JOIN_BACK
    {% endif %}

[gcode_macro _INDX_SPOOL_JOIN_BACK]
description: Inner - after the spool join's change: back to the print point (XY at the hop height, then Z), the print's G-code modes back. Not while a pickup holds (its redo comes back here)
gcode:
    {% set j = printer.indx_remap.join %}
    {% set held = printer["gcode_macro _PICKUP_SEAT_FAIL"].held|int %}
    {% if j and not held and printer.save_variables.variables.active_tool|default(-1)|int == j.to %}
        {% set cp = printer.configfile.settings.printer %}
        G90
        G1 X{j.x} Y{j.y} F{([cp.max_velocity|float, 200.0]|min * 60)|round(0)|int}
        G1 Z{j.z} F900
        {% if j.abse %}
            M82
            G92 E{j.e}
        {% else %}
            M83
        {% endif %}
        {% if not j.absc %}
            G91
        {% endif %}
        G1 F{j.f}
        # paused meanwhile (a pause in the change): RESUME comes back here,
        # not to where that pause saved the head
        {% if "pause_resume" in printer and printer.pause_resume.is_paused %}
            SAVE_GCODE_STATE NAME=PAUSE_STATE
        {% endif %}
        _INDX_REMAP_JOINED
    {% endif %}
